<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>전체 순위표 화면 시안</title>
<style>
  /* 전체 순위표 화면 시안(가짜 자료). 비유: 가게 문 열기 전에 메뉴판 견본을 벽에 붙여 보는 것 — 진짜 주문(서버)은 받지 않는다.
     맨 위 어두운 줄 = 시안용 조작 줄(여기만 일반 글씨). 그 아래 = 게임과 같은 기기(회색 몸통 · 검은 화면 128×96칸 · 키캡 둘).
     검은 화면 안은 검정과 흰색 두 가지만 쓴다 */
  @font-face {
    font-family: 'Galmuri11';
    src: url('https://cdn.jsdelivr.net/npm/galmuri/dist/Galmuri11.woff2') format('woff2');
    font-display: swap;
  }
  :root { --black: #000000; --white: #f2f2f2; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--black); color: var(--white);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    display: flex; flex-direction: column; height: 100vh; height: 100dvh;
    touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  /* ---- 시안용 조작 줄(몸통 밖) ---- */
  #ctl {
    flex: none; position: relative; z-index: 1; background: #1b1b1b; color: #dddddd; border-bottom: 1px solid #3a3a3a;
    font-size: 11px; line-height: 1.2; padding: 5px 6px 4px;
    display: flex; flex-wrap: wrap; gap: 3px 10px; align-items: center;
  }
  .grp { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; min-width: 0; }
  .grp > span { color: #9a9a9a; margin-right: 3px; white-space: nowrap; }
  .grp button {
    font: inherit; height: 22px; min-width: 24px; padding: 0 5px; margin: 0; cursor: pointer; white-space: nowrap;
    border: 1px solid #555555; background: #2a2a2a; color: #dddddd; border-radius: 3px;
  }
  .grp button.on { background: #f2f2f2; color: #000000; border-color: #f2f2f2; }
  .grp.off { opacity: 0.4; }
  #cap { flex-basis: 100%; color: #bbbbbb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; height: 14px; }
  /* 조작 줄 접기: 「시안 조작」 버튼 하나 + 지금 장면 한 줄만 남는다 */
  #ctlFold {
    font: inherit; height: 22px; padding: 0 6px; margin: 0; cursor: pointer; white-space: nowrap;
    border: 1px solid #777777; background: #3a3a3a; color: #ffffff; border-radius: 3px;
  }
  #ctl.fold .grp { display: none; }
  #ctl.fold #cap { flex: 1 1 0; min-width: 0; }

  /* ---- 기기(게임과 같은 생김새) ---- */
  main {
    flex: 1 1 auto; min-height: 0; width: 100%; padding: 0;
    display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr);
  }
  .stage { min-height: 0; min-width: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .device-e { position: relative; flex: none; line-height: 0; }
  .screen { position: absolute; display: block; image-rendering: pixelated; background: var(--black); border-radius: 2px; }
  .body-art { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  .grip { position: absolute; display: block; image-rendering: pixelated; pointer-events: none; }
  .corner-btn {
    position: absolute; top: 3px; padding: 0; margin: 0; border: 0; background: transparent;
    line-height: 0; cursor: pointer; touch-action: none; outline: none;
  }
  .corner-btn canvas { display: block; image-rendering: pixelated; }
  .key {
    position: absolute; padding: 0; margin: 0; border: 0; background: transparent;
    line-height: 0; cursor: pointer; touch-action: none; outline: none;
  }
  .key canvas { display: block; image-rendering: pixelated; }
  .ghost { position: absolute; left: 0; top: 0; width: 100%; height: 100%; color: transparent; overflow: hidden; white-space: nowrap; pointer-events: none; line-height: 1; }

  /* ---- 닉네임 입력: 검은 화면 자리 위에 겹쳐 띄우는 진짜 입력칸(폰 자판이 뜬다). --u = 화면 한 칸의 크기 ---- */
  .nick {
    position: absolute; display: none; margin: 0; padding: calc(var(--u) * 22) 0 0; line-height: 1;
    flex-direction: column; align-items: center; gap: calc(var(--u) * 2);
    color: var(--white); font-family: 'Galmuri11', "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: calc(var(--u) * 12); -webkit-font-smoothing: none; font-smooth: never;
  }
  .nick.show { display: flex; }
  .nick-guide, .nick-msg { height: calc(var(--u) * 12); white-space: nowrap; }
  .nick input {
    width: calc(var(--u) * 104); height: calc(var(--u) * 20); margin: 0; padding: 0 calc(var(--u) * 3);
    border: calc(var(--u) * 1) solid var(--white); border-radius: 0; outline: none; background: var(--black); color: var(--white);
    caret-color: var(--white); font: inherit; text-align: center; -webkit-appearance: none; appearance: none;
    user-select: text; -webkit-user-select: text;
  }
  .nick button {
    height: calc(var(--u) * 18); padding: 0 calc(var(--u) * 8); margin: 0; border: 0; border-radius: 0; cursor: pointer;
    background: var(--white); color: var(--black); font: inherit;
  }
  /* 「영문 · 숫자만」일 때 입력칸 글자: 웹 글꼴 없이 기기의 고정폭 글꼴(대문자) */
  .nick.eng input { font-family: Menlo, Consolas, "Courier New", monospace; font-weight: 700; text-transform: uppercase; letter-spacing: calc(var(--u) * 1); }
  .nick.eng { font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; font-weight: 700; }

  .nick-row { display: flex; gap: calc(var(--u) * 4); }
  .nick button.line { background: var(--black); color: var(--white); border: calc(var(--u) * 1) solid var(--white); padding: 0 calc(var(--u) * 4); }

  /* ---- 계정 창(내 계정 · 이어하기 코드 · 이어 가기 · 앱 안 브라우저 안내): 글이 길어 검은 화면에 못 넣는 것들.
     전체 순위표 「별도 창」과 같은 자리 · 같은 생김새(검은 바탕 · 흰 글씨 · 흰 테두리)로 아래에서 올라온다 ---- */
  .acct-wrap { position: absolute; overflow: hidden; pointer-events: none; border-radius: 2px; }
  .acct-wrap.open { pointer-events: auto; }
  .acct {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden;
    background: var(--black); color: var(--white); border: calc(var(--u) * 1) solid var(--white); padding: calc(var(--u) * 3);
    display: flex; flex-direction: column; gap: calc(var(--u) * 4);
    font-family: 'Galmuri11', "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: calc(var(--u) * 12); line-height: calc(var(--u) * 14); word-break: keep-all;
    -webkit-font-smoothing: none; font-smooth: never;
    transform: translateY(102%); transition: transform 0.2s steps(8);
  }
  .acct-wrap.open .acct { transform: none; }
  .acct-wrap.eng .acct { font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; font-weight: 700; }
  .acct p { margin: 0; }
  .acct-head { display: flex; justify-content: space-between; align-items: center; border-bottom: calc(var(--u) * 1) solid var(--white); padding-bottom: calc(var(--u) * 2); }
  .acct button {
    font: inherit; margin: 0; border-radius: 0; cursor: pointer; width: 100%; min-height: calc(var(--u) * 18); padding: calc(var(--u) * 1) calc(var(--u) * 2);
    background: var(--black); color: var(--white); border: calc(var(--u) * 1) solid var(--white);
  }
  .acct button.solid { background: var(--white); color: var(--black); }
  .acct button.x { width: calc(var(--u) * 16); min-height: calc(var(--u) * 14); padding: 0; border: 0; flex: none; }
  .acct .name { background: var(--white); color: var(--black); text-align: center; padding: calc(var(--u) * 2) 0; white-space: nowrap; overflow: hidden; }
  .acct .code { font-size: calc(var(--u) * 24); line-height: calc(var(--u) * 28); text-align: center; letter-spacing: calc(var(--u) * 2); white-space: nowrap; }
  .acct .msg { min-height: calc(var(--u) * 28); }
  .acct input {
    width: 100%; height: calc(var(--u) * 20); margin: 0; padding: 0 calc(var(--u) * 3);
    border: calc(var(--u) * 1) solid var(--white); border-radius: 0; outline: none; background: var(--black); color: var(--white);
    caret-color: var(--white); font: inherit; text-align: center; -webkit-appearance: none; appearance: none;
    user-select: text; -webkit-user-select: text;
  }
  .acct input::placeholder { color: #8a8a8a; }

  /* ---- 별도 창: 몸통 위로 아래에서 올라오는 검은 창(검은 화면 + 키캡 자리를 덮는다) ---- */
  .sheet-wrap { position: absolute; overflow: hidden; pointer-events: none; border-radius: 2px; }
  .sheet-wrap.open { pointer-events: auto; }
  .sheet { display: block; image-rendering: pixelated; background: var(--black); transform: translateY(102%); transition: transform 0.2s steps(8); touch-action: none; }
  .sheet-wrap.open .sheet { transform: none; }
</style>
</head>
<body>
<div id="ctl">
  <button id="ctlFold" type="button">시안 조작 ▾</button>
  <div class="grp" data-k="scene"><span>장면</span>
    <button id="sc1" data-v="1" title="닉네임 입력(처음)">①</button><button id="sc2" data-v="2" title="닉네임 거절">②</button><button id="sc3" data-v="3" title="결과 + 내 순위와 위 3명">③</button><button id="sc4" data-v="4" title="내가 3등 안">④</button><button id="sc5" data-v="5" title="전체 순위표">⑤</button><button id="sc6" data-v="6" title="불러오는 중">⑥</button><button id="sc7" data-v="7" title="연결 실패">⑦</button><button id="sc8" data-v="8" title="내 계정 창">⑧</button><button id="sc9" data-v="9" title="이어하기 코드 보기">⑨</button><button id="sc10" data-v="10" title="다른 폰에서 이어 가기">⑩</button><button id="sc11" data-v="11" title="앱 안 브라우저 안내">⑪</button>
  </div>
  <div class="grp" data-k="game"><span>게임</span>
    <button id="gm1" data-v="1">1</button><button id="gm2" data-v="2">2</button><button id="gm3" data-v="3">3</button><button id="gm4" data-v="4">4</button><button id="gm5" data-v="5">5</button><button id="gm6" data-v="6">6</button>
  </div>
  <div class="grp" data-k="font"><span>글자</span>
    <button id="fontHan" data-v="han">한글</button><button id="fontEng" data-v="eng">영문</button>
  </div>
  <div class="grp" data-k="period"><span>기간</span>
    <button id="perToday" data-v="today">오늘</button><button id="perAll" data-v="all">전체</button>
  </div>
  <div class="grp" data-k="place"><span>순위표</span>
    <button id="placeScreen" data-v="screen">화면 안</button><button id="placeSheet" data-v="sheet">별도 창</button>
  </div>
  <div class="grp" data-k="result"><span>결과 순위</span>
    <button id="resNone" data-v="none">없음</button><button id="resLine" data-v="line">한 줄</button><button id="resSame" data-v="same">같이</button><button id="resNext" data-v="next">한 번 더</button>
  </div>
  <div class="grp" data-k="why"><span>거절</span>
    <button id="whyBad" data-v="bad">금지</button><button id="whyTaken" data-v="taken">중복</button><button id="whyShort" data-v="short">짧음</button>
  </div>
  <div class="grp" data-k="metric"><span>결투 순위</span>
    <button id="metStreak" data-v="streak">연승</button><button id="metReact" data-v="react">반응</button>
  </div>
  <div class="grp" data-k="google"><span>구글</span>
    <button id="gOff" data-v="off">안 됨</button><button id="gOn" data-v="on">연결됨</button>
  </div>
  <div class="grp" data-k="wrong"><span>이어 가기</span>
    <button id="wrongOff" data-v="off">평소</button><button id="wrongOn" data-v="on">틀림</button>
  </div>
  <div id="cap"></div>
</div>
<main id="main">
  <div class="stage" id="stage">
    <div class="device-e" id="deviceE">
      <svg class="body-art" id="bodyArt" aria-hidden="true"><path id="bodyFill"></path><path id="bodyLine" fill="none"></path></svg>
      <button class="corner-btn game-btn" id="gameBtn" type="button" tabindex="-1"><canvas id="gameCanvas"></canvas><span class="ghost" id="gameLabel">게임 3 결투</span></button>
      <button class="corner-btn" id="crownBtn" type="button" tabindex="-1"><canvas id="crownCanvas"></canvas><span class="ghost" id="crownLabel">순위표 열기</span></button>
      <button class="corner-btn" id="soundBtn" type="button" tabindex="-1"><canvas id="soundCanvas"></canvas><span class="ghost" id="soundLabel">소리(시안에서는 안 남)</span></button>
      <button class="corner-btn skin-btn" id="skinBtn" type="button" tabindex="-1"><canvas id="skinCanvas"></canvas><span class="ghost" id="skinLabel">몸통 gray</span></button>
      <canvas class="screen" id="screen" aria-label="순위표 시안 화면"></canvas>
      <form class="nick" id="nick" autocomplete="off" novalidate>
        <div class="nick-guide" id="nickGuide">닉네임 2~8자</div>
        <input id="nickInput" type="text" maxlength="8" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="닉네임">
        <div class="nick-msg" id="nickMsg"></div>
        <div class="nick-row"><button id="nickOk" type="submit">확인</button><button id="nickCont" type="button" class="line">이어 가기</button></div>
      </form>
      <button class="key" id="keySlide" type="button" tabindex="-1"><canvas id="keySlideCanvas"></canvas><span class="ghost">왼쪽 키캡</span></button>
      <button class="key" id="keyPush" type="button" tabindex="-1"><canvas id="keyPushCanvas"></canvas><span class="ghost">오른쪽 키캡</span></button>
      <canvas class="grip" id="grip"></canvas>
      <div class="sheet-wrap" id="sheetWrap"><canvas class="sheet" id="sheet" aria-label="전체 순위표 창"></canvas></div>
      <div class="acct-wrap" id="acctWrap"><div class="acct" id="acct"></div></div>
    </div>
  </div>
</main>
<script>
/* 전체 순위표 화면 시안 (2026-11-12) — 게임 파일은 건드리지 않는 견본 한 장.
   틀(몸통 · 위 띠 버튼 · 검은 화면 · 점 글씨 · 키캡)은 3번 결투(key-duel/index.html)에서 그대로 가져왔다. 소리는 뺐다.
   순위 자료는 전부 가짜(규칙으로 지어낸 이름과 기록)이고 서버에는 아무것도 보내지 않는다.
   장면 일곱: ① 닉네임 입력 ② 닉네임 거절 ③ 결과 + 내 순위와 위 3명 ④ 내가 3등 안 ⑤ 전체 순위표 ⑥ 불러오는 중 ⑦ 연결 실패 */
(function () {
  'use strict';

  const W = 128;          // 그림판 가로 칸 수
  const ROWS = 96;        // 검은 화면 세로 칸 수
  const BG = '#000000', INK = '#f2f2f2';

  /* ---------- 키캡 그림(여섯 게임 공용 도트 키캡 — tools/key-shared-blocks.js의 KeyArt에서 그림만 가져옴, 소리 없음) ---------- */
  const KeyArt = {
    dots: {
      RE: ['###..###', '#..#.#..', '#..#.#..', '###..##.', '#.#..#..', '#..#.#..', '#..#.###'],
      gun: ['##########', '##########', '####.#....', '###..#....', '######....', '###.......', '###.......'],
    },
    pixel(c, n, down, kind) {
      const u = n / 20, K = '#000000', Wt = '#f2f2f2';
      const R = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(Math.round(x * u), Math.round(y * u), Math.round((x + w) * u) - Math.round(x * u), Math.round((y + h) * u) - Math.round(y * u)); };
      c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, n, n);
      R(1, 0, 18, 20, Wt); R(0, 1, 20, 18, Wt);
      R(1, 0, 18, 1, K); R(1, 19, 18, 1, K); R(0, 1, 1, 18, K); R(19, 1, 1, 18, K);
      const fx = 3, fw = 14, fh = 14, fy = down ? 4 : 2;
      const ticks = down ? [[1, 1], [2, 2], [3, 3], [18, 1], [17, 2], [16, 3], [2, 18], [17, 18]]
        : [[1, 1], [2, 2], [18, 1], [17, 2], [1, 18], [2, 17], [3, 16], [18, 18], [17, 17], [16, 16]];
      ticks.forEach(([x, y]) => R(x, y, 1, 1, K));
      R(fx + 1, fy, fw - 2, 1, K); R(fx + 1, fy + fh - 1, fw - 2, 1, K); R(fx, fy + 1, 1, fh - 2, K); R(fx + fw - 1, fy + 1, 1, fh - 2, K);
      const art = this.dots[kind];
      if (!art) return;
      const ax = fx + 1 + Math.floor((fw - 2 - art[0].length) / 2), ay = fy + 1 + Math.floor((fh - 2 - art.length) / 2);
      art.forEach((row, j) => { for (let i = 0; i < row.length; i += 1) if (row[i] === '#') R(ax + i, ay + j, 1, 1, K); });
    },
  };

  /* ---------- 몸통 색 · 기기 치수(결투와 같은 값) ---------- */
  const SKINS = [
    { name: 'white', body: '#f2f2f2', grip: '#cfcfcf' },
    { name: 'gray', body: '#c9cbcc', grip: '#a9abac' },
    { name: 'cream', body: '#e7dfcb', grip: '#c9c0aa' },
    { name: 'black', body: '#1c1c1c', grip: '#3a3a3a', line: true },
  ];
  let skin = 1;
  const DEVICE_MAX = 460, EDGE = 28, SCREEN_SHARE = 0.86, GAP_SHARE = 0.07, KEY_SHARE_TWO = 0.34, GRIP_SHARE = 0.46;
  const BODY_TALL = 1.5, CORNER_SHARE = 0.1, BAND_PAD = 10, BAND_GAP = 6, BTN_ROWS = 17, BOX_W = 7, BOX_H = 9;
  const ONE_COLS = 3 + BOX_W + 3, GAME_BOX_W = BOX_W, GAME_BOX_H = BOX_H, KEY_MIN = 72, KEY_MAX = 190, KEY_CELLS = 20;

  /* ---------- 결투 결과 화면 그림 재료(결투에서 가져옴) ---------- */
  const STAND = [
    '....###....', '....###....', '..#######..', '....###....', '....###....', '.....#.....', '....###....', '...#.#.#...', '...#.#.#...',
    '..#..#..#..', '..#..#..#..', '.....#..##.', '....#.#.#..', '....#.#....', '...#...#...', '...#...#...', '..#.....#..', '.##.....##.',
  ];
  const DOWN = ['..............###.', '#........#.#..###.', '#################.'];
  const HAT = ['.###.', '#####'];
  const OPP_HAT_ROWS = ['...#####...', '...#...#...', '.#########.'];
  const OPP_STAND = STAND.map((row, j) => (j < OPP_HAT_ROWS.length ? OPP_HAT_ROWS[j] : row));
  const SUN = ['.....#.....', '.#.......#.', '....###....', '...#####...', '..#######..', '#.#######.#', '..#######..', '...#####...', '....###....', '.#.......#.', '.....#.....'];
  const CACTUS_BIG = ['..#..', '#.#..', '#.#.#', '###.#', '..###', '..#..', '..#..'];
  const CACTUS_SMALL = ['.#.', '##.', '.##', '.#.', '.#.'];
  const GROUND_TEX = ['#.......#.......', '....#.......#...', '..........#.....', '.#....#.........'];
  const SKULL = [
    '....#######....', '..###########..', '.#############.', '###############', '###############', '##...#####...##', '##...#####...##', '##...#####...##',
    '###############', '#######.#######', '######...######', '.#############.', '..###########..', '...#.#.#.#.#...', '...#.#.#.#.#...', '...#########...',
  ];
  const SKY = 19;                       // 결투 장면을 아래로 내린 칸 수(96칸 화면)
  const GROUND_Y = 60 + SKY, ME_X = 9, OPP_X = 118, SUN_X = 108, SUN_Y = 3 + SKY;

  const TS = makeTarget('screen', el.screen), TH = makeTarget('sheet', el.sheet);
  function sizeTarget(t, rows) {
    if (t.h === rows && t.cv.width === W) return;
    t.h = rows; t.cv.width = W; t.cv.height = rows;
  }
  sizeTarget(TS, ROWS); sizeTarget(TH, ROWS);
  let T = TS;          // 지금 종이
  let ink = null;
  function use(t) { T = t; ink = null; t.marks = []; t.hits = []; box(0, 0, W, t.h, BG); }
  function dot(x, y, color) {
    if (x < 0 || x >= W || y < 0 || y >= T.h) return;
    if (color !== ink) { T.c.fillStyle = color; ink = color; }
    T.c.fillRect(x, y, 1, 1);
  }
  function box(x, y, w, h, color) { T.c.fillStyle = color; ink = color; T.c.fillRect(x, y, w, h); }
  function sprite(x, y, rows, color, k) {
    color = color || INK; k = k || 1;
    rows.forEach((row, j) => {
      for (let i = 0; i < row.length; i += 1) {
        if (row[i] !== '#') continue;
        for (let dy = 0; dy < k; dy += 1) for (let dx = 0; dx < k; dx += 1) dot(x + i * k + dx, y + j * k + dy, color);
      }
    });
  }
  function put(bmp, x, y, color) { color = color || INK; bmp.cells.forEach(([i, j]) => dot(x + i, y + j, color)); }
  // 검사용 자리 기록: kind = row(순위 줄) · text(글자) · art(그림)
  function mark(id, kind, x, y, w, h) { T.marks.push({ id, kind, x, y, w, h }); }
  function hit(id, x, y, w, h) { T.hits.push({ id, x, y, w, h }); }
  function blit(t) {
    const g = t.out.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.drawImage(t.cv, 0, 0, t.out.width, t.out.height);
  }

  /* ---------- 순위 줄 ----------
     한 줄 = [순위] [이름] ……… [기록]. 양끝 2칸 · 틈 2칸. 내 줄은 뒤집힌 색(흰 바탕 검은 글씨, 위아래 한 칸씩 더 칠함).
     128칸에 안 들어가면 차례로 줄인다: ① 순위 숫자를 작은 점 글씨로 ② 기록도 작은 점 글씨로 ③ 천 단위 쉼표 빼기 ④ 이름 뒤를 자르고 점 셋 */
  const PAD = 2, GAPX = 2, DOTS_H = 6;
  const LEVELS = [['big', 'big', true], ['small', 'big', true], ['small', 'small', true], ['small', 'small', false]];
  const ELL_W = 5;
  let lastPlan = null;
  function planRows(list, width) {
    const num = (text, size) => dotBmp([...text], size === 'big' ? GLYPHS : SMALL);
    let plan = null;
    for (let lv = 0; lv < LEVELS.length; lv += 1) {
      const [rs, ss, comma] = LEVELS[lv];
      const items = list.map((e) => ({ e, rank: num(String(e.rank), rs), score: num(comma ? e.score : e.score.replace(/,/g, ''), ss), name: nameBmp(e.name), cut: 0 }));
      const rankW = Math.max.apply(null, items.map((i) => i.rank.w));
      const nameX = PAD + rankW + GAPX;
      const fits = items.every((i) => nameX + i.name.w + GAPX + i.score.w + PAD <= width);
      plan = { lv, items, rankW, nameX, fits };
      if (fits) break;
    }
    if (!plan.fits) {
      const ellY = S.font === 'han' ? Math.min(hanBase, hanH) - 1 : 6;
      plan.items.forEach((it) => {
        const avail = width - PAD - it.score.w - GAPX - plan.nameX;
        if (it.name.w <= avail) return;
        const chars = [...it.e.name];
        let b = it.name;
        while (chars.length > 1 && b.w + 1 + ELL_W > avail) { chars.pop(); b = nameBmp(chars.join('')); }
        const x0 = b.w + 1;
        it.name = { w: x0 + ELL_W, h: b.h, cells: b.cells.concat([[x0, ellY], [x0 + 2, ellY], [x0 + 4, ellY]]) };
        it.cut = chars.length;
      });
    }
    return plan;
  }
  // 순위 줄 묶음이 차지하는 높이(칸): 줄 높이 × 줄 수 + 틈. 「…」 줄은 6칸. 마지막이 내 줄이면 아래 한 칸 더
  function rankHeight(list) {
    const lh = lineH(), g = rowGap();
    let h = 0;
    list.forEach((e, n) => { if (n) h += e.far ? DOTS_H : g; h += lh; });
    return h + (list.length && list[list.length - 1].me ? 1 : 0);
  }
  function drawRankRows(list, y0, width) {
    const plan = planRows(list, width), lh = lineH(), g = rowGap();
    let y = y0;
    plan.items.forEach((it, n) => {
      if (n) y += it.e.far ? DOTS_H : g;
      if (it.e.far) {
        const dx = Math.floor(width / 2) - 3, dy = y - DOTS_H + 2;
        [0, 3, 6].forEach((o) => dot(dx + o, dy, INK));
        mark('dots', 'text', dx, dy, 7, 1);
      }
      const col = it.e.me ? BG : INK;
      if (it.e.me) { box(0, y - 1, width, lh + 2, INK); mark('row-' + it.e.rank, 'row', 0, y - 1, width, lh + 2); hit('acct', 0, y - 1, width, lh + 2); } else mark('row-' + it.e.rank, 'row', PAD, y, width - 2 * PAD, lh);
      put(it.rank, PAD + plan.rankW - it.rank.w, y + numY(it.rank), col);
      put(it.name, plan.nameX, y, col);
      put(it.score, width - PAD - it.score.w, y + numY(it.score), col);
      y += lh;
    });
    lastPlan = {
      level: plan.lv, rankW: plan.rankW, nameX: plan.nameX, fits: plan.fits,
      rows: plan.items.map((it) => ({ rank: it.e.rank, name: it.e.name, score: it.e.score, me: it.e.me, nameW: it.name.w, scoreW: it.score.w, cut: it.cut })),
    };
    return y;
  }
  // 결과 화면용 네 줄: 위 3명 + (3등 밖이면 「…」 뒤에) 내 줄
  function rankList() {
    const list = [entry(1), entry(2), entry(3)];
    if (meRank() > 3) { const me = entry(meRank()); me.far = true; list.push(me); }
    return list;
  }

  /* ---------- 장면 그리기 ---------- */
  // 순위표 머리 줄: 왕관 + 기간 탭 둘(고른 쪽이 뒤집힌 색) + 오른쪽 끝 단위(별도 창이면 그 오른쪽에 × 닫기)
  // duelTabs = 결투 전체 순위표: 단위 자리에 「연승 / 반응」 두 탭(자리가 모자라 왼쪽 왕관은 뺀다)
  function drawHeader(close, duelTabs) {
    const lh = lineH(), hh = lh + 3;
    let x = 2;
    if (!duelTabs) {
      sprite(2, 1 + Math.floor((lh + 2 - 5) / 2), SMALL['♛']);
      mark('crown', 'art', 2, 1 + Math.floor((lh + 2 - 5) / 2), 7, 5);
      x = 12;
    }
    PERIODS.forEach((p) => {
      const b = label(p.label), bw = b.w + 4;
      if (S.period === p.id) { box(x, 1, bw, lh + 2, INK); put(b, x + 2, 2, BG); } else put(b, x + 2, 2, INK);
      mark('tab-' + p.id, 'text', x, 1, bw, lh + 2);
      hit('tab-' + p.id, x - 1, 0, bw + 1, hh + 2);
      x += bw + 1;
    });
    let rx = W - PAD;
    if (close) {
      const xb = dotBmp(['×'], GLYPHS);
      put(xb, rx - xb.w, 1 + Math.floor((lh + 2 - 7) / 2));
      mark('close', 'art', rx - xb.w, 1 + Math.floor((lh + 2 - 7) / 2), 5, 7);
      hit('close', rx - xb.w - 4, 0, xb.w + 6, hh + 2);
      rx -= xb.w + 5;
    }
    if (duelTabs) {
      METRICS.slice().reverse().forEach((m) => {
        const b = label(m.label), bw = b.w + 4, bx = rx - bw;
        if (S.metric === m.id) { box(bx, 1, bw, lh + 2, INK); put(b, bx + 2, 2, BG); } else put(b, bx + 2, 2, INK);
        mark('met-' + m.id, 'text', bx, 1, bw, lh + 2);
        hit('met-' + m.id, bx, 0, bw + 1, hh + 2);
        rx = bx - 1;
      });
    } else {
      const u = label(GAMES[S.game].unit);
      put(u, rx - u.w, 2);
      mark('unit', 'text', rx - u.w, 2, u.w, lh);
    }
    box(0, hh, W, 1, INK);
    return hh + 1;
  }

  // ①② 닉네임: 검은 화면에는 왕관만(큰 것 하나). 안내 · 입력칸 · 「확인」 · 거절 문구는 그 위에 겹친 진짜 입력칸이 보여 준다
  function drawNickBack() {
    const k = 2, cw = 7 * k;
    sprite(Math.floor((W - cw) / 2), 4, GLYPHS['♛'], INK, k);
    mark('crown', 'art', Math.floor((W - cw) / 2), 4, cw, 7 * k);
  }

  // 작은 점 글씨 한 줄(아이콘 + 두 칸 띄움 + 글자): 왼쪽 위 왕관 · 번개 줄
  function smallRow(id, keys, x, y) {
    let cx = x;
    keys.forEach((k, n) => { sprite(cx, y, SMALL[k] || SMALL['?']); cx += (SMALL[k] || SMALL['?'])[0].length + (n === 0 ? 2 : 1); });
    mark(id, 'text', x, y, cx - 1 - x, 5);
  }
  function drawPerson(anchor, right, rows, ax, gy) {
    const top = gy - rows.length;
    const sx = (i) => (right ? anchor - ax + i : anchor + ax - i);
    const cells = [];
    rows.forEach((row, j) => { for (let i = 0; i < row.length; i += 1) if (row[i] === '#') cells.push([sx(i), top + j]); });
    cells.forEach(([x, y]) => { for (let dy = -1; dy <= 1; dy += 1) for (let dx = -1; dx <= 1; dx += 1) dot(x + dx, y + dy, BG); });
    cells.forEach(([x, y]) => dot(x, y, INK));
  }
  // 결과 화면 위쪽. compact = 순위 줄을 같이 넣으려고 위쪽만 남긴 꼴(사막 그림 · 「최고 N연승」 줄 없음), squeezed = 그래도 좁아 연승 숫자를 한 배로
  function drawResultTop(compact, squeezed) {
    const mine = scoreAt(meRank());
    if (S.game !== '3') {
      // 결투가 아닌 게임: 진짜 결과 그림 대신 「이번 기록」 큰 숫자 + 단위로 자리만 잡는다
      const nb = dotBmp([...mine], GLYPHS, 2), ub = label(GAMES[S.game].unit);
      const tw = nb.w + 3 + ub.w, x = Math.floor((W - tw) / 2), y = compact ? 4 : 30;
      put(nb, x, y); put(ub, x + nb.w + 3, y + nb.h - ub.h);
      mark('record', 'text', x, Math.min(y, y + nb.h - ub.h), tw, Math.max(nb.h, ub.h));
      return;
    }
    if (!compact) {
      const gy = GROUND_Y;
      sprite(SUN_X, SUN_Y, SUN);
      for (let x = 0; x < W; x += 1) {
        const y = RIDGE_TOP[x], prev = x > 0 ? RIDGE_TOP[x - 1] : y;
        for (let yy = Math.min(y, prev + 1); yy <= Math.max(y, prev - 1); yy += 1) dot(x, yy + SKY, INK);
      }
      CACTI.forEach(([x, rows]) => sprite(x, gy - rows.length, rows));
      for (let y = gy + 2; y < T.h; y += 1) {
        for (let x = 0; x < W; x += 1) if (GROUND_TEX[(y - gy) % GROUND_TEX.length][x % GROUND_TEX[0].length] === '#') dot(x, y, INK);
      }
      drawPerson(ME_X, true, DOWN, 3, gy);                 // 나: 쓰러짐
      sprite(ME_X - 9, gy - HAT.length, HAT);
      drawPerson(OPP_X, false, OPP_STAND, 5, gy);          // 상대: 서 있음(검은 모자)
      box(0, gy, W, 1, INK);
      // 그림이 차지한 자리(「내 순위 한 줄」이 피해 갈 곳): 해 · 능선부터 땅 끝까지
      mark('sun', 'art', SUN_X, SUN_Y, SUN[0].length, SUN.length);
      mark('desert', 'art', 0, gy - STAND.length, W, T.h - (gy - STAND.length));
    }
    // 왼쪽 위: 왕관 + 최고 연승 · 번개 + 최고 반응 속도 · 그 아래 「N연승」(졌으니 0연승)
    smallRow('hud-best', ['♛'].concat([...mine]), 3, 2);
    smallRow('hud-ms', ['⚡'].concat([...'0.231']), 3, 8);
    const k = compact && squeezed ? 1 : 2;
    const sb = dotBmp(['0'], GLYPHS, k), ub = dotBmp(['연', '승'], GLYPHS);
    put(sb, 3, 15); put(ub, 3 + sb.w + 2, 15 + sb.h - 7);
    mark('streak', 'text', 3, 15, sb.w + 2 + ub.w, sb.h);
    // 해골: 같이 넣는 꼴이면 맨 위로 올린다
    const sx = Math.floor((W - SKULL[0].length) / 2), sy = compact ? 3 : 6 + SKY;
    sprite(sx, sy, SKULL);
    mark('skull', 'art', sx, sy, SKULL[0].length, SKULL.length);
    if (!compact) {
      const keys = ['♛', ' ', '최', '고', ' '].concat([...mine], ['연', '승']);
      const one = dotBmp(keys, GLYPHS), kk = one.w * 2 <= W - 8 ? 2 : 1, b = dotBmp(keys, GLYPHS, kk);
      const bx = Math.floor((W - b.w) / 2), by = sy + SKULL.length + 2;
      box(bx - 1, by - 1, b.w + 2, b.h + 2, BG); put(b, bx, by);
      mark('best-line', 'text', bx, by, b.w, b.h);
    }
  }
  let squeezedNow = false, panelTopNow = null;
  // ③④ 결과 화면
  // 「내 순위 한 줄」: 「오늘 12위」 꼴. 한글 방식 = 갈무리 낱말 + 점 글씨 숫자, 영문 방식 = TODAY RANK 12
  function rankLineBmp() {
    const n = String(meRank()), today = S.period === 'today';
    if (S.font !== 'han') {
      rankLineNow = (today ? 'TODAY' : 'ALL') + ' RANK ' + n;
      return dotBmp([...rankLineNow], GLYPHS);
    }
    rankLineNow = (today ? '오늘' : '전체') + ' ' + n + '위';
    const a = hanBmp(today ? '오늘' : '전체'), d = dotBmp([...n], GLYPHS), u = hanBmp('위');
    const dx = a.w + 3, ux = dx + d.w + 2, dy = numY(d);
    return {
      w: ux + u.w, h: Math.max(hanH, dy + d.h),
      cells: a.cells.concat(d.cells.map(([x, y]) => [x + dx, y + dy]), u.cells.map(([x, y]) => [x + ux, y])),
    };
  }
  // 자리 찾기: 이미 그린 글 · 그림 상자(marks)와 두 칸 넘게 떨어진 곳. 오른쪽 위 → 가운데 위 → 오른쪽 아래 → 가운데 아래 순서로 보고,
  // 다 막혀 있으면 위에서부터 훑어 처음 비는 자리
  function drawRankLine() {
    const b = rankLineBmp();
    const free = (x, y) => x >= 1 && y >= 1 && x + b.w <= W - 1 && y + b.h <= T.h - 1
      && !T.marks.some((m) => x - 2 < m.x + m.w && m.x < x + b.w + 2 && y - 2 < m.y + m.h && m.y < y + b.h + 2);
    const cx = Math.floor((W - b.w) / 2), rx = W - 2 - b.w;
    let spot = [[rx, 3], [cx, 3], [rx, T.h - b.h - 3], [cx, T.h - b.h - 3]].find(([x, y]) => free(x, y));
    for (let y = 1; !spot && y + b.h <= T.h - 1; y += 1) for (let x = rx; !spot && x >= 1; x -= 2) if (free(x, y)) spot = [x, y];
    if (!spot) spot = [rx, 3];
    box(spot[0] - 1, spot[1] - 1, b.w + 2, b.h + 2, BG);
    put(b, spot[0], spot[1]);
    mark('my-rank', 'text', spot[0], spot[1], b.w, b.h);
  }
  function drawResult() {
    const list = rankList();
    squeezedNow = false; panelTopNow = null; rankLineNow = '';
    if (S.result === 'none' || S.result === 'line') {
      // 없음 = 게임의 결과 화면 그대로(순위는 왕관 버튼으로만) · 한 줄 = 거기에 내 순위 한 줄만
      drawResultTop(false, false);
      if (S.result === 'line') drawRankLine();
      return;
    }
    if (S.result === 'next') {
      if (S.step === 0) { drawResultTop(false, false); return; }
      // 한 번 더 누른 뒤의 순위 화면: 머리 줄 + 네 줄을 가운데에
      const hb = drawHeader(false), need = rankHeight(list);
      drawRankRows(list, hb + 1 + Math.max(1, Math.floor((T.h - hb - 1 - need) / 2)), W);
      return;
    }
    // 결과 화면 아래에 같이: 아래쪽을 순위 판으로 쓴다(가로줄 하나로 나눔)
    const need = rankHeight(list);
    const panelTop = T.h - need - 3;
    squeezedNow = panelTop < 31;
    panelTopNow = panelTop;
    drawResultTop(true, squeezedNow);
    box(0, panelTop, W, 1, INK);
    drawRankRows(list, panelTop + 2, W);
  }

  // ⑤⑥⑦ 전체 순위표(지금 종이가 검은 화면이든 별도 창이든 같은 짜임)
  let board = { perPage: 1, pages: 1 };
  function boardRoom(rows) {
    const lh = lineH(), top = lh + 4 + 2, bottom = (rows || T.h) - 10 - 1;
    const perPage = Math.max(1, Math.floor((bottom - top + 1 + rowGap()) / (lh + rowGap())));
    return { top, perPage, pages: Math.ceil(TOTAL[S.period] / perPage) };
  }
  function drawBoard() {
    reactNow = S.game === '3' && S.metric === 'react';
    try { drawBoardIn(); } finally { reactNow = false; }
  }
  function drawBoardIn() {
    const sheet = T.name === 'sheet';
    drawHeader(sheet, S.game === '3');
    const room = boardRoom();
    board = { perPage: room.perPage, pages: room.pages };
    if (S.scene === 6) {
      // 불러오는 중: 가운데 네모 셋이 차례로 켜진다(글자 없음)
      const cy = Math.floor(T.h / 2) - 2, x0 = Math.floor(W / 2) - 10, on = S.tick % 4;
      [0, 1, 2].forEach((n) => { if (n < on) box(x0 + n * 8, cy, 4, 4, INK); else box(x0 + n * 8 + 1, cy + 1, 2, 2, INK); });
      mark('loading', 'art', x0, cy, 20, 4);
      return;
    }
    if (S.scene === 7) {
      // 연결 실패: 큰 가위표 + 한 마디. 왼쪽 키캡(RE)을 누르면 다시 불러온다
      const xb = dotBmp(['×'], GLYPHS, 2), lb = label(['연결 실패', 'OFFLINE']);
      const y = Math.floor((T.h - (xb.h + 4 + lb.h)) / 2) + 4;
      put(xb, Math.floor((W - xb.w) / 2), y); put(lb, Math.floor((W - lb.w) / 2), y + xb.h + 4);
      mark('fail-x', 'art', Math.floor((W - xb.w) / 2), y, xb.w, xb.h);
      mark('fail-word', 'text', Math.floor((W - lb.w) / 2), y + xb.h + 4, lb.w, lb.h);
      hit('retry', 0, y - 4, W, xb.h + lb.h + 12);
      return;
    }
    if (S.page >= room.pages) S.page = room.pages - 1;
    const first = S.page * room.perPage + 1, list = [];
    for (let r = first; r < first + room.perPage && r <= TOTAL[S.period]; r += 1) list.push(entry(r));
    drawRankRows(list, room.top, W);
    // 바닥 줄: 왼쪽 = 내 줄로 바로 가기(▼ + 내 순위), 오른쪽 = 쪽 번호 + 다음 쪽(▶)
    const fy = T.h - 10;
    box(0, fy, W, 1, INK);
    const meB = dotBmp(['▼'].concat([...String(meRank())]), SMALL);
    put(meB, PAD, fy + 3); mark('foot-me', 'text', PAD, fy + 3, meB.w, 5);
    const pgB = dotBmp([...(String(S.page + 1) + '/' + String(room.pages))].concat([' ', '▶']), SMALL);
    put(pgB, W - PAD - pgB.w, fy + 3); mark('foot-page', 'text', W - PAD - pgB.w, fy + 3, pgB.w, 5);
    hit('me', 0, fy, Math.floor(W / 2), 10);
    hit('next', Math.floor(W / 2), fy, W - Math.floor(W / 2), 10);
  }

    const mb = el.main.getBoundingClientRect();
    const limitH = mb.height - EDGE;
    const dw = fitWidth(Math.max(120, Math.floor(Math.min(mb.width - EDGE, DEVICE_MAX))), limitH, band, rows, KEY_SHARE_TWO);
    const gap = Math.round(dw * GAP_SHARE);
    const gh = gap;

    const want = dw * KEY_SHARE_TWO;
    let kc = 0, nearest = Infinity;
    for (let n = 1; KEY_CELLS * n / r <= KEY_MAX + 0.01; n += 1) {
      const size = KEY_CELLS * n / r;
      if (size >= KEY_MIN - 0.01 && Math.abs(size - want) < nearest) { kc = n; nearest = Math.abs(size - want); }
    }
    if (!kc) kc = Math.max(1, Math.ceil(KEY_MIN * r / KEY_CELLS));
    const kcMin = Math.ceil((KEY_MIN - 0.01) * r / KEY_CELLS);

    let cellPx = Math.max(1, Math.floor(dw * SCREEN_SHARE * r / W));
    const total = (cp, k) => band + (rows * cp) / r + gap + (KEY_CELLS * k) / r + gap + gh + gap;
    while (cellPx > 1 && total(cellPx, kc) > limitH) cellPx -= 1;
    while (kc > kcMin && total(cellPx, kc) > limitH) kc -= 1;
    const lift = Math.max(0, Math.floor((Math.min(limitH, Math.round(dw * BODY_TALL)) - total(cellPx, kc)) / 3));
    keyCell = kc;
    const ks = KEY_CELLS * kc / r;
    const sw = (W * cellPx) / r, sh = (rows * cellPx) / r;

    const keyTop = Math.round(band + sh + gap + lift);
    const gripTop = Math.round(keyTop + ks + gap + lift);
    const dh = Math.round(gripTop + gh + gap + lift);

    const ds = el.deviceE.style, rad = Math.round(dw * CORNER_SHARE), bevel = Math.round(dw * CORNER_SHARE);
    ds.width = dw + 'px'; ds.height = dh + 'px';
    drawBody(dw, dh, rad, bevel);

    // 위 띠: 왼쪽 끝 = 게임 버튼, 오른쪽 묶음(왼→오) = 순위표(왕관) → 소리 → 몸통 색
    const oneW = (ONE_COLS * cc) / r, gameW = (gameCols() * cc) / r;
    const spare = dw - gameW - (3 * oneW + 2 * BAND_GAP) - BAND_GAP;
    let side = Math.round(dw * 0.08);
    if (2 * side > spare) side = Math.max(2, Math.floor(spare / 2));
    el.gameBtn.style.left = side + 'px'; el.gameBtn.style.top = BAND_PAD + 'px';
    [el.skinBtn, el.soundBtn, el.crownBtn].forEach((b, i) => {
      b.style.left = ''; b.style.right = (side + i * (oneW + BAND_GAP)) + 'px'; b.style.top = BAND_PAD + 'px';
    });

    // 검은 화면
    const sLeft = Math.round((dw - sw) / 2), sTop = Math.round(band);
    if (el.screen.width !== W * cellPx || el.screen.height !== rows * cellPx) { el.screen.width = W * cellPx; el.screen.height = rows * cellPx; }
    el.screen.style.width = sw + 'px'; el.screen.style.height = sh + 'px';
    el.screen.style.left = sLeft + 'px'; el.screen.style.top = sTop + 'px';

    // 닉네임 입력칸: 검은 화면과 같은 자리 · 같은 칸 크기
    const ns = el.nick.style;
    ns.left = sLeft + 'px'; ns.top = sTop + 'px'; ns.width = sw + 'px'; ns.height = sh + 'px';
    ns.setProperty('--u', (cellPx / r) + 'px');

    // 계정 창: 아래 별도 창과 같은 자리 · 같은 칸 크기(크기는 아래에서 별도 창과 함께 맞춘다)
    el.acctWrap.style.setProperty('--u', (cellPx / r) + 'px');

    // 별도 창: 검은 화면 위 끝부터 오돌토돌한 띠 아래까지(검은 화면 · 키캡 · 띠를 덮는다), 같은 칸 크기
    const sheetRows = Math.max(ROWS, Math.floor((gripTop + gh + gap / 2 - sTop) * r / cellPx));
    sizeTarget(TH, sheetRows);
    if (el.sheet.width !== W * cellPx || el.sheet.height !== sheetRows * cellPx) { el.sheet.width = W * cellPx; el.sheet.height = sheetRows * cellPx; }
    el.sheet.style.width = sw + 'px'; el.sheet.style.height = ((sheetRows * cellPx) / r) + 'px';
    const ws = el.sheetWrap.style;
    ws.left = sLeft + 'px'; ws.top = sTop + 'px'; ws.width = sw + 'px'; ws.height = ((sheetRows * cellPx) / r) + 'px';
    const as = el.acctWrap.style;
    as.left = ws.left; as.top = ws.top; as.width = ws.width; as.height = ws.height;

    // 키캡 두 개
    const keyGap = gap, rowLeft = Math.round((dw - (2 * ks + keyGap)) / 2);
    [[el.keySlide, el.keySlideCanvas, rowLeft], [el.keyPush, el.keyPushCanvas, Math.round(rowLeft + ks + keyGap)]].forEach(([b, cv, x]) => {
      const n = KEY_CELLS * kc;
      if (cv.width !== n || cv.height !== n) { cv.width = n; cv.height = n; }
      cv.style.width = ks + 'px'; cv.style.height = ks + 'px';
      b.style.left = x + 'px'; b.style.top = keyTop + 'px';
      b.style.width = ks + 'px'; b.style.height = ks + 'px';
    });

    const gw = Math.round(dw * GRIP_SHARE);
    drawGrip(gw, gh);
    el.grip.style.left = Math.round((dw - gw) / 2) + 'px'; el.grip.style.top = gripTop + 'px';

    drawKeys();
    render();
    liftForKeyboard();
  }
  if (window.ResizeObserver) new ResizeObserver(fit).observe(el.main);
  window.addEventListener('resize', fit);

  // 폰 자판이 올라와 입력칸을 가리면 기기를 그만큼 위로 올린다(자판이 내려가면 제자리)
  function liftForKeyboard() {
    const vv = window.visualViewport;
    el.deviceE.style.transform = '';
    const a = document.activeElement;
    if (!vv || !a || a.tagName !== 'INPUT' || !el.deviceE.contains(a)) return;
    // 닉네임 장면은 「확인」까지, 이어 가기 창은 치는 입력칸 + 그 아래 한 칸까지 보이게
    const b = a === el.nickInput ? el.nick.getBoundingClientRect() : (() => { const q = a.getBoundingClientRect(); return { top: q.top, bottom: q.bottom + q.height }; })();
    const over = b.bottom + 8 - (vv.offsetTop + vv.height);
    const room = b.top - vv.offsetTop - 4;
    const shift = Math.max(0, Math.min(over, room));
    if (shift > 0) el.deviceE.style.transform = 'translateY(' + (-Math.round(shift)) + 'px)';
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', liftForKeyboard);
    window.visualViewport.addEventListener('scroll', liftForKeyboard);
  }
  el.nickInput.addEventListener('focus', () => setTimeout(liftForKeyboard, 50));
  el.nickInput.addEventListener('blur', () => setTimeout(liftForKeyboard, 50));
  el.acct.addEventListener('focusin', () => setTimeout(liftForKeyboard, 50));
  el.acct.addEventListener('focusout', () => setTimeout(liftForKeyboard, 50));
  // 계정 창 안의 버튼들 · 닉네임 장면의 「이어 가기」
  el.acct.addEventListener('click', (e) => {
    const b = e.target.closest ? e.target.closest('button') : null;
    if (b) acctAct(b.id);
  });
  el.nickCont.addEventListener('click', () => setState({ scene: 10 }));

  /* ---------- 입력 ---------- */
  const mainPointer = (e) => e.pointerType !== 'mouse' || e.button === 0;
  // 조작 줄
  el.ctl.addEventListener('click', (e) => {
    const b = e.target.closest ? e.target.closest('button') : null;
    if (!b) return;
    if (b.id === 'ctlFold') { ctlOpen = !ctlOpen; render(); return; } // 접으면 받침대가 커져 기기 자리가 다시 맞춰진다
    const k = b.parentNode.getAttribute('data-k'), patch = {};
    patch[k] = b.getAttribute('data-v');
    if (k === 'scene' && Number(patch.scene) >= 5 && S.scene < 5) prevScene = S.scene <= 2 ? 3 : S.scene;
    setState(patch);
  });
  // 위 띠
  el.gameBtn.addEventListener('pointerdown', (e) => {
    if (!mainPointer(e)) return;
    e.preventDefault(); e.stopPropagation();
    const b = e.currentTarget.getBoundingClientRect();
    setState({ game: GAME_IDS[gameIndexAt(e.clientX - b.left)] });
  });
  el.crownBtn.addEventListener('pointerdown', (e) => { if (!mainPointer(e)) return; e.preventDefault(); e.stopPropagation(); toggleBoard(); });
  el.skinBtn.addEventListener('pointerdown', (e) => { if (!mainPointer(e)) return; e.preventDefault(); e.stopPropagation(); skin = (skin + 1) % SKINS.length; fit(); });
  el.soundBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); }); // 시안에는 소리가 없다
  // 키캡
  [['push', el.keyPush], ['slide', el.keySlide]].forEach(([name, node]) => {
    node.addEventListener('pointerdown', (e) => {
      if (!mainPointer(e)) return;
      e.preventDefault(); e.stopPropagation();
      releaseKeys();
      pressKey(name);
    });
  });
  ['pointerup', 'pointercancel'].forEach((type) => window.addEventListener(type, releaseKeys));
  window.addEventListener('blur', releaseKeys);
  // 검은 화면 · 별도 창을 직접 누름(탭 · 닫기 · 쪽 넘기기)
  function cellHit(e, t) {
    const b = t.out.getBoundingClientRect();
    const x = Math.floor(((e.clientX - b.left) / b.width) * W), y = Math.floor(((e.clientY - b.top) / b.height) * t.h);
    const h = t.hits.find((q) => x >= q.x && x < q.x + q.w && y >= q.y && y < q.y + q.h);
    return h ? h.id : null;
  }
  [[el.screen, TS], [el.sheet, TH]].forEach(([node, t]) => {
    node.addEventListener('pointerdown', (e) => {
      if (!mainPointer(e)) return;
      e.preventDefault();
      const id = cellHit(e, t);
      if (id) boardAct(id);
    });
  });
  // 닉네임 입력칸
  el.nickInput.addEventListener('input', (e) => {
    if (e.isComposing) return; // 한글을 조합하는 중에는 건드리지 않는다(글자가 깨진다)
    const v = cleanNick(el.nickInput.value);
    if (v !== el.nickInput.value) el.nickInput.value = v;
  });
  el.nickInput.addEventListener('compositionend', () => {
    const v = cleanNick(el.nickInput.value);
    if (v !== el.nickInput.value) el.nickInput.value = v;
  });
  el.nick.addEventListener('submit', (e) => { e.preventDefault(); submitNick(); });
  // 키보드: 스페이스 · 엔터 = 오른쪽 키캡, R = 왼쪽 키캡(입력칸에 글을 치는 중이면 아님)
  window.addEventListener('keydown', (e) => {
    if ((e.target && e.target.tagName === 'INPUT') || e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter') { e.preventDefault(); releaseKeys(); pressKey('push'); }
    if (e.code === 'KeyR') { e.preventDefault(); releaseKeys(); pressKey('slide'); }
  });
  window.addEventListener('keyup', releaseKeys);
  ['gesturestart', 'dblclick', 'contextmenu', 'dragstart'].forEach((name) => document.addEventListener(name, (e) => e.preventDefault()));

  // 불러오는 중: 네모가 차례로 켜지게
  setInterval(() => { if (S.scene === 6) { S.tick += 1; render(); } }, 350);

  /* ---------- 한글 픽셀 글꼴 불러오기: 못 불러오면 기기 기본 글꼴로 떨어진다 ---------- */
  function fontDone(ok) {
    if (fontState === 'ok' || (fontState === 'fallback' && !ok)) return; // 늦게라도 불러오면 갈무리11로 바꾼다
    fontState = ok ? 'ok' : 'fallback';
    hanMetrics();
    render();
  }
  hanMetrics();
  fit();
  try {
    const timer = setTimeout(() => fontDone(false), 5000);
    document.fonts.load('12px Galmuri11', '가A1').then((list) => {
      clearTimeout(timer);
      fontDone(!!list && list.length > 0 && list.every((f) => f.status === 'loaded'));
    }, () => { clearTimeout(timer); fontDone(false); });
  } catch (e) { fontDone(false); }

  /* ---------- 검사용 손잡이 ---------- */
  const rectOf = (node) => {
    const b = node.getBoundingClientRect();
    return { x: b.left, y: b.top, w: b.width, h: b.height };
  };
  function litOf(t) {
    const d = t.c.getImageData(0, 0, W, t.h).data;
    let n = 0;
    for (let k = 0; k < d.length; k += 4) if (d[k] > 128) n += 1;
    return n;
  }
  window.__MOCK__ = {
    state() {
      return {
        scene: S.scene, game: S.game, font: S.font, place: S.place, period: S.period, result: S.result, step: S.step, why: S.why, page: S.page,
        fontState, lineH: lineH(), hanH, hanBase, rowGap: rowGap(),
        myName: myName(), meRank: meRank(), total: TOTAL[S.period], myScore: scoreAt(meRank()),
        perPage: board.perPage, pages: board.pages, sheetRows: TH.h, rows: ROWS,
        squeezed: squeezedNow, panelTop: panelTopNow,
        plan: lastPlan,
        marks: TS.marks, hits: TS.hits, sheetMarks: sheetOn() ? TH.marks : [], sheetHits: sheetOn() ? TH.hits : [],
        lit: litOf(TS), sheetLit: sheetOn() ? litOf(TH) : 0,
        sheetOpen: el.sheetWrap.classList.contains('open'), nickOn: el.nick.classList.contains('show'),
        input: el.nickInput.value, msg: el.nickMsg.textContent, guide: el.nickGuide.textContent, caption: el.cap.textContent,
        skin: SKINS[skin].name,
        metric: S.metric, google: S.google, wrong: S.wrong, ctlOpen,
        rankLine: rankLineNow, newRounds, crownOpen: S.scene >= 5, prevScene, meTop,
        // 계정 창: 열렸는지 · 자리 · 안의 버튼과 입력칸 자리 · 내용이 창 밖으로 넘치는지
        acct: {
          open: el.acctWrap.classList.contains('open'), rect: rectOf(el.acctWrap), text: el.acct.textContent,
          overflow: el.acct.scrollHeight > el.acct.clientHeight + 1 || el.acct.scrollWidth > el.acct.clientWidth + 1,
          parts: [].slice.call(el.acct.querySelectorAll('button, input')).map((b) => ({ id: b.id, text: b.textContent, rect: rectOf(b) })),
        },
        rects: {
          cont: rectOf(el.nickCont),
          ctl: rectOf(el.ctl), main: rectOf(el.main), device: rectOf(el.deviceE), screen: rectOf(el.screen), sheet: rectOf(el.sheetWrap),
          nick: rectOf(el.nick), input: rectOf(el.nickInput), ok: rectOf(el.nickOk),
          push: rectOf(el.keyPush), slide: rectOf(el.keySlide), grip: rectOf(el.grip),
          gameBtn: rectOf(el.gameBtn), crownBtn: rectOf(el.crownBtn), soundBtn: rectOf(el.soundBtn), skinBtn: rectOf(el.skinBtn),
        },
      };
    },
    set(patch) { setState(patch || {}); return true; },
    key(name) { keyAct(name === 'slide' ? 'slide' : 'push'); return true; },   // 키캡을 누른 것과 같은 일(그림은 안 눌림)
    act(id) { boardAct(String(id)); return true; },                            // 순위표의 탭 · 닫기 · 다음 쪽 · 내 줄
    crown() { toggleBoard(); return S.scene; },
    fold(open) { ctlOpen = !!open; render(); return ctlOpen; },   // 조작 줄 접기(false) · 펴기(true)
    acctAct(id) { acctAct(String(id)); return S.scene; },         // 계정 창 버튼을 누른 것과 같은 일
    submit() { submitNick(); return { scene: S.scene, why: S.why }; },
    judge(name) { return judge(cleanNick(String(name))); },
    // 이름 하나가 차지하는 폭(칸) — 계산 확인용
    nameW(name) { return nameBmp(String(name)).w; },
  };
  window.__STREAK_TEST__ = window.__MOCK__; // 공용 검사 틀이 「준비됨」을 알아보는 이름
}());
</script>
</body>
</html>
