<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>퍼덕</title>
<style>
  /* 화면에는 손바닥만 한 기기 하나만 있다: 몸통 안에 검은 화면, 그 아래 큰 키캡 하나, 맨 아래 오돌토돌한 띠.
     크기와 자리는 스크립트가 창 크기에 맞춰 정한다. 글씨와 테두리는 전부 캔버스(그림 종이)에 칸으로 찍는다 */
  :root { --black: #000000; --white: #f2f2f2; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--black); color: var(--white);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  /* 창 전체를 차지하는 받침대: 기기 몸통을 가로 · 세로 가운데에 올려 둔다 */
  main {
    width: 100vw; height: 100vh; height: 100dvh;
    display: flex; align-items: center; justify-content: center;
  }
  /* 기기 몸통: 겉모양(둥근 위 · 깎인 아래 · 몸통 색)은 안쪽 그림(#bodyArt)이 그린다 */
  .device-e { position: relative; flex: none; line-height: 0; }
  .body-art { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  .screen { position: absolute; display: block; image-rendering: pixelated; background: var(--black); }
  .grip { position: absolute; display: block; image-rendering: pixelated; pointer-events: none; }
  /* 몸통 위 띠의 작은 점 그림 버튼 넷: 왼쪽 = 게임(123456), 오른쪽 = 소리 · 키캡 · 몸통 색 */
  .corner-btn {
    position: absolute; top: 10px; padding: 0; margin: 0; border: 0; background: transparent;
    line-height: 0; cursor: pointer; touch-action: none; outline: none;
  }
  .corner-btn canvas { display: block; image-rendering: pixelated; }
  /* 키캡: 진짜 키보드 키처럼 누르면 들어가고 떼면 올라온다 */
  .key {
    position: absolute; padding: 0; margin: 0; border: 0; background: transparent;
    line-height: 0; cursor: pointer; touch-action: none; outline: none;
  }
  .key canvas { display: block; image-rendering: pixelated; }
  /* 화면에는 안 보이는 글자: 읽어 주는 기능 · 검사기가 버튼 글을 읽을 수 있게 남겨 둔다 */
  .ghost { position: absolute; left: 0; top: 0; width: 100%; height: 100%; color: transparent; overflow: hidden; white-space: nowrap; pointer-events: none; line-height: 1; }
</style>
</head>
<body>
<main id="main">
  <div class="device-e" id="deviceE">
    <svg class="body-art" id="bodyArt" aria-hidden="true"><path id="bodyFill"></path><path id="bodyLine" fill="none"></path></svg>
    <button class="corner-btn game-btn" id="gameBtn" type="button" tabindex="-1"><canvas id="gameCanvas"></canvas><span class="ghost" id="gameLabel">게임 5 퍼덕</span></button>
    <button class="corner-btn sound-btn" id="soundBtn" type="button" tabindex="-1"><canvas id="soundCanvas"></canvas><span class="ghost" id="soundLabel">소리 1</span></button>
    <button class="corner-btn cap-btn" id="capBtn" type="button" tabindex="-1"><canvas id="capCanvas"></canvas><span class="ghost" id="capLabel">키캡 smooth</span></button>
    <button class="corner-btn skin-btn" id="skinBtn" type="button" tabindex="-1"><canvas id="skinCanvas"></canvas><span class="ghost" id="skinLabel">몸통 gray</span></button>
    <canvas class="screen" id="screen" aria-label="퍼덕, 0"></canvas>
    <button class="key" id="keyPush" type="button" tabindex="-1"><canvas id="keyPushCanvas"></canvas><span class="ghost">퍼덕</span></button>
    <canvas class="grip" id="grip"></canvas>
  </div>
</main>
<script>
/* 퍼덕 — 한 번 누름 = 한 번 퍼덕(위로 튀어 오름). 안 누르면 떨어진다.
   비유: 시골 마당 위를 겨우겨우 날아가는 통통한 닭. 아래에서는 울타리 말뚝이 솟아 있고 위에서는 곶감 줄이 매달려 내려온다.
   말뚝과 곶감 줄 사이 틈으로 지나가면 +1, 말뚝 · 곶감 줄 · 화면 아래 끝(땅) · 화면 위 끝(천장)에 닿으면 끝.
   놀이판 = 화면 전체(128×96칸). 지붕도 두꺼운 땅도 없고, 맨 아래 2칸짜리 얇은 땅 줄만 깔려 있다.
   틀(기기 모양 · 4:3 화면 · 몸통 색 · 게임 버튼 · 소리 · 키캡 그림)은 시지프스와 같고, 게임 부분만 다르다. */
(function () {
  'use strict';

  const W = 128;          // 그림판 가로 칸 수
  const ROWS = 96;        // 그림판 세로 칸 수: 늘 4:3 화면(128×96칸, 배치 F 하나). 놀이판도 이 전체를 쓴다
  const BG = '#000000', INK = '#f2f2f2';
  const KEYS = {
    best: 'hold-on-key-flap-best',   // 최고 기록
  };
  const SKIN_KEY = 'hold-on-keys-skin';     // 고른 몸통 색(0~3). 여섯 게임이 함께 쓴다
  const CAP_KEY = 'hold-on-keys-cap';       // 고른 키캡 그림(0 도트 · 1 매끈 · 2 스위치 · 3 납작). 여섯 게임이 함께 쓴다
  const FIRST_SKIN = 1;   // 처음 여는 사람의 몸통 색 = 회색
  const FIRST_CAP = 1;    // 처음 여는 사람의 키캡 그림 = 매끈
  const LABEL = '퍼덕';
  const mod = (a, n) => ((a % n) + n) % n; // 음수도 0 ~ n-1로 돌려준다

// === KEY-SHARED 여기부터 ===
  /* ---------- 키캡 효과음(여섯 벌, 코드로 만든 소리) ----------
     비유: 작은 드럼. 「딸깍」 = 짧은 잡음(스위치 부딪는 소리) + 짧은 음(키캡 통 울림)을 섞어 0.1초 안에 사라지게 한다.
     형님이 고른 키보드 소리 여섯 개의 길이 · 음색을 재서 닮게 맞춘 것이고, 녹음 파일은 쓰지 않는다.
     set = [잡음 걸러 듣기 종류, 잡음 중심 Hz, 잡음 폭 Q, 잡음 길이 초, 잡음 세기, 통 울림 Hz, 통 울림 길이 초, 통 울림 세기, 전체 세기] */
  const KeySound = (() => {
    const KEY = 'hold-on-keys-sound';
    const SETS = [
      ['bandpass', 2000, 1.0, 0.22, 0.9, 1330, 0.10, 0.40, 0.8],  // 1 또렷한 딸깍
      ['bandpass', 6800, 0.8, 0.26, 1.0, 5200, 0.04, 0.15, 0.7],  // 2 높고 날카로운 틱
      ['bandpass', 3600, 0.8, 0.22, 0.6, 90, 0.12, 0.45, 0.7],    // 3 가볍게 톡 + 낮은 울림
      ['bandpass', 2600, 0.9, 0.16, 0.9, 145, 0.10, 0.50, 0.8],   // 4 도톰한 톡(thock)
      ['bandpass', 1500, 0.9, 0.19, 0.9, 110, 0.13, 0.70, 0.8],   // 5 가장 낮고 묵직한 툭
      ['bandpass', 1000, 1.2, 0.19, 0.7, 900, 0.09, 0.50, 0.55],  // 6 먹먹한 톡
    ];
    let ac = null, noise = null, index = 1; // 0 = 끔, 1~6
    try { const v = Number(localStorage.getItem(KEY)); if (Number.isInteger(v) && v >= 0 && v <= SETS.length && localStorage.getItem(KEY) !== null) index = v; } catch (e) { /* 저장소가 막혀도 그대로 */ }
    function ctx() {
      if (!ac) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ac = new AC(); }
      if (ac.state !== 'running') { const p = ac.resume(); if (p && p.catch) p.catch(() => {}); } // 사파리는 전화 · 탭 전환 뒤 'interrupted'로 멈춰 있기도 하다 → 돌고 있지 않으면 늘 깨운다
      if (!noise) { // 흰 잡음 0.25초를 한 번만 만들어 두고 돌려쓴다
        noise = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.25), ac.sampleRate);
        const d = noise.getChannelData(0); let s = 12345;
        for (let i = 0; i < d.length; i += 1) { s = (s * 1103515245 + 12345) & 0x7fffffff; d[i] = s / 0x3fffffff - 1; }
      }
      return ac;
    }
    // 한 번 치기. up = 손을 뗄 때(조금 높고 작게)
    function hit(set, up, c = ctx(), dest = c && c.destination) {
      if (!c) return;
      const [type, f, q, nd, ng, bf, bd, bg, vol] = set, t = c.currentTime + 0.001, k = up ? 0.45 : 1, pitch = up ? 1.3 : 1;
      const src = c.createBufferSource(); src.buffer = noise;
      const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.value = f * pitch; fl.Q.value = q;
      const g1 = c.createGain(); g1.gain.setValueAtTime(0.0001, t); g1.gain.exponentialRampToValueAtTime(ng * vol * k, t + 0.002); g1.gain.exponentialRampToValueAtTime(0.0001, t + nd);
      src.connect(fl); fl.connect(g1); g1.connect(dest); src.start(t); src.stop(t + nd + 0.02);
      const osc = c.createOscillator(); osc.type = bf < 300 ? 'sine' : 'triangle';
      osc.frequency.setValueAtTime(bf * pitch, t); osc.frequency.exponentialRampToValueAtTime(bf * pitch * 0.7, t + bd);
      const g2 = c.createGain(); g2.gain.setValueAtTime(0.0001, t); g2.gain.exponentialRampToValueAtTime(bg * vol * k, t + 0.003); g2.gain.exponentialRampToValueAtTime(0.0001, t + bd);
      osc.connect(g2); g2.connect(dest); osc.start(t); osc.stop(t + bd + 0.02);
    }
    return {
      count: SETS.length, sets: SETS, hit,
      get index() { return index; },
      set(i) { index = Math.max(0, Math.min(SETS.length, Math.floor(Number(i)) || 0)); try { localStorage.setItem(KEY, String(index)); } catch (e) { /* 메모리에만 */ } return index; },
      next() { this.set((index + 1) % (SETS.length + 1)); if (index) try { hit(SETS[index - 1], false); } catch (e) { /* 소리만 안 남 */ } return index; }, // 고르면 그 소리를 한 번 들려준다
      // 소리 쪽에서 무슨 일이 나도 게임 누름이 끊기지 않게 전부 감싼다
      down() { if (index) try { hit(SETS[index - 1], false); } catch (e) { /* 소리만 안 남 */ } },
      up() { if (index) try { hit(SETS[index - 1], true); } catch (e) { /* 소리만 안 남 */ } },
      // 폰은 손가락이 닿은 뒤에야 소리가 난다 → 첫 누름에서 불러 준다. 소리 끔(0)이면 소리 장치를 만들지 않는다
      unlock() { if (!index) return null; try { return ctx(); } catch (e) { return null; } },
    };
  })();
  // 아이폰 사파리는 손가락을 「뗄 때」(pointerup · touchend)와 키보드 입력만 사용자 동작으로 쳐서 소리를 허락한다 → 그때도 소리 장치를 깨운다.
  // 탭을 가렸다 돌아왔을 때도 한 번 깨운다
  ['pointerup', 'touchend', 'keydown'].forEach((n) => window.addEventListener(n, () => { KeySound.unlock(); }, { capture: true, passive: true }));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) KeySound.unlock(); });

  /* ---------- 키캡 그림(도트 말고 세 가지) ----------
     style 1 = 매끈한 플라스틱 키캡 · 2 = 스위치가 비치는 투명 키(본보기 기기) · 3 = 납작한 미니멀. (0 = 도트는 각 게임의 예전 그림 그대로)
     draw(): 키 캔버스(한 변 n 기기 점)에 키를 그리고, 아이콘을 놓을 자리(윗면 가운데 cx · cy, 크기 s)를 돌려준다.
     icon(): 그 자리에 매끈한 아이콘을 그린다 — 'gun' 권총 · 'RE' · 'footL' 왼발 · 'footR' 오른발(엄지발가락과 발바닥 패인 곳이 안쪽) */
  const KeyArt = {
    names: ['dot', 'smooth', 'switch', 'flat'],
    rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); },
    draw(c, n, style, down) {
      const u = n / 20, rr = this.rr;
      c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, n, n); c.lineJoin = 'round';
      if (style === 1) { // 매끈한 플라스틱: 바닥 그림자 → 옆면(치마) → 윗면. 누르면 윗면이 내려가고 치마가 짧아진다
        const d = down ? 1.7 * u : 0;
        rr(c, 1 * u, 2.2 * u, 18 * u, 17.3 * u, 3.2 * u); c.fillStyle = 'rgba(0,0,0,0.28)'; c.fill();
        let g = c.createLinearGradient(0, 2 * u, 0, 19 * u); g.addColorStop(0, '#c4c4c4'); g.addColorStop(1, '#8a8a8a');
        rr(c, 1.2 * u, 1.4 * u + d, 17.6 * u, 17.2 * u - d, 3 * u); c.fillStyle = g; c.fill(); c.lineWidth = 0.45 * u; c.strokeStyle = '#2a2a2a'; c.stroke();
        g = c.createLinearGradient(0, 2 * u + d, 0, 15 * u + d); g.addColorStop(0, '#ffffff'); g.addColorStop(1, down ? '#dcdcdc' : '#ececec');
        rr(c, 3 * u, 2.4 * u + d, 14 * u, 12.2 * u, 2.4 * u); c.fillStyle = g; c.fill(); c.lineWidth = 0.35 * u; c.strokeStyle = '#555'; c.stroke();
        return { cx: n / 2, cy: 8.5 * u + d, s: 8 * u };
      }
      if (style === 2) { // 투명 키: 어두운 스위치 판 → 밝은 스위치 몸 + 십자 축 → 그 위에 비치는 투명 캡. 누르면 캡이 작아지며 내려간다
        rr(c, 0.8 * u, 0.8 * u, 18.4 * u, 18.4 * u, 2.6 * u); c.fillStyle = '#2c2c2c'; c.fill();
        rr(c, 3.4 * u, 3.4 * u, 13.2 * u, 13.2 * u, 1.6 * u); c.fillStyle = '#e4e4e4'; c.fill();
        c.fillStyle = '#b4b4b4'; rr(c, 8.6 * u, 6 * u, 2.8 * u, 8 * u, 0.6 * u); c.fill(); rr(c, 6 * u, 8.6 * u, 8 * u, 2.8 * u, 0.6 * u); c.fill();
        const m = down ? 2.3 * u : 1.4 * u;
        rr(c, m, m + (down ? 0.6 * u : 0), n - 2 * m, n - 2 * m, 2.8 * u); c.fillStyle = down ? 'rgba(255,255,255,0.26)' : 'rgba(255,255,255,0.40)'; c.fill();
        c.lineWidth = 0.5 * u; c.strokeStyle = 'rgba(255,255,255,0.92)'; c.stroke();
        c.beginPath(); c.moveTo(m + 2.2 * u, m + 1.8 * u); c.lineTo(n - m - 5 * u, m + 1.8 * u); c.lineWidth = 0.7 * u; c.lineCap = 'round'; c.strokeStyle = 'rgba(255,255,255,0.75)'; c.stroke();
        return { cx: n / 2, cy: n / 2 + (down ? 0.6 * u : 0), s: 8 * u };
      }
      // 납작: 흰 면 + 검은 테두리 + 아래 딱딱한 그림자. 누르면 그림자 자리로 내려앉는다
      const d = down ? 1.3 * u : 0;
      if (!down) { rr(c, 1.3 * u, 2.6 * u, 17.4 * u, 16.4 * u, 3.4 * u); c.fillStyle = '#111'; c.fill(); }
      rr(c, 1.3 * u, 1.2 * u + d, 17.4 * u, 16.4 * u, 3.4 * u); c.fillStyle = down ? '#d6d6d6' : '#fafafa'; c.fill(); c.lineWidth = 0.9 * u; c.strokeStyle = '#111'; c.stroke();
      return { cx: n / 2, cy: 9.4 * u + d, s: 8.5 * u };
    },
    icon(c, kind, cx, cy, s, color = '#111') {
      if (!kind) return;
      c.save(); c.translate(cx, cy); c.fillStyle = color; c.strokeStyle = color; c.lineJoin = 'round'; c.lineCap = 'round';
      if (kind === 'RE') {
        c.font = `800 ${Math.round(s * 0.62)}px -apple-system, "Helvetica Neue", Arial, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('RE', 0, s * 0.03);
      } else if (kind === 'gun') { // 옆에서 본 리볼버: 총열 → 탄창 → 손잡이 → 방아쇠울
        const k = s / 10; c.beginPath();
        c.moveTo(-5 * k, -2.6 * k); c.lineTo(4.6 * k, -2.6 * k); c.lineTo(4.6 * k, -0.9 * k); c.lineTo(0.6 * k, -0.9 * k); c.lineTo(0.6 * k, 0.2 * k);
        c.lineTo(-1.2 * k, 0.2 * k); c.lineTo(-2.4 * k, 3.6 * k); c.lineTo(-4.9 * k, 3.6 * k); c.lineTo(-3.9 * k, -0.2 * k); c.lineTo(-5 * k, -0.6 * k); c.closePath(); c.fill();
        c.beginPath(); c.arc(-0.2 * k, 1.2 * k, 1.25 * k, 0.1, Math.PI * 0.95); c.lineWidth = 0.55 * k; c.stroke();
        c.fillRect(3.9 * k, -3.4 * k, 0.7 * k, 0.9 * k);
      } else if (kind === 'footL' || kind === 'footR') { // 발바닥: 뒤꿈치 → 패인 아치(안쪽) → 볼 + 발가락 다섯(엄지가 안쪽 · 가장 큼)
        const k = s / 10, inner = kind === 'footL' ? 1 : -1; // 왼발의 안쪽 = 오른쪽
        c.scale(inner, 1);
        c.beginPath();
        c.moveTo(-0.2 * k, 4.6 * k);
        c.bezierCurveTo(-2.2 * k, 4.6 * k, -2.5 * k, 2.4 * k, -2.2 * k, 0.6 * k);   // 바깥쪽 선(곧게)
        c.bezierCurveTo(-2.4 * k, -1.2 * k, -1.6 * k, -2.2 * k, 0.2 * k, -2.2 * k);   // 볼 위쪽
        c.bezierCurveTo(2 * k, -2.2 * k, 2.6 * k, -1.2 * k, 2.2 * k, 0.2 * k);        // 볼 안쪽
        c.bezierCurveTo(1.9 * k, 1.2 * k, 0.7 * k, 1.5 * k, 0.9 * k, 2.6 * k);        // 패인 아치
        c.bezierCurveTo(1.2 * k, 3.8 * k, 1 * k, 4.6 * k, -0.2 * k, 4.6 * k);         // 뒤꿈치
        c.closePath(); c.fill();
        const toes = [[1.75, -3.55, 0.95], [0.25, -4.05, 0.72], [-0.85, -3.75, 0.62], [-1.75, -3.2, 0.55], [-2.45, -2.4, 0.48]];
        for (const [x, y, r] of toes) { c.beginPath(); c.arc(x * k, y * k, r * k, 0, Math.PI * 2); c.fill(); }
      }
      c.restore();
    },
  };
// === KEY-SHARED 여기까지 ===

  /* ---------- 몸통 색 넷: 누를 때마다 다음 색. 띠 = 몸통보다 한 단계 어두운 색 ---------- */
  const SKINS = [
    { name: 'white', body: '#f2f2f2', grip: '#cfcfcf' },
    { name: 'gray', body: '#c9cbcc', grip: '#a9abac' },
    { name: 'cream', body: '#e7dfcb', grip: '#c9c0aa' },
    { name: 'black', body: '#1c1c1c', grip: '#3a3a3a', line: true }, // 검은 몸통은 둘레 안쪽에 2점 흰 선
  ];

  function loadPick(key, count, first) {

  function postRow(r) {

  let skin = loadSkin();

  let feathers = [];         // 떨어지는 깃털 { x, y, born, vx, ph }

  function seededRand(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };

  /* ---------- 장애물 만들기 ---------- */
  // 몇 번째 장애물인지에 따른 틈 크기: 처음 3개는 34칸, 그 뒤 한 칸씩 줄어 26칸에서 멈춘다
  const gapAt = (i) => Math.max(GAP_MIN, GAP_START - Math.max(0, i - (GAP_HOLD - 1)));
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  // i번째 장애물의 틈을 주사위(rnd)로 뽑는다. 비유: 화면 위 끝부터 아래 끝까지 긴 자 위 아무 데나 다트를 던져 틈 가운데를 정한다.
  // → 틈이 가운데에만 몰리지 않고 위아래 전체에 고루 나온다. 다만 바로 앞 틈에서 28칸 넘게는 못 벗어난다(연타로 따라갈 수 있게)
  function pickGap(i, prevCenter, rnd) {
    const gap = gapAt(i);
    const lo = GAP_EDGE, hi = Math.max(lo, GROUND_Y - GAP_EDGE - gap); // 틈 위 끝이 올 수 있는 범위
    let center;
    if (i === 0) {
      center = (CEIL_Y + GROUND_Y - FOOT) / 2 + (rnd() * 2 - 1) * FIRST_SWAY;
    } else {
      center = lo + gap / 2 + rnd() * (hi - lo);
      center = clamp(center, prevCenter - GAP_JUMP, prevCenter + GAP_JUMP);
    }
    return { gap, gapY: clamp(Math.round(center - gap / 2), lo, hi) };
  }
  function makeObstacle(x) {
    const i = obIndex; obIndex += 1;
    let { gap, gapY } = pickGap(i, lastCenter, rand);
    const fixed = testCourse && testCourse[i]; // 검사용: 틈을 직접 정한 코스
    if (fixed && Number.isFinite(Number(fixed.gap))) gap = clamp(Math.round(Number(fixed.gap)), BIRD_H + 2, GROUND_Y - 2);
    if (fixed && Number.isFinite(Number(fixed.gapY))) gapY = Math.round(Number(fixed.gapY));
    gapY = clamp(gapY, 1, Math.max(1, GROUND_Y - 1 - gap));
    lastCenter = gapY + gap / 2;
    return { x, gapY, gap, passed: false };
  }
  // 화면 오른쪽 밖에 다음 장애물이 늘 하나는 기다리게 채운다
  function fillObstacles() {
    let lastX = obstacles.length ? obstacles[obstacles.length - 1].x : null;
    while (lastX === null || lastX < W) {
      const x = lastX === null ? FIRST_X : lastX + SPACING;
      obstacles.push(makeObstacle(x));
      lastX = x;
    }
  }

  /* ---------- 깃털 ---------- */
  function addFeather(t, vx, ph) {
    feathers = feathers.filter((f) => t - f.born < 1100).slice(-11);
    feathers.push({ x: BIRD_X + 1, y: by + 3, born: t, vx, ph });
  }

  /* ---------- 규칙: 새 판 · 퍼덕 · 끝 ---------- */
  function startRound(t) {
    phase = 'play'; score = 0; by = START_Y; vy = 0; scroll = 0;
    obstacles = []; obIndex = 0; lastCenter = 0; feathers = []; flapCount = 0; diedBy = null;
    rand = seedFixed === null ? Math.random : seededRand(seedFixed);
    fillObstacles();
    lastT = t; acc = 0;
  }
  function flap(t) {
    vy = FLAP_V; // 누르는 순간 바로 위쪽 빠르기로 바뀐다(기다림 없음)
    lastFlapAt = t;
    flapCount += 1;
    // 닭은 퍼덕일 때 깃털이 한두 개 떨어진다
    addFeather(t, 20, flapCount);
    if (flapCount % 3 === 0) addFeather(t, 28, flapCount + 2);
  }
  function die(why, t) {
    diedBy = why; deadAt = t; vy = 0;
    phase = why === 'ground' ? 'over' : 'fall';
    if (score > best) { best = score; saveNum(KEYS.best, best); }
    [-12, 4, 18].forEach((vx, k) => addFeather(t, vx, k * 2 + 1)); // 부딪힌 자리에 깃털 셋
  }
  // 물리 한 걸음(120분의 1초). t = 이 걸음이 끝나는 시각
  function stepOnce(t) {
    const dt = STEP_MS / 1000;
    if (phase === 'play') {
      vy = Math.min(MAX_FALL, vy + GRAVITY * dt);
      by += vy * dt;
      scroll += SPEED * dt;
      for (let i = 0; i < obstacles.length; i += 1) obstacles[i].x -= SPEED * dt;
      while (obstacles.length && obstacles[0].x + OB_W < -2) obstacles.shift();
      fillObstacles();
      // 틈 통과: 장애물 오른쪽 끝이 새 왼쪽 끝을 지나가는 순간 +1
      for (let i = 0; i < obstacles.length; i += 1) {
        const ob = obstacles[i];
        if (!ob.passed && ob.x + OB_W <= BIRD_X) { ob.passed = true; score += 1; }
      }
      // 화면 아래 끝: 발끝(판정 네모 아래 2칸)이 땅 줄에 닿으면 끝 → 그 자리에 뒤집혀 눕는다
      if (by + BIRD_H + FOOT >= GROUND_Y) { by = GROUND_Y - BIRD_H; die('ground', t); return; }
      // 화면 위 끝: 볏 끝(판정 네모 위 3칸)이 화면 맨 윗줄을 넘으면 끝
      if (by < CEIL_Y) { by = CEIL_Y; die('ceiling', t); return; }
      for (let i = 0; i < obstacles.length; i += 1) {
        const ob = obstacles[i];
        if (BIRD_X < ob.x + OB_W && BIRD_X + BIRD_W > ob.x && (by < ob.gapY || by + BIRD_H > ob.gapY + ob.gap)) { die('obstacle', t); return; }
      }
    } else if (phase === 'fall') {
      vy = Math.min(MAX_FALL * FALL_MULT, vy + GRAVITY * FALL_MULT * dt);
      by += vy * dt;
      if (by + BIRD_H >= GROUND_Y) { by = GROUND_Y - BIRD_H; vy = 0; phase = 'over'; }
    }
  }
  // 시각 t까지 물리를 따라잡는다: 흐른 시간을 120분의 1초 걸음으로 잘라 차례로 계산(화면 그리는 빠르기와 무관)
  const moving = () => phase === 'play' || phase === 'fall';
  function advanceTo(t) {
    let dt = t - lastT;
    lastT = t;
    if (!(dt > 0)) return;
    if (manual === null && dt > MAX_FRAME) dt = MAX_FRAME;
    if (!moving()) { acc = 0; return; }
    acc += dt;
    while (acc >= STEP_MS - 1e-9 && moving()) {
      acc -= STEP_MS;
      stepOnce(t - Math.max(0, acc));
    }
    if (!moving()) acc = 0;
  }
  // 시각 t에 한 번 누름. 받아들였으면 true, 끝난 직후(0.6초 안)라 무시했으면 false
  function pressAt(t) {
    advanceTo(t);
    if (phase === 'play') {
      flap(t);
    } else if (phase === 'ready') {
      startRound(t); flap(t);
    } else {
      if (t - deadAt < RETRY_MS) return false;
      startRound(t); flap(t);
    }
    render(); startLoop();
    return true;
  }
  // 「한 번 눌렀다 뗀 것」(검사용): 키캡이 잠깐 눌린 그림이 된다
  function press() {
    const ok = pressAt(now());
    flashPushKey();
    return ok;
  }
  // 시작 전 화면으로(최고 기록은 그대로)
  function toReady() {
    phase = 'ready'; score = 0; by = START_Y; vy = 0; scroll = 0;
    obstacles = []; obIndex = 0; feathers = []; diedBy = null; deadAt = -Infinity; lastFlapAt = -Infinity;
    lastT = now(); acc = 0;
  }

  /* ---------- 화면 다시 그리기: 실제 시계일 때는 그릴 때마다 물리를 따라잡고 그린다 ---------- */
  let rafId = 0;
  const shouldLoop = () => manual === null && !document.hidden;
  function loop() {
    rafId = 0;
    if (!shouldLoop()) return;
    advanceTo(now());
    render();
    rafId = requestAnimationFrame(loop);
  }
  function startLoop() {
    if (rafId || !shouldLoop()) return;
    rafId = requestAnimationFrame(loop);
  }
  // 탭을 가렸다 돌아오면: 가려져 있던 시간은 흐르지 않은 것으로 치고 이어 간다
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { if (manual === null) lastT = now(); startLoop(); }
  });

  /* ---------- 키캡 그림 바꾸기(도트 → 매끈 → 스위치 → 납작 → 도트) ---------- */
  function setCap(n) {
    n = Math.floor(Number(n));
    if (!(n >= 0 && n < KeyArt.names.length)) return false;
    cap = n;
    saveNum(CAP_KEY, n);
    drawCapBtn();
    drawKeys();
    return true;
  }
  const nextCap = () => setCap((cap + 1) % KeyArt.names.length);

  /* ---------- 소리 바꾸기(1 → … → 6 → 끔 → 1). 버튼으로 고르면 그 소리를 한 번 들려준다 ---------- */
  function nextSound() { KeySound.next(); drawSoundBtn(); }
  function setSound(i) { KeySound.set(i); drawSoundBtn(); return KeySound.index; } // 검사용: 소리를 내지 않고 고르기만

  /* ---------- 몸통 색 바꾸기 ---------- */
  function setSkin(n) {
    n = Math.floor(Number(n));
    if (!(n >= 0 && n < SKINS.length)) return false;
    skin = n;
    saveNum(SKIN_KEY, n);
    fit();
    return true;
  }
  const nextSkin = () => setSkin((skin + 1) % SKINS.length);

  /* ---------- 몸통 위 작은 버튼(점 글씨) ---------- */
  const el = {
    main: document.getElementById('main'),
    deviceE: document.getElementById('deviceE'),
    bodyArt: document.getElementById('bodyArt'), bodyFill: document.getElementById('bodyFill'), bodyLine: document.getElementById('bodyLine'),
    screen: document.getElementById('screen'),
    soundBtn: document.getElementById('soundBtn'), soundCanvas: document.getElementById('soundCanvas'), soundLabel: document.getElementById('soundLabel'),
    capBtn: document.getElementById('capBtn'), capCanvas: document.getElementById('capCanvas'), capLabel: document.getElementById('capLabel'),
    skinBtn: document.getElementById('skinBtn'), skinCanvas: document.getElementById('skinCanvas'), skinLabel: document.getElementById('skinLabel'),
    keyPush: document.getElementById('keyPush'), keyPushCanvas: document.getElementById('keyPushCanvas'),
    grip: document.getElementById('grip'),
  };
  const dpr = () => window.devicePixelRatio || 1;

  // 작은 버튼의 한 칸 크기(화면 점 1.5개). 아주 좁은 몸통에서 버튼 넷이 한 줄에 안 들어갈 때만 한 단계씩 작아진다
  const BTN_ROWS = 17;  // 작은 버튼 높이(칸)
  const ONE_COLS = 13;  // 한 칸짜리 버튼 폭(칸) = 여백 3 + 상자 7 + 여백 3
  const BTN_GAP = 6;    // 버튼 사이(화면 점)
  let cornerCc = 0;     // 지금 한 칸 크기(기기 점). 0 = 아직 안 정함
  const cornerCell = () => cornerCc || Math.max(1, Math.round(1.5 * dpr()));
  // 몸통 폭 dw에 버튼 넷(게임 · 소리 · 키캡 · 몸통 색) + 틈 셋 + 양쪽 여백이 들어가는 가장 큰 칸 크기를 고른다
  function pickCornerCell(dw) {
    const r = dpr(), side = Math.round(dw * 0.08);
    const cells = gameCols() + 3 * ONE_COLS;
    let cc = Math.max(1, Math.round(1.5 * r));
    while (cc > 1 && (cells * cc) / r + 3 * BTN_GAP + 2 * side > dw) cc -= 1;
    cornerCc = cc;
  }
  function sizeCorner(cv, cw, ch) {
    const r = dpr();
    if (cv.width !== cw || cv.height !== ch) { cv.width = cw; cv.height = ch; }
    cv.style.width = `${cw / r}px`; cv.style.height = `${ch / r}px`;
  }
  // 한 칸짜리 버튼의 바탕(흰 판 + 검은 테두리)을 그리고, 안쪽 7×9칸 상자의 왼쪽 위 칸 자리를 돌려준다
  function drawOneBtn(cv) {
    const ctx = cv.getContext('2d'), cc = cornerCell();
    const cw = ONE_COLS * cc, ch = BTN_ROWS * cc;
    sizeCorner(cv, cw, ch);
    ctx.clearRect(0, 0, cw, ch);
    pixelBlock(ctx, cw, ch, cc, INK); // 몸통 색과 상관없이 흰 바탕
    pixelFrame(ctx, cw, ch, cc, BG);
    return { ctx, cc, bx: 3, by: Math.floor((BTN_ROWS - 9) / 2) };
  }
  // 글자 그림(# = 점)을 칸 자리(x, y)부터 찍는다
  function stampRows(ctx, rows, x, y, cc, color) {
    ctx.fillStyle = color;
    rows.forEach((row, j) => {
      for (let i = 0; i < row.length; i += 1) if (row[i] === '#') ctx.fillRect((x + i) * cc, (y + j) * cc, cc, cc);
    });
  }

  // 소리 버튼: 상자 안에 지금 소리 번호(1~6), 끔이면 가위표
  function drawSoundBtn() {
    const { ctx, cc, bx, by } = drawOneBtn(el.soundCanvas), i = KeySound.index;
    if (i) stampRows(ctx, GLYPHS[i], bx + 1, by + 1, cc, BG);
    else stampRows(ctx, MUTE_X, bx + 1, by + 2, cc, BG);
    const label = i ? `소리 ${i}` : '소리 끔';
    if (el.soundLabel.textContent !== label) el.soundLabel.textContent = label;
  }

  // 키캡 버튼: 상자 안에 지금 키캡 그림을 닮은 작은 그림
  function drawCapBtn() {
    const { ctx, cc, bx, by } = drawOneBtn(el.capCanvas);
    stampRows(ctx, CAP_ICONS[cap], bx + 1, by + 1, cc, BG);
    const label = `키캡 ${KeyArt.names[cap]}`;
    if (el.capLabel.textContent !== label) el.capLabel.textContent = label;
  }

  // 몸통 색 버튼: 상자 하나(7×9칸)를 지금 몸통 색으로 칠하고 검은 테두리 한 칸. 누르면 다음 색
  function drawSkinBtn() {
    const { ctx, cc, bx, by } = drawOneBtn(el.skinCanvas);
    ctx.fillStyle = BG;
    ctx.fillRect(bx * cc, by * cc, 7 * cc, 9 * cc);
    ctx.fillStyle = SKINS[skin].body;
    ctx.fillRect((bx + 1) * cc, (by + 1) * cc, 5 * cc, 7 * cc);
    const label = `몸통 ${SKINS[skin].name}`;
    if (el.skinLabel.textContent !== label) el.skinLabel.textContent = label;
  }

  /* ---------- 키캡 하나 ----------
     비유: 진짜 키보드 키. 누르는 순간 한 번 퍼덕이고, 손을 떼기 전까지는 아무리 다른 손가락으로 두드려도 다시 세지 않는다.
     keyHold = 지금 그 키를 누르고 있는 것(손가락 번호 · 'kb:Space' 같은 키보드 · 'test'), 안 누르면 null */
  const keyHold = { push: null };
  let keyCell = 1;        // 키캡 그림 한 칸이 기기 화면 점 몇 개인지
  let pushFlash = false;  // 검사용 press()로 잠깐 눌린 그림을 보여 주는 중
  let pushFlashTimer = 0;

  function holdKey(name, who) {
    if (keyHold[name] !== null) return false; // 이미 눌려 있음: 떼기 전엔 다시 세지 않는다
    keyHold[name] = who;
    if (who !== 'test') { KeySound.unlock(); KeySound.down(); } // 딸깍(검사용 손잡이로 누를 때는 조용히)
    pushFlash = false; pressAt(now());
    drawKeys();
    return true;
  }
  // who를 주면 그 손가락(또는 키보드 키)이 누른 경우에만 뗀다
  function releaseKey(name, who) {
    if (keyHold[name] === null) return false;
    if (who !== undefined && keyHold[name] !== who) return false;
    if (keyHold[name] !== 'test') KeySound.up(); // 떼는 소리(검사용 누름은 조용히)
    keyHold[name] = null;
    drawKeys();
    return true;
  }
  function releaseAllKeys() { releaseKey('push'); }
  function flashPushKey() {
    if (keyHold.push !== null) return;
    pushFlash = true; drawKeys();
    clearTimeout(pushFlashTimer);
    pushFlashTimer = setTimeout(() => { pushFlash = false; drawKeys(); }, 90);
  }

  // 키캡 하나 그리기(20×20칸, 두 색). 바깥 네모 = 스위치 집, 안쪽 작은 네모 = 키 윗면, 그 아래 무늬 띠 = 키 옆면.
  // 누르면 윗면이 3칸 내려가고 옆면이 그만큼 짧아진다(바닥 쪽 끝은 그대로).
  // 키캡 그림이 도트(0)가 아니면 공용 그림(KeyArt)으로 그린다 — 크기 · 자리는 같고 그림만 다르다
  function drawKey(cv, down) {
    const ctx = cv.getContext('2d'), c = keyCell, n = KEY_CELLS * c;
    if (cap !== 0) { KeyArt.draw(ctx, n, cap, down); return; }
    const R = (x, y, w, h, color) => { ctx.fillStyle = color; ctx.fillRect(x * c, y * c, w * c, h * c); };
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, n, n);
    pixelBlock(ctx, n, n, c, INK);
    pixelFrame(ctx, n, n, c, BG);
    const drop = down ? KEY_PRESS_DROP : 0;
    const capX = 3, capW = 14, topY = 2 + drop, topH = 10;
    const sideY = topY + topH, sideH = 4 - drop; // 옆면 띠(맨 아랫줄은 늘 15번째 줄)
    for (let y = sideY; y < sideY + sideH; y += 1) {
      R(capX, y, 1, 1, BG); R(capX + capW - 1, y, 1, 1, BG);
      for (let x = capX + 1; x < capX + capW - 1; x += 1) if ((x + y) % 2 === 0) R(x, y, 1, 1, BG);
    }
    R(capX + 1, sideY + sideH - 1, capW - 2, 1, BG);
    // 윗면: 흰 판 + 모서리 깎은 검은 테두리
    ctx.setTransform(1, 0, 0, 1, capX * c, topY * c);
    pixelBlock(ctx, capW * c, topH * c, c, INK);
    pixelFrame(ctx, capW * c, topH * c, c, BG);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }
  function drawKeys() {
    drawKey(el.keyPushCanvas, keyHold.push !== null || pushFlash);
  }

  // 읽어 주는 기능용 글: 화면 이름표에 점수를 함께 둔다
  function syncText() {
    const aria = `퍼덕, ${score}`;
    if (el.screen.getAttribute('aria-label') !== aria) el.screen.setAttribute('aria-label', aria);
  }

  /* ---------- 그리기: 128×96칸 작은 판에 찍은 뒤 그대로 키운다 ---------- */
  const g = el.screen.getContext('2d');
  const board = document.createElement('canvas');
  const c = board.getContext('2d');
  let H = 0;         // 지금 검은 화면 세로 칸 수(= 놀이판 세로 칸 수)

  let ink = null; // 지금 붓 색(같은 색이면 다시 고르지 않아 빠르게)
  function dot(x, y, color) {
    if (x < 0 || x >= W || y < 0 || y >= H) return;
    if (color !== ink) { c.fillStyle = color; ink = color; }
    c.fillRect(x, y, 1, 1);
  }
  function box(x, y, w, h, color) {
    c.fillStyle = color; ink = color;
    c.fillRect(x, y, w, h);
  }
  function sprite(x, y, rows, color = INK, k = 1) {
    rows.forEach((row, j) => {
      for (let i = 0; i < row.length; i += 1) {
        if (row[i] !== '#') continue;
        for (let dy = 0; dy < k; dy += 1) for (let dx = 0; dx < k; dx += 1) dot(x + i * k + dx, y + j * k + dy, color);
      }
    });
  }
  // 한 줄 찍기(장애물용)
  function rowDots(x, y, row) {
    for (let i = 0; i < row.length; i += 1) if (row[i] === '#') dot(x + i, y, INK);
  }

  // 작은 판의 세로 칸 수를 정한다(늘 96칸 — 놀이판이 화면 전체를 쓴다)
  function setRows(rows) {
    if (rows === H) return;
    H = rows;
    board.width = W; board.height = H; ink = null;
  }

  // 점 글씨 한 줄을 판에 찍는다. 글자 둘레를 한 칸 검게 비워서 뒤에 무엇이 지나가도 읽히게 한다
  function boardText(keys, x, y, k) {
    for (let pass = 0; pass < 2; pass += 1) {
      let cx = x;
      keys.forEach((key) => {
        const gl = GLYPHS[key];
        gl.forEach((row, j) => {
          for (let i = 0; i < row.length; i += 1) {
            if (row[i] !== '#') continue;
            if (pass === 0) box(cx + i * k - 1, y + j * k - 1, k + 2, k + 2, BG);
            else box(cx + i * k, y + j * k, k, k, INK);
          }
        });
        cx += (gl[0].length + 1) * k;
      });
    }
  }

  // 지금 닭 그림: 몸 · 날개 선 · 바람 자국. 시각 t에 따라 날갯짓 장면이 바뀐다
  function birdLook(t) {
    // 살아 있는 동안 작은 날개를 쉬지 않고 미친 듯이 퍼덕인다. 떨어질 때는 다리를 버둥
    const alive = phase === 'ready' || phase === 'play';
    const beat = mod(Math.floor(t / 45), 2);
    const legs = (phase === 'play' && vy > 25) ? mod(Math.floor(t / 70), 2) : 0;
    return { rows: CHICKEN[legs], holes: CHICKEN_WING[alive ? beat : 0], ticks: alive ? CHICKEN_TICKS[beat] : [], pad: BIRD_PAD };
  }
  // 새 그리기. yTop = 판정 네모 위 끝(화면 줄). flip = 뒤집힌 모습(끝났을 때): 그림 아래 끝을 판정 네모 아래 끝에 맞춘다
  function drawBird(yTop, look, flip) {
    const rows = look.rows, n = rows.length, x = BIRD_X - 1;
    const y0 = flip ? yTop + BIRD_H - n : yTop - look.pad;
    const rowY = (j) => y0 + (flip ? n - 1 - j : j);
    // 둘레를 한 칸 검게 비워서 산 · 구름 위에 겹쳐도 몸이 또렷하게 보이게 한다
    rows.forEach((row, j) => {
      for (let i = 0; i < row.length; i += 1) {
        if (row[i] === '.') continue;
        for (let dy = -1; dy <= 1; dy += 1) for (let dx = -1; dx <= 1; dx += 1) dot(x + i + dx, rowY(j) + dy, BG);
      }
    });
    rows.forEach((row, j) => {
      for (let i = 0; i < row.length; i += 1) if (row[i] === '#') dot(x + i, rowY(j), INK);
    });
    look.holes.forEach(([j, i]) => dot(x + i, rowY(j), BG));
    if (!flip) look.ticks.forEach(([j, i]) => dot(x + i, rowY(j), INK));
    return y0;
  }
  // 장애물 하나: 위 = 화면 위 끝에서 바로 매달려 내려온 곶감 줄, 아래 = 화면 아래 끝(땅 줄)에서 솟은 울타리 말뚝. 뒤 풍경은 지우고 그린다
  function drawObstacle(ob) {
    const x = Math.floor(ob.x);
    if (x >= W || x + OB_W <= 0) return;
    const t1 = ob.gapY; // 곶감 줄: 0줄(화면 맨 위)부터 틈 위 끝까지
    box(x, 0, OB_W, t1, BG);
    for (let r = 0; t1 - 1 - r >= 0; r += 1) rowDots(x, t1 - 1 - r, HANG[HANG.length - 1 - (r % HANG.length)]);
    const b0 = ob.gapY + ob.gap, b1 = GROUND_Y; // 말뚝: 틈 아래 끝부터 땅 줄까지
    box(x, b0, OB_W, b1 - b0, BG);
    for (let r = 0; b0 + r < b1; r += 1) rowDots(x, b0 + r, postRow(r));
  }

  // 왼쪽 위 점수판의 자리(칸): 왕관 · 최고 기록 줄 · 지금 점수
  function hudRects() {
    const bw = CROWN[0].length + 2 + measure([...String(best)]).w * HUD_BEST_K;
    return {
      crown: { x: HUD_X, y: HUD_BEST_Y + 5, w: CROWN[0].length, h: CROWN.length },
      best: { x: HUD_X, y: HUD_BEST_Y, w: bw, h: 7 * HUD_BEST_K },
      score: { x: HUD_X, y: HUD_SCORE_Y, w: measure([...String(score)]).w * HUD_SCORE_K, h: 7 * HUD_SCORE_K },
    };
  }
  // 왼쪽 위 점수판: 위 줄 = 왕관 + 최고 기록, 그 아래 = 지금 점수(크게).
  // 최고 기록 줄은 뒤를 통째로 검게 비운 판 위에 찍는다 → 곶감 줄이 뒤로 지나가도 숫자가 그대로 읽힌다
  function drawHud() {
    const r = hudRects();
    box(r.best.x - 1, r.best.y - 1, r.best.w + 2, r.best.h + 2, BG);
    sprite(r.crown.x, r.crown.y, CROWN);
    boardText([...String(best)], HUD_X + CROWN[0].length + 2, HUD_BEST_Y, HUD_BEST_K);
    boardText([...String(score)], HUD_X, HUD_SCORE_Y, HUD_SCORE_K);
  }

  function render() {
    const t = now(), sx = Math.floor(scroll);
    box(0, 0, W, H, BG);

    // 구름 두 점(가장 느리게)
    const cloudShift = Math.floor(scroll / CLOUD_SLOW);
    CLOUDS.forEach(([home, y, rows]) => {
      const w = rows[0].length;
      sprite(mod(home + w - cloudShift, W + 24) - w, y, rows);
    });
    // 먼 산 능선(느리게): 화면 왼쪽 끝부터 오른쪽 끝까지
    const ridgeShift = Math.floor(scroll / RIDGE_SLOW);
    for (let x = 0; x < W; x += 1) dot(x, RIDGE_Y + RIDGE_H[mod(x + ridgeShift, RIDGE_H.length)], INK);

    // 땅: 화면 맨 아래 2칸뿐. 땅 줄 한 줄 + 그 아래 흙 점 한 줄(장애물과 같은 빠르기로 흘러간다). 화면 위쪽에는 아무것도 깔지 않는다
    box(0, GROUND_Y, W, 1, INK);
    for (let x = 0; x < W; x += 1) if (GROUND_DOTS[mod(x + sx, GROUND_DOTS.length)] === '#') dot(x, GROUND_Y + 1, INK);
    // 땅 위 작은 것들(돌 · 풀)
    DECOR.forEach(([home, rows]) => {
      const x = mod(home - sx, DECOR_LOOP) - 16;
      if (x < W) sprite(x, GROUND_Y - rows.length, rows);
    });

    // 장애물
    for (let i = 0; i < obstacles.length; i += 1) drawObstacle(obstacles[i]);

    // 깃털: 살랑살랑 흔들리며 내려와 땅에 닿으면 멈춘다
    feathers.forEach((f) => {
      const age = (t - f.born) / 1000;
      if (age < 0 || age > 1) return;
      const fx = Math.round(f.x - f.vx * age + Math.sin(age * 9 + f.ph) * 1.5);
      const fy = Math.min(GROUND_Y - 2, Math.round(f.y + 16 * age));
      const tilt = mod(Math.floor(age * 6 + f.ph), 2) ? 1 : -1;
      dot(fx, fy, INK); dot(fx + 1, fy + tilt, INK);
    });

    // 왼쪽 위 점수판(최고 기록 + 지금 점수): 시작 전 · 나는 중 · 끝 화면 모두. 장애물보다 앞, 닭보다는 뒤에 그린다
    drawHud();

    const dead = phase === 'fall' || phase === 'over';
    if (dead) {
      // 끝: 가운데에 이번 점수를 아주 크게(최고 기록은 왼쪽 위에 그대로 있다)
      const sc = [...String(score)], sw = measure(sc).w * END_K, px = Math.floor((W - sw) / 2);
      box(px - 3, END_Y - 3, sw + 6, 7 * END_K + 6, BG);
      boardText(sc, px, END_Y, END_K);
    }

    // 닭: 시작 전에는 제자리에서 둥실(위아래 2칸), 끝난 뒤에는 뒤집혀서
    const look = birdLook(t);
    const showY = phase === 'ready' ? START_Y + Math.round(Math.sin(t / 1400 * Math.PI * 2) * 2) : Math.round(by);
    const top = drawBird(showY, look, dead);
    // 땅에 누우면 머리 위에 별이 깜빡
    if (phase === 'over') {
      const blink = mod(Math.floor((t - deadAt) / 300), 2);
      sprite(BIRD_X + (blink ? 8 : -3), top - 5 - blink, STAR);
      dot(BIRD_X + (blink ? -1 : 9), top - 3, INK);
    }

    // 작은 판을 큰 그림판에 옮긴다
    g.imageSmoothingEnabled = false;
    g.drawImage(board, 0, 0, el.screen.width, el.screen.height);
    syncText();
  }

  /* ---------- 몸통 겉모양: 위 두 모서리는 둥글게, 아래 두 모서리는 비스듬히 깎기 ----------
     inset = 바깥선에서 안으로 들어온 거리(검은 몸통의 안쪽 흰 선을 그릴 때 씀) */
  function bodyPath(w, h, rad, bevel, inset) {
    const i = inset, R = Math.max(0, rad - i), B = Math.max(0, bevel - i * 0.41);
    const x0 = i, y0 = i, x1 = w - i, y1 = h - i;
    return `M ${x0} ${y0 + R} A ${R} ${R} 0 0 1 ${x0 + R} ${y0} L ${x1 - R} ${y0} A ${R} ${R} 0 0 1 ${x1} ${y0 + R} `
      + `L ${x1} ${y1 - B} L ${x1 - B} ${y1} L ${x0 + B} ${y1} L ${x0} ${y1 - B} Z`;
  }
  function drawBody(dw, dh, rad, bevel) {
    const sk = SKINS[skin];
    el.bodyArt.setAttribute('viewBox', `0 0 ${dw} ${dh}`);
    el.bodyArt.setAttribute('width', dw); el.bodyArt.setAttribute('height', dh);
    el.bodyFill.setAttribute('d', bodyPath(dw, dh, rad, bevel, 0));
    el.bodyFill.setAttribute('fill', sk.body);
    if (sk.line) {
      el.bodyLine.setAttribute('d', bodyPath(dw, dh, rad, bevel, 1)); // 굵기 2 선의 가운데를 1 안쪽에 → 바깥선 안쪽 0~2점
      el.bodyLine.setAttribute('stroke', INK); el.bodyLine.setAttribute('stroke-width', '2');
    } else {
      el.bodyLine.removeAttribute('d');
    }
  }

  // 오돌토돌한 띠: 본보기 기기 아래쪽 회색 띠. 모서리 둥근 직사각형을 띠 색으로 칠하고, 몸통 색 점을 흩뿌린다
  function drawGrip(gw, gh) {
    const cv = el.grip, r = dpr(), ctx = cv.getContext('2d'), sk = SKINS[skin];
    const w = Math.max(1, Math.round(gw * r)), h = Math.max(1, Math.round(gh * r));
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    cv.style.width = `${w / r}px`; cv.style.height = `${h / r}px`;
    ctx.clearRect(0, 0, w, h);
    const rr = Math.min(h / 2, Math.round(h * 0.3));
    ctx.beginPath();
    ctx.moveTo(rr, 0); ctx.lineTo(w - rr, 0); ctx.arcTo(w, 0, w, rr, rr); ctx.lineTo(w, h - rr); ctx.arcTo(w, h, w - rr, h, rr);
    ctx.lineTo(rr, h); ctx.arcTo(0, h, 0, h - rr, rr); ctx.lineTo(0, rr); ctx.arcTo(0, 0, rr, 0, rr); ctx.closePath();
    ctx.fillStyle = sk.grip; ctx.fill();
    // 점 무늬(여섯 게임 같은 규칙): 점 하나 = 화면 점 2개, 가로 6 · 세로 4 간격, 한 줄 걸러 반 칸 어긋나게
    ctx.save(); ctx.clip();
    const p = Math.max(1, Math.round(2 * r));
    ctx.fillStyle = sk.body;
    for (let row = 0, y = 2 * p; y + p <= h - 2 * p; row += 1, y += 2 * p) {
      for (let x = 2 * p + (row % 2 ? Math.round(1.5 * p) : 0); x + p <= w - 2 * p; x += 3 * p) ctx.fillRect(x, y, p, p);
    }
    ctx.restore();
  }

  /* ---------- 자리 맞추기 ----------
     몸통 폭 dw = min(창 폭 − 28, 460). 위에서부터: 띠(작은 버튼 줄 + 위아래 10) → 검은 화면 → 7% → 키캡 → 7% → 오돌토돌한 띠(7%) → 7%.
     합이 창 높이 − 28을 넘으면 화면 칸 크기부터, 그다음 키캡 크기를 줄인다(키캡은 72 아래로 안 줄임) */
  let bandSide = 0; // 몸통 옆 끝에서 띠 버튼까지의 여백(화면 점)
  function fit() { fitDevice(); placeGameBtn(); }
  // 창이 낮으면(가로로 눕힌 폰 등) 몸통 폭부터 줄인다 — 검수 지적: 폭은 그대로 두고 화면만 줄이니 화면이 점 하나 크기가 됐다.
  // 화면 칸 · 키캡을 제 크기로 놓았을 때(위 띠 + 화면 + 키캡 + 틈 넷) 창 높이 안에 들어가는 가장 큰 폭을 찾는다
  function fitWidth(maxW, roomH, band, rows, keyShare) {
    const r = dpr();
    for (let w = maxW; w > 160; w -= 4) {
      const cell = Math.max(1, Math.floor(w * 0.86 * r / 128));
      if (band + (rows * cell) / r + Math.max(72, w * keyShare) + 4 * Math.round(w * 0.07) <= roomH) return w;
    }
    return Math.min(maxW, 160);
  }
  function fitDevice() {
    const r = dpr(), rows = ROWS;
    const mb = el.main.getBoundingClientRect();
    const limitH = mb.height - EDGE;
    // 작은 버튼 칸 크기를 먼저 정하고(띠 높이가 여기서 나온다), 몸통 폭을 정한 뒤 그 폭으로 한 번 더 맞춘다
    const maxW = Math.max(120, Math.floor(Math.min(mb.width - EDGE, DEVICE_MAX)));
    pickCornerCell(maxW);
    const dw = fitWidth(maxW, limitH, (BTN_ROWS * cornerCell()) / r + 2 * BAND_PAD, rows, KEY_SHARE_ONE);
    pickCornerCell(dw);
    const band = (BTN_ROWS * cornerCell()) / r + 2 * BAND_PAD;
    drawSoundBtn(); drawCapBtn(); drawSkinBtn();
    const gap = Math.round(dw * GAP_SHARE);
    const gh = gap; // 띠 높이 = 몸통 폭의 7%

    // 키캡 크기: 20칸 × 정수 점이 되는 크기 중 목표(몸통 폭의 40%)에 가장 가까운 것, 72 ~ 190 사이
    const want = dw * KEY_SHARE_ONE;
    let kc = 0, bestFit = Infinity;
    for (let cc = 1; KEY_CELLS * cc / r <= KEY_MAX + 0.01; cc += 1) {
      const size = KEY_CELLS * cc / r;
      if (size >= KEY_MIN - 0.01 && Math.abs(size - want) < bestFit) { kc = cc; bestFit = Math.abs(size - want); }
    }
    if (!kc) kc = Math.max(1, Math.ceil(KEY_MIN * r / KEY_CELLS));
    const kcMin = Math.ceil((KEY_MIN - 0.01) * r / KEY_CELLS);

    // 검은 화면: 128 × rows칸, 한 칸 = 정수 기기 화면 점
    let cellPx = Math.max(1, Math.floor(dw * SCREEN_SHARE * r / W));
    const total = (cp, k) => band + (rows * cp) / r + gap + (KEY_CELLS * k) / r + gap + gh + gap;
    while (cellPx > 1 && total(cellPx, kc) > limitH) cellPx -= 1;
    while (kc > kcMin && total(cellPx, kc) > limitH) kc -= 1;
    // 몸통을 세로로 길게(형님 「위아래 여백이 너무 많아」): 폭의 1.5배까지(창 높이 안에서), 남는 높이를 세 틈(화면~키캡 · 키캡~띠 · 띠~몸통 끝)에 똑같이 나눠 넣는다
    const lift = Math.max(0, Math.floor((Math.min(limitH, Math.round(dw * BODY_TALL)) - total(cellPx, kc)) / 3));
    keyCell = kc;
    const ks = KEY_CELLS * kc / r;
    const sw = (W * cellPx) / r, sh = (rows * cellPx) / r;

    const keyTop = Math.round(band + sh + gap + lift);
    const gripTop = Math.round(keyTop + ks + gap + lift);
    const dh = Math.round(gripTop + gh + gap + lift);

    // 몸통
    const ds = el.deviceE.style, rad = Math.round(dw * CORNER_SHARE), bevel = Math.round(dw * CORNER_SHARE);
    ds.width = `${dw}px`; ds.height = `${dh}px`;
    drawBody(dw, dh, rad, bevel);

    // 위 띠: 왼쪽 끝 게임 버튼 · 오른쪽 묶음 = 소리 → 키캡 → 몸통 색(오른쪽 끝부터 거꾸로 놓는다)
    const side = Math.round(dw * 0.08);
    bandSide = side;
    const one = (ONE_COLS * cornerCell()) / r;
    [el.skinBtn, el.capBtn, el.soundBtn].forEach((b, i) => {
      b.style.left = ''; b.style.right = `${side + i * (one + BTN_GAP)}px`; b.style.top = `${BAND_PAD}px`;
    });

    // 검은 화면: 가운데 정렬
    setRows(rows);
    if (el.screen.width !== W * cellPx || el.screen.height !== H * cellPx) { el.screen.width = W * cellPx; el.screen.height = H * cellPx; }
    el.screen.style.width = `${sw}px`; el.screen.style.height = `${sh}px`;
    el.screen.style.left = `${Math.round((dw - sw) / 2)}px`;
    el.screen.style.top = `${Math.round(band)}px`;

    // 키캡 하나: 가운데
    const n = KEY_CELLS * kc, cv = el.keyPushCanvas, b = el.keyPush;
    if (cv.width !== n || cv.height !== n) { cv.width = n; cv.height = n; }
    cv.style.width = `${ks}px`; cv.style.height = `${ks}px`;
    b.style.left = `${Math.round((dw - ks) / 2)}px`; b.style.top = `${keyTop}px`;
    b.style.width = `${ks}px`; b.style.height = `${ks}px`;

    // 오돌토돌한 띠: 가운데
    const gw = Math.round(dw * GRIP_SHARE);
    drawGrip(gw, gh);
    el.grip.style.left = `${Math.round((dw - gw) / 2)}px`; el.grip.style.top = `${gripTop}px`;

    drawKeys();
    render();
  }

  /* ---------- 게임 버튼: 띠의 왼쪽 끝, 누른 숫자 칸의 게임으로 바로 간다 ----------
     비유: TV 리모컨 숫자 버튼. 1 시지프스 · 2 10.00000 · 3 결투 · 4 100m · 5 퍼덕 · 6 멀리뛰기 중 누른 번호로 곧장.
     여섯 게임은 같은 전시장의 옆 폴더라서 「한 칸 위 폴더 → 옆 폴더」 주소로 옮겨 간다.
     이 컴퓨터의 폴더 이름(local)과 인터넷 전시장의 폴더 이름(web)이 달라서 둘 다 적어 두고,
     지금 열린 폴더 이름이 어느 쪽인지 보고 같은 쪽 이름으로 간다.
     키보드 바로 가기는 두지 않는다(100m의 F · J 사이 G처럼, 달리다 스치면 판이 날아가서).
     (fit()이 처음 불리는 때보다 앞서 쓰일 수 있어서 값은 const 대신 함수로 돌려준다) */
  function gameHere() { return '5'; }
  function gameList() {
    return [
      { id: '1', name: '시지프스', local: 'streak-sisyphus', web: 'hold-on-sisyphus' },
      { id: '2', name: '10.00000', local: 'key-ten', web: 'hold-on-key-ten' },
      { id: '3', name: '결투', local: 'key-duel', web: 'hold-on-key-duel' },
      { id: '4', name: '100m', local: 'key-100m', web: 'hold-on-key-100m' },
      { id: '5', name: '퍼덕', local: 'key-flap', web: 'hold-on-key-flap' },
      { id: '6', name: '멀리뛰기', local: 'key-leap', web: 'hold-on-key-leap' },
    ];
  }
  function gameUrl(id) {
    const list = gameList(), target = list.find((g) => g.id === String(id));
    if (!target) return null;
    // 지금 폴더 이름: …/hold-on-key-ten/ → hold-on-key-ten, …/key-ten/index.html → key-ten
    const parts = location.pathname.split('/').filter(Boolean);
    if (parts.length && /\.html?$/i.test(parts[parts.length - 1])) parts.pop();
    const here = decodeURIComponent(parts[parts.length - 1] || '');
    const onWeb = list.some((g) => g.web === here);
    return onWeb ? `../${target.web}/` : `../${target.local}/index.html`;
  }
  // 넘어간 게임마다 뒤로 가기 기록이 쌓이지 않게 지금 칸을 바꿔 끼운다. 지금 게임 번호면 아무 일 없음
  function goGame(id) {
    if (String(id) === gameHere()) return false;
    const url = gameUrl(id);
    if (!url) return false;
    location.replace(url);
    return true;
  }
  // 그림: 테두리 안에 1~6, 지금 게임 숫자만 검게 칠한 칸에 흰 글씨(칸 수 = 게임 목록 길이)
  const GAME_BOX_W = 7, GAME_BOX_H = 9;                // 글자 한 칸 상자(글자 5×7 + 둘레 한 칸)
  function gameCols() { return 3 + gameList().length * (GAME_BOX_W + 1) - 1 + 3; }
  function drawGameBtn(gb) {
    const cv = gb.querySelector('canvas'), ctx = cv.getContext('2d'), cc = cornerCell(), list = gameList();
    const cols = gameCols(), rowsN = BTN_ROWS;
    const cw = cols * cc, ch = rowsN * cc;
    sizeCorner(cv, cw, ch);
    ctx.clearRect(0, 0, cw, ch);
    pixelBlock(ctx, cw, ch, cc, INK);
    pixelFrame(ctx, cw, ch, cc, BG);
    list.forEach((g, i) => {
      const bx = (3 + i * (GAME_BOX_W + 1)) * cc, by2 = Math.floor((rowsN - GAME_BOX_H) / 2) * cc;
      if (g.id === gameHere()) {
        ctx.fillStyle = BG; ctx.fillRect(bx, by2, GAME_BOX_W * cc, GAME_BOX_H * cc);
        drawText(ctx, [g.id], bx + cc, by2 + cc, cc, INK);
      } else {
        drawText(ctx, [g.id], bx + cc, by2 + cc, cc, BG);
      }
    });
    const label = `게임 ${gameHere()} ${list.find((g) => g.id === gameHere()).name}`;
    const gl = document.getElementById('gameLabel');
    if (gl && gl.textContent !== label) gl.textContent = label;
  }
  // 버튼 안 가로 위치(화면 점, 버튼 왼쪽 끝 = 0) → 몇 번째 숫자 칸인지.
  // 칸 경계 = 글자 상자 경계, 상자 사이 한 칸 틈은 그 가운데를 기준으로 가까운 칸, 양 끝 여백은 맨 끝 칸
  function gameIndexAt(xCss) {
    const n = gameList().length, cellsX = (xCss * dpr()) / cornerCell();
    const i = Math.floor((cellsX - 3 + 0.5) / (GAME_BOX_W + 1));
    return Math.max(0, Math.min(n - 1, i));
  }
  // 자리: 띠의 왼쪽 끝(몸통 왼쪽에서 bandSide)
  function placeGameBtn() {
    const gb = document.getElementById('gameBtn');
    if (!gb) return;
    drawGameBtn(gb);
    gb.style.left = `${bandSide}px`;
    gb.style.top = `${BAND_PAD}px`;
  }
  // 누르는 순간 그 번호 게임으로. 게임 누름으로 세지 않는다(아래로 퍼지지 않게 막음)
  document.getElementById('gameBtn').addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    const rect = e.currentTarget.getBoundingClientRect();
    goGame(gameList()[gameIndexAt(e.clientX - rect.left)].id);
  });
  if (window.ResizeObserver) new ResizeObserver(fit).observe(el.main);
  window.addEventListener('resize', fit);

  /* ---------- 입력: 손가락이 닿는 순간 한 번 퍼덕 ---------- */
  const mainPointer = (e) => e.pointerType !== 'mouse' || e.button === 0;
  // 작은 버튼: 퍼덕으로 세지 않는다
  el.soundBtn.addEventListener('pointerdown', (e) => {
    if (!mainPointer(e)) return;
    e.preventDefault(); e.stopPropagation();
    nextSound();
  });
  el.capBtn.addEventListener('pointerdown', (e) => {
    if (!mainPointer(e)) return;
    e.preventDefault(); e.stopPropagation();
    nextCap();
  });
  el.skinBtn.addEventListener('pointerdown', (e) => {
    if (!mainPointer(e)) return;
    e.preventDefault(); e.stopPropagation();
    nextSkin();
  });
  // 키캡: 누르는 순간 센다. 그 손가락이 떼어지거나, 키 밖으로 미끄러지거나, 화면 밖으로 나가면 뗀 것
  el.keyPush.addEventListener('pointerdown', (e) => {
    if (!mainPointer(e)) return;
    e.preventDefault(); e.stopPropagation();
    // 손가락을 키에 묶어 두지 않아야 키 밖으로 미끄러진 것을 알아챈다
    const t = e.currentTarget;
    try { if (t.hasPointerCapture && t.hasPointerCapture(e.pointerId)) t.releasePointerCapture(e.pointerId); } catch (err) { /* 그대로 */ }
    // 새로 닿은 첫 손가락인데 키가 눌린 채 남아 있으면, 떼는 신호를 놓친 낡은 누름이다 → 풀고 받는다(키가 먹통이 되지 않게)
    if (e.isPrimary && keyHold.push !== null && keyHold.push !== e.pointerId) releaseKey('push');
    holdKey('push', e.pointerId);
  });
  const insideRect = (node, x, y) => {
    const b = node.getBoundingClientRect();
    return x >= b.left && x <= b.right && y >= b.top && y <= b.bottom;
  };
  window.addEventListener('pointermove', (e) => {
    if (keyHold.push === e.pointerId && !insideRect(el.keyPush, e.clientX, e.clientY)) releaseKey('push', e.pointerId);
  });
  ['pointerup', 'pointercancel'].forEach((type) => window.addEventListener(type, (e) => {
    releaseKey('push', e.pointerId);
  }));
  // 마우스가 창 밖으로 나감(옮겨 간 곳이 없음)
  window.addEventListener('pointerout', (e) => {
    if (e.relatedTarget) return;
    releaseKey('push', e.pointerId);
  });
  window.addEventListener('blur', releaseAllKeys);
  document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAllKeys(); });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter') releaseKey('push', `kb:${e.code}`);
  });

  window.addEventListener('keydown', (e) => {
    const plain = !e.metaKey && !e.ctrlKey && !e.altKey;
    if (e.code === 'KeyS' && plain) { // 소리 바꾸기
      e.preventDefault();
      if (!e.repeat) nextSound();
      return;
    }
    if (e.code === 'KeyK' && plain) { // 키캡 그림 바꾸기
      e.preventDefault();
      if (!e.repeat) nextCap();
      return;
    }
    if (e.code === 'KeyC' && plain) {
      e.preventDefault();
      if (!e.repeat) nextSkin();
      return;
    }
    if (e.code !== 'Space' && e.code !== 'Enter' && e.code !== 'NumpadEnter') return;
    if (!plain) return; // Cmd · Ctrl · Alt와 같이 누른 것은 퍼덕이 아니다(떼는 신호가 안 와서 키가 눌린 채 남는 것도 막음)
    e.preventDefault();
    if (e.repeat) return; // 꾹 누르고 있어 저절로 반복되는 입력은 무시
    // 같은 키가 눌린 채 남아 있는데 새로 눌렸다면 떼는 신호를 놓친 것이다 → 풀고 받는다(키보드가 먹통이 되지 않게)
    if (keyHold.push === `kb:${e.code}`) releaseKey('push');
    holdKey('push', `kb:${e.code}`); // 키캡을 누른 것과 같음(떼면 keyup에서 올라옴)
  });
  // 연타할 때 화면이 확대되거나 끌리거나, 길게 눌러 메뉴가 뜨지 않게 막는다
  const block = (e) => e.preventDefault();
  ['touchstart', 'touchmove', 'touchend'].forEach((name) => document.addEventListener(name, block, { passive: false }));
  ['gesturestart', 'dblclick', 'contextmenu', 'selectstart', 'dragstart'].forEach((name) => document.addEventListener(name, block));

  fit();
  startLoop();

  /* ---------- 검사용 손잡이: 게임에는 영향이 없다 ---------- */
  const toInt = (n) => {
    const value = Math.floor(Number(n));
    return Number.isFinite(value) ? Math.max(0, Math.min(Number.MAX_SAFE_INTEGER, value)) : 0;
  };
  const rectOf = (node) => {
    const b = node.getBoundingClientRect();
    return { x: b.left, y: b.top, w: b.width, h: b.height };
  };
  window.__STREAK_TEST__ = {
    state() {
      return {
        phase, score, best, diedBy, label: LABEL,
        bird: 'chicken',                                                      // 캐릭터는 닭 하나
        y: by, vy,
        birdRect: { x: BIRD_X, y: by, w: BIRD_W, h: BIRD_H },                 // 판정 네모(칸)
        obstacles: obstacles.map((o) => ({ x: o.x, gapY: o.gapY, gap: o.gap, passed: o.passed })),
        retryIn: (phase === 'fall' || phase === 'over') ? Math.max(0, RETRY_MS - (now() - deadAt)) : 0, // 새 판까지 남은 시간(ms)
        tuning: {
          ceil: CEIL_Y, ground: GROUND_Y, foot: FOOT, pad: BIRD_PAD, startY: START_Y, flapV: FLAP_V, gravity: GRAVITY, maxFall: MAX_FALL,
          speed: SPEED, obW: OB_W, spacing: SPACING, firstX: FIRST_X,
          gapStart: GAP_START, gapHold: GAP_HOLD, gapMin: GAP_MIN, gapEdge: GAP_EDGE, gapJump: GAP_JUMP, retryMs: RETRY_MS, stepMs: STEP_MS,
        },
        hud: hudRects(),                                                      // 왼쪽 위 점수판 자리(칸): crown · best · score
        manualClock: manual !== null,
        layout: 'F', rows: H, cols: W,
        skin, skinName: SKINS[skin].name, skins: SKINS.map((s) => s.name),
        sound: KeySound.index, cap, capName: KeyArt.names[cap],
        keyDown: keyHold.push !== null,
        keyRects: { push: rectOf(el.keyPush) },
        rects: {
          device: rectOf(el.deviceE), screen: rectOf(el.screen), key: rectOf(el.keyPush), grip: rectOf(el.grip),
          gameBtn: rectOf(document.getElementById('gameBtn')),
          soundBtn: rectOf(el.soundBtn), capBtn: rectOf(el.capBtn), skinBtn: rectOf(el.skinBtn),
        },
        game: gameHere(),
      };
    },
    press,                                                       // 한 번 눌렀다 뗌. 받아들였으면 true(끝난 직후 0.6초 안이면 false)
    flap() { return pressAt(now()); },                           // press와 같지만 키캡 그림은 안 건드림(검사에서 많이 부를 때)
    keyPress() { return holdKey('push', 'test'); },              // 이미 눌려 있으면 false(세지 않음)
    keyRelease() { return releaseKey('push'); },
    // 처음부터: 시작 전 화면 · 최고 기록 지움 · 검사용 씨앗/코스 지움(고른 몸통 색 · 소리 · 키캡 그림은 그대로)
    reset() {
      toReady(); best = 0; seedFixed = null; testCourse = null;
      Object.values(KEYS).forEach(clearKey);
      drawKeys(); render();
      return this.state();
    },
    toReady() { toReady(); render(); return this.state(); },     // 시작 전 화면으로(최고 기록은 그대로)
    setBest(n) { best = toInt(n); saveNum(KEYS.best, best); render(); return best; },
    // 틈 뽑기만 따로 해 보기(판에는 영향 없음): 씨앗 seed로 장애물 n개의 틈 { gapY, gap }을 실제 판과 같은 방법으로 뽑아 돌려준다
    sampleGaps(seed, n) {
      const rnd = seededRand(Number(seed) >>> 0), out = [];
      let prev = 0;
      for (let i = 0; i < Math.min(2000, toInt(n)); i += 1) { const g2 = pickGap(i, prev, rnd); prev = g2.gapY + g2.gap / 2; out.push(g2); }
      return out;
    },
    seed(n) { seedFixed = (n === undefined || n === null) ? null : (Number(n) >>> 0); return seedFixed; }, // 다음 판부터 같은 장애물 순서
    course(list) { testCourse = Array.isArray(list) ? list : null; return !!testCourse; },                // 다음 판 장애물 틈을 직접 정함 [{ gapY, gap }]
    placeBird(y, v) { by = Number(y); if (v !== undefined) vy = Number(v); render(); return this.state(); }, // 새를 원하는 높이 · 빠르기로
    // 손으로 돌리는 시계: 처음 부르면 실제 시계 값에서 이어 받아 멈춰 두고, 부를 때마다 ms만큼 돌린다
    tick(ms) {
      if (manual === null) { advanceTo(performance.now()); manual = lastT; }
      manual += Math.max(0, Number(ms) || 0);
      advanceTo(manual);
      render();
      return this.state();
    },
    // 실제 시계로 되돌리기: 흐르던 판이 끊기지 않게 적어 둔 시각들을 실제 시계 쪽으로 옮겨 둔다
    realClock() {
      if (manual !== null) {
        const shift = performance.now() - manual;
        lastT += shift; deadAt += shift; lastFlapAt += shift;
        feathers.forEach((f) => { f.born += shift; });
        manual = null;
      }
      render(); startLoop();
      return this.state();
    },
    setSound(i) { return setSound(i); },               // 소리 고르기(0 끔 · 1~6). 소리는 내지 않는다
    setCap(i) { return setCap(i); },                   // 키캡 그림 고르기(0 도트 · 1 매끈 · 2 스위치 · 3 납작)
    setSkin(n) { return setSkin(n); },
    nextSkin() { nextSkin(); return skin; },
    games() { return gameList(); },
    gameUrl(id) { return gameUrl(id); },               // 그 번호 게임으로 갈 주소(가지는 않음)
    gameIndexAt(x) { return gameIndexAt(Number(x)); }, // 게임 버튼 안 가로 위치(화면 점) → 칸 번호(0부터)
  };
})();
</script>
</body>
</html>
