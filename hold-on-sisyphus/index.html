<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>시시포스 누르기</title>
<style>
  /* 배치 A~D의 화면은 두 덩어리다: 그림판(흰 기기 몸통 안의 검은 화면) · 큰 「밀기」 버튼.
     둘의 크기 비율은 배치마다 다르고, 칸 나누기는 스크립트가 배치에 맞춰 정한다.
     배치 E는 기기 하나(몸통 안에 화면 + 키캡 두 개)만 보인다.
     색은 검정과 흰색 두 가지만 쓴다. 글씨와 테두리는 전부 캔버스(그림 종이)에 칸으로 찍는다 */
  :root { --black: #000000; --white: #f2f2f2; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--black); color: var(--white);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    display: flex; align-items: center; justify-content: center;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  main {
    width: min(100vw, 430px);
    height: min(100vh, 820px); height: min(100dvh, 820px);
    padding: 10px 12px max(12px, env(safe-area-inset-bottom));
    display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 160px; gap: 12px;
  }
  /* 그림판 자리: 흰 기기 몸통이 검은 화면을 얇게 감싼다(위쪽 띠에만 작은 버튼 둘) */
  .stage { min-height: 0; min-width: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .device { position: relative; background: var(--white); border-radius: 8px; padding: 28px 4px 4px; line-height: 0; }
  .screen { display: block; image-rendering: pixelated; background: var(--black); border-radius: 2px; }
  .screen.tappable { cursor: pointer; }
  /* 몸통 위쪽 띠의 작은 점 글씨 버튼: 왼쪽 = 배치 바꾸기, 오른쪽 = 「밀림」 켬·끔 */
  .corner-btn {
    position: absolute; top: 3px; padding: 0; margin: 0; border: 0; background: transparent;
    line-height: 0; cursor: pointer; touch-action: none; outline: none;
  }
  .corner-btn canvas { display: block; image-rendering: pixelated; }
  .layout-btn { left: 4px; }
  .slide-btn { right: 4px; }

  /* 큰 버튼: 캔버스가 칸 모양 버튼과 점 글씨를 그린다. 크기는 배치가 정한 칸을 꽉 채운다 */
  .btn {
    position: relative; display: block; width: 100%; height: 100%; min-height: 0; min-width: 0; padding: 0; margin: 0; border: 0;
    background: transparent; cursor: pointer; touch-action: none; outline: none;
  }
  .btn canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  .btn:focus-visible { outline: 3px solid var(--white); outline-offset: 3px; }
  /* 화면에는 안 보이는 글자: 읽어 주는 기능 · 검사기가 버튼 글을 읽을 수 있게 남겨 둔다 */
  .ghost { position: absolute; left: 0; top: 0; width: 100%; height: 100%; color: transparent; overflow: hidden; white-space: nowrap; pointer-events: none; line-height: 1; }

  /* 가로로 눕힌 폰처럼 낮은 화면: 왼쪽에 그림판, 오른쪽에 버튼(칸 나누기는 스크립트가) */
  @media (orientation: landscape) and (max-height: 520px) {
    main { width: min(100vw, 860px); column-gap: 14px; }
  }

  /* 배치 E: 손바닥만 한 기기 하나. 흰 몸통 안에 검은 화면, 그 아래 키캡 두 개.
     크기와 자리는 스크립트가 정하고, 몸통 아래 두 모서리는 비스듬히 깎는다(clip-path = 오려 내기) */
  .device-e { position: relative; display: none; flex: none; background: var(--white); line-height: 0; }
  .device-e .screen { position: absolute; }
  .key {
    position: absolute; padding: 0; margin: 0; border: 0; background: transparent;
    line-height: 0; cursor: pointer; touch-action: none; outline: none;
  }
  .key canvas { display: block; image-rendering: pixelated; }
  .layout-e .device { display: none; }
  .layout-e .device-e { display: block; }
  .layout-e .btn { display: none; }

  /* 배치 0(기존): 가로로 긴 화면 · 가운데 점 글씨 숫자판 · 아래 큰 버튼. 숫자판은 배치 0에서만 보인다 */
  .panel { position: relative; display: none; min-height: 0; min-width: 0; }
  .panel canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  .layout-0 .panel { display: block; }
  /* 가로로 눕힌 화면의 배치 0: 왼쪽 전체에 그림판, 오른쪽 가운데에 숫자판과 버튼을 위아래로 */
  @media (orientation: landscape) and (max-height: 520px) {
    .layout-0 .stage { grid-column: 1; grid-row: 1 / -1; }
    .layout-0 .panel { grid-column: 2; grid-row: 2; }
    .layout-0 .btn { grid-column: 2; grid-row: 3; }
  }
</style>
</head>
<body>
<main id="main">
  <div class="stage" id="stage">
    <div class="device" id="device">
      <button class="corner-btn layout-btn" id="layoutBtn" type="button" tabindex="-1"><canvas id="layoutCanvas"></canvas><span class="ghost" id="layoutLabel">배치 B</span></button>
      <button class="corner-btn game-btn" id="gameBtn" type="button" tabindex="-1"><canvas id="gameCanvas"></canvas><span class="ghost" id="gameLabel">게임 1 시시포스</span></button>
      <button class="corner-btn slide-btn" id="slideBtn" type="button" tabindex="-1" aria-pressed="false"><canvas id="slideCanvas"></canvas><span class="ghost" id="slideLabel">밀림 끔</span></button>
      <canvas class="screen" id="screen" aria-label="바위를 비탈 위로 미는 사람"></canvas>
    </div>
    <!-- 배치 E 기기 몸통: 검은 화면과 배치 버튼은 배치 E일 때 스크립트가 이 안으로 옮겨 온다 -->
    <div class="device-e" id="deviceE">
      <button class="key" id="keySlide" type="button" tabindex="-1" aria-pressed="false"><canvas id="keySlideCanvas"></canvas><span class="ghost" id="keySlideLabel">밀림 끔</span></button>
      <button class="key" id="keyPush" type="button" tabindex="-1"><canvas id="keyPushCanvas"></canvas><span class="ghost">밀기</span></button>
    </div>
  </div>
  <!-- 배치 0 숫자판: 다른 배치에서는 숨는다 -->
  <div class="panel" id="panel">
    <canvas id="panelCanvas"></canvas>
    <div class="ghost" id="num">0</div>
  </div>
  <button class="btn" id="btn" type="button"><canvas id="btnCanvas"></canvas><span class="ghost" id="btnLabel">밀기</span></button>
</main>
<script>
/* 시시포스 누르기 — 한 번 누름 = 바위를 한 걸음 밀기.
   비유: 만보기. 누를 때마다 숫자가 1 오르고 사람이 한 걸음 내딛을 뿐, 끝도 상도 없다.
   「밀림」을 켜면 비탈길 러닝머신이 된다: 손을 놓고 2초가 지나면 0.5초에 한 걸음씩 뒤로 밀려 내려간다.
   100걸음마다 있는 쉼터(평평한 턱)에서는 밀리지 않는다.
   v3: 숫자판을 없애고, 화면과 버튼의 비율을 네 가지 배치로 바꿔 볼 수 있다.
   v4: 배치 E = 본보기 기기 모양(흰 몸통 + 검은 화면 + 키캡 두 개). 키는 진짜 키처럼 뗐다가 다시 눌러야 한 번.
   v5: 배치 0 = 예전 모양(가로로 긴 화면 + 점 글씨 숫자판 + 밀기 버튼)을 목록 맨 앞에 되살림. */
(function () {
  'use strict';

  const W = 128;          // 그림판 가로 칸 수(모든 배치 같음)
  const BASE_H = 64;      // 그림을 처음 짠 기준 세로 칸 수(배치 A)
  const MAX_ROWS = 400;   // 아주 긴 화면에서도 칸 수가 끝없이 늘지 않게 막는 상한
  const BG = '#000000', INK = '#f2f2f2';
  const KEYS = {
    count: 'hold-on-sisyphus-count',   // 누른 횟수(절대 안 줄어듦)
    slide: 'hold-on-sisyphus-slide',   // 밀림 켬(1) · 끔(0)
    height: 'hold-on-sisyphus-height', // 밀림 켬일 때 지금 높이
    best: 'hold-on-sisyphus-best',     // 밀림 켬일 때 최고 높이
  };
  const LAYOUT_KEY = 'hold-on-sisyphus-layout'; // 고른 배치(0 · A~E). 「처음부터」 지우기에는 안 들어감
  const LABEL = '밀기';
  const SLIDE_WAIT = 2000;  // 마지막으로 누른 뒤 이만큼(1/1000초) 쉬면 밀리기 시작
  const SLIDE_EVERY = 500;  // 밀릴 때 한 걸음 내려가는 간격
  const SHELTER = 100;      // 이 걸음마다 쉼터
  const mod = (a, n) => ((a % n) + n) % n; // 음수도 0 ~ n-1로 돌려준다

  /* ---------- 배치 여섯 가지(0 · A~E) ----------
     rows = 검은 화면 세로 칸 수('fill' = 남는 높이를 전부 채우게 계산)
     panel = 화면과 버튼 사이에 숫자판을 둔다(배치 0)
     btn = 세로 화면에서 버튼 높이(화면 점), 'fill' = 화면을 놓고 남는 높이 전부
     btnLand = 가로로 눕힌 화면에서 오른쪽 버튼 폭, 'fill' = 화면과 반반
     tapScreen = 검은 화면을 눌러도 밀리는지 */
  const LAYOUTS = {
    0: { rows: 64, panel: true, tapScreen: false },                   // 기존: 2:1 화면 + 숫자판 + 큰 버튼
    A: { rows: 64, btn: 'fill', btnLand: 'fill', tapScreen: false },  // 작은 2:1 화면 + 아주 큰 버튼
    B: { rows: 96, btn: 160, btnLand: 220, tapScreen: false },        // 4:3 화면 + 중간 버튼
    C: { rows: 128, btn: 96, btnLand: 150, tapScreen: false },        // 1:1 화면 + 얇은 버튼
    D: { rows: 'fill', btn: 64, btnLand: 88, tapScreen: true },       // 화면이 거의 전부 + 맨 아래 띠 버튼
    E: { rows: 64, keys: true, tapScreen: false },                    // 기기 모양: 몸통 안에 2:1 화면 + 키캡 두 개
  };
  const LAYOUT_IDS = ['0', 'A', 'B', 'C', 'D', 'E']; // 배치 버튼 · L 키로 도는 순서
  const FIRST_LAYOUT = 'E'; // 처음 여는 사람의 배치

  // 배치 E 치수(단위는 화면 점, 비율은 몸통 폭에 대한 몫)
  const DEVICE_SHARE = 0.85;  // 몸통 폭 = 화면 폭의 85%
  const DEVICE_ASPECT = 1.3;  // 몸통 세로 = 폭 × 1.3(본보기 기기 비율쯤)
  const SCREEN_SHARE = 0.78;  // 검은 화면 폭은 몸통 폭의 78%까지(칸이 고르게 정수로 맞춰 조금 작아질 수 있음)
  const KEY_MIN = 72, KEY_MAX = 84; // 키캡 한 변(실제 키보드 키 크기쯤)
  const KEY_CELLS = 20;       // 키캡 그림은 20×20칸
  const KEY_PRESS_DROP = 3;   // 누르면 윗면이 내려가는 칸 수
  const A_MIN_BTN = 200;   // 배치 A에서 버튼이 적어도 이만큼은 남게(화면 점)
  const SIDE = 4;          // 흰 몸통이 검은 화면 옆 · 아래를 감싸는 두께(화면 점)
  const SKY_SHARE = 0.6;   // 화면이 세로로 늘어날 때, 늘어난 칸 중 하늘 쪽(위)에 주는 몫. 나머지는 땅 쪽(아래)
  const LAND_MQ = window.matchMedia('(orientation: landscape) and (max-height: 520px)');

  /* ---------- 저장: 저장소가 막혀 있어도 게임은 돈다(그때는 메모리에만) ---------- */
  const memory = {};
  function loadNum(key) {
    try {
      const raw = localStorage.getItem(key);
      if (raw !== null) {
        const value = Math.floor(Number(raw));
        if (Number.isFinite(value) && value >= 0) return Math.min(value, Number.MAX_SAFE_INTEGER); // 터무니없이 큰 저장값은 숫자 글씨로 못 그린다
      }
    } catch (e) { /* 메모리 값으로 */ }
    return memory[key] || 0;
  }
  function saveNum(key, value) {
    memory[key] = value;
    try { localStorage.setItem(key, String(value)); } catch (e) { /* 메모리에만 */ }
  }
  function clearKey(key) {
    delete memory[key];
    try { localStorage.removeItem(key); } catch (e) { /* 메모리만 지움 */ }
  }
  function loadLayout() {
    let raw = memory[LAYOUT_KEY];
    try { const v = localStorage.getItem(LAYOUT_KEY); if (v !== null) raw = v; } catch (e) { /* 메모리 값으로 */ }
    return LAYOUTS[raw] ? raw : FIRST_LAYOUT;
  }
  function saveLayout(id) {
    memory[LAYOUT_KEY] = id;
    try { localStorage.setItem(LAYOUT_KEY, id); } catch (e) { /* 메모리에만 */ }
  }

  /* ---------- 그림 재료: 글자 그림. # 흰 점, - 바위 속(무늬로 채움), . 건너뜀 ---------- */

  // 사람: 몸을 낮게 숙여 두 팔을 앞으로 뻗고 머리를 바위에 붙인 자세. 윗몸은 같고 다리만 네 장이 돌아간다
  const MAN_TOP = [
    '...................#',
    '.................###',
    '...............####.',
    '.............####...',
    '...........####.###.',
    '..........#####.####',
    '.........#####..###.',
    '........#####.......',
    '.......#####........',
    '......#####.........',
    '.....######.........',
    '.....#####..........',
  ];
  const MAN_LEGS = [
    [ // 뒷발 길게 뻗고 앞 무릎 굽힘
      '....###.##..........',
      '...###...##.........',
      '...##.....##........',
      '..##......##........',
      '..##.......##.......',
      '.##........##.......',
      '.##.......##........',
      '##........##........',
      '#.........##........',
      '##........###.......',
    ],
    [ // 다리가 서로 지나감
      '....#####...........',
      '....##.##...........',
      '...##...##..........',
      '...##...##..........',
      '..##.....##.........',
      '..##.....##.........',
      '.##......##.........',
      '.##.....##..........',
      '##......##..........',
      '###.....###.........',
    ],
    [ // 앞발을 들어 올림
      '....#####...........',
      '....##.###..........',
      '...##...###.........',
      '...##....##.........',
      '..##.....##.........',
      '..##....##..........',
      '.##....###..........',
      '.##.................',
      '##..................',
      '###.................',
    ],
    [ // 크게 벌려 디딤
      '....###..##.........',
      '...###....##........',
      '..###......##.......',
      '..##........##......',
      '.##.........##......',
      '.##..........##.....',
      '##...........##.....',
      '##..........##......',
      '#...........##......',
      '##..........###.....',
    ],
  ];
  const MAN = MAN_LEGS.map((legs) => MAN_TOP.concat(legs));

  // 바위: 기준 화면 높이의 절반쯤 되는 울퉁불퉁한 덩어리. 테두리(#) 안쪽(-)은 굴러가는 무늬로 채운다
  const BOULDER = [
    '.............##########.............',
    '..........###----------###..........',
    '........##----------------##........',
    '......##--------------------#.......',
    '.....#-----------------------#......',
    '....#-------------------------##....',
    '...#---------------------------#....',
    '..#-----------------------------#...',
    '..#-----------------------------#...',
    '.#-------------------------------#..',
    '.#-------------------------------#..',
    '#--------------------------------#..',
    '#---------------------------------#.',
    '#---------------------------------#.',
    '.#--------------------------------#.',
    '.#---------------------------------#',
    '#----------------------------------#',
    '#----------------------------------#',
    '#----------------------------------#',
    '#---------------------------------#.',
    '#---------------------------------#.',
    '.#--------------------------------#.',
    '.#---------------------------------#',
    '.#--------------------------------#.',
    '..#------------------------------#..',
    '..#------------------------------#..',
    '...#----------------------------#...',
    '....#--------------------------#....',
    '....#-------------------------#.....',
    '.....##----------------------#......',
    '.......##------------------##.......',
    '.........##--------------##.........',
    '...........###--------###...........',
    '..............########..............',
  ];
  // 바위 속 무늬(점과 금): 바위 가운데를 축으로 돌려 찍어서, 누를 때마다 조금씩 굴러가 보이게 한다
  const ROCK_TEX = [
    '#.......#.....#.',
    '.......##.......',
    '...#..#......#..',
    '.....#....#.....',
    '.#..#...........',
    '...#.....#...#..',
    '......#.....##..',
    '#..........#....',
    '....#..#..#.....',
    '.##.........#..#',
    '.....#..........',
    '...#....##...#..',
    '#......#........',
    '....#.......#.#.',
    '..#....#.....#..',
    '.......#.#......',
  ];
  const ROLL_RADIUS = 17; // 바위 반지름(칸). 한 걸음에 1/17 바퀴만큼(라디안) 돈다

  // 먼 산 능선: 64칸 동안의 높이표(0 = 가장 높음). 이어 붙여 끝없이 흘려보낸다
  const RIDGE_H = [
    6, 6, 5, 5, 4, 4, 5, 5, 4, 3, 3, 2, 3, 4, 4, 5,
    5, 6, 6, 5, 4, 4, 3, 2, 1, 1, 2, 3, 3, 4, 5, 5,
    6, 6, 5, 4, 4, 3, 3, 4, 4, 5, 5, 4, 3, 2, 2, 3,
    4, 4, 5, 6, 6, 7, 6, 6, 5, 5, 4, 5, 5, 6, 6, 6,
  ];

  // 구름: 오른쪽 위에 납작한 것 둘과 작은 점 하나
  const CLOUD_A = ['...######...', '############', '..########..'];
  const CLOUD_B = ['..####..', '########', '.######.'];
  const CLOUD_C = ['###'];
  // 화면이 세로로 길어지면 늘어난 하늘에 더 띄우는 구름: [처음 가로 자리, 위아래 흔들림, 모양]. 한 층에 둘씩 쓴다
  const SKY_CLOUDS = [
    [30, 0, CLOUD_B], [96, 2, CLOUD_C],
    [64, 1, CLOUD_A], [12, 0, CLOUD_C],
    [104, 2, CLOUD_B], [44, 0, CLOUD_A],
    [80, 1, CLOUD_C], [18, 2, CLOUD_B],
  ];
  const SKY_BAND = 12; // 더 띄우는 구름 층 사이 간격(칸)

  // 비탈 바닥: 8칸짜리 계단 한 단을 오른쪽 위로 한 칸씩 올려 찍는다
  const GROUND_STEP = ['########'];
  // 바닥 속 자갈 점: 흩어진 점 비탈
  const GROUND_TEX = [
    '#.....#.....#...',
    '....#.....#....#',
    '..#.....#.......',

    ctx.setTransform(1, 0, 0, 1, capX * c, topY * c);
    pixelBlock(ctx, capW * c, topH * c, c, INK);
    pixelFrame(ctx, capW * c, topH * c, c, BG);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    // 왼쪽 키 윗면 가운데의 작은 점: 켬 = 꽉 찬 점, 끔 = 속이 빈 고리
    if (mark !== null) {
      const mx = 8, my = topY + 3;
      R(mx + 1, my, 2, 1, BG); R(mx + 1, my + 3, 2, 1, BG);
      if (mark) R(mx, my + 1, 4, 2, BG);
      else { R(mx, my + 1, 1, 2, BG); R(mx + 3, my + 1, 1, 2, BG); }
    }
  }
  function drawKeys() {
    if (layout !== 'E') return;
    drawKey(el.keyPushCanvas, keyHold.push !== null || pushFlash, null);
    drawKey(el.keySlideCanvas, keyHold.slide !== null, slideOn);
    const label = slideOn ? '밀림 켬' : '밀림 끔';
    if (el.keySlideLabel.textContent !== label) el.keySlideLabel.textContent = label;
    el.keySlide.setAttribute('aria-pressed', slideOn ? 'true' : 'false');
  }

  // 검은 화면과 배치 버튼을 지금 배치의 몸통으로 옮긴다(E = 기기 몸통, A~D = 원래 몸통)
  function mountFor(isE) {
    el.main.classList.toggle('layout-e', isE);
    el.main.classList.toggle('layout-0', layout === '0'); // 배치 0일 때만 숫자판이 보인다
    const host = isE ? el.deviceE : el.device;
    if (el.screen.parentNode !== host) {

        el.deviceE.insertBefore(el.layoutBtn, el.keySlide);

      } else {
        el.device.insertBefore(el.layoutBtn, el.slideBtn);
        el.device.appendChild(el.screen);

      el.layoutBtn.style.left = ''; el.layoutBtn.style.top = '';

  }

  // 배치 A~E에는 숫자판이 없으므로 읽어 주는 기능용 글은 화면 이름표에 함께 둔다. 배치 0은 숫자판도 다시 그린다
  function syncText() {
    const text = (slideOn ? height : count).toLocaleString('en-US');
    const aria = `바위를 비탈 위로 미는 사람, ${text}`;
    if (el.screen.getAttribute('aria-label') !== aria) el.screen.setAttribute('aria-label', aria);
    if (el.btnLabel.textContent !== LABEL) el.btnLabel.textContent = LABEL;
    if (el.num.textContent !== text) el.num.textContent = text;
    if (layout === '0') drawPanel();
  }

  /* ---------- 그리기: 128×(배치별 세로)칸 작은 판에 찍은 뒤 그대로 키운다 ---------- */
  const g = el.screen.getContext('2d');
  const board = document.createElement('canvas');
  const c = board.getContext('2d');
  let H = 0;         // 지금 검은 화면 세로 칸 수
  let skyShift = 0;  // 기준 그림을 아래로 내리는 칸 수(늘어난 하늘 몫)
  let skyClouds = []; // 늘어난 하늘에 더 띄운 구름 [처음 가로 자리, 세로 자리, 모양]

  let ink = null; // 지금 붓 색(같은 색이면 다시 고르지 않아 빠르게)
  function dot(x, y, color) {
    if (x < 0 || x >= W || y < 0 || y >= H) return;
    if (color !== ink) { c.fillStyle = color; ink = color; }
    c.fillRect(x, y, 1, 1);
  }
  function box(x, y, w, h, color) {
    c.fillStyle = color; ink = color;
    c.fillRect(x, y, w, h);
  }
  function sprite(x, y, rows, color = INK, k = 1) {
    rows.forEach((row, j) => {
      for (let i = 0; i < row.length; i += 1) {
        if (row[i] !== '#') continue;
        for (let dy = 0; dy < k; dy += 1) for (let dx = 0; dx < k; dx += 1) dot(x + i * k + dx, y + j * k + dy, color);
      }
    });
  }
  // 사람 둘레를 한 칸 검게 비워서, 흰 바위 무늬 위에 겹쳐도 몸이 또렷하게 보이게 한다
  function spriteWithHalo(x, y, rows) {
    rows.forEach((row, j) => {
      for (let i = 0; i < row.length; i += 1) {
        if (row[i] !== '#') continue;
        for (let dy = -1; dy <= 1; dy += 1) for (let dx = -1; dx <= 1; dx += 1) dot(x + i + dx, y + j + dy, BG);
      }
    });
    sprite(x, y, rows);
  }

  // 비탈 계단을 찍으면서 칸마다 바닥 높이를 적어 둔다(작은 것들을 바닥에 올려놓을 때 쓴다)
  const STEP_W = GROUND_STEP[0].length;
  const surface = new Array(W).fill(BASE_H);
  const surfaceAt = (x) => surface[Math.max(0, Math.min(W - 1, x))];

  // 세로 칸 수가 바뀌면: 그림 전체를 내릴 칸 수 · 바닥 높이 · 늘어난 하늘의 구름을 다시 정한다
  function setRows(rows) {
    if (rows === H) return;
    H = rows;
    board.width = W; board.height = H; ink = null;
    skyShift = Math.round((H - BASE_H) * SKY_SHARE);
    for (let x = 0; x < W; x += 1) surface[x] = GROUND_LEFT_Y + skyShift - Math.floor(x / STEP_W);
    // 원래 구름 줄 위로 SKY_BAND 칸마다 한 층씩, 한 층에 구름 둘. 맨 위 숫자 자리 근처까지만
    skyClouds = [];
    for (let k = 1; ; k += 1) {
      const y = skyShift + 6 - SKY_BAND * k;
      if (y < 2) break;
      for (let n = 0; n < 2; n += 1) {
        const [home, wobble, rows2] = SKY_CLOUDS[((k - 1) * 2 + n) % SKY_CLOUDS.length];
        skyClouds.push([home, y + wobble, rows2]);
      }
    }
  }

  // 바위 칸 정리: 줄마다 처음 ~ 마지막 칠한 칸 사이가 바위 몸통
  const BOULDER_CELLS = [];
  const BOULDER_CX = (BOULDER[0].length - 1) / 2, BOULDER_CY = (BOULDER.length - 1) / 2;
  BOULDER.forEach((row, j) => {
    const first = row.search(/[#-]/), last = Math.max(row.lastIndexOf('#'), row.lastIndexOf('-'));
    for (let i = first; i <= last && first >= 0; i += 1) BOULDER_CELLS.push({ i, j, edge: row[i] === '#' });
  });

  // 점 글씨 한 줄을 판에 찍고, 뒤를 검게 비워 구름이 지나가도 읽히게 한다. 차지한 높이(칸)를 돌려준다
  function boardText(keys, x, y, k) {
    const m = measure(keys);
    box(x - 1, y - 1, m.w * k + 2, m.h * k + 2, BG);
    let cx = x;
    keys.forEach((key) => {
      sprite(cx, y, GLYPHS[key], INK, k);
      cx += (GLYPHS[key][0].length + 1) * k;
    });
    return m.h * k;
  }

  function render() {
    const s = sceneS(); // 한 걸음 = 한 칸
    const oy = skyShift;
    box(0, 0, W, H, BG);

    // 구름(가장 느리게): 원래 셋 + 늘어난 하늘에 더 띄운 것들
    const cloudShift = Math.floor(s / CLOUD_SLOW);
    CLOUDS.forEach(([home, y, rows]) => {
      const w = rows[0].length;
      sprite(mod(home + w - cloudShift, W + 24) - w, y + oy, rows);
    });
    skyClouds.forEach(([home, y, rows]) => {
      const w = rows[0].length;
      sprite(mod(home + w - cloudShift, W + 24) - w, y, rows);
    });

    // 먼 산 능선(바위 왼쪽에만, 2걸음에 한 칸)
    const ridgeShift = Math.floor(s / RIDGE_SLOW);
    for (let x = 0; x < RIDGE_END; x += 1) dot(x, RIDGE_Y + oy + RIDGE_H[mod(x + ridgeShift, RIDGE_H.length)], INK);

    // 비탈 바닥 선
    for (let k = 0; k * STEP_W < W; k += 1) sprite(k * STEP_W, GROUND_LEFT_Y + oy - k, GROUND_STEP);
    // 바닥 속 자갈 점: 한 걸음에 한 칸, 8걸음마다 비탈을 따라 한 칸 아래로
    const texW = GROUND_TEX[0].length, texH = GROUND_TEX.length;
    const sink = Math.floor(s / STEP_W);
    for (let x = 0; x < W; x += 1) {
      for (let y = surface[x] + 2; y < H; y += 1) {
        if (GROUND_TEX[mod(y - oy - sink, texH)][mod(x + s, texW)] === '#') dot(x, y, INK);
      }
    }
    // 비탈 위 작은 것들
    DECOR.forEach(([home, rows]) => {
      const x = mod(home - s, DECOR_LOOP) - 16;
      if (x >= W) return;
      sprite(x, surfaceAt(x + Math.floor(rows[0].length / 2)) - rows.length, rows);
    });
    // 쉼터(밀림 켬일 때만): 100걸음마다 돌 턱과 깃발이 지나간다
    if (slideOn) {
      for (let k = Math.max(1, Math.ceil((s - 140) / SHELTER)); k * SHELTER <= s + 140; k += 1) {
        const x = SHELTER_X + (k * SHELTER - s);
        if (x < -10 || x >= W) continue;
        const ledgeY = surfaceAt(x + 4) - LEDGE.length;
        sprite(x, ledgeY, LEDGE);
        sprite(x + 1, ledgeY - FLAG.length, FLAG);
      }
    }

    // 바위: 테두리는 그대로, 속 무늬만 바위 가운데를 축으로 돈다(오르막으로 밀면 시계 방향)
    const angle = s / ROLL_RADIUS, cos = Math.cos(angle), sin = Math.sin(angle);
    const tw = ROCK_TEX[0].length, th = ROCK_TEX.length;
    BOULDER_CELLS.forEach(({ i, j, edge }) => {
      const x = BOULDER_X + i, y = BOULDER_Y + oy + j;
      if (edge) { dot(x, y, INK); return; }
      const dx = i - BOULDER_CX, dy = j - BOULDER_CY;
      const u = dx * cos + dy * sin, v = -dx * sin + dy * cos;
      let on = ROCK_TEX[mod(Math.floor(v), th)][mod(Math.floor(u), tw)] === '#';
      // 오른쪽 아래 가장자리에 고정된 성긴 점 그늘(빛은 돌지 않으니 무늬와 따로)
      if (!on && dx + dy > 0 && Math.hypot(dx, dy) > ROLL_RADIUS - 3 && (i + j) % 2 === 0) on = true;
      dot(x, y, on ? INK : BG); // 뒤 풍경은 지우고 무늬만 남긴다
    });

    // 미는 사람: 한 걸음마다 다음 그림(밀려 내려갈 때는 거꾸로 돌아 뒷걸음질)
    spriteWithHalo(MAN_X, MAN_Y + oy, MAN[stepOf(s)]);

    if (layout === '0') {
      // 배치 0: 예전처럼 왼쪽 위에 작은 숫자 한 줄만(손 · 깃발은 아래 숫자판이 맡는다)
      boardText([...String(slideOn ? height : count)], 3, 3, 1);
    } else {
      // 왼쪽 위 숫자(끔=누른 횟수, 켬=지금 높이): 칸 두 배 크기. 너무 길어 화면을 넘거나, 바위 윗부분을 덮게 되면 한 배로
      // (세로로 긴 배치는 바위가 숫자보다 아래에 있어 덮이지 않는다)
      const big = [...String(slideOn ? height : count)];
      const bigW = measure(big).w * 2;
      const hitsBoulder = 3 + bigW > BOULDER_X + 2 && BOULDER_Y + oy < 3 + 7 * 2 + 2;
      const bigK = (bigW <= W - 6 && !hitsBoulder) ? 2 : 1;
      let y = 3 + boardText(big, 3, 3, bigK) + 3;
      // 밀림 켬: 그 아래 작게 손 모양 + 누른 횟수, 깃발 + 최고 높이
      if (slideOn) {
        y += boardText(['☝', ' '].concat([...String(count)]), 3, y, 1) + 2;
        boardText(['⚑', ' '].concat([...String(best)]), 3, y, 1);
      }
    }

    g.imageSmoothingEnabled = false;
    g.drawImage(board, 0, 0, el.screen.width, el.screen.height);
  }

  // 자리 맞추기: 배치에 맞춰 화면 · 버튼 칸을 나누고, 검은 화면은 한 칸이 화면 점 몇 개인지를 정수로 맞춰
  // 점이 고르게 보이게 한다. 흰 몸통은 그 화면을 얇게 감싼다
  // 배치에 맞춰 자리를 잡은 뒤, 게임 버튼을 배치 버튼 옆에 세운다
  function fit() { fitLayout(); placeGameBtn(); }
  function fitLayout() {
    const r = dpr(), L = LAYOUTS[layout], land = LAND_MQ.matches, ms = el.main.style;
    mountFor(!!L.keys);
    if (L.keys) { fitDevice(); return; }
    if (L.panel) { fitPanelLayout(); return; }
    if (land) {
      ms.gridTemplateRows = 'minmax(0, 1fr)';
      ms.gridTemplateColumns = L.btnLand === 'fill' ? 'minmax(0, 1fr) minmax(0, 1fr)' : `minmax(0, 1fr) ${L.btnLand}px`;
    } else {
      ms.gridTemplateColumns = 'minmax(0, 1fr)';
      ms.gridTemplateRows = L.btn === 'fill' ? 'auto minmax(0, 1fr)' : `minmax(0, 1fr) ${L.btn}px`;
    }
    el.screen.classList.toggle('tappable', L.tapScreen);

    const bandH = Math.max(drawToggle(), drawLayoutBtn());
    const padTop = Math.ceil(bandH) + 6;
    el.device.style.padding = `${padTop}px ${SIDE}px ${SIDE}px`;

    // 화면이 쓸 수 있는 자리(화면 점): 전체 판에서 버튼 몫과 흰 몸통 두께를 뺀다
    const cs = getComputedStyle(el.main), mb = el.main.getBoundingClientRect();
    const innerW = mb.width - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0);
    const innerH = mb.height - (parseFloat(cs.paddingTop) || 0) - (parseFloat(cs.paddingBottom) || 0);
    const gapR = parseFloat(cs.rowGap) || 0, gapC = parseFloat(cs.columnGap) || 0;
    let availW, availH;
    if (land) {
      availH = innerH;
      availW = L.btnLand === 'fill' ? (innerW - gapC) / 2 : innerW - gapC - L.btnLand;
    } else {
      availW = innerW;
      availH = innerH - gapR - (L.btn === 'fill' ? A_MIN_BTN : L.btn);
    }
    const aw = Math.max(1, (availW - 2 * SIDE) * r), ah = Math.max(1, (availH - padTop - SIDE) * r);

    let rows, cellPx;
    if (L.rows === 'fill') {
      // 폭에 맞춘 칸 크기로, 남는 높이를 세로 칸으로 전부 채운다(적어도 기준 64칸)
      cellPx = Math.max(1, Math.min(Math.floor(aw / W), Math.floor(ah / BASE_H)));
      rows = Math.max(BASE_H, Math.min(MAX_ROWS, Math.floor(ah / cellPx)));
    } else {
      rows = L.rows;
      cellPx = Math.max(1, Math.floor(Math.min(aw / W, ah / rows)));
    }
    setRows(rows);
    if (el.screen.width !== W * cellPx || el.screen.height !== H * cellPx) { el.screen.width = W * cellPx; el.screen.height = H * cellPx; }
    el.screen.style.width = `${(W * cellPx) / r}px`;
    el.screen.style.height = `${(H * cellPx) / r}px`;

    sizeToBox(el.btnCanvas, el.btn);
    drawButton();
    syncText();
    render();
  }

  // 배치 0 자리 맞추기: 세로 화면 = 그림판 / 숫자판 184 / 버튼 112(위에서 아래로),
  // 가로로 눕힌 화면 = 왼쪽 그림판, 오른쪽 가운데에 숫자판 150 + 버튼 96. 검은 화면은 128×64칸 그대로
  function fitPanelLayout() {
    const r = dpr(), land = LAND_MQ.matches, ms = el.main.style;
    if (land) {
      ms.gridTemplateColumns = 'minmax(0, 1fr) minmax(280px, 1fr)';
      ms.gridTemplateRows = 'minmax(0, 1fr) 150px 96px minmax(0, 1fr)';
    } else {
      ms.gridTemplateColumns = 'minmax(0, 1fr)';
      ms.gridTemplateRows = 'minmax(0, 1fr) 184px 112px';
    }
    el.screen.classList.remove('tappable');

    const bandH = Math.max(drawToggle(), drawLayoutBtn());
    const padTop = Math.ceil(bandH) + 6;
    el.device.style.padding = `${padTop}px ${SIDE}px ${SIDE}px`;

    // 그림판 자리(칸 나누기가 바로 위에서 정해졌으므로 실제 상자 크기를 잰다)
    const box = el.stage.getBoundingClientRect();
    const aw = Math.max(1, (box.width - 2 * SIDE) * r), ah = Math.max(1, (box.height - padTop - SIDE) * r);
    const cellPx = Math.max(1, Math.floor(Math.min(aw / W, ah / BASE_H)));
    setRows(BASE_H);
    if (el.screen.width !== W * cellPx || el.screen.height !== H * cellPx) { el.screen.width = W * cellPx; el.screen.height = H * cellPx; }
    el.screen.style.width = `${(W * cellPx) / r}px`;
    el.screen.style.height = `${(H * cellPx) / r}px`;

    sizeToBox(el.panelCanvas, el.panel);
    sizeToBox(el.btnCanvas, el.btn);
    drawButton();
    syncText();
    render();
  }

  // 배치 E 자리 맞추기: 몸통 폭을 먼저 정하고(화면 폭의 85%, 높이가 모자라면 높이에 맞춰 줄임),
  // 그 안에 위쪽 띠(배치 버튼) → 검은 화면 → 키캡 두 개를 차례로 놓는다. 남는 아래쪽은 깎인 모서리 자리
  function fitDevice() {
    const r = dpr(), ms = el.main.style;
    ms.gridTemplateColumns = 'minmax(0, 1fr)';
    ms.gridTemplateRows = 'minmax(0, 1fr)';
    el.screen.classList.remove('tappable');
    drawToggle(); // 숨어 있어도 상태 글은 맞춰 둔다
    const bandH = drawLayoutBtn();

    const cs = getComputedStyle(el.main), mb = el.main.getBoundingClientRect();
    const innerW = mb.width - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0);
    const innerH = mb.height - (parseFloat(cs.paddingTop) || 0) - (parseFloat(cs.paddingBottom) || 0);
    const dw = Math.max(120, Math.floor(Math.min(mb.width * DEVICE_SHARE, innerW, innerH / DEVICE_ASPECT)));

    const topPad = Math.max(Math.ceil(bandH) + 14, Math.round(dw * 0.14)); // 몸통 위 끝 ~ 검은 화면
    const gapSK = Math.round(dw * 0.08);    // 검은 화면 ~ 키캡
    const bottomMin = Math.round(dw * 0.18); // 키캡 아래 최소 몸통(깎인 모서리 자리)

    // 키캡 크기: 칸이 정수 화면 점이 되는 크기 중, 72~84 안에서 몸통 폭의 26%에 가장 가까운 것
    const kMax = Math.min(KEY_MAX, dw * 0.34), kMin = Math.min(KEY_MIN, kMax);
    const want = Math.max(kMin, Math.min(kMax, dw * 0.26));
    let kc = 0, gapBest = Infinity;
    for (let cc = 1; KEY_CELLS * cc / r <= kMax + 0.01; cc += 1) {
      const size = KEY_CELLS * cc / r;
      if (size >= kMin - 0.01 && Math.abs(size - want) < gapBest) { kc = cc; gapBest = Math.abs(size - want); }
    }
    if (!kc) kc = Math.max(1, Math.floor(kMax * r / KEY_CELLS));
    keyCell = kc;
    const ks = KEY_CELLS * kc / r;

    // 검은 화면: 128×64칸 그대로, 한 칸 = 정수 화면 점. 높이가 모자라면 칸을 줄인다
    let cellPx = Math.max(1, Math.floor(dw * SCREEN_SHARE * r / W));
    const need = (cp) => topPad + (BASE_H * cp) / r + gapSK + ks + bottomMin;
    while (cellPx > 1 && need(cellPx) > innerH) cellPx -= 1;
    const sw = (W * cellPx) / r, sh = (BASE_H * cellPx) / r;
    const dh = Math.max(Math.round(dw * DEVICE_ASPECT), Math.ceil(need(cellPx)));

    // 몸통: 위 두 모서리는 둥글게, 아래 두 모서리는 비스듬히 깎기
    const ds = el.deviceE.style, rad = Math.round(dw * 0.1), bevel = Math.round(dw * 0.11);
    ds.width = `${dw}px`; ds.height = `${dh}px`;
    ds.borderRadius = `${rad}px ${rad}px 0 0`;
    ds.clipPath = `polygon(0 0, 100% 0, 100% calc(100% - ${bevel}px), calc(100% - ${bevel}px) 100%, ${bevel}px 100%, 0 calc(100% - ${bevel}px))`;

    // 배치 버튼: 몸통 위쪽 가장자리 왼편
    el.layoutBtn.style.left = `${Math.round(dw * 0.08)}px`;
    el.layoutBtn.style.top = `${Math.max(6, Math.round((topPad - bandH) / 2))}px`;

    // 검은 화면: 가운데 정렬
    setRows(BASE_H);
    if (el.screen.width !== W * cellPx || el.screen.height !== H * cellPx) { el.screen.width = W * cellPx; el.screen.height = H * cellPx; }
    el.screen.style.width = `${sw}px`; el.screen.style.height = `${sh}px`;
    el.screen.style.left = `${Math.round((dw - sw) / 2)}px`;
    el.screen.style.top = `${topPad}px`;

    // 키캡 두 개: 화면 아래 가운데에 나란히(왼쪽 = 밀림, 오른쪽 = 밀기)
    const keyGap = Math.round(ks * 0.22), rowLeft = Math.round((dw - (2 * ks + keyGap)) / 2);
    const keyTop = Math.round(topPad + sh + gapSK);
    [[el.keySlide, el.keySlideCanvas, rowLeft], [el.keyPush, el.keyPushCanvas, rowLeft + Math.round(ks) + keyGap]].forEach(([b, cv, x]) => {
      const n = KEY_CELLS * kc;
      if (cv.width !== n || cv.height !== n) { cv.width = n; cv.height = n; }
      cv.style.width = `${ks}px`; cv.style.height = `${ks}px`;
      b.style.left = `${x}px`; b.style.top = `${keyTop}px`;
      b.style.width = `${ks}px`; b.style.height = `${ks}px`;
    });

    drawKeys();
    syncText();
    render();
  }
  /* ---------- 게임 버튼: 배치 버튼 바로 오른쪽, 누를 때마다 다음 게임으로 넘어간다 ----------
     비유: TV 채널 버튼. 1 시시포스 → 2 10.00000 → 3 결투 → 4 100m → 다시 1.
     네 게임은 같은 전시장의 옆 폴더라서 「한 칸 위 폴더 → 옆 폴더」 주소로 옮겨 간다.
     이 컴퓨터의 폴더 이름(local)과 인터넷 전시장의 폴더 이름(web)이 달라서 둘 다 적어 두고,
     지금 열린 폴더 이름이 어느 쪽인지 보고 같은 쪽 이름으로 간다.
     키보드 바로 가기는 두지 않는다(100m의 F · J 사이 G처럼, 달리다 스치면 판이 날아가서).
     (fit()이 처음 불리는 때보다 앞서 쓰일 수 있어서 값은 const 대신 함수로 돌려준다) */
  function gameHere() { return '1'; }
  function gameList() {
    return [
      { id: '1', name: '시시포스', local: 'streak-sisyphus', web: 'hold-on-sisyphus' },
      { id: '2', name: '10.00000', local: 'key-ten', web: 'hold-on-key-ten' },
      { id: '3', name: '결투', local: 'key-duel', web: 'hold-on-key-duel' },
      { id: '4', name: '100m', local: 'key-100m', web: 'hold-on-key-100m' },
    ];
  }
  function nextGameUrl() {
    const list = gameList(), i = list.findIndex((g) => g.id === gameHere());
    const next = list[(i + 1) % list.length];
    // 지금 폴더 이름: …/hold-on-key-ten/ → hold-on-key-ten, …/key-ten/index.html → key-ten
    const parts = location.pathname.split('/').filter(Boolean);
    if (parts.length && /\.html?$/i.test(parts[parts.length - 1])) parts.pop();
    const here = decodeURIComponent(parts[parts.length - 1] || '');
    const onWeb = list.some((g) => g.web === here);
    return onWeb ? `../${next.web}/` : `../${next.local}/index.html`;
  }
  // 넘어간 게임마다 뒤로 가기 기록이 쌓이지 않게 지금 칸을 바꿔 끼운다
  function nextGame() { location.replace(nextGameUrl()); }
  // 그림: 배치 버튼과 같은 모양. 테두리 안에 1 2 3 4, 지금 게임 숫자만 검게 칠한 칸에 흰 글씨
  function drawGameBtn(gb) {
    const cv = gb.querySelector('canvas'), ctx = cv.getContext('2d'), cc = cornerCell(), list = gameList();
    const BOX_W = 7, BOX_H = 9;                       // 글자 한 칸 상자(글자 5×7 + 둘레 한 칸)
    const cols = 3 + list.length * (BOX_W + 1) - 1 + 3, rowsN = 17;
    const cw = cols * cc, ch = rowsN * cc;
    sizeCorner(cv, cw, ch);
    ctx.clearRect(0, 0, cw, ch);
    pixelFrame(ctx, cw, ch, cc, BG);
    list.forEach((g, i) => {
      const bx = (3 + i * (BOX_W + 1)) * cc, by = Math.floor((rowsN - BOX_H) / 2) * cc;
      if (g.id === gameHere()) {
        ctx.fillStyle = BG; ctx.fillRect(bx, by, BOX_W * cc, BOX_H * cc);
        drawText(ctx, [g.id], bx + cc, by + cc, cc, INK);
      } else {
        drawText(ctx, [g.id], bx + cc, by + cc, cc, BG);
      }
    });
  }
  // 자리: 배치 버튼이 든 몸통(배치 E면 기기 몸통)으로 따라가서, 배치 버튼 오른쪽 6점 떨어진 곳에 같은 높이로 선다
  function placeGameBtn() {
    const gb = document.getElementById('gameBtn'), lb = el.layoutBtn;
    if (!gb) return;
    if (gb.parentNode !== lb.parentNode || lb.nextSibling !== gb) lb.parentNode.insertBefore(gb, lb.nextSibling);
    drawGameBtn(gb);
    gb.style.left = `${lb.offsetLeft + lb.offsetWidth + 6}px`;
    gb.style.top = `${lb.offsetTop}px`;
  }
  // 누르는 순간 넘어간다. 게임 누름으로 세지 않는다(아래로 퍼지지 않게 막음)
  document.getElementById('gameBtn').addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    nextGame();
  });
  if (window.ResizeObserver) new ResizeObserver(fit).observe(el.main);
  window.addEventListener('resize', fit);

  /* ---------- 입력: 손가락이 닿는 순간 한 걸음 ---------- */
  const mainPointer = (e) => e.pointerType !== 'mouse' || e.button === 0;
  el.btn.addEventListener('pointerdown', (e) => {
    if (!mainPointer(e)) return;
    e.preventDefault();
    press();
  });
  // 배치 D에서는 검은 화면을 눌러도 밀린다
  el.screen.addEventListener('pointerdown', (e) => {
    if (!LAYOUTS[layout].tapScreen || !mainPointer(e)) return;
    e.preventDefault();
    press();
  });
  // 작은 버튼 둘: 밀기로 세지 않는다
  el.slideBtn.addEventListener('pointerdown', (e) => {
    if (!mainPointer(e)) return;
    e.preventDefault(); e.stopPropagation();
    setSlideOn(!slideOn);
  });
  el.layoutBtn.addEventListener('pointerdown', (e) => {
    if (!mainPointer(e)) return;
    e.preventDefault(); e.stopPropagation();
    nextLayout();
  });
  // 배치 E 키캡: 누르는 순간 센다. 그 손가락이 떼어지거나, 키 밖으로 미끄러지거나, 화면 밖으로 나가면 뗀 것
  ['push', 'slide'].forEach((name) => {
    keyEl()[name].addEventListener('pointerdown', (e) => {
      if (!mainPointer(e)) return;
      e.preventDefault(); e.stopPropagation();
      if (layout !== 'E') return;
      // 손가락을 키에 묶어 두지 않아야 키 밖으로 미끄러진 것을 알아챈다
      const t = e.currentTarget;
      try { if (t.hasPointerCapture && t.hasPointerCapture(e.pointerId)) t.releasePointerCapture(e.pointerId); } catch (err) { /* 그대로 */ }
      // 새로 닿은 첫 손가락인데 키가 눌린 채 남아 있으면, 떼는 신호를 놓친 낡은 누름이다 → 풀고 받는다(키가 먹통이 되지 않게)
      if (e.isPrimary) ['push', 'slide'].forEach((k) => { if (keyHold[k] !== null && keyHold[k] !== e.pointerId) releaseKey(k); });
      holdKey(name, e.pointerId);
    });
  });
  const insideRect = (node, x, y) => {
    const b = node.getBoundingClientRect();
    return x >= b.left && x <= b.right && y >= b.top && y <= b.bottom;
  };
  window.addEventListener('pointermove', (e) => {
    const nodes = keyEl();
    ['push', 'slide'].forEach((name) => {
      if (keyHold[name] === e.pointerId && !insideRect(nodes[name], e.clientX, e.clientY)) releaseKey(name, e.pointerId);
    });
  });
  ['pointerup', 'pointercancel'].forEach((type) => window.addEventListener(type, (e) => {
    releaseKey('push', e.pointerId); releaseKey('slide', e.pointerId);
  }));
  // 마우스가 창 밖으로 나감(옮겨 간 곳이 없음)
  window.addEventListener('pointerout', (e) => {
    if (e.relatedTarget) return;
    releaseKey('push', e.pointerId); releaseKey('slide', e.pointerId);
  });
  window.addEventListener('blur', releaseAllKeys);
  document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAllKeys(); });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter') releaseKey('push', `kb:${e.code}`);
  });

  window.addEventListener('keydown', (e) => {
    const plain = !e.metaKey && !e.ctrlKey && !e.altKey;
    if (e.code === 'KeyB' && plain) {
      e.preventDefault();
      if (!e.repeat) setSlideOn(!slideOn);
      return;
    }
    if (e.code === 'KeyL' && plain) {
      e.preventDefault();
      if (!e.repeat) nextLayout();
      return;
    }
    if (e.code !== 'Space' && e.code !== 'Enter' && e.code !== 'NumpadEnter') return;
    if (!plain) return; // Cmd · Ctrl · Alt와 같이 누른 것은 밀기가 아니다(떼는 신호가 안 와서 키가 눌린 채 남는 것도 막음)
    e.preventDefault();
    if (e.repeat) return; // 꾹 누르고 있어 저절로 반복되는 입력은 무시
    if (layout === 'E') {
      // 같은 키가 눌린 채 남아 있는데 새로 눌렸다면 떼는 신호를 놓친 것이다 → 풀고 받는다(키보드가 먹통이 되지 않게)
      if (keyHold.push === `kb:${e.code}`) releaseKey('push');
      holdKey('push', `kb:${e.code}`); // 오른쪽 키를 누른 것과 같음(떼면 keyup에서 올라옴)
    } else press();
  });
  // 연타할 때 화면이 확대되거나 끌리거나, 길게 눌러 메뉴가 뜨지 않게 막는다
  const block = (e) => e.preventDefault();
  ['touchstart', 'touchmove', 'touchend'].forEach((name) => document.addEventListener(name, block, { passive: false }));
  ['gesturestart', 'dblclick', 'contextmenu', 'selectstart', 'dragstart'].forEach((name) => document.addEventListener(name, block));

  fit();
  startLoop();

  /* ---------- 검사용 손잡이: 게임에는 영향이 없다 ---------- */
  const toInt = (n) => {
    const value = Math.floor(Number(n));
    return Number.isFinite(value) ? Math.max(0, Math.min(Number.MAX_SAFE_INTEGER, value)) : 0;
  };
  const rectOf = (node) => {
    const b = node.getBoundingClientRect();
    return { x: b.left, y: b.top, w: b.width, h: b.height };
  };
  window.__STREAK_TEST__ = {
    state() {
      return {
        count, step: stepOf(sceneS()), label: LABEL, slide: slideOn, height, best, sliding: isSliding(),
        layout, layouts: LAYOUT_IDS.slice(), rows: H,
        keyDown: keyHold.push !== null,
        keyRects: layout === 'E' ? { push: rectOf(el.keyPush), slide: rectOf(el.keySlide) } : null,
      };
    },
    press,
    keyPress() { return holdKey('push', 'test'); }, // 이미 눌려 있으면 false(세지 않음)
    keyRelease() { return releaseKey('push'); },
    reset() {
      count = 0; height = 0; best = 0; slideOn = false; idleMs = 0; slideDone = 0;
      Object.values(KEYS).forEach(clearKey);
      drawToggle(); drawKeys(); syncText(); render();
    },
    setCount(n) {
      count = toInt(n);
      saveNum(KEYS.count, count);
      syncText(); render();
    },
    setSlide(on) { setSlideOn(on === true || on === 1 || on === 'true'); },
    setHeight(n) {
      height = toInt(n);
      if (height > best) { best = height; saveNum(KEYS.best, best); }
      saveNum(KEYS.height, height);
      idleMs = 0; slideDone = 0; // 방금 누른 것처럼 2초 쉬는 시간부터 다시 센다
      syncText(); render();
    },
    tick(ms) {
      advance(Math.max(0, Number(ms) || 0));
      return this.state();
    },
    setLayout(id) { return setLayout(String(id).toUpperCase()); },
    nextLayout() { nextLayout(); return layout; },
  };
})();
</script>
</body>
</html>
