<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>실크스크린 · 새 반복행위 시안</title>
<link rel="icon" href="data:," />
<style>
  :root {
    --bg: #15110a;
    --panel: #1a1408;
    --panel-dark: #100c06;
    --gold: #f5a700;
    --gold-soft: #f0c674;
    --text: #e8d6a8;
    --text-soft: #aa936a;
    --border: #443a25;
    --track: #2a1f0e;
    --paper: #eadfc5;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    margin: 0;
    height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    display: grid;
    grid-template-rows: auto 1fr auto;
    -webkit-user-select: none;
    user-select: none;
  }
  header, footer {
    background: var(--panel-dark);
    border-color: var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
  }
  header {
    border-bottom: 1px solid var(--border);
    padding: 9px 16px;
  }
  footer {
    border-top: 1px solid var(--border);
    padding: 9px 16px;
    color: var(--text-soft);
    font-size: 13px;
    line-height: 1.4;
  }
  a {
    color: var(--gold-soft);
    text-decoration: none;
    font-weight: 800;
    white-space: nowrap;
  }
  .title { min-width: 0; }
  h1 {
    margin: 0;
    color: var(--gold);
    font-size: 18px;
    line-height: 1.2;
    letter-spacing: 0;
  }
  .subtitle {
    margin: 2px 0 0;
    color: var(--text-soft);
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .readout {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 220px;
  }
  .readout span {
    color: var(--text-soft);
    font-size: 12px;
    white-space: nowrap;
  }
  .bar {
    flex: 1;
    height: 8px;
    background: var(--track);
    border-radius: 999px;
    overflow: hidden;
  }
  .bar > i {
    display: block;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #be7c00, #f5a700);
    transition: width 0.12s linear;
  }
  main {
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(210px, 260px);
    gap: 14px;
    padding: 14px;
    background:
      linear-gradient(180deg, rgba(21, 17, 10, 0.92), rgba(9, 8, 5, 0.98)),
      radial-gradient(circle at 42% 4%, rgba(245, 167, 0, 0.12), transparent 30%);
  }
  .stage {
    min-height: 0;
    display: grid;
    place-items: center;
  }
  .frame {
    position: relative;
    height: 100%;
    max-height: 100%;
    max-width: 100%;
    background: #0d0a05;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px;
    box-shadow: 0 18px 38px rgba(0, 0, 0, 0.46);
  }
  .done-toast {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translate(-50%, -14px);
    z-index: 3;
    padding: 7px 16px;
    background: var(--gold);
    color: #1a1206;
    font-size: 13px;
    font-weight: 900;
    border-radius: 999px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.38);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease, transform 0.22s ease;
    white-space: nowrap;
  }
  .done-toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }
  canvas {
    display: block;
    height: 100%;
    width: auto;
    max-width: 100%;
    background: var(--paper);
    border-radius: 4px;
    cursor: ns-resize;
  }
  aside {
    min-height: 0;
    border: 1px solid var(--border);
    background: rgba(26, 20, 8, 0.82);
    border-radius: 8px;
    padding: 11px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow: auto;
  }
  .howBox {
    background: rgba(245, 167, 0, 0.1);
    border: 1px solid rgba(245, 167, 0, 0.35);
    border-radius: 7px;
    padding: 9px 10px;
  }
  .howBox b {
    display: block;
    margin-bottom: 4px;
    color: var(--gold);
    font-size: 13px;
    line-height: 1.35;
  }
  .howBox span {
    display: block;
    margin: 0;
    color: var(--text-soft);
    font-size: 11.5px;
    line-height: 1.45;
  }
  .tuner {
    border-top: 1px solid var(--track);
    padding-top: 10px;
  }
  .tuner h2 {
    margin: 0 0 9px;
    color: var(--gold-soft);
    font-size: 13px;
    letter-spacing: 0;
  }
  .tuner .row {
    margin-bottom: 12px;
  }
  .tuner label {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    color: var(--text);
    font-size: 11.5px;
    margin-bottom: 5px;
  }
  .tuner label b {
    color: var(--gold-soft);
    font-weight: 700;
    white-space: nowrap;
  }
  .tuner input[type=range] {
    width: 100%;
    accent-color: var(--gold);
    cursor: pointer;
  }
  .tunerActions {
    display: flex;
    gap: 8px;
    margin-top: 2px;
  }
  .tunerActions .actionBtn {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--gold);
    background: transparent;
    color: var(--gold);
    border-radius: 7px;
    padding: 8px 6px;
    font-size: 11.5px;
    font-weight: 900;
    line-height: 1.2;
    cursor: pointer;
    white-space: nowrap;
  }
  .tunerActions .actionBtn.primary {
    background: var(--gold);
    color: #1a1206;
  }
  .complete {
    margin-top: auto;
    border-top: 1px solid var(--track);
    padding-top: 12px;
    color: var(--gold);
    font-weight: 900;
    min-height: 42px;
  }
  #loading {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--text-soft);
    z-index: 5;
    text-align: center;
    line-height: 1.6;
    padding: 20px;
  }
  @media (max-width: 760px) {
    header { padding: 8px 10px; }
    .subtitle { display: none; }
    .readout { min-width: 130px; }
    main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; gap: 10px; padding: 10px; }
    aside { max-height: 35vh; padding: 10px; }
    .howBox b { font-size: 12px; }
    .howBox span, .tuner label { font-size: 11px; }
    .complete { min-height: 0; }
    footer { font-size: 11px; padding: 7px 10px; }
    .done-toast { top: 10px; font-size: 12px; padding: 6px 14px; }
  }
</style>
</head>
<body>
  <header>
    <a href="../index.html">← 메뉴로</a>
    <div class="title">
      <h1>실크스크린</h1>
      <p class="subtitle">휠을 위로 굴려 밀대를 올리고, 아래로 굴릴 때만 잉크가 찍힙니다.</p>
    </div>
    <div class="readout" aria-label="드러난 비율">
      <span id="progressText">0%</span>
      <div class="bar"><i id="progressBar"></i></div>
    </div>
  </header>

  <main>
    <section class="stage" aria-label="실크스크린 작업대">
      <div class="frame">
        <canvas id="game" width="620" height="760"></canvas>
        <div class="done-toast" id="doneToast">그림 완성!</div>
      </div>
    </section>
    <aside>
      <div class="howBox">
        <b>위로 끝까지 올렸다 아래로 쭉 미세요</b>
        <span>맨 위까지 올리면 잉크가 묻고, 아래로 끝까지 밀 때 지나간 가로 띠만 찍힙니다.</span>
      </div>
      <div class="tuner" aria-label="실크스크린 손맛 튜닝">
        <h2>손맛 튜닝</h2>
        <div class="row">
          <label for="inkPowerRange"><span>잉크 진하기</span><b id="inkPowerValue">0.32</b></label>
          <input id="inkPowerRange" type="range" min="0.12" max="0.58" step="0.01" value="0.32" />
        </div>
        <div class="row">
          <label for="revealPassRange"><span>완성 기준</span><b id="revealPassValue">100%</b></label>
          <input id="revealPassRange" type="range" min="70" max="100" step="1" value="100" />
        </div>
        <div class="row">
          <label for="wheelSpeedRange"><span>밀대 속도</span><b id="wheelSpeedValue">0.22x</b></label>
          <input id="wheelSpeedRange" type="range" min="0.10" max="0.45" step="0.01" value="0.22" />
        </div>
        <div class="row">
          <label for="edgeBlurRange"><span>경계 부드럽기</span><b id="edgeBlurValue">1.6px</b></label>
          <input id="edgeBlurRange" type="range" min="0" max="4" step="0.1" value="1.6" />
        </div>
        <div class="tunerActions">
          <button class="actionBtn" id="resetTunerBtn" type="button">설정 기본값</button>
          <button class="actionBtn primary" id="redrawBtn" type="button">다시 그리기</button>
        </div>
      </div>
      <div class="complete" id="completeText"></div>
    </aside>
  </main>

  <footer>
    로컬에서 안 열리면 draw-proto-2026-05-31 폴더에서 python3 -m http.server 8094 를 켠 뒤 /new-actions-2026-06-03/ 로 들어오면 됩니다.
  </footer>

  <div id="loading">기준 그림을 읽는 중입니다.</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;
  const CELL = 4;
  const GW = Math.ceil(W / CELL);
  const GH = Math.ceil(H / CELL);
  let REVEAL_PASS = 100;
  const COLOR_SRC = "../assets/mena-lisa%203.jpg"; // 풀컬러 유화 완성품
  const GUIDE_SRC = "../assets/mena-lisa%202.png"; // 흐린 길잡이 선화
  const silkSettings = {
    inkPower: 0.32,
    wheelSpeed: 0.22,
    edgeBlur: 1.6,
  };

  // 풀컬러 그림(3번)을 종이 사각형에 미리 그려두는 층
  const colorLayer = document.createElement("canvas");
  colorLayer.width = W;
  colorLayer.height = H;
  const colorLayerCtx = colorLayer.getContext("2d");

  // 흐린 길잡이(2번 선화)를 그려두는 층
  const guideLayer = document.createElement("canvas");
  guideLayer.width = W;
  guideLayer.height = H;
  const guideLayerCtx = guideLayer.getContext("2d");

  // 누적값(reveal)을 회색 알파로 그린 뒤 흐림 처리해 마스크로 쓰는 층
  const revealAlpha = document.createElement("canvas");
  revealAlpha.width = W;
  revealAlpha.height = H;
  const revealAlphaCtx = revealAlpha.getContext("2d");

  // 풀컬러 그림을 누적 알파로 오려낸 결과 층
  const colorReveal = document.createElement("canvas");
  colorReveal.width = W;
  colorReveal.height = H;
  const colorRevealCtx = colorReveal.getContext("2d");

  const colorImg = new Image();
  const guideImg = new Image();
  let loaded = 0;
  let layout = null;
  let mask = null;       // 그림 사각형 전체 = 1 (배경 포함)
  let reveal = null;
  let totalMask = 0;
  let finished = false;
  let squeegeeY = 0;
  let armed = true;         // 맨 위까지 올려야 잉크가 묻고(true), 아래로 밀며 찍는다 (시작은 맨 위라 묻은 상태)
  let paintedDownTo = 0;    // 이번 패스에서 칠한 가장 아래 지점 — 그보다 더 내려가야 새로 칠해짐(중복 덧칠 방지)
  let lastPercent = 0;

  const doneToastEl = document.getElementById("doneToast");
  const completeTextEl = document.getElementById("completeText");
  const progressTextEl = document.getElementById("progressText");
  const progressBarEl = document.getElementById("progressBar");
  const tuner = {
    inkPowerRange: document.getElementById("inkPowerRange"),
    inkPowerValue: document.getElementById("inkPowerValue"),
    revealPassRange: document.getElementById("revealPassRange"),
    revealPassValue: document.getElementById("revealPassValue"),
    wheelSpeedRange: document.getElementById("wheelSpeedRange"),
    wheelSpeedValue: document.getElementById("wheelSpeedValue"),
    edgeBlurRange: document.getElementById("edgeBlurRange"),
    edgeBlurValue: document.getElementById("edgeBlurValue"),
    resetTunerBtn: document.getElementById("resetTunerBtn"),
    redrawBtn: document.getElementById("redrawBtn"),
  };

  function syncTunerLabels() {
    tuner.inkPowerValue.textContent = silkSettings.inkPower.toFixed(2);
    tuner.revealPassValue.textContent = REVEAL_PASS + "%";
    tuner.wheelSpeedValue.textContent = silkSettings.wheelSpeed.toFixed(2) + "x";
    tuner.edgeBlurValue.textContent = silkSettings.edgeBlur.toFixed(1) + "px";
  }

  function resetTunerDefaults() {
    tuner.inkPowerRange.value = tuner.inkPowerRange.defaultValue;
    tuner.revealPassRange.value = tuner.revealPassRange.defaultValue;
    tuner.wheelSpeedRange.value = tuner.wheelSpeedRange.defaultValue;
    tuner.edgeBlurRange.value = tuner.edgeBlurRange.defaultValue;
    silkSettings.inkPower = Number(tuner.inkPowerRange.value);
    REVEAL_PASS = Number(tuner.revealPassRange.value);
    silkSettings.wheelSpeed = Number(tuner.wheelSpeedRange.value);
    silkSettings.edgeBlur = Number(tuner.edgeBlurRange.value);
    syncTunerLabels();
    if (reveal) updateProgress();
    if (layout) render();
  }

  function resetDrawing() {
    if (reveal) reveal.fill(0);
    finished = false;
    lastPercent = 0;
    completeTextEl.textContent = "";
    doneToastEl.classList.remove("show");
    progressTextEl.textContent = "0%";
    progressBarEl.style.width = "0%";
    if (layout) squeegeeY = layout.y;
    armed = true;
    paintedDownTo = layout ? layout.y : 0;
    if (layout) render();
  }

  function bindTuner() {
    tuner.inkPowerRange.addEventListener("input", () => {
      silkSettings.inkPower = Number(tuner.inkPowerRange.value);
      syncTunerLabels();
    });
    tuner.revealPassRange.addEventListener("input", () => {
      REVEAL_PASS = Number(tuner.revealPassRange.value);
      syncTunerLabels();
      if (reveal) updateProgress();
    });
    tuner.wheelSpeedRange.addEventListener("input", () => {
      silkSettings.wheelSpeed = Number(tuner.wheelSpeedRange.value);
      syncTunerLabels();
    });
    tuner.edgeBlurRange.addEventListener("input", () => {
      silkSettings.edgeBlur = Number(tuner.edgeBlurRange.value);
      syncTunerLabels();
      if (layout) render();
    });
    tuner.resetTunerBtn.addEventListener("click", resetTunerDefaults);
    tuner.redrawBtn.addEventListener("click", resetDrawing);
    syncTunerLabels();
  }

  function fitImage(image, box) {
    const ratio = image.width / image.height;
    let h = box.h;
    let w = h * ratio;
    if (w > box.w) {
      w = box.w;
      h = w / ratio;
    }
    return {
      x: box.x + (box.w - w) / 2,
      y: box.y + (box.h - h) / 2,
      w,
      h,
    };
  }

  function load() {
    const onBoth = () => {
      loaded++;
      if (loaded < 2) return;
      try {
        layout = fitImage(colorImg, { x: 94, y: 44, w: 428, h: 680 });
        buildMask();
        buildColorLayer();
        buildGuideLayer();
      } catch (err) {
        console.error("이미지 분석 실패:", err);
        showAnalysisError();
        return;
      }
      squeegeeY = layout.y;
      document.getElementById("loading").style.display = "none";
      render();
    };
    colorImg.onload = onBoth;
    guideImg.onload = onBoth;
    colorImg.onerror = guideImg.onerror = () => {
      document.getElementById("loading").innerHTML = "이미지를 불러오지 못했습니다.<br />로컬 서버로 다시 열어주세요.";
    };
    colorImg.src = COLOR_SRC;
    guideImg.src = GUIDE_SRC;
  }

  function showAnalysisError() {
    const guide = location.protocol === "file:"
      ? "로컬 파일(file://)로 열면 그림 분석이 막힐 수 있습니다.<br />draw-proto-2026-05-31 폴더에서 python3 -m http.server 8094 를 켠 뒤 다시 열어주세요."
      : "그림 분석에 실패했습니다. 새로고침해 주세요.";
    document.getElementById("loading").innerHTML = guide;
  }

  // 마스크 = 그림 사각형 전체(배경 포함). 특정 부분만 안 먹는 문제 제거.
  function buildMask() {
    mask = new Uint8Array(GW * GH);
    const gx1 = Math.max(0, Math.floor(layout.x / CELL));
    const gx2 = Math.min(GW - 1, Math.ceil((layout.x + layout.w) / CELL) - 1);
    const gy1 = Math.max(0, Math.floor(layout.y / CELL));
    const gy2 = Math.min(GH - 1, Math.ceil((layout.y + layout.h) / CELL) - 1);
    for (let gy = gy1; gy <= gy2; gy++) {
      for (let gx = gx1; gx <= gx2; gx++) {
        mask[gy * GW + gx] = 1;
      }
    }
    totalMask = 0;
    for (let i = 0; i < mask.length; i++) {
      if (mask[i]) totalMask++;
    }
    reveal = new Float32Array(GW * GH);
  }

  function buildColorLayer() {
    colorLayerCtx.clearRect(0, 0, W, H);
    colorLayerCtx.drawImage(colorImg, layout.x, layout.y, layout.w, layout.h);
  }

  function buildGuideLayer() {
    guideLayerCtx.clearRect(0, 0, W, H);
    guideLayerCtx.drawImage(guideImg, layout.x, layout.y, layout.w, layout.h);
  }

  function applyBand(y1, y2) {
    const top = Math.max(layout.y, Math.min(y1, y2));
    const bottom = Math.min(layout.y + layout.h, Math.max(y1, y2));
    if (bottom <= top) return;
    const gy1 = Math.max(0, Math.floor(top / CELL));
    const gy2 = Math.min(GH - 1, Math.ceil(bottom / CELL) - 1);
    for (let gy = gy1; gy <= gy2; gy++) {
      const rowPower = silkSettings.inkPower * (0.86 + Math.random() * 0.28);
      for (let gx = 0; gx < GW; gx++) {
        const i = gy * GW + gx;
        if (!mask[i]) continue;
        reveal[i] = Math.min(1, reveal[i] + rowPower);
      }
    }
    updateProgress();
  }

  function updateProgress() {
    let inked = 0;
    for (let i = 0; i < reveal.length; i++) {
      if (mask[i]) inked += Math.min(1, reveal[i]);
    }
    const percent = totalMask ? Math.round((inked / totalMask) * 100) : 0;
    lastPercent = percent;
    progressTextEl.textContent = percent + "%";
    progressBarEl.style.width = Math.min(100, percent) + "%";
    const complete = percent >= REVEAL_PASS;
    if (complete !== finished) {
      finished = complete;
      completeTextEl.textContent = complete ? "완성! 잉크가 충분히 먹었습니다." : "";
      doneToastEl.classList.toggle("show", complete);
    }
  }

  // 누적값을 회색 알파로 그리고 가장자리만 흐림 → 풀컬러 그림을 그 모양대로 오려냄
  function drawRevealBuffers() {
    revealAlphaCtx.save();
    revealAlphaCtx.setTransform(1, 0, 0, 1, 0, 0);
    revealAlphaCtx.clearRect(0, 0, W, H);
    for (let level = 1; level <= 8; level++) {
      revealAlphaCtx.fillStyle = `rgba(0,0,0,${level / 8})`;
      for (let i = 0; i < reveal.length; i++) {
        if (!mask[i]) continue;
        const amount = reveal[i];
        if (amount <= 0) continue;
        const q = Math.ceil(amount * 8);
        if (q !== level) continue;
        const gx = i % GW;
        const gy = (i / GW) | 0;
        revealAlphaCtx.fillRect(gx * CELL, gy * CELL, CELL, CELL);
      }
    }
    revealAlphaCtx.restore();

    // 풀컬러 그림을 누적 알파 모양대로 오려냄 + 가장자리 약한 흐림
    colorRevealCtx.save();
    colorRevealCtx.setTransform(1, 0, 0, 1, 0, 0);
    colorRevealCtx.clearRect(0, 0, W, H);
    colorRevealCtx.drawImage(colorLayer, 0, 0);
    colorRevealCtx.globalCompositeOperation = "destination-in";
    colorRevealCtx.filter = `blur(${silkSettings.edgeBlur}px)`;
    colorRevealCtx.drawImage(revealAlpha, 0, 0);
    colorRevealCtx.filter = "none";
    colorRevealCtx.globalCompositeOperation = "source-over";
    colorRevealCtx.restore();
  }

  function drawPaper() {
    ctx.fillStyle = "#eadfc5";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#ded1b4";
    ctx.fillRect(layout.x - 18, layout.y - 22, layout.w + 36, layout.h + 44);
    ctx.fillStyle = "#f2ead9";
    ctx.fillRect(layout.x - 8, layout.y - 10, layout.w + 16, layout.h + 20);
    // 흐린 길잡이(2번 선화)를 아주 옅게 항상 깔아 둠
    ctx.save();
    ctx.globalAlpha = 0.12;
    ctx.drawImage(guideLayer, 0, 0);
    ctx.restore();
  }

  function drawMesh() {
    const x = layout.x - 10;
    const y = layout.y - 12;
    const w = layout.w + 20;
    const h = layout.h + 24;
    ctx.save();
    ctx.strokeStyle = "rgba(72, 61, 38, 0.18)";
    ctx.lineWidth = 1;
    for (let yy = y; yy <= y + h; yy += 12) {
      ctx.beginPath();
      ctx.moveTo(x, yy);
      ctx.lineTo(x + w, yy);
      ctx.stroke();
    }
    for (let xx = x; xx <= x + w; xx += 12) {
      ctx.beginPath();
      ctx.moveTo(xx, y);
      ctx.lineTo(xx, y + h);
      ctx.stroke();
    }
    ctx.strokeStyle = "rgba(45, 35, 18, 0.7)";
    ctx.lineWidth = 3;
    ctx.strokeRect(x, y, w, h);
    ctx.restore();
  }

  function drawSqueegee() {
    const x = layout.x - 34;
    const y = squeegeeY;
    const w = layout.w + 68;
    ctx.save();
    ctx.fillStyle = "rgba(82, 55, 24, 0.82)";
    ctx.fillRect(layout.x - 18, layout.y - 32, layout.w + 36, 18);
    ctx.fillStyle = "rgba(21, 17, 10, 0.92)";
    ctx.fillRect(x, y - 8, w, 17);
    // 잉크 묻은 상태(armed)면 금색 진하게, 마른 상태면 흐리게 — 위로 올려야 함을 알림
    ctx.fillStyle = armed ? "#f5a700" : "rgba(120, 100, 60, 0.55)";
    ctx.fillRect(x, y - 3, w, 6);
    ctx.strokeStyle = "rgba(245, 167, 0, 0.72)";
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y - 8, w, 17);
    ctx.restore();
  }

  function render() {
    drawRevealBuffers();
    drawPaper();
    ctx.drawImage(colorReveal, 0, 0); // 떠오른 풀컬러 그림
    drawMesh();
    drawSqueegee();
    ctx.fillStyle = "rgba(42, 31, 14, 0.72)";
    ctx.fillRect(18, 18, 132, 30);
    ctx.fillStyle = "#f0c674";
    ctx.font = "700 15px system-ui, sans-serif";
    ctx.fillText(finished ? "완성" : "잉크 " + lastPercent + "%", 31, 38);
  }

  function onWheel(event) {
    event.preventDefault();
    if (!layout) return;
    const raw = event.deltaY;
    if (Math.abs(raw) < 2) return;
    const move = Math.max(-46, Math.min(46, raw * silkSettings.wheelSpeed));
    squeegeeY = Math.max(layout.y, Math.min(layout.y + layout.h, squeegeeY + move));
    // 맨 위에서 잉크가 묻으면(armed) 새 패스 시작 — 칠한 깊이를 맨 위로 리셋
    if (squeegeeY <= layout.y + 1) { armed = true; paintedDownTo = layout.y; }
    // 이번 패스에서 '아직 안 칠한 더 아래 구간'만 한 겹으로 칠한다.
    // 중간에 위로 갔다 다시 아래로 와도 paintedDownTo 위는 다시 안 칠해짐(덧칠 방지).
    if (move > 0 && armed && squeegeeY > paintedDownTo) {
      applyBand(paintedDownTo, squeegeeY);
      paintedDownTo = squeegeeY;
    }
    // 맨 아래까지 내려가면 잉크 소진 → 다시 맨 위로 올려야 한다
    if (squeegeeY >= layout.y + layout.h - 1) armed = false;
    render();
  }

  window.addEventListener("wheel", onWheel, { passive: false });
  bindTuner();
  load();
})();
</script>
</body>
</html>
