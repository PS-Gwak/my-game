<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>결투</title>
<style>
  /* 화면에는 손바닥만 한 기기 하나만 보인다: 몸통 안에 검은 화면(4:3), 그 아래 키캡 두 개, 맨 아래 오돌토돌한 띠.
     검은 화면 안은 검정과 흰색 두 가지만 쓴다. 글씨와 테두리는 전부 캔버스(그림 종이)에 칸으로 찍는다 */
  :root { --black: #000000; --white: #f2f2f2; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--black); color: var(--white);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    display: flex; align-items: center; justify-content: center;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  /* 받침대는 창 전체: 기기를 가로 · 세로 가운데에 올려 둔다(창 바깥 배경은 검정) */
  main {
    width: 100vw; height: 100vh; height: 100dvh; padding: 0;
    display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr);
  }
  .stage { min-height: 0; min-width: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  /* 기기 몸통: 크기와 자리는 스크립트가 창 크기에 맞춰 정한다. 겉모양(둥근 위 · 깎인 아래 · 몸통 색)은 안쪽 그림(#bodyArt)이 그린다 */
  .device-e { position: relative; flex: none; line-height: 0; }
  .screen { position: absolute; display: block; image-rendering: pixelated; background: var(--black); border-radius: 2px; }
  .body-art { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  .grip { position: absolute; display: block; image-rendering: pixelated; pointer-events: none; }
  /* 몸통 위쪽 띠의 작은 버튼들(게임 고르기 · 소리 · 키캡 그림 · 몸통 색) */
  .corner-btn {
    position: absolute; top: 3px; padding: 0; margin: 0; border: 0; background: transparent;
    line-height: 0; cursor: pointer; touch-action: none; outline: none;
  }
  .corner-btn canvas { display: block; image-rendering: pixelated; }
  .key {
    position: absolute; padding: 0; margin: 0; border: 0; background: transparent;
    line-height: 0; cursor: pointer; touch-action: none; outline: none;
  }
  .key canvas { display: block; image-rendering: pixelated; }
  /* 화면에는 안 보이는 글자: 읽어 주는 기능 · 검사기가 버튼 글을 읽을 수 있게 남겨 둔다 */
  .ghost { position: absolute; left: 0; top: 0; width: 100%; height: 100%; color: transparent; overflow: hidden; white-space: nowrap; pointer-events: none; line-height: 1; }
</style>
</head>
<body>
<main id="main">
  <div class="stage" id="stage">
    <div class="device-e" id="deviceE">
      <svg class="body-art" id="bodyArt" aria-hidden="true"><path id="bodyFill"></path><path id="bodyLine" fill="none"></path></svg>
      <button class="corner-btn game-btn" id="gameBtn" type="button" tabindex="-1"><canvas id="gameCanvas"></canvas><span class="ghost" id="gameLabel">게임 3 결투</span></button>
      <button class="corner-btn" id="soundBtn" type="button" tabindex="-1"><canvas id="soundCanvas"></canvas><span class="ghost" id="soundLabel">소리 1</span></button>
      <button class="corner-btn" id="capBtn" type="button" tabindex="-1"><canvas id="capCanvas"></canvas><span class="ghost" id="capLabel">키캡 smooth</span></button>
      <button class="corner-btn skin-btn" id="skinBtn" type="button" tabindex="-1"><canvas id="skinCanvas"></canvas><span class="ghost" id="skinLabel">몸통 gray</span></button>
      <canvas class="screen" id="screen" aria-label="서부 결투"></canvas>
      <button class="key" id="keySlide" type="button" tabindex="-1"><canvas id="keySlideCanvas"></canvas><span class="ghost">다음 판</span></button>
      <button class="key" id="keyPush" type="button" tabindex="-1"><canvas id="keyPushCanvas"></canvas><span class="ghost">쏴</span></button>
      <canvas class="grip" id="grip"></canvas>
    </div>
  </div>
</main>
<script>
/* 결투 — 서부 총잡이 대결.
   비유: 운동회 달리기 출발 총. 「!」가 뜨기 전에 움직이면 부정 출발(반칙패), 뜨고 나서는 먼저 누른 쪽이 이긴다.
   멀리서 넓게 잡은 장면: 화면 왼쪽 끝에 나, 오른쪽 끝에 상대가 마주 보고 서 있다.
   이길 때마다 다음 상대가 조금씩 빨라지고, 지면 연승이 0으로 돌아간다.
   11/11 17:21 피드백판: 배치는 4:3 화면 하나 · 몸통 색 기본 회색 · 키캡 그림 넷(도트 · 매끈 · 스위치 · 납작) · 키캡 효과음 여섯 벌 ·
   왼쪽 키 = 다음 판 / 새 판(RE, 연승은 지우지 않음), 오른쪽 키 = 쏘기 · 기다리는 동안은 굴러가는 마른 풀만 ·
   왼쪽 위에는 「N연승」만 · 지거나 반칙이면 가운데에 왕관 + 「최고 N연승」. */
(function () {
  'use strict';

// === KEY-SHARED 여기부터 ===
  /* ---------- 키캡 효과음(여섯 벌, 코드로 만든 소리) ----------
     비유: 작은 드럼. 「딸깍」 = 짧은 잡음(스위치 부딪는 소리) + 짧은 음(키캡 통 울림)을 섞어 0.1초 안에 사라지게 한다.
     형님이 고른 키보드 소리 여섯 개의 길이 · 음색을 재서 닮게 맞춘 것이고, 녹음 파일은 쓰지 않는다.
     set = [잡음 걸러 듣기 종류, 잡음 중심 Hz, 잡음 폭 Q, 잡음 길이 초, 잡음 세기, 통 울림 Hz, 통 울림 길이 초, 통 울림 세기, 전체 세기] */
  const KeySound = (() => {
    const KEY = 'hold-on-keys-sound';
    const SETS = [
      ['bandpass', 2000, 1.0, 0.22, 0.9, 1330, 0.10, 0.40, 0.8],  // 1 또렷한 딸깍
      ['bandpass', 6800, 0.8, 0.26, 1.0, 5200, 0.04, 0.15, 0.7],  // 2 높고 날카로운 틱
      ['bandpass', 3600, 0.8, 0.22, 0.6, 90, 0.12, 0.45, 0.7],    // 3 가볍게 톡 + 낮은 울림
      ['bandpass', 2600, 0.9, 0.16, 0.9, 145, 0.10, 0.50, 0.8],   // 4 도톰한 톡(thock)
      ['bandpass', 1500, 0.9, 0.19, 0.9, 110, 0.13, 0.70, 0.8],   // 5 가장 낮고 묵직한 툭
      ['bandpass', 1000, 1.2, 0.19, 0.7, 900, 0.09, 0.50, 0.55],  // 6 먹먹한 톡
    ];
    let ac = null, noise = null, index = 1; // 0 = 끔, 1~6
    try { const v = Number(localStorage.getItem(KEY)); if (Number.isInteger(v) && v >= 0 && v <= SETS.length && localStorage.getItem(KEY) !== null) index = v; } catch (e) { /* 저장소가 막혀도 그대로 */ }
    function ctx() {
      if (!ac) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ac = new AC(); }
      if (ac.state === 'suspended') ac.resume();
      if (!noise) { // 흰 잡음 0.25초를 한 번만 만들어 두고 돌려쓴다
        noise = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.25), ac.sampleRate);
        const d = noise.getChannelData(0); let s = 12345;
        for (let i = 0; i < d.length; i += 1) { s = (s * 1103515245 + 12345) & 0x7fffffff; d[i] = s / 0x3fffffff - 1; }
      }
      return ac;
    }
    // 한 번 치기. up = 손을 뗄 때(조금 높고 작게)
    function hit(set, up, c = ctx(), dest = c && c.destination) {
      if (!c) return;
      const [type, f, q, nd, ng, bf, bd, bg, vol] = set, t = c.currentTime + 0.001, k = up ? 0.45 : 1, pitch = up ? 1.3 : 1;
      const src = c.createBufferSource(); src.buffer = noise;
      const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.value = f * pitch; fl.Q.value = q;
      const g1 = c.createGain(); g1.gain.setValueAtTime(0.0001, t); g1.gain.exponentialRampToValueAtTime(ng * vol * k, t + 0.002); g1.gain.exponentialRampToValueAtTime(0.0001, t + nd);
      src.connect(fl); fl.connect(g1); g1.connect(dest); src.start(t); src.stop(t + nd + 0.02);
      const osc = c.createOscillator(); osc.type = bf < 300 ? 'sine' : 'triangle';
      osc.frequency.setValueAtTime(bf * pitch, t); osc.frequency.exponentialRampToValueAtTime(bf * pitch * 0.7, t + bd);
      const g2 = c.createGain(); g2.gain.setValueAtTime(0.0001, t); g2.gain.exponentialRampToValueAtTime(bg * vol * k, t + 0.003); g2.gain.exponentialRampToValueAtTime(0.0001, t + bd);
      osc.connect(g2); g2.connect(dest); osc.start(t); osc.stop(t + bd + 0.02);
    }
    return {
      count: SETS.length, sets: SETS, hit,
      get index() { return index; },
      set(i) { index = Math.max(0, Math.min(SETS.length, Math.floor(Number(i)) || 0)); try { localStorage.setItem(KEY, String(index)); } catch (e) { /* 메모리에만 */ } return index; },
      next() { this.set((index + 1) % (SETS.length + 1)); if (index) hit(SETS[index - 1], false); return index; }, // 고르면 그 소리를 한 번 들려준다
      down() { if (index) hit(SETS[index - 1], false); },
      up() { if (index) hit(SETS[index - 1], true); },
      unlock: ctx, // 폰은 손가락이 닿은 뒤에야 소리가 난다 → 첫 누름에서 불러 준다
    };
  })();

  /* ---------- 키캡 그림(도트 말고 세 가지) ----------
     style 1 = 매끈한 플라스틱 키캡 · 2 = 스위치가 비치는 투명 키(본보기 기기) · 3 = 납작한 미니멀. (0 = 도트는 각 게임의 예전 그림 그대로)
     draw(): 키 캔버스(한 변 n 기기 점)에 키를 그리고, 아이콘을 놓을 자리(윗면 가운데 cx · cy, 크기 s)를 돌려준다.
     icon(): 그 자리에 매끈한 아이콘을 그린다 — 'gun' 권총 · 'RE' · 'footL' 왼발 · 'footR' 오른발(엄지발가락과 발바닥 패인 곳이 안쪽) */
  const KeyArt = {
    names: ['dot', 'smooth', 'switch', 'flat'],
    rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); },
    draw(c, n, style, down) {
      const u = n / 20, rr = this.rr;
      c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, n, n); c.lineJoin = 'round';
      if (style === 1) { // 매끈한 플라스틱: 바닥 그림자 → 옆면(치마) → 윗면. 누르면 윗면이 내려가고 치마가 짧아진다
        const d = down ? 1.7 * u : 0;
        rr(c, 1 * u, 2.2 * u, 18 * u, 17.3 * u, 3.2 * u); c.fillStyle = 'rgba(0,0,0,0.28)'; c.fill();
        let g = c.createLinearGradient(0, 2 * u, 0, 19 * u); g.addColorStop(0, '#c4c4c4'); g.addColorStop(1, '#8a8a8a');
        rr(c, 1.2 * u, 1.4 * u + d, 17.6 * u, 17.2 * u - d, 3 * u); c.fillStyle = g; c.fill(); c.lineWidth = 0.45 * u; c.strokeStyle = '#2a2a2a'; c.stroke();
        g = c.createLinearGradient(0, 2 * u + d, 0, 15 * u + d); g.addColorStop(0, '#ffffff'); g.addColorStop(1, down ? '#dcdcdc' : '#ececec');
        rr(c, 3 * u, 2.4 * u + d, 14 * u, 12.2 * u, 2.4 * u); c.fillStyle = g; c.fill(); c.lineWidth = 0.35 * u; c.strokeStyle = '#555'; c.stroke();
        return { cx: n / 2, cy: 8.5 * u + d, s: 8 * u };
      }
      if (style === 2) { // 투명 키: 어두운 스위치 판 → 밝은 스위치 몸 + 십자 축 → 그 위에 비치는 투명 캡. 누르면 캡이 작아지며 내려간다
        rr(c, 0.8 * u, 0.8 * u, 18.4 * u, 18.4 * u, 2.6 * u); c.fillStyle = '#2c2c2c'; c.fill();
        rr(c, 3.4 * u, 3.4 * u, 13.2 * u, 13.2 * u, 1.6 * u); c.fillStyle = '#e4e4e4'; c.fill();
        c.fillStyle = '#b4b4b4'; rr(c, 8.6 * u, 6 * u, 2.8 * u, 8 * u, 0.6 * u); c.fill(); rr(c, 6 * u, 8.6 * u, 8 * u, 2.8 * u, 0.6 * u); c.fill();
        const m = down ? 2.3 * u : 1.4 * u;
        rr(c, m, m + (down ? 0.6 * u : 0), n - 2 * m, n - 2 * m, 2.8 * u); c.fillStyle = down ? 'rgba(255,255,255,0.26)' : 'rgba(255,255,255,0.40)'; c.fill();
        c.lineWidth = 0.5 * u; c.strokeStyle = 'rgba(255,255,255,0.92)'; c.stroke();
        c.beginPath(); c.moveTo(m + 2.2 * u, m + 1.8 * u); c.lineTo(n - m - 5 * u, m + 1.8 * u); c.lineWidth = 0.7 * u; c.lineCap = 'round'; c.strokeStyle = 'rgba(255,255,255,0.75)'; c.stroke();
        return { cx: n / 2, cy: n / 2 + (down ? 0.6 * u : 0), s: 8 * u };
      }
      // 납작: 흰 면 + 검은 테두리 + 아래 딱딱한 그림자. 누르면 그림자 자리로 내려앉는다
      const d = down ? 1.3 * u : 0;
      if (!down) { rr(c, 1.3 * u, 2.6 * u, 17.4 * u, 16.4 * u, 3.4 * u); c.fillStyle = '#111'; c.fill(); }
      rr(c, 1.3 * u, 1.2 * u + d, 17.4 * u, 16.4 * u, 3.4 * u); c.fillStyle = down ? '#d6d6d6' : '#fafafa'; c.fill(); c.lineWidth = 0.9 * u; c.strokeStyle = '#111'; c.stroke();
      return { cx: n / 2, cy: 9.4 * u + d, s: 8.5 * u };
    },
    icon(c, kind, cx, cy, s, color = '#111') {
      if (!kind) return;
      c.save(); c.translate(cx, cy); c.fillStyle = color; c.strokeStyle = color; c.lineJoin = 'round'; c.lineCap = 'round';
      if (kind === 'RE') {
        c.font = `800 ${Math.round(s * 0.62)}px -apple-system, "Helvetica Neue", Arial, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('RE', 0, s * 0.03);
      } else if (kind === 'gun') { // 옆에서 본 리볼버: 총열 → 탄창 → 손잡이 → 방아쇠울
        const k = s / 10; c.beginPath();
        c.moveTo(-5 * k, -2.6 * k); c.lineTo(4.6 * k, -2.6 * k); c.lineTo(4.6 * k, -0.9 * k); c.lineTo(0.6 * k, -0.9 * k); c.lineTo(0.6 * k, 0.2 * k);
        c.lineTo(-1.2 * k, 0.2 * k); c.lineTo(-2.4 * k, 3.6 * k); c.lineTo(-4.9 * k, 3.6 * k); c.lineTo(-3.9 * k, -0.2 * k); c.lineTo(-5 * k, -0.6 * k); c.closePath(); c.fill();
        c.beginPath(); c.arc(-0.2 * k, 1.2 * k, 1.25 * k, 0.1, Math.PI * 0.95); c.lineWidth = 0.55 * k; c.stroke();
        c.fillRect(3.9 * k, -3.4 * k, 0.7 * k, 0.9 * k);
      } else if (kind === 'footL' || kind === 'footR') { // 발바닥: 뒤꿈치 → 패인 아치(안쪽) → 볼 + 발가락 다섯(엄지가 안쪽 · 가장 큼)
        const k = s / 10, inner = kind === 'footL' ? 1 : -1; // 왼발의 안쪽 = 오른쪽
        c.scale(inner, 1);
        c.beginPath();
        c.moveTo(-0.2 * k, 4.6 * k);
        c.bezierCurveTo(-2.2 * k, 4.6 * k, -2.5 * k, 2.4 * k, -2.2 * k, 0.6 * k);   // 바깥쪽 선(곧게)
        c.bezierCurveTo(-2.4 * k, -1.2 * k, -1.6 * k, -2.2 * k, 0.2 * k, -2.2 * k);   // 볼 위쪽
        c.bezierCurveTo(2 * k, -2.2 * k, 2.6 * k, -1.2 * k, 2.2 * k, 0.2 * k);        // 볼 안쪽
        c.bezierCurveTo(1.9 * k, 1.2 * k, 0.7 * k, 1.5 * k, 0.9 * k, 2.6 * k);        // 패인 아치
        c.bezierCurveTo(1.2 * k, 3.8 * k, 1 * k, 4.6 * k, -0.2 * k, 4.6 * k);         // 뒤꿈치
        c.closePath(); c.fill();
        const toes = [[1.75, -3.55, 0.95], [0.25, -4.05, 0.72], [-0.85, -3.75, 0.62], [-1.75, -3.2, 0.55], [-2.45, -2.4, 0.48]];
        for (const [x, y, r] of toes) { c.beginPath(); c.arc(x * k, y * k, r * k, 0, Math.PI * 2); c.fill(); }
      }
      c.restore();
    },
  };
// === KEY-SHARED 여기까지 ===

  const W = 128;          // 그림판 가로 칸 수
  const ROWS = 96;        // 그림판 세로 칸 수(4:3 화면 하나뿐 — 예전 배치 F)
  const BASE_H = 64;      // 그림을 처음 짠 기준 세로 칸 수(장면은 여기서 늘어난 만큼 아래로 내려 그린다)
  const BG = '#000000', INK = '#f2f2f2';
  const KEYS = {
    streak: 'hold-on-key-duel-streak',   // 지금 연승
    best: 'hold-on-key-duel-best',       // 최고 연승
    bestMs: 'hold-on-key-duel-best-ms',  // 이긴 판 중 가장 빠른 반응(1/1000초). 화면에는 안 보이고 저장만 한다
  };
  const SKIN_KEY = 'hold-on-keys-skin';     // 고른 몸통 색(0~3). 여섯 게임이 함께 쓴다
  const CAP_KEY = 'hold-on-keys-cap';       // 고른 키캡 그림(0~3). 여섯 게임이 함께 쓴다
  const LABEL = '쏴';

  // 대결 규칙 값(시간 단위는 전부 1/1000초)
  const WAIT_MIN = 1500, WAIT_MAX = 4500; // 대결 시작 ~ 신호까지 무작위 시간
  const FIRST_WAIT_MIN = 1200, FIRST_WAIT_MAX = 3000; // 게임에 막 들어온 첫 판만: 3초 안에 신호(그냥 서 있는 시간이 길지 않게)
  const ME_MARK_MS = 1500; // 결투가 시작되면 내 머리 위 「나」 표시가 떠 있는 시간
  const OPP_FIRST = 600, OPP_STEP = 40, OPP_FLOOR = 160; // 상대 반응: 첫 상대 0.6초, 이길 때마다 0.04초 빨라짐, 0.16초 밑으로는 안 줄어듦
  const oppFor = (n) => Math.max(OPP_FLOOR, OPP_FIRST - OPP_STEP * n);
  const IGNORE_AFTER = 400; // 결과가 나온 직후 이만큼은 누름을 무시(늦게 누른 것이 다음 판 반칙이 되지 않게). 두 키 모두 같다
  const FALL_START = 100, FALL_MS = 300; // 맞은 사람: 0.1초까지 서 있음 → 0.3초까지 넘어가는 중 → 누움

  let phase = 'ready';      // 'ready' 처음 · 'wait' 노려봄 · 'signal' 신호 뜸 · 'result' 결과
  let startT = 0;           // 이번 판 시작 시각
  let waitMs = null;        // 이번 판 신호까지 시간
  let signalT = 0;          // 「!」를 그린 시각
  let duelOpp = oppFor(streak); // 이번 상대 반응 시간
  let myMs = null;          // 이번 판 내 반응 시간
  let outcome = null;       // null · 'win' · 'lose' · 'foul'
  let shotMs = null;        // 화면 한가운데 위쪽에 그릴, 쏜 쪽의 반응 시간(반칙이면 null)
  let resultT = 0;          // 결과가 난 시각
  let autoLoseFrom = null;  // 상대가 저절로 쏴서 진 판이면 그 전 연승(늦게 도착한 누름을 되살릴 때 씀)
  let endedStreak = 0;      // 지거나 반칙한 판에서, 그 직전까지 쌓았던 연승(최고 기록과 같으면 왕관이 깜빡인다)
  let fixedWait = null;     // 검사용: 신호까지 시간 고정(null = 무작위)

  function saveRecords() {
    saveRaw(KEYS.streak, streak);
    saveRaw(KEYS.best, best);
    if (bestMs === null) clearKey(KEYS.bestMs); else saveRaw(KEYS.bestMs, bestMs);
  }

  // 지금 두 사람의 자세
  function poses() {
    if (phase !== 'result') return { me: 'stand', opp: 'stand' };
    const dt = now() - resultT;
    const hit = dt < FALL_START ? 'stand' : dt < FALL_MS ? 'fall' : 'down';
    return outcome === 'win' ? { me: 'shoot', opp: hit } : { me: hit, opp: 'shoot' };
  }
  const markNow = () => (phase === 'signal' ? '!' : phase === 'result' && outcome === 'foul' ? 'X' : null);
  const timeTextNow = () => (phase === 'result' && shotMs !== null ? secText(shotMs) : '');
  // 「최고 N연승」 줄: 지거나 반칙한 결과 화면에서만(이긴 적이 한 번도 없으면 없음).
  // record = 방금 끝난 연승이 곧 최고 기록, on = 왕관이 지금 켜져 있는지(record일 때만 깜빡인다)
  function bestLineNow() {
    if (phase !== 'result' || (outcome !== 'lose' && outcome !== 'foul') || best <= 0) return null;
    const record = endedStreak > 0 && streak === 0 && endedStreak === best;
    const on = !record || Math.floor((now() - resultT) / CROWN_BLINK_MS) % 2 === 0;
    return { best, record, on };
  }

  /* ---------- 대결 흐름 ---------- */
  function startDuel(t) {
    phase = 'wait';
    autoDuel = false;
    startT = t;
    const [lo, hi] = firstDuel ? [FIRST_WAIT_MIN, FIRST_WAIT_MAX] : [WAIT_MIN, WAIT_MAX];
    waitMs = fixedWait !== null ? fixedWait : lo + Math.floor(Math.random() * (hi - lo + 1));
    firstDuel = false;
    windDir = Math.random() < 0.5 ? 1 : -1;
    duelOpp = oppFor(streak);
    myMs = null; outcome = null; shotMs = null; autoLoseFrom = null; signalT = 0; endedStreak = 0;
    render(); startLoop();
  }
  function endDuel(t) {
    phase = 'result';
    resultT = t;
    saveRecords();
    syncText(); render(); startLoop();
  }
  // 신호 전에 누름: 반칙패
  function foul(t) {
    endedStreak = streak;
    outcome = 'foul'; streak = 0; shotMs = null; myMs = null; autoLoseFrom = null;
    endDuel(t);
  }
  // 신호 뒤 내가 쏨: 내 시간이 상대 시간보다 같거나 빠르면 이김
  function shoot(t) {
    myMs = Math.max(0, Math.round(t - signalT));
    autoLoseFrom = null;
    if (myMs <= duelOpp) {
      outcome = 'win'; streak += 1; shotMs = myMs;
      if (streak > best) best = streak;
      if (bestMs === null || myMs < bestMs) bestMs = myMs;
    } else {
      endedStreak = streak;
      outcome = 'lose'; streak = 0; shotMs = duelOpp;
    }
    endDuel(t);
  }
  // 내가 안 눌러서 상대가 먼저 쏨
  function oppShoots(at) {
    autoLoseFrom = streak;
    endedStreak = streak;
    const spared = autoDuel; // 저절로 시작한 판에서 한 번도 안 누르고 졌으면 연승은 그대로
    outcome = 'lose'; if (!spared) streak = 0; shotMs = duelOpp; myMs = null;
    endDuel(at);
  }
  // 정해진 시각이 지난 일을 차례로 처리: 신호 뜨기 → 상대가 쏘기
  function advanceTo(t) {
    if (phase === 'wait' && t >= startT + waitMs) {
      phase = 'signal';
      render();
      // 신호 시각 = 「!」를 그린 시각(손으로 돌리는 시계에서는 정해진 그 시각)
      signalT = manual !== null ? startT + waitMs : now();
    }
    if (phase === 'signal' && t >= signalT + duelOpp) oppShoots(signalT + duelOpp);
  }
  // 오른쪽 키(쏘기)를 한 번 누름(t = 누른 시각)
  function fire(t) {
    if (phase === 'ready') { startDuel(t); return; }
    if (phase === 'wait') { foul(t); return; }
    if (phase === 'signal') {
      if (t < signalT) foul(t); // 「!」가 그려지기 전에 누른 것
      else shoot(t);
      return;
    }
    // 결과: 화면이 상대 승으로 바뀐 다음에 도착했지만 실제로는 상대보다 먼저 누른 것이면 되살린다
    // (실제 시계에서만 생기는 일. 손으로 돌리는 시계에서는 누른 시각이 늘 지금이라 해당 없음)
    if (manual === null && autoLoseFrom !== null && t >= signalT && t < resultT) {
      streak = autoLoseFrom;
      shoot(t);
      return;
    }
    if (t - resultT < IGNORE_AFTER) return;
    startDuel(t);
  }
  // 대결 무효(화면이 가려짐): 처음 상태로, 연승은 그대로
  function cancelDuel() {
    if (phase !== 'wait' && phase !== 'signal') return;
    phase = 'ready'; waitMs = null; myMs = null; outcome = null; shotMs = null; autoLoseFrom = null;
    duelOpp = oppFor(streak);
    render();
  }
  // 왼쪽 키(RE · R) = 다음 판 / 새 판. 비유: 「한 판 더」 버튼 — 점수판(연승)은 건드리지 않는다.
  // 결과 화면이면 새 결투(이겼으면 연승을 이어서, 졌으면 0에서 — 총 키로 넘어갈 때와 같다),
  // 기다리는 중 · 신호 중이면 그 판을 무르고 새 결투(연승 그대로, 반칙 아님).
  // 결과 직후 0.4초 안의 누름은 총 키와 똑같이 무시한다
  function restart(t) {
    if (phase === 'result' && t - resultT < IGNORE_AFTER) return;
    startDuel(t);
  }

  /* ---------- 실제 시간: 화면이 보이는 동안 매 장면마다 신호 · 상대 · 쓰러짐 · 왕관 깜빡임을 챙긴다 ---------- */
  let rafId = 0;
  const crownBlinks = () => { const b = bestLineNow(); return !!(b && b.record); };
  const needsLoop = () => manual === null && !document.hidden &&
    (phase === 'wait' || phase === 'signal' || (phase === 'result' && (now() - resultT < FALL_MS || crownBlinks())));
  function loop() {
    rafId = 0;
    if (manual !== null || document.hidden) return;
    advanceTo(now());
    if (phase !== 'ready') render(); // 노려보는 동안 = 굴러가는 풀 · 「나」 표시, 결과 = 쓰러지는 그림 · 깜빡이는 왕관
    if (!rafId && needsLoop()) rafId = requestAnimationFrame(loop); // 위에서 이미 다음 장면을 걸어 두었으면 또 걸지 않는다
  }
  function startLoop() {
    if (rafId || !needsLoop()) return;
    rafId = requestAnimationFrame(loop);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { releaseAllKeys(); cancelDuel(); return; }
    // 뒤쪽 탭으로 열려서 아직 첫 판을 못 했으면, 화면이 보이는 순간 첫 판을 시작한다
    if (firstDuel && phase === 'ready' && manual === null) { startDuel(now()); autoDuel = true; return; }
    render(); startLoop();
  });

  /* ---------- 몸통 색 · 키캡 그림 · 소리 바꾸기 ---------- */
  function setSkin(n) {
    n = Math.floor(Number(n));
    if (!(n >= 0 && n < SKINS.length)) return false;
    skin = n;
    saveRaw(SKIN_KEY, n);
    fit();
    return true;
  }
  const nextSkin = () => setSkin((skin + 1) % SKINS.length);
  function setCap(n) {
    n = Math.floor(Number(n));
    if (!(n >= 0 && n < KeyArt.names.length)) return false;
    cap = n;
    saveRaw(CAP_KEY, n);
    drawCapBtn(); drawKeys();
    return true;
  }
  const nextCap = () => setCap((cap + 1) % KeyArt.names.length);
  // 소리 버튼: 다음 소리로(1 → … → 6 → 끔 → 1). 고른 소리를 한 번 들려준다
  function nextSound() { KeySound.next(); drawSoundBtn(); return KeySound.index; }

  /* ---------- 화면 요소 ---------- */
  const el = {
    main: document.getElementById('main'),
    stage: document.getElementById('stage'),
    screen: document.getElementById('screen'),
    deviceE: document.getElementById('deviceE'),
    bodyArt: document.getElementById('bodyArt'), bodyFill: document.getElementById('bodyFill'), bodyLine: document.getElementById('bodyLine'),
    gameBtn: document.getElementById('gameBtn'), gameCanvas: document.getElementById('gameCanvas'), gameLabel: document.getElementById('gameLabel'),
    soundBtn: document.getElementById('soundBtn'), soundCanvas: document.getElementById('soundCanvas'), soundLabel: document.getElementById('soundLabel'),
    capBtn: document.getElementById('capBtn'), capCanvas: document.getElementById('capCanvas'), capLabel: document.getElementById('capLabel'),
    skinBtn: document.getElementById('skinBtn'), skinCanvas: document.getElementById('skinCanvas'), skinLabel: document.getElementById('skinLabel'),
    grip: document.getElementById('grip'),
    keySlide: document.getElementById('keySlide'), keySlideCanvas: document.getElementById('keySlideCanvas'),
    keyPush: document.getElementById('keyPush'), keyPushCanvas: document.getElementById('keyPushCanvas'),
  };
  const dpr = () => window.devicePixelRatio || 1;
  const setGhost = (node, text) => { if (node.textContent !== text) node.textContent = text; };

  // 작은 버튼의 한 칸 크기(화면 점 1.5개)
  const cornerCell = () => Math.max(1, Math.round(1.5 * dpr()));
  function sizeCorner(cv, cw, ch) {
    const r = dpr();
    if (cv.width !== cw || cv.height !== ch) { cv.width = cw; cv.height = ch; }
    cv.style.width = `${cw / r}px`; cv.style.height = `${ch / r}px`;
  }
  // 한 칸짜리 작은 버튼(소리 · 키캡 · 몸통 색) 바탕: 흰 바탕 + 검은 테두리(몸통 색과 상관없이).
  // paint(ctx, 상자 왼쪽 위 x, y, 한 칸 크기)가 가운데 7×9칸 상자 안을 채운다
  function drawOneBox(cv, paint) {
    const ctx = cv.getContext('2d'), cc = cornerCell();
    const cw = ONE_COLS * cc, ch = BTN_ROWS * cc;
    sizeCorner(cv, cw, ch);
    ctx.clearRect(0, 0, cw, ch);
    pixelBlock(ctx, cw, ch, cc, INK);
    pixelFrame(ctx, cw, ch, cc, BG);
    paint(ctx, 3 * cc, Math.floor((BTN_ROWS - BOX_H) / 2) * cc, cc);
  }
  // 소리 버튼: 지금 소리 번호(1~6), 끔이면 ×
  function drawSoundBtn() {
    const i = KeySound.index;
    drawOneBox(el.soundCanvas, (ctx, bx, by, cc) => drawText(ctx, [i ? String(i) : '×'], bx + cc, by + cc, cc, BG));
    setGhost(el.soundLabel, i ? `소리 ${i}` : '소리 끔');
  }
  // 키캡 버튼: 지금 키캡 그림의 작은 본보기
  function drawCapBtn() {
    drawOneBox(el.capCanvas, (ctx, bx, by, cc) => stamp(ctx, CAP_ICONS[cap], bx + cc, by + cc, cc, BG));
    setGhost(el.capLabel, `키캡 ${KeyArt.names[cap]}`);
  }
  // 몸통 색 버튼: 상자 하나를 지금 몸통 색으로 칠하고 검은 테두리 한 칸
  function drawSkinBtn() {
    drawOneBox(el.skinCanvas, (ctx, bx, by, cc) => {
      ctx.fillStyle = BG; ctx.fillRect(bx, by, BOX_W * cc, BOX_H * cc);
      ctx.fillStyle = SKINS[skin].body; ctx.fillRect(bx + cc, by + cc, (BOX_W - 2) * cc, (BOX_H - 2) * cc);
    });
    setGhost(el.skinLabel, `몸통 ${SKINS[skin].name}`);
  }

  /* ---------- 기기의 키캡 두 개: 왼쪽 = 다음 판 / 새 판(RE), 오른쪽 = 쏘기(권총 그림) ----------
     비유: 진짜 키보드 키. 누르는 순간 한 번 작동하고, 손을 떼기 전까지는 같은 키든 다른 키든 다시 세지 않는다.
     keyHold = 지금 그 키를 누르고 있는 것(손가락 번호 · 'kb:Space' 같은 키보드 · 'test'), 안 누르면 null
     push = 오른쪽 쏘기 키, slide = 왼쪽 RE 키(예전 이름 그대로 둠) */
  const keyHold = { push: null, slide: null };
  const keyEl = () => ({ push: el.keyPush, slide: el.keySlide });
  const anyKeyDown = () => keyHold.push !== null || keyHold.slide !== null;
  let keyCell = 1;        // 키캡 그림 한 칸이 기기 화면 점 몇 개인지
  let pushFlash = false;  // 검사용 press()로 잠깐 눌린 그림을 보여 주는 중
  let pushFlashTimer = 0;

  function holdKey(name, who, t) {
    if (anyKeyDown()) return false; // 한 키가 눌려 있는 동안 다른 키는 무시(소리도 안 남)
    keyHold[name] = who;
    pushFlash = false;
    // 키가 눌린 순간 딸깍(검사용 손잡이로 누를 때는 조용히)
    if (who !== 'test') { KeySound.unlock(); KeySound.down(); }
    if (name === 'slide') restart(t); else fire(t);
    drawKeys();
    return true;
  }
  // who를 주면 그 손가락(또는 키보드 키)이 누른 경우에만 뗀다. quiet = 떼는 소리 없이(놓친 누름을 정리할 때 · 창이 가려질 때)
  function releaseKey(name, who, quiet) {
    if (keyHold[name] === null) return false;
    if (who !== undefined && keyHold[name] !== who) return false;
    const silent = quiet || keyHold[name] === 'test';
    keyHold[name] = null;
    if (!silent) KeySound.up();
    drawKeys();
    return true;
  }
  function releaseAllKeys() { releaseKey('push', undefined, true); releaseKey('slide', undefined, true); }
  function flashPushKey() {
    if (anyKeyDown()) return;
    pushFlash = true; drawKeys();
    clearTimeout(pushFlashTimer);
    pushFlashTimer = setTimeout(() => { pushFlash = false; drawKeys(); }, 90);
  }

  // 도트 키캡 하나 그리기(20×20칸, 두 색). 바깥 네모 = 스위치 집, 안쪽 작은 네모 = 키 윗면, 그 아래 무늬 띠 = 키 옆면.
  // 누르면 윗면이 3칸 내려가고 옆면이 그만큼 짧아진다(바닥 쪽 끝은 그대로). legend = 윗면 가운데에 찍을 그림
  function drawKey(cv, down, legend) {
    const ctx = cv.getContext('2d'), c = keyCell, n = KEY_CELLS * c;
    const R = (x, y, w, h, color) => { ctx.fillStyle = color; ctx.fillRect(x * c, y * c, w * c, h * c); };
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, n, n);
    pixelBlock(ctx, n, n, c, INK);
    pixelFrame(ctx, n, n, c, BG);
    const drop = down ? KEY_PRESS_DROP : 0;
    const capX = 3, capW = 14, topY = 2 + drop, topH = 10;
    const sideY = topY + topH, sideH = 4 - drop; // 옆면 띠(맨 아랫줄은 늘 15번째 줄)
    for (let y = sideY; y < sideY + sideH; y += 1) {
      R(capX, y, 1, 1, BG); R(capX + capW - 1, y, 1, 1, BG);
      for (let x = capX + 1; x < capX + capW - 1; x += 1) if ((x + y) % 2 === 0) R(x, y, 1, 1, BG);
    }
    R(capX + 1, sideY + sideH - 1, capW - 2, 1, BG);
    // 윗면: 흰 판 + 모서리 깎은 검은 테두리
    ctx.setTransform(1, 0, 0, 1, capX * c, topY * c);
    pixelBlock(ctx, capW * c, topH * c, c, INK);
    pixelFrame(ctx, capW * c, topH * c, c, BG);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    // 윗면 가운데 그림(테두리 안쪽 12×8칸 안, 남는 칸은 반으로 나눠 왼쪽 · 위에 적게)
    if (legend) {
      const lw = legend[0].length, lh = legend.length;
      const lx = capX + 1 + Math.floor((capW - 2 - lw) / 2), ly = topY + 1 + Math.floor((topH - 2 - lh) / 2);
      legend.forEach((row, j) => { for (let i = 0; i < row.length; i += 1) if (row[i] === '#') R(lx + i, ly + j, 1, 1, BG); });
    }
  }
  // 키 하나: 키캡 그림이 0(도트)이면 위 도트 그림, 1~3이면 공용 키캡 그림 + 매끈한 아이콘
  function paintKey(cv, down, legend, kind) {
    if (cap === 0) { drawKey(cv, down, legend); return; }
    const ctx = cv.getContext('2d');
    const o = KeyArt.draw(ctx, cv.width, cap, down);
    KeyArt.icon(ctx, kind, o.cx, o.cy, o.s);
  }
  function drawKeys() {
    paintKey(el.keyPushCanvas, keyHold.push !== null || pushFlash, KEY_GUN, 'gun');
    paintKey(el.keySlideCanvas, keyHold.slide !== null, KEY_RE, 'RE');
  }

  // 읽어 주는 기능용 글(화면 이름표)
  function syncText() {
    const aria = `서부 결투, 연승 ${streak}`;
    if (el.screen.getAttribute('aria-label') !== aria) el.screen.setAttribute('aria-label', aria);
  }

  /* ---------- 그리기: 128×96칸 작은 판에 찍은 뒤 그대로 키운다 ---------- */
  const g = el.screen.getContext('2d');
  const board = document.createElement('canvas');
  const c = board.getContext('2d');
  let H = 0;         // 지금 검은 화면 세로 칸 수
  let skyShift = 0;  // 기준 그림을 아래로 내리는 칸 수(늘어난 하늘 몫)

  let ink = null; // 지금 붓 색(같은 색이면 다시 고르지 않아 빠르게)
  function dot(x, y, color) {
    if (x < 0 || x >= W || y < 0 || y >= H) return;
    if (color !== ink) { c.fillStyle = color; ink = color; }
    c.fillRect(x, y, 1, 1);
  }
  function box(x, y, w, h, color) {
    c.fillStyle = color; ink = color;
    c.fillRect(x, y, w, h);
  }
  function sprite(x, y, rows, color = INK, k = 1) {
    rows.forEach((row, j) => {
      for (let i = 0; i < row.length; i += 1) {
        if (row[i] !== '#') continue;
        for (let dy = 0; dy < k; dy += 1) for (let dx = 0; dx < k; dx += 1) dot(x + i * k + dx, y + j * k + dy, color);
      }
    });
  }

  // 세로 칸 수가 바뀌면 그림 전체를 내릴 칸 수를 다시 정한다
  function setRows(rows) {
    if (rows === H) return;
    H = rows;
    board.width = W; board.height = H; ink = null;
    skyShift = Math.round((H - BASE_H) * SKY_SHARE);
  }

  // 점 글씨 한 줄을 판에 찍고, 뒤를 검게 비워 능선 등이 지나가도 읽히게 한다. 차지한 높이(칸)를 돌려준다
  function boardText(keys, x, y, k, font = GLYPHS) {
    const m = measure(keys, font);
    box(x - 1, y - 1, m.w * k + 2, m.h * k + 2, BG);
    let cx = x;
    keys.forEach((key) => {
      sprite(cx, y, font[key], INK, k);
      cx += (font[key][0].length + 1) * k;
    });
    return m.h * k;
  }

  // 총잡이 한 명: anchor = 몸 한가운데 열, right = 오른쪽을 보는지(나), gy = 땅 줄.
  // 둘레를 한 칸 검게 비워 능선 위에 겹쳐도 몸이 또렷하게 보이게 한다. 상대(right = false)는 검은 모자
  function drawPerson(anchor, right, pose, gy) {
    const { rows, ax } = (right ? POSES : OPP_POSES)[pose];
    const hat = right ? HAT : OPP_HAT;
    const top = gy - rows.length;
    const sx = (i) => (right ? anchor - ax + i : anchor + ax - i);
    const cells = [];
    rows.forEach((row, j) => { for (let i = 0; i < row.length; i += 1) if (row[i] === '#') cells.push([sx(i), top + j]); });
    if (pose === 'shoot') FLASH.forEach(([i, j]) => cells.push([sx(i), top + j]));
    cells.forEach(([x, y]) => { for (let dy = -1; dy <= 1; dy += 1) for (let dx = -1; dx <= 1; dx += 1) dot(x + dx, y + dy, BG); });
    cells.forEach(([x, y]) => dot(x, y, INK));
    // 넘어가는 중 = 모자가 공중에, 누움 = 모자가 등 뒤 땅에
    if (pose === 'fall' || pose === 'down') {
      const hx = right ? anchor - 9 : anchor + 9 - (hat[0].length - 1);
      sprite(hx, pose === 'fall' ? gy - 12 : gy - hat.length, hat);
    }
  }

  /* ---------- 기다리는 동안: 굴러가는 마른 풀 덩어리 하나만 ----------
     비유: 서부 영화에서 결투 전 정적을 채우는 장면. 결투가 시작된 뒤 흐른 시간만 보고 그리므로
     (무작위는 판마다 방향 하나뿐) 검사용 손 시계로 돌려도 같은 그림이 나온다.
     노려보는 동안 · 신호가 뜬 동안만 보이고, 결과가 나면 사라진다.
     (하늘을 스치던 바람 줄은 11/11 17:21에 뺐다 — 형님 「옆에 지나가는 게 시선을 너무 뺏기거든」) */
  function windNow() {
    if (phase !== 'wait' && phase !== 'signal') return null;
    const t = now() - startT - TUMBLE_LEAD_MS;
    if (t < 0) return null;
    const n = Math.floor(t / TUMBLE_EVERY_MS), within = t - n * TUMBLE_EVERY_MS;
    if (within >= TUMBLE_ROLL_MS) return null; // 다음 덩어리까지 잠깐 조용
    const dir = n % 2 === 0 ? windDir : -windDir; // 덩어리마다 방향을 번갈아
    const span = W + 4 * TUMBLE_R + 4;            // 화면 밖에서 나와 화면 밖으로 사라질 때까지
    const dist = (within / TUMBLE_ROLL_MS) * span;
    const x = Math.round(dir > 0 ? -2 * TUMBLE_R - 2 + dist : W + 2 * TUMBLE_R + 1 - dist);
    const hop = (within % TUMBLE_HOP_MS) / TUMBLE_HOP_MS;
    const lift = Math.round(TUMBLE_HOP * Math.sin(Math.PI * hop)); // 통통: 땅에 닿았다 튀어 오름
    return { x, lift, angle: (dir * dist) / TUMBLE_R, dir };
  }
  // 덩어리: 둘레를 검게 비운 뒤 둥근 테두리 + 굴러간 만큼 도는 잔가지 세 갈래 + 삐져나온 잔가지 둘
  function drawTumble(w, gy) {
    const cx = w.x, cy = gy - 1 - TUMBLE_R - w.lift;
    for (let y = -TUMBLE_R - 1; y <= TUMBLE_R + 1; y += 1) {
      for (let x = -TUMBLE_R - 1; x <= TUMBLE_R + 1; x += 1) if (Math.hypot(x, y) <= TUMBLE_R + 1.2) dot(cx + x, cy + y, BG);
    }
    TUMBLE_RING.forEach(([x, y]) => dot(cx + x, cy + y, INK));
    for (let s = 0; s < 3; s += 1) {
      const a = w.angle + (s * 2 * Math.PI) / 3;
      for (let rr = 1; rr < TUMBLE_R; rr += 1) dot(cx + Math.round(Math.cos(a) * rr), cy + Math.round(Math.sin(a) * rr), INK);
    }
    [0.5, 0.5 + Math.PI].forEach((off) => {
      const a = w.angle + off;
      dot(cx + Math.round(Math.cos(a) * (TUMBLE_R + 1)), cy + Math.round(Math.sin(a) * (TUMBLE_R + 1)), INK);
    });
  }
  // 「나」 표시가 떠 있는지: 결투가 시작되고 1.5초 동안
  const meMarkNow = () => (phase === 'wait' || phase === 'signal') && now() - startT < ME_MARK_MS;

  function render() {
    const oy = skyShift, gy = GROUND_Y + oy;
    box(0, 0, W, H, BG);

    // 해
    sprite(SUN_X, SUN_Y + oy, SUN);
    // 먼 바위산 능선: 칸 사이가 끊기지 않게 세로로 이어 준다
    for (let x = 0; x < W; x += 1) {
      const y = RIDGE_TOP[x], prev = x > 0 ? RIDGE_TOP[x - 1] : y;
      for (let yy = Math.min(y, prev + 1); yy <= Math.max(y, prev - 1); yy += 1) dot(x, yy + oy, INK);
    }
    // 선인장
    CACTI.forEach(([x, rows]) => sprite(x, gy - rows.length, rows));
    // 땅 속 자갈 점
    const tw = GROUND_TEX[0].length, th = GROUND_TEX.length;
    for (let y = gy + 2; y < H; y += 1) {
      for (let x = 0; x < W; x += 1) if (GROUND_TEX[(y - gy) % th][x % tw] === '#') dot(x, y, INK);
    }
    // 굴러가는 풀(노려보는 동안): 사람보다 먼저 그려서, 덩어리가 사람 앞을 지나도 사람은 그대로 또렷하게(사람 둘레 비움이 덮는다)
    const w = windNow();
    if (w) drawTumble(w, gy);
    // 두 사람(나 = 왼쪽 끝, 상대 = 오른쪽 끝)
    const p = poses();
    drawPerson(ME_X, true, p.me, gy);
    drawPerson(OPP_X, false, p.opp, gy);
    // 평평한 땅 줄(사람 둘레 비움에 지워지지 않게 사람 다음에)
    box(0, gy, W, 1, INK);

    // 신호: 화면 한가운데 위쪽
    const mark = markNow();
    if (mark) {
      const rows = mark === '!' ? BANG : CROSS;
      sprite(Math.floor((W - rows[0].length) / 2), MARK_Y + oy, rows);
    }
    // 쏜 쪽의 반응 시간: 신호가 있던 한가운데 위쪽에 크게. 누가 쐈는지는 자세로 보인다
    const tt = timeTextNow();
    if (tt) {
      const keys = [...tt], m = measure(keys);
      boardText(keys, Math.floor((W - m.w * 2) / 2), MARK_Y + oy + 3, 2);
    }
    // 지거나 반칙한 결과: × (또는 상대 시간) 아래 가운데에 왕관 + 「최고 N연승」.
    // 두 배 크기가 화면 폭을 넘으면(네 자리부터) 한 배로. 방금 끝난 연승이 최고 기록이면 왕관이 깜빡인다
    const bl = bestLineNow();
    if (bl) {
      const keys = [bl.on ? '♛' : '♛off', ' ', '최', '고', ' '].concat([...String(bl.best)], ['연', '승']);
      const m = measure(keys), k = m.w * 2 <= W - 8 ? 2 : 1;
      boardText(keys, Math.floor((W - m.w * k) / 2), MARK_Y + oy + BEST_LINE_GAP, k);
    }

    // 왼쪽 위 = 지금 연승 「N연승」만: 숫자는 칸 두 배 크기, 「연승」은 한 배 크기로 숫자 바닥에 맞춰 붙인다.
    // 숫자가 길어 위 가운데 반응 시간 자리(38번째 칸부터)를 넘보게 되면 숫자도 한 배로
    const big = [...String(streak)], unit = ['연', '승'];
    const bw = measure(big).w, uw = measure(unit).w;
    const bigK = (3 + bw * 2 + 2 + uw <= 38) ? 2 : 1;
    const bigH = boardText(big, 3, 3, bigK);
    boardText(unit, 3 + bw * bigK + 2, 3 + bigH - 7, 1);

    // 「나」 표시: 결투가 시작되면 1.5초 동안 왼쪽 사람(나) 모자 위 한 칸 띄워서. 뒤만 검게 비운다(모자 쪽은 안 지움)
    if (meMarkNow()) {
      const mx = ME_X - Math.floor(ME_MARK[0].length / 2), my = gy - STAND.length - 1 - ME_MARK.length;
      box(mx - 1, my, ME_MARK[0].length + 2, ME_MARK.length, BG);
      sprite(mx, my, ME_MARK);
    }

    // 작은 판을 큰 그림판에 옮긴다
    g.imageSmoothingEnabled = false;
    g.drawImage(board, 0, 0, el.screen.width, el.screen.height);
  }

  /* ---------- 몸통 겉모양: 위 두 모서리는 둥글게, 아래 두 모서리는 비스듬히 깎기 ----------
     inset = 바깥선에서 안으로 들어온 거리(검은 몸통의 안쪽 흰 선을 그릴 때 씀) */
  function bodyPath(w, h, rad, bevel, inset) {
    const i = inset, R = Math.max(0, rad - i), B = Math.max(0, bevel - i * 0.41);
    const x0 = i, y0 = i, x1 = w - i, y1 = h - i;
    return `M ${x0} ${y0 + R} A ${R} ${R} 0 0 1 ${x0 + R} ${y0} L ${x1 - R} ${y0} A ${R} ${R} 0 0 1 ${x1} ${y0 + R} `
      + `L ${x1} ${y1 - B} L ${x1 - B} ${y1} L ${x0 + B} ${y1} L ${x0} ${y1 - B} Z`;
  }
  function drawBody(dw, dh, rad, bevel) {
    const sk = SKINS[skin];
    el.bodyArt.setAttribute('viewBox', `0 0 ${dw} ${dh}`);
    el.bodyArt.setAttribute('width', dw); el.bodyArt.setAttribute('height', dh);
    el.bodyFill.setAttribute('d', bodyPath(dw, dh, rad, bevel, 0));
    el.bodyFill.setAttribute('fill', sk.body);
    if (sk.line) {
      el.bodyLine.setAttribute('d', bodyPath(dw, dh, rad, bevel, 1)); // 굵기 2 선의 가운데를 1 안쪽에 → 바깥선 안쪽 0~2점
      el.bodyLine.setAttribute('stroke', INK); el.bodyLine.setAttribute('stroke-width', '2');
    } else {
      el.bodyLine.removeAttribute('d');
    }
  }

  // 오돌토돌한 띠: 본보기 기기 아래쪽 회색 띠. 모서리 둥근 직사각형을 띠 색으로 칠하고, 몸통 색 점을 흩뿌린다
  function drawGrip(gw, gh) {
    const cv = el.grip, r = dpr(), ctx = cv.getContext('2d'), sk = SKINS[skin];
    const w = Math.max(1, Math.round(gw * r)), h = Math.max(1, Math.round(gh * r));
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    cv.style.width = `${w / r}px`; cv.style.height = `${h / r}px`;
    ctx.clearRect(0, 0, w, h);
    const rr = Math.min(h / 2, Math.round(h * 0.3));
    ctx.beginPath();
    ctx.moveTo(rr, 0); ctx.lineTo(w - rr, 0); ctx.arcTo(w, 0, w, rr, rr); ctx.lineTo(w, h - rr); ctx.arcTo(w, h, w - rr, h, rr);
    ctx.lineTo(rr, h); ctx.arcTo(0, h, 0, h - rr, rr); ctx.lineTo(0, rr); ctx.arcTo(0, 0, rr, 0, rr); ctx.closePath();
    ctx.fillStyle = sk.grip; ctx.fill();
    // 점 무늬(여섯 게임 같은 규칙): 점 하나 = 화면 점 2개, 가로 6 · 세로 4 간격, 한 줄 걸러 반 칸 어긋나게
    ctx.save(); ctx.clip();
    const p = Math.max(1, Math.round(2 * r));
    ctx.fillStyle = sk.body;
    for (let row = 0, y = 2 * p; y + p <= h - 2 * p; row += 1, y += 2 * p) {
      for (let x = 2 * p + (row % 2 ? Math.round(1.5 * p) : 0); x + p <= w - 2 * p; x += 3 * p) ctx.fillRect(x, y, p, p);
    }
    ctx.restore();
  }

  /* ---------- 기기 자리 맞추기 ----------
     몸통 폭 dw = min(창 폭 − 28, 460). 위에서부터: 띠(작은 버튼 줄 + 위아래 10) → 검은 화면(128×96칸) → 7% → 키캡 둘(사이 7%) → 7% → 오돌토돌한 띠(7%) → 7%.
     합이 창 높이 − 28을 넘으면 화면 칸 크기부터, 그다음 키캡 크기를 줄인다(키캡은 72 아래로 안 줄임).
     몸통은 창 가운데(받침대 main이 창 전체이고 가운데 정렬) */
  // 창이 낮으면(가로로 눕힌 폰 등) 몸통 폭부터 줄인다 — 폭은 그대로 두고 화면만 줄이면 화면이 점 하나 크기가 된다.
  // 화면 칸 · 키캡을 제 크기로 놓았을 때(위 띠 + 화면 + 키캡 + 틈 넷) 창 높이 안에 들어가는 가장 큰 폭을 찾는다
  function fitWidth(maxW, roomH, band, rows, keyShare) {
    const r = dpr();
    for (let w = maxW; w > 160; w -= 4) {
      const cell = Math.max(1, Math.floor(w * 0.86 * r / 128));
      if (band + (rows * cell) / r + Math.max(72, w * keyShare) + 4 * Math.round(w * 0.07) <= roomH) return w;
    }
    return Math.min(maxW, 160);
  }
  function fit() {
    const r = dpr(), rows = ROWS, cc = cornerCell();
    drawGameBtn(); drawSoundBtn(); drawCapBtn(); drawSkinBtn();
    const btnH = (BTN_ROWS * cc) / r;
    const band = btnH + 2 * BAND_PAD;

    const mb = el.main.getBoundingClientRect();
    const limitH = mb.height - EDGE;
    const dw = fitWidth(Math.max(120, Math.floor(Math.min(mb.width - EDGE, DEVICE_MAX))), limitH, band, rows, KEY_SHARE_TWO);
    const gap = Math.round(dw * GAP_SHARE);
    const gh = gap; // 띠 높이 = 몸통 폭의 7%

    // 키캡 크기: 20칸 × 정수 점이 되는 크기 중 목표(몸통 폭의 34%)에 가장 가까운 것, 72 ~ 190 사이
    const want = dw * KEY_SHARE_TWO;
    let kc = 0, nearest = Infinity;
    for (let n = 1; KEY_CELLS * n / r <= KEY_MAX + 0.01; n += 1) {
      const size = KEY_CELLS * n / r;
      if (size >= KEY_MIN - 0.01 && Math.abs(size - want) < nearest) { kc = n; nearest = Math.abs(size - want); }
    }
    if (!kc) kc = Math.max(1, Math.ceil(KEY_MIN * r / KEY_CELLS));
    const kcMin = Math.ceil((KEY_MIN - 0.01) * r / KEY_CELLS);

    // 검은 화면: 128 × 96칸, 한 칸 = 정수 기기 화면 점
    let cellPx = Math.max(1, Math.floor(dw * SCREEN_SHARE * r / W));
    const total = (cp, k) => band + (rows * cp) / r + gap + (KEY_CELLS * k) / r + gap + gh + gap;
    while (cellPx > 1 && total(cellPx, kc) > limitH) cellPx -= 1;
    while (kc > kcMin && total(cellPx, kc) > limitH) kc -= 1;
    // 몸통을 세로로 길게: 폭의 1.5배까지(창 높이 안에서), 남는 높이를 세 틈(화면~키캡 · 키캡~띠 · 띠~몸통 끝)에 똑같이 나눠 넣는다
    const lift = Math.max(0, Math.floor((Math.min(limitH, Math.round(dw * BODY_TALL)) - total(cellPx, kc)) / 3));
    keyCell = kc;
    const ks = KEY_CELLS * kc / r;
    const sw = (W * cellPx) / r, sh = (rows * cellPx) / r;

    const keyTop = Math.round(band + sh + gap + lift);
    const gripTop = Math.round(keyTop + ks + gap + lift);
    const dh = Math.round(gripTop + gh + gap + lift);

    // 몸통
    const ds = el.deviceE.style, rad = Math.round(dw * CORNER_SHARE), bevel = Math.round(dw * CORNER_SHARE);
    ds.width = `${dw}px`; ds.height = `${dh}px`;
    drawBody(dw, dh, rad, bevel);

    // 위 띠: 왼쪽 끝 = 게임 버튼, 오른쪽 묶음(왼→오) = 소리 → 키캡 → 몸통 색(사이 6점).
    // 양 끝은 몸통 폭의 8%만큼 들여놓되, 몸통이 아주 좁아 두 묶음이 붙을 것 같으면 들여놓는 폭을 줄인다
    const oneW = (ONE_COLS * cc) / r, gameW = (gameCols() * cc) / r;
    const spare = dw - gameW - (3 * oneW + 2 * BAND_GAP) - BAND_GAP;
    let side = Math.round(dw * 0.08);
    if (2 * side > spare) side = Math.max(2, Math.floor(spare / 2));
    el.gameBtn.style.left = `${side}px`; el.gameBtn.style.top = `${BAND_PAD}px`;
    [el.skinBtn, el.capBtn, el.soundBtn].forEach((b, i) => {
      b.style.left = ''; b.style.right = `${side + i * (oneW + BAND_GAP)}px`; b.style.top = `${BAND_PAD}px`;
    });

    // 검은 화면: 가운데 정렬
    setRows(rows);
    if (el.screen.width !== W * cellPx || el.screen.height !== H * cellPx) { el.screen.width = W * cellPx; el.screen.height = H * cellPx; }
    el.screen.style.width = `${sw}px`; el.screen.style.height = `${sh}px`;
    el.screen.style.left = `${Math.round((dw - sw) / 2)}px`;
    el.screen.style.top = `${Math.round(band)}px`;

    // 키캡 두 개: 둘을 묶어 가운데(왼쪽 = RE, 오른쪽 = 쏘기), 사이 = 몸통 폭의 7%
    const keyGap = gap, rowLeft = Math.round((dw - (2 * ks + keyGap)) / 2);
    [[el.keySlide, el.keySlideCanvas, rowLeft], [el.keyPush, el.keyPushCanvas, Math.round(rowLeft + ks + keyGap)]].forEach(([b, cv, x]) => {
      const n = KEY_CELLS * kc;
      if (cv.width !== n || cv.height !== n) { cv.width = n; cv.height = n; }
      cv.style.width = `${ks}px`; cv.style.height = `${ks}px`;
      b.style.left = `${x}px`; b.style.top = `${keyTop}px`;
      b.style.width = `${ks}px`; b.style.height = `${ks}px`;
    });

    // 오돌토돌한 띠: 가운데
    const gw = Math.round(dw * GRIP_SHARE);
    drawGrip(gw, gh);
    el.grip.style.left = `${Math.round((dw - gw) / 2)}px`; el.grip.style.top = `${gripTop}px`;

    drawKeys();
    syncText();
    render();
  }

  /* ---------- 게임 버튼: 위 띠 왼쪽 끝, 누른 숫자 칸의 게임으로 바로 간다 ----------
     비유: TV 리모컨 숫자 버튼. 1 시지프스 · 2 10.00000 · 3 결투 · 4 100m · 5 퍼덕 · 6 멀리뛰기 중 누른 번호로 곧장.
     여섯 게임은 같은 전시장의 옆 폴더라서 「한 칸 위 폴더 → 옆 폴더」 주소로 옮겨 간다.
     이 컴퓨터의 폴더 이름(local)과 인터넷 전시장의 폴더 이름(web)이 달라서 둘 다 적어 두고,
     지금 열린 폴더 이름이 어느 쪽인지 보고 같은 쪽 이름으로 간다.
     키보드 바로 가기는 두지 않는다(100m의 F · J 사이 G처럼, 달리다 스치면 판이 날아가서) */
  function gameHere() { return '3'; }
  function gameList() {
    return [
      { id: '1', name: '시지프스', local: 'streak-sisyphus', web: 'hold-on-sisyphus' },
      { id: '2', name: '10.00000', local: 'key-ten', web: 'hold-on-key-ten' },
      { id: '3', name: '결투', local: 'key-duel', web: 'hold-on-key-duel' },
      { id: '4', name: '100m', local: 'key-100m', web: 'hold-on-key-100m' },
      { id: '5', name: '퍼덕', local: 'key-flap', web: 'hold-on-key-flap' },
      { id: '6', name: '멀리뛰기', local: 'key-leap', web: 'hold-on-key-leap' },
    ];
  }
  // 게임 버튼 폭(칸): 여백 3 + 숫자 상자 여섯(사이 한 칸) + 여백 3
  function gameCols() { return 3 + gameList().length * (GAME_BOX_W + 1) - 1 + 3; }
  function gameUrl(id) {
    const list = gameList(), target = list.find((g) => g.id === String(id));
    if (!target) return null;
    // 지금 폴더 이름: …/hold-on-key-ten/ → hold-on-key-ten, …/key-ten/index.html → key-ten
    const parts = location.pathname.split('/').filter(Boolean);
    if (parts.length && /\.html?$/i.test(parts[parts.length - 1])) parts.pop();
    const here = decodeURIComponent(parts[parts.length - 1] || '');
    const onWeb = list.some((g) => g.web === here);
    return onWeb ? `../${target.web}/` : `../${target.local}/index.html`;
  }
  // 넘어간 게임마다 뒤로 가기 기록이 쌓이지 않게 지금 칸을 바꿔 끼운다. 지금 게임 번호면 아무 일 없음
  function goGame(id) {
    if (String(id) === gameHere()) return false;
    const url = gameUrl(id);
    if (!url) return false;
    location.replace(url);
    return true;
  }
  // 그림: 테두리 안에 1~6, 지금 게임 숫자만 검게 칠한 칸에 흰 글씨
  function drawGameBtn() {
    const cv = el.gameCanvas, ctx = cv.getContext('2d'), cc = cornerCell(), list = gameList();
    const cw = gameCols() * cc, ch = BTN_ROWS * cc;
    sizeCorner(cv, cw, ch);
    ctx.clearRect(0, 0, cw, ch);
    pixelBlock(ctx, cw, ch, cc, INK); // 몸통 색과 상관없이 흰 바탕
    pixelFrame(ctx, cw, ch, cc, BG);
    list.forEach((g, i) => {
      const bx = (3 + i * (GAME_BOX_W + 1)) * cc, by = Math.floor((BTN_ROWS - GAME_BOX_H) / 2) * cc;
      if (g.id === gameHere()) {
        ctx.fillStyle = BG; ctx.fillRect(bx, by, GAME_BOX_W * cc, GAME_BOX_H * cc);
        drawText(ctx, [g.id], bx + cc, by + cc, cc, INK);
      } else {
        drawText(ctx, [g.id], bx + cc, by + cc, cc, BG);
      }
    });
    setGhost(el.gameLabel, `게임 ${gameHere()} ${list.find((g) => g.id === gameHere()).name}`);
  }
  // 버튼 안 가로 위치(화면 점, 버튼 왼쪽 끝 = 0) → 몇 번째 숫자 칸인지.
  // 칸 경계 = 글자 상자 경계, 상자 사이 한 칸 틈은 그 가운데를 기준으로 가까운 칸, 양 끝 여백은 맨 끝 칸
  function gameIndexAt(xCss) {
    const n = gameList().length, cellsX = (xCss * dpr()) / cornerCell();
    const i = Math.floor((cellsX - 3 + 0.5) / (GAME_BOX_W + 1));
    return Math.max(0, Math.min(n - 1, i));
  }
  if (window.ResizeObserver) new ResizeObserver(fit).observe(el.main);
  window.addEventListener('resize', fit);

  /* ---------- 입력: 손가락이 닿는 순간 작동한다 ---------- */
  // 검사용 「한 번 눌렀다 뗀 것」: 오른쪽 키캡이 잠깐 눌린 그림이 된다(소리 없음)
  function pressAt(t) {
    fire(t);
    flashPushKey();
  }
  const mainPointer = (e) => e.pointerType !== 'mouse' || e.button === 0;
  // 위 띠의 작은 버튼들: 게임 누름으로 세지 않는다(아래로 퍼지지 않게 막음), 키캡 소리도 없다
  // 게임 버튼: 누르는 순간 그 번호 게임으로
  el.gameBtn.addEventListener('pointerdown', (e) => {
    if (!mainPointer(e)) return;
    e.preventDefault(); e.stopPropagation();
    const b = e.currentTarget.getBoundingClientRect();
    goGame(gameList()[gameIndexAt(e.clientX - b.left)].id);
  });
  [[el.soundBtn, nextSound], [el.capBtn, nextCap], [el.skinBtn, nextSkin]].forEach(([btn, act]) => {
    btn.addEventListener('pointerdown', (e) => {
      if (!mainPointer(e)) return;
      e.preventDefault(); e.stopPropagation();
      act();
    });
  });
  // 키캡: 누르는 순간 작동(오른쪽 = 쏘기, 왼쪽 = 다음 판). 그 손가락이 떼어지거나, 키 밖으로 미끄러지거나, 화면 밖으로 나가면 뗀 것
  ['push', 'slide'].forEach((name) => {
    keyEl()[name].addEventListener('pointerdown', (e) => {
      if (!mainPointer(e)) return;
      e.preventDefault(); e.stopPropagation();
      // 손가락을 키에 묶어 두지 않아야 키 밖으로 미끄러진 것을 알아챈다
      const t = e.currentTarget;
      try { if (t.hasPointerCapture && t.hasPointerCapture(e.pointerId)) t.releasePointerCapture(e.pointerId); } catch (err) { /* 그대로 */ }
      // 새로 닿은 첫 손가락인데 키가 눌린 채 남아 있으면, 떼는 신호를 놓친 낡은 누름이다 → 조용히 풀고 받는다(키가 먹통이 되지 않게)
      if (e.isPrimary) ['push', 'slide'].forEach((k) => { if (keyHold[k] !== null && keyHold[k] !== e.pointerId) releaseKey(k, undefined, true); });
      holdKey(name, e.pointerId, eventTime(e));
    });
  });
  const insideRect = (node, x, y) => {
    const b = node.getBoundingClientRect();
    return x >= b.left && x <= b.right && y >= b.top && y <= b.bottom;
  };
  window.addEventListener('pointermove', (e) => {
    const nodes = keyEl();
    ['push', 'slide'].forEach((name) => {
      if (keyHold[name] === e.pointerId && !insideRect(nodes[name], e.clientX, e.clientY)) releaseKey(name, e.pointerId);
    });
  });
  ['pointerup', 'pointercancel'].forEach((type) => window.addEventListener(type, (e) => {
    releaseKey('push', e.pointerId); releaseKey('slide', e.pointerId);
  }));
  // 마우스가 창 밖으로 나감(옮겨 간 곳이 없음)
  window.addEventListener('pointerout', (e) => {
    if (e.relatedTarget) return;
    releaseKey('push', e.pointerId); releaseKey('slide', e.pointerId);
  });
  window.addEventListener('blur', releaseAllKeys);
  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter') releaseKey('push', `kb:${e.code}`);
    if (e.code === 'KeyR') releaseKey('slide', 'kb:KeyR');
  });

  window.addEventListener('keydown', (e) => {
    const plain = !e.metaKey && !e.ctrlKey && !e.altKey;
    // S = 소리 · K = 키캡 그림 · C = 몸통 색(작은 버튼을 누른 것과 같음)
    const small = { KeyS: nextSound, KeyK: nextCap, KeyC: nextSkin }[e.code];
    if (small && plain) {
      e.preventDefault();
      if (!e.repeat) small();
      return;
    }
    // R = 다음 판 / 새 판(왼쪽 키를 누른 것과 같음, 떼면 keyup에서 올라옴)
    if (e.code === 'KeyR' && plain) {
      e.preventDefault();
      if (e.repeat) return;
      if (keyHold.slide === 'kb:KeyR') releaseKey('slide', undefined, true);
      holdKey('slide', 'kb:KeyR', eventTime(e));
      return;
    }
    if (e.code !== 'Space' && e.code !== 'Enter' && e.code !== 'NumpadEnter') return;
    if (!plain) return; // Cmd · Ctrl · Alt와 같이 누른 것은 게임 누름이 아니다(떼는 신호가 안 와서 키가 눌린 채 남는 것도 막음)
    e.preventDefault();
    if (e.repeat) return; // 꾹 누르고 있어 저절로 반복되는 입력은 무시
    // 같은 키가 눌린 채 남아 있는데 새로 눌렸다면 떼는 신호를 놓친 것이다 → 조용히 풀고 받는다(키보드가 먹통이 되지 않게)
    if (keyHold.push === `kb:${e.code}`) releaseKey('push', undefined, true);
    holdKey('push', `kb:${e.code}`, eventTime(e)); // 오른쪽 키를 누른 것과 같음(떼면 keyup에서 올라옴)
  });
  // 연타할 때 화면이 확대되거나 끌리거나, 길게 눌러 메뉴가 뜨지 않게 막는다
  const block = (e) => e.preventDefault();
  ['touchstart', 'touchmove', 'touchend'].forEach((name) => document.addEventListener(name, block, { passive: false }));
  ['gesturestart', 'dblclick', 'contextmenu', 'selectstart', 'dragstart'].forEach((name) => document.addEventListener(name, block));

  fit();
  // 들어오자마자 첫 결투 시작(신호는 3초 안에). 뒤쪽 탭으로 열렸으면 화면이 보이는 순간 시작(visibilitychange)
  if (!document.hidden) { startDuel(now()); autoDuel = true; }

  /* ---------- 검사용 손잡이: 게임에는 영향이 없다(소리도 내지 않는다) ---------- */
  const toInt = (n) => {
    const value = Math.floor(Number(n));
    return Number.isFinite(value) ? Math.max(0, Math.min(Number.MAX_SAFE_INTEGER, value)) : 0;
  };
  const rectOf = (node) => {
    const b = node.getBoundingClientRect();
    return { x: b.left, y: b.top, w: b.width, h: b.height };
  };
  window.__STREAK_TEST__ = {
    state() {
      return {
        phase, streak, best, bestMs,
        oppMs: phase === 'ready' ? oppFor(streak) : duelOpp,
        waitMs: phase === 'ready' ? null : waitMs,
        myMs, outcome, pose: poses(), mark: markNow(), timeText: timeTextNow(),
        label: LABEL,
        layout: 'F', rows: H,
        sound: KeySound.index,
        cap, capName: KeyArt.names[cap],
        skin, skinName: SKINS[skin].name, skins: SKINS.map((s) => s.name),
        keyDown: anyKeyDown(),
        keyRects: { push: rectOf(el.keyPush), slide: rectOf(el.keySlide) },
        rects: {
          device: rectOf(el.deviceE), screen: rectOf(el.screen), push: rectOf(el.keyPush), slide: rectOf(el.keySlide), grip: rectOf(el.grip),
          gameBtn: rectOf(el.gameBtn), soundBtn: rectOf(el.soundBtn), capBtn: rectOf(el.capBtn), skinBtn: rectOf(el.skinBtn),
        },
        game: gameHere(),
        meMark: meMarkNow(),                 // 「나」 표시가 떠 있는지
        tumble: (() => { const w = windNow(); return w ? { x: w.x, lift: w.lift, dir: w.dir } : null; })(), // 굴러가는 풀(없으면 null)
        bestLine: bestLineNow(),             // 진 · 반칙 결과의 「최고 N연승」 줄 { best, record, on }(없으면 null)
      };
    },
    press() { pressAt(now()); return this.state(); },
    keyPress() { return holdKey('push', 'test', now()); }, // 이미 눌려 있으면 false(쏘지 않음)
    keyRelease() { return releaseKey('push'); },
    // 왼쪽 키(다음 판 / 새 판): 누르고 떼기까지. 다른 키가 눌려 있으면 false
    restartKey() { const ok = holdKey('slide', 'test', now()); releaseKey('slide'); return ok; },
    setSkin(n) { return setSkin(n); },
    nextSkin() { nextSkin(); return skin; },
    setCap(n) { return setCap(n); },
    // 소리 고르기(0 = 끔, 1~6). 들려주지는 않는다
    setSound(i) { const v = KeySound.set(i); drawSoundBtn(); return v; },
    gameUrl(id) { return gameUrl(id); },               // 그 번호 게임으로 갈 주소(가지는 않음)
    gameIndexAt(x) { return gameIndexAt(Number(x)); }, // 게임 버튼 안 가로 위치(화면 점) → 칸 번호(0부터)
    // 앞으로의 대결에서 신호까지 시간을 고정(null이면 다시 무작위)
    setWait(ms) {
      fixedWait = ms === null || ms === undefined ? null : toInt(ms);
      return this.state();
    },
    // 연승을 n으로(상대 속도도 그에 맞게). 최고 연승보다 크면 최고 연승도 올린다
    setStreak(n) {
      streak = toInt(n);
      if (streak > best) best = streak;
      if (phase !== 'result') duelOpp = oppFor(streak);
      saveRecords(); syncText(); render();
      return this.state();
    },
    reset() {
      streak = 0; best = 0; bestMs = null; endedStreak = 0;
      phase = 'ready'; waitMs = null; myMs = null; outcome = null; shotMs = null; autoLoseFrom = null;
      duelOpp = oppFor(0);
      Object.values(KEYS).forEach(clearKey);
      syncText(); render();
      return this.state();
    },
    // 손으로 돌리는 시계: 처음 부르면 지금 시계 값에서 이어 받아 멈춰 두고, 부를 때마다 ms만큼 돌린다.
    // 그 사이 신호 · 상대가 쏘기는 정해진 시각 그대로 차례로 처리된다
    tick(ms) {
      if (manual === null) {
        manual = now();
        if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      }
      manual += Math.max(0, Number(ms) || 0);
      advanceTo(manual);
      render();
      return this.state();
    },
    // 실제 시계로 되돌리기: 시간이 끊기지 않게 지금 값에서 이어 흐른다
    realClock() {
      if (manual !== null) {
        offset = manual - performance.now();
        manual = null;
      }
      render(); startLoop();
      return this.state();
    },
  };
})();
</script>
</body>
</html>
