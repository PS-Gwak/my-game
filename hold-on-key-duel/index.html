<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>결투</title>
<style>
  /* 배치 A~D의 화면은 두 덩어리다: 그림판(흰 기기 몸통 안의 검은 화면) · 큰 「쏴」 버튼.
     둘의 크기 비율은 배치마다 다르고, 칸 나누기는 스크립트가 배치에 맞춰 정한다.
     배치 E는 기기 하나(몸통 안에 화면 + 키캡 두 개)만 보인다.
     색은 검정과 흰색 두 가지만 쓴다. 글씨와 테두리는 전부 캔버스(그림 종이)에 칸으로 찍는다 */
  :root { --black: #000000; --white: #f2f2f2; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--black); color: var(--white);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    display: flex; align-items: center; justify-content: center;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  main {
    width: min(100vw, 430px);
    height: min(100vh, 820px); height: min(100dvh, 820px);
    padding: 10px 12px max(12px, env(safe-area-inset-bottom));
    display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 160px; gap: 12px;
  }
  /* 그림판 자리: 흰 기기 몸통이 검은 화면을 얇게 감싼다(위쪽 띠에는 작은 배치 버튼 하나) */
  .stage { min-height: 0; min-width: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .device { position: relative; background: var(--white); border-radius: 8px; padding: 28px 4px 4px; line-height: 0; }
  .screen { display: block; image-rendering: pixelated; background: var(--black); border-radius: 2px; }
  .screen.tappable { cursor: pointer; }
  /* 몸통 위쪽 띠의 작은 점 글씨 버튼(배치 바꾸기) */
  .corner-btn {
    position: absolute; top: 3px; padding: 0; margin: 0; border: 0; background: transparent;
    line-height: 0; cursor: pointer; touch-action: none; outline: none;
  }
  .corner-btn canvas { display: block; image-rendering: pixelated; }
  .layout-btn { left: 4px; }

  /* 큰 버튼: 캔버스가 칸 모양 버튼과 점 글씨를 그린다. 크기는 배치가 정한 칸을 꽉 채운다 */
  .btn {
    position: relative; display: block; width: 100%; height: 100%; min-height: 0; min-width: 0; padding: 0; margin: 0; border: 0;
    background: transparent; cursor: pointer; touch-action: none; outline: none;
  }
  .btn canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  .btn:focus-visible { outline: 3px solid var(--white); outline-offset: 3px; }
  /* 화면에는 안 보이는 글자: 읽어 주는 기능 · 검사기가 버튼 글을 읽을 수 있게 남겨 둔다 */
  .ghost { position: absolute; left: 0; top: 0; width: 100%; height: 100%; color: transparent; overflow: hidden; white-space: nowrap; pointer-events: none; line-height: 1; }

  /* 가로로 눕힌 폰처럼 낮은 화면: 왼쪽에 그림판, 오른쪽에 버튼(칸 나누기는 스크립트가) */
  @media (orientation: landscape) and (max-height: 520px) {
    main { width: min(100vw, 860px); column-gap: 14px; }
  }

  /* 배치 E · F: 손바닥만 한 기기 하나. 몸통 안에 검은 화면, 그 아래 키캡 두 개, 맨 아래 오돌토돌한 띠.
     크기와 자리는 스크립트가 창 크기에 맞춰 정한다. 몸통 겉모양(둥근 위 · 깎인 아래 · 몸통 색)은 안쪽 그림(#bodyArt)이 그린다 */
  .device-e { position: relative; display: none; flex: none; line-height: 0; }
  .device-e .screen { position: absolute; }
  .body-art { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  .grip { position: absolute; display: block; image-rendering: pixelated; pointer-events: none; }
  /* 기기 모양일 때 받침대는 창 전체: 기기를 가로 · 세로 가운데에 올려 둔다(창 바깥 배경은 검정) */
  main.layout-e { width: 100vw; height: 100vh; height: 100dvh; padding: 0; }
  .key {
    position: absolute; padding: 0; margin: 0; border: 0; background: transparent;
    line-height: 0; cursor: pointer; touch-action: none; outline: none;
  }
  .key canvas { display: block; image-rendering: pixelated; }
  .layout-e .device { display: none; }
  .layout-e .device-e { display: block; }
  .layout-e .btn { display: none; }

  /* 배치 0: 가로로 긴 화면 · 가운데 점 글씨 숫자판 · 아래 큰 버튼. 숫자판은 배치 0에서만 보인다 */
  .panel { position: relative; display: none; min-height: 0; min-width: 0; }
  .panel canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  .layout-0 .panel { display: block; }
  /* 가로로 눕힌 화면의 배치 0: 왼쪽 전체에 그림판, 오른쪽 가운데에 숫자판과 버튼을 위아래로 */
  @media (orientation: landscape) and (max-height: 520px) {
    .layout-0 .stage { grid-column: 1; grid-row: 1 / -1; }
    .layout-0 .panel { grid-column: 2; grid-row: 2; }
    .layout-0 .btn { grid-column: 2; grid-row: 3; }
  }
</style>
</head>
<body>
<main id="main">
  <div class="stage" id="stage">
    <div class="device" id="device">
      <button class="corner-btn layout-btn" id="layoutBtn" type="button" tabindex="-1"><canvas id="layoutCanvas"></canvas><span class="ghost" id="layoutLabel">배치 E</span></button>
      <button class="corner-btn game-btn" id="gameBtn" type="button" tabindex="-1"><canvas id="gameCanvas"></canvas><span class="ghost" id="gameLabel">게임 3 결투</span></button>
      <canvas class="screen" id="screen" aria-label="서부 결투"></canvas>
    </div>
    <!-- 배치 E 기기 몸통: 검은 화면과 배치 버튼은 배치 E일 때 스크립트가 이 안으로 옮겨 온다 -->
    <div class="device-e" id="deviceE">
      <svg class="body-art" id="bodyArt" aria-hidden="true"><path id="bodyFill"></path><path id="bodyLine" fill="none"></path></svg>
      <button class="corner-btn skin-btn" id="skinBtn" type="button" tabindex="-1"><canvas id="skinCanvas"></canvas><span class="ghost" id="skinLabel">몸통 white</span></button>
      <button class="key" id="keySlide" type="button" tabindex="-1"><canvas id="keySlideCanvas"></canvas><span class="ghost">다시</span></button>
      <button class="key" id="keyPush" type="button" tabindex="-1"><canvas id="keyPushCanvas"></canvas><span class="ghost">쏴</span></button>
      <canvas class="grip" id="grip"></canvas>
    </div>
  </div>
  <!-- 배치 0 숫자판: 다른 배치에서는 숨는다 -->
  <div class="panel" id="panel">
    <canvas id="panelCanvas"></canvas>
    <div class="ghost" id="num">0</div>
  </div>
  <button class="btn" id="btn" type="button"><canvas id="btnCanvas"></canvas><span class="ghost" id="btnLabel">쏴</span></button>
</main>
<script>
/* 결투 — 서부 총잡이 대결.
   비유: 운동회 달리기 출발 총. 「!」가 뜨기 전에 움직이면 부정 출발(반칙패), 뜨고 나서는 먼저 누른 쪽이 이긴다.
   멀리서 넓게 잡은 장면: 화면 왼쪽 끝에 나, 오른쪽 끝에 상대가 마주 보고 서 있다.
   이길 때마다 다음 상대가 조금씩 빨라지고, 지면 연승이 0으로 돌아간다.
   11/11 16:29 피드백판: 기기 모양만 남김(배치 E = 2:1 화면, F = 4:3 화면) · 기기를 크게 · 몸통 색 넷 ·
   게임 버튼은 누른 번호로 바로 · 왼쪽 키 = 다시(RE), 오른쪽 키 = 쏘기(권총 그림) · 들어오면 3초 안에 첫 신호 ·
   기다리는 동안 굴러가는 마른 풀 덩어리와 바람 줄 · 상대는 검은 모자 · 시작 때 내 머리 위 「나」 · 왼쪽 위 「N연승」. */
(function () {
  'use strict';

  const W = 128;          // 그림판 가로 칸 수(모든 배치 같음)
  const BASE_H = 64;      // 그림을 처음 짠 기준 세로 칸 수(배치 A)
  const MAX_ROWS = 400;   // 아주 긴 화면에서도 칸 수가 끝없이 늘지 않게 막는 상한
  const BG = '#000000', INK = '#f2f2f2';
  const KEYS = {
    streak: 'hold-on-key-duel-streak',   // 지금 연승
    best: 'hold-on-key-duel-best',       // 최고 연승
    bestMs: 'hold-on-key-duel-best-ms',  // 이긴 판 중 가장 빠른 반응(1/1000초)
  };
  const LAYOUT_KEY = 'hold-on-keys-layout'; // 고른 배치(E · F). 네 게임이 함께 쓴다. 「처음부터」 지우기에는 안 들어감
  const SKIN_KEY = 'hold-on-keys-skin';     // 고른 몸통 색(0~3). 네 게임이 함께 쓴다
  const LABEL = '쏴';

  // 대결 규칙 값(시간 단위는 전부 1/1000초)
  const WAIT_MIN = 1500, WAIT_MAX = 4500; // 대결 시작 ~ 신호까지 무작위 시간
  const FIRST_WAIT_MIN = 1200, FIRST_WAIT_MAX = 3000; // 게임에 막 들어온 첫 판만: 3초 안에 신호(그냥 서 있는 시간이 길지 않게)
  const ME_MARK_MS = 1500; // 결투가 시작되면 내 머리 위 「나」 표시가 떠 있는 시간
  const OPP_FIRST = 600, OPP_STEP = 40, OPP_FLOOR = 160; // 상대 반응: 첫 상대 0.6초, 이길 때마다 0.04초 빨라짐, 0.16초 밑으로는 안 줄어듦
  const oppFor = (n) => Math.max(OPP_FLOOR, OPP_FIRST - OPP_STEP * n);
  const IGNORE_AFTER = 400; // 결과가 나온 직후 이만큼은 누름을 무시(늦게 누른 것이 다음 판 반칙이 되지 않게)
  const FALL_START = 100, FALL_MS = 300; // 맞은 사람: 0.1초까지 서 있음 → 0.3초까지 넘어가는 중 → 누움

  /* ---------- 배치 여섯 가지(0 · A~E) ----------
     rows = 검은 화면 세로 칸 수('fill' = 남는 높이를 전부 채우게 계산)
     panel = 화면과 버튼 사이에 숫자판을 둔다(배치 0)
     btn = 세로 화면에서 버튼 높이(화면 점), 'fill' = 화면을 놓고 남는 높이 전부
     btnLand = 가로로 눕힌 화면에서 오른쪽 버튼 폭, 'fill' = 화면과 반반
     tapScreen = 검은 화면을 눌러도 쏘는지 */
  const LAYOUTS = {
    0: { rows: 64, panel: true, tapScreen: false },                   // 2:1 화면 + 숫자판 + 큰 버튼
    A: { rows: 64, btn: 'fill', btnLand: 'fill', tapScreen: false },  // 작은 2:1 화면 + 아주 큰 버튼
    B: { rows: 96, btn: 160, btnLand: 220, tapScreen: false },        // 4:3 화면 + 중간 버튼
    C: { rows: 128, btn: 96, btnLand: 150, tapScreen: false },        // 1:1 화면 + 얇은 버튼
    D: { rows: 'fill', btn: 64, btnLand: 88, tapScreen: true },       // 화면이 거의 전부 + 맨 아래 띠 버튼
    E: { rows: 64, keys: true, tapScreen: false },                    // 기기 모양: 몸통 안에 2:1 화면 + 키캡 두 개
    F: { rows: 96, keys: true, tapScreen: false },                    // 같은 기기 모양: 4:3 화면 + 키캡 두 개
  };
  // 11/11 16:29부터 고를 수 있는 배치는 E · F 둘뿐(0 · A~D는 코드만 남고 화면에서 고를 수 없다)
  const LAYOUT_IDS = ['E', 'F']; // 배치 버튼 · L 키로 도는 순서
  const FIRST_LAYOUT = 'E'; // 처음 여는 사람의 배치

  /* ---------- 몸통 색 넷: 누를 때마다 다음 색. 띠 = 몸통보다 한 단계 어두운 색 ---------- */
  const SKINS = [
    { name: 'white', body: '#f2f2f2', grip: '#cfcfcf' },
    { name: 'gray', body: '#c9cbcc', grip: '#a9abac' },
    { name: 'cream', body: '#e7dfcb', grip: '#c9c0aa' },
    { name: 'black', body: '#1c1c1c', grip: '#3a3a3a', line: true }, // 검은 몸통은 둘레 안쪽에 2점 흰 선
  ];

  // 기기 치수(단위는 화면 점, 비율은 몸통 폭 dw에 대한 몫)
  const DEVICE_MAX = 460;     // 몸통 폭 상한
  const EDGE = 28;            // 창 가장자리와 몸통 사이에 남기는 여유(양쪽 합)
  const SCREEN_SHARE = 0.86;  // 검은 화면 폭 목표 = 몸통 폭의 86%
  const GAP_SHARE = 0.07;     // 화면~키캡 · 두 키 사이 · 키캡~띠 · 띠 높이 · 띠~몸통 끝 = 몸통 폭의 7%
  const KEY_SHARE_TWO = 0.34; // 키 둘 게임: 키캡 한 변 목표 = 몸통 폭의 34%
  const GRIP_SHARE = 0.46;    // 오돌토돌한 띠 폭 = 몸통 폭의 46%
  const BODY_TALL = 1.5;      // 몸통 세로 = 폭의 1.5배까지 늘림(남는 높이는 틈에 나눠 넣음)
  const CORNER_SHARE = 0.1;   // 위 모서리 둥글기 · 아래 모서리 깎기 = 몸통 폭의 10%
  const BAND_PAD = 10;        // 몸통 위 띠: 작은 버튼 줄 위아래 여유
  const KEY_MIN = 72, KEY_MAX = 190; // 키캡 한 변 범위
  const KEY_CELLS = 20;       // 키캡 그림은 20×20칸
  const KEY_PRESS_DROP = 3;   // 누르면 윗면이 내려가는 칸 수
  const A_MIN_BTN = 200;   // 배치 A에서 버튼이 적어도 이만큼은 남게(화면 점)
  const SIDE = 4;          // 흰 몸통이 검은 화면 옆 · 아래를 감싸는 두께(화면 점)
  const SKY_SHARE = 0.6;   // 화면이 세로로 늘어날 때, 늘어난 칸 중 하늘 쪽(위)에 주는 몫. 나머지는 땅 쪽(아래)
  const LAND_MQ = window.matchMedia('(orientation: landscape) and (max-height: 520px)');

  /* ---------- 저장: 저장소가 막혀 있어도 게임은 돈다(그때는 메모리에만) ---------- */
  const memory = {};
  function loadRaw(key) {
    try { const v = localStorage.getItem(key); if (v !== null) return v; } catch (e) { /* 메모리 값으로 */ }
    return key in memory ? memory[key] : null;
  }
  // 저장된 0 이상 정수. 없거나 이상하면 null
  function loadInt(key) {
    const raw = loadRaw(key);
    if (raw === null) return null;
    const value = Math.floor(Number(raw));
    return Number.isFinite(value) && value >= 0 ? value : null;
  }
  function saveRaw(key, value) {
    memory[key] = String(value);
    try { localStorage.setItem(key, String(value)); } catch (e) { /* 메모리에만 */ }
  }
  function clearKey(key) {
    delete memory[key];
    try { localStorage.removeItem(key); } catch (e) { /* 메모리만 지움 */ }
  }
  function loadLayout() {
    const raw = loadRaw(LAYOUT_KEY);
    return LAYOUT_IDS.includes(raw) ? raw : FIRST_LAYOUT;
  }
  function loadSkin() {
    const n = loadInt(SKIN_KEY);
    return n !== null && n < SKINS.length ? n : 0;
  }

  /* ---------- 그림 재료: 글자 그림. # 흰 점, . 건너뜀 ---------- */

  // 총잡이(오른쪽을 보는 모습). 상대는 좌우를 뒤집어 찍는다.
  // ax = 몸 한가운데 열(발 디딘 자리). 그림은 아래 끝을 땅 줄 바로 위에 맞춘다
  const STAND = [ // 서 있음: 카우보이 모자, 오른손은 허리춤 총 옆
    '....###....',
    '....###....',
    '..#######..',
    '....###....',
    '....###....',
    '.....#.....',
    '....###....',
    '...#.#.#...',
    '...#.#.#...',
    '..#..#..#..',
    '..#..#..#..',
    '.....#..##.',
    '....#.#.#..',
    '....#.#....',
    '...#...#...',
    '...#...#...',
    '..#.....#..',
    '.##.....##.',
  ];
  const SHOOT = [ // 쏨: 총을 뽑아 팔을 앞으로 쭉 뻗어 겨눔
    '....###........',
    '....###........',
    '..#######......',
    '....###........',
    '....###........',
    '.....#.........',
    '....#########..',
    '...#.#....#....',
    '...#.#.........',
    '..#..#.........',
    '..#..#.........',
    '.....#.........',
    '....#.#........',
    '....#.#........',
    '...#...#.......',
    '...#...#.......',
    '..#.....#......',
    '.##.....##.....',
  ];
  const FALL = [ // 넘어가는 중: 무릎이 꺾이며 앞으로 기울어짐(모자는 벗겨져 따로)
    '',
    '',
    '',
    '',
    '',
    '..........###...',
    '..........###...',
    '.......#..###...',
    '........#.#.....',
    '.........#......',
    '........#.#.....',
    '.......#...#....',
    '......#.....#...',
    '......##........',
    '......#.#.......',
    '.....#..#.......',
    '.....#..#.......',
    '...##...##......',
  ];
  const DOWN = [ // 누움: 앞으로 엎어짐
    '..............###.',
    '#........#.#..###.',
    '#################.',
  ];
  const POSES = {
    stand: { rows: STAND, ax: 5 },
    shoot: { rows: SHOOT, ax: 5 },
    fall: { rows: FALL, ax: 6 },
    down: { rows: DOWN, ax: 3 },
  };
  const HAT = ['.###.', '#####']; // 벗겨진 모자(나: 속이 꽉 찬 흰 모자)
  // 상대는 검은 모자: 검은 화면 위라 테두리만 흰 점으로 그리고 속은 검게 남긴다(내 흰 모자보다 한 칸씩 넓다)

  function measure(keys, font = GLYPHS) {

  function sizeCorner(cv, cw, ch) {

  // 배치 버튼: 테두리 안에 E F 두 글자. 지금 배치 글자만 검게 칠한 칸에 흰 글씨. 버튼 높이(화면 점)를 돌려준다

  // 몸통 색 버튼: 테두리 안에 7×9칸 네모 넷(네모마다 그 색 견본 + 검은 테두리 한 칸).

  /* ---------- 그리기: 128×(배치별 세로)칸 작은 판에 찍은 뒤 그대로 키운다 ---------- */
  const g = el.screen.getContext('2d');

  function boardText(keys, x, y, k, font = GLYPHS) {
    const m = measure(keys, font);
    box(x - 1, y - 1, m.w * k + 2, m.h * k + 2, BG);
    let cx = x;
    keys.forEach((key) => {

  // 총잡이 한 명: anchor = 몸 한가운데 열, right = 오른쪽을 보는지(나), gy = 땅 줄.
  // 둘레를 한 칸 검게 비워 능선 위에 겹쳐도 몸이 또렷하게 보이게 한다. 상대(right = false)는 검은 모자
  function drawPerson(anchor, right, pose, gy) {

    const sx = (i) => (right ? anchor - ax + i : anchor + ax - i);
    const cells = [];
    rows.forEach((row, j) => { for (let i = 0; i < row.length; i += 1) if (row[i] === '#') cells.push([sx(i), top + j]); });

  /* ---------- 기다리는 동안의 바람: 굴러가는 마른 풀 덩어리 + 바람 줄 ----------
     비유: 서부 영화에서 결투 전 정적을 채우는 장면. 결투가 시작된 뒤 흐른 시간만 보고 그리므로
     (무작위는 판마다 바람 방향 하나뿐) 검사용 손 시계로 돌려도 같은 그림이 나온다.
     노려보는 동안 · 신호가 뜬 동안만 보이고, 결과가 나면 사라진다 */
  function windNow() {
    if (phase !== 'wait' && phase !== 'signal') return null;
    const t = now() - startT - TUMBLE_LEAD_MS;
    if (t < 0) return null;
    const n = Math.floor(t / TUMBLE_EVERY_MS), within = t - n * TUMBLE_EVERY_MS;

    const dir = n % 2 === 0 ? windDir : -windDir; // 덩어리마다 방향을 번갈아

      const n = KEY_CELLS * kc;
      if (cv.width !== n || cv.height !== n) { cv.width = n; cv.height = n; }
      cv.style.width = `${ks}px`; cv.style.height = `${ks}px`;
      b.style.left = `${x}px`; b.style.top = `${keyTop}px`;
      b.style.width = `${ks}px`; b.style.height = `${ks}px`;
    });

    // 오돌토돌한 띠: 가운데
    const gw = Math.round(dw * GRIP_SHARE);
    drawGrip(gw, gh);
    el.grip.style.left = `${Math.round((dw - gw) / 2)}px`; el.grip.style.top = `${gripTop}px`;

    drawKeys();
    syncText();
    render();
  }
  /* ---------- 게임 버튼: 배치 버튼 바로 오른쪽, 누른 숫자 칸의 게임으로 바로 간다 ----------
     비유: TV 리모컨 숫자 버튼. 1 시지프스 · 2 10.00000 · 3 결투 · 4 100m 중 누른 번호로 곧장.
     네 게임은 같은 전시장의 옆 폴더라서 「한 칸 위 폴더 → 옆 폴더」 주소로 옮겨 간다.
     이 컴퓨터의 폴더 이름(local)과 인터넷 전시장의 폴더 이름(web)이 달라서 둘 다 적어 두고,
     지금 열린 폴더 이름이 어느 쪽인지 보고 같은 쪽 이름으로 간다.
     키보드 바로 가기는 두지 않는다(100m의 F · J 사이 G처럼, 달리다 스치면 판이 날아가서).
     (fit()이 처음 불리는 때보다 앞서 쓰일 수 있어서 값은 const 대신 함수로 돌려준다) */
  function gameHere() { return '3'; }
  function gameList() {
    return [
      { id: '1', name: '시지프스', local: 'streak-sisyphus', web: 'hold-on-sisyphus' },
      { id: '2', name: '10.00000', local: 'key-ten', web: 'hold-on-key-ten' },
      { id: '3', name: '결투', local: 'key-duel', web: 'hold-on-key-duel' },
      { id: '4', name: '100m', local: 'key-100m', web: 'hold-on-key-100m' },
      { id: '5', name: '퍼덕', local: 'key-flap', web: 'hold-on-key-flap' },
      { id: '6', name: '멀리뛰기', local: 'key-leap', web: 'hold-on-key-leap' },
    ];
  }
  function gameUrl(id) {
    const list = gameList(), target = list.find((g) => g.id === String(id));
    if (!target) return null;
    // 지금 폴더 이름: …/hold-on-key-ten/ → hold-on-key-ten, …/key-ten/index.html → key-ten
    const parts = location.pathname.split('/').filter(Boolean);
    if (parts.length && /\.html?$/i.test(parts[parts.length - 1])) parts.pop();
    const here = decodeURIComponent(parts[parts.length - 1] || '');
    const onWeb = list.some((g) => g.web === here);
    return onWeb ? `../${target.web}/` : `../${target.local}/index.html`;
  }
  // 넘어간 게임마다 뒤로 가기 기록이 쌓이지 않게 지금 칸을 바꿔 끼운다. 지금 게임 번호면 아무 일 없음
  function goGame(id) {
    if (String(id) === gameHere()) return false;
    const url = gameUrl(id);
    if (!url) return false;
    location.replace(url);
    return true;
  }
  // 그림: 배치 버튼과 같은 모양. 테두리 안에 1 2 3 4, 지금 게임 숫자만 검게 칠한 칸에 흰 글씨
  const GAME_BOX_W = 7, GAME_BOX_H = 9;                // 글자 한 칸 상자(글자 5×7 + 둘레 한 칸)
  function drawGameBtn(gb) {
    const cv = gb.querySelector('canvas'), ctx = cv.getContext('2d'), cc = cornerCell(), list = gameList();
    const cols = 3 + list.length * (GAME_BOX_W + 1) - 1 + 3, rowsN = 17;
    const cw = cols * cc, ch = rowsN * cc;
    sizeCorner(cv, cw, ch);
    ctx.clearRect(0, 0, cw, ch);
    pixelBlock(ctx, cw, ch, cc, INK); // 몸통 색과 상관없이 흰 바탕
    pixelFrame(ctx, cw, ch, cc, BG);
    list.forEach((g, i) => {
      const bx = (3 + i * (GAME_BOX_W + 1)) * cc, by = Math.floor((rowsN - GAME_BOX_H) / 2) * cc;
      if (g.id === gameHere()) {
        ctx.fillStyle = BG; ctx.fillRect(bx, by, GAME_BOX_W * cc, GAME_BOX_H * cc);
        drawText(ctx, [g.id], bx + cc, by + cc, cc, INK);
      } else {
        drawText(ctx, [g.id], bx + cc, by + cc, cc, BG);
      }
    });
    const label = `게임 ${gameHere()} ${list.find((g) => g.id === gameHere()).name}`;
    const gl = document.getElementById('gameLabel');
    if (gl && gl.textContent !== label) gl.textContent = label;
  }
  // 버튼 안 가로 위치(화면 점, 버튼 왼쪽 끝 = 0) → 몇 번째 숫자 칸인지.
  // 칸 경계 = 글자 상자 경계, 상자 사이 한 칸 틈은 그 가운데를 기준으로 가까운 칸, 양 끝 여백은 맨 끝 칸
  function gameIndexAt(xCss) {
    const n = gameList().length, cellsX = (xCss * dpr()) / cornerCell();
    const i = Math.floor((cellsX - 3 + 0.5) / (GAME_BOX_W + 1));
    return Math.max(0, Math.min(n - 1, i));
  }
  // 자리: 배치 버튼이 든 몸통(배치 E면 기기 몸통)으로 따라가서, 배치 버튼 오른쪽 6점 떨어진 곳에 같은 높이로 선다
  function placeGameBtn() {
    const gb = document.getElementById('gameBtn'), lb = el.layoutBtn;
    if (!gb) return;
    if (gb.parentNode !== lb.parentNode || lb.nextSibling !== gb) lb.parentNode.insertBefore(gb, lb.nextSibling);
    drawGameBtn(gb);
    gb.style.left = `${lb.offsetLeft + lb.offsetWidth + 6}px`;
    gb.style.top = `${lb.offsetTop}px`;
  }
  // 누르는 순간 그 번호 게임으로. 게임 누름으로 세지 않는다(아래로 퍼지지 않게 막음)
  document.getElementById('gameBtn').addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    const box = e.currentTarget.getBoundingClientRect();
    goGame(gameList()[gameIndexAt(e.clientX - box.left)].id);
  });
  if (window.ResizeObserver) new ResizeObserver(fit).observe(el.main);
  window.addEventListener('resize', fit);

  /* ---------- 입력: 손가락이 닿는 순간 쏜다 ---------- */
  // 「한 번 눌렀다 뗀 것」: 넓은 버튼은 살짝 들어갔다 나오고, 기기 모양(E · F)에서는 오른쪽 키캡이 잠깐 눌린 그림이 된다
  function pressAt(t) {
    fire(t);
    if (LAYOUTS[layout].keys) flashPushKey();
    else if (el.btn.animate) el.btn.animate([{ transform: 'translateY(5px)' }, { transform: 'translateY(0)' }], { duration: 110, easing: 'ease-out' });
  }
  const mainPointer = (e) => e.pointerType !== 'mouse' || e.button === 0;
  el.btn.addEventListener('pointerdown', (e) => {
    if (!mainPointer(e)) return;
    e.preventDefault();
    pressAt(eventTime(e));
  });
  // 배치 D에서는 검은 화면을 눌러도 쏜다
  el.screen.addEventListener('pointerdown', (e) => {
    if (!LAYOUTS[layout].tapScreen || !mainPointer(e)) return;
    e.preventDefault();
    pressAt(eventTime(e));
  });
  // 배치 버튼: 쏘기로 세지 않는다
  el.layoutBtn.addEventListener('pointerdown', (e) => {
    if (!mainPointer(e)) return;
    e.preventDefault(); e.stopPropagation();
    nextLayout();
  });
  // 몸통 색 버튼: 쏘기로 세지 않는다
  el.skinBtn.addEventListener('pointerdown', (e) => {
    if (!mainPointer(e)) return;
    e.preventDefault(); e.stopPropagation();
    nextSkin();
  });
  // 키캡: 누르는 순간 작동(오른쪽 = 쏘기, 왼쪽 = 다시). 그 손가락이 떼어지거나, 키 밖으로 미끄러지거나, 화면 밖으로 나가면 뗀 것
  ['push', 'slide'].forEach((name) => {
    keyEl()[name].addEventListener('pointerdown', (e) => {
      if (!mainPointer(e)) return;
      e.preventDefault(); e.stopPropagation();
      if (!LAYOUTS[layout].keys) return;
      // 손가락을 키에 묶어 두지 않아야 키 밖으로 미끄러진 것을 알아챈다
      const t = e.currentTarget;
      try { if (t.hasPointerCapture && t.hasPointerCapture(e.pointerId)) t.releasePointerCapture(e.pointerId); } catch (err) { /* 그대로 */ }
      // 새로 닿은 첫 손가락인데 키가 눌린 채 남아 있으면, 떼는 신호를 놓친 낡은 누름이다 → 풀고 받는다(키가 먹통이 되지 않게)
      if (e.isPrimary) ['push', 'slide'].forEach((k) => { if (keyHold[k] !== null && keyHold[k] !== e.pointerId) releaseKey(k); });
      holdKey(name, e.pointerId, eventTime(e));
    });
  });
  const insideRect = (node, x, y) => {
    const b = node.getBoundingClientRect();
    return x >= b.left && x <= b.right && y >= b.top && y <= b.bottom;
  };
  window.addEventListener('pointermove', (e) => {
    const nodes = keyEl();
    ['push', 'slide'].forEach((name) => {
      if (keyHold[name] === e.pointerId && !insideRect(nodes[name], e.clientX, e.clientY)) releaseKey(name, e.pointerId);
    });
  });
  ['pointerup', 'pointercancel'].forEach((type) => window.addEventListener(type, (e) => {
    releaseKey('push', e.pointerId); releaseKey('slide', e.pointerId);
  }));
  // 마우스가 창 밖으로 나감(옮겨 간 곳이 없음)
  window.addEventListener('pointerout', (e) => {
    if (e.relatedTarget) return;
    releaseKey('push', e.pointerId); releaseKey('slide', e.pointerId);
  });
  window.addEventListener('blur', releaseAllKeys);
  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter') releaseKey('push', `kb:${e.code}`);
    if (e.code === 'KeyR') releaseKey('slide', 'kb:KeyR');
  });

  window.addEventListener('keydown', (e) => {
    const plain = !e.metaKey && !e.ctrlKey && !e.altKey;
    if (e.code === 'KeyL' && plain) {
      e.preventDefault();
      if (!e.repeat) nextLayout();
      return;
    }
    if (e.code === 'KeyC' && plain) {
      e.preventDefault();
      if (!e.repeat) nextSkin();
      return;
    }
    // R = 다시(왼쪽 키를 누른 것과 같음, 떼면 keyup에서 올라옴)
    if (e.code === 'KeyR' && plain) {
      e.preventDefault();
      if (e.repeat) return;
      if (keyHold.slide === 'kb:KeyR') releaseKey('slide');
      holdKey('slide', 'kb:KeyR', eventTime(e));
      return;
    }
    if (e.code !== 'Space' && e.code !== 'Enter' && e.code !== 'NumpadEnter') return;
    if (!plain) return; // Cmd · Ctrl · Alt와 같이 누른 것은 게임 누름이 아니다(떼는 신호가 안 와서 키가 눌린 채 남는 것도 막음)
    e.preventDefault();
    if (e.repeat) return; // 꾹 누르고 있어 저절로 반복되는 입력은 무시
    const t = eventTime(e);
    if (LAYOUTS[layout].keys) {
      // 같은 키가 눌린 채 남아 있는데 새로 눌렸다면 떼는 신호를 놓친 것이다 → 풀고 받는다(키보드가 먹통이 되지 않게)
      if (keyHold.push === `kb:${e.code}`) releaseKey('push');
      holdKey('push', `kb:${e.code}`, t); // 오른쪽 키를 누른 것과 같음(떼면 keyup에서 올라옴)
    }
    else pressAt(t);
  });
  // 연타할 때 화면이 확대되거나 끌리거나, 길게 눌러 메뉴가 뜨지 않게 막는다
  const block = (e) => e.preventDefault();
  ['touchstart', 'touchmove', 'touchend'].forEach((name) => document.addEventListener(name, block, { passive: false }));
  ['gesturestart', 'dblclick', 'contextmenu', 'selectstart', 'dragstart'].forEach((name) => document.addEventListener(name, block));

  fit();
  // 들어오자마자 첫 결투 시작(신호는 3초 안에). 뒤쪽 탭으로 열렸으면 화면이 보이는 순간 시작(visibilitychange)
  if (!document.hidden) { startDuel(now()); autoDuel = true; }

  /* ---------- 검사용 손잡이: 게임에는 영향이 없다 ---------- */
  const toInt = (n) => {
    const value = Math.floor(Number(n));
    return Number.isFinite(value) ? Math.max(0, Math.min(Number.MAX_SAFE_INTEGER, value)) : 0;
  };
  const rectOf = (node) => {
    const b = node.getBoundingClientRect();
    return { x: b.left, y: b.top, w: b.width, h: b.height };
  };
  window.__STREAK_TEST__ = {
    state() {
      return {
        phase, streak, best, bestMs,
        oppMs: phase === 'ready' ? oppFor(streak) : duelOpp,
        waitMs: phase === 'ready' ? null : waitMs,
        myMs, outcome, pose: poses(), mark: markNow(), timeText: timeTextNow(),
        label: LABEL,
        layout, layouts: LAYOUT_IDS.slice(), rows: H,
        skin, skinName: SKINS[skin].name, skins: SKINS.map((s) => s.name),
        keyDown: anyKeyDown(),
        keyRects: LAYOUTS[layout].keys ? { push: rectOf(el.keyPush), slide: rectOf(el.keySlide) } : null,
        rects: {
          device: rectOf(el.deviceE), screen: rectOf(el.screen), push: rectOf(el.keyPush), slide: rectOf(el.keySlide), grip: rectOf(el.grip),
          layoutBtn: rectOf(el.layoutBtn), gameBtn: rectOf(document.getElementById('gameBtn')), skinBtn: rectOf(el.skinBtn),
        },
        game: gameHere(),
        meMark: meMarkNow(),                 // 「나」 표시가 떠 있는지
        tumble: (() => { const w = windNow(); return w ? { x: w.x, lift: w.lift, dir: w.dir } : null; })(), // 굴러가는 풀(없으면 null)
      };
    },
    press() { pressAt(now()); return this.state(); },
    keyPress() { return holdKey('push', 'test', now()); }, // 이미 눌려 있으면 false(쏘지 않음)
    keyRelease() { return releaseKey('push'); },
    // 왼쪽 키(다시): 누르고 떼기까지. 다른 키가 눌려 있으면 false
    restartKey() { const ok = holdKey('slide', 'test', now()); releaseKey('slide'); return ok; },
    setSkin(n) { return setSkin(n); },
    nextSkin() { nextSkin(); return skin; },
    gameUrl(id) { return gameUrl(id); },               // 그 번호 게임으로 갈 주소(가지는 않음)
    gameIndexAt(x) { return gameIndexAt(Number(x)); }, // 게임 버튼 안 가로 위치(화면 점) → 칸 번호(0부터)
    // 앞으로의 대결에서 신호까지 시간을 고정(null이면 다시 무작위)
    setWait(ms) {
      fixedWait = ms === null || ms === undefined ? null : toInt(ms);
      return this.state();
    },
    // 연승을 n으로(상대 속도도 그에 맞게). 최고 연승보다 크면 최고 연승도 올린다
    setStreak(n) {
      streak = toInt(n);
      if (streak > best) best = streak;
      if (phase !== 'result') duelOpp = oppFor(streak);
      saveRecords(); syncText(); render();
      return this.state();
    },
    reset() {
      streak = 0; best = 0; bestMs = null;
      phase = 'ready'; waitMs = null; myMs = null; outcome = null; shotMs = null; autoLoseFrom = null;
      duelOpp = oppFor(0);
      Object.values(KEYS).forEach(clearKey);
      syncText(); render();
      return this.state();
    },
    // 손으로 돌리는 시계: 처음 부르면 지금 시계 값에서 이어 받아 멈춰 두고, 부를 때마다 ms만큼 돌린다.
    // 그 사이 신호 · 상대가 쏘기는 정해진 시각 그대로 차례로 처리된다
    tick(ms) {
      if (manual === null) {
        manual = now();
        if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      }
      manual += Math.max(0, Number(ms) || 0);
      advanceTo(manual);
      render();
      return this.state();
    },
    // 실제 시계로 되돌리기: 시간이 끊기지 않게 지금 값에서 이어 흐른다
    realClock() {
      if (manual !== null) {
        offset = manual - performance.now();
        manual = null;
      }
      render(); startLoop();
      return this.state();
    },
    setLayout(id) { return setLayout(String(id).toUpperCase()); },
    nextLayout() { nextLayout(); return layout; },
  };
})();
</script>
</body>
</html>
