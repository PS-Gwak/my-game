<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>키캡 소리 비교</title>
<style>
  /* 키캡 소리 비교 시안: 맨 위는 짝 — 줄마다 「지금 N」(게임에 든 소리)과 「새 N」(그 소리와 똑같이 들리게 새로 만든 소리).
     그 아래는 plinkfx 후보 넷. 모두 키캡으로 놓는다.
     키캡을 누르는 순간 그 소리가 한 번 난다(게임과 같은 방식). 게임 파일은 건드리지 않는 따로 떨어진 한 장이다. */
  :root { --black: #000000; --white: #f2f2f2; --gray: #8a8a8a; --pick: #f2f2f2; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--black); color: var(--white);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  main { max-width: 520px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  .lead { font-size: 16px; color: var(--gray); margin: 0 0 22px; line-height: 1.5; }
  h2 { font-size: 19px; margin: 26px 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 10px; }
  .grid.four { grid-template-columns: repeat(2, 1fr); }
  /* 짝 한 줄: 왼쪽 「지금 N」, 오른쪽 「새 N」을 한 테두리 안에 묶어 한눈에 짝으로 보이게 한다 */
  .pairs { display: grid; gap: 10px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid #3a3a3a; border-radius: 12px; padding: 4px; }
  .pair .cap + .cap { position: relative; }
  .pair .cap + .cap::before { content: ""; position: absolute; left: -3px; top: 14px; bottom: 14px; border-left: 2px solid #3a3a3a; }
  .cap {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 10px 4px 12px; margin: 0; border: 2px solid transparent; border-radius: 10px;
    background: transparent; color: var(--white); font: inherit; cursor: pointer;
    touch-action: pan-y; outline: none; /* 키캡 위에서 시작해도 위아래로 밀면 페이지가 내려간다 */
  }
  .cap.last { border-color: #8a8a8a; }
  .cap canvas { display: block; image-rendering: pixelated; }
  .cap .name { font-size: 18px; font-weight: 700; line-height: 1.2; }
  .cap .desc { font-size: 15px; color: var(--gray); line-height: 1.3; text-align: center; }
  .rapid {
    display: block; width: 100%; margin: 28px 0 0; padding: 16px; border: 2px solid var(--white); border-radius: 10px;
    background: transparent; color: var(--white); font: inherit; font-size: 17px; cursor: pointer; touch-action: manipulation;
  }
  .rapid:active { background: #1c1c1c; }
</style>
</head>
<body>
<main>
  <h1>키캡 소리 비교</h1>
  <p class="lead">키캡을 누르면 그 소리가 납니다. 아이폰은 옆의 무음 스위치를 꺼 주세요.</p>

  <h2>지금 소리 | 똑같이 만든 새 소리</h2>
  <div class="pairs" id="pairGrid"></div>

  <h2>plinkfx 후보</h2>
  <div class="grid four" id="newGrid"></div>

  <button class="rapid" id="rapid" type="button">마지막에 누른 소리를 연타로 듣기</button>
</main>

  /* ---------- 키캡 그림: 게임들이 같이 쓰는 도트 키캡(KeyArt.pixel)과 같은 그림 ---------- */
  function drawCap(c, n, down) {
    const u = n / 20, K = '#000000', W = '#f2f2f2';
    const R = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(Math.round(x * u), Math.round(y * u), Math.round((x + w) * u) - Math.round(x * u), Math.round((y + h) * u) - Math.round(y * u)); };
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, n, n);
    R(1, 0, 18, 20, W); R(0, 1, 20, 18, W);
    R(1, 0, 18, 1, K); R(1, 19, 18, 1, K); R(0, 1, 1, 18, K); R(19, 1, 1, 18, K);
    const fx = 3, fw = 14, fh = 14, fy = down ? 4 : 2;
    const ticks = down ? [[1, 1], [2, 2], [3, 3], [18, 1], [17, 2], [16, 3], [2, 18], [17, 18]]
      : [[1, 1], [2, 2], [18, 1], [17, 2], [1, 18], [2, 17], [3, 16], [18, 18], [17, 17], [16, 16]];
    ticks.forEach(([x, y]) => R(x, y, 1, 1, K));
    R(fx + 1, fy, fw - 2, 1, K); R(fx + 1, fy + fh - 1, fw - 2, 1, K); R(fx, fy + 1, 1, fh - 2, K); R(fx + fw - 1, fy + 1, 1, fh - 2, K);
  }

  /* ---------- 소리: 게임의 키캡 소리와 같은 방식(미리 풀어 둔 녹음을 누를 때 한 번 튼다) ---------- */
  let ac = null;
  const bufs = new Array(SOUNDS.length).fill(null);
  function decodeAll() {
    const OC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const dc = OC ? new OC(1, 1, 44100) : ctx();
    if (!dc) return;
    SOUNDS.forEach((s, i) => {
      try {
        const bin = atob(s.b64), u = new Uint8Array(bin.length);
        for (let k = 0; k < bin.length; k += 1) u[k] = bin.charCodeAt(k);
        const pr = dc.decodeAudioData(u.buffer, (b) => { bufs[i] = b; }, () => { /* 그 소리만 안 남 */ });
        if (pr && pr.catch) pr.catch(() => {});
      } catch (e) { /* 그 소리만 안 남 */ }
    });
  }
  function ctx() {
    if (!ac) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ac = new AC(); }
    if (ac.state !== 'running') { const p = ac.resume(); if (p && p.catch) p.catch(() => {}); }
    return ac;
  }
  // 아이폰: 무음 스위치가 켜져 있어도 소리가 나게 「음악 재생」 쪽으로 알려 둔다(되는 기기에서만)
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* 그대로 */ }
  // 소리 장치가 아직 잠겨 있어 못 튼 누름은 기억해 두었다가, 손가락을 떼서 장치가 깨어나면 바로 한 번 튼다(아이폰 첫 누름)
  let pending = -1, pendingAt = 0;
  function play(i, when) {
    try {
      const c = ctx(), b = bufs[i];
      if (!c || !b) return;
      if (c.state !== 'running' && !when) { pending = i; pendingAt = performance.now(); return; }
      const src = c.createBufferSource(); src.buffer = b; src.connect(c.destination); src.start(when || 0);
    } catch (e) { /* 소리만 안 남 */ }
  }
  function wake() {
    try {
      const c = ctx();
      if (!c || pending < 0) return;
      const p = c.state === 'running' ? Promise.resolve() : c.resume();
      Promise.resolve(p).then(() => {
        if (pending < 0 || c.state !== 'running') return;
        const k = pending; pending = -1;
        if (performance.now() - pendingAt < 1500) play(k); // 한참 전 누름은 뒤늦게 틀지 않는다
      }).catch(() => {});
    } catch (e) { /* 그대로 */ }
  }
  decodeAll();
  // 아이폰 사파리는 손가락을 뗄 때 · 키보드 입력 때만 소리를 허락한다 → 그때 소리 장치를 깨운다
  ['pointerup', 'touchend', 'keydown'].forEach((n) => window.addEventListener(n, wake, { capture: true, passive: true }));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) try { ctx(); } catch (e) { /* 그대로 */ } });

  /* ---------- 키캡 늘어놓기 ---------- */
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const unit = Math.max(1, Math.floor(84 * dpr / 20)), n = unit * 20; // 칸이 흐리지 않게 기기 점 단위로 맞춘다
  let last = 0; // 처음엔 「지금 1」(게임 기본)이 골라져 있다 → 연타 버튼도 그 소리
  const caps = [];
  SOUNDS.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'cap';
    btn.setAttribute('aria-label', `${s.name} ${s.desc}`.trim());
    const cv = document.createElement('canvas');
    cv.width = n; cv.height = n; cv.style.width = `${n / dpr}px`; cv.style.height = `${n / dpr}px`;
    const g = cv.getContext('2d'); drawCap(g, n, false);
    const nm = document.createElement('span'); nm.className = 'name'; nm.textContent = s.name;
    const ds = document.createElement('span'); ds.className = 'desc'; ds.textContent = s.desc;
    btn.append(cv, nm, ds);
    const up = () => drawCap(g, n, false);
    const pick = () => {
      if (caps[last]) caps[last].classList.remove('last');
      last = i; btn.classList.add('last');
    };
    btn.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return; // 마우스 오른쪽 · 가운데 버튼은 무시
      drawCap(g, n, true); play(i); pick();
    });
    ['pointerup', 'pointerleave'].forEach((t) => btn.addEventListener(t, up));
    btn.addEventListener('pointercancel', () => { up(); pending = -1; }); // 스크롤로 바뀐 누름은 나중에 틀지 않는다
    // 키보드(Tab으로 옮겨 Enter · Space)로 누를 때도 소리
    btn.addEventListener('click', (e) => { if (e.detail === 0) { play(i); pick(); wake(); } });
    btn.addEventListener('contextmenu', (e) => e.preventDefault());
    if (i === last) btn.classList.add('last');
    caps.push(btn);
    if (s.group === 'cand') { document.getElementById('newGrid').appendChild(btn); return; }
    // 짝: 「지금 N」이 나오면 그 줄을 새로 만들고, 바로 뒤의 「새 N」이 같은 줄 오른쪽에 들어간다
    const grid = document.getElementById('pairGrid');
    if (s.group === 'now' || !grid.lastElementChild) { const row = document.createElement('div'); row.className = 'pair'; grid.appendChild(row); }
    grid.lastElementChild.appendChild(btn);
  });

  // 연타로 듣기: 마지막에 누른 소리를 0.12초 간격으로 여섯 번(게임에서 빠르게 누를 때처럼)
  document.getElementById('rapid').addEventListener('click', () => {
    const c = ctx();
    if (!c) return;
    const go = () => { for (let k = 0; k < 6; k += 1) play(last, c.currentTime + 0.05 + k * 0.12); };
    if (c.state === 'running') go(); else Promise.resolve(c.resume()).then(go).catch(() => {}); // 깨어난 뒤에 시각을 잡는다(한꺼번에 몰려 나가지 않게)
  });

  // 검사용 손잡이
  window.__SOUND_CMP__ = { count: SOUNDS.length, names: SOUNDS.map((s) => s.name), decoded: () => bufs.map((b) => !!b), durations: () => bufs.map((b) => (b ? Math.round(b.duration * 1000) : null)) };
})();
</script>
</body>
</html>
