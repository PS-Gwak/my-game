      disc(g, GLASS.x + 39, 210, 62 * flow + 6, 6 * flow + 1, amber);
      bang(g, '넘쳤다', 152, 62, 38, '#ff5a5f');
      if (s.phaseT > 0.5) bang(g, '…', 248, 36, 28, '#fff7ea');
    }
    if (won && s.phaseT > 0.1) bang(g, '크으~', 182, 40, 32, '#ffd24a');
    if (s.phase === 'ready' || (s.phase === 'hold' && s.t < 3)) { // 부장님 대사
      rect(g, 176, 18, 128, 24, '#fff8e7');
      tri(g, 240, 42, 254, 42, 248, 52, '#fff8e7');
      g.font = '700 14px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillStyle = '#2a2230';
      g.fillText('가득 따라 주게나', 240, 31);
    }
    g.restore();
  }

  start({
    id: 'full-glass',
    title: '찰랑',
    hint: '꾹 눌러서 술 따르기 · 많이 따를수록 넘칠 확률이 올라요',
    rate: 5,
    riskLabel: '넘칠 확률',
    line: (s) => `${Math.round(ml(s.t))}ml 따르는 중 · 넘칠 확률 ${Math.round(s.risk)}%`,
    unit: 'ml',
    bestVersion: 'ml',
    risk: riskOf,
    tForRisk: (r) => (r <= 0 ? 0 : 2.6 + r / 5), // 100연승 규칙: 위험이 오르기 시작하는 2.6초부터 찬다
    score: (s) => ml(s.t),
    format: (v) => v.toFixed(v >= GLASS_ML ? 1 : 0),
    wonWord: '찰랑찰랑',
    deadWord: '부장님 손에 넘쳤다',
    draw,
    sound(s) {
      if (s.phase !== 'hold') { pour.silence(); return; }
      const fullness = clamp(percent(s.t) / 100, 0, 1.2);
      pour.set(0.1 + fullness * 0.1, null, 500 + fullness * 2200);
    },
    onEnd(kind, s) {
      s.endT = s.t;
      pour.silence();
      if (kind === 'dead') {
        Snd.noise(0.5, { freq: 900, vol: 0.4 });
        Snd.tone(180, 0.4, { type: 'sawtooth', slide: 90, vol: 0.18 });
      } else {
        Snd.tone(1320, 0.14, { type: 'sine', vol: 0.18 });
        setTimeout(() => Snd.tone(1760, 0.2, { type: 'sine', vol: 0.14 }), 70);
      }
    },
    reset(s) { s.endT = 0; },
  });
})();

},
"red-light": function () {
/* 무궁화꽃이 피었습니다: 꾹 누르면 내가 멀리서 다가오고, 떼면 멈춘다. 떼도 판은 끝나지 않는다.
   술래가 돌아보는 순간 움직이고 있으면 잡힌다. 돌아보는 건 눈으로 피할 수 없게 빠르지만,
   글자가 찍히는 속도를 보고 눈치로 미리 뗄 수 있다. 끝까지 가면 술래 등을 치고 도망간다.
   확률이 없는 게임이라 규칙은 하나다: 최단 기록을 세운다. 위 숫자는 초이고, 잡히면 기록 없이 다시 0초부터.
   거리 100m, 걷는 속도 초속 8m, 글자는 매번 빠르기가 달라지고 가까울수록 빨라진다(시험값). */
(function () {
  const { start, Snd, rect, disc, tri, line, bang, clamp, lerp } = HoldGame;
  const WORDS = '무궁화꽃이피었습니다'.split('');
  const GOAL = 100, SPEED = 8, GRACE = 0.09; // GRACE: 돌아보기 시작하고 잡힘 판정까지의 틈(초)
  let stepTimer = 0;

  function newChant(s) {
    // 한 글자씩 찍히는 간격을 무작위로 만들고, 전체 길이는 거리에 따라 줄인다
    const near = clamp(s.d / GOAL, 0, 1);
    const total = lerp(1.2, 3.2, s.rng()) * lerp(1, 0.55, near);
    const raw = WORDS.map(() => 0.4 + s.rng());
    // 가끔은 앞에서 뜸을 들이고 뒤에서 몰아친다
    if (s.rng() < 0.4) raw.forEach((_, i) => { raw[i] *= lerp(1.8, 0.5, i / (WORDS.length - 1)); });
    const sum = raw.reduce((a, b) => a + b, 0);
    s.gaps = raw.map((v) => (v / sum) * total);
    s.letter = 0;
    s.letterT = 0;
    s.stage = 'chant';
    s.stageT = 0;
  }

  function tick(s, dt, api) {
    if (s.phase !== 'hold') return;
    if (s.frozen) return;
    s.clock += dt;
    const moving = s.holding;
    if (moving) {
      s.d += SPEED * dt;
      s.walk += dt * 9;
    }
    s.stageT += dt;
    if (s.d >= GOAL) { s.d = GOAL; api.win(); return; }
    if (s.stage === 'chant') {
      s.letterT += dt;
      while (s.letter < WORDS.length && s.letterT >= s.gaps[s.letter]) {
        s.letterT -= s.gaps[s.letter];
        s.letter += 1;
        Snd.tone(lerp(330, 620, s.letter / WORDS.length), 0.06, { type: 'square', vol: 0.08 });
      }
      if (s.letter >= WORDS.length) {
        s.stage = 'turn';
        s.stageT = 0;
        Snd.noise(0.08, { freq: 2600, vol: 0.28 });
      }
    } else if (s.stage === 'turn') {
      if (s.stageT >= GRACE) {
        if (moving) { api.die(); return; }
        s.stage = 'watch';
        s.stageT = 0;
        s.watchFor = lerp(0.55, 1.25, s.rng());
      }
    } else if (s.stage === 'watch') {
      if (moving) { api.die(); return; }
      if (s.stageT >= s.watchFor) newChant(s);
    }
  }

  function drawField(g) {
    rect(g, -8, -8, 336, 82, '#a7dcf2');
    disc(g, 60, 30, 24, 8, '#fff');
    disc(g, 230, 22, 30, 9, '#fff');
    for (let i = 0; i < 9; i += 1) {
      disc(g, 18 + i * 36, 66, 20, 14, i % 2 ? '#6faf5d' : '#5f9f50');
    }
    rect(g, -8, 74, 336, 174, '#d8b783');
    // 멀리서 가까이 오는 길
    tri(g, 156, 74, 196, 74, 300, 240, '#e2c697');
    tri(g, 156, 74, 80, 240, 300, 240, '#e2c697');
    for (let i = 0; i < 6; i += 1) {
      const k = (i + 1) / 7;
      const y = lerp(80, 232, k * k);
      rect(g, lerp(176, 190, k) - k * 22, y, k * 44, 1 + k * 3, '#caa672');
    }
  }

  function drawPlayer(g, s, caught) {
    const near = Math.pow(clamp(s.d / GOAL, 0, 1), 1.55);
    const size = lerp(0.42, 3.1, near);
    const baseX = lerp(176, 196, near), baseY = lerp(84, 214, near);
    const step = s.holding && s.phase === 'hold' ? Math.sin(s.walk) : 0;
    const P = (x, y, w, h, c) => rect(g, baseX + x * size, baseY + y * size, Math.max(1, w * size), Math.max(1, h * size), c);
    P(-4 + step, -10, 3, 10, '#35487a');
    P(1 - step, -10, 3, 10, '#35487a');
    P(-5, -22, 10, 13, '#5fb96a');
    P(-8, -21 + step, 3, 9, '#5fb96a');
    P(5, -21 - step, 3, 9, '#5fb96a');
    P(-4, -31, 8, 9, '#f7cda6');
    P(-5, -34, 10, 5, '#3a2a24');
    P(-3, -28, 1.4, 1.6, '#2a2230');
    P(2, -28, 1.4, 1.6, '#2a2230');
    if (caught) bang(g, '!', baseX, baseY - 40 * size, Math.max(16, 12 * size), '#ff5a5f');
  }

  // 술래: 눈을 가리고 이쪽을 보고 있다가, 돌아보면 뒤통수만 보인다
  function drawSeeker(g, s, turned, lurch) {
    const x = 74 + lurch, y = 128;
    disc(g, x, y + 92, 62, 58, '#c4516a');
    rect(g, x - 11, y + 30, 22, 14, '#f5c9a2');
    if (turned) {
      disc(g, x, y, 38, 38, '#2b2230');
      disc(g, x - 10, y - 16, 13, 7, '#433650');
      rect(g, x - 42, y - 4, 6, 12, '#f5c9a2');
      rect(g, x + 36, y - 4, 6, 12, '#f5c9a2');
      return;
    }
    disc(g, x, y, 36, 36, '#f5c9a2');
    disc(g, x, y - 18, 37, 21, '#2b2230');
    // 눈을 가린 두 손
    disc(g, x - 16, y + 1, 15, 10, '#eeb98f');
    disc(g, x + 16, y + 1, 15, 10, '#eeb98f');
    for (let i = 0; i < 3; i += 1) {
      rect(g, x - 28 + i * 8, y - 6, 1, 8, '#c98f66');
      rect(g, x + 8 + i * 8, y - 6, 1, 8, '#c98f66');
    }
    line(g, x - 34, y + 6, x - 50, y + 60, 12, '#c4516a');
    line(g, x + 34, y + 6, x + 50, y + 60, 12, '#c4516a');
    // 노래하는 입
    const singing = s.phase === 'hold' && s.stage === 'chant' && Math.sin(s.time * 26) > 0;
    disc(g, x, y + 20, 6, singing ? 5 : 2, '#6b2a35');
  }

  function drawWords(g, s) {
    const count = s.phase === 'hold' ? (s.stage === 'chant' ? s.letter : WORDS.length) : 0;
    const box = { x: 16, y: 10, w: 288, h: 36 };
    rect(g, box.x, box.y, box.w, box.h, '#fff8e7');
    rect(g, box.x, box.y + box.h, box.w, 2, '#b89f76');
    g.font = '900 24px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
    g.textBaseline = 'middle';
    g.textAlign = 'center';
    const gapX = (box.w - 16) / WORDS.length;
    WORDS.forEach((ch, i) => {
      g.fillStyle = i < count ? '#2a2230' : '#e9dcc0';
      g.fillText(ch, box.x + 8 + gapX * (i + 0.5), box.y + box.h / 2 + 1);
    });
  }

  function draw(g, s) {
    const dead = s.phase === 'dead', won = s.phase === 'won';
    const watching = s.phase === 'hold' && (s.stage === 'turn' || s.stage === 'watch');
    let shakeX = 0;
    if (dead) shakeX = (Math.random() - 0.5) * 8 * Math.exp(-s.phaseT * 3);
    g.save();
    g.translate(Math.round(shakeX), 0);
    drawField(g);
    drawWords(g, s);
    if (won) {
      // 끝까지 왔다: 술래 등을 치고 뒤돌아 도망간다
      const hit = s.phaseT < 0.35;
      const lurch = hit ? Math.sin(s.phaseT * 40) * 8 : -6;
      drawSeeker(g, s, false, lurch);
      if (hit) {
        rect(g, 96, 150, 68, 13, '#5fb96a');
        disc(g, 96, 156, 12, 10, '#f7cda6');
        drawPlayer(g, s, false);
        bang(g, '탁!', 112, 110, 44, '#ffd24a');
      } else {
        // 멀어지는 달리기
        const away = Math.max(0, GOAL - (s.phaseT - 0.35) * 70);
        const near = Math.pow(away / GOAL, 1.55);
        const size = lerp(0.42, 3.1, near);
        const bx = lerp(176, 196, near), by = lerp(84, 214, near);
        const P = (x, y, w, h, c) => rect(g, bx + x * size, by + y * size, Math.max(1, w * size), Math.max(1, h * size), c);
        const st = Math.sin(s.time * 18);
        P(-4 + st * 2, -10, 3, 10, '#35487a');
        P(1 - st * 2, -10, 3, 10, '#35487a');
        P(-5, -22, 10, 13, '#5fb96a');
        P(-8, -21, 3, 9, '#5fb96a');
        P(5, -21, 3, 9, '#5fb96a');
        P(-4, -32, 8, 11, '#3a2a24');
        bang(g, '메롱', 244, 86, 22, '#fff');
      }
    } else if (dead) {
      drawSeeker(g, s, true, 0);
      drawPlayer(g, s, true);
      if (s.phaseT < 0.1) { g.fillStyle = 'rgba(255,255,255,.55)'; g.fillRect(-8, -8, 336, 256); }
      bang(g, '너 움직였어!', 176, 64, 28, '#ff5a5f');
    } else {
      drawPlayer(g, s, false);
      drawSeeker(g, s, watching, 0);
      if (watching) {
        g.fillStyle = 'rgba(200,30,40,.13)';
        g.fillRect(-8, -8, 336, 256);
      }
    }
    g.restore();
  }

  start({
    id: 'red-light',
    title: '무궁화꽃이 피었습니다',
    hint: '꾹 누르면 걷고, 떼면 멈춰요 · 돌아볼 때 움직이면 잡혀요',
    rules: false,
    side: (s) => ({ label: '남은 거리', value: `${Math.ceil(GOAL - (s.d || 0))}m` }),
    line: (s) => (s.holding ? '걷는 중' : '멈춤'),
    holdEndsRound: false,
    hazard: false,
    lock: 0.9,
    risk: () => 0,
    unit: '초',
    score: (s) => s.clock || 0,
    format: (v) => v.toFixed(1),
    wonWord: '등 치고 도망',
    deadWord: '잡혔다',
    draw,
    tick,
    reset(s) {
      s.d = 0;
      s.walk = 0;
      s.clock = 0;
      newChant(s);
      s.stageT = 0;
    },
    onStart(s) { s.clock = 0; },
    finalScore(s, rule, kind) {
      return kind === 'dead' ? { value: null } : { value: s.clock };
    },
    lowerIsBetter: () => true,
    formatBest: (value) => `${value.toFixed(1)}초`,
    onFreeze(s, t) { s.d = clamp(t * SPEED, 0, GOAL); },
    sound(s, dt) {
      if (s.phase === 'hold' && s.holding) {
        stepTimer -= dt;
        if (stepTimer <= 0) {
          Snd.noise(0.05, { freq: 900, vol: 0.14 });
          stepTimer = 0.28;
        }
      }
    },
    onEnd(kind) {
      if (kind === 'dead') {
        Snd.tone(220, 0.5, { type: 'sawtooth', slide: 70, vol: 0.28 });
      } else {
        Snd.noise(0.09, { freq: 2200, vol: 0.5 });
        setTimeout(() => Snd.tone(660, 0.16, { type: 'square', vol: 0.12 }), 120);
        setTimeout(() => Snd.tone(880, 0.2, { type: 'square', vol: 0.12 }), 260);
      }
    },
  });
})();

}
};
const HOLD_ON_ENTRIES = [{"id":"cat-1a","game":"cat","art":"opus-lcd-1a"},{"id":"cat-1b","game":"cat","art":"opus-lcd-1b"},{"id":"rubber-band","game":"rubber-band"},{"id":"bubble-gum","game":"bubble-gum"},{"id":"full-glass","game":"full-glass"},{"id":"red-light","game":"red-light"}];
// 목록으로 돌아갈 때는 페이지를 새로 읽는다. 게임이 붙여 둔 입력 감지를 떼어 내는 가장 단순한 길이다
window.HOLD_ON_BACK = () => location.reload();
document.querySelector('.hl').addEventListener('click', (e) => {
