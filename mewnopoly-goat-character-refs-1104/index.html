<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>염소 시안 캐릭터 레퍼런스 (동현 11/4 체크)</title>
<style>
:root{--bg:#f3f1ec;--panel:#fbfaf7;--ink:#23211d;--muted:#6c675e;--line:#d9d4c8;--like:#2f7d5b;--like-bg:#dcefe5;--dislike:#b5452f;--dislike-bg:#f6dfd8;--accent:#c2462f;--checker:#e6e2d9;
--f:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#1b1a18;--panel:#24221f;--ink:#ece8df;--muted:#a8a196;--line:#3a3732;--like:#6cc79c;--like-bg:#1f3a2d;--dislike:#ef8a72;--dislike-bg:#43251e;--accent:#ef8a72;--checker:#2b2925;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55}
.wrap{max-width:1240px;margin:0 auto;padding:24px 16px 64px;display:grid;gap:16px}
h1{font-size:26px;margin:0;line-height:1.3;text-wrap:balance}
.nums{font-size:17px;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:4px 16px}
.nums b{font-size:20px}.n-like b{color:var(--like)}.n-dislike b{color:var(--dislike)}.n-ct b{color:var(--accent)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:grid;min-width:0}
.card[data-c="like"]{border-color:var(--like);box-shadow:0 0 0 1px var(--like)}
.card[data-c="dislike"]{border-color:var(--dislike);box-shadow:0 0 0 1px var(--dislike)}
.shots{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;background:var(--checker)}
.shots img{width:100%;height:220px;object-fit:contain;image-rendering:pixelated;display:block}
.noimg{height:90px;display:grid;place-items:center;color:var(--muted);background:var(--checker)}
.body{padding:12px 14px 14px;display:grid;gap:8px;min-width:0}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:13px;font-weight:700;border-radius:6px;padding:2px 8px}
.b-like{background:var(--like-bg);color:var(--like);border:1px solid var(--like)}
.b-dislike{background:var(--dislike-bg);color:var(--dislike);border:1px solid var(--dislike)}
.b-ct{background:var(--accent);color:var(--bg)}
.label{font-weight:700;font-size:16px;line-height:1.4;text-wrap:balance}
.src{font-size:13px;color:var(--muted);overflow-wrap:anywhere}.src a,.cmt a{color:inherit}
.cmt{font-size:15px;border-left:3px solid var(--accent);padding-left:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.cmt small{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.quotes{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.quotes li{font-size:14px;border-left:3px solid var(--line);padding-left:8px;overflow-wrap:anywhere}
</style></head><body>

const FILTERS=[["all","전체"],["like","지향"],["dislike","지양"],["ct","최종 연락"]];
let f="all";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const link=s=>esc(s).replace(/https?:\/\/[^\s<·)]+/g,u=>'<a href="'+u+'" target="_blank" rel="noopener">'+u.replace(/^https?:\/\//,"").slice(0,48)+(u.length>56?"…":"")+'</a>');
function chips(){const b=document.getElementById("chips");b.innerHTML="";for(const [k,n] of FILTERS){const e=document.createElement("button");e.className="chip";e.type="button";e.textContent=n;e.setAttribute("aria-pressed",String(f===k));e.onclick=()=>{f=k;chips();grid()};b.appendChild(e)}}
function grid(){const g=document.getElementById("grid");g.innerHTML="";
for(const it of ITEMS){if(f==="like"&&it.choice!=="like")continue;if(f==="dislike"&&it.choice!=="dislike")continue;if(f==="ct"&&!it.ct)continue;
const a=document.createElement("article");a.className="card";a.dataset.c=it.choice;
a.innerHTML=(it.imgs.length?'<div class="shots">'+it.imgs.map(u=>'<img src="'+esc(u)+'" alt="'+esc(it.label)+'" loading="lazy">').join("")+'</div>':'<div class="noimg">그림 없음</div>')+
'<div class="body"><div class="badges"><span class="badge b-'+it.choice+'">'+(it.choice==="like"?"지향":"지양")+'</span>'+(it.ct?'<span class="badge b-ct">'+esc(it.ct)+'</span>':"")+'</div>'+
'<div class="label">'+esc(it.label)+'</div>'+(it.src?'<div class="src">'+link(it.src)+'</div>':"")+
(it.comment?'<div class="cmt"><small>동현 코멘트</small>'+link(it.comment)+'</div>':"")+
(it.quotes.length?'<ul class="quotes">'+it.quotes.map(q=>'<li>'+esc(q)+'</li>').join("")+'</ul>':"")+'</div>';
g.appendChild(a)}}
chips();grid();
</script></body></html>
