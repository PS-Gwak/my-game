<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>마시멜로 말랑이</title>
<style>
  /* 색은 전부 여기 한곳에서 정함 (밝은 화면 기본값) */
  :root {
    --bg: #ece9e2;          /* 화면 바탕 */
    --wall-top: #f1efe9;    /* 뒷벽 위쪽 */
    --wall-bottom: #ddd9d0; /* 뒷벽 아래쪽 */
    --ink: #2b2723;         /* 글자 */
    --sub: #6f685f;         /* 흐린 글자 */
    --panel: #f8f6f1;       /* 손잡이 패널 바탕 */
    --line: #d5cfc4;        /* 테두리 */
    --accent: #e8641a;      /* 강조색 */
    --pressed: #efe2d6;     /* 눌린 버튼 바탕 */
  }
  /* 어두운 화면 */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1d1b19; --wall-top: #34312d; --wall-bottom: #262421;
      --ink: #f0ece5; --sub: #a79f93; --panel: #292623; --line: #3d3934; --accent: #f07a35; --pressed: #3b302a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1d1b19; --wall-top: #34312d; --wall-bottom: #262421;
    --ink: #f0ece5; --sub: #a79f93; --panel: #292623; --line: #3d3934; --accent: #f07a35; --pressed: #3b302a;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; touch-action: manipulation; overscroll-behavior: none; }
  body {
    background-color: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  /* 세로로 쌓기: 위 = 마시멜로 무대, 아래 = 손잡이 패널. 패널이 열리면 무대가 그만큼 줄어서 마시멜로를 가리지 않음 */
  #app {
    height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 10px;
    padding: max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto;
    touch-action: none;   /* 무대와 그 둘레 여백에서는 끌어도 화면이 움직이지 않게 (패널은 아래에서 따로 스크롤 허용) */
  }
  #stage {
    position: relative; flex: 1 1 auto; min-height: 180px; border-radius: 18px; overflow: hidden;
    background: linear-gradient(var(--wall-top), var(--wall-bottom));
    border: 1px solid var(--line);
  }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #stage canvas.held { cursor: grabbing; }
  /* 한 줄 안내: 오른쪽 위 「원위치」 버튼과 겹치지 않게 양옆을 비워 둠 */
  #hint {
    position: absolute; left: 0; right: 0; top: 14px; padding: 0 84px; text-align: center; pointer-events: none;
    font-size: 17px; font-weight: 700; color: var(--sub); transition: opacity .6s; word-break: keep-all;
  }
  #hint.off { opacity: 0; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--sub); font-size: 16px; padding: 24px; text-align: center; }
  #homeBtn {
    position: absolute; top: 10px; right: 10px; font: inherit; font-size: 15px; font-weight: 700; padding: 7px 11px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer;
  }
  #homeBtn:active { background: var(--pressed); }
  /* 「목록」 버튼: 무대 왼쪽 위 구석 (고른 뒤에만 보임) */
  #backBtn {
    position: absolute; top: 10px; left: 10px; font: inherit; font-size: 15px; font-weight: 700; padding: 7px 11px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer;
  }
  #backBtn:active { background: var(--pressed); }
  /* 「다시 하기」 버튼(v2): 스모어를 만질 때만 무대 오른쪽 아래 구석에 보임 — 부서진 크래커를 처음대로 */
  #againBtn {
    position: absolute; bottom: 10px; right: 10px; font: inherit; font-size: 15px; font-weight: 700; padding: 7px 11px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; display: none;
  }
  #againBtn:active { background: var(--pressed); }
  #app.mode-play.kind-smore #againBtn { display: block; }
  /* 목록 화면: 손잡이 패널 · 원위치 · 목록 버튼 · 안내 글을 모두 숨기고 여섯 종만 보여 줌 */
  #app.mode-list #panel, #app.mode-list #homeBtn, #app.mode-list #backBtn, #app.mode-list #hint, #app.mode-list #againBtn { display: none; }
  #app.mode-list #stage canvas { cursor: pointer; }

  #panel { flex: 0 1 auto; max-height: 55%; overflow: auto; overscroll-behavior: contain; touch-action: pan-y;background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  #panel summary {
    list-style: none; cursor: pointer; padding: 12px 14px; font-size: 16px; font-weight: 700;
    display: flex; justify-content: space-between; align-items: center;
  }
  #panel summary::-webkit-details-marker { display: none; }
  #panel summary::after { content: "열기"; font-weight: 600; color: var(--accent); }
  #panel[open] summary::after { content: "접기"; }
  #knobs { padding: 0 14px 14px; display: grid; gap: 10px; }
  .knob { display: grid; grid-template-columns: 1fr auto; row-gap: 2px; align-items: baseline; font-size: 16px; }
  .knob output { color: var(--sub); font-variant-numeric: tabular-nums; }
  .knob input { grid-column: 1 / -1; width: 100%; height: 30px; margin: 0; accent-color: var(--accent); touch-action: pan-x; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .skinRow { display: grid; grid-template-columns: auto 1fr 1fr; gap: 8px; align-items: center; font-size: 16px; }
  /* v3: 「얼굴 가 / 나」 고르기는 무지개를 만질 때만 보임 */
  #faceRow { display: none; }
  #app.kind-rainbow #faceRow { display: grid; }
  #knobs button {
    font: inherit; font-size: 16px; font-weight: 700; padding: 10px; border-radius: 10px;
    border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer;
  }
  #knobs button[aria-pressed="false"] { color: var(--sub); }
  /* 고른 쪽은 눌려 들어간 모양 */
  #knobs button[aria-pressed="true"] {
    color: var(--ink); border-color: var(--accent); background: var(--pressed);
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, .22); transform: translateY(1px);
  }

  /* 넓은 화면(PC): 무대 옆에 손잡이 창을 나란히 세워 늘 보이게. 무대를 가리지 않고 옆자리를 따로 차지함 */
  @media (min-width: 900px) {
    #app { max-width: none; flex-direction: row; justify-content: center; gap: 14px; }
    #stage { flex: 0 1 560px; min-width: 0; }
    #panel { flex: 0 0 300px; max-height: 100%; align-self: flex-start; }
    #panel summary { cursor: default; }
    #panel summary::after, #panel[open] summary::after { content: "D 숨김"; color: var(--sub); }
    #app.side-off #panel { display: none; }
    /* 목록 화면에서는 무대를 넓게 써서 3열 × 2행으로 */
    #app.mode-list #stage { flex: 0 1 1040px; }
  }

  /* FLOW 여기부터 — 수집 흐름(실험 게이지 · 팝업 · 실험 · 실패/성공 · 모음)의 화면 글자와 버튼. 새 디자인 판으로 옮길 때 이 덩어리를 통째로 복사 */
  #hint { top: 52px; }   /* 한 줄 안내는 실험 게이지 아래로 내림 (겹치지 않게) */
  /* 실험 게이지(v2: 하트 → 플라스크 그림 + 민트 막대): 무대 위쪽 가운데. 「모음」 · 「원위치」 버튼 사이. 코드 속 이름은 heart 그대로 */
  /* 넓은 화면에서도 상자가 내용물(그림 28 + 틈 8 + 막대 200)만큼만 차지하게 가운데로 모음 — 두근거릴 때 양옆 버튼 자리까지 부풀지 않게. 폰에서는 예전 그대로 */
  #flowHeart {
    position: absolute; top: 12px; left: 84px; right: 84px; max-width: 236px; margin: 0 auto; height: 30px; display: none;
    align-items: center; justify-content: center; gap: 8px; pointer-events: none;
  }
  #flowHeart svg { width: 28px; height: 28px; flex: none; fill: #5fc4ae; }
  #flowHeart .bar { flex: 1 1 auto; max-width: 200px; height: 14px; border-radius: 7px; background: var(--panel); border: 1px solid var(--line); overflow: hidden; }
  #flowHeartFill { display: block; height: 100%; width: 0; background: #7fd6c2; border-radius: 7px; }
  #app[data-flow="room"] #flowHeart, #app[data-flow="ready"] #flowHeart, #app[data-flow="ask"] #flowHeart { display: flex; }
  #app[data-flow="ready"] #flowHeart { animation: flowBeat .7s ease-in-out infinite; }   /* 가득 차면 두근두근 */
  @keyframes flowBeat { 0%, 100% { transform: scale(1); } 30% { transform: scale(1.12); } 55% { transform: scale(.97); } }
  /* 팝업(v2): 게이지가 처음 가득 찼을 때 딱 한 번. 무대 전체에 어두운 보자기를 덮고 가운데에 물음 카드 한 장 */
  #flowAsk {
    position: absolute; inset: 0; z-index: 5; display: none; align-items: center; justify-content: center;
    padding: 12px; background: rgba(0, 0, 0, .45);
  }
  #app[data-flow="ask"] #flowAsk { display: flex; }
  #flowAsk .card {
    width: 100%; max-width: 340px; max-height: 100%; overflow: hidden; padding: 18px 16px 16px; border-radius: 18px;
    background: var(--panel); border: 1px solid var(--line); color: var(--ink); text-align: center;
    animation: flowAskIn .3s cubic-bezier(.3, 1.4, .5, 1) both;
  }
  @keyframes flowAskIn { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #flowAskText { margin: 0 0 14px; font-size: clamp(20px, 5.6vw, 24px); font-weight: 800; line-height: 1.35; word-break: keep-all; }
  #flowAsk .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #flowAsk button {
    font: inherit; font-size: 22px; font-weight: 800; padding: 11px 8px; border-radius: 14px; white-space: nowrap; cursor: pointer;
    border: 2px solid var(--accent); background: var(--accent); color: #fff;
  }
  #flowAsk #flowAskNo { background: transparent; color: var(--ink); border-color: var(--line); }
  #flowAsk button:active { filter: brightness(.92); }
  /* 큰 버튼 하나를 돌려 씀: 「마시멜로 실험 참여하기」 · 「돌아가기」 · 「만져 보기」. 무대 아래쪽 가운데에서 통 튀어 나옴 */
  #flowMain {
    position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: none;
    font: inherit; font-size: 22px; font-weight: 800; padding: 11px 22px; border-radius: 16px; white-space: nowrap;
    border: 2px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer;
  }
  #flowMain.on { display: block; animation: flowPop .45s cubic-bezier(.3, 1.6, .5, 1) both; }
  @keyframes flowPop { from { transform: translateX(-50%) scale(.3); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
  /* 실험 중 큰 글씨(남은 시간 · 「손을 떼세요」 · 「실험 실패」 · 「실험 성공」)와 그 아래 한 줄 */
  #flowTop { position: absolute; left: 0; right: 0; top: 52px; padding: 0 8px; text-align: center; pointer-events: none; display: none; }
  #app.flow-exp #flowTop { display: block; }
  #flowBig { font-size: clamp(34px, 12vw, 60px); font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; word-break: keep-all; }
  #flowBig.long { font-size: clamp(26px, 8.4vw, 44px); }
  /* 아래 한 줄은 글이 없을 때도 한 줄 높이를 차지함 → 위쪽 글 상자의 아래 끝이 늘 같아, 키 큰 종을 내려 잡는 자리가 흔들리지 않음 */
  #flowSub { font-size: clamp(20px, 6vw, 26px); font-weight: 700; color: var(--sub); margin-top: 4px; word-break: keep-all; line-height: 1.25; min-height: 1.25em; }
  /* 실험 중 작은 버튼 둘: 왼쪽 위 「그만두기」 · 오른쪽 위 빨리 감기 「×1」 */
  #flowQuit, #flowSpeed {
    position: absolute; top: 10px; font: inherit; font-size: 15px; font-weight: 700; padding: 7px 11px; display: none;
    border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer;
  }
  #flowQuit { left: 10px; }
  #flowSpeed { right: 10px; min-width: 52px; }
  #flowQuit:active, #flowSpeed:active { background: var(--pressed); }
  #app[data-flow="hold"] #flowQuit, #app[data-flow="wait"] #flowQuit, #app[data-flow="wait"] #flowSpeed { display: block; }
  /* 실험 중에는 말랑이 방의 버튼 · 손잡이 창 · 안내 글을 숨김.
     손잡이 창은 「치우지」 않고 「투명 보자기를 덮어」 자리를 남김 → 무대 크기가 그대로라 마시멜로가 자리를 다시 잡지 않음. 덮인 동안은 눌리지도 않음 */
  #app.flow-exp #panel { visibility: hidden; pointer-events: none; }
  #app.flow-exp #homeBtn, #app.flow-exp #backBtn, #app.flow-exp.mode-play #againBtn, #app.flow-exp #hint { display: none; }
  /* 큰 버튼이 떠 있을 때 스모어의 「다시 하기」는 오른쪽 위(「원위치」 아래)로 비켜 줌 */
  #app[data-flow="ready"].kind-smore #againBtn { top: 52px; bottom: auto; }
  /* 모음 화면: 다 모았을 때 맨 위 큰 글씨 · 다음 마시멜로 칸의 기다릴 시간 */
  #flowDone { position: absolute; left: 0; right: 0; top: 0; height: 64px; display: none; align-items: center; justify-content: center; font-size: 30px; font-weight: 800; pointer-events: none; }
  #app[data-flow="album"][data-flow-done="1"] #flowDone { display: flex; }
  #flowNext { position: absolute; height: 46px; display: none; align-items: center; justify-content: center; font-size: 30px; font-weight: 800; pointer-events: none; }
  #app[data-flow="album"] #flowNext.on { display: flex; }
  /* 낮고 넓은 화면(폰 가로): 큰 글씨를 버튼 줄 사이로 올려 마시멜로와 안 겹치게 */
  @media (orientation: landscape) and (max-height: 520px) {
    #hint { top: 46px; }
    #flowTop { top: 6px; padding: 0 110px; }
    #flowBig { font-size: 36px; }
    #flowBig.long { font-size: 28px; }
    #flowSub { font-size: 20px; margin-top: 2px; }
    #flowAsk .card { max-width: 520px; padding: 12px 16px; }   /* 팝업: 옆으로 넓혀 줄 수를 줄임 (낮은 화면 안에 다 들어오게) */
    #flowAskText { font-size: 20px; margin-bottom: 10px; }
    #flowAsk button { font-size: 20px; padding: 8px; }
  }
  /* FLOW 여기까지 */
</style>
</head>
<body>
<div id="app" class="mode-list">
  <div id="stage">
    <div id="loading">불러오는 중…</div>
    <div id="hint">누르고 · 끌고 · 빈 곳을 끌어 돌려 보세요</div>
    <button id="backBtn" type="button">모음</button><!-- FLOW 연결: 글자 「목록」 → 「모음」 -->
    <button id="homeBtn" type="button">원위치</button>
    <button id="againBtn" type="button">다시 하기</button>
    <!-- FLOW 여기부터 — 수집 흐름의 화면 요소 (무대 안에 얹음). class="flow-ui" 버튼은 누르기 판정에서 뺌 -->
    <div id="flowHeart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 2h7v2h-1.2v5.3l5.3 9.1A1.75 1.75 0 0 1 18.1 21H5.9a1.75 1.75 0 0 1-1.5-2.6l5.3-9.1V4H8.5z"/></svg><div class="bar"><i id="flowHeartFill"></i></div></div><!-- v2: 하트 → 플라스크(삼각 실험병) -->
    <div id="flowAsk" class="flow-ui" role="dialog" aria-modal="true"><div class="card"><p id="flowAskText">마시멜로 실험에 참여하시면 추가 마시멜로를 얻을 수 있습니다. 참여하시겠습니까?</p><div class="row"><button id="flowAskYes" type="button">예</button><button id="flowAskNo" type="button">아니오</button></div></div></div>
    <div id="flowTop"><div id="flowBig"></div><div id="flowSub"></div></div>
    <button id="flowQuit" class="flow-ui" type="button">그만두기</button>
    <button id="flowSpeed" class="flow-ui" type="button">×1</button>
    <button id="flowMain" class="flow-ui" type="button"></button>
    <div id="flowDone">다 모았습니다</div>
    <div id="flowNext"></div>
    <!-- FLOW 여기까지 -->
  </div>
  <details id="panel">
    <summary>느낌 손잡이</summary>
    <div id="knobs">
      <div class="pair">
        <button id="presetB" type="button" aria-pressed="false">B 스퀴시</button>
        <button id="presetC" type="button" aria-pressed="true">C 섞음</button></div>
      <label class="knob"><span>차오르는 빠르기</span><output id="oRise"></output>
        <input id="kRise" type="range" min="-100" max="100" step="1"></label>
      <label class="knob"><span>눌리는 깊이</span><output id="oDepth"></output>
        <input id="kDepth" type="range" min="0" max="200" step="1"></label>
      <label class="knob"><span>몸 전체 말랑함</span><output id="oSoft"></output>
        <input id="kSoft" type="range" min="0" max="200" step="1"></label>
      <label class="knob"><span>놓을 때 출렁임</span><output id="oBounce"></output>
        <input id="kBounce" type="range" min="0" max="200" step="1"></label>
      <label class="knob"><span>늘어나는 정도</span><output id="oStretch"></output>
        <input id="kStretch" type="range" min="0" max="200" step="1"></label>
      <label class="knob"><span>크기</span><output id="oSize"></output>
        <input id="kSize" type="range" min="100" max="200" step="1"></label>
      <div class="skinRow"><span>겉면</span>
        <button id="skinPlain" type="button" aria-pressed="true">기존</button>
        <button id="skinPowder" type="button" aria-pressed="false">가루</button></div>
      <div class="skinRow" id="faceRow"><span>얼굴</span>
        <button id="faceGa" type="button" aria-pressed="false">가</button>
        <button id="faceNa" type="button" aria-pressed="true">나</button></div>
      <button id="resetBtn" type="button">처음 값으로</button>
      <!-- FLOW 여기부터 — 시안용 도구: 저장을 지우고 생 하나로 -->
      <button id="flowResetBtn" type="button">처음부터</button>
      <!-- FLOW 여기까지 -->
    </div>
  </details>
</div>

<script>
  // three.js를 못 받으면(인터넷 끊김 등) 「불러오는 중…」만 남지 않게 15초 뒤 안내
  setTimeout(function () { var el = document.getElementById('loading'); if (el) el.textContent = '3D 도구를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로 고침해 주세요.'; }, 15000);
</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

function applyKnobs() {
  for (const [key] of KNOB_IDS) knob[key] = clamp(Number(knob[key]) || 0, RANGE[key][0], RANGE[key][1]);
  // 놓은 뒤 다 차오르는 시간(초): −100 → 7초, 0 → 2.5초, 40 → 약 1.2초, 100 → 0.4초
  P.riseT = knob.rise >= 0 ? 2.5*Math.pow(.4/2.5, knob.rise/100) : 2.5*Math.pow(7/2.5, -knob.rise/100);
  P.depth = .05 + .13*knob.depth/100;              // 자국 깊이(몸 높이 1 기준): 0 → 0.05, 100 → 0.18, 200 → 0.31
  P.soft = .16*knob.soft/100;                      // 누를 때 몸 전체가 같이 눌리는 비율: 100 → 16%, 200 → 32%
  P.bounce = knob.bounce/100;                      // 놓은 뒤 출렁이는 세기: 0 = 없음, 200 = 100의 두 배
  P.scale = knob.size/100;                         // 크기 배수: 100 = v2 크기
  P.overD = clamp((knob.depth - 100)/100, 0, 1);   // 깊이가 100을 얼마나 넘었나 0~1
  // 잡힌 곳이 따라오는 한계(몸 높이 1 기준): 100 → 0.5, 200 → 1.0. 깊이가 100을 넘으면 겉면이 접히지 않게 40%까지 줄임
  P.stretch = .5*knob.stretch/100*(1 - .4*P.overD);

// v3: 종마다 손잡이 기본값을 따로 둘 수 있음 (지금은 꼬치구이의 「늘어나는 정도」 100뿐 — 불에 타고 있어 더 잘 늘어남)

function setPreset(name) {
  if (!PRESETS[name]) return;
  Object.assign(knob, PRESETS[name], kindKnobs || {}); preset = lastPreset = name; applyKnobs();
}

/* ───────── 손잡이 창 자리: 넓은 화면 = 무대 옆에 늘 떠 있음(D키로 숨김 · 다시 보임) / 좁은 화면 = 아래 열기 · 접기 ───────── */

// 키보드: D = 옆 손잡이 창 숨김 · 다시 보임, R = 원위치, Esc = 목록으로 (한글 자판 상태에서도 같은 자리 키로 동작)
window.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  if (e.code === 'KeyD') { if (wideMQ.matches) { sideHidden = !sideHidden; applyLayout(); } }
  else if (e.code === 'KeyR') { if (sceneReady && mode === 'play' && !trans) goHome(); }
  else if (e.code === 'Escape') { if (sceneReady) back(); }
});

/* ───────── 마시멜로 몸 (A2와 같은 치수: 반지름 .55 · 높이 1 · 모서리 둥글기 .22 · 색 fffaf2) ───────── */
const BODY = {r: .55, h: 1.00, c: .22, faceC: .50, faceH: .46, color: 0xfffaf2, breath: [1.4, .035]};

// 둥근 모서리 원기둥 단면. 눌린 자국이 매끈하게 생기도록 옆면 · 윗면 · 밑면에 점을 고르게 촘촘히 넣음
function bodyProfile(d) {
  const R = d.r, C = d.c, H = d.h, pts = [];
  pts.push([0, 0]);
  for (let i = 1; i <= 4; i++) pts.push([(R - C)*i/5, 0]);
  for (let i = 0; i <= 8; i++) { const a = -Math.PI/2 + i/8*Math.PI/2; pts.push([R - C + C*Math.cos(a), C + C*Math.sin(a)]); }
  for (let i = 1; i <= 9; i++) pts.push([R, C + (H - 2*C)*i/10]);
  for (let i = 0; i <= 8; i++) { const a = i/8*Math.PI/2; pts.push([R - C + C*Math.cos(a), H - C + C*Math.sin(a)]); }
  for (let i = 1; i <= 4; i++) pts.push([(R - C)*(1 - i/5), H]);
  pts.push([0, H]);
  return pts.map(p => new THREE.Vector2(p[0], p[1]));
}
const SEG = 64;                                   // 둘레를 몇 조각으로 나눌지
const prof = bodyProfile(BODY);
const PN = prof.length;                           // 단면 점 수 (맨 아래 · 맨 위 꼭짓점 포함)
const CY = BODY.h/2;                              // 몸 한가운데 높이

// 이 겉면은 스스로 계산하지 않고, 아래 "붙인 겉면"의 자리와 바깥 방향을 매 프레임 그대로 받아 씀
const geoF = new THREE.LatheGeometry(prof, SEG, Math.PI, Math.PI*2);
const fPosAttr = geoF.attributes.position, fPos = fPosAttr.array;
const fNrmAttr = geoF.attributes.normal, fNrm = fNrmAttr.array;
fPosAttr.setUsage(THREE.DynamicDrawUsage); fNrmAttr.setUsage(THREE.DynamicDrawUsage);
const NF = fPosAttr.count;
// 그림 좌표: 가로 = 둘레 한 바퀴, 세로 = 높이. 얼굴 그림을 몸에 바로 붙이기 위함
{ const uv = geoF.attributes.uv;
  for (let i = 0; i < NF; i++) uv.setY(i, fPos[i*3 + 1]/BODY.h);
  uv.needsUpdate = true; }

// 붙인 겉면: 둘레 64줄 × 단면 점(꼭짓점 제외) + 아래 꼭짓점 1개 + 위 꼭짓점 1개.
// 같은 자리에 겹친 점이 하나도 없어서, 아무리 눌러도 이음매 · 꼭짓점이 벌어질 수 없음
const RINGS = PN - 2;
const NW = RINGS*SEG + 2;                         // 계산하는 점 개수
const POLE_B = RINGS*SEG, POLE_T = RINGS*SEG + 1; // 아래 · 위 꼭짓점 번호
const wIdx = (i, j) => (j - 1)*SEG + (i % SEG);   // 둘레 i번째 줄 · 단면 j번째 점의 번호
const f2w = new Uint16Array(NF);                  // 점 대응표: 얼굴 겉면의 점 → 붙인 겉면의 점
for (let i = 0; i <= SEG; i++) for (let j = 0; j < PN; j++)
  f2w[i*PN + j] = j === 0 ? POLE_B : j === PN - 1 ? POLE_T : wIdx(i, j);
const rest = new Float32Array(NW*3);              // 원래 모양
for (let v = 0; v < NF; v++) { const w = f2w[v]*3, a = v*3; rest[w] = fPos[a]; rest[w+1] = fPos[a+1]; rest[w+2] = fPos[a+2]; }
rest[POLE_B*3] = 0; rest[POLE_B*3 + 2] = 0; rest[POLE_T*3] = 0; rest[POLE_T*3 + 2] = 0;

// 얼굴 겉면은 몸의 자리 · 바깥 방향을 그대로 받아 쓰므로, 몸이 눌리면 얼굴도 똑같이 눌림
const faceMesh = new THREE.Mesh(geoF, makeFaceMat(faceTex, bodyMat.userData.kind));
faceMesh.frustumCulled = false;
// 그림 좌표 두 벌: 서 있는 종(기본) · 누운 종(무지개). 고른 종에 맞춰 바꿔 끼움
const uvStd = Float32Array.from(geoF.attributes.uv.array);
// 무지개 몸은 원래 몸을 옆으로 눕혀 길게 늘인 모양 → 얼굴 그림의 가로 = 몸 길이 방향, 세로 = 몸 둘레 방향
const RB = {AX: 1.6, AR: .636, px: 600, h0: -.1, v0: .02};   // 길이 배율 · 굵기 배율 · 얼굴 그림 1칸당 픽셀 · 얼굴 한가운데(가로 · 세로, 보이는 크기 기준)
const uvSide = new Float32Array(uvStd.length);
for (let i = 0; i <= SEG; i++) for (let j = 0; j < PN; j++) {
  const v = i*PN + j, al = (i/SEG - .5)*Math.PI*2, rho = prof[j].x, y = prof[j].y;
  const h = RB.AX*(y - CY), vv = -RB.AR*rho*al;   // 보이는 가로 자리(오른쪽 +) · 세로 자리(위 +)
  uvSide[v*2] = (FW/2 + (h - RB.h0)*RB.px)/FW;
  uvSide[v*2 + 1] = 1 - (FH/2 - (vv - RB.v0)*RB.px)/FH;
}
// 목록 화면용 얼굴 겉면 (원래 모양 그대로). 무지개는 누운 그림 좌표를 쓰는 것을 따로
const listFaceGeo = geoF.clone();
const listFaceGeoSide = geoF.clone();
listFaceGeoSide.attributes.uv.array.set(uvSide); listFaceGeoSide.attributes.uv.needsUpdate = true;
function syncFace() {   // 붙인 겉면의 자리와 바깥 방향을 얼굴 겉면에 옮겨 적음
  for (let v = 0; v < NF; v++) {
    const a = v*3, w = f2w[v]*3;
    fPos[a] = pos[w]; fPos[a+1] = pos[w+1]; fPos[a+2] = pos[w+2];
    fNrm[a] = nrm[w]; fNrm[a+1] = nrm[w+1]; fNrm[a+2] = nrm[w+2];
  }
  fPosAttr.needsUpdate = true; fNrmAttr.needsUpdate = true;
}

// 표정 세기 (가장 진할 때도 은은하게)
const BLUSH_ALPHA = .36;     // 홍조 한가운데 진하기
const SMILE_LIFT = 3;        // 입꼬리가 올라가는 양(그림판 px, 입 폭 48px 기준)
const SMILE_DIP = 9;         // 입 가운데가 내려가는 양(px)

// s = {lx, ly: 눈길, blink: 깜빡임, blush: 홍조 0~1, smile: 미소 0~1, t: 시간(초)}
// ctx = 그릴 그림판 (목록 화면의 작은 그림판도 같은 크기로 보이게 미리 줄여 둠)
// 생(기본) 얼굴 = v4 얼굴 그대로
// v3: girl = 무지개 「얼굴 가」 — 같은 얼굴에서 여자아이 느낌만 살짝(눈이 조금 크고 또렷 · 눈꼬리 속눈썹 한 가닥 · 순한 눈썹 · 살짝 웃는 입). 생은 girl 없이 그대로
function drawFaceA2(s, ctx = faceCtx, girl = false) {
  const W = FW, H = FH, cx = W/2;

      ctx.save(); ctx.translate(cx + sd*152, 204); ctx.scale(1.3, 1);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 44);
      g.addColorStop(0, `rgba(238,120,118,${BLUSH_ALPHA*s.blush})`);
      g.addColorStop(.55, `rgba(238,120,118,${BLUSH_ALPHA*.55*s.blush})`);
      g.addColorStop(1, 'rgba(238,120,118,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 44, 0, 7); ctx.fill();
      ctx.restore();
    }

    const ex = cx + sd*108, ey = 122, rx = girl ? 54 : 50, ry = girl ? 33 : 30, peak = ry*open*1.25;
    const path = () => { ctx.beginPath(); ctx.moveTo(ex-rx, ey); ctx.quadraticCurveTo(ex, ey-2*peak, ex+rx, ey); ctx.quadraticCurveTo(ex, ey+ry*1.1, ex-rx, ey); ctx.closePath(); };

      ctx.strokeStyle = '#4a3d30'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = '#0c0a09'; ctx.beginPath(); ctx.arc(ix, iy, 8, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(ix-7, iy-8, 3.5, 0, 7); ctx.fill();
      const sh = ctx.createLinearGradient(0, ey-peak, 0, ey-peak+22);

      ctx.fillStyle = sh; ctx.fillRect(ex-rx, ey-peak, rx*2, 24);

    }

    ctx.strokeStyle = '#573d33'; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(ex-rx, ey); ctx.quadraticCurveTo(ex, ey-2*peak, ex+rx, ey); ctx.stroke();
    if (girl) {
      // 눈꼬리 속눈썹 한 가닥 + 순하게 거의 수평인 가는 눈썹
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(ex + sd*(rx - 3), ey - 2); ctx.quadraticCurveTo(ex + sd*(rx + 9), ey - 4, ex + sd*(rx + 15), ey - 14); ctx.stroke();
      ctx.strokeStyle = 'rgba(108,76,56,.7)'; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.moveTo(ex + sd*44, 53); ctx.lineTo(ex - sd*34, 49); ctx.stroke();

    // 눈썹: 축 처진 평소 모양 그대로
    ctx.strokeStyle = 'rgba(108,76,56,.78)'; ctx.lineWidth = 9;

  const my = 258, mw = girl ? 20 : 24, sm = girl ? .45 + .55*s.smile : s.smile;   // 「얼굴 가」는 가만히 있어도 살짝 웃는 입
  const endY = my + 3 - SMILE_LIFT*sm, midY = my - 1 + SMILE_DIP*sm;

}

/* ───────── 나머지 다섯 종의 얼굴: 단순한 선과 점 (그림판 테두리에는 아무것도 닿지 않게 — 띠 밖이 투명해야 함) ───────── */
const INK = '#3a2a24';   // 얼굴 선 · 점 색 (짙은 밤색)

const TOUCH_AT = .35;        // 홍조가 이만큼 올라오면 「만질 때 얼굴」로 바뀜 (누르고 약 0.2초 뒤). 놓으면 홍조가 가라앉으며 다시 「가만히 얼굴」
const SMORE_BLUSH = .28;     // 스모어만: 처음부터 깔려 있는 아주 옅은 홍조 (만지면 여기서 1까지 번짐)
// 점 눈 (반짝이 한 점). 깜빡이면 가로선
function dotEye(ctx, ex, ey, r, s, ox = 0, oy = 0) {
  ctx.lineCap = 'round';

}
// 땀방울 (11/4 생김새 시안 C줄과 같은 모양 · 색)
function tearDrop(ctx, x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y - 2.2*s);
  ctx.quadraticCurveTo(x + 1.1*s, y - .2*s, x + .9*s, y + .5*s);
  ctx.arc(x, y + .5*s, .9*s, 0, Math.PI, false);
  ctx.quadraticCurveTo(x - 1.1*s, y - .2*s, x, y - 2.2*s); ctx.closePath();

// 벌린 입 (안쪽 짙은 색 + 분홍 혀)
function openMouth(ctx, pathFn, tongueY, tongueRx, tongueRy) {

// 꼬치구이: 머리에 불이 붙어 걱정스러운 얼굴 + 땀방울 (눈두덩 선 · 주름처럼 보이는 선은 없음)

// 초코파이(v2): 몸이 초콜릿색이라 얼굴 선을 밝은 크림색으로. 「누가 먹었어」 억울한 눈 — 흰자 있는 큰 눈이 베어 먹힌 쪽(오른쪽)을 흘끔 · 八자 눈썹 · 삐죽 입

// 무지개(v3): 누운 몸 앞면에 가로로 놓인 얼굴. 속눈썹 달린 반짝 눈(「너무 인위적」)을 버리고 두 가지를 바꿔 볼 수 있게 (나비 리본은 3D 장식)

// 손가락이 꼬챙이를 잡은 곳에서 화면으로 (dx, dy)px 움직였을 때 꼬챙이가 가야 할 자리

function stepKindMotion(dt, held) {

    // 꼬챙이를 휜 모양으로 그리고, 그 끝에 마시멜로(+ 불)를 끝이 기운 방향 그대로 이어 붙임 → 한 몸으로 휨

/* ───────── 스모어 크래커 부서짐 (v2) ───────── */

{ const c = new THREE.Color();

}

hideCrumbs();

  else if (ph === 'wait') { big = flowClock(remain); sub = '건드리지 마세요'; }
  else if (ph === 'fail') { if (shown) { big = '실험 실패'; main = '돌아가기'; } }
  else if (ph === 'arrive') { big = '실험 성공'; if (shown) { sub = FLOW.names[e.next] || ''; main = '만져 보기'; } }   // 글은 마시멜로가 바뀌는 것과 함께, 이름 · 버튼은 바뀐 뒤
  else if (ph === 'ready') main = '마시멜로 실험 참여하기';
  $('flowBig').textContent = big; $('flowBig').classList.remove('long');
  $('flowSub').textContent = sub;
  if (e && ph !== 'album') flowMeasureTop();   // 위쪽 글이 바뀌었으니 그 아래 끝을 다시 잼 (키 큰 종을 내려 잡는 데 씀)
  const mb = $('flowMain');
  if (main !== flow.mainKey) {       // 버튼 글자가 바뀔 때마다 통 튀어 나오는 움직임을 다시
    flow.mainKey = main; mb.classList.remove('on'); mb.textContent = main;
    flow.mainAt = performance.now();   // 글자가 바뀐 때를 적어 둠 → 그 직후의 누름은 받지 않음 (flowMainTap)
    if (main) { void mb.offsetWidth; mb.classList.add('on'); }
  }
  $('flowSpeed').textContent = '×' + flow.speed;
  // 모음 화면: 다음에 얻을 마시멜로 칸 아래에 기다릴 시간
  const nl = $('flowNext');
  if (ph === 'album' && next) {
    const c = cells[KIND_BY_ID[next].i];
    nl.textContent = Math.round(FLOW.wait[next]/60) + '분';
    nl.style.left = Math.round(c.x) + 'px'; nl.style.width = Math.round(c.w) + 'px';
    nl.style.top = Math.round(c.y + c.h - FLOW.labelH) + 'px';
    nl.classList.add('on');
  } else nl.classList.remove('on');
}

/* ── 버튼 ── */
$('flowMain').addEventListener('click', flowMainTap);
$('flowMain').addEventListener('pointerdown', () => { flow.mainDownAt = performance.now(); });   // 손가락이 닿은 때를 적어 둠
$('flowAskYes').addEventListener('click', () => flowAskTap(true));
$('flowAskNo').addEventListener('click', () => flowAskTap(false));
$('flowAsk').addEventListener('pointerdown', () => { flow.askDownAt = performance.now(); });
$('flowQuit').addEventListener('click', () => { flowQuit(); flowSync(); });
$('flowSpeed').addEventListener('click', () => {   // ×1 → ×10 → ×60 → ×1 (기다리는 시간만 빨리 감음)
  flowSetSpeed(FLOW.speeds[(FLOW.speeds.indexOf(flow.speed) + 1) % FLOW.speeds.length]); flowSync();
});
$('flowResetBtn').addEventListener('click', flowReset);
document.addEventListener('visibilitychange', () => { flow.lastNow = performance.now(); if (document.hidden) flow.fingers.clear(); if (document.hidden && flow.dirty) flowSave(); });
window.addEventListener('pagehide', () => { if (flow.dirty) flowSave(); });

/* ── 검사용 손잡이 (기존 __SQ_TEST__에 더함) ── */
Object.assign(window.__SQ_TEST__, {
  flow() { flowSync(); return flowInfo(); },                                       // 가진 종 · 하트 · 단계 · 남은 초 · 빠르기 · 다음 종
  flowAddHeart(x = 1) { flow.heart = clamp(flow.heart + (Number(x) || 0), 0, 1); flowAskCheck(); flowSave(); flowSync(); return flowInfo(); },   // 처음 가득 차면 팝업도 뜸
  flowAsk(ans) { flowAskCheck(); flowAskAnswer(ans !== 'no' && ans !== false); return flowInfo(); },   // v2: 팝업에 답함('yes' · 'no'). 0.45초 잠금을 거치지 않음 (떠 있지 않으면 아무 일 없음)
  flowBlocked() { return flow.mainBlocked || 0; },                                 // 큰 버튼의 0.45초 잠금이 진짜 누름을 막은 횟수 (시작부터 센 값)
  flowAskAt() { return flow.ask ? performance.now() - flow.ask.at : -1; },        // v2: 팝업이 뜬 지 몇 ms 지났나 (안 떠 있으면 -1)
  flowTick(sec = 1) {                                                              // 기다리는 시간을 바로 흘림 (빨리 감기와 상관없이 그 초만큼)
    const e = flow.exp;
    if (e && (e.phase === 'hold' || e.phase === 'wait')) {
      if (e.phase === 'hold') { e.phase = 'wait'; e.t = 0; }
      e.remain -= Math.max(0, Number(sec) || 0);
      if (e.remain <= 0) flowArrive();
    }
    flowSync(); return flowInfo();
  },
  flowReset() { flowReset(); return flowInfo(); },                                 // 「처음부터」와 같은 일
  flowMain() { flowMainPress(); return flowInfo(); },                              // 큰 버튼을 누른 것과 같은 일 (단계마다: 시작 · 돌아가기 · 만져 보기)
  flowQuit() { flowQuit(); flowSync(); return flowInfo(); },                       // 「그만두기」
  flowSpeed(n) { if (n !== undefined) flowSetSpeed(Number(n)); flowSync(); return flow.speed; },   // 빠르기 정하기(1 · 10 · 60) / 읽기
  flowShown(sec = 1) {                                                             // 실패 · 성공 알림의 뜸 들이는 시간을 건너뜀 (성공이면 새 마시멜로로도 바로 바꿈)
    const e = flow.exp;
    if (e) { e.t += Math.max(0, Number(sec) || 0); if (e.phase === 'arrive' && e.t >= FLOW.swapAt) flowSwap(e); }
    flowSync(); return flowInfo();
  },
  flowOverlay() { return typeof flowHook.overlay === 'function'; },                // v2: 기다리는 화면에 덧그리는 것(다음 마시멜로 실루엣)이 있나 — 없어야 함(false)
  // ── 11/11 검수 반영 ──
  flowView() { return {k: flow.k, x: flow.x, pop: flow.pop, y: flow.y}; },         // 흐름이 정한 마시멜로 크기 배수 · 옆으로 비킨 거리(v2: 늘 0) · 성공 때 줄었다 커지는 배수(평소 1) · 내려 선 거리(낮은 종은 0)
  // 꼬치구이 불의 맨 위(가운데 가장 높은 불길 끝 — 일렁임이 가장 클 때 기준)가 지금 화면 어디인가(캔버스 px). 흐름의 자리 계산과 따로, 불 모형의 실제 자리에서 잼. 다른 종이면 null
  flowFireTop() {
    if (mode !== 'play' || curKind.id !== 'skewer' || !playDeco || !playDeco.flame) return null;
    scene.updateMatrixWorld(true);
    const p = projectPx(playDeco.flame.group.localToWorld(tmpV.set(0, -.01 + .30*(.65 + .65*sk.fire)*1.23, 0)));
    return {y: p.y, textBottom: flow.textBottom};
  },
  flowHitAt(x, y) { return mode === 'play' && !trans ? flowHitAt(x, y) : 0; },     // 그 자리(캔버스 px)에 무엇이 있나: 0 빈 곳 · 1 다른 장식(컵 등) · 2 마시멜로 · 꼬챙이 (보기만 함)
  flowFingers() { return {count: flow.fingers.size, on: flowFingerOn()}; },        // 손가락 장부: 닿아 있는 손가락 수 · 마시멜로 위에 남은 손가락이 있나
});

/* ── 시작: 저장을 읽고 곧바로 말랑이 방으로 ── */
flowLoad();
try { if (new URLSearchParams(location.search).get('fast') === '1') { flow.fast = true; flow.speed = 60; } } catch (e) { /* 주소를 못 읽어도 그대로 */ }
flowColors();
selectKind(flow.owned.includes(flow.kind) ? flow.kind : 'raw', false);
flowSync(true);
// === FLOW 여기까지 ===
</script>
</body>
</html>
