<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>마시멜로 말랑이</title>
<style>
  /* 색은 전부 여기 한곳에서 정함 (밝은 화면 기본값) */
  :root {
    --bg: #ece9e2;          /* 화면 바탕 */
    --wall-top: #f1efe9;    /* 뒷벽 위쪽 */
    --wall-bottom: #ddd9d0; /* 뒷벽 아래쪽 */
    --ink: #2b2723;         /* 글자 */
    --sub: #6f685f;         /* 흐린 글자 */
    --panel: #f8f6f1;       /* 손잡이 패널 바탕 */
    --line: #d5cfc4;        /* 테두리 */
    --accent: #e8641a;      /* 강조색 */
    --pressed: #efe2d6;     /* 눌린 버튼 바탕 */
  }
  /* 어두운 화면 */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1d1b19; --wall-top: #34312d; --wall-bottom: #262421;
      --ink: #f0ece5; --sub: #a79f93; --panel: #292623; --line: #3d3934; --accent: #f07a35; --pressed: #3b302a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1d1b19; --wall-top: #34312d; --wall-bottom: #262421;
    --ink: #f0ece5; --sub: #a79f93; --panel: #292623; --line: #3d3934; --accent: #f07a35; --pressed: #3b302a;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; touch-action: manipulation; overscroll-behavior: none; }
  body {
    background-color: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  /* 세로로 쌓기: 위 = 마시멜로 무대, 아래 = 손잡이 패널. 패널이 열리면 무대가 그만큼 줄어서 마시멜로를 가리지 않음 */
  #app {
    height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 10px;
    padding: max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto;
    touch-action: none;   /* 무대와 그 둘레 여백에서는 끌어도 화면이 움직이지 않게 (패널은 아래에서 따로 스크롤 허용) */
  }
  #stage {
    position: relative; flex: 1 1 auto; min-height: 180px; border-radius: 18px; overflow: hidden;
    background: linear-gradient(var(--wall-top), var(--wall-bottom));
    border: 1px solid var(--line);
  }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #stage canvas.held { cursor: grabbing; }
  /* 한 줄 안내: 오른쪽 위 「원위치」 버튼과 겹치지 않게 양옆을 비워 둠 */
  #hint {
    position: absolute; left: 0; right: 0; top: 14px; padding: 0 84px; text-align: center; pointer-events: none;
    font-size: 17px; font-weight: 700; color: var(--sub); transition: opacity .6s; word-break: keep-all;
  }
  #hint.off { opacity: 0; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--sub); font-size: 16px; padding: 24px; text-align: center; }
  #homeBtn {
    position: absolute; top: 10px; right: 10px; font: inherit; font-size: 15px; font-weight: 700; padding: 7px 11px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer;
  }
  #homeBtn:active { background: var(--pressed); }
  /* 「목록」 버튼: 무대 왼쪽 위 구석 (고른 뒤에만 보임) */
  #backBtn {
    position: absolute; top: 10px; left: 10px; font: inherit; font-size: 15px; font-weight: 700; padding: 7px 11px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer;
  }
  #backBtn:active { background: var(--pressed); }
  /* 「다시 하기」 버튼(v2): 스모어를 만질 때만 무대 오른쪽 아래 구석에 보임 — 부서진 크래커를 처음대로 */
  #againBtn {
    position: absolute; bottom: 10px; right: 10px; font: inherit; font-size: 15px; font-weight: 700; padding: 7px 11px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; display: none;
  }
  #againBtn:active { background: var(--pressed); }
  #app.mode-play.kind-smore #againBtn { display: block; }
  /* 목록 화면: 손잡이 패널 · 원위치 · 목록 버튼 · 안내 글을 모두 숨기고 여섯 종만 보여 줌 */
  #app.mode-list #panel, #app.mode-list #homeBtn, #app.mode-list #backBtn, #app.mode-list #hint, #app.mode-list #againBtn { display: none; }
  #app.mode-list #stage canvas { cursor: pointer; }

  #panel { flex: 0 1 auto; max-height: 55%; overflow: auto; overscroll-behavior: contain; touch-action: pan-y;background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  #panel summary {
    list-style: none; cursor: pointer; padding: 12px 14px; font-size: 16px; font-weight: 700;
    display: flex; justify-content: space-between; align-items: center;
  }
  #panel summary::-webkit-details-marker { display: none; }
  #panel summary::after { content: "열기"; font-weight: 600; color: var(--accent); }
  #panel[open] summary::after { content: "접기"; }
  #knobs { padding: 0 14px 14px; display: grid; gap: 10px; }
  .knob { display: grid; grid-template-columns: 1fr auto; row-gap: 2px; align-items: baseline; font-size: 16px; }
  .knob output { color: var(--sub); font-variant-numeric: tabular-nums; }
  .knob input { grid-column: 1 / -1; width: 100%; height: 30px; margin: 0; accent-color: var(--accent); touch-action: pan-x; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .skinRow { display: grid; grid-template-columns: auto 1fr 1fr; gap: 8px; align-items: center; font-size: 16px; }
  /* v3: 「얼굴 가 / 나」 고르기는 무지개를 만질 때만 보임 */
  #faceRow { display: none; }
  #app.kind-rainbow #faceRow { display: grid; }
  /* 불 v4: 「불 새 / 예전」 고르기는 꼬치구이를 만질 때만 보임 */
  #fireRow { display: none; }
  #app.kind-skewer #fireRow { display: grid; }
  #knobs button {
    font: inherit; font-size: 16px; font-weight: 700; padding: 10px; border-radius: 10px;
    border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer;
  }
  #knobs button[aria-pressed="false"] { color: var(--sub); }
  /* 고른 쪽은 눌려 들어간 모양 */
  #knobs button[aria-pressed="true"] {
    color: var(--ink); border-color: var(--accent); background: var(--pressed);
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, .22); transform: translateY(1px);
  }

  /* 넓은 화면(PC): 무대 옆에 손잡이 창을 나란히 세워 늘 보이게. 무대를 가리지 않고 옆자리를 따로 차지함 */
  @media (min-width: 900px) {
    #app { max-width: none; flex-direction: row; justify-content: center; gap: 14px; }
    #stage { flex: 0 1 560px; min-width: 0; }
    #panel { flex: 0 0 300px; max-height: 100%; align-self: flex-start; }
    #panel summary { cursor: default; }
    #panel summary::after, #panel[open] summary::after { content: "D 숨김"; color: var(--sub); }
    #app.side-off #panel { display: none; }
    /* 목록 화면에서는 무대를 넓게 써서 3열 × 2행으로 */
    #app.mode-list #stage { flex: 0 1 1040px; }
  }
</style>
</head>
<body>
<div id="app" class="mode-list">
  <div id="stage">
    <div id="loading">불러오는 중…</div>
    <div id="hint">누르고 · 끌고 · 빈 곳을 끌어 돌려 보세요</div>
    <button id="backBtn" type="button">목록</button>
    <button id="homeBtn" type="button">원위치</button>
    <button id="againBtn" type="button">다시 하기</button>
  </div>
  <details id="panel">
    <summary>느낌 손잡이</summary>
    <div id="knobs">
      <div class="pair">
        <button id="presetB" type="button" aria-pressed="false">B 스퀴시</button>
        <button id="presetC" type="button" aria-pressed="true">C 섞음</button></div>
      <label class="knob"><span>차오르는 빠르기</span><output id="oRise"></output>
        <input id="kRise" type="range" min="-100" max="100" step="1"></label>
      <label class="knob"><span>눌리는 깊이</span><output id="oDepth"></output>
        <input id="kDepth" type="range" min="0" max="200" step="1"></label>
      <label class="knob"><span>몸 전체 말랑함</span><output id="oSoft"></output>
        <input id="kSoft" type="range" min="0" max="200" step="1"></label>
      <label class="knob"><span>놓을 때 출렁임</span><output id="oBounce"></output>
        <input id="kBounce" type="range" min="0" max="200" step="1"></label>
      <label class="knob"><span>늘어나는 정도</span><output id="oStretch"></output>
        <input id="kStretch" type="range" min="0" max="200" step="1"></label>
      <label class="knob"><span>크기</span><output id="oSize"></output>
        <input id="kSize" type="range" min="100" max="200" step="1"></label>
      <div class="skinRow"><span>겉면</span>
        <button id="skinPlain" type="button" aria-pressed="true">기존</button>
        <button id="skinPowder" type="button" aria-pressed="false">가루</button></div>
      <div class="skinRow" id="faceRow"><span>얼굴</span>
        <button id="faceGa" type="button" aria-pressed="false">가</button>
        <button id="faceNa" type="button" aria-pressed="true">나</button></div>
      <div class="skinRow" id="fireRow"><span>불</span>
        <button id="fireNew" type="button" aria-pressed="true">새</button>
        <button id="fireOld" type="button" aria-pressed="false">예전</button></div>
      <button id="resetBtn" type="button">처음 값으로</button>
    </div>
  </details>
</div>

<script>
  // three.js를 못 받으면(인터넷 끊김 등) 「불러오는 중…」만 남지 않게 15초 뒤 안내
  setTimeout(function () { var el = document.getElementById('loading'); if (el) el.textContent = '3D 도구를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로 고침해 주세요.'; }, 15000);
</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* v4 (2026-11-11): v3(스퀴시 + 슬라임 늘어남) 손맛은 그대로 두고 겉보기와 끊김을 고침.
   - 몸 겉면을 "겹친 점 없이 한 장으로 붙인 겉면"으로 다시 짬 → 이음매 줄 · 꼭짓점의 뾰족한 세모가 생길 자리가 없음
   - 점마다 옮길 양을 다 계산한 뒤 이웃과 너무 다르게 튄 점을 다듬음 → 접히거나 뾰족해지지 않음
   - 늘어남 · 몸 눌림 · 출렁임을 여러 갈래로 기억하고, 한 프레임에 움직일 수 있는 거리에 한계를 둠 → 툭툭 끊기지 않음
   - 넓은 화면에서는 손잡이 창이 무대 옆에 늘 떠 있음(D키) · 「원위치」 버튼(R키)
   여섯 종 디자인 시안 v1 (2026-11-11): 손맛은 v4 그대로 두고 생김새만 여섯 가지로.
   - 처음엔 여섯 종(생 · 꼬치구이 · 스모어 · 초코파이 · 무지개 · 코코아)이 한 화면에 나란히 떠 있음 (목록 화면)
   - 하나를 누르면 가운데로 크게 떠오르고, 그때부터 v4와 똑같이 만짐. 「목록」 버튼(Esc)으로 돌아감
   - 몸 겉면 무늬(그을림 · 무지개 줄 · 초콜릿)는 몸에 칠해져 있어 같이 눌리고 늘어남.
     장식(꼬챙이 · 크래커 · 컵 · 수건 …)은 몸 가까운 곳을 따라 같이 움직이되 눌리지는 않음
   v1.1: 크래커 · 빵 · 수건은 몸과 같이 휘며 솟은 몸 위로 들리고, 팔은 몸과 컵 사이에서 늘어나고, 김은 옆 몸 겉면을 따라감
     → 몸이 장식을 뚫고 나오지 않음 (손맛 계산은 그대로)
   v2 (11/11 15:44 형님 디자인 피드백): 손맛 계산은 그대로, 생김새만 다시.
   - 몸은 같은 계산을 쓰고, 「보이는 자세」(크기 · 눕히기 · 자리)만 종마다 다르게 → 몸이 작아지거나 길어져도 손맛 계산은 같음
   - 생: 주름 선 · 다크서클을 빼서 말간 얼굴
   - 꼬치구이: 작고 세로로 길쭉한 몸이 얇은 꼬치 끝에 꽂혀 대롱대롱 + 머리에 불. 꼬치 아래를 잡고 흔들면 몸이 흔들리고 불이 커짐
   - 스모어: 크래커를 콱 누르면 금 → 부서져 조각 · 가루가 흘러내림(위 · 아래 모두), 「다시 하기」로 처음대로
   - 초코파이: 동그랗고 납작한 초콜릿 덩어리. 베어 먹힌 자리에 초콜릿 · 빵 · 얇은 마시멜로 · 빵 · 초콜릿 층
   - 무지개: 가로로 누운 긴 몸, 파스텔 네 가닥이 밧줄처럼 꼬인 모양(모양 자체가 볼록볼록) + 오른쪽 위 나비 리본 머리띠
   - 코코아: 진짜 머그컵 비율, 컵 안 코코아가 보이고 작은 마시멜로가 반쯤 잠겨 동동, 지그시 감은 느긋한 얼굴
   v3 (11/11 16:59 형님 두 번째 디자인 피드백): 손맛 계산은 그대로(꼬치구이 「늘어나는 정도」 기본값만 100).
   - 공통: 처음부터 있던 볼터치를 뺌. 홍조는 만질 때만 서서히 피어나는 그라데이션(스모어만 아주 옅게 처음부터)
   - 꼬치구이: 얼굴 = 11/4 「C줄」(가만히 걱정 눈썹 · 땀 · 물결 입 → 만지면 ＞＜ · 벌린 입 · 큰 땀), 얼굴을 위로 붙임.
               꼬챙이 어디든 잡으면 그 위쪽 전부(꼬챙이 + 마시멜로 + 불)가 대나무처럼 한 몸으로 휨. 불은 윗면 전체에서 여러 갈래로
   - 스모어: 순한 점 눈 얼굴 → 만지면 눈웃음
   - 무지개: 얼굴 두 가지(가 / 나)를 손잡이 판에서 바꿔 봄 · 양 끝 검은 구멍 없앰 · 띠 없이 납작한 나비 리본만
   - 코코아: 김을 빼고 몸이 코코아 위로 더 솟음 · 만지면 「캬~ 시원하다」 얼굴 */

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ───────── 느낌 손잡이 (슬라이더 값 → 실제 값) ───────── */
// 미리 맞춘 값 두 개. B = v2 처음 값 그대로 · C = 스퀴시에 슬라임을 섞은 제안값
const PRESETS = {
  B: {rise: 40, depth: 50, soft: 20, bounce: 0, stretch: 0},
  C: {rise: 30, depth: 110, soft: 80, bounce: 40, stretch: 60},
};
const SIZE_DEFAULT = 175;   // 처음 크기 = v2의 1.75배
const RANGE = {rise: [-100, 100], depth: [0, 200], soft: [0, 200], bounce: [0, 200], stretch: [0, 200], size: [100, 200]};
const KNOB_IDS = [['rise', 'Rise'], ['depth', 'Depth'], ['soft', 'Soft'], ['bounce', 'Bounce'], ['stretch', 'Stretch'], ['size', 'Size']];
const FEEL_KEYS = ['rise', 'depth', 'soft', 'bounce', 'stretch'];   // 미리 맞춘 값 버튼이 바꾸는 손잡이 (크기는 빠짐)
const knob = {...PRESETS.C, size: SIZE_DEFAULT};
let preset = 'C', lastPreset = 'C';     // 지금 눌려 있는 버튼 · 마지막에 고른 버튼
const P = {riseT: 1.2, depth: 0, soft: 0, bounce: 0, stretch: 0, scale: 1.75, over: 0, overD: 0};   // 실제 값
let sceneReady = false;                 // 3D 무대가 다 차려졌나 (그 전에는 크기 반영을 건너뜀)
let mode = 'list';                      // 'list' = 여섯 종 목록 화면 · 'play' = 하나를 골라 만지는 화면
let trans = null;                       // 고른 마시멜로가 떠오르는 중이면 그 진행 정보 (아니면 null)

function applyKnobs() {
  for (const [key] of KNOB_IDS) knob[key] = clamp(Number(knob[key]) || 0, RANGE[key][0], RANGE[key][1]);
  // 놓은 뒤 다 차오르는 시간(초): −100 → 7초, 0 → 2.5초, 40 → 약 1.2초, 100 → 0.4초
  P.riseT = knob.rise >= 0 ? 2.5*Math.pow(.4/2.5, knob.rise/100) : 2.5*Math.pow(7/2.5, -knob.rise/100);
  P.depth = .05 + .13*knob.depth/100;              // 자국 깊이(몸 높이 1 기준): 0 → 0.05, 100 → 0.18, 200 → 0.31
  P.soft = .16*knob.soft/100;                      // 누를 때 몸 전체가 같이 눌리는 비율: 100 → 16%, 200 → 32%
  P.bounce = knob.bounce/100;                      // 놓은 뒤 출렁이는 세기: 0 = 없음, 200 = 100의 두 배
  P.scale = knob.size/100;                         // 크기 배수: 100 = v2 크기
  P.overD = clamp((knob.depth - 100)/100, 0, 1);   // 깊이가 100을 얼마나 넘었나 0~1
  // 잡힌 곳이 따라오는 한계(몸 높이 1 기준): 100 → 0.5, 200 → 1.0. 깊이가 100을 넘으면 겉면이 접히지 않게 40%까지 줄임
  P.stretch = .5*knob.stretch/100*(1 - .4*P.overD);
  P.over = clamp((Math.max(knob.depth, knob.soft) - 100)/100, 0, 1);   // 깊이 · 말랑함 중 큰 쪽이 100을 얼마나 넘었나

      ctx.beginPath(); ctx.moveTo(ex + sd*(rx - 3), ey - 2); ctx.quadraticCurveTo(ex + sd*(rx + 9), ey - 4, ex + sd*(rx + 15), ey - 14); ctx.stroke();
      ctx.strokeStyle = 'rgba(108,76,56,.7)'; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.moveTo(ex + sd*44, 53); ctx.lineTo(ex - sd*34, 49); ctx.stroke();
      continue;
    }
    // 눈썹: 축 처진 평소 모양 그대로
    ctx.strokeStyle = 'rgba(108,76,56,.78)'; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(ex + sd*55, 59); ctx.lineTo(ex - sd*50, 49); ctx.stroke();
  }
  // 입: 평소엔 작고 축 처짐 → 누르면 입꼬리가 아주 조금 올라간 미소 (입은 벌어지지 않음)
  const my = 258, mw = girl ? 20 : 24, sm = girl ? .45 + .55*s.smile : s.smile;   // 「얼굴 가」는 가만히 있어도 살짝 웃는 입
  const endY = my + 3 - SMILE_LIFT*sm, midY = my - 1 + SMILE_DIP*sm;
  ctx.strokeStyle = '#b77a76'; ctx.lineCap = 'round'; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(cx-mw, endY); ctx.quadraticCurveTo(cx, midY, cx+mw, endY); ctx.stroke();
  ctx.strokeStyle = 'rgba(120,60,60,.55)'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(cx-mw+3, endY); ctx.quadraticCurveTo(cx, midY + 2, cx+mw-3, endY); ctx.stroke();
}

/* ───────── 나머지 다섯 종의 얼굴: 단순한 선과 점 (그림판 테두리에는 아무것도 닿지 않게 — 띠 밖이 투명해야 함) ───────── */
const INK = '#3a2a24';   // 얼굴 선 · 점 색 (짙은 밤색)
// v3: 「처음부터 있는 볼터치」(진한 단색 타원 · 빗금)는 모든 종에서 뺌 — 홍조는 만질 때만 서서히 피어남(스모어만 아주 옅게 처음부터)
// 만질 때 올라오는 홍조: 가운데가 진하고 가장자리로 갈수록 부드럽게 퍼지는 그라데이션. 자리 · 번지는 크기(r)만 종마다 다름
function pressBlush(ctx, dx, y, a, r = 44) {
  if (a <= .005) return;
  for (const sd of [-1, 1]) {
    ctx.save(); ctx.translate(FW/2 + sd*dx, y); ctx.scale(1.3, 1);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
    g.addColorStop(0, `rgba(238,120,118,${BLUSH_ALPHA*a})`);
    g.addColorStop(.55, `rgba(238,120,118,${BLUSH_ALPHA*.55*a})`);
    g.addColorStop(1, 'rgba(238,120,118,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
    ctx.restore();
  }
}
const TOUCH_AT = .35;        // 홍조가 이만큼 올라오면 「만질 때 얼굴」로 바뀜 (누르고 약 0.2초 뒤). 놓으면 홍조가 가라앉으며 다시 「가만히 얼굴」
const SMORE_BLUSH = .28;     // 스모어만: 처음부터 깔려 있는 아주 옅은 홍조 (만지면 여기서 1까지 번짐)
// 점 눈 (반짝이 한 점). 깜빡이면 가로선
function dotEye(ctx, ex, ey, r, s, ox = 0, oy = 0) {
  ctx.lineCap = 'round';
  if (s.blink > .5) { ctx.strokeStyle = INK; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(ex - r, ey); ctx.lineTo(ex + r, ey); ctx.stroke(); return; }
  const ix = ex + (s.lx + ox)*8, iy = ey - (s.ly + oy)*5;
  ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(ix, iy, r, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ix - r*.32, iy - r*.36, r*.27, 0, 7); ctx.fill();
}
// 땀방울 (11/4 생김새 시안 C줄과 같은 모양 · 색)
function tearDrop(ctx, x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y - 2.2*s);
  ctx.quadraticCurveTo(x + 1.1*s, y - .2*s, x + .9*s, y + .5*s);
  ctx.arc(x, y + .5*s, .9*s, 0, Math.PI, false);
  ctx.quadraticCurveTo(x - 1.1*s, y - .2*s, x, y - 2.2*s); ctx.closePath();
  ctx.fillStyle = '#a9dcff'; ctx.strokeStyle = '#4a90c8'; ctx.lineWidth = 4; ctx.fill(); ctx.stroke();
}
// 벌린 입 (안쪽 짙은 색 + 분홍 혀)
function openMouth(ctx, pathFn, tongueY, tongueRx, tongueRy) {
  pathFn(); ctx.fillStyle = '#5a2a26'; ctx.fill();
  ctx.save(); pathFn(); ctx.clip();
  ctx.fillStyle = '#f28c96'; ctx.beginPath(); ctx.ellipse(FW/2, tongueY, tongueRx, tongueRy, 0, 0, 7); ctx.fill();
  ctx.restore();
  pathFn(); ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.stroke();
}

// 꼬치구이: 머리에 불이 붙어 걱정스러운 얼굴 + 땀방울 (눈두덩 선 · 주름처럼 보이는 선은 없음)
function drawFaceSkewer(s, ctx = faceCtx) {
  const cx = FW/2;
  // v3: 11/4 얼굴 시안 「C줄」을 따름. 얼굴 전체를 위쪽으로 붙여 아래가 남게(눈 · 입이 그림판 위쪽에 모여 있음)
  //   가만히 = 걱정스러운 짧은 눈썹 · 점 눈 · 작은 땀방울 둘 · 물결 입 (불타고 있으니 이게 기본)
  //   만지거나 흔들 때 = ＞＜ 눈 · 동그랗게 벌린 입 · 큰 땀방울 · 홍조가 피어남
  const hot = !!s.touch;
  ctx.clearRect(0, 0, FW, FH); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  pressBlush(ctx, 148, 158, s.blush, 40);
  for (const sd of [-1, 1]) {
    const ex = cx + sd*84, ey = 112;
    if (hot) {   // 꾹 감은 눈: 꼭짓점이 얼굴 가운데를 향함
      ctx.strokeStyle = INK; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.moveTo(ex + sd*17, ey - 13); ctx.lineTo(ex - sd*12, ey); ctx.lineTo(ex + sd*17, ey + 13); ctx.stroke();
    } else dotEye(ctx, ex, ey, 12, s);
    ctx.strokeStyle = INK; ctx.lineWidth = 7;   // 걱정 눈썹(짧게): 안쪽 끝이 올라감
    ctx.beginPath(); ctx.moveTo(ex + sd*24, hot ? 84 : 81); ctx.lineTo(ex - sd*17, hot ? 63 : 68); ctx.stroke();
  }
  ctx.strokeStyle = INK;
  if (hot) {   // 동그랗게 벌린 입 + 분홍 혀
    const my = 190;
    openMouth(ctx, () => { ctx.beginPath(); ctx.ellipse(cx, my, 13, 15, 0, 0, 7); ctx.closePath(); }, my + 11, 10, 7);
  } else {     // 작은 물결 입
    const my = 186, w = 20;
    ctx.lineWidth = 6; ctx.beginPath();
    for (let i = 0; i <= 20; i++) {
      const u = i/20, x = cx - w + 2*w*u, y = my + 5*Math.sin(u*Math.PI*4);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  // 땀방울: 오른쪽 이마에서 천천히 흘러내림(가만히 2초에 한 번 · 만질 때 1초에 한 번, 더 크게) + 왼쪽 이마에 하나
  const p = (s.t*(hot ? 1 : .5)) % 1;
  ctx.globalAlpha = p < .8 ? 1 : (1 - p)/.2;
  tearDrop(ctx, cx + 152, 58 + 30*p, hot ? 13 : 8);
  ctx.globalAlpha = 1;
  tearDrop(ctx, cx - 150, hot ? 76 : 70, hot ? 11 : 7);
}

// 스모어(v3): 「귀여운 척」하던 꾹 감은 눈 · 빗금 볼을 버리고 순한 얼굴로.
//   가만히 = 동그란 점 눈(크래커에 끼어 눌린 듯 눈 사이가 조금 넓음) · 짧은 눈썹 · 작은 입 · 아주 옅은 홍조
//   만지면 = 눈웃음(위로 볼록한 곡선 눈) · 입꼬리가 올라감 · 홍조가 번짐
function drawFaceSmore(s, ctx = faceCtx) {
  const cx = FW/2, hot = !!s.touch;

  pressBlush(ctx, 196, 178, SMORE_BLUSH + (1 - SMORE_BLUSH)*s.blush, 36 + 14*s.blush);
  for (const sd of [-1, 1]) {

    } else dotEye(ctx, ex, ey, 13, s);
    ctx.strokeStyle = INK; ctx.lineWidth = 6;   // 짧은 눈썹: 거의 수평, 만지면 살짝 올라감
    const by = hot ? 80 : 86;

  }

  const my = 196, w = 12 + 12*s.smile, dip = 5 + 11*s.smile;

}

// 초코파이(v2): 몸이 초콜릿색이라 얼굴 선을 밝은 크림색으로. 「누가 먹었어」 억울한 눈 — 흰자 있는 큰 눈이 베어 먹힌 쪽(오른쪽)을 흘끔 · 八자 눈썹 · 삐죽 입

      ctx.fillStyle = '#26160f'; ctx.beginPath(); ctx.arc(ix, iy, 17, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ix - 5, iy - 6, 5.5, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(ix + 6, iy + 6, 2.8, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(120,195,245,.95)'; ctx.lineWidth = 6;   // 아래 눈가에 고인 눈물

    }

  }

  const my = 236;
  ctx.strokeStyle = CREAM_INK; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(cx - 24, my + 6); ctx.quadraticCurveTo(cx, my - 12 + 28*s.smile, cx + 24, my + 6); ctx.stroke();
}

// 무지개(v3): 누운 몸 앞면에 가로로 놓인 얼굴. 속눈썹 달린 반짝 눈(「너무 인위적」)을 버리고 두 가지를 바꿔 볼 수 있게 (나비 리본은 3D 장식)
//   가 = 우리 기본 얼굴(생 얼굴)에서 여자아이 느낌만 살짝 → drawFaceA2(…, girl)
//   나 = 작고 동그란 까만 눈에 흰 반짝점 하나 · 짧은 눈썹 · 작은 입 (순하고 맑은 눈) — 처음 값
function drawFaceRainbowNa(s, ctx = faceCtx) {
  const cx = FW/2;

    ctx.beginPath(); ctx.moveTo(ex - 13, 105); ctx.quadraticCurveTo(ex, 98, ex + 13, 105); ctx.stroke();
  }
  // 입: 작은 입. 만지면 조금 더 웃음
  const my = 206, w = 12 + 5*s.smile;
  ctx.strokeStyle = INK; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(cx - w, my); ctx.quadraticCurveTo(cx, my + 9 + 8*s.smile, cx + w, my); ctx.stroke();
}
function drawFaceRainbow(s, ctx = faceCtx) {
  if (rainbowFace === 'ga') drawFaceA2(s, ctx, true); else drawFaceRainbowNa(s, ctx);
}

// 코코아(v3): 가만히 = 온천에 몸 담근 느긋한 얼굴(지그시 감은 눈 · 작은 ω 입). 처음부터 있던 볼터치 · 빗금은 뺌
//   만지면 = 「캬~ 시원하다」: 눈을 꼭 감아 눈가에 주름 선이 여러 줄 잡히고, 입을 크게 벌리고, 홍조가 번짐. 놓으면 다시 느긋한 얼굴
function drawFaceCocoa(s, ctx = faceCtx) {
  const cx = FW/2, hot = !!s.touch;
  ctx.clearRect(0, 0, FW, FH); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  pressBlush(ctx, 150, 190, s.blush, 40 + 8*s.blush);
  ctx.strokeStyle = INK;
  for (const sd of [-1, 1]) {
    const ex = cx + sd*82, ey = 138;
    if (!hot) {   // 지그시 감은 눈
      ctx.lineWidth = 8;
      ctx.beginPath(); ctx.moveTo(ex - 21, ey - 5); ctx.quadraticCurveTo(ex, ey + 15, ex + 21, ey - 5); ctx.stroke();
      continue;
    }
    // 꼭 감은 눈: 바깥 끝이 올라간 짧고 굵은 선 + 눈꼬리에서 부챗살처럼 퍼지는 주름 세 줄 + 눈 밑 주름 한 줄
    const ox = ex + sd*22, oy = ey - 8;

    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.quadraticCurveTo(ex, ey + 5, ex - sd*19, ey + 7); ctx.stroke();
    ctx.lineWidth = 5;
    for (const a of [-.75, -.1, .55]) {

      ctx.beginPath(); ctx.moveTo(ox + 9*c, oy + 9*sn); ctx.lineTo(ox + 25*c, oy + 25*sn); ctx.stroke();
    }
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(ex - 15, ey + 22); ctx.quadraticCurveTo(ex, ey + 29, ex + 15, ey + 22); ctx.stroke();
    // 미간 주름: 눈 안쪽 끝 위의 짧은 선

  }
  if (hot) {   // 크게 벌린 입 + 분홍 혀

      ctx.beginPath(); ctx.moveTo(cx - 27, my - 2); ctx.quadraticCurveTo(cx, my - 11, cx + 27, my - 2);

    }, my + 31, 15, 10);

  }
  // 입: 작은 ω 입
  const my = 200, w = 15;
  ctx.lineWidth = 6; ctx.beginPath();
  ctx.moveTo(cx - w, my - 2); ctx.quadraticCurveTo(cx - w/2, my + 10, cx, my);
  ctx.quadraticCurveTo(cx + w/2, my + 10, cx + w, my - 2); ctx.stroke();
}

/* ───────── 조립: 자리 · 크기(anchor, 둥실) → 돌리기(pivot, 몸 한가운데가 축) → 종마다 기울기(tiltG)
   → [받침 물건(standG: 꼬챙이 · 머그컵) · 매달림(swing: 꼬치 끝에서 대롱대롱)] → 숨쉬기 + 종마다 자세(root) → 몸 + 얼굴 ───────── */
const anchor = new THREE.Group(); scene.add(anchor);
const pivot = new THREE.Group(); pivot.position.set(0, CY, 0); anchor.add(pivot);
const tiltG = new THREE.Group(); pivot.add(tiltG);
const standG = new THREE.Group(); tiltG.add(standG);   // 몸에 붙지 않고 받쳐 주는 물건 (눌리지 않음)
const swing = new THREE.Group(); tiltG.add(swing);     // 꼬치구이: 꼬치 끝을 축으로 몸이 대롱대롱. 다른 종은 가만히
const root = new THREE.Group(); root.matrixAutoUpdate = false; root.add(body, faceMesh);
swing.add(root);
const rootM = new THREE.Matrix4();

/* ───────── 여섯 종 ─────────
   idx = 몸 겉면 무늬 번호 · faceC = 얼굴 띠 높이 · faceArc / faceH = 얼굴 그림을 펼칠 둘레 길이 · 높이(몸 원래 크기 기준)
   form = 「보이는 자세」: 몸을 얼마나 늘이고 줄이고 눕히나 (손맛 계산은 원래 몸 그대로 하고, 보일 때만 이 자세로 바꿈)
   off = 몸 한가운데의 자리(보이는 크기 기준) · tip = 꼬치 끝(매달림 축) 자리 · tilt = 통째로 앞으로 기울이는 각도(코코아: 컵 안이 보이게)
   ext = 장식 · 받침까지 합친 크기(가로 절반 · 가운데에서 위아래 끝까지) — 화면에 다 들어오게 맞출 때 씀
   anim = 얼굴에 저절로 움직이는 것(땀방울)이 있나 */
const formOf = (r0, r1, r2) => new THREE.Matrix4().set(...r0, 0, ...r1, 0, ...r2, 0, 0, 0, 0, 1);
const diagForm = (kx, ky, kz = kx) => formOf([kx, 0, 0], [0, ky, 0], [0, 0, kz]);
// 꼬치구이 치수 (보이는 크기 기준, 화면 가운데 0): 몸은 기본의 약 1/4 넓이(가로 0.42배 · 세로 0.58배 → 옆으로 슬림, 세로가 조금 더 김)
// v3: gripTop = 꼬챙이를 잡을 수 있는 맨 위(마시멜로 바로 밑) — 꼬챙이 어디든 잡을 수 있음
const SKEWER = {kx: .42, ky: .58, bodyY: .40, tipY: .31, bottomY: -1.0, gripTop: .09, stickR: .012};
// 코코아 치수: 머그컵(바깥 반지름 .6 · 높이 .92) 안에 지름 절반쯤 되는 마시멜로가 둥둥. v3: 몸의 2/3쯤이 코코아 위로 솟게(bodyY .31 → .353)

/* ───────── 스모어 크래커 부서짐 (v2) ───────── */

{ const c = new THREE.Color();

  again() { smoreAgain(); return crumbleState(); },        // 「다시 하기」와 같은 일
  breakChunk(side = 'top', i = 4) {                        // 그 조각을 바로 부숨 (side: 'top' · 'bottom', i: 0~8, 4 = 가운데)
    const ch = playDecos[KIND_BY_ID.smore.i].chunks.filter(c => c.side === side)[i];
    if (ch && mode === 'play' && curKind.id === 'smore') breakChunk(ch);
    return crumbleState();
  },
  // 꼬챙이 아래쪽을 잡고 좌우로 흔든 것처럼: dx = 흔드는 폭(px), times = 왕복 수, ms = 걸리는 시간. 시간을 바로 흘려(step처럼) 끝난 뒤 상태를 돌려줌
  shake(dx = 60, times = 3, ms = 900) { return shakeAt(SHAKE.hDefault, dx, times, ms); },   // v3: 꼬챙이 아래쪽(높이 0.15)을 잡은 것으로 침
  // x = 앞뒤로 · z = 좌우로 기운 각도(도), deg = 합친 각도
  dangle() { return {x: THREE.MathUtils.radToDeg(sk.bz + sk.ez), z: THREE.MathUtils.radToDeg(sk.bx + sk.ex), deg: THREE.MathUtils.radToDeg(sk.lean), stick: {x: sk.off.x, y: sk.off.y, z: sk.off.z}}; },
  fire() { return curKind.id === 'skewer' ? sk.fire : 0; },
  // ── v3 ──
  shakeAt(h = .15, dx = 60, times = 3, ms = 900) { return shakeAt(h, dx, times, ms); },   // 꼬챙이를 높이 h(0 = 맨 아래 ~ 1 = 마시멜로 바로 밑)에서 잡고 흔들기
  stickAt(h = .5) { return curKind.id === 'skewer' && mode === 'play' ? stickPx(h) : null; },   // 꼬챙이 높이 h 자리의 화면 좌표(px) — 여기를 press()하면 그 높이를 잡음
  bend() { return bendState(); },                           // 지금 휜 모양: {h, tipDeg, bow, wobbleDeg, grab}
  face() { return faceName(); },                            // 'idle'(가만히) · 'touch'(만질 때)
  blush() { return {level: mode === 'play' ? blushShown() : 0, base: curKind.blushBase || 0, glow}; },   // 홍조 세기
  setRainbowFace(name) { setRainbowFace(name); return rainbowFace; },   // 무지개 얼굴 고르기: 'ga'(가) · 'na'(나)
  flame() { return curKind.id === 'skewer' && playDeco && playDeco.flame ? flameState() : {tongues: 0, level: 0}; },   // 불길 갈래 수 · 세기 (+ 불 v4: style · height · heightAvg · light · lightAvg · blobs · toast)
  // ── 불 v4 ──
  setFire(name) { setFireStyle(name); return fireStyle; },   // 불 고르기: 'new'(새, 처음 값) · 'old'(예전 = v3 불)
  // 11/11 검수 반영: 몸 앞면의 한 점이 화면 어디인가(px) — u = 좌우(-1 왼쪽 끝 ~ 1 오른쪽 끝), h = 높이(0 밑 ~ 1 꼭대기). 사진에서 그 자리 색을 잴 때 씀
  bodyPx(u = 0, h = .5) { u = clamp(Number(u) || 0, -1, 1); return toScreen(u*BODY.r*.9, clamp(Number(h) || 0, 0, 1)*BODY.h, BODY.r*.9*Math.sqrt(1 - u*u)); },
  // 지금 종의 장식 · 받침에 든 덩어리 수를 이름표로 셈 — 띠 · 김이 정말 없는지 확인용
  parts() {
    let torus = 0, meshes = 0;
    const count = o => { if (o.isMesh) { meshes++; if (o.geometry && o.geometry.type === 'TorusGeometry') torus++; } };
    if (playDeco) playDeco.group.traverse(count);
    const decoTorus = torus; torus = 0;
    if (playStand) playStand.group.traverse(count);
    return {kind: curKind.id, meshes, decoTorus, standTorus: torus};   // 무지개: decoTorus 0(띠 없음) · 코코아: standTorus 1(컵 손잡이뿐)
  },
};
// 뚫림 검사: 지금 종에서 덮는 판(크래커 · 빵 · 수건)이 덮고 있는 자리의 몸 점 가운데 판 바깥으로 나온 점의 수와 가장 많이 나온 거리(몸 좌표).
// 「덮고 있는 자리」 = 몸 점 바로 위(아래 판은 바로 아래) 0.06 안에 판 바깥면의 점이 있는 곳. 판 두께의 절반까지는 나온 것으로 치지 않음.
// worst는 셈에 든 점이 없어도 「판 바깥면보다 가장 많이 나온 거리」(0 이상)를 그대로 알려 줌
function decoPoke() {
  const kind = mode === 'play' ? curKind.id : null;
  let count = 0, worst = 0;
  if (mode !== 'play' || !playDeco) return {kind, count, worst};
  const R2 = .06*.06;
  for (const pc of playDeco.pieces) {
    if (!pc.cap || !pc.skin) continue;
    const pts = [];   // 판 바깥면 점들의 지금 자리
    for (const r of pc.skin) {
      if (!r.mesh.visible || (r.mesh.parent && !r.mesh.parent.visible)) continue;   // v2: 부서져 사라진 크래커 조각은 덮지 않음
      for (const u of r.outer) { const a = u*3; pts.push(r.ubl[a] + r.udisp[a], r.ubl[a+1] + r.udisp[a+1], r.ubl[a+2] + r.udisp[a+2]); }
    }
    for (let v = 0; v < NW; v++) {
      const a = v*3, px = pos[a], py = pos[a+1], pz = pos[a+2];
      let best = R2, sy = NaN;
      for (let k = 0; k < pts.length; k += 3) {
        const d = (pts[k] - px)**2 + (pts[k+2] - pz)**2;
        if (d < best) { best = d; sy = pts[k+1]; }
      }
      if (sy !== sy) continue;
      const out = pc.cap > 0 ? py - sy : sy - py;
      if (out > worst) worst = out;
      if (out > pc.half) count++;
    }
  }
  return {kind, count, worst};
}
