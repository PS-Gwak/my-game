<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>마시멜로 말랑이</title>
<style>
  /* 색은 전부 여기 한곳에서 정함 (밝은 화면 기본값) */
  :root {
    --bg: #ece9e2;          /* 화면 바탕 */
    --wall-top: #f1efe9;    /* 뒷벽 위쪽 */
    --wall-bottom: #ddd9d0; /* 뒷벽 아래쪽 */
    --ink: #2b2723;         /* 글자 */
    --sub: #6f685f;         /* 흐린 글자 */
    --panel: #f8f6f1;       /* 손잡이 패널 바탕 */
    --line: #d5cfc4;        /* 테두리 */
    --accent: #e8641a;      /* 강조색 */
    --pressed: #efe2d6;     /* 눌린 버튼 바탕 */
  }
  /* 어두운 화면 */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1d1b19; --wall-top: #34312d; --wall-bottom: #262421;
      --ink: #f0ece5; --sub: #a79f93; --panel: #292623; --line: #3d3934; --accent: #f07a35; --pressed: #3b302a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1d1b19; --wall-top: #34312d; --wall-bottom: #262421;
    --ink: #f0ece5; --sub: #a79f93; --panel: #292623; --line: #3d3934; --accent: #f07a35; --pressed: #3b302a;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; touch-action: manipulation; overscroll-behavior: none; }
  body {
    background-color: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  /* 세로로 쌓기: 위 = 마시멜로 무대, 아래 = 손잡이 패널. 패널이 열리면 무대가 그만큼 줄어서 마시멜로를 가리지 않음 */
  #app {
    height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 10px;
    padding: max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto;
    touch-action: none;   /* 무대와 그 둘레 여백에서는 끌어도 화면이 움직이지 않게 (패널은 아래에서 따로 스크롤 허용) */
  }
  #stage {
    position: relative; flex: 1 1 auto; min-height: 180px; border-radius: 18px; overflow: hidden;
    background: linear-gradient(var(--wall-top), var(--wall-bottom));
    border: 1px solid var(--line);
  }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #stage canvas.held { cursor: grabbing; }
  /* 한 줄 안내: 오른쪽 위 「원위치」 버튼과 겹치지 않게 양옆을 비워 둠 */
  #hint {
    position: absolute; left: 0; right: 0; top: 14px; padding: 0 84px; text-align: center; pointer-events: none;
    font-size: 17px; font-weight: 700; color: var(--sub); transition: opacity .6s; word-break: keep-all;
  }
  #hint.off { opacity: 0; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--sub); font-size: 16px; padding: 24px; text-align: center; }
  #homeBtn {
    position: absolute; top: 10px; right: 10px; font: inherit; font-size: 15px; font-weight: 700; padding: 7px 11px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer;
  }
  #homeBtn:active { background: var(--pressed); }
  /* 「목록」 버튼: 무대 왼쪽 위 구석 (고른 뒤에만 보임) */
  #backBtn {
    position: absolute; top: 10px; left: 10px; font: inherit; font-size: 15px; font-weight: 700; padding: 7px 11px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer;
  }
  #backBtn:active { background: var(--pressed); }
  /* 목록 화면: 손잡이 패널 · 원위치 · 목록 버튼 · 안내 글을 모두 숨기고 여섯 종만 보여 줌 */
  #app.mode-list #panel, #app.mode-list #homeBtn, #app.mode-list #backBtn, #app.mode-list #hint { display: none; }
  #app.mode-list #stage canvas { cursor: pointer; }

  #panel { flex: 0 1 auto; max-height: 55%; overflow: auto; overscroll-behavior: contain; touch-action: pan-y;background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  #panel summary {
    list-style: none; cursor: pointer; padding: 12px 14px; font-size: 16px; font-weight: 700;
    display: flex; justify-content: space-between; align-items: center;
  }
  #panel summary::-webkit-details-marker { display: none; }
  #panel summary::after { content: "열기"; font-weight: 600; color: var(--accent); }
  #panel[open] summary::after { content: "접기"; }
  #knobs { padding: 0 14px 14px; display: grid; gap: 10px; }
  .knob { display: grid; grid-template-columns: 1fr auto; row-gap: 2px; align-items: baseline; font-size: 16px; }
  .knob output { color: var(--sub); font-variant-numeric: tabular-nums; }
  .knob input { grid-column: 1 / -1; width: 100%; height: 30px; margin: 0; accent-color: var(--accent); touch-action: pan-x; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .skinRow { display: grid; grid-template-columns: auto 1fr 1fr; gap: 8px; align-items: center; font-size: 16px; }
  #knobs button {
    font: inherit; font-size: 16px; font-weight: 700; padding: 10px; border-radius: 10px;
    border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer;
  }
  #knobs button[aria-pressed="false"] { color: var(--sub); }
  /* 고른 쪽은 눌려 들어간 모양 */
  #knobs button[aria-pressed="true"] {
    color: var(--ink); border-color: var(--accent); background: var(--pressed);
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, .22); transform: translateY(1px);
  }

  /* 넓은 화면(PC): 무대 옆에 손잡이 창을 나란히 세워 늘 보이게. 무대를 가리지 않고 옆자리를 따로 차지함 */
  @media (min-width: 900px) {
    #app { max-width: none; flex-direction: row; justify-content: center; gap: 14px; }
    #stage { flex: 0 1 560px; min-width: 0; }
    #panel { flex: 0 0 300px; max-height: 100%; align-self: flex-start; }
    #panel summary { cursor: default; }
    #panel summary::after, #panel[open] summary::after { content: "D 숨김"; color: var(--sub); }
    #app.side-off #panel { display: none; }
    /* 목록 화면에서는 무대를 넓게 써서 3열 × 2행으로 */
    #app.mode-list #stage { flex: 0 1 1040px; }
  }
</style>
</head>
<body>
<div id="app" class="mode-list">
  <div id="stage">
    <div id="loading">불러오는 중…</div>
    <div id="hint">누르고 · 끌고 · 빈 곳을 끌어 돌려 보세요</div>
    <button id="backBtn" type="button">목록</button>
    <button id="homeBtn" type="button">원위치</button>
  </div>
  <details id="panel">
    <summary>느낌 손잡이</summary>
    <div id="knobs">
      <div class="pair">
        <button id="presetB" type="button" aria-pressed="false">B 스퀴시</button>
        <button id="presetC" type="button" aria-pressed="true">C 섞음</button></div>
      <label class="knob"><span>차오르는 빠르기</span><output id="oRise"></output>
        <input id="kRise" type="range" min="-100" max="100" step="1"></label>
      <label class="knob"><span>눌리는 깊이</span><output id="oDepth"></output>
        <input id="kDepth" type="range" min="0" max="200" step="1"></label>
      <label class="knob"><span>몸 전체 말랑함</span><output id="oSoft"></output>
        <input id="kSoft" type="range" min="0" max="200" step="1"></label>
      <label class="knob"><span>놓을 때 출렁임</span><output id="oBounce"></output>
        <input id="kBounce" type="range" min="0" max="200" step="1"></label>
      <label class="knob"><span>늘어나는 정도</span><output id="oStretch"></output>
        <input id="kStretch" type="range" min="0" max="200" step="1"></label>
      <label class="knob"><span>크기</span><output id="oSize"></output>
        <input id="kSize" type="range" min="100" max="200" step="1"></label>
      <div class="skinRow"><span>겉면</span>
        <button id="skinPlain" type="button" aria-pressed="true">기존</button>
        <button id="skinPowder" type="button" aria-pressed="false">가루</button></div>
      <button id="resetBtn" type="button">처음 값으로</button>
    </div>
  </details>
</div>

<script>
  // three.js를 못 받으면(인터넷 끊김 등) 「불러오는 중…」만 남지 않게 15초 뒤 안내
  setTimeout(function () { var el = document.getElementById('loading'); if (el) el.textContent = '3D 도구를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로 고침해 주세요.'; }, 15000);
</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* v4 (2026-11-11): v3(스퀴시 + 슬라임 늘어남) 손맛은 그대로 두고 겉보기와 끊김을 고침.
   - 몸 겉면을 "겹친 점 없이 한 장으로 붙인 겉면"으로 다시 짬 → 이음매 줄 · 꼭짓점의 뾰족한 세모가 생길 자리가 없음
   - 점마다 옮길 양을 다 계산한 뒤 이웃과 너무 다르게 튄 점을 다듬음 → 접히거나 뾰족해지지 않음
   - 늘어남 · 몸 눌림 · 출렁임을 여러 갈래로 기억하고, 한 프레임에 움직일 수 있는 거리에 한계를 둠 → 툭툭 끊기지 않음
   - 넓은 화면에서는 손잡이 창이 무대 옆에 늘 떠 있음(D키) · 「원위치」 버튼(R키)
   여섯 종 디자인 시안 v1 (2026-11-11): 손맛은 v4 그대로 두고 생김새만 여섯 가지로.
   - 처음엔 여섯 종(생 · 꼬치구이 · 스모어 · 초코파이 · 무지개 · 코코아)이 한 화면에 나란히 떠 있음 (목록 화면)
   - 하나를 누르면 가운데로 크게 떠오르고, 그때부터 v4와 똑같이 만짐. 「목록」 버튼(Esc)으로 돌아감
   - 몸 겉면 무늬(그을림 · 무지개 줄 · 초콜릿)는 몸에 칠해져 있어 같이 눌리고 늘어남.
     장식(꼬챙이 · 크래커 · 컵 · 수건 …)은 몸 가까운 곳을 따라 같이 움직이되 눌리지는 않음 */

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ───────── 느낌 손잡이 (슬라이더 값 → 실제 값) ───────── */
// 미리 맞춘 값 두 개. B = v2 처음 값 그대로 · C = 스퀴시에 슬라임을 섞은 제안값
const PRESETS = {
  B: {rise: 40, depth: 50, soft: 20, bounce: 0, stretch: 0},
  C: {rise: 30, depth: 110, soft: 80, bounce: 40, stretch: 60},
};
const SIZE_DEFAULT = 175;   // 처음 크기 = v2의 1.75배
const RANGE = {rise: [-100, 100], depth: [0, 200], soft: [0, 200], bounce: [0, 200], stretch: [0, 200], size: [100, 200]};
const KNOB_IDS = [['rise', 'Rise'], ['depth', 'Depth'], ['soft', 'Soft'], ['bounce', 'Bounce'], ['stretch', 'Stretch'], ['size', 'Size']];
const FEEL_KEYS = ['rise', 'depth', 'soft', 'bounce', 'stretch'];   // 미리 맞춘 값 버튼이 바꾸는 손잡이 (크기는 빠짐)
const knob = {...PRESETS.C, size: SIZE_DEFAULT};
let preset = 'C', lastPreset = 'C';     // 지금 눌려 있는 버튼 · 마지막에 고른 버튼
const P = {riseT: 1.2, depth: 0, soft: 0, bounce: 0, stretch: 0, scale: 1.75, over: 0, overD: 0};   // 실제 값
let sceneReady = false;                 // 3D 무대가 다 차려졌나 (그 전에는 크기 반영을 건너뜀)
let mode = 'list';                      // 'list' = 여섯 종 목록 화면 · 'play' = 하나를 골라 만지는 화면
let trans = null;                       // 고른 마시멜로가 떠오르는 중이면 그 진행 정보 (아니면 null)

function applyKnobs() {
  for (const [key] of KNOB_IDS) knob[key] = clamp(Number(knob[key]) || 0, RANGE[key][0], RANGE[key][1]);
  // 놓은 뒤 다 차오르는 시간(초): −100 → 7초, 0 → 2.5초, 40 → 약 1.2초, 100 → 0.4초
  P.riseT = knob.rise >= 0 ? 2.5*Math.pow(.4/2.5, knob.rise/100) : 2.5*Math.pow(7/2.5, -knob.rise/100);
  P.depth = .05 + .13*knob.depth/100;              // 자국 깊이(몸 높이 1 기준): 0 → 0.05, 100 → 0.18, 200 → 0.31
  P.soft = .16*knob.soft/100;                      // 누를 때 몸 전체가 같이 눌리는 비율: 100 → 16%, 200 → 32%
  P.bounce = knob.bounce/100;                      // 놓은 뒤 출렁이는 세기: 0 = 없음, 200 = 100의 두 배
  P.scale = knob.size/100;                         // 크기 배수: 100 = v2 크기
  P.overD = clamp((knob.depth - 100)/100, 0, 1);   // 깊이가 100을 얼마나 넘었나 0~1
  // 잡힌 곳이 따라오는 한계(몸 높이 1 기준): 100 → 0.5, 200 → 1.0. 깊이가 100을 넘으면 겉면이 접히지 않게 40%까지 줄임
  P.stretch = .5*knob.stretch/100*(1 - .4*P.overD);
  P.over = clamp((Math.max(knob.depth, knob.soft) - 100)/100, 0, 1);   // 깊이 · 말랑함 중 큰 쪽이 100을 얼마나 넘었나
  for (const [key, id] of KNOB_IDS) { $('k' + id).value = knob[key]; $('o' + id).textContent = key === 'size' ? knob[key] + '%' : knob[key]; }
  $('presetB').setAttribute('aria-pressed', String(preset === 'B'));
  $('presetC').setAttribute('aria-pressed', String(preset === 'C'));
  if (sceneReady) applyView();
}
function setPreset(name) {
  if (!PRESETS[name]) return;
  Object.assign(knob, PRESETS[name]); preset = lastPreset = name; applyKnobs();
}
for (const [key, id] of KNOB_IDS) {
  $('k' + id).addEventListener('input', e => {
    knob[key] = Number(e.target.value);
    if (key !== 'size') preset = null;             // 손으로 바꾸면 두 버튼 다 안 눌린 모양
    applyKnobs();
  });
}
$('presetB').addEventListener('click', () => setPreset('B'));
$('presetC').addEventListener('click', () => setPreset('C'));
$('resetBtn').addEventListener('click', () => setPreset(lastPreset));
// 겉면 바꾸기: 버튼 두 개 중 누른 쪽으로. 손맛(움직임)은 그대로이고 보이는 겉면만 바뀜
function setSkin(name) {
  window.__SQ_SKIN__ = name === 'powder' ? 'powder' : 'plain';
  $('skinPlain').setAttribute('aria-pressed', String(window.__SQ_SKIN__ === 'plain'));
  $('skinPowder').setAttribute('aria-pressed', String(window.__SQ_SKIN__ === 'powder'));
  if (window.__SQ_APPLY_SKIN__) window.__SQ_APPLY_SKIN__();
}
$('skinPlain').addEventListener('click', () => setSkin('plain'));
$('skinPowder').addEventListener('click', () => setSkin('powder'));
applyKnobs();

/* ───────── 손잡이 창 자리: 넓은 화면 = 무대 옆에 늘 떠 있음(D키로 숨김 · 다시 보임) / 좁은 화면 = 아래 열기 · 접기 ───────── */
const wideMQ = window.matchMedia('(min-width: 900px)');
const panelEl = $('panel'), appEl = $('app');
let sideHidden = false, narrowOpen = false;   // 옆 창을 숨겼나 · 좁은 화면에서 패널을 열어 두었나
function applyLayout() {
  panelEl.open = wideMQ.matches ? true : narrowOpen;   // 넓은 화면에서는 늘 펼친 채
  appEl.classList.toggle('side-off', sideHidden);
  appEl.classList.toggle('mode-list', mode === 'list');   // 목록 화면이면 패널 · 버튼을 숨김 (CSS)
  appEl.classList.toggle('mode-play', mode === 'play');
}
const sidePanelShown = () => wideMQ.matches && !sideHidden && mode === 'play';
panelEl.addEventListener('toggle', () => { if (!wideMQ.matches) narrowOpen = panelEl.open; });
panelEl.querySelector('summary').addEventListener('click', e => { if (wideMQ.matches) e.preventDefault(); });   // 넓은 화면에서는 제목을 눌러도 접히지 않음
wideMQ.addEventListener('change', applyLayout);
applyLayout();
// 키보드: D = 옆 손잡이 창 숨김 · 다시 보임, R = 원위치, Esc = 목록으로 (한글 자판 상태에서도 같은 자리 키로 동작)
window.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  if (e.code === 'KeyD') { if (wideMQ.matches) { sideHidden = !sideHidden; applyLayout(); } }
  else if (e.code === 'KeyR') { if (sceneReady && mode === 'play' && !trans) goHome(); }
  else if (e.code === 'Escape') { if (sceneReady) back(); }
});

/* ───────── 무대 (받침 · 탁자 · 그림자 없음. 뒷벽은 CSS 바탕색이 비쳐 보임) ───────── */
const stage = $('stage');
let renderer;
try { renderer = new THREE.WebGLRenderer({antialias: true, alpha: true}); }
catch (err) { $('loading').textContent = '이 브라우저에서 3D 화면을 켜지 못했습니다. 다른 브라우저로 열어 보세요.'; throw err; }
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.setClearColor(0x000000, 0);
const cv = renderer.domElement;
stage.insertBefore(cv, stage.firstChild);
$('loading').remove();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 60);
const LOOK_AT = new THREE.Vector3(0, .6, 0);
const CAM_DIR = new THREE.Vector3(0, .68, 4.9).normalize();   // 원본 게임과 같은 내려다보는 각도

// 조명: 하늘빛 + 앞 위쪽 불빛 하나 (마시멜로가 하얗게 날아가지 않는 세기)
scene.add(new THREE.HemisphereLight(0xffffff, 0xb9b3a6, 2.0));
const sun = new THREE.DirectionalLight(0xfffaf0, 1.25); sun.position.set(-1.5, 3, 3.2); scene.add(sun);

const FLOAT = {amp: .035, speed: 1.1};   // 공중에서 위아래로 아주 천천히 둥실

/* ───────── 마시멜로 몸 (A2와 같은 치수: 반지름 .55 · 높이 1 · 모서리 둥글기 .22 · 색 fffaf2) ───────── */
const BODY = {r: .55, h: 1.00, c: .22, faceC: .50, faceH: .46, color: 0xfffaf2, breath: [1.4, .035]};

// 둥근 모서리 원기둥 단면. 눌린 자국이 매끈하게 생기도록 옆면 · 윗면 · 밑면에 점을 고르게 촘촘히 넣음
function bodyProfile(d) {
  const R = d.r, C = d.c, H = d.h, pts = [];

    const ex = cx + sd*108, ey = 122, rx = 50, ry = 30, peak = ry*open*1.25;
    const path = () => { ctx.beginPath(); ctx.moveTo(ex-rx, ey); ctx.quadraticCurveTo(ex, ey-2*peak, ex+rx, ey); ctx.quadraticCurveTo(ex, ey+ry*1.1, ex-rx, ey); ctx.closePath(); };
    // 눈 밑 다크서클
    ctx.strokeStyle = 'rgba(150,100,110,.35)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ex-rx+6, ey+14); ctx.quadraticCurveTo(ex, ey+ry*1.1+12, ex+rx-6, ey+14); ctx.stroke();
    if (open > 0.04) {
      ctx.save(); path(); ctx.clip();
      ctx.fillStyle = '#f3eee8'; ctx.fillRect(ex-rx, ey-50, rx*2, 100);
      const ix = ex + s.lx*15, iy = ey + s.ly*-7 + (1-open)*4;
      ctx.fillStyle = '#76654f'; ctx.beginPath(); ctx.arc(ix, iy, 21, 0, 7); ctx.fill();
      ctx.strokeStyle = '#4a3d30'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = '#0c0a09'; ctx.beginPath(); ctx.arc(ix, iy, 8, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(ix-7, iy-8, 3.5, 0, 7); ctx.fill();
      const sh = ctx.createLinearGradient(0, ey-peak, 0, ey-peak+22);
      sh.addColorStop(0, 'rgba(110,70,60,.45)'); sh.addColorStop(1, 'rgba(110,70,60,0)');
      ctx.fillStyle = sh; ctx.fillRect(ex-rx, ey-peak, rx*2, 24);
      ctx.restore();
    }
    // 윗눈꺼풀 선 + 주름
    ctx.strokeStyle = '#573d33'; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(ex-rx, ey); ctx.quadraticCurveTo(ex, ey-2*peak, ex+rx, ey); ctx.stroke();
    ctx.strokeStyle = 'rgba(120,80,70,.5)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(ex-rx+8, ey-8); ctx.quadraticCurveTo(ex, ey-2*peak-14, ex+rx-8, ey-8); ctx.stroke();
    // 눈썹: 축 처진 평소 모양 그대로
    ctx.strokeStyle = 'rgba(108,76,56,.78)'; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(ex + sd*55, 59); ctx.lineTo(ex - sd*50, 49); ctx.stroke();
  }
  // 입: 평소엔 작고 축 처짐 → 누르면 입꼬리가 아주 조금 올라간 미소 (입은 벌어지지 않음)
  const my = 258, mw = 24;
  const endY = my + 3 - SMILE_LIFT*s.smile, midY = my - 1 + SMILE_DIP*s.smile;
  ctx.strokeStyle = '#b77a76'; ctx.lineCap = 'round'; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(cx-mw, endY); ctx.quadraticCurveTo(cx, midY, cx+mw, endY); ctx.stroke();
  ctx.strokeStyle = 'rgba(120,60,60,.55)'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(cx-mw+3, endY); ctx.quadraticCurveTo(cx, midY + 2, cx+mw-3, endY); ctx.stroke();
}

/* ───────── 나머지 다섯 종의 얼굴: 단순한 선과 점 (그림판 테두리에는 아무것도 닿지 않게 — 띠 밖이 투명해야 함) ───────── */
const INK = '#3a2a24';   // 얼굴 선 · 점 색 (짙은 밤색)
// 늘 있는 볼터치: 납작한 분홍 동그라미 두 개
function cheeks(ctx, dx, y, rx, ry, a) {
  ctx.fillStyle = `rgba(244,128,134,${a})`;
  for (const sd of [-1, 1]) { ctx.beginPath(); ctx.ellipse(FW/2 + sd*dx, y, rx, ry, 0, 0, 7); ctx.fill(); }
}
// 누를 때 올라오는 홍조: v4와 같은 모양 · 진하기, 자리만 종마다 다름
function pressBlush(ctx, dx, y, a) {
  if (a <= .005) return;
  for (const sd of [-1, 1]) {
    ctx.save(); ctx.translate(FW/2 + sd*dx, y); ctx.scale(1.3, 1);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 44);
    g.addColorStop(0, `rgba(238,120,118,${BLUSH_ALPHA*a})`);
    g.addColorStop(.55, `rgba(238,120,118,${BLUSH_ALPHA*.55*a})`);
    g.addColorStop(1, 'rgba(238,120,118,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 44, 0, 7); ctx.fill();
    ctx.restore();
  }
}
// 점 눈 (반짝이 한 점). 깜빡이면 가로선
function dotEye(ctx, ex, ey, r, s, ox = 0, oy = 0) {
  ctx.lineCap = 'round';
  if (s.blink > .5) { ctx.strokeStyle = INK; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(ex - r, ey); ctx.lineTo(ex + r, ey); ctx.stroke(); return; }
  const ix = ex + (s.lx + ox)*8, iy = ey - (s.ly + oy)*5;
  ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(ix, iy, r, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ix - r*.32, iy - r*.36, r*.27, 0, 7); ctx.fill();
}
// 땀방울 (11/4 생김새 시안 C줄과 같은 모양 · 색)
function tearDrop(ctx, x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y - 2.2*s);
  ctx.quadraticCurveTo(x + 1.1*s, y - .2*s, x + .9*s, y + .5*s);
  ctx.arc(x, y + .5*s, .9*s, 0, Math.PI, false);
  ctx.quadraticCurveTo(x - 1.1*s, y - .2*s, x, y - 2.2*s); ctx.closePath();
  ctx.fillStyle = '#a9dcff'; ctx.strokeStyle = '#4a90c8'; ctx.lineWidth = 4; ctx.fill(); ctx.stroke();
}
// 벌린 입 (안쪽 짙은 색 + 분홍 혀)
function openMouth(ctx, pathFn, tongueY, tongueRx, tongueRy) {
  pathFn(); ctx.fillStyle = '#5a2a26'; ctx.fill();
  ctx.save(); pathFn(); ctx.clip();
  ctx.fillStyle = '#f28c96'; ctx.beginPath(); ctx.ellipse(FW/2, tongueY, tongueRx, tongueRy, 0, 0, 7); ctx.fill();
  ctx.restore();
  pathFn(); ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.stroke();
}

// 꼬치구이: 볼터치 + 이마 땀방울. 「뜨겁지만 괜찮은 척」 — 걱정 눈썹인데 입은 억지로 웃음
function drawFaceSkewer(s, ctx = faceCtx) {
  const cx = FW/2;
  ctx.clearRect(0, 0, FW, FH); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  cheeks(ctx, 165, 192, 34, 18, .55);
  pressBlush(ctx, 165, 196, s.blush);
  for (const sd of [-1, 1]) {
    const ex = cx + sd*92, ey = 134;
    dotEye(ctx, ex, ey, 15, s);
    ctx.strokeStyle = INK; ctx.lineWidth = 8;   // 걱정 눈썹: 안쪽 끝이 올라감
    ctx.beginPath(); ctx.moveTo(ex + sd*28, 92); ctx.lineTo(ex - sd*24, 77); ctx.stroke();
  }
  // 입: 양끝이 올라간 억지 미소 + 오른쪽 입꼬리 옆 짧은 떨림 선. 누르면 진짜로 웃는 쪽으로 더 휨
  const my = 220, w = 30;
  ctx.strokeStyle = INK; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(cx - w, my - 6); ctx.quadraticCurveTo(cx, my + 12 + 10*s.smile, cx + w, my - 6); ctx.stroke();
  ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(cx + w + 9, my - 15); ctx.lineTo(cx + w + 15, my - 6); ctx.stroke();
  // 땀방울: 오른쪽 이마에서 2초에 한 번 천천히 흘러내림 + 왼쪽 이마에 작은 것 하나
  const p = (s.t*.5) % 1;
  ctx.globalAlpha = p < .8 ? 1 : (1 - p)/.2;
  tearDrop(ctx, cx + 178, 40 + 34*p, 12);
  ctx.globalAlpha = 1;
  tearDrop(ctx, cx - 172, 54, 8);
}

// 스모어: 크래커에 눌려 꾹 감은 눈 > < · 옆으로 삐져나온 큰 볼 · 꽉 다문 물결 입
function drawFaceSmore(s, ctx = faceCtx) {
  const cx = FW/2;
  ctx.clearRect(0, 0, FW, FH); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  cheeks(ctx, 232, 198, 50, 28, .5);
  pressBlush(ctx, 232, 200, s.blush);
  ctx.strokeStyle = 'rgba(214,92,104,.65)'; ctx.lineWidth = 4;   // 볼 위 빗금 세 줄
  for (const sd of [-1, 1]) for (let k = -1; k <= 1; k++) {
    const x = cx + sd*232 + k*18;
    ctx.beginPath(); ctx.moveTo(x + 6, 187); ctx.lineTo(x - 4, 209); ctx.stroke();
  }
  ctx.strokeStyle = INK;
  for (const sd of [-1, 1]) {
    const ex = cx + sd*138, ey = 136;
    ctx.lineWidth = 9;   // 꾹 감은 눈: 꼭짓점이 얼굴 가운데를 향함
    ctx.beginPath(); ctx.moveTo(ex + sd*20, ey - 17); ctx.lineTo(ex - sd*16, ey); ctx.lineTo(ex + sd*20, ey + 17); ctx.stroke();
    ctx.lineWidth = 7;   // 힘준 눈썹: 안쪽이 내려감
    ctx.beginPath(); ctx.moveTo(ex + sd*30, 84); ctx.lineTo(ex - sd*22, 96); ctx.stroke();
  }
  // 입: 넓고 꽉 다문 물결. 누르면 물결이 잦아들고 아래로 휘는 미소
  const my = 226, w = 46, wave = 7*(1 - s.smile), bow = 14*s.smile;
  ctx.lineWidth = 7; ctx.beginPath();
  for (let i = 0; i <= 24; i++) {
    const u = i/24, x = cx - w + 2*w*u, y = my + wave*Math.sin(u*Math.PI*4) + bow*(1 - (2*u - 1)*(2*u - 1));
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

// 초코파이: 「누가 먹었어」 억울한 눈 — 눈물 고인 큰 눈이 베어 먹힌 쪽(오른쪽 위)을 흘끔 · 八자 눈썹 · 삐죽 입
function drawFaceChocopie(s, ctx = faceCtx) {
  const cx = FW/2;
  ctx.clearRect(0, 0, FW, FH); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  pressBlush(ctx, 165, 200, s.blush);
  for (const sd of [-1, 1]) {
    const ex = cx + sd*100, ey = 132;
    if (s.blink > .5) { ctx.strokeStyle = INK; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(ex - 19, ey); ctx.lineTo(ex + 19, ey); ctx.stroke(); }
    else {
      const ix = ex + (s.lx + .5)*9, iy = ey - (s.ly + .55)*7;
      ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(ix, iy, 20, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ix - 6, iy - 7, 6, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(ix + 7, iy + 6, 3, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(110,180,235,.95)'; ctx.lineWidth = 5;   // 아래 눈가에 고인 눈물
      ctx.beginPath(); ctx.arc(ex, ey + 2, 25, .22*Math.PI, .78*Math.PI); ctx.stroke();
    }
    ctx.strokeStyle = INK; ctx.lineWidth = 8;   // 八자 눈썹
    ctx.beginPath(); ctx.moveTo(ex + sd*32, 92); ctx.lineTo(ex - sd*26, 70); ctx.stroke();
  }
  // 입: 아래로 처진 삐죽 입. 누르면 펴지며 살짝 웃음
  const my = 228;
  ctx.strokeStyle = INK; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(cx - 24, my + 6); ctx.quadraticCurveTo(cx, my - 12 + 28*s.smile, cx + 24, my + 6); ctx.stroke();
}

// 무지개: 혼자 신나서 윙크 + 활짝 벌린 웃는 입 + 눈가 반짝 별
function drawFaceRainbow(s, ctx = faceCtx) {
  const cx = FW/2;
  ctx.clearRect(0, 0, FW, FH); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  cheeks(ctx, 170, 196, 30, 16, .45);
  pressBlush(ctx, 170, 198, s.blush);
  const exL = cx - 96, exR = cx + 96, ey = 134;
  ctx.strokeStyle = INK; ctx.lineWidth = 9;   // 왼눈: 감은 윙크 ^
  ctx.beginPath(); ctx.moveTo(exL - 24, ey + 8); ctx.quadraticCurveTo(exL, ey - 20, exL + 24, ey + 8); ctx.stroke();
  dotEye(ctx, exR, ey, 17, s);                // 오른눈: 뜬 눈
  ctx.lineWidth = 7;                          // 신난 눈썹: 위로 둥글게
  for (const ex of [exL, exR]) { ctx.beginPath(); ctx.moveTo(ex - 24, 86); ctx.quadraticCurveTo(ex, 66, ex + 24, 86); ctx.stroke(); }
  // 눈가 반짝 별 (노란 네 갈래)
  const sx = cx + 156, sy = 96, r1 = 13, r2 = 4;
  ctx.fillStyle = '#f2c94c'; ctx.beginPath();
  for (let i = 0; i < 8; i++) { const a = i*Math.PI/4 - Math.PI/2, r = i % 2 ? r2 : r1; ctx.lineTo(sx + Math.cos(a)*r, sy + Math.sin(a)*r); }
  ctx.closePath(); ctx.fill();
  // 입: 활짝 벌린 D자. 누르면 조금 더 크게
  const my = 202, w = 44, h = 46 + 10*s.smile;
  openMouth(ctx, () => { ctx.beginPath(); ctx.moveTo(cx - w, my); ctx.quadraticCurveTo(cx, my + 8, cx + w, my); ctx.quadraticCurveTo(cx, my + 2*h, cx - w, my); ctx.closePath(); }, my + h - 4, 22, 15);
}

// 코코아: 노천탕에 몸 담근 「하~」 — 편안하게 감은 눈 · 동그랗게 헤 벌린 입 · 따뜻해서 늘 볼그레
function drawFaceCocoa(s, ctx = faceCtx) {
  const cx = FW/2;
  ctx.clearRect(0, 0, FW, FH); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  cheeks(ctx, 160, 196, 34, 18, .55);
  pressBlush(ctx, 160, 198, s.blush);
  ctx.strokeStyle = INK;
  for (const sd of [-1, 1]) {
    const ex = cx + sd*96, ey = 136;
    ctx.lineWidth = 8;   // 감은 눈: 아래로 둥근 편안한 선
    ctx.beginPath(); ctx.moveTo(ex - 28, ey - 4); ctx.quadraticCurveTo(ex, ey + 18, ex + 28, ey - 4); ctx.stroke();
    ctx.lineWidth = 6;   // 느긋하게 올라간 눈썹
    ctx.beginPath(); ctx.moveTo(ex - 24, 82); ctx.quadraticCurveTo(ex, 70, ex + 24, 82); ctx.stroke();
  }
  // 입: 「하~」 동그랗게 벌림. 누르면 옆으로 조금 넓어지며 더 기분 좋은 입
  const my = 222, rx = 19 + 9*s.smile, ry = 21 - 3*s.smile;
  openMouth(ctx, () => { ctx.beginPath(); ctx.ellipse(cx, my, rx, ry, 0, 0, 7); }, my + ry*.7, rx*.7, ry*.45);
}

/* ───────── 조립: 자리 · 크기(anchor, 둥실) → 돌리기(pivot, 몸 한가운데가 축) → 숨쉬기(root) → 몸 + 얼굴 ───────── */
const anchor = new THREE.Group(); scene.add(anchor);
const pivot = new THREE.Group(); pivot.position.set(0, CY, 0); anchor.add(pivot);
const root = new THREE.Group(); root.matrixAutoUpdate = false; root.add(body, faceMesh);
pivot.add(root);
const rootM = new THREE.Matrix4();

/* ───────── 여섯 종 ─────────
   idx = 몸 겉면 무늬 번호 · faceC = 얼굴 띠 높이 · shape = 몸 가로(앞뒤 포함) · 세로 배율 (모양만, 손맛 계산은 그대로)
   ext = 장식까지 합친 크기(가로 절반 · 몸 한가운데에서 위아래 끝까지) — 화면에 다 들어오게 맞출 때 씀
   anim = 얼굴에 저절로 움직이는 것(땀방울)이 있나 */
const KINDS = [
  {id: 'raw',      idx: 0, faceC: .50, shape: [1, 1],     ext: {w: .55, hy: .50}, face: drawFaceA2},
  {id: 'skewer',   idx: 1, faceC: .50, shape: [1, 1],     ext: {w: .55, hy: .90}, face: drawFaceSkewer, anim: true},
  {id: 'smore',    idx: 2, faceC: .50, shape: [1.12, .8], ext: {w: .72, hy: .50}, face: drawFaceSmore},
  {id: 'chocopie', idx: 3, faceC: .50, shape: [1, 1],     ext: {w: .63, hy: .56}, face: drawFaceChocopie},
  {id: 'rainbow',  idx: 4, faceC: .50, shape: [1, 1],     ext: {w: .55, hy: .50}, face: drawFaceRainbow},
  {id: 'cocoa',    idx: 5, faceC: .64, shape: [1, 1],     ext: {w: .74, hy: .63}, face: drawFaceCocoa},
];
KINDS.forEach((k, i) => { k.i = i; });
const KIND_IDS = KINDS.map(k => k.id);
const KIND_BY_ID = Object.fromEntries(KINDS.map(k => [k.id, k]));
let curKind = KINDS[0];      // 지금 고른 종 (목록 화면에서도 마지막 값을 기억)

/* ───────── 장식 만들기 (단순한 덩어리 · 무광 · 종마다 색 서너 가지) ───────── */
const DECO = {
  wood: 0xd8b07c, woodEnd: 0x8a5e3c,          // 꼬챙이 · 탄 끝
  graham: 0xd9a35f, grahamDot: 0xa86f3a,      // 크래커 · 구멍 자국
  choc: 0x6a3f2c, cake: 0xc98b55,             // 초콜릿 · 빵 단면
  mug: 0x8fc4da, cocoa: 0x8a5535, towel: 0xffffff, steam: 0xffffff,
};
const lam = (hex, extra) => new THREE.MeshLambertMaterial({color: hex, ...extra});
// 원래 모양에서 조건에 맞는 점 번호들 (장식이 따라 움직일 몸 자리)
function vertsWhere(fn) {
  const out = [];
  for (let v = 0; v < NW; v++) if (fn(rest[v*3], rest[v*3 + 1], rest[v*3 + 2])) out.push(v);
  return Uint32Array.from(out);
}
function vertsNear(x, y, z, n) {
  const d = [];
  for (let v = 0; v < NW; v++) d.push([(rest[v*3]-x)**2 + (rest[v*3+1]-y)**2 + (rest[v*3+2]-z)**2, v]);
  d.sort((a, b) => a[0] - b[0]);
  return Uint32Array.from(d.slice(0, n).map(e => e[1]));
}
// 같은 자리에 겹친 점들의 바깥 방향을 평균 → 깎은 면처럼 각지지 않고 둥글게 보임
function smoothNormals(g) {
  const p = g.attributes.position.array, n = g.attributes.normal.array, map = new Map(), keys = [];
  for (let i = 0; i < p.length; i += 3) {
    const k = Math.round(p[i]*1e4) + ',' + Math.round(p[i+1]*1e4) + ',' + Math.round(p[i+2]*1e4);
    let a = map.get(k); if (!a) map.set(k, a = [0, 0, 0]);
    a[0] += n[i]; a[1] += n[i+1]; a[2] += n[i+2]; keys.push(k);
  }
  for (let i = 0, j = 0; i < p.length; i += 3, j++) {
    const a = map.get(keys[j]), l = Math.hypot(a[0], a[1], a[2]) || 1;
    n[i] = a[0]/l; n[i+1] = a[1]/l; n[i+2] = a[2]/l;
  }
  g.attributes.normal.needsUpdate = true;
  return g;
}
function roundedRectShape(hw, hd, r) {
  const s = new THREE.Shape();
  s.moveTo(-hw + r, -hd); s.lineTo(hw - r, -hd); s.quadraticCurveTo(hw, -hd, hw, -hd + r);
  s.lineTo(hw, hd - r); s.quadraticCurveTo(hw, hd, hw - r, hd);
  s.lineTo(-hw + r, hd); s.quadraticCurveTo(-hw, hd, -hw, hd - r);
  s.lineTo(-hw, -hd + r); s.quadraticCurveTo(-hw, -hd, -hw + r, -hd);
  return s;
}
// 납작한 판: 모양(shape)을 위로 두께만큼 세우고 모서리를 둥글게. 가운데 높이가 0
function slabGeo(shape, depth, bev, segs = 3, extra) {
  const g = new THREE.ExtrudeGeometry(shape, {depth, bevelEnabled: true, bevelThickness: bev, bevelSize: extra?.bevS ?? bev, bevelSegments: segs, steps: 1, curveSegments: 8});
  g.rotateX(-Math.PI/2); g.translate(0, -depth/2, 0);
  return g;
}
// 초코파이 뚜껑: 둥근 초콜릿 빵. withBite = 한입 베어 먹힌 자국(이빨 자국 세 개)과 빵 단면
const BITE_PHI = .75;        // 베어 먹힌 자리: 앞에서 오른쪽으로 약 43도
function lidGeo(withBite) {
  const R = .58, depth = .16, bev = .07, bevS = .05;
  const bites = withBite ? [[BITE_PHI - .21, .64, .16], [BITE_PHI, .66, .19], [BITE_PHI + .22, .64, .15]] : [];
  // 판 모양 좌표(sx, sy)는 세운 뒤 (x = sx, z = -sy)가 됨
  const cs = bites.map(([ph, r, rb]) => ({x: r*Math.sin(ph), y: -r*Math.cos(ph), rb}));
  const pts = [];
  for (let i = 0; i < 180; i++) {
    const a = i/180*Math.PI*2, ux = Math.cos(a), uy = Math.sin(a);
    let r = R;
    for (const c of cs) {   // 이 방향으로 나아가다 이빨 자국 동그라미에 처음 닿는 거리
      const b = ux*c.x + uy*c.y, d = b*b - (c.x*c.x + c.y*c.y - c.rb*c.rb);
      if (d > 0) { const t = b - Math.sqrt(d); if (t > 0 && t < r) r = t; }
    }
    pts.push(new THREE.Vector2(ux*r, uy*r));
  }
  const g = slabGeo(new THREE.Shape(pts), depth, bev, 4, {bevS});
  // 색: 윗면 · 아랫면 · 바깥 둘레 = 초콜릿, 베어 먹힌 벽 = 빵 단면 (위아래 얇은 초콜릿 껍질은 남김)
  const top = depth/2 + bev, n = g.attributes.position.count, p = g.attributes.position.array, col = new Float32Array(n*3);
  const cap = g.groups.find(gr => gr.materialIndex === 0);
  const choc = new THREE.Color(DECO.choc), cake = new THREE.Color(DECO.cake);
  for (let i = 0; i < n; i++) {
    let c = choc;
    const inCap = cap && i >= cap.start && i < cap.start + cap.count;
    if (!inCap && cs.length) {
      const x = p[i*3], y = p[i*3 + 1], z = p[i*3 + 2];
      let dmin = Infinity;
      for (const b of cs) dmin = Math.min(dmin, Math.hypot(x - b.x, z + b.y) - b.rb);
      if (dmin < bevS + .03 && y < top - .045 && y > -top + .045) c = cake;
    }
    col[i*3] = c.r; col[i*3 + 1] = c.g; col[i*3 + 2] = c.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.clearGroups();
  return smoothNormals(g);
}
// 스모어 크래커: 모서리 둥근 네모 판 (+ 윗판에는 구멍 자국과 가운데 홈)
function cracker(withDots) {
  const g = new THREE.Group(), depth = .045, bev = .022, top = depth/2 + bev;
  g.add(new THREE.Mesh(smoothNormals(slabGeo(roundedRectShape(.48, .48, .08), depth, bev, 2)), lam(DECO.graham)));
  if (withDots) {
    const dm = lam(DECO.grahamDot), dg = new THREE.CircleGeometry(.026, 12).rotateX(-Math.PI/2);
    for (const x of [-.22, .22]) for (const z of [-.24, 0, .24]) { const d = new THREE.Mesh(dg, dm); d.position.set(x, top + .002, z); g.add(d); }
    const line = new THREE.Mesh(new THREE.BoxGeometry(.012, .006, .84), dm); line.position.y = top + .001; g.add(line);
  }
  return g;
}
// 종마다 장식 한 벌. pieces = 몸 겉면을 따라 움직일 덩어리들 (anchors = 따라갈 몸 점들, f = 따라가는 비율)
function buildDeco(id) {
  const group = new THREE.Group(), pieces = [], steams = [];
  const add = (obj, anchors, f = 1) => { group.add(obj); pieces.push({obj, base: obj.position.clone(), anchors, f}); };
  const topCap = () => vertsWhere((x, y) => y > .99);
  const botCap = () => vertsWhere((x, y) => y < .01);
  if (id === 'skewer') {
    // 나무 꼬챙이가 정수리에서 아래로 몸을 뚫고 지나감. 위 · 아래로 삐져나온 두 토막 (몸 속은 안 보이므로 생략)
    const woodM = lam(DECO.wood), endM = lam(DECO.woodEnd);
    const top = new THREE.Group();
    top.add(new THREE.Mesh(new THREE.CylinderGeometry(.032, .032, .5, 12), woodM));
    const end = new THREE.Mesh(new THREE.CylinderGeometry(.033, .033, .045, 12), endM); end.position.y = .25; top.add(end);
    top.position.y = 1.13;
    const bot = new THREE.Group();
    bot.add(new THREE.Mesh(new THREE.CylinderGeometry(.032, .032, .4, 12), woodM));
    const tip = new THREE.Mesh(new THREE.ConeGeometry(.032, .12, 12), woodM); tip.rotation.x = Math.PI; tip.position.y = -.26; bot.add(tip);
    bot.position.y = -.1;
    add(top, vertsWhere((x, y, z) => y > .99 && Math.hypot(x, z) < .14));
    add(bot, vertsWhere((x, y, z) => y < .01 && Math.hypot(x, z) < .14));
  } else if (id === 'smore') {
    // 위아래 크래커 두 장 (서로 살짝 엇갈리게 돌려 놓음). 몸보다 조금 좁아서 몸이 옆으로 삐져나와 보임
    const t = cracker(true); t.position.y = 1.035; t.rotation.y = .22;
    const b = cracker(false); b.position.y = -.035; b.rotation.y = -.12;
    add(t, topCap()); add(b, botCap());
  } else if (id === 'chocopie') {
    // 위아래 둥근 초콜릿 빵이 이불처럼 덮고, 가운데 띠로 흰 마시멜로 얼굴이 보임
    const m = lam(0xffffff, {vertexColors: true});
    const t = new THREE.Mesh(lidGeo(true), m); t.position.y = .91;
    const b = new THREE.Mesh(lidGeo(false), m); b.position.y = .09;
    add(t, topCap()); add(b, botCap());
  } else if (id === 'cocoa') {
    // 머그컵 + 코코아 + 손잡이 + 김 (한 덩어리로 몸 아랫부분을 따라 움직임)
    const mugG = new THREE.Group(), mugM = lam(DECO.mug, {side: THREE.DoubleSide});
    const prof = [[0, -.13], [.56, -.13], [.62, -.12], [.655, -.09], [.665, -.04], [.665, .43], [.66, .46], [.645, .475],
                  [.625, .475], [.61, .46], [.605, .43], [.605, -.03], [0, -.03]].map(([r, y]) => new THREE.Vector2(r, y));
    mugG.add(new THREE.Mesh(new THREE.LatheGeometry(prof, 56), mugM));
    const liquid = new THREE.Mesh(new THREE.CircleGeometry(.607, 48).rotateX(-Math.PI/2), lam(DECO.cocoa)); liquid.position.y = .40;
    mugG.add(liquid);
    const hG = new THREE.Group(); hG.rotation.y = 2.54;   // 손잡이: 왼쪽 뒤
    const handle = new THREE.Mesh(new THREE.TorusGeometry(.13, .042, 8, 20, Math.PI), mugM);
    handle.rotation.z = -Math.PI/2; handle.position.set(.64, .2, 0); hG.add(handle); mugG.add(hG);
    // 김 세 가닥: 둥근 덩어리 두 개씩, 천천히 위아래로
    const steamM = lam(DECO.steam, {transparent: true, opacity: .7, depthWrite: false});
    const sg1 = new THREE.SphereGeometry(.065, 14, 10), sg2 = new THREE.SphereGeometry(.045, 12, 8);
    for (const [ph, y0, sp, off] of [[1.45, .66, .8, 0], [-1.5, .72, .65, 2.1], [2.7, .8, .9, 4.0]]) {
      const w = new THREE.Group();
      const a = new THREE.Mesh(sg1, steamM); a.scale.set(1, 1.5, 1);
      const b = new THREE.Mesh(sg2, steamM); b.position.set(.03, .14, 0); b.scale.set(1, 1.4, 1);
      w.add(a, b); w.position.set(.63*Math.sin(ph), y0, .63*Math.cos(ph)); mugG.add(w);
      steams.push({w, y0, sp, off});
    }
    add(mugG, vertsWhere((x, y) => Math.abs(y - .2) < .05));
    // 짧은 두 팔: 몸 옆에서 나와 컵 가장자리에 걸침
    const armM = lam(BODY.color);
    for (const sd of [-1, 1]) {
      const ph = sd*.95, A = new THREE.Vector3(.5*Math.sin(ph), .6, .5*Math.cos(ph)), B = new THREE.Vector3(.8*Math.sin(ph), .5, .8*Math.cos(ph));
      const dir = B.clone().sub(A), len = dir.length(); dir.normalize();
      const arm = new THREE.Mesh(new THREE.CapsuleGeometry(.07, len - .04, 4, 10), armM);
      arm.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
      arm.position.copy(A).add(B).multiplyScalar(.5);
      add(arm, vertsNear(.55*Math.sin(ph), .6, .55*Math.cos(ph), 8));
    }
    // 머리에 접은 흰 수건 (양끝에 컵과 같은 색 줄 두 개)
    const towel = new THREE.Group();
    towel.add(new THREE.Mesh(smoothNormals(slabGeo(roundedRectShape(.22, .13, .05), .05, .03, 2)), lam(DECO.towel)));
    for (const x of [-.14, .14]) { const band = new THREE.Mesh(new THREE.BoxGeometry(.04, .118, .33), lam(DECO.mug)); band.position.x = x; towel.add(band); }
    towel.position.set(-.04, 1.04, .02); towel.rotation.set(0, -.4, .08);
    add(towel, topCap());
  }
  const meshes = [];
  group.traverse(o => { if (o.isMesh) meshes.push(o); });
  return {
    group, pieces, meshes,
    update(t) {   // 저절로 움직이는 장식 (김)
      for (const s of steams) {
        s.w.position.y = s.y0 + .05*Math.sin(t*s.sp + s.off);
        const k = 1 + .08*Math.sin(t*s.sp*1.3 + s.off); s.w.scale.setScalar(k);
      }
    },
  };
}
// 고른 마시멜로에 붙일 장식 (종마다 한 번만 만들어 두고 바꿔 끼움)
const playDecos = KINDS.map(k => buildDeco(k.id));
let playDeco = null;
let hitList = [body];        // 누르기 판정 대상: 몸 + 장식 (장식에 먼저 닿으면 잡은 것으로 치지 않음)
// 고른 종의 생김새를 만지는 마시멜로에 입힘 (손맛 값은 건드리지 않음)
function applyKind(k) {
  curKind = k;
  bodyMat.userData.kind.value = k.idx;
  setFaceUV(faceTex, k.faceC);
  if (playDeco) root.remove(playDeco.group);
  playDeco = playDecos[k.i];
  for (const pc of playDeco.pieces) pc.obj.position.copy(pc.base);
  root.add(playDeco.group);
  hitList = [body, ...playDeco.meshes];
  faceKey = '';
}

const ROT_PITCH = .009;      // 위아래로 1px 끌 때 기우는 각도

const HOME_DUR = .8;         // 「원위치」를 누른 뒤 모양을 서둘러 되돌리는 시간(초)
const view = {yaw: 0, pitch: 0, homing: false, fit: 1};
let camHH = 2, camHW = 1.2, floatY = 0;   // 카메라가 보는 높이 · 폭의 절반(몸 자리 기준) · 지금 둥실 높이

// 돌린 각도 · 크기를 무대에 반영. 무대가 낮은데 몸을 기울여 화면 밖으로 나갈 것 같을 때만 그만큼 줄임
function applyView() {
  const hEff = .5*Math.cos(view.pitch) + .55*Math.sin(Math.abs(view.pitch));   // 기울였을 때 세로로 차지하는 절반 높이
  // 장식이 큰 종(컵 · 크래커 · 꼬챙이)은 장식까지 화면에 들어오게 그만큼 더 봄. 생은 v4와 같은 값(배수 1)
  const ex = curKind.ext;
  view.fit = clamp(Math.min((camHH*.96 - .135)/(P.scale*hEff*1.25*(ex.hy/.5)), camHW*.985/(P.scale*.59*(ex.w/.55))), .3, 1);
  const s = P.scale*view.fit;
  anchor.scale.setScalar(s);
  anchor.position.y = CY*(1 - s) + floatY;      // 크기를 바꿔도 몸 한가운데는 같은 자리
  pivot.rotation.set(view.pitch, view.yaw, 0, 'XYZ');   // 세로축으로 돌린 뒤 앞뒤로 기울임
  scene.updateMatrixWorld(true);
}

      const u = clamp((t - trans.t0)/RISE_DUR, 0, 1), e = u*u*(3 - 2*u);
      listItems.forEach((it, i) => { const sc = trans.listS*(1 - e); if (i !== trans.i && sc > .02) renderItem(it, trans.from[i], sc, t); });
      const a = trans.from[trans.i], r = {x: a.x*(1 - e), y: a.y*(1 - e), w: a.w + (W - a.w)*e, h: a.h + (H - a.h)*e};
      frameCamera(camera, r.w, r.h);
      const s = trans.listS + (trans.finalS - trans.listS)*e;
      anchor.scale.setScalar(s); anchor.position.y = CY*(1 - s) + floatY;
      setVP(r); renderer.clearDepth(); renderer.render(scene, camera);
      if (u >= 1) trans = null;
    }
    renderer.setViewport(0, 0, W, H); renderer.autoClear = true;
    if (mode === 'play' && !trans) resize();   // 다 떠올랐으면 v4와 같은 화면 맞춤으로
    return;
  }
  renderer.render(scene, camera);
}

// 만지던 상태를 모두 처음으로 (다른 종을 고르거나 다시 고를 때 깨끗하게 시작)
function resetPlay() {
  if (press.down) pointerUp();
  dent.fill(0); wide.fill(0); prevL.fill(0); dispA.fill(0); dispB.fill(0);
  pos.set(rest); posAttr.needsUpdate = true;
  geo.computeVertexNormals(); geo.attributes.normal.needsUpdate = true; syncFace();
  for (const c of strCh) { c.used = false; c.held = false; c.v.set(0, 0, 0); c.rel.set(0, 0, 0); c.relax = 0; c.on = false; }
  strAct = null; strL.length = 0;
  for (const c of sqCh) c.amt = 0;
  sqAct = 0;
  for (const p of pops) p.t0 = -1;
  pose.velS.set(0, 0, 0); pose.drift.set(0, 0, 0); pose.tilt.set(0, 0, 0); pose.driftRel.set(0, 0, 0); pose.tiltRel.set(0, 0, 0); pose.relax = 0;
  hitT = 0; glow = 0; busy = 0; lookX = 0; lookY = 0; calmT = 0; calm = 1; jumpMax = 0;
  press.down = false; press.touched = false; press.rotating = false; press.hasPrev = false; press.e.set(0, 0, 0);
  view.yaw = 0; view.pitch = 0; view.homing = false;
  faceKey = ''; cv.classList.remove('held');
}
// 종 고르기. animate = 목록 칸에서 가운데로 떠오르는 움직임을 보여 줄지
function selectKind(id, animate) {
  const k = KIND_BY_ID[id];
  if (!k) return false;
  activeId = null;
  const tNow = performance.now()/1000, it = listItems[k.i], listS0 = LIST_S;
  let from = null;
  if (animate && mode === 'list') {   // 바뀌기 전 칸 자리를 화면 좌표로 적어 둠 (무대 크기가 바뀌어도 그 자리에서 출발)
    const cr = cv.getBoundingClientRect();
    from = cells.map(c => ({x: c.x + cr.left, y: c.y + cr.top, w: c.w, h: c.h}));
  }
  trans = null;
  mode = 'play';
  applyKind(k); resetPlay();
  applyLayout(); resize();
  if (from) {
    const cr = cv.getBoundingClientRect();
    trans = {i: k.i, t0: tNow, listS: listS0, finalS: anchor.scale.x, from: from.map(r => ({x: r.x - cr.left, y: r.y - cr.top, w: r.w, h: r.h}))};
    // 목록에서 보이던 모습에서 이어지게: 숨쉬기 박자 · 살짝 돈 각도를 그대로 넘겨받고, 각도는 부드럽게 정면으로
    simTime = tNow*it.rate + it.ph/BODY.breath[0]; blinkStart = -9; nextBlink = simTime + 1.5;
    view.yaw = it.yaw; view.homing = true; applyView();
    renderAll(tNow);
  }
  return true;
}
// 목록으로 돌아가기
function back() {
  if (mode !== 'play') return false;
  if (press.down) pointerUp();
  activeId = null;
  trans = null; mode = 'list'; listPopT0 = performance.now()/1000;
  applyLayout(); resize();
  return true;
}
$('backBtn').addEventListener('click', back);
applyKind(KINDS[0]);
sceneReady = true;
new ResizeObserver(resize).observe(stage);
resize();

/* ───────── 손가락 · 마우스 입력 (둘 다 같은 길로 들어옴) ───────── */
let activeId = null;
const localXY = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
// 무대 바깥 여백(화면 가장자리)에서 시작한 손가락도 "빈 곳"으로 받는다 — 마시멜로가 커서 무대 안 빈 곳이 좁기 때문.
// 손잡이 패널 · 「원위치」 · 「목록」 버튼에서 시작한 손가락은 받지 않는다.
document.addEventListener('pointerdown', e => {
  if (activeId !== null) return;      // 손가락 하나만 받음
  if (e.target && e.target.closest && e.target.closest('#panel, #homeBtn, #backBtn')) return;
  if (mode === 'list') {              // 목록 화면: 누른 칸의 마시멜로를 고름
    e.preventDefault();
    const [x, y] = localXY(e);
    const i = cells.findIndex(c => x >= c.x && x < c.x + c.w && y >= c.y && y < c.y + c.h);
    if (i >= 0) selectKind(KIND_IDS[i], true);
    return;
  }
  if (trans) { e.preventDefault(); return; }   // 떠오르는 동안에는 만지지 않음
  activeId = e.pointerId;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  pointerDown(...localXY(e)); e.preventDefault();
});
document.addEventListener('pointermove', e => { if (e.pointerId === activeId) { pointerMove(...localXY(e)); e.preventDefault(); } });
const endPointer = e => { if (e.pointerId === activeId) { activeId = null; pointerUp(); } };
document.addEventListener('pointerup', endPointer);
document.addEventListener('pointercancel', endPointer);
cv.addEventListener('contextmenu', e => e.preventDefault());

/* ───────── 매 프레임 ───────── */
let last = performance.now(), fps = 60;
function frame(now) {
  const raw = (now - last)/1000; last = now;
  if (raw > 0) fps += (1/raw - fps)*.05;
  if (mode === 'play') {               // 목록 화면에서는 눌림 계산을 하지 않음 (그리기만)
    advance(clamp(raw, .001, .033));
    floatY = FLOAT.amp*Math.sin(now/1000*FLOAT.speed);   // 공중에서 둥실 (3.5cm · 약 5.7초에 한 번)
    if (!trans) anchor.position.y = CY*(1 - anchor.scale.y) + floatY;
  }
  renderAll(now/1000);
  requestAnimationFrame(frame);
}
advance(1/60); renderAll(performance.now()/1000);
requestAnimationFrame(frame);

/* ───────── 검사용 손잡이 (화면 없는 크롬에서 눌러 보고 재기) ─────────
   좌표는 전부 캔버스 왼쪽 위에서 잰 px. state().center 가 마시멜로 한가운데 좌표. */
function projectPx(v) {
  v.project(camera);
  return {x: (v.x + 1)/2*cv.clientWidth, y: (1 - v.y)/2*cv.clientHeight};
}
// 몸 자체 좌표의 한 점이 지금 화면 어디에 보이나 (크기 · 돌리기 반영, 숨쉬기는 제외)
function toScreen(x, y, z) {
  tmpV.set(x, y - CY, z).applyQuaternion(pivot.quaternion); tmpV.y += CY;
  anchor.localToWorld(tmpV);
  return projectPx(tmpV);
}
function state() {
  let maxDisp = 0, sum = 0, minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (let v = 0; v < NW; v++) {
    const a = v*3, d = Math.hypot(pos[a]-rest[a], pos[a+1]-rest[a+1], pos[a+2]-rest[a+2]);
    if (d > maxDisp) maxDisp = d; sum += d;
    if (pos[a] < minX) minX = pos[a]; if (pos[a] > maxX) maxX = pos[a];
    if (pos[a+1] < minY) minY = pos[a+1]; if (pos[a+1] > maxY) maxY = pos[a+1];
  }
  // 뒤집힌 세모 조각 수: 원래 모양에서의 바깥 방향과 지금 방향이 반대인 것
  let flipped = 0; const o = [0, 0, 0];
  for (let t = 0; t < NT; t++) {
    triNormal(pos, t, o);
    if (o[0]*restFN[t*3] + o[1]*restFN[t*3 + 1] + o[2]*restFN[t*3 + 2] < 0) flipped++;
  }
  // 이음매 · 꼭짓점: 얼굴 겉면에서 같은 자리에 겹쳐 있어야 할 점들이 몸 겉면의 제 짝과 얼마나 벌어졌나 (자리 · 바깥 방향 중 큰 값)
  let seamGap = 0;
  for (let v = 0; v < NF; v++) {
    const a = v*3, w = f2w[v]*3;
    const g = Math.max(Math.hypot(fPos[a]-pos[w], fPos[a+1]-pos[w+1], fPos[a+2]-pos[w+2]), Math.hypot(fNrm[a]-nrm[w], fNrm[a+1]-nrm[w+1], fNrm[a+2]-nrm[w+2]));
    if (g > seamGap) seamGap = g;
  }
  const maxJump = jumpMax; jumpMax = 0;   // 부르고 나면 0부터 다시 셈
  // 가만히 있을 때 화면에서 차지하는 폭: 돌리지 않은 몸의 왼쪽 끝 ~ 오른쪽 끝
  const sL = projectPx(anchor.localToWorld(tmpV.set(-BODY.r, CY, 0))).x, sR = projectPx(anchor.localToWorld(tmpV.set(BODY.r, CY, 0))).x;
  return {
    held: press.down && press.touched, hit: Math.min(1, hitT*1.6),
    maxDisp, meanDisp: sum/NW,                // 원래 자리에서 벗어난 정도 (가장 큰 값 · 평균) — 몸 자체 좌표로 잼. 돌리기 · 크기 · 숨쉬기 · 둥실은 제외
    width: maxX - minX, height: maxY - minY,  // 지금 몸의 폭 · 높이 (원래 1.1 · 1.0, 몸 자체 좌표)
    flipped,                                  // 뒤집힌 세모 조각 수 (0이어야 함)
    maxJump,                                  // 지난번 state() 뒤로 한 프레임 사이 가장 많이 움직인 점의 거리
    seamGap,                                  // 이음매 · 꼭짓점이 벌어진 정도 (붙인 겉면이라 항상 0)
    sidePanel: sidePanelShown(),              // 옆 손잡이 창이 보이는지
    skin,                                     // 겉면: 'plain'(기존) · 'powder'(가루)
    drift: driftNow,                          // 몸 가운데가 원래 자리에서 옮겨진 거리
    stretch: stretchNow,                      // 가장 많이 늘어나 있는 갈래의 거리
    squash: sqX, swayX: swX, swayZ: swzX,     // 숨쉬기 값
    yaw: view.yaw, pitch: view.pitch,         // 지금 돌린 각도(라디안)
    rotating: press.down && press.rotating,   // 빈 곳을 잡고 돌리는 중인가
    scale: P.scale, viewFit: view.fit,        // 크기 배수 · 무대가 좁아 줄인 비율(보통 1)
    preset,                                   // 'B' · 'C' · null
    blush: glow, smile: smileOf(glow), surprise: 0,
    screenW: sR - sL,
    fps: Math.round(fps), verts: NW,          // verts = 계산하는 점 수
    params: {...P}, knobs: {...knob},
    center: toScreen(0, BODY.h/2, 0), top: toScreen(0, BODY.h, 0), side: toScreen(BODY.r*.9, BODY.h/2, 0),
    bottom: toScreen(pos[POLE_B*3], pos[POLE_B*3 + 1], pos[POLE_B*3 + 2]), // 밑면 가운데가 지금 있는 곳
    mode,                                     // 'list'(여섯 종 목록) · 'play'(하나를 골라 만지는 중)
    kind: mode === 'play' ? curKind.id : null,   // 고른 종 id (목록이면 null)
    kinds: KIND_IDS.slice(),                  // 종 id 목록
    rising: !!trans,                          // 고른 마시멜로가 가운데로 떠오르는 중인가
    // 목록 화면에서 종마다 차지하는 칸 (누르면 그 종을 고르는 네모, 캔버스 왼쪽 위 기준 px). 만지는 화면에서는 빈 목록
    items: mode === 'list' ? cells.map((c, i) => ({id: KIND_IDS[i], x: Math.round(c.x), y: Math.round(c.y), w: Math.round(c.w), h: Math.round(c.h)})) : [],
  };
}
const canTouch = () => mode === 'play' && !trans;   // 만지기 함수가 동작하는 때 (목록 · 떠오르는 중에는 아무 일도 하지 않음)
window.__SQ_TEST__ = {
  state,
  press(x, y) { return canTouch() ? pointerDown(x, y) : false; },
  drag(x1, y1, x2, y2, ms = 300) {
    if (!canTouch()) return Promise.resolve(state());
    return new Promise(res => {
      pointerDown(x1, y1);
      const t0 = performance.now();
      (function go() {
        const u = Math.min(1, (performance.now() - t0)/ms);
        pointerMove(x1 + (x2 - x1)*u, y1 + (y2 - y1)*u);
        if (u < 1) setTimeout(go, 16); else res(state());
      })();
    });
  },
  move(x, y) { if (canTouch()) pointerMove(x, y); },
  release() { if (canTouch()) pointerUp(); return state(); },
  step(ms = 1000) {   // 시간을 강제로 흘려보내기 (목록 화면에서는 그리기만)
    if (!canTouch()) { renderAll(performance.now()/1000); return state(); }
    for (let t = 0; t < ms; t += 1000/60) advance(1/60); renderer.render(scene, camera); return state();
  },
  select(id) { selectKind(id, false); return state(); },   // 그 종을 바로 고름 (떠오르는 움직임 없이)
  back() { back(); return state(); },                      // 목록으로
  setKnobs(o) {
    o = o || {};
    for (const [key] of KNOB_IDS) if (o[key] !== undefined) { knob[key] = o[key]; if (FEEL_KEYS.includes(key)) preset = null; }
    applyKnobs(); return {...P};
  },
  setPreset(name) { setPreset(name); return {...knob}; },
  setView(yaw, pitch) {   // 바로 그 각도로
    if (!canTouch()) return state();
    view.yaw = Number(yaw) || 0; view.pitch = clamp(Number(pitch) || 0, -PITCH_MAX, PITCH_MAX); view.homing = false;
    applyView(); renderer.render(scene, camera); return state();
  },
  front() { if (canTouch()) goHome(); return state(); },   // 「원위치」와 같은 일 (부드럽게 — step()으로 시간을 흘리면 돌아옴)
};
</script>
</body>
