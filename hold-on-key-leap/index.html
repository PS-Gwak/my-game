<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>멀리뛰기</title>
<style>
  /* 화면에는 손바닥만 한 기기 하나만 있다: 몸통 안에 검은 화면, 그 아래 큰 키캡 하나, 맨 아래 오돌토돌한 띠.
     크기와 자리는 스크립트가 창 크기에 맞춰 정한다. 글씨와 테두리는 전부 캔버스(그림 종이)에 칸으로 찍는다 */
  :root { --black: #000000; --white: #f2f2f2; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--black); color: var(--white);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  /* 창 전체를 차지하는 받침대: 기기 몸통을 가로 · 세로 가운데에 올려 둔다 */
  main {
    width: 100vw; height: 100vh; height: 100dvh;
    display: flex; align-items: center; justify-content: center;
  }
  /* 기기 몸통: 겉모양(둥근 위 · 깎인 아래 · 몸통 색)은 안쪽 그림(#bodyArt)이 그린다 */
  .device-e { position: relative; flex: none; line-height: 0; }
  .body-art { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  .screen { position: absolute; display: block; image-rendering: pixelated; background: var(--black); }
  .grip { position: absolute; display: block; image-rendering: pixelated; pointer-events: none; }
  /* 몸통 위 띠의 작은 점 글씨 버튼 넷: 왼쪽 게임(123456) · 오른쪽 소리 → 키캡 → 몸통 색 */
  .corner-btn {
    position: absolute; top: 10px; padding: 0; margin: 0; border: 0; background: transparent;
    line-height: 0; cursor: pointer; touch-action: none; outline: none;
  }
  .corner-btn canvas { display: block; image-rendering: pixelated; }
  /* 키캡: 진짜 키보드 키처럼 누르면 들어가고 떼면 올라온다 */
  .key {
    position: absolute; padding: 0; margin: 0; border: 0; background: transparent;
    line-height: 0; cursor: pointer; touch-action: none; outline: none;
  }
  .key canvas { display: block; image-rendering: pixelated; }
  /* 화면에는 안 보이는 글자: 읽어 주는 기능 · 검사기가 버튼 글을 읽을 수 있게 남겨 둔다 */
  .ghost { position: absolute; left: 0; top: 0; width: 100%; height: 100%; color: transparent; overflow: hidden; white-space: nowrap; pointer-events: none; line-height: 1; }
</style>
</head>
<body>
<main id="main">
  <div class="device-e" id="deviceE">
    <svg class="body-art" id="bodyArt" aria-hidden="true"><path id="bodyFill"></path><path id="bodyLine" fill="none"></path></svg>
    <button class="corner-btn game-btn" id="gameBtn" type="button" tabindex="-1"><canvas id="gameCanvas"></canvas><span class="ghost" id="gameLabel">게임 6 멀리뛰기</span></button>
    <button class="corner-btn sound-btn" id="soundBtn" type="button" tabindex="-1"><canvas id="soundCanvas"></canvas><span class="ghost" id="soundLabel">소리 1</span></button>
    <button class="corner-btn cap-btn" id="capBtn" type="button" tabindex="-1"><canvas id="capCanvas"></canvas><span class="ghost" id="capLabel">키캡 smooth</span></button>
    <button class="corner-btn skin-btn" id="skinBtn" type="button" tabindex="-1"><canvas id="skinCanvas"></canvas><span class="ghost" id="skinLabel">몸통 gray</span></button>
    <canvas class="screen" id="screen" aria-label="멀리뛰기"></canvas>
    <button class="key" id="keyPush" type="button" tabindex="-1"><canvas id="keyPushCanvas"></canvas><span class="ghost">누르고 있기</span></button>
    <canvas class="grip" id="grip"></canvas>
  </div>
</main>
<script>
/* 멀리뛰기 — 키캡을 누르는 순간 도움닫기 세 걸음, 구름판에서 뛰어오르고, 누르고 있는 동안 계속 난다. 떼는 순간 떨어진다.
   비유: 숨 참기 대회. 오래 버틴 사람이 멀리 간다. 날수록 빨라져서 5분을 버티면 지구를 한 바퀴 돈다.
   틀(기기 모양 · 4:3 화면 · 몸통 색 · 게임 버튼 · 소리 · 키캡 그림)은 여섯 게임이 같고, 화면 속 그림과 규칙만 이 게임 것이다. */
(function () {
  'use strict';

  const W = 128;          // 그림판 가로 칸 수
  const ROWS = 96;        // 그림판 세로 칸 수(4:3 화면 하나뿐)
  const BASE_H = 64;      // 풍경 · 사람 자리를 처음 짠 기준 세로 칸 수. 그보다 늘어난 칸은 하늘과 땅에 나눠 준다
  const BG = '#000000', INK = '#f2f2f2';
  const KEYS = {
    best: 'hold-on-key-leap-best',     // 최고 기록(미터)
  };
  const SKIN_KEY = 'hold-on-keys-skin';     // 고른 몸통 색(0~3). 여섯 게임이 함께 쓴다
  const CAP_KEY = 'hold-on-keys-cap';       // 고른 키캡 그림(0 도트 · 1 매끈 · 2 스위치 · 3 납작). 여섯 게임이 함께 쓴다
  const mod = (a, n) => ((a % n) + n) % n; // 음수도 0 ~ n-1로 돌려준다

// === KEY-SHARED 여기부터 ===
  /* ---------- 키캡 효과음(여섯 벌, 코드로 만든 소리) ----------
     비유: 작은 드럼. 「딸깍」 = 짧은 잡음(스위치 부딪는 소리) + 짧은 음(키캡 통 울림)을 섞어 0.1초 안에 사라지게 한다.
     형님이 고른 키보드 소리 여섯 개의 길이 · 음색을 재서 닮게 맞춘 것이고, 녹음 파일은 쓰지 않는다.
     set = [잡음 걸러 듣기 종류, 잡음 중심 Hz, 잡음 폭 Q, 잡음 길이 초, 잡음 세기, 통 울림 Hz, 통 울림 길이 초, 통 울림 세기, 전체 세기] */
  const KeySound = (() => {
    const KEY = 'hold-on-keys-sound';
    const SETS = [
      ['bandpass', 2000, 1.0, 0.22, 0.9, 1330, 0.10, 0.40, 0.8],  // 1 또렷한 딸깍
      ['bandpass', 6800, 0.8, 0.26, 1.0, 5200, 0.04, 0.15, 0.7],  // 2 높고 날카로운 틱
      ['bandpass', 3600, 0.8, 0.22, 0.6, 90, 0.12, 0.45, 0.7],    // 3 가볍게 톡 + 낮은 울림
      ['bandpass', 2600, 0.9, 0.16, 0.9, 145, 0.10, 0.50, 0.8],   // 4 도톰한 톡(thock)
      ['bandpass', 1500, 0.9, 0.19, 0.9, 110, 0.13, 0.70, 0.8],   // 5 가장 낮고 묵직한 툭
      ['bandpass', 1000, 1.2, 0.19, 0.7, 900, 0.09, 0.50, 0.55],  // 6 먹먹한 톡
    ];
    let ac = null, noise = null, index = 1; // 0 = 끔, 1~6
    try { const v = Number(localStorage.getItem(KEY)); if (Number.isInteger(v) && v >= 0 && v <= SETS.length && localStorage.getItem(KEY) !== null) index = v; } catch (e) { /* 저장소가 막혀도 그대로 */ }
    function ctx() {
      if (!ac) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ac = new AC(); }
      if (ac.state === 'suspended') ac.resume();
      if (!noise) { // 흰 잡음 0.25초를 한 번만 만들어 두고 돌려쓴다
        noise = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.25), ac.sampleRate);
        const d = noise.getChannelData(0); let s = 12345;
        for (let i = 0; i < d.length; i += 1) { s = (s * 1103515245 + 12345) & 0x7fffffff; d[i] = s / 0x3fffffff - 1; }
      }
      return ac;
    }
    // 한 번 치기. up = 손을 뗄 때(조금 높고 작게)
    function hit(set, up, c = ctx(), dest = c && c.destination) {
      if (!c) return;
      const [type, f, q, nd, ng, bf, bd, bg, vol] = set, t = c.currentTime + 0.001, k = up ? 0.45 : 1, pitch = up ? 1.3 : 1;
      const src = c.createBufferSource(); src.buffer = noise;
      const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.value = f * pitch; fl.Q.value = q;
      const g1 = c.createGain(); g1.gain.setValueAtTime(0.0001, t); g1.gain.exponentialRampToValueAtTime(ng * vol * k, t + 0.002); g1.gain.exponentialRampToValueAtTime(0.0001, t + nd);
      src.connect(fl); fl.connect(g1); g1.connect(dest); src.start(t); src.stop(t + nd + 0.02);
      const osc = c.createOscillator(); osc.type = bf < 300 ? 'sine' : 'triangle';
      osc.frequency.setValueAtTime(bf * pitch, t); osc.frequency.exponentialRampToValueAtTime(bf * pitch * 0.7, t + bd);
      const g2 = c.createGain(); g2.gain.setValueAtTime(0.0001, t); g2.gain.exponentialRampToValueAtTime(bg * vol * k, t + 0.003); g2.gain.exponentialRampToValueAtTime(0.0001, t + bd);
      osc.connect(g2); g2.connect(dest); osc.start(t); osc.stop(t + bd + 0.02);
    }
    return {
      count: SETS.length, sets: SETS, hit,
      get index() { return index; },
      set(i) { index = Math.max(0, Math.min(SETS.length, Math.floor(Number(i)) || 0)); try { localStorage.setItem(KEY, String(index)); } catch (e) { /* 메모리에만 */ } return index; },
      next() { this.set((index + 1) % (SETS.length + 1)); if (index) hit(SETS[index - 1], false); return index; }, // 고르면 그 소리를 한 번 들려준다
      down() { if (index) hit(SETS[index - 1], false); },
      up() { if (index) hit(SETS[index - 1], true); },
      unlock: ctx, // 폰은 손가락이 닿은 뒤에야 소리가 난다 → 첫 누름에서 불러 준다
    };
  })();

  /* ---------- 키캡 그림(도트 말고 세 가지) ----------
     style 1 = 매끈한 플라스틱 키캡 · 2 = 스위치가 비치는 투명 키(본보기 기기) · 3 = 납작한 미니멀. (0 = 도트는 각 게임의 예전 그림 그대로)
     draw(): 키 캔버스(한 변 n 기기 점)에 키를 그리고, 아이콘을 놓을 자리(윗면 가운데 cx · cy, 크기 s)를 돌려준다.
     icon(): 그 자리에 매끈한 아이콘을 그린다 — 'gun' 권총 · 'RE' · 'footL' 왼발 · 'footR' 오른발(엄지발가락과 발바닥 패인 곳이 안쪽) */
  const KeyArt = {
    names: ['dot', 'smooth', 'switch', 'flat'],
    rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); },
    draw(c, n, style, down) {
      const u = n / 20, rr = this.rr;
      c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, n, n); c.lineJoin = 'round';
      if (style === 1) { // 매끈한 플라스틱: 바닥 그림자 → 옆면(치마) → 윗면. 누르면 윗면이 내려가고 치마가 짧아진다
        const d = down ? 1.7 * u : 0;
        rr(c, 1 * u, 2.2 * u, 18 * u, 17.3 * u, 3.2 * u); c.fillStyle = 'rgba(0,0,0,0.28)'; c.fill();
        let g = c.createLinearGradient(0, 2 * u, 0, 19 * u); g.addColorStop(0, '#c4c4c4'); g.addColorStop(1, '#8a8a8a');
        rr(c, 1.2 * u, 1.4 * u + d, 17.6 * u, 17.2 * u - d, 3 * u); c.fillStyle = g; c.fill(); c.lineWidth = 0.45 * u; c.strokeStyle = '#2a2a2a'; c.stroke();
        g = c.createLinearGradient(0, 2 * u + d, 0, 15 * u + d); g.addColorStop(0, '#ffffff'); g.addColorStop(1, down ? '#dcdcdc' : '#ececec');
        rr(c, 3 * u, 2.4 * u + d, 14 * u, 12.2 * u, 2.4 * u); c.fillStyle = g; c.fill(); c.lineWidth = 0.35 * u; c.strokeStyle = '#555'; c.stroke();
        return { cx: n / 2, cy: 8.5 * u + d, s: 8 * u };
      }
      if (style === 2) { // 투명 키: 어두운 스위치 판 → 밝은 스위치 몸 + 십자 축 → 그 위에 비치는 투명 캡. 누르면 캡이 작아지며 내려간다
        rr(c, 0.8 * u, 0.8 * u, 18.4 * u, 18.4 * u, 2.6 * u); c.fillStyle = '#2c2c2c'; c.fill();
        rr(c, 3.4 * u, 3.4 * u, 13.2 * u, 13.2 * u, 1.6 * u); c.fillStyle = '#e4e4e4'; c.fill();
        c.fillStyle = '#b4b4b4'; rr(c, 8.6 * u, 6 * u, 2.8 * u, 8 * u, 0.6 * u); c.fill(); rr(c, 6 * u, 8.6 * u, 8 * u, 2.8 * u, 0.6 * u); c.fill();
        const m = down ? 2.3 * u : 1.4 * u;
        rr(c, m, m + (down ? 0.6 * u : 0), n - 2 * m, n - 2 * m, 2.8 * u); c.fillStyle = down ? 'rgba(255,255,255,0.26)' : 'rgba(255,255,255,0.40)'; c.fill();
        c.lineWidth = 0.5 * u; c.strokeStyle = 'rgba(255,255,255,0.92)'; c.stroke();
        c.beginPath(); c.moveTo(m + 2.2 * u, m + 1.8 * u); c.lineTo(n - m - 5 * u, m + 1.8 * u); c.lineWidth = 0.7 * u; c.lineCap = 'round'; c.strokeStyle = 'rgba(255,255,255,0.75)'; c.stroke();
        return { cx: n / 2, cy: n / 2 + (down ? 0.6 * u : 0), s: 8 * u };
      }
      // 납작: 흰 면 + 검은 테두리 + 아래 딱딱한 그림자. 누르면 그림자 자리로 내려앉는다
      const d = down ? 1.3 * u : 0;
      if (!down) { rr(c, 1.3 * u, 2.6 * u, 17.4 * u, 16.4 * u, 3.4 * u); c.fillStyle = '#111'; c.fill(); }
      rr(c, 1.3 * u, 1.2 * u + d, 17.4 * u, 16.4 * u, 3.4 * u); c.fillStyle = down ? '#d6d6d6' : '#fafafa'; c.fill(); c.lineWidth = 0.9 * u; c.strokeStyle = '#111'; c.stroke();
      return { cx: n / 2, cy: 9.4 * u + d, s: 8.5 * u };
    },
    icon(c, kind, cx, cy, s, color = '#111') {
      if (!kind) return;
      c.save(); c.translate(cx, cy); c.fillStyle = color; c.strokeStyle = color; c.lineJoin = 'round'; c.lineCap = 'round';
      if (kind === 'RE') {
        c.font = `800 ${Math.round(s * 0.62)}px -apple-system, "Helvetica Neue", Arial, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('RE', 0, s * 0.03);
      } else if (kind === 'gun') { // 옆에서 본 리볼버: 총열 → 탄창 → 손잡이 → 방아쇠울
        const k = s / 10; c.beginPath();
        c.moveTo(-5 * k, -2.6 * k); c.lineTo(4.6 * k, -2.6 * k); c.lineTo(4.6 * k, -0.9 * k); c.lineTo(0.6 * k, -0.9 * k); c.lineTo(0.6 * k, 0.2 * k);
        c.lineTo(-1.2 * k, 0.2 * k); c.lineTo(-2.4 * k, 3.6 * k); c.lineTo(-4.9 * k, 3.6 * k); c.lineTo(-3.9 * k, -0.2 * k); c.lineTo(-5 * k, -0.6 * k); c.closePath(); c.fill();
        c.beginPath(); c.arc(-0.2 * k, 1.2 * k, 1.25 * k, 0.1, Math.PI * 0.95); c.lineWidth = 0.55 * k; c.stroke();
        c.fillRect(3.9 * k, -3.4 * k, 0.7 * k, 0.9 * k);
      } else if (kind === 'footL' || kind === 'footR') { // 발바닥: 뒤꿈치 → 패인 아치(안쪽) → 볼 + 발가락 다섯(엄지가 안쪽 · 가장 큼)
        const k = s / 10, inner = kind === 'footL' ? 1 : -1; // 왼발의 안쪽 = 오른쪽
        c.scale(inner, 1);
        c.beginPath();
        c.moveTo(-0.2 * k, 4.6 * k);
        c.bezierCurveTo(-2.2 * k, 4.6 * k, -2.5 * k, 2.4 * k, -2.2 * k, 0.6 * k);   // 바깥쪽 선(곧게)
        c.bezierCurveTo(-2.4 * k, -1.2 * k, -1.6 * k, -2.2 * k, 0.2 * k, -2.2 * k);   // 볼 위쪽
        c.bezierCurveTo(2 * k, -2.2 * k, 2.6 * k, -1.2 * k, 2.2 * k, 0.2 * k);        // 볼 안쪽
        c.bezierCurveTo(1.9 * k, 1.2 * k, 0.7 * k, 1.5 * k, 0.9 * k, 2.6 * k);        // 패인 아치
        c.bezierCurveTo(1.2 * k, 3.8 * k, 1 * k, 4.6 * k, -0.2 * k, 4.6 * k);         // 뒤꿈치
        c.closePath(); c.fill();
        const toes = [[1.75, -3.55, 0.95], [0.25, -4.05, 0.72], [-0.85, -3.75, 0.62], [-1.75, -3.2, 0.55], [-2.45, -2.4, 0.48]];
        for (const [x, y, r] of toes) { c.beginPath(); c.arc(x * k, y * k, r * k, 0, Math.PI * 2); c.fill(); }
      }
      c.restore();
    },
  };
// === KEY-SHARED 여기까지 ===

  /* ==========================================================================
     숫자 표 — 게임 느낌을 바꾸고 싶으면 여기만 고치면 된다
     ========================================================================== */
  const LAP_M = 40075000;   // 지구 한 바퀴(미터) = 40,075km
  const RUNUP_MS = 900;     // 도움닫기 시간(누른 순간부터 구름판에서 뛰어오를 때까지)
  const RUNUP_STEPS = 3;    // 도움닫기 걸음 수
  const FALL_MS = 450;      // 손을 뗀 뒤 땅에 닿을 때까지 떨어지는 시간
  const IGNORE_MS = 800;    // 착지 뒤 이만큼은 누름을 무시(실수로 바로 새 판이 시작되지 않게)
  const STALL_MS = 1000;    // 화면이 이만큼 넘게 멈춰 있었으면(창이 가려짐 · 잠자기) 그 판은 멈추기 직전에 뗀 것으로 끝낸다

  // 가속 곡선: [누른 지 몇 초, 그때까지 날아간 거리(미터)]. 점과 점 사이는 부드럽게 이어진다.
  // 비유: 지도에 꽂은 깃발들. 깃발 숫자만 바꾸면 그 사이 길은 알아서 매끄럽게 다시 그려진다.
  // 마지막 줄(5분 = 한 바퀴) 뒤로는 그때 속도 그대로 계속 난다(한 바퀴에 약 68초)
  const CURVE = [
    [2, 10],            // 첫 1초 남짓은 진짜 멀리뛰기 속도(초속 9m쯤)
    [5, 40],
    [10, 120],
    [20, 800],
    [30, 5000],         // 30초 = 5km
    [60, 100000],       // 1분 = 100km
    [120, 1200000],     // 2분 = 1,200km
    [180, 5000000],     // 3분 = 5,000km
    [240, 15000000],    // 4분 = 15,000km
    [300, LAP_M],       // 5분 = 지구 한 바퀴
  ];

  /* ---------- 거리 계산 ----------
     비유: 깃발(CURVE) 사이를 잇는 매끄러운 길. 길은 「시간이 몇 배면 거리가 몇 배」(로그 눈금)로 이어서,
     처음의 미터 단위와 나중의 수만 km 단위를 한 줄로 부드럽게 잇는다. 깃발 자리에서는 정확히 그 거리가 된다 */
  const curve = (() => {
    const fs = CURVE.map(([t]) => t - RUNUP_MS / 1000); // 날기 시작한 뒤로 센 시간
    const ds = CURVE.map(([, d]) => d);
    const xs = fs.map(Math.log), ys = ds.map(Math.log), n = xs.length;
    const h = [], dl = [];
    for (let i = 0; i < n - 1; i += 1) { h.push(xs[i + 1] - xs[i]); dl.push((ys[i + 1] - ys[i]) / h[i]); }
    // 깃발마다 길의 기울기: 양옆 기울기의 가운데쯤(뒤로 가는 일이 없게 하는 정해진 방법)
    const m = new Array(n);
    m[0] = Math.min(1, 3 * dl[0]); // 첫 깃발 앞은 일정한 속도(멀리뛰기 속도)라 그 기울기에 맞춘다
    m[n - 1] = dl[n - 2];
    for (let i = 1; i < n - 1; i += 1) {
      if (dl[i - 1] <= 0 || dl[i] <= 0) { m[i] = 0; continue; }
      const w1 = 2 * h[i] + h[i - 1], w2 = h[i] + 2 * h[i - 1];
      m[i] = (w1 + w2) / (w1 / dl[i - 1] + w2 / dl[i]);

    return { fs, ds, xs, ys, h, m, n, endSpeed: m[n - 1] * ds[n - 1] / fs[n - 1] };

  function distAtFlight(f) {
    const { fs, ds, xs, ys, h, m, n, endSpeed } = curve;
    if (!(f > 0)) return 0;
    if (f <= fs[0]) return ds[0] * f / fs[0];
    if (f >= fs[n - 1]) return ds[n - 1] + endSpeed * (f - fs[n - 1]); // 한 바퀴 뒤로는 그 속도 그대로
    const x = Math.log(f);

    while (i < n - 2 && x > xs[i + 1]) i += 1;
    const s = (x - xs[i]) / h[i], s2 = s * s, s3 = s2 * s;
    const y = (2 * s3 - 3 * s2 + 1) * ys[i] + (s3 - 2 * s2 + s) * h[i] * m[i]
      + (-2 * s3 + 3 * s2) * ys[i + 1] + (s3 - s2) * h[i] * m[i + 1];

  function pixelFrame(ctx, w, h, b, color) {

    ctx.fillRect(b, b, b, b); ctx.fillRect(w - 2 * b, b, b, b); ctx.fillRect(b, h - 2 * b, b, b); ctx.fillRect(w - 2 * b, h - 2 * b, b, b);
  }
  function pixelBlock(ctx, w, h, b, color) {
    ctx.fillStyle = color;
    ctx.fillRect(2 * b, 0, w - 4 * b, h); ctx.fillRect(b, b, w - 2 * b, h - 2 * b); ctx.fillRect(0, 2 * b, w, h - 4 * b);
  }

  // 자리 잡기(기준 화면 64칸일 때의 칸 좌표). 화면이 세로로 길어지면 풍경과 사람은 skyShift 칸만큼 아래로 내린다
  const GROUND_Y = 50;              // 트랙 윗줄(발밑). 100m와 같은 높이
  const RUN_HIP_X = 34;             // 도움닫기 때 사람 허리의 가로 자리(화면 왼쪽)
  const FLY_HIP_X = 62, FLY_HIP_Y = 31; // 날 때 사람 허리 자리(화면 가운데쯤)
  const BOARD_X = RUN_HIP_X + RUNUP_PX + 3; // 구름판: 세 걸음 뒤 발이 닿는 곳
  const PIT_X = BOARD_X + 5, PIT_W = 44;    // 모래판
  const CLOUDS = [[84, 5, CLOUD_A], [101, 9, CLOUD_B], [118, 6, CLOUD_C]];
  const TEXT_X = 3, TEXT_Y = 3;     // 왼쪽 위 큰 숫자 자리
  // 하늘을 스치는 것들: [그림 장들, 세로 자리, 늘어난 하늘 몫, 배경보다 느린 정도, 한 바퀴 칸 수, 날기 시작한 지 몇 초부터, 사람보다 앞에(구름 아래로 내려다보이게)]
  const FLYERS = [
    [BIRD, 26, 0.5, 0.5, 260, 6, false],
    [BIRD, 37, 0.8, 0.6, 340, 14, false],
    [[CLOUD_A], 41, 1, 0.7, 210, 25, true],   // 발아래로 지나가는 구름(구름 위로 올라온 느낌)
    [[CLOUD_B], 42, 1, 0.7, 290, 32, true],
    [[PLANE], 22, 0.4, 0.35, 520, 45, false],
    [[SATELLITE], 21, 0.3, 0.2, 460, 180, false],
  ];
  const WIND_ROWS = [22, 34, 28, 39, 25, 31]; // 바람 줄이 지나가는 세로 자리

  /* ---------- 시계: 게임 안의 모든 시간은 이 함수 하나만 읽는다 ----------
     평소 = 실제 시계(performance.now). 검사용 tick()을 부르면 「손으로 돌리는 시계」(manual)로 바뀐다 */
  let manual = null; // 손으로 돌리는 시계의 지금 값(null = 실제 시계)
  const now = () => (manual !== null ? manual : performance.now());

  /* ---------- 상태 ---------- */
  let skin = loadSkin();
  let cap = loadCap();       // 키캡 그림(0 도트 · 1 매끈 · 2 스위치 · 3 납작)
  let best = loadBest();     // 최고 기록(미터). 없으면 0
  let phase = 'ready';       // 'ready' 준비 · 'runup' 도움닫기 · 'fly' 나는 중 · 'fall' 떨어지는 중 · 'landed' 착지(기록 화면)
  let pressT = 0;            // 키캡을 누른 시각
  let releaseT = 0;          // 손을 뗀 시각
  let landedAt = -Infinity;  // 땅에 닿은 시각(0.8초 무시용)
  let endRunMs = 0;          // 손을 뗐을 때까지 도움닫기한 시간
  let endF = 0;              // 손을 뗐을 때까지 난 시간(초)
  let record = null;         // 이번 판 기록(미터)
  const holding = () => phase === 'runup' || phase === 'fly';

  /* ---------- 규칙: 누르기 · 떼기 · 시간이 흘러 생기는 일 ---------- */
  // 시간이 흘러 저절로 바뀌는 것: 도움닫기 0.9초 → 날기, 떨어지기 0.45초 → 착지
  function settle(t) {
    if (phase === 'runup' && t - pressT >= RUNUP_MS) phase = 'fly';
    if (phase === 'fall' && t - releaseT >= FALL_MS) { phase = 'landed'; landedAt = releaseT + FALL_MS; syncText(); }
  }
  // 키캡을 누른 순간. 새 판이 시작됐으면 true(떨어지는 중 · 착지 0.8초 안에는 무시)
  function grab(t) {
    settle(t);
    if (phase !== 'ready' && !(phase === 'landed' && t - landedAt >= IGNORE_MS)) return false;
    phase = 'runup'; pressT = t; record = null; endRunMs = 0; endF = 0;
    syncText(); render(); startLoop();
    return true;
  }
  // 키캡에서 손이 떨어진 순간(뗌 · 미끄러짐 · 창 가려짐 모두 여기로). 그 자리에서 판이 끝난다
  function letGo(t) {
    settle(t);
    if (!holding()) return false;
    releaseT = t;
    if (phase === 'runup') {
      // 도움닫기 중에 뗌: 모래판 앞에 철퍼덕, 기록 0
      endRunMs = Math.max(0, Math.min(RUNUP_MS, t - pressT)); endF = 0; record = 0;
      phase = 'landed'; landedAt = t;
    } else {
      endRunMs = RUNUP_MS; endF = Math.max(0, (t - pressT - RUNUP_MS) / 1000);
      record = distAtFlight(endF);
      phase = 'fall';
      if (record > best) { best = record; saveBest(best); }
    }
    syncText(); render(); startLoop();
    return true;
  }

  // 지금 그릴 장면의 숫자들: 도움닫기한 시간 · 난 시간 · 거리 · 배경이 흘러간 칸 수 · 땅이 내려간 칸 수
  const smooth = (k) => k * k * (3 - 2 * k);
  function view(t) {
    let runMs = 0, f = 0;
    if (phase === 'runup') runMs = Math.max(0, Math.min(RUNUP_MS, t - pressT));
    else if (phase === 'fly') { runMs = RUNUP_MS; f = Math.max(0, (t - pressT - RUNUP_MS) / 1000); }
    else if (phase === 'fall' || phase === 'landed') { runMs = endRunMs; f = endF; }

    return {
      runMs, f, dist,
      scroll: RUNUP_PX * runMs / RUNUP_MS + uAt(f),
      drop: Math.round(DROP_MAX * smooth(Math.min(1, f / DROP_S))),
      lap: lapOf(dist), scene: sceneIndexAt(dist), pose: poseIndexAt(f),

  }
  // 지금 사람이 하고 있는 몸짓 이름
  function poseNameNow(v) {
    if (phase === 'ready') return 'stand';
    if (phase === 'runup') return 'run';
    if (phase === 'fly') return POSES[v.pose][1];
    if (phase === 'fall') return 'fall';

  }

  /* ---------- 화면 다시 그리기: 움직이는 동안은 그릴 때마다 ---------- */
  function refresh() { settle(now()); render(); }
  let rafId = 0;
  let lastFrame = null; // 바로 앞 그림을 그린 시각(화면이 오래 멈췄는지 알아채는 데 쓴다)
  const animating = (t) => phase === 'runup' || phase === 'fly' || phase === 'fall' || (phase === 'landed' && t - landedAt < 1500);
  const shouldLoop = () => manual === null && !document.hidden && animating(now());
  function loop() {
    rafId = 0;
    if (manual !== null || document.hidden) { lastFrame = null; return; }
    const t = now();
    // 화면이 1초 넘게 멈춰 있었다면(잠자기 · 가려진 창) 그동안 거리가 쌓이지 않게, 멈추기 직전에 뗀 것으로 끝낸다

  }

    lastFrame = null;
    rafId = requestAnimationFrame(loop);
  }

  /* ---------- 키캡 그림 바꾸기(도트 → 매끈 → 스위치 → 납작) ---------- */
  function setCap(n) {
    n = Math.floor(Number(n));
    if (!(n >= 0 && n < KeyArt.names.length)) return false;
    cap = n;
    saveNum(CAP_KEY, n);
    drawCapBtn(); drawKeys();
    return true;

  const nextCap = () => setCap((cap + 1) % KeyArt.names.length);
  // 소리 바꾸기(1 → 2 → … → 6 → 끔 → 1). 고르면 그 소리를 한 번 들려준다
  function nextSound() { KeySound.next(); drawSoundBtn(); }

  /* ---------- 몸통 색 바꾸기 ---------- */
  function setSkin(n) {
    n = Math.floor(Number(n));
    if (!(n >= 0 && n < SKINS.length)) return false;

    saveNum(SKIN_KEY, n);
    fit();
    return true;
  }
  const nextSkin = () => setSkin((skin + 1) % SKINS.length);

  /* ---------- 몸통 위 작은 버튼(점 글씨) ---------- */
  const el = {
    main: document.getElementById('main'),
    deviceE: document.getElementById('deviceE'),
    bodyArt: document.getElementById('bodyArt'), bodyFill: document.getElementById('bodyFill'), bodyLine: document.getElementById('bodyLine'),
    screen: document.getElementById('screen'),
    soundBtn: document.getElementById('soundBtn'), soundCanvas: document.getElementById('soundCanvas'), soundLabel: document.getElementById('soundLabel'),
    capBtn: document.getElementById('capBtn'), capCanvas: document.getElementById('capCanvas'), capLabel: document.getElementById('capLabel'),
    skinBtn: document.getElementById('skinBtn'), skinCanvas: document.getElementById('skinCanvas'), skinLabel: document.getElementById('skinLabel'),
    keyPush: document.getElementById('keyPush'), keyPushCanvas: document.getElementById('keyPushCanvas'),

  };
  const dpr = () => window.devicePixelRatio || 1;

  // 작은 버튼의 한 칸 크기(화면 점 1.5개)
  const cornerCell = () => Math.max(1, Math.round(1.5 * dpr()));
  function sizeCorner(cv, cw, ch) {
    const r = dpr();
    if (cv.width !== cw || cv.height !== ch) { cv.width = cw; cv.height = ch; }
    cv.style.width = `${cw / r}px`; cv.style.height = `${ch / r}px`;
  }

  /* 한 칸짜리 버튼(소리 · 키캡 · 몸통 색): 폭 13칸 = 여백 3 + 상자 7 + 여백 3, 높이 17칸, 상자 7×9칸.
     비유: 같은 틀의 도장 셋. 틀(흰 바탕 + 검은 테두리)은 같고 상자 안 그림만 다르다 */
  const BTN_ROWS = 17, ONE_COLS = 13, ONE_BOX_W = 7, ONE_BOX_H = 9, BTN_GAP = 6; // BTN_GAP = 버튼 사이 화면 점
  function drawOneBtn(cv, labelEl, label, paint) {
    const ctx = cv.getContext('2d'), cc = cornerCell();
    const cw = ONE_COLS * cc, ch = BTN_ROWS * cc;

  }
  // 상자 안 5×7 점 그림(상자 둘레 한 칸 안쪽에 찍는다)
  function boxArt(ctx, bx, by, cc, rows) {

    rows.forEach((row, j) => {

  }
  const SOUND_OFF = ['#...#', '.#.#.', '..#..', '.#.#.', '#...#']; // 소리 끔 = 점 ×
  const CAP_ICONS = [
    ['#####', '#.#.#', '##.##', '#.#.#', '##.##', '#.#.#', '#####'], // 0 도트
    ['.###.', '#####', '#####', '#####', '#####', '#####', '.###.'], // 1 매끈
    ['#####', '#.#.#', '#.#.#', '#####', '#.#.#', '#.#.#', '#####'], // 2 스위치
    ['.###.', '#...#', '#...#', '#...#', '#...#', '#...#', '.###.'], // 3 납작
  ];
  // 소리 버튼: 상자 안에 지금 소리 번호(1~6), 끔이면 ×
  function drawSoundBtn() {
    const i = KeySound.index;
    drawOneBtn(el.soundCanvas, el.soundLabel, i ? `소리 ${i}` : '소리 끔', (ctx, bx, by, cc) => boxArt(ctx, bx, by, cc, i ? GLYPHS[i] : SOUND_OFF));
  }
  // 키캡 버튼: 상자 안에 지금 키캡 그림의 작은 표시
  function drawCapBtn() {
    drawOneBtn(el.capCanvas, el.capLabel, `키캡 ${KeyArt.names[cap]}`, (ctx, bx, by, cc) => boxArt(ctx, bx, by, cc, CAP_ICONS[cap]));
  }
  // 몸통 색 버튼: 상자 하나를 지금 몸통 색으로 칠하고 검은 테두리 한 칸
  function drawSkinBtn() {
    drawOneBtn(el.skinCanvas, el.skinLabel, `몸통 ${SKINS[skin].name}`, (ctx, bx, by, cc) => {
      ctx.fillStyle = BG; ctx.fillRect(bx, by, ONE_BOX_W * cc, ONE_BOX_H * cc);

  }

  /* ---------- 키캡 하나 ----------
     비유: 진짜 키보드 키. 누르는 순간 한 번 받고, 손을 떼기 전까지는 아무리 다른 손가락으로 두드려도 다시 받지 않는다.
     이 게임에서는 「누르고 있는 동안 = 나는 중」, 「키에서 손이 떨어짐 = 그 판 끝」이다.

  const keyHold = { push: null };

  function holdKey(name, who) {
    if (keyHold[name] !== null) return false; // 이미 눌려 있음: 떼기 전엔 다시 받지 않는다
    keyHold[name] = who;
    if (who !== 'test') { KeySound.unlock(); KeySound.down(); } // 누르는 순간 「딸깍」 한 번(검사 손잡이는 조용히)
    grab(now());
    drawKeys();

  }

  function releaseKey(name, who) {

    if (who !== undefined && keyHold[name] !== who) return false;

    keyHold[name] = null;
    if (by !== 'test') KeySound.up(); // 떼는 순간 한 번(누르고 있는 동안에는 소리 없음)

  }

  // 키캡 하나 그리기(20×20칸, 두 색). 바깥 네모 = 스위치 집, 안쪽 작은 네모 = 키 윗면, 그 아래 무늬 띠 = 키 옆면.
  // 누르면 윗면이 3칸 내려가고 옆면이 그만큼 짧아진다(바닥 쪽 끝은 그대로).
  // 키캡 그림이 1~3이면 도트 대신 공용 그림(KeyArt)으로 그린다. 이 게임 키에는 아이콘이 없다
  function drawKey(cv, down) {
    const ctx = cv.getContext('2d'), c = keyCell, n = KEY_CELLS * c;
    if (cap !== 0) { KeyArt.draw(ctx, n, cap, down); return; }
    const R = (x, y, w, h, color) => { ctx.fillStyle = color; ctx.fillRect(x * c, y * c, w * c, h * c); };
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, n, n);
    pixelBlock(ctx, n, n, c, INK);
    pixelFrame(ctx, n, n, c, BG);
    const drop = down ? KEY_PRESS_DROP : 0;
    const capX = 3, capW = 14, topY = 2 + drop, topH = 10;
    const sideY = topY + topH, sideH = 4 - drop; // 옆면 띠(맨 아랫줄은 늘 15번째 줄)
    for (let y = sideY; y < sideY + sideH; y += 1) {

      for (let x = capX + 1; x < capX + capW - 1; x += 1) if ((x + y) % 2 === 0) R(x, y, 1, 1, BG);
    }

    ctx.setTransform(1, 0, 0, 1, capX * c, topY * c);

  }

  // 읽어 주는 기능용 글: 화면 이름표에 지금 상태를 함께 둔다(판이 바뀔 때만 고친다)
  function syncText() {

    if (phase === 'landed') aria = `멀리뛰기, 기록 ${distText(record || 0)}`;
    else if (holding() || phase === 'fall') aria = '멀리뛰기, 나는 중';
    if (el.screen.getAttribute('aria-label') !== aria) el.screen.setAttribute('aria-label', aria);
  }

  /* ---------- 그리기: 128×96칸 작은 판에 찍은 뒤 그대로 키운다 ---------- */
  const g = el.screen.getContext('2d');
  const board = document.createElement('canvas');
  const c = board.getContext('2d');
  let H = 0;         // 지금 검은 화면 세로 칸 수
  let skyShift = 0;  // 기준 그림을 아래로 내리는 칸 수(늘어난 하늘 몫)
  let skyClouds = []; // 늘어난 하늘에 더 띄운 구름 [처음 가로 자리, 세로 자리, 모양]
  const drawn = { distText: '0.00m', bestText: '', lapText: '' }; // 마지막으로 화면에 그린 글자(검사용)

  let ink = null; // 지금 붓 색(같은 색이면 다시 고르지 않아 빠르게)
  let clipL = 0, clipR = W; // 배경 구간을 나눠 그릴 때 쓰는 가로 울타리(이 안에만 찍힌다)
  function dot(x, y, color = INK) {

    c.fillRect(x, y, w, h);

  function sprite(x, y, rows, color = INK, k = 1) {
    rows.forEach((row, j) => {
      for (let i = 0; i < row.length; i += 1) {
        if (row[i] !== '#') continue;
        for (let dy = 0; dy < k; dy += 1) for (let dx = 0; dx < k; dx += 1) dot(x + i * k + dx, y + j * k + dy, color);

    });
  }
  // 둘레를 한 칸 검게 비워서, 뒤 풍경 위에 겹쳐도 또렷하게 보이게 한다
  function spriteWithHalo(x, y, rows) {
    rows.forEach((row, j) => {
      for (let i = 0; i < row.length; i += 1) {
        if (row[i] !== '#') continue;
        for (let dy = -1; dy <= 1; dy += 1) for (let dx = -1; dx <= 1; dx += 1) dot(x + i + dx, y + j + dy, BG);
      }
    });

  }

  // 세로 칸 수가 바뀌면: 그림 전체를 내릴 칸 수 · 늘어난 하늘의 구름을 다시 정한다
  function setRows(rows) {

    board.width = W; board.height = H; ink = null;

    // 원래 구름 줄 위로 SKY_BAND 칸마다 한 층씩, 한 층에 구름 둘
    skyClouds = [];
    for (let k = 1; ; k += 1) {
      const y = skyShift + 5 - SKY_BAND * k;
      if (y < 2) break;
      for (let n = 0; n < 2; n += 1) {
        const [home, wobble, rows2] = SKY_CLOUDS[((k - 1) * 2 + n) % SKY_CLOUDS.length];
        skyClouds.push([home, y + wobble, rows2]);
      }
    }
  }

  // 점 글씨 한 줄을 판에 찍고, 뒤를 검게 비워 풍경이 지나가도 읽히게 한다
  function boardText(keys, x, y, k) {
    const m = measure(keys);
    box(x - 1, y - 1, m.w * k + 2, m.h * k + 2, BG);
    let cx = x;
    keys.forEach((key) => {
      sprite(cx, y, GLYPHS[key], INK, k);
      cx += (GLYPHS[key][0].length + 1) * k;
    });
  }

  // 흩뿌리기용 뒤섞기 숫자: 같은 자리에는 늘 같은 값이 나온다(별 · 오로라 길이)

  /* ---------- 사람: 관절 각도로 그리는 졸라맨 ----------

     각도는 도(°) — 0 = 오른쪽, 90 = 아래, -90 = 위, 180 = 왼쪽. 팔 · 다리는 [윗마디 각도, 아랫마디 각도] */

  function poseOf(name, t, runMs) {
    const w = Math.sin(t / 160), slow = Math.sin(t / 600);
    switch (name) {

        const sw = Math.sin(runMs / (RUNUP_MS / RUNUP_STEPS) * Math.PI);
        const leg = (k) => { const th = 90 - 45 * k; return [th, th + 30 + 20 * Math.max(0, -k)]; };
        const arm = (k) => { const up = 90 + 40 * k; return [up, up - 70]; };

      case 'jump': // 멀리뛰기 자세: 몸을 젖히고 두 다리를 모아 앞으로, 두 팔도 앞으로
        return { torso: -105, arms: [[-35 + 8 * w, -45 + 8 * w], [-15 + 8 * w, -25 + 8 * w]], legs: [[25 + 6 * w, 15 + 6 * w], [38 + 6 * w, 28 + 6 * w]], feet: true };
      case 'windmill': { // 두 팔을 풍차처럼 빙빙, 다리는 자전거 타듯

      }
      case 'swim': { // 엎드려 헤엄: 팔은 번갈아 젓고 다리는 물장구
        const a = t * 0.324, k = Math.sin(t / 90);

        return { torso: -55 + 3 * slow, arms: [[85 + 6 * slow, 95 + 10 * slow], [100 + 6 * slow, 105 + 10 * slow]], legs: [[100 + 5 * slow, 115], [80 - 5 * slow, 100]], feet: true };
      case 'lying': // 포기: 하늘 보고 누워 팔짱, 한쪽 다리는 꼬아 올림
        return { torso: -172, arms: [[-50, -160], [-70, 20]], legs: [[-8, 6], [-35 + 4 * slow, 45 + 4 * slow]], feet: true };

  }
  // 두 점을 칸으로 잇는 선
  function linePts(out, x0, y0, x1, y1) {

  }
  // 허리 자리(hx, hy)와 몸짓으로 사람을 그린다. 머리 가운데 자리를 돌려준다(땀방울 · 혀 그릴 때 씀)
  function drawMan(hx, hy, p) {
    const pts = [];
    const go = (x, y, ang, len) => [x + Math.cos(ang * D2R) * len, y + Math.sin(ang * D2R) * len];
    const neck = go(hx, hy, p.torso, TORSO), sh = go(hx, hy, p.torso, TORSO - 1), head = go(hx, hy, p.torso, TORSO + 2.5);
    linePts(pts, hx, hy, neck[0], neck[1]);
    p.arms.forEach(([a, b]) => {
      const e = go(sh[0], sh[1], a, UPPER), hand = go(e[0], e[1], b, FORE);
      linePts(pts, sh[0], sh[1], e[0], e[1]); linePts(pts, e[0], e[1], hand[0], hand[1]);
    });
    p.legs.forEach(([a, b]) => {
      const k = go(hx, hy, a, THIGH), foot = go(k[0], k[1], b, SHIN);
      linePts(pts, hx, hy, k[0], k[1]); linePts(pts, k[0], k[1], foot[0], foot[1]);
      if (p.feet) pts.push(Math.round(foot[0]) + 1, Math.round(foot[1])); // 발끝 한 칸
    });
    const headX = Math.round(head[0] - 1.5), headY = Math.round(head[1] - 1.5);
    HEAD.forEach((row, j) => { for (let i = 0; i < row.length; i += 1) if (row[i] === '#') pts.push(headX + i, headY + j); });
    // 둘레를 먼저 검게 비우고, 그 위에 몸을 찍는다
    for (let i = 0; i < pts.length; i += 2) for (let dy = -1; dy <= 1; dy += 1) for (let dx = -1; dx <= 1; dx += 1) dot(pts[i] + dx, pts[i + 1] + dy, BG);
    for (let i = 0; i < pts.length; i += 2) dot(pts[i], pts[i + 1], INK);
    return [Math.round(head[0]), Math.round(head[1])];
  }

  /* ---------- 배경 구간 그리기 ----------
     S = 배경이 흘러간 칸 수(화면 가로 x칸에 보이는 것은 「풍경 속 x + S번째 칸」), gy = 땅 줄의 세로 자리 */
  // 일정 간격으로 되풀이되는 것들: [풍경 속 자리, 그림, 땅에서 띄우는 칸 수]
  function props(list, loopLen, S, gy) {
    list.forEach(([off, rows, lift = 0]) => {
      const w = rows[0].length;
      for (let x = mod(off - S, loopLen) - loopLen; x < clipR; x += loopLen) {
        if (x + w > clipL) sprite(x, gy - rows.length - lift, rows);
      }
    });
  }
  function drawScene(z, S, gy, t) {
    const kind = sceneName(z);
    const each = (fn) => { for (let x = clipL; x < clipR; x += 1) fn(x, x + S); };
    const drift = Math.floor(t / 300); // 물결이 천천히 일렁이는 박자

    if (kind === 'stadium') {
      // 관중석(난간 줄 · 빽빽한 사람 무늬 · 아래 벽)과 트랙 — 100m와 같은 모양
      const cw = CROWD[0].length;
      each((x, wx) => {
        dot(x, gy - 12); dot(x, gy - 4); dot(x, gy);
        CROWD.forEach((row, j) => { if (row[mod(wx, cw)] === '#') dot(x, gy - 11 + j); });
        for (let y = gy + 11; y < H; y += 6) if (mod(wx, 8) < 4) dot(x, y); // 레인 점선
      });
      props([[10, FLAG, 12], [74, FLAG, 12]], 128, S, gy);
      if (z === 0) {
        // 맨 처음 경기장에만: 구름판(흰 판)과 모래판(점무늬)
        for (let i = 0; i < 3; i += 1) { dot(BOARD_X - S + i, gy + 1); dot(BOARD_X - S + i, gy + 2); }
        for (let wx = PIT_X; wx < PIT_X + PIT_W; wx += 1) {
          for (let y = gy + 1; y <= gy + 5; y += 1) if ((wx + y) % 2 === 0) dot(wx - S, y);
        }
        for (let y = gy + 1; y <= gy + 5; y += 1) { dot(PIT_X - 1 - S, y); dot(PIT_X + PIT_W - S, y); }
      }
    } else if (kind === 'town') {
      // 동네: 지붕 낮은 집 · 전봇대 · 늘어진 전깃줄 · 길 점선
      each((x, wx) => {
        dot(x, gy);
        if (mod(wx, 12) < 6) dot(x, gy + 4);
        const fr = mod(wx - 23, 56) / 56, sag = Math.round(8 * fr * (1 - fr));
        dot(x, gy - 14 + sag); dot(x, gy - 12 + sag);
      });
      props([[0, HOUSE_A], [34, HOUSE_B], [20, POLE], [58, HOUSE_A], [76, POLE], [92, HOUSE_B]], 112, S, gy);
    } else if (kind === 'city') {
      // 도시: 높고 낮은 빌딩이 줄지어 지나간다
      each((x, wx) => { dot(x, gy); if (mod(wx, 10) < 5) dot(x, gy + 4); });
      props(CITY, cityLoop, S, gy);
    } else if (kind === 'field') {
      // 들판: 먼 산 능선 · 나무 · 풀 · 흙 점
      each((x, wx) => {
        dot(x, gy - 13 + RIDGE_H[mod(wx, RIDGE_H.length)]);
        dot(x, gy);
        for (let y = gy + 2; y < H; y += 1) if (GROUND_TEX[mod(y - gy, 8)][mod(wx, 16)] === '#') dot(x, y);
      });
      props([[6, GRASS], [24, PINE], [44, TREE], [66, SHRUB], [84, GRASS], [100, PINE], [112, PINE], [140, TREE]], 160, S, gy);
    } else if (kind === 'sea') {
      // 바다: 일렁이는 물결 · 돛단배 · 고래 꼬리 · 부표
      each((x, wx) => {
        for (let y = gy; y < H; y += 2) { const d = y - gy; if (mod(wx + d * 3 + drift, 10 + d) < 3) dot(x, y); }
      });
      props([[20, BOAT], [100, WHALE], [170, BUOY]], 230, S, gy);
    } else if (kind === 'desert') {
      // 사막: 물결치는 모래 언덕 · 피라미드 · 낙타 · 선인장
      each((x, wx) => {
        const top = gy - Math.round(1.5 + 1.5 * Math.sin(wx / 9));
        dot(x, top);
        for (let y = top + 2; y < H; y += 1) if (mod(wx * 7 + y * 13, 11) === 0) dot(x, y);
      });
      props([[10, PYRAMID, 1], [60, CAMEL, 2], [96, CACTUS, 1], [150, PYRAMID, 1], [190, CACTUS, 1]], 220, S, gy);
    } else if (kind === 'snow') {
      // 설산 · 빙하: 뾰족한 산(꼭대기는 눈으로 하얗게) · 빙산 · 펭귄
      each((x, wx) => {
        const h1 = 14 - Math.abs(mod(wx, 46) - 23) * 0.8, h2 = 10 - Math.abs(mod(wx + 23, 46) - 23) * 0.7;
        const hgt = Math.round(Math.max(h1, h2, 0));
        if (hgt > 0) { dot(x, gy - hgt); for (let y = gy - hgt + 1; y <= gy - 11; y += 1) dot(x, y); }
        dot(x, gy);
        for (let y = gy + 2; y < H; y += 1) if (mod(wx * 5 + y * 9, 17) === 0) dot(x, y);
      });
      props([[14, PENGUIN], [22, PENGUIN], [70, ICEBERG], [120, PENGUIN], [150, ICEBERG]], 184, S, gy);
    } else {
      // 밤바다: 반짝이는 별 · 오로라 커튼 · 초승달 · 잔잔한 물결
      const twinkle = Math.floor(t / 500);
      each((x, wx) => {
        for (let y = 1; y < gy - 18; y += 1) {
          const hv = hash(wx * 131 + y);

    }
  }
  // 배경 구간이 바뀌는 자리(풍경 속 칸): 그 거리를 넘는 순간 화면 오른쪽 끝에서 새 배경이 들어오기 시작한다
  const edgeCache = new Map();
  function edgeOf(z) {
    if (!edgeCache.has(z)) {
      if (edgeCache.size > 400) edgeCache.clear();
      edgeCache.set(z, Math.floor(RUNUP_PX + uAt(flightAtDist(sceneStart(z))) + W));
    }
    return edgeCache.get(z);
  }

  function render() {
    const t = now(), v = view(t), oy = skyShift;
    const S = Math.floor(v.scroll);
    const gy = GROUND_Y + oy + v.drop; // 땅 줄(높이 올라가면 아래로 내려간다)
    const landed = phase === 'landed';
    box(0, 0, W, H, BG);

    // 숫자 글자와 자리를 먼저 정한다(구름이 숫자 옆에 붙으면 빼기 부호처럼 읽혀서, 숫자 둘레에는 하늘 것을 그리지 않는다)
    drawn.distText = distText(v.dist || 0);
    drawn.bestText = best > 0 ? distText(best) : '';
    drawn.lapText = v.lap > 0 ? String(v.lap) : '';
    const distKeys = [...drawn.distText];
    let bigK = landed && measure(distKeys).w * 3 <= W - 6 ? 3 : 2; // 착지 화면에서는 더 크게
    if (measure(distKeys).w * bigK > W - 6) bigK = 1;

    if (v.lap > 0) { if (subKeys.length) subKeys.push(' ', ' '); subKeys.push('◍', ' ', ...drawn.lapText); } // 지구 + 바퀴 수
    // 준비 · 착지 화면의 아랫줄(최고 기록)은 폭이 되면 2배로 키운다. 나는 중의 바퀴 수는 1배 그대로
    const subK = (phase === 'ready' || landed) && subKeys.length && measure(subKeys).w * 2 <= W - 6 ? 2 : 1;
    const subY = TEXT_Y + 7 * bigK + 2 + (subK - 1);
    const keep = [{ x: TEXT_X - 6, y: TEXT_Y - 3, w: measure(distKeys).w * bigK + 12, h: 7 * bigK + 6 }];
    if (subKeys.length) keep.push({ x: TEXT_X - 6, y: subY - 3, w: measure(subKeys).w * subK + 12, h: 7 * subK + 6 });
    const skyAt = (x, y, rows, halo) => {
      const w = rows[0].length, h = rows.length;

    const cloudShift = Math.floor(v.scroll * 0.15);
    CLOUDS.forEach(([home, y, rows]) => { const w = rows[0].length; skyAt(mod(home + w - cloudShift, W + 24) - w, y + oy, rows); });

    // 하늘을 스치는 것들(새 · 비행기 · 인공위성): 오래 날수록 하나씩 더 나온다
    const flyer = (front) => FLYERS.forEach(([frames, y, share, slow, loopLen, from, isFront]) => {

      const rows = frames[Math.floor(t / 180) % frames.length];
      const x = W + 8 - Math.floor(mod(slow * (uAt(v.f) - uAt(from)), loopLen));

    });
    flyer(false);

    // 땅 풍경: 오른쪽부터 지금 배경 → 그 앞 배경 순으로, 바뀌는 자리(edge)에서 잘라 그린다

    // 발아래 구름 · 바람 줄(속도가 붙으면 늘어난다)
    flyer(true);
    if (v.f >= WIND_FROM) {

      for (let i = 0; i < n; i += 1) {
        const len = 5 + (i * 3) % 5, y = WIND_ROWS[i] + oy;

        if (keep.some((r) => x < r.x + r.w && r.x < x + len && y >= r.y && y < r.y + r.h)) continue;
        for (let k = 0; k < len; k += 1) dot(x + k, y);
      }
    }

    // 사람
    const groundHip = GROUND_Y + oy - 9; // 땅에 서 있을 때 허리 높이
    const name = poseNameNow(v);
    const lastPose = POSES[v.pose][1];
    const flyX = RUN_HIP_X + (FLY_HIP_X - RUN_HIP_X) * smooth(Math.min(1, v.f / 1.5)) + (v.f > 0 ? (POSE_SHIFT[lastPose] || 0) : 0);
    const rise = Math.min(1, v.f / 0.7);

    let hx = RUN_HIP_X, hy = groundHip;

    else if (landed) { if (name === 'splat') { hx = RUN_HIP_X; hy = gy - 3; } else { hx = flyX; hy = gy - 2; } }
    hx = Math.round(hx); hy = Math.round(hy);
    const head = drawMan(hx, hy, poseOf(name, t, v.runMs));

    // 지친 몸짓: 혀를 내밀고 땀방울이 뒤로 날린다
    if (name === 'tired') {
      dot(head[0] + 2, head[1] + 1); dot(head[0] + 2, head[1] + 2);
      for (let i = 0; i < 2; i += 1) {
        const ph = mod(t / 90 + i * 5, 10), sx = head[0] - 3 - Math.floor(ph), sy = head[1] - 3 + Math.floor(ph / 3) + i;
        dot(sx, sy); dot(sx, sy + 1);
      }
    }
    // 착지 흙먼지: 0.6초 동안 양옆으로 퍼지며 사라진다
    if (landed) {
      const age = t - landedAt;
      if (age >= 0 && age < 600) {
        const r = Math.floor(age / 100), mid = name === 'splat' ? hx + 4 : hx;
        sprite(mid - 9 - 2 * r, gy - 3 - Math.floor(r / 2), PUFF);
        sprite(mid + 8 + 2 * r, gy - 3 - Math.floor(r / 2), PUFF);
        if (r < 4) { dot(mid - 5 - 3 * r, gy - 6 - r); dot(mid + 6 + 3 * r, gy - 6 - r); }
      }
    }

    // 숫자: 왼쪽 위 큰 거리(착지하면 더 크게), 그 아래 왕관 + 최고 기록 · 지구 + 바퀴 수
    boardText(distKeys, TEXT_X, TEXT_Y, bigK);
    if (subKeys.length) boardText(subKeys, TEXT_X, subY, subK);

    // 작은 판을 큰 그림판에 옮긴다
    g.imageSmoothingEnabled = false;
    g.drawImage(board, 0, 0, el.screen.width, el.screen.height);
  }

  /* ---------- 몸통 겉모양: 위 두 모서리는 둥글게, 아래 두 모서리는 비스듬히 깎기 ----------
     inset = 바깥선에서 안으로 들어온 거리(검은 몸통의 안쪽 흰 선을 그릴 때 씀) */
  function bodyPath(w, h, rad, bevel, inset) {
    const i = inset, R = Math.max(0, rad - i), B = Math.max(0, bevel - i * 0.41);
    const x0 = i, y0 = i, x1 = w - i, y1 = h - i;
    return `M ${x0} ${y0 + R} A ${R} ${R} 0 0 1 ${x0 + R} ${y0} L ${x1 - R} ${y0} A ${R} ${R} 0 0 1 ${x1} ${y0 + R} `
      + `L ${x1} ${y1 - B} L ${x1 - B} ${y1} L ${x0 + B} ${y1} L ${x0} ${y1 - B} Z`;
  }
  function drawBody(dw, dh, rad, bevel) {
    const sk = SKINS[skin];
    el.bodyArt.setAttribute('viewBox', `0 0 ${dw} ${dh}`);
    el.bodyArt.setAttribute('width', dw); el.bodyArt.setAttribute('height', dh);
    el.bodyFill.setAttribute('d', bodyPath(dw, dh, rad, bevel, 0));
    el.bodyFill.setAttribute('fill', sk.body);
    if (sk.line) {
      el.bodyLine.setAttribute('d', bodyPath(dw, dh, rad, bevel, 1)); // 굵기 2 선의 가운데를 1 안쪽에 → 바깥선 안쪽 0~2점
      el.bodyLine.setAttribute('stroke', INK); el.bodyLine.setAttribute('stroke-width', '2');
    } else {
      el.bodyLine.removeAttribute('d');
    }
  }

  // 오돌토돌한 띠: 본보기 기기 아래쪽 회색 띠. 모서리 둥근 직사각형을 띠 색으로 칠하고, 몸통 색 점을 흩뿌린다
  function drawGrip(gw, gh) {
    const cv = el.grip, r = dpr(), ctx = cv.getContext('2d'), sk = SKINS[skin];
    const w = Math.max(1, Math.round(gw * r)), h = Math.max(1, Math.round(gh * r));
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    cv.style.width = `${w / r}px`; cv.style.height = `${h / r}px`;
    ctx.clearRect(0, 0, w, h);
    const rr = Math.min(h / 2, Math.round(h * 0.3));
    ctx.beginPath();
    ctx.moveTo(rr, 0); ctx.lineTo(w - rr, 0); ctx.arcTo(w, 0, w, rr, rr); ctx.lineTo(w, h - rr); ctx.arcTo(w, h, w - rr, h, rr);
    ctx.lineTo(rr, h); ctx.arcTo(0, h, 0, h - rr, rr); ctx.lineTo(0, rr); ctx.arcTo(0, 0, rr, 0, rr); ctx.closePath();
    ctx.fillStyle = sk.grip; ctx.fill();
    // 점 무늬(여섯 게임 같은 규칙): 점 하나 = 화면 점 2개, 가로 6 · 세로 4 간격, 한 줄 걸러 반 칸 어긋나게
    ctx.save(); ctx.clip();
    const p = Math.max(1, Math.round(2 * r));
    ctx.fillStyle = sk.body;
    for (let row = 0, y = 2 * p; y + p <= h - 2 * p; row += 1, y += 2 * p) {
      for (let x = 2 * p + (row % 2 ? Math.round(1.5 * p) : 0); x + p <= w - 2 * p; x += 3 * p) ctx.fillRect(x, y, p, p);
    }
    ctx.restore();
  }

  /* ---------- 자리 맞추기 ----------
     몸통 폭 dw = min(창 폭 − 28, 460). 위에서부터: 띠(작은 버튼 줄 + 위아래 10) → 검은 화면 → 7% → 키캡 → 7% → 오돌토돌한 띠(7%) → 7%.
     합이 창 높이 − 28을 넘으면 화면 칸 크기부터, 그다음 키캡 크기를 줄인다(키캡은 72 아래로 안 줄임) */
  let bandSide = 0; // 위 띠 양옆 여백(화면 점): 게임 버튼의 왼쪽 자리 = 오른쪽 묶음의 오른쪽 여백
  function fit() { fitDevice(); placeGameBtn(); }
  // 창이 낮으면(가로로 눕힌 폰 등) 몸통 폭부터 줄인다 — 검수 지적: 폭은 그대로 두고 화면만 줄이니 화면이 점 하나 크기가 됐다.
  // 화면 칸 · 키캡을 제 크기로 놓았을 때(위 띠 + 화면 + 키캡 + 틈 넷) 창 높이 안에 들어가는 가장 큰 폭을 찾는다
  function fitWidth(maxW, roomH, band, rows, keyShare) {
    const r = dpr();
    for (let w = maxW; w > 160; w -= 4) {
      const cell = Math.max(1, Math.floor(w * 0.86 * r / 128));
      if (band + (rows * cell) / r + Math.max(72, w * keyShare) + 4 * Math.round(w * 0.07) <= roomH) return w;
    }
    return Math.min(maxW, 160);
  }
  function fitDevice() {
    const r = dpr(), rows = ROWS;
    drawSoundBtn(); drawCapBtn(); drawSkinBtn();
    const btnH = BTN_ROWS * cornerCell() / r; // 작은 버튼 높이(화면 점)
    const band = btnH + 2 * BAND_PAD;

    const mb = el.main.getBoundingClientRect();
    const limitH = mb.height - EDGE;
    const dw = fitWidth(Math.max(120, Math.floor(Math.min(mb.width - EDGE, DEVICE_MAX))), limitH, band, rows, KEY_SHARE_ONE);
    const gap = Math.round(dw * GAP_SHARE);
    const gh = gap; // 띠 높이 = 몸통 폭의 7%

    // 키캡 크기: 20칸 × 정수 점이 되는 크기 중 목표(몸통 폭의 40%)에 가장 가까운 것, 72 ~ 190 사이
    const want = dw * KEY_SHARE_ONE;
    let kc = 0, bestFit = Infinity;
    for (let cc = 1; KEY_CELLS * cc / r <= KEY_MAX + 0.01; cc += 1) {
      const size = KEY_CELLS * cc / r;
      if (size >= KEY_MIN - 0.01 && Math.abs(size - want) < bestFit) { kc = cc; bestFit = Math.abs(size - want); }
    }
    if (!kc) kc = Math.max(1, Math.ceil(KEY_MIN * r / KEY_CELLS));
    const kcMin = Math.ceil((KEY_MIN - 0.01) * r / KEY_CELLS);

    // 검은 화면: 128 × rows칸, 한 칸 = 정수 기기 화면 점
    let cellPx = Math.max(1, Math.floor(dw * SCREEN_SHARE * r / W));
    const total = (cp, k) => band + (rows * cp) / r + gap + (KEY_CELLS * k) / r + gap + gh + gap;
    while (cellPx > 1 && total(cellPx, kc) > limitH) cellPx -= 1;
    while (kc > kcMin && total(cellPx, kc) > limitH) kc -= 1;
    // 몸통을 세로로 길게(형님 「위아래 여백이 너무 많아」): 폭의 1.5배까지(창 높이 안에서), 남는 높이를 세 틈(화면~키캡 · 키캡~띠 · 띠~몸통 끝)에 똑같이 나눠 넣는다
    const lift = Math.max(0, Math.floor((Math.min(limitH, Math.round(dw * BODY_TALL)) - total(cellPx, kc)) / 3));
    keyCell = kc;
    const ks = KEY_CELLS * kc / r;
    const sw = (W * cellPx) / r, sh = (rows * cellPx) / r;

    const keyTop = Math.round(band + sh + gap + lift);
    const gripTop = Math.round(keyTop + ks + gap + lift);
    const dh = Math.round(gripTop + gh + gap + lift);

    // 몸통
    const ds = el.deviceE.style, rad = Math.round(dw * CORNER_SHARE), bevel = Math.round(dw * CORNER_SHARE);
    ds.width = `${dw}px`; ds.height = `${dh}px`;
    drawBody(dw, dh, rad, bevel);

    // 위 띠: 왼쪽 끝 게임 버튼(placeGameBtn이 놓는다) · 오른쪽 끝에서부터 몸통 색 ← 키캡 ← 소리(사이 6점)
    // 몸통이 아주 좁아 두 묶음이 겹칠 것 같으면 양옆 여백(side)을 줄여 자리를 낸다
    const oneW = ONE_COLS * cornerCell() / r;
    const gameW = (3 + gameList().length * (GAME_BOX_W + 1) - 1 + 3) * cornerCell() / r;
    const need = gameW + BTN_GAP + 3 * oneW + 2 * BTN_GAP;
    bandSide = Math.max(0, Math.min(Math.round(dw * 0.08), Math.floor((dw - need) / 2)));
    let bx = dw - bandSide - oneW;
    [el.skinBtn, el.capBtn, el.soundBtn].forEach((b) => {
      b.style.right = ''; b.style.left = `${bx}px`; b.style.top = `${BAND_PAD}px`;
      bx -= oneW + BTN_GAP;
    });

    // 검은 화면: 가운데 정렬
    setRows(rows);
    if (el.screen.width !== W * cellPx || el.screen.height !== H * cellPx) { el.screen.width = W * cellPx; el.screen.height = H * cellPx; }
    el.screen.style.width = `${sw}px`; el.screen.style.height = `${sh}px`;
    el.screen.style.left = `${Math.round((dw - sw) / 2)}px`;
    el.screen.style.top = `${Math.round(band)}px`;

    // 키캡 하나: 가운데
    const n = KEY_CELLS * kc, cv = el.keyPushCanvas, b = el.keyPush;
    if (cv.width !== n || cv.height !== n) { cv.width = n; cv.height = n; }
    cv.style.width = `${ks}px`; cv.style.height = `${ks}px`;
    b.style.left = `${Math.round((dw - ks) / 2)}px`; b.style.top = `${keyTop}px`;
    b.style.width = `${ks}px`; b.style.height = `${ks}px`;

    // 오돌토돌한 띠: 가운데
    const gw = Math.round(dw * GRIP_SHARE);
    drawGrip(gw, gh);
    el.grip.style.left = `${Math.round((dw - gw) / 2)}px`; el.grip.style.top = `${gripTop}px`;

    drawKeys();
    syncText();
    render();
  }

  /* ---------- 게임 버튼: 위 띠 왼쪽 끝, 누른 숫자 칸의 게임으로 바로 간다 ----------
     비유: TV 리모컨 숫자 버튼. 1 시지프스 · 2 10.00000 · 3 결투 · 4 100m · 5 퍼덕 · 6 멀리뛰기 중 누른 번호로 곧장.
     여섯 게임은 같은 전시장의 옆 폴더라서 「한 칸 위 폴더 → 옆 폴더」 주소로 옮겨 간다.
     이 컴퓨터의 폴더 이름(local)과 인터넷 전시장의 폴더 이름(web)이 달라서 둘 다 적어 두고,
     지금 열린 폴더 이름이 어느 쪽인지 보고 같은 쪽 이름으로 간다.
     키보드 바로 가기는 두지 않는다(100m의 F · J 사이 G처럼, 달리다 스치면 판이 날아가서).
     (fit()이 처음 불리는 때보다 앞서 쓰일 수 있어서 값은 const 대신 함수로 돌려준다) */
  function gameHere() { return '6'; }
  function gameList() {
    return [
      { id: '1', name: '시지프스', local: 'streak-sisyphus', web: 'hold-on-sisyphus' },
      { id: '2', name: '10.00000', local: 'key-ten', web: 'hold-on-key-ten' },
      { id: '3', name: '결투', local: 'key-duel', web: 'hold-on-key-duel' },
      { id: '4', name: '100m', local: 'key-100m', web: 'hold-on-key-100m' },
      { id: '5', name: '퍼덕', local: 'key-flap', web: 'hold-on-key-flap' },
      { id: '6', name: '멀리뛰기', local: 'key-leap', web: 'hold-on-key-leap' },
    ];
  }
  function gameUrl(id) {
    const list = gameList(), target = list.find((g) => g.id === String(id));
    if (!target) return null;
    // 지금 폴더 이름: …/hold-on-key-ten/ → hold-on-key-ten, …/key-ten/index.html → key-ten
    const parts = location.pathname.split('/').filter(Boolean);
    if (parts.length && /\.html?$/i.test(parts[parts.length - 1])) parts.pop();
    const here = decodeURIComponent(parts[parts.length - 1] || '');
    const onWeb = list.some((g) => g.web === here);
    return onWeb ? `../${target.web}/` : `../${target.local}/index.html`;
  }
  // 넘어간 게임마다 뒤로 가기 기록이 쌓이지 않게 지금 칸을 바꿔 끼운다. 지금 게임 번호면 아무 일 없음
  function goGame(id) {
    if (String(id) === gameHere()) return false;
    const url = gameUrl(id);
    if (!url) return false;
    location.replace(url);
    return true;
  }
  // 그림: 다른 작은 버튼과 같은 틀. 테두리 안에 1 ~ 6, 지금 게임 숫자만 검게 칠한 칸에 흰 글씨(칸 수는 게임 목록 길이를 따른다)
  const GAME_BOX_W = 7, GAME_BOX_H = 9;                // 글자 한 칸 상자(글자 5×7 + 둘레 한 칸)
  function drawGameBtn(gb) {
    const cv = gb.querySelector('canvas'), ctx = cv.getContext('2d'), cc = cornerCell(), list = gameList();
    const cols = 3 + list.length * (GAME_BOX_W + 1) - 1 + 3, rowsN = 17;
    const cw = cols * cc, ch = rowsN * cc;
    sizeCorner(cv, cw, ch);
    ctx.clearRect(0, 0, cw, ch);
    pixelBlock(ctx, cw, ch, cc, INK);
    pixelFrame(ctx, cw, ch, cc, BG);
    list.forEach((g, i) => {
      const bx = (3 + i * (GAME_BOX_W + 1)) * cc, by = Math.floor((rowsN - GAME_BOX_H) / 2) * cc;
      if (g.id === gameHere()) {
        ctx.fillStyle = BG; ctx.fillRect(bx, by, GAME_BOX_W * cc, GAME_BOX_H * cc);
        drawText(ctx, [g.id], bx + cc, by + cc, cc, INK);
      } else {
        drawText(ctx, [g.id], bx + cc, by + cc, cc, BG);
      }
    });
    const label = `게임 ${gameHere()} ${list.find((g) => g.id === gameHere()).name}`;
    const gl = document.getElementById('gameLabel');
    if (gl && gl.textContent !== label) gl.textContent = label;
  }
  // 버튼 안 가로 위치(화면 점, 버튼 왼쪽 끝 = 0) → 몇 번째 숫자 칸인지.
  // 칸 경계 = 글자 상자 경계, 상자 사이 한 칸 틈은 그 가운데를 기준으로 가까운 칸, 양 끝 여백은 맨 끝 칸
  function gameIndexAt(xCss) {
    const n = gameList().length, cellsX = (xCss * dpr()) / cornerCell();
    const i = Math.floor((cellsX - 3 + 0.5) / (GAME_BOX_W + 1));
    return Math.max(0, Math.min(n - 1, i));
  }
  // 자리: 위 띠 왼쪽 끝(몸통 왼쪽에서 bandSide), 다른 작은 버튼과 같은 높이
  function placeGameBtn() {
    const gb = document.getElementById('gameBtn');
    if (!gb) return;
    drawGameBtn(gb);
    gb.style.left = `${bandSide}px`;
    gb.style.top = `${BAND_PAD}px`;
  }
  // 누르는 순간 그 번호 게임으로. 게임 누름으로 세지 않는다(아래로 퍼지지 않게 막음)
  document.getElementById('gameBtn').addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    const rect = e.currentTarget.getBoundingClientRect();
    goGame(gameList()[gameIndexAt(e.clientX - rect.left)].id);
  });
  if (window.ResizeObserver) new ResizeObserver(fit).observe(el.main);
  window.addEventListener('resize', fit);

  /* ---------- 입력: 손가락이 닿는 순간 누름, 떨어지는 순간 뗌 ---------- */
  const mainPointer = (e) => e.pointerType !== 'mouse' || e.button === 0;
  // 작은 버튼: 키캡 누름으로 세지 않는다
  el.soundBtn.addEventListener('pointerdown', (e) => {
    if (!mainPointer(e)) return;
    e.preventDefault(); e.stopPropagation();
    nextSound();
  });
  el.capBtn.addEventListener('pointerdown', (e) => {
    if (!mainPointer(e)) return;
    e.preventDefault(); e.stopPropagation();
    nextCap();
  });
  el.skinBtn.addEventListener('pointerdown', (e) => {
    if (!mainPointer(e)) return;
    e.preventDefault(); e.stopPropagation();
    nextSkin();
  });
  // 키캡: 누르는 순간 받는다. 그 손가락이 떼어지거나, 키 밖으로 미끄러지거나, 화면 밖으로 나가면 뗀 것
  el.keyPush.addEventListener('pointerdown', (e) => {
    if (!mainPointer(e)) return;
    e.preventDefault(); e.stopPropagation();
    // 손가락을 키에 묶어 두지 않아야 키 밖으로 미끄러진 것을 알아챈다
    const t = e.currentTarget;
    try { if (t.hasPointerCapture && t.hasPointerCapture(e.pointerId)) t.releasePointerCapture(e.pointerId); } catch (err) { /* 그대로 */ }
    // 새로 닿은 첫 손가락인데 키가 눌린 채 남아 있으면, 떼는 신호를 놓친 낡은 누름이다 → 풀고 받는다(키가 먹통이 되지 않게)
    if (e.isPrimary && keyHold.push !== null && keyHold.push !== e.pointerId) releaseKey('push');
    holdKey('push', e.pointerId);
  });
  const insideRect = (node, x, y) => {
    const b = node.getBoundingClientRect();
    return x >= b.left && x <= b.right && y >= b.top && y <= b.bottom;
  };
  window.addEventListener('pointermove', (e) => {
    if (keyHold.push === e.pointerId && !insideRect(el.keyPush, e.clientX, e.clientY)) releaseKey('push', e.pointerId);
  });
  ['pointerup', 'pointercancel'].forEach((type) => window.addEventListener(type, (e) => {
    releaseKey('push', e.pointerId);
  }));
  // 마우스가 창 밖으로 나감(옮겨 간 곳이 없음)
  window.addEventListener('pointerout', (e) => {
    if (e.relatedTarget) return;
    releaseKey('push', e.pointerId);
  });
  // 창이 가려지거나 다른 창으로 넘어가면 뗀 것(지구력 게임이라 그 판은 거기서 끝). 돌아오면 화면만 다시 그린다
  window.addEventListener('blur', releaseAllKeys);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) releaseAllKeys();
    else { refresh(); startLoop(); }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter') releaseKey('push', `kb:${e.code}`);
  });

  window.addEventListener('keydown', (e) => {
    const plain = !e.metaKey && !e.ctrlKey && !e.altKey;
    // S = 소리 다음 · K = 키캡 그림 다음 · C = 몸통 색 다음 (L은 이제 아무 일 없음)
    if (e.code === 'KeyS' && plain) {
      e.preventDefault();
      if (!e.repeat) nextSound();
      return;
    }
    if (e.code === 'KeyK' && plain) {
      e.preventDefault();
      if (!e.repeat) nextCap();
      return;
    }
    if (e.code === 'KeyC' && plain) {
      e.preventDefault();
      if (!e.repeat) nextSkin();
      return;
    }
    if (e.code !== 'Space' && e.code !== 'Enter' && e.code !== 'NumpadEnter') return;
    if (!plain) return; // Cmd · Ctrl · Alt와 같이 누른 것은 키캡 누름이 아니다(떼는 신호가 안 와서 키가 눌린 채 남는 것도 막음)
    e.preventDefault();
    if (e.repeat) return; // 꾹 누르고 있어 저절로 반복되는 입력은 무시
    // 같은 키가 눌린 채 남아 있는데 새로 눌렸다면 떼는 신호를 놓친 것이다 → 풀고 받는다(키보드가 먹통이 되지 않게)
    if (keyHold.push === `kb:${e.code}`) releaseKey('push');
    holdKey('push', `kb:${e.code}`); // 키캡을 누른 것과 같음(떼면 keyup에서 올라옴)
  });
  // 화면이 확대되거나 끌리거나, 길게 눌러 메뉴가 뜨지 않게 막는다(길게 누르는 게임이라 특히 중요)
  const block = (e) => e.preventDefault();
  ['touchstart', 'touchmove', 'touchend'].forEach((name) => document.addEventListener(name, block, { passive: false }));
  ['gesturestart', 'dblclick', 'contextmenu', 'selectstart', 'dragstart'].forEach((name) => document.addEventListener(name, block));

  fit();

  /* ---------- 검사용 손잡이: 게임에는 영향이 없다 ---------- */
  const rectOf = (node) => {
    const b = node.getBoundingClientRect();
    return { x: b.left, y: b.top, w: b.width, h: b.height };
  };
  const holdToFlight = (sec) => Math.max(0, Number(sec) - RUNUP_MS / 1000);
  window.__STREAK_TEST__ = {
    state() {
      refresh();
      const t = now(), v = view(t);
      return {
        phase, holding: holding(),
        holdMs: holding() ? Math.max(0, t - pressT) : 0,   // 누르고 있은 시간
        flightSec: v.f,                                     // 난 시간(초)
        dist: v.dist || 0, distText: drawn.distText,        // 지금(또는 이번 판) 거리(미터) · 화면 글자
        record,                                             // 이번 판 기록(미터). 판이 끝나기 전엔 null
        best, bestText: drawn.bestText,
        lap: v.lap, lapText: drawn.lapText,                 // 지구 몇 바퀴
        scene: sceneName(v.scene), sceneIndex: v.scene % NS, // 지금 배경 이름
        pose: poseNameNow(v), poseIndex: v.pose,            // 지금 몸짓 이름
        ignoreLeft: phase === 'landed' ? Math.max(0, IGNORE_MS - (t - landedAt)) : 0, // 누름을 무시하는 남은 시간
        layout: 'F', rows: H,
        sound: KeySound.index,                              // 소리(0 끔 · 1~6)
        cap, capName: KeyArt.names[cap],                    // 키캡 그림(0~3)
        skin, skinName: SKINS[skin].name, skins: SKINS.map((s) => s.name),
        keyDown: keyHold.push !== null,
        keyRects: { push: rectOf(el.keyPush) },
        rects: {
          device: rectOf(el.deviceE), screen: rectOf(el.screen), key: rectOf(el.keyPush), grip: rectOf(el.grip),
          gameBtn: rectOf(document.getElementById('gameBtn')), soundBtn: rectOf(el.soundBtn), capBtn: rectOf(el.capBtn), skinBtn: rectOf(el.skinBtn),
        },
        game: gameHere(),
      };
    },
    keyPress() { return holdKey('push', 'test'); }, // 키캡을 누르고 있기 시작(이미 눌려 있으면 false)
    keyRelease() { return releaseKey('push'); },    // 키캡에서 손 떼기
    press() { holdKey('push', 'test'); releaseKey('push'); return this.state(); }, // 눌렀다 바로 뗌
    // 처음 상태로: 준비 화면 · 최고 기록 지움
    reset() {
      keyHold.push = null;
      phase = 'ready'; record = null; endRunMs = 0; endF = 0; landedAt = -Infinity; best = 0;
      Object.values(KEYS).forEach(clearKey);
      drawKeys(); syncText(); render();
      return this.state();
    },
    setBest(m) { best = Math.max(0, Number(m) || 0); if (best > 0) saveBest(best); else clearKey(KEYS.best); render(); return this.state(); },
    // 손으로 돌리는 시계: 처음 부르면 실제 시계 값에서 이어 받아 멈춰 두고, 부를 때마다 ms만큼 돌린다
    tick(ms) {
      if (manual === null) manual = performance.now();
      manual += Math.max(0, Number(ms) || 0);
      refresh();
      return this.state();
    },
    // 실제 시계로 되돌리기: 흐르던 판이 끊기지 않게 기억해 둔 시각들을 실제 시계 쪽으로 옮겨 둔다
    realClock() {
      if (manual !== null) {
        const shift = performance.now() - manual;
        pressT += shift; releaseT += shift; landedAt += shift;
        manual = null;
      }
      refresh(); startLoop();
      return this.state();
    },
    distAt(holdSec) { return distAtFlight(holdToFlight(holdSec)); },        // 누른 지 그 초일 때 거리(미터)
    timeAt(meters) { return RUNUP_MS / 1000 + flightAtDist(Number(meters)); }, // 그 거리에 닿는 때(누른 지 몇 초)
    sceneAt(meters) { return sceneName(sceneIndexAt(Number(meters))); },     // 그 거리의 배경 이름
    poseAt(flightSec) { return POSES[poseIndexAt(Number(flightSec))][1]; },  // 난 지 그 초일 때 몸짓 이름
    tables() { return { lap: LAP_M, runupMs: RUNUP_MS, fallMs: FALL_MS, ignoreMs: IGNORE_MS, curve: CURVE, scenes: SCENES, poses: POSES }; },
    setSound(i) { KeySound.set(i); drawSoundBtn(); return KeySound.index; }, // 소리 고르기(0 끔 · 1~6). 소리는 내지 않는다
    setCap(i) { return setCap(i); },                                         // 키캡 그림 고르기(0~3)
    setSkin(n) { return setSkin(n); },
    nextSkin() { nextSkin(); return skin; },
    gameUrl(id) { return gameUrl(id); },               // 그 번호 게임으로 갈 주소(가지는 않음)
    gameIndexAt(x) { return gameIndexAt(Number(x)); }, // 게임 버튼 안 가로 위치(화면 점) → 칸 번호(0부터)
  };
})();
</script>
</body>
</html>
