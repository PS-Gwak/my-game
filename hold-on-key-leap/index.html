<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>멀리뛰기</title>
<style>
  /* 화면에는 손바닥만 한 기기 하나만 있다: 몸통 안에 검은 화면, 그 아래 큰 키캡 하나, 맨 아래 오돌토돌한 띠.
     크기와 자리는 스크립트가 창 크기에 맞춰 정한다. 글씨와 테두리는 전부 캔버스(그림 종이)에 칸으로 찍는다 */
  :root { --black: #000000; --white: #f2f2f2; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--black); color: var(--white);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  /* 창 전체를 차지하는 받침대: 기기 몸통을 가로 · 세로 가운데에 올려 둔다 */
  main {
    width: 100vw; height: 100vh; height: 100dvh;
    display: flex; align-items: center; justify-content: center;
  }
  /* 기기 몸통: 겉모양(둥근 위 · 깎인 아래 · 몸통 색)은 안쪽 그림(#bodyArt)이 그린다 */
  .device-e { position: relative; flex: none; line-height: 0; }
  .body-art { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  .screen { position: absolute; display: block; image-rendering: pixelated; background: var(--black); }
  .grip { position: absolute; display: block; image-rendering: pixelated; pointer-events: none; }
  /* 몸통 위 띠의 작은 점 글씨 버튼 셋: 왼쪽 게임(123456) · 오른쪽 소리 → 몸통 색 */
  .corner-btn {
    position: absolute; top: 10px; padding: 0; margin: 0; border: 0; background: transparent;
    line-height: 0; cursor: pointer; touch-action: none; outline: none;
  }
  .corner-btn canvas { display: block; image-rendering: pixelated; }
  /* 키캡: 진짜 키보드 키처럼 누르면 들어가고 떼면 올라온다 */
  .key {
    position: absolute; padding: 0; margin: 0; border: 0; background: transparent;
    line-height: 0; cursor: pointer; touch-action: none; outline: none;
  }
  .key canvas { display: block; image-rendering: pixelated; }
  /* 화면에는 안 보이는 글자: 읽어 주는 기능 · 검사기가 버튼 글을 읽을 수 있게 남겨 둔다 */
  .ghost { position: absolute; left: 0; top: 0; width: 100%; height: 100%; color: transparent; overflow: hidden; white-space: nowrap; pointer-events: none; line-height: 1; }
</style>
</head>
<body>
<main id="main">
  <div class="device-e" id="deviceE">
    <svg class="body-art" id="bodyArt" aria-hidden="true"><path id="bodyFill"></path><path id="bodyLine" fill="none"></path></svg>
    <button class="corner-btn game-btn" id="gameBtn" type="button" tabindex="-1"><canvas id="gameCanvas"></canvas><span class="ghost" id="gameLabel">게임 6 멀리뛰기</span></button>
    <button class="corner-btn sound-btn" id="soundBtn" type="button" tabindex="-1"><canvas id="soundCanvas"></canvas><span class="ghost" id="soundLabel">소리 1</span></button>
    <button class="corner-btn skin-btn" id="skinBtn" type="button" tabindex="-1"><canvas id="skinCanvas"></canvas><span class="ghost" id="skinLabel">몸통 gray</span></button>
    <canvas class="screen" id="screen" aria-label="멀리뛰기"></canvas>
    <button class="key" id="keyPush" type="button" tabindex="-1"><canvas id="keyPushCanvas"></canvas><span class="ghost">누르고 있기</span></button>
    <canvas class="grip" id="grip"></canvas>
  </div>
</main>

    [[CLOUD_B], 42, 1, 0.7, 290, 32, true],
    [[PLANE], 29, 0.4, 0.35, 520, 45, false],       // 왼쪽 위 글자 줄(최고 기록 · 거리)보다 아래로 지나가게
    [[SATELLITE], 30, 0.3, 0.2, 460, 180, false],
  ];
  const WIND_ROWS = [22, 34, 28, 39, 25, 31]; // 바람 줄이 지나가는 세로 자리

  /* ---------- 시계: 게임 안의 모든 시간은 이 함수 하나만 읽는다 ----------
     평소 = 실제 시계(performance.now). 검사용 tick()을 부르면 「손으로 돌리는 시계」(manual)로 바뀐다 */
  let manual = null; // 손으로 돌리는 시계의 지금 값(null = 실제 시계)
  const now = () => (manual !== null ? manual : performance.now());

  /* ---------- 상태 ---------- */
  let skin = loadSkin();
  let best = loadBest();     // 최고 기록(미터). 없으면 0
  let phase = 'ready';       // 'ready' 준비 · 'runup' 도움닫기 · 'fly' 나는 중 · 'fall' 떨어지는 중 · 'landed' 착지(기록 화면)
  let pressT = 0;            // 키캡을 누른 시각
  let releaseT = 0;          // 손을 뗀 시각
  let landedAt = -Infinity;  // 땅에 닿은 시각(0.8초 무시용)
  let endRunMs = 0;          // 손을 뗐을 때까지 도움닫기한 시간
  let endF = 0;              // 손을 뗐을 때까지 난 시간(초)
  let record = null;         // 이번 판 기록(미터)
  const holding = () => phase === 'runup' || phase === 'fly';

  /* ---------- 규칙: 누르기 · 떼기 · 시간이 흘러 생기는 일 ---------- */
  // 시간이 흘러 저절로 바뀌는 것: 도움닫기 0.9초 → 날기, 떨어지기 0.45초 → 착지
  function settle(t) {
    if (phase === 'runup' && t - pressT >= RUNUP_MS) phase = 'fly';

  }
  // 키캡을 누른 순간. 새 판이 시작됐으면 true(떨어지는 중 · 착지 0.8초 안에는 무시)
  function grab(t) {
    settle(t);

    phase = 'runup'; pressT = t; record = null; endRunMs = 0; endF = 0;
    syncText(); render(); startLoop();
    return true;
  }
  // 키캡에서 손이 떨어진 순간(뗌 · 미끄러짐 · 창 가려짐 모두 여기로). 그 자리에서 판이 끝난다
  function letGo(t) {

      endRunMs = Math.max(0, Math.min(RUNUP_MS, t - pressT)); endF = 0; record = 0;
      phase = 'landed'; landedAt = t;
    } else {
      endRunMs = RUNUP_MS; endF = Math.max(0, (t - pressT - RUNUP_MS) / 1000);
      record = distAtFlight(endF);
      phase = 'fall';
      if (record > best) { best = record; saveBest(best); }
    }
    syncText(); render(); startLoop();
    return true;
  }

  // 지금 그릴 장면의 숫자들: 도움닫기한 시간 · 난 시간 · 거리 · 배경이 흘러간 칸 수 · 땅이 내려간 칸 수
  const smooth = (k) => k * k * (3 - 2 * k);
  function view(t) {
    let runMs = 0, f = 0;

    else if (phase === 'fall' || phase === 'landed') { runMs = endRunMs; f = endF; }

    const pa = poseAt(f);
    return {
      runMs, f, dist,
      scroll: RUNUP_PX * runMs / RUNUP_MS + uAt(f),
      drop: Math.round(DROP_MAX * smooth(Math.min(1, f / DROP_S))),

  }
  // 지금 사람이 하고 있는 몸짓 이름
  function poseNameNow(v) {
    if (phase === 'ready') return 'stand';
    if (phase === 'runup') return 'run';
    if (phase === 'fly') return POSES[v.pose][1];

  }

  /* ---------- 화면 다시 그리기: 움직이는 동안은 그릴 때마다 ---------- */
  function refresh() { settle(now()); render(); }
  let rafId = 0;
  let lastFrame = null; // 바로 앞 그림을 그린 시각(화면이 오래 멈췄는지 알아채는 데 쓴다)
  const animating = (t) => phase === 'runup' || phase === 'fly' || phase === 'fall' || (phase === 'landed' && t - landedAt < 1500);
  const shouldLoop = () => manual === null && !document.hidden && animating(now());
  function loop() {
    rafId = 0;
    if (manual !== null || document.hidden) { lastFrame = null; return; }
    const t = now();
    // 화면이 1초 넘게 멈춰 있었다면(잠자기 · 가려진 창) 그동안 거리가 쌓이지 않게, 멈추기 직전에 뗀 것으로 끝낸다
    if (lastFrame !== null && t - lastFrame > STALL_MS && holding()) letGo(lastFrame);
    lastFrame = t;
    refresh();
    if (shouldLoop()) rafId = requestAnimationFrame(loop); else lastFrame = null;
  }
  function startLoop() {
    if (rafId || !shouldLoop()) return;
    lastFrame = null;
    rafId = requestAnimationFrame(loop);
  }

  // 소리 바꾸기(1 → 2 → … → 6 → 끔 → 1). 고르면 그 소리를 한 번 들려준다
  function nextSound() { KeySound.next(); drawSoundBtn(); }

  /* ---------- 몸통 색 바꾸기 ---------- */
  function setSkin(n) {
    n = Math.floor(Number(n));
    if (!(n >= 0 && n < SKINS.length)) return false;
    skin = n;
    saveNum(SKIN_KEY, n);
    fit();
    return true;
  }
  const nextSkin = () => setSkin((skin + 1) % SKINS.length);

  /* ---------- 몸통 위 작은 버튼(점 글씨) ---------- */
  const el = {
    main: document.getElementById('main'),
    deviceE: document.getElementById('deviceE'),
    bodyArt: document.getElementById('bodyArt'), bodyFill: document.getElementById('bodyFill'), bodyLine: document.getElementById('bodyLine'),
    screen: document.getElementById('screen'),
    soundBtn: document.getElementById('soundBtn'), soundCanvas: document.getElementById('soundCanvas'), soundLabel: document.getElementById('soundLabel'),
    skinBtn: document.getElementById('skinBtn'), skinCanvas: document.getElementById('skinCanvas'), skinLabel: document.getElementById('skinLabel'),
    keyPush: document.getElementById('keyPush'), keyPushCanvas: document.getElementById('keyPushCanvas'),
    grip: document.getElementById('grip'),
  };
  const dpr = () => window.devicePixelRatio || 1;

  // 작은 버튼의 한 칸 크기(화면 점 1.5개)
  const cornerCell = () => Math.max(1, Math.round(1.5 * dpr()));
  function sizeCorner(cv, cw, ch) {
    const r = dpr();
    if (cv.width !== cw || cv.height !== ch) { cv.width = cw; cv.height = ch; }
    cv.style.width = `${cw / r}px`; cv.style.height = `${ch / r}px`;
  }

  /* 한 칸짜리 버튼(소리 · 몸통 색): 폭 13칸 = 여백 3 + 상자 7 + 여백 3, 높이 17칸, 상자 7×9칸.
     비유: 같은 틀의 도장 둘. 틀(흰 바탕 + 검은 테두리)은 같고 상자 안 그림만 다르다 */
  const BTN_ROWS = 17, ONE_COLS = 13, ONE_BOX_W = 7, ONE_BOX_H = 9, BTN_GAP = 6; // BTN_GAP = 버튼 사이 화면 점
  function drawOneBtn(cv, labelEl, label, paint) {

    pixelFrame(ctx, cw, ch, cc, BG);

  }
  // 상자 안 5×7 점 그림(상자 둘레 한 칸 안쪽에 찍는다)
  function boxArt(ctx, bx, by, cc, rows) {
    ctx.fillStyle = BG;
    const top = Math.floor((7 - rows.length) / 2); // 5×5 그림은 세로 가운데로
    rows.forEach((row, j) => {
      for (let i = 0; i < row.length; i += 1) if (row[i] === '#') ctx.fillRect(bx + (1 + i) * cc, by + (1 + top + j) * cc, cc, cc);

  }
  const SOUND_OFF = ['#...#', '.#.#.', '..#..', '.#.#.', '#...#']; // 소리 끔 = 점 ×
  // 소리 버튼: 상자 안에 지금 소리 번호(1~6), 끔이면 ×
  function drawSoundBtn() {
    const i = KeySound.index;
    drawOneBtn(el.soundCanvas, el.soundLabel, i ? `소리 ${i}` : '소리 끔', (ctx, bx, by, cc) => boxArt(ctx, bx, by, cc, i ? GLYPHS[i] : SOUND_OFF));
  }
  // 몸통 색 버튼: 상자 하나를 지금 몸통 색으로 칠하고 검은 테두리 한 칸
  function drawSkinBtn() {
    drawOneBtn(el.skinCanvas, el.skinLabel, `몸통 ${SKINS[skin].name}`, (ctx, bx, by, cc) => {
      ctx.fillStyle = BG; ctx.fillRect(bx, by, ONE_BOX_W * cc, ONE_BOX_H * cc);

  }

  /* ---------- 키캡 하나 ----------
     비유: 진짜 키보드 키. 누르는 순간 한 번 받고, 손을 떼기 전까지는 아무리 다른 손가락으로 두드려도 다시 받지 않는다.
     이 게임에서는 「누르고 있는 동안 = 나는 중」, 「키에서 손이 떨어짐 = 그 판 끝」이다.

  const keyHold = { push: null };
  let keyCell = 1;        // 키캡 그림 한 칸이 기기 화면 점 몇 개인지

  function holdKey(name, who) {
    if (keyHold[name] !== null) return false; // 이미 눌려 있음: 떼기 전엔 다시 받지 않는다
    keyHold[name] = who;
    if (who !== 'test') { KeySound.unlock(); KeySound.down(); } // 누르는 순간 「딸깍」 한 번(검사 손잡이는 조용히)
    grab(now());
    drawKeys();
    return true;
  }
  // who를 주면 그 손가락(또는 키보드 키)이 누른 경우에만 뗀다
  function releaseKey(name, who) {
    if (keyHold[name] === null) return false;
    if (who !== undefined && keyHold[name] !== who) return false;
    const by = keyHold[name];
    keyHold[name] = null;
    if (by !== 'test') KeySound.up(); // 떼는 순간 한 번(누르고 있는 동안에는 소리 없음)

    drawKeys();
    return true;
  }

  // 키캡 하나 그리기(20×20칸): 여섯 게임이 같이 쓰는 도트 키캡 그림(KeyArt.pixel) 하나로만 그린다.
  // 비유: 같은 도장을 찍는 것 — 안 눌림 · 눌림 두 장뿐이고, 이 게임 키에는 윗면 아이콘이 없다(빈 키)
  function drawKey(cv, down) {
    KeyArt.pixel(cv.getContext('2d'), KEY_CELLS * keyCell, down);
  }
  function drawKeys() {
    drawKey(el.keyPushCanvas, keyHold.push !== null);
  }

  // 읽어 주는 기능용 글: 화면 이름표에 지금 상태를 함께 둔다(판이 바뀔 때만 고친다)
  function syncText() {
    let aria = '멀리뛰기';
    if (phase === 'landed') aria = `멀리뛰기, 기록 ${distText(record || 0)}`;
    else if (holding() || phase === 'fall') aria = '멀리뛰기, 나는 중';

  /* ---------- 그리기: 128×96칸 작은 판에 찍은 뒤 그대로 키운다 ---------- */
  const g = el.screen.getContext('2d');
  const board = document.createElement('canvas');
  const c = board.getContext('2d');
  let H = 0;         // 지금 검은 화면 세로 칸 수
  let skyShift = 0;  // 기준 그림을 아래로 내리는 칸 수(늘어난 하늘 몫)
  let skyClouds = []; // 늘어난 하늘에 더 띄운 구름 [처음 가로 자리, 세로 자리, 모양]
  const drawn = { distText: '0.00m', bestText: '', lapText: '', hud: null, hint: null, man: null, hip: null, pit: null }; // 마지막으로 화면에 그린 글자와 자리(검사용, 자리 단위는 칸)

  let ink = null; // 지금 붓 색(같은 색이면 다시 고르지 않아 빠르게)
  let clipL = 0, clipR = W; // 배경 구간을 나눠 그릴 때 쓰는 가로 울타리(이 안에만 찍힌다)
  function dot(x, y, color = INK) {
    if (x < clipL || x >= clipR || y < 0 || y >= H) return;

    c.fillRect(x, y, 1, 1);
  }

    c.fillRect(x, y, w, h);
  }
  function sprite(x, y, rows, color = INK, k = 1) {
    rows.forEach((row, j) => {
      for (let i = 0; i < row.length; i += 1) {
        if (row[i] !== '#') continue;
        for (let dy = 0; dy < k; dy += 1) for (let dx = 0; dx < k; dx += 1) dot(x + i * k + dx, y + j * k + dy, color);
      }
    });
  }

  function spriteWithHalo(x, y, rows) {
    rows.forEach((row, j) => {
      for (let i = 0; i < row.length; i += 1) {
        if (row[i] !== '#') continue;
        for (let dy = -1; dy <= 1; dy += 1) for (let dx = -1; dx <= 1; dx += 1) dot(x + i + dx, y + j + dy, BG);
      }
    });

  }

  // 세로 칸 수가 바뀌면: 그림 전체를 내릴 칸 수 · 늘어난 하늘의 구름을 다시 정한다
  function setRows(rows) {
    if (rows === H) return;
    H = rows;
    board.width = W; board.height = H; ink = null;
    skyShift = Math.round((H - BASE_H) * SKY_SHARE);

    skyClouds = [];
    for (let k = 1; ; k += 1) {
      const y = skyShift + 5 - SKY_BAND * k;
      if (y < 2) break;
      for (let n = 0; n < 2; n += 1) {
        const [home, wobble, rows2] = SKY_CLOUDS[((k - 1) * 2 + n) % SKY_CLOUDS.length];
        skyClouds.push([home, y + wobble, rows2]);
      }
    }
  }

  // 점 글씨 한 줄을 판에 찍는다. 글자 뒤에 검은 상자를 깔지 않고(뒤로 지나가는 풍경이 보이게),
  // 글자 점마다 둘레 1칸만 검게 둘러 풍경 위에서도 읽히게 한다. font = 글씨 본(큰 것 GLYPHS · 작은 것 GLYPHS_S), k = 몇 배
  function boardText(keys, x, y, k, font) {
    const each = (fn) => {
      let cx = x;
      keys.forEach((key) => { const gl = font[key]; fn(cx, gl); cx += (gl[0].length + 1) * k; });
    };
    each((cx, gl) => gl.forEach((row, j) => {
      for (let i = 0; i < row.length; i += 1) if (row[i] === '#') box(cx + i * k - 1, y + j * k - 1, k + 2, k + 2, BG);
    }));
    each((cx, gl) => sprite(cx, y, gl, INK, k));
  }

  // 흩뿌리기용 뒤섞기 숫자: 같은 자리에는 늘 같은 값이 나온다(별 · 오로라 길이)
  function hash(n) {
    n = Math.imul(n ^ 0x9e3779b9, 0x85ebca6b); n ^= n >>> 13;

  }

  /* ---------- 사람: 관절 각도로 그리는 졸라맨 ----------
     비유: 철사 인형. 허리 자리와 「몸통 · 팔 · 다리가 향하는 각도」만 정하면 선으로 이어 그린다.
     각도는 도(°) — 0 = 오른쪽, 90 = 아래, -90 = 위, 180 = 왼쪽. 팔 · 다리는 [윗마디 각도, 아랫마디 각도] */
  const TORSO = 6, UPPER = 3, FORE = 3, THIGH = 4, SHIN = 4;
  const HEAD = ['.##.', '####', '####', '.##.'];
  const D2R = Math.PI / 180;
  const POSE_SHIFT = { swim: -4, lying: 4, superman: -4, pillow: -4, chin: -4 }; // 누운 몸짓은 허리가 한쪽으로 쏠려서, 몸이 화면 가운데 오게 허리를 옮긴다
  const ZED = ['###', '.#.', '###']; // 졸 때 머리 위로 떠오르는 z
  /* 뛰어오르는 연속 동작의 본보기 자세 셋(멀리뛰기 연속 사진에서 옮김). 사람은 오른쪽을 본다 */
  const KEY_TAKEOFF = { torso: -82, arms: [[-20, -70], [140, 85]], legs: [[100, 100], [-15, 80]], feet: true };   // 디딤: 뒷발로 박차고 앞 무릎을 들어 올림, 팔은 앞뒤
  const KEY_RISE = { torso: -108, arms: [[-150, -130], [-68, -58]], legs: [[112, 150], [96, 138]], feet: true };  // 떠오름: 가슴을 내밀어 젖히고 두 팔을 위로, 다리는 뒤에 끌림
  const KEY_TUCK = { torso: -58, arms: [[-25, -10], [-5, 8]], legs: [[-10, 10], [2, 22]], feet: true };           // 다리 모음: 두 다리를 앞으로 모아 들고 상체를 숙여 두 팔을 앞으로
  const lerp = (a, b, k) => a + (b - a) * k;
  const mixLimbs = (A, B, k) => A.map((p, i) => [lerp(p[0], B[i][0], k), lerp(p[1], B[i][1], k)]);
  const mixPose = (A, B, k) => ({ torso: lerp(A.torso, B.torso, k), arms: mixLimbs(A.arms, B.arms, k), legs: mixLimbs(A.legs, B.legs, k), feet: true });
  // 날기 시작한 지 f초일 때의 자세: 디딤(잠깐 멈춤) → 떠오름(잠깐 멈춤) → 다리 모음

    const gap = landed ? 2 * HUD_GAP : HUD_GAP;
    const distY = HUD_Y + smallH + gap;
    const lapKeys = v.lap > 0 ? ['◍', ' ', ...drawn.lapText] : [];
    const lapY = distY + HUD_DIST_H * bigK + gap;
    const lineBox = (keys, y, k, font) => ({ x: HUD_X, y, w: measure(keys, font).w * k, h: measure(keys, font).h * k });
    drawn.hud = { best: lineBox(bestKeys, HUD_Y, 1, smallFont), dist: lineBox(distKeys, distY, bigK, GLYPHS), lap: lapKeys.length ? lineBox(lapKeys, lapY, 1, smallFont) : null };
    // 검수 반영(11/11): 구름과 바람 줄만 글자 둘레(좌우 6칸 · 위아래 2칸)를 건너뛴다 — 숫자 옆에 붙으면 빼기 부호 · 소수점처럼 읽혀서
    // 기록을 잘못 보게 된다(예: 「807.38km」). 검은 바탕 상자는 그대로 없고, 새 · 비행기는 글자 뒤로 그대로 지나간다
    const keep = [drawn.hud.best, drawn.hud.dist, drawn.hud.lap].filter(Boolean).map((r) => ({ x: r.x - 6, y: r.y - 2, w: r.w + 12, h: r.h + 4 }));
    const skyAt = (x, y, rows, halo, avoid) => {
      if (avoid && keep.some((r) => x < r.x + r.w && r.x < x + rows[0].length && y < r.y + r.h && r.y < y + rows.length)) return;
      if (halo) spriteWithHalo(x, y, rows); else sprite(x, y, rows);
    };

    // 높은 구름(가장 느리게): 원래 셋 + 늘어난 하늘에 더 띄운 것들
    const cloudShift = Math.floor(v.scroll * 0.15);
    CLOUDS.forEach(([home, y, rows]) => { const w = rows[0].length; skyAt(mod(home + w - cloudShift, W + 24) - w, y + oy, rows, false, true); });
    skyClouds.forEach(([home, y, rows]) => { const w = rows[0].length; skyAt(mod(home + w - cloudShift, W + 24) - w, y, rows, false, true); });
    // 하늘을 스치는 것들(새 · 비행기 · 인공위성): 오래 날수록 하나씩 더 나온다
    const flyer = (front) => FLYERS.forEach(([frames, y, share, slow, loopLen, from, isFront]) => {
      if (isFront !== front || v.f < from) return;
      const rows = frames[Math.floor(t / 180) % frames.length];
      const x = W + 8 - Math.floor(mod(slow * (uAt(v.f) - uAt(from)), loopLen));
      skyAt(x, y + Math.round(oy * share), rows, front);
    });
    flyer(false);

    // 땅 풍경: 오른쪽부터 지금 배경 → 그 앞 배경 순으로, 바뀌는 자리(edge)에서 잘라 그린다
    let x1 = W;
    for (let z = v.scene; z >= 0 && x1 > 0; z -= 1) {
      const x0 = z > 0 ? Math.max(0, Math.min(x1, edgeOf(z) - S)) : 0;
      if (x1 > x0) { clipL = x0; clipR = x1; drawScene(z, S, gy, t); }
      x1 = x0;
    }
    clipL = 0; clipR = W;
    // 모래판 자리(검사용): 맨 처음 경기장이 화면에 있을 때만
    drawn.pit = v.scene === 0 || edgeOf(1) - S > 0 ? { x: PIT_X - 1 - S, y: gy + 1, w: PIT_W + 2, h: 5 } : null;

    // 준비 화면(누르기 전)에만: 모래판 아래 트랙을 비우고 「꾹 누르고 있기!」를 크게. 누르는 순간 사라지고 레인 점선이 돌아온다
    drawn.hint = null;
    if (phase === 'ready') {
      const hintX = Math.floor((W - HINT_W) / 2), hintY = gy + HINT_DY;
      box(0, hintY - 2, W, H - (hintY - 2), BG);
      HINT.forEach(([dx, rows]) => sprite(hintX + dx, hintY, rows));
      drawn.hint = { x: hintX, y: hintY, w: HINT_W, h: HINT_H };
    }

    // 발아래 구름 · 바람 줄(속도가 붙으면 늘어난다)
    flyer(true);
    if (v.f >= WIND_FROM) {
      const n = Math.min(WIND_ROWS.length, 1 + Math.floor((v.f - WIND_FROM) / 25));
      for (let i = 0; i < n; i += 1) {
        const len = 5 + (i * 3) % 5, y = WIND_ROWS[i] + oy;
        const x = W + len - Math.floor(mod(v.f * 220 + i * 53, W + 60));
        if (keep.some((r) => x < r.x + r.w && r.x < x + len && y >= r.y && y < r.y + r.h)) continue; // 글자 둘레의 바람 줄은 건너뜀
        for (let k = 0; k < len; k += 1) dot(x + k, y);
      }
    }

    // 사람
    const groundHip = GROUND_Y + oy - 9; // 땅에 서 있을 때 허리 높이
    const name = poseNameNow(v);
    const lastPose = POSES[v.pose][1];
    const flyX = RUN_HIP_X + (FLY_HIP_X - RUN_HIP_X) * smooth(Math.min(1, v.f / 1.5)) + shiftAt(v.f);
    // 높이: 구름판을 박차고 포물선으로 꼭대기까지 올랐다가, 조금 내려오다 「떠 있는 높이」에서 멈춘다(거기서부터 팔 허우적으로 버팀)
    const hover = FLY_HIP_Y + oy, top = hover - AIR.peak;
    let flyY;
    if (v.f <= AIR.apex) { const u = Math.max(0, Math.min(1, (v.f - AIR.leave) / (AIR.apex - AIR.leave))); flyY = groundHip + (top - groundHip) * (1 - (1 - u) * (1 - u)); }
    else flyY = top + (hover - top) * smooth(Math.min(1, (v.f - AIR.apex) / (AIR.settle - AIR.apex)));
    // 떠 있는 동안의 흔들림: 팔 허우적 때는 잘게 바들바들, 그 뒤로는 느긋하게 둥실
    const bob = v.f < AIR.settle ? 0 : (lastPose === 'flail' ? Math.sin(t / 90) : Math.sin(t / 400) * 1.2);
    let hx = RUN_HIP_X, hy = groundHip;
    if (phase === 'runup') hy -= Math.abs(Math.sin(v.runMs / (RUNUP_MS / RUNUP_STEPS) * Math.PI)) > 0.7 ? 1 : 0;
    else if (phase === 'fly') { hx = flyX; hy = flyY + bob; }
    else if (phase === 'fall') { const q = Math.min(1, Math.max(0, (t - releaseT) / FALL_MS)); hx = flyX; hy = flyY + (gy - 2 - flyY) * q * q; }
    else if (landed) { if (name === 'splat') { hx = RUN_HIP_X; hy = gy - 3; } else { hx = flyX; hy = gy - 2; } }
    hx = Math.round(hx); hy = Math.round(hy);
    drawn.hip = { x: hx, y: hy }; // 허리 자리(검사용: 포물선으로 올랐다가 떠 있는지 볼 때 쓴다)
    // 나는 중에는 자세 사이 동작까지 넣은 자세로, 그 밖(준비 · 도움닫기 · 떨어짐 · 착지)은 그 몸짓 그대로
    const head = drawMan(hx, hy, phase === 'fly' ? flyPose(v.f, t) : poseOf(name, t, v.runMs, v.f));
    const posed = phase === 'fly' && v.blend >= 1; // 사이 동작이 끝나 그 자세가 다 된 뒤에만 땀 · z 같은 소품을 그린다

    // 졸기: 머리 위로 z가 둘 떠오른다
    if (name === 'doze' && posed) {
      for (let i = 0; i < 2; i += 1) {
        const ph = mod(t / 400 + i * 4, 8);
        spriteWithHalo(head[0] + 3 + Math.floor(ph / 2), head[1] - 5 - Math.floor(ph), ZED);
      }
    }
    // 지친 몸짓: 혀를 내밀고 땀방울이 뒤로 날린다
    if (name === 'tired' && posed) {
      dot(head[0] + 2, head[1] + 1); dot(head[0] + 2, head[1] + 2);
      for (let i = 0; i < 2; i += 1) {
        const ph = mod(t / 90 + i * 5, 10), sx = head[0] - 3 - Math.floor(ph), sy = head[1] - 3 + Math.floor(ph / 3) + i;
        dot(sx, sy); dot(sx, sy + 1);
      }
    }
    // 착지 흙먼지: 0.6초 동안 양옆으로 퍼지며 사라진다
    if (landed) {
      const age = t - landedAt;
      if (age >= 0 && age < 600) {
        const r = Math.floor(age / 100), mid = name === 'splat' ? hx + 4 : hx;
        sprite(mid - 9 - 2 * r, gy - 3 - Math.floor(r / 2), PUFF);
        sprite(mid + 8 + 2 * r, gy - 3 - Math.floor(r / 2), PUFF);
        if (r < 4) { dot(mid - 5 - 3 * r, gy - 6 - r); dot(mid + 6 + 3 * r, gy - 6 - r); }
      }
    }

    // 글자: 왼쪽 위 왕관 + 최고 기록, 그 아래 거리(착지하면 2배), 그 아래 지구 + 바퀴 수
    boardText(bestKeys, HUD_X, HUD_Y, 1, smallFont);
    boardText(distKeys, HUD_X, distY, bigK, GLYPHS);
    if (lapKeys.length) boardText(lapKeys, HUD_X, lapY, 1, smallFont);

    // 작은 판을 큰 그림판에 옮긴다
    g.imageSmoothingEnabled = false;
    g.drawImage(board, 0, 0, el.screen.width, el.screen.height);
  }

  /* ---------- 몸통 겉모양: 위 두 모서리는 둥글게, 아래 두 모서리는 비스듬히 깎기 ----------
     inset = 바깥선에서 안으로 들어온 거리(검은 몸통의 안쪽 흰 선을 그릴 때 씀) */
  function bodyPath(w, h, rad, bevel, inset) {
    const i = inset, R = Math.max(0, rad - i), B = Math.max(0, bevel - i * 0.41);
    const x0 = i, y0 = i, x1 = w - i, y1 = h - i;
    return `M ${x0} ${y0 + R} A ${R} ${R} 0 0 1 ${x0 + R} ${y0} L ${x1 - R} ${y0} A ${R} ${R} 0 0 1 ${x1} ${y0 + R} `
      + `L ${x1} ${y1 - B} L ${x1 - B} ${y1} L ${x0 + B} ${y1} L ${x0} ${y1 - B} Z`;
  }
  function drawBody(dw, dh, rad, bevel) {
    const sk = SKINS[skin];
    el.bodyArt.setAttribute('viewBox', `0 0 ${dw} ${dh}`);
    el.bodyArt.setAttribute('width', dw); el.bodyArt.setAttribute('height', dh);
    el.bodyFill.setAttribute('d', bodyPath(dw, dh, rad, bevel, 0));
    el.bodyFill.setAttribute('fill', sk.body);
    if (sk.line) {
      el.bodyLine.setAttribute('d', bodyPath(dw, dh, rad, bevel, 1)); // 굵기 2 선의 가운데를 1 안쪽에 → 바깥선 안쪽 0~2점
      el.bodyLine.setAttribute('stroke', INK); el.bodyLine.setAttribute('stroke-width', '2');
    } else {
      el.bodyLine.removeAttribute('d');
    }
  }

  // 오돌토돌한 띠: 본보기 기기 아래쪽 회색 띠. 모서리 둥근 직사각형을 띠 색으로 칠하고, 몸통 색 점을 흩뿌린다
  function drawGrip(gw, gh) {
    const cv = el.grip, r = dpr(), ctx = cv.getContext('2d'), sk = SKINS[skin];
    const w = Math.max(1, Math.round(gw * r)), h = Math.max(1, Math.round(gh * r));
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    cv.style.width = `${w / r}px`; cv.style.height = `${h / r}px`;
    ctx.clearRect(0, 0, w, h);
    const rr = Math.min(h / 2, Math.round(h * 0.3));
    ctx.beginPath();
    ctx.moveTo(rr, 0); ctx.lineTo(w - rr, 0); ctx.arcTo(w, 0, w, rr, rr); ctx.lineTo(w, h - rr); ctx.arcTo(w, h, w - rr, h, rr);
    ctx.lineTo(rr, h); ctx.arcTo(0, h, 0, h - rr, rr); ctx.lineTo(0, rr); ctx.arcTo(0, 0, rr, 0, rr); ctx.closePath();
    ctx.fillStyle = sk.grip; ctx.fill();
    // 점 무늬(여섯 게임 같은 규칙): 점 하나 = 화면 점 2개, 가로 6 · 세로 4 간격, 한 줄 걸러 반 칸 어긋나게
    ctx.save(); ctx.clip();
    const p = Math.max(1, Math.round(2 * r));
    ctx.fillStyle = sk.body;
    for (let row = 0, y = 2 * p; y + p <= h - 2 * p; row += 1, y += 2 * p) {
      for (let x = 2 * p + (row % 2 ? Math.round(1.5 * p) : 0); x + p <= w - 2 * p; x += 3 * p) ctx.fillRect(x, y, p, p);
    }
    ctx.restore();
  }

  /* ---------- 자리 맞추기 ----------
     몸통 폭 dw = min(창 폭 − 28, 460). 위에서부터: 띠(작은 버튼 줄 + 위아래 10) → 검은 화면 → 7% → 키캡 → 7% → 오돌토돌한 띠(7%) → 7%.
     합이 창 높이 − 28을 넘으면 화면 칸 크기부터, 그다음 키캡 크기를 줄인다(키캡은 72 아래로 안 줄임) */
  let bandSide = 0; // 위 띠 양옆 여백(화면 점): 게임 버튼의 왼쪽 자리 = 오른쪽 묶음의 오른쪽 여백
  function fit() { fitDevice(); placeGameBtn(); }
  // 창이 낮으면(가로로 눕힌 폰 등) 몸통 폭부터 줄인다 — 검수 지적: 폭은 그대로 두고 화면만 줄이니 화면이 점 하나 크기가 됐다.
  // 화면 칸 · 키캡을 제 크기로 놓았을 때(위 띠 + 화면 + 키캡 + 틈 넷) 창 높이 안에 들어가는 가장 큰 폭을 찾는다
  function fitWidth(maxW, roomH, band, rows, keyShare) {
    const r = dpr();
    for (let w = maxW; w > 160; w -= 4) {
      const cell = Math.max(1, Math.floor(w * 0.86 * r / 128));
      if (band + (rows * cell) / r + Math.max(72, w * keyShare) + 4 * Math.round(w * 0.07) <= roomH) return w;
    }
    return Math.min(maxW, 160);
  }
  function fitDevice() {
    const r = dpr(), rows = ROWS;
    drawSoundBtn(); drawSkinBtn();
    const btnH = BTN_ROWS * cornerCell() / r; // 작은 버튼 높이(화면 점)
    const band = btnH + 2 * BAND_PAD;

    const mb = el.main.getBoundingClientRect();
    const limitH = mb.height - EDGE;
    const dw = fitWidth(Math.max(120, Math.floor(Math.min(mb.width - EDGE, DEVICE_MAX))), limitH, band, rows, KEY_SHARE_ONE);
    const gap = Math.round(dw * GAP_SHARE);
    const gh = gap; // 띠 높이 = 몸통 폭의 7%

    // 키캡 크기: 20칸 × 정수 점이 되는 크기 중 목표(몸통 폭의 40%)에 가장 가까운 것, 72 ~ 190 사이
    const want = dw * KEY_SHARE_ONE;
    let kc = 0, bestFit = Infinity;
    for (let cc = 1; KEY_CELLS * cc / r <= KEY_MAX + 0.01; cc += 1) {
      const size = KEY_CELLS * cc / r;
      if (size >= KEY_MIN - 0.01 && Math.abs(size - want) < bestFit) { kc = cc; bestFit = Math.abs(size - want); }
    }
    if (!kc) kc = Math.max(1, Math.ceil(KEY_MIN * r / KEY_CELLS));
    const kcMin = Math.ceil((KEY_MIN - 0.01) * r / KEY_CELLS);

    // 검은 화면: 128 × rows칸, 한 칸 = 정수 기기 화면 점
    let cellPx = Math.max(1, Math.floor(dw * SCREEN_SHARE * r / W));
    const total = (cp, k) => band + (rows * cp) / r + gap + (KEY_CELLS * k) / r + gap + gh + gap;
    while (cellPx > 1 && total(cellPx, kc) > limitH) cellPx -= 1;
    while (kc > kcMin && total(cellPx, kc) > limitH) kc -= 1;
    // 몸통을 세로로 길게(형님 「위아래 여백이 너무 많아」): 폭의 1.5배까지(창 높이 안에서), 남는 높이를 세 틈(화면~키캡 · 키캡~띠 · 띠~몸통 끝)에 똑같이 나눠 넣는다
    const lift = Math.max(0, Math.floor((Math.min(limitH, Math.round(dw * BODY_TALL)) - total(cellPx, kc)) / 3));
    keyCell = kc;
    const ks = KEY_CELLS * kc / r;
    const sw = (W * cellPx) / r, sh = (rows * cellPx) / r;

    const keyTop = Math.round(band + sh + gap + lift);
    const gripTop = Math.round(keyTop + ks + gap + lift);
    const dh = Math.round(gripTop + gh + gap + lift);

    // 몸통
    const ds = el.deviceE.style, rad = Math.round(dw * CORNER_SHARE), bevel = Math.round(dw * CORNER_SHARE);
    ds.width = `${dw}px`; ds.height = `${dh}px`;
    drawBody(dw, dh, rad, bevel);

    // 위 띠: 왼쪽 끝 게임 버튼(placeGameBtn이 놓는다) · 오른쪽 끝에서부터 몸통 색 ← 소리(사이 6점)
    // 몸통이 아주 좁아 두 묶음이 겹칠 것 같으면 양옆 여백(side)을 줄여 자리를 낸다
    const oneW = ONE_COLS * cornerCell() / r;
    const gameW = (3 + gameList().length * (GAME_BOX_W + 1) - 1 + 3) * cornerCell() / r;
    const need = gameW + BTN_GAP + 2 * oneW + BTN_GAP;
    bandSide = Math.max(0, Math.min(Math.round(dw * 0.08), Math.floor((dw - need) / 2)));
    let bx = dw - bandSide - oneW;
    [el.skinBtn, el.soundBtn].forEach((b) => {
      b.style.right = ''; b.style.left = `${bx}px`; b.style.top = `${BAND_PAD}px`;
      bx -= oneW + BTN_GAP;
    });

    // 검은 화면: 가운데 정렬
    setRows(rows);
    if (el.screen.width !== W * cellPx || el.screen.height !== H * cellPx) { el.screen.width = W * cellPx; el.screen.height = H * cellPx; }
    el.screen.style.width = `${sw}px`; el.screen.style.height = `${sh}px`;
    el.screen.style.left = `${Math.round((dw - sw) / 2)}px`;
    el.screen.style.top = `${Math.round(band)}px`;

    // 키캡 하나: 가운데
    const n = KEY_CELLS * kc, cv = el.keyPushCanvas, b = el.keyPush;
    if (cv.width !== n || cv.height !== n) { cv.width = n; cv.height = n; }
    cv.style.width = `${ks}px`; cv.style.height = `${ks}px`;
    b.style.left = `${Math.round((dw - ks) / 2)}px`; b.style.top = `${keyTop}px`;
    b.style.width = `${ks}px`; b.style.height = `${ks}px`;

    // 오돌토돌한 띠: 가운데
    const gw = Math.round(dw * GRIP_SHARE);
    drawGrip(gw, gh);
    el.grip.style.left = `${Math.round((dw - gw) / 2)}px`; el.grip.style.top = `${gripTop}px`;

    drawKeys();
    syncText();
    render();
  }

  /* ---------- 게임 버튼: 위 띠 왼쪽 끝, 누른 숫자 칸의 게임으로 바로 간다 ----------
     비유: TV 리모컨 숫자 버튼. 1 시지프스 · 2 10.00000 · 3 결투 · 4 100m · 5 퍼덕 · 6 멀리뛰기 중 누른 번호로 곧장.
     여섯 게임은 같은 전시장의 옆 폴더라서 「한 칸 위 폴더 → 옆 폴더」 주소로 옮겨 간다.
     이 컴퓨터의 폴더 이름(local)과 인터넷 전시장의 폴더 이름(web)이 달라서 둘 다 적어 두고,
     지금 열린 폴더 이름이 어느 쪽인지 보고 같은 쪽 이름으로 간다.
     키보드 바로 가기는 두지 않는다(100m의 F · J 사이 G처럼, 달리다 스치면 판이 날아가서).
     (fit()이 처음 불리는 때보다 앞서 쓰일 수 있어서 값은 const 대신 함수로 돌려준다) */
  function gameHere() { return '6'; }
  function gameList() {
    return [
      { id: '1', name: '시지프스', local: 'streak-sisyphus', web: 'hold-on-sisyphus' },
      { id: '2', name: '10.00000', local: 'key-ten', web: 'hold-on-key-ten' },
      { id: '3', name: '결투', local: 'key-duel', web: 'hold-on-key-duel' },
      { id: '4', name: '100m', local: 'key-100m', web: 'hold-on-key-100m' },
      { id: '5', name: '퍼덕', local: 'key-flap', web: 'hold-on-key-flap' },
      { id: '6', name: '멀리뛰기', local: 'key-leap', web: 'hold-on-key-leap' },
    ];
  }
  function gameUrl(id) {
    const list = gameList(), target = list.find((g) => g.id === String(id));
    if (!target) return null;
    // 지금 폴더 이름: …/hold-on-key-ten/ → hold-on-key-ten, …/key-ten/index.html → key-ten
    const parts = location.pathname.split('/').filter(Boolean);
    if (parts.length && /\.html?$/i.test(parts[parts.length - 1])) parts.pop();
    const here = decodeURIComponent(parts[parts.length - 1] || '');
    const onWeb = list.some((g) => g.web === here);
    return onWeb ? `../${target.web}/` : `../${target.local}/index.html`;
  }
  // 넘어간 게임마다 뒤로 가기 기록이 쌓이지 않게 지금 칸을 바꿔 끼운다. 지금 게임 번호면 아무 일 없음
  function goGame(id) {
    if (String(id) === gameHere()) return false;
    const url = gameUrl(id);
    if (!url) return false;
    location.replace(url);
    return true;
  }
  // 그림: 다른 작은 버튼과 같은 틀. 테두리 안에 1 ~ 6, 지금 게임 숫자만 검게 칠한 칸에 흰 글씨(칸 수는 게임 목록 길이를 따른다)
  const GAME_BOX_W = 7, GAME_BOX_H = 9;                // 글자 한 칸 상자(글자 5×7 + 둘레 한 칸)
  function drawGameBtn(gb) {
    const cv = gb.querySelector('canvas'), ctx = cv.getContext('2d'), cc = cornerCell(), list = gameList();
    const cols = 3 + list.length * (GAME_BOX_W + 1) - 1 + 3, rowsN = 17;
    const cw = cols * cc, ch = rowsN * cc;
    sizeCorner(cv, cw, ch);
    ctx.clearRect(0, 0, cw, ch);
    pixelBlock(ctx, cw, ch, cc, INK);
    pixelFrame(ctx, cw, ch, cc, BG);
    list.forEach((g, i) => {
      const bx = (3 + i * (GAME_BOX_W + 1)) * cc, by = Math.floor((rowsN - GAME_BOX_H) / 2) * cc;
      if (g.id === gameHere()) {
        ctx.fillStyle = BG; ctx.fillRect(bx, by, GAME_BOX_W * cc, GAME_BOX_H * cc);
        drawText(ctx, [g.id], bx + cc, by + cc, cc, INK);
      } else {
        drawText(ctx, [g.id], bx + cc, by + cc, cc, BG);
      }
    });
    const label = `게임 ${gameHere()} ${list.find((g) => g.id === gameHere()).name}`;
    const gl = document.getElementById('gameLabel');
    if (gl && gl.textContent !== label) gl.textContent = label;
  }
  // 버튼 안 가로 위치(화면 점, 버튼 왼쪽 끝 = 0) → 몇 번째 숫자 칸인지.
  // 칸 경계 = 글자 상자 경계, 상자 사이 한 칸 틈은 그 가운데를 기준으로 가까운 칸, 양 끝 여백은 맨 끝 칸
  function gameIndexAt(xCss) {
    const n = gameList().length, cellsX = (xCss * dpr()) / cornerCell();
    const i = Math.floor((cellsX - 3 + 0.5) / (GAME_BOX_W + 1));
    return Math.max(0, Math.min(n - 1, i));
  }
  // 자리: 위 띠 왼쪽 끝(몸통 왼쪽에서 bandSide), 다른 작은 버튼과 같은 높이
  function placeGameBtn() {
    const gb = document.getElementById('gameBtn');
    if (!gb) return;
    drawGameBtn(gb);
    gb.style.left = `${bandSide}px`;
    gb.style.top = `${BAND_PAD}px`;
  }
  // 누르는 순간 그 번호 게임으로. 게임 누름으로 세지 않는다(아래로 퍼지지 않게 막음)
  document.getElementById('gameBtn').addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    const rect = e.currentTarget.getBoundingClientRect();
    goGame(gameList()[gameIndexAt(e.clientX - rect.left)].id);
  });
  if (window.ResizeObserver) new ResizeObserver(fit).observe(el.main);
  window.addEventListener('resize', fit);

  /* ---------- 입력: 손가락이 닿는 순간 누름, 떨어지는 순간 뗌 ---------- */
  const mainPointer = (e) => e.pointerType !== 'mouse' || e.button === 0;
  // 작은 버튼: 키캡 누름으로 세지 않는다
  el.soundBtn.addEventListener('pointerdown', (e) => {
    if (!mainPointer(e)) return;
    e.preventDefault(); e.stopPropagation();
    nextSound();
  });
  el.skinBtn.addEventListener('pointerdown', (e) => {
    if (!mainPointer(e)) return;
    e.preventDefault(); e.stopPropagation();
    nextSkin();
  });
  // 키캡: 누르는 순간 받는다. 그 손가락이 떼어지거나, 키 밖으로 미끄러지거나, 화면 밖으로 나가면 뗀 것
  el.keyPush.addEventListener('pointerdown', (e) => {
    if (!mainPointer(e)) return;
    e.preventDefault(); e.stopPropagation();
    // 손가락을 키에 묶어 두지 않아야 키 밖으로 미끄러진 것을 알아챈다
    const t = e.currentTarget;
    try { if (t.hasPointerCapture && t.hasPointerCapture(e.pointerId)) t.releasePointerCapture(e.pointerId); } catch (err) { /* 그대로 */ }
    // 새로 닿은 첫 손가락인데 키가 눌린 채 남아 있으면, 떼는 신호를 놓친 낡은 누름이다 → 풀고 받는다(키가 먹통이 되지 않게)
    if (e.isPrimary && keyHold.push !== null && keyHold.push !== e.pointerId) releaseKey('push');
    holdKey('push', e.pointerId);
  });
  const insideRect = (node, x, y) => {
    const b = node.getBoundingClientRect();
    return x >= b.left && x <= b.right && y >= b.top && y <= b.bottom;
  };
  window.addEventListener('pointermove', (e) => {
    if (keyHold.push === e.pointerId && !insideRect(el.keyPush, e.clientX, e.clientY)) releaseKey('push', e.pointerId);
  });
  ['pointerup', 'pointercancel'].forEach((type) => window.addEventListener(type, (e) => {
    releaseKey('push', e.pointerId);
  }));
  // 마우스가 창 밖으로 나감(옮겨 간 곳이 없음)
  window.addEventListener('pointerout', (e) => {
    if (e.relatedTarget) return;
    releaseKey('push', e.pointerId);
  });
  // 창이 가려지거나 다른 창으로 넘어가면 뗀 것(지구력 게임이라 그 판은 거기서 끝). 돌아오면 화면만 다시 그린다
  window.addEventListener('blur', releaseAllKeys);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) releaseAllKeys();
    else { refresh(); startLoop(); }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter') releaseKey('push', `kb:${e.code}`);
  });

  window.addEventListener('keydown', (e) => {
    const plain = !e.metaKey && !e.ctrlKey && !e.altKey;
    // S = 소리 다음 · C = 몸통 색 다음 (그 밖의 글자 키는 아무 일 없음)
    if (e.code === 'KeyS' && plain) {
      e.preventDefault();
      if (!e.repeat) nextSound();
      return;
    }
    if (e.code === 'KeyC' && plain) {
      e.preventDefault();
      if (!e.repeat) nextSkin();
      return;
    }
    if (e.code !== 'Space' && e.code !== 'Enter' && e.code !== 'NumpadEnter') return;
    if (!plain) return; // Cmd · Ctrl · Alt와 같이 누른 것은 키캡 누름이 아니다(떼는 신호가 안 와서 키가 눌린 채 남는 것도 막음)
    e.preventDefault();
    if (e.repeat) return; // 꾹 누르고 있어 저절로 반복되는 입력은 무시
    // 같은 키가 눌린 채 남아 있는데 새로 눌렸다면 떼는 신호를 놓친 것이다 → 풀고 받는다(키보드가 먹통이 되지 않게)
    if (keyHold.push === `kb:${e.code}`) releaseKey('push');
    holdKey('push', `kb:${e.code}`); // 키캡을 누른 것과 같음(떼면 keyup에서 올라옴)
  });
  // 화면이 확대되거나 끌리거나, 길게 눌러 메뉴가 뜨지 않게 막는다(길게 누르는 게임이라 특히 중요)
  const block = (e) => e.preventDefault();
  ['touchstart', 'touchmove', 'touchend'].forEach((name) => document.addEventListener(name, block, { passive: false }));
  ['gesturestart', 'dblclick', 'contextmenu', 'selectstart', 'dragstart'].forEach((name) => document.addEventListener(name, block));

  fit();

  /* ---------- 검사용 손잡이: 게임에는 영향이 없다 ---------- */
  const rectOf = (node) => {
    const b = node.getBoundingClientRect();
    return { x: b.left, y: b.top, w: b.width, h: b.height };
  };
  const holdToFlight = (sec) => Math.max(0, Number(sec) - RUNUP_MS / 1000);
  window.__STREAK_TEST__ = {
    state() {
      refresh();
      const t = now(), v = view(t);
      return {
        phase, holding: holding(),
        holdMs: holding() ? Math.max(0, t - pressT) : 0,   // 누르고 있은 시간
        flightSec: v.f,                                     // 난 시간(초)
        dist: v.dist || 0, distText: drawn.distText,        // 지금(또는 이번 판) 거리(미터) · 화면 글자
        record,                                             // 이번 판 기록(미터). 판이 끝나기 전엔 null
        best, bestText: drawn.bestText,
        lap: v.lap, lapText: drawn.lapText,                 // 지구 몇 바퀴
        scene: sceneName(v.scene), sceneIndex: v.scene % NS, // 지금 배경 이름
        pose: poseNameNow(v), poseIndex: v.pose,            // 지금 몸짓 이름
        poseBlend: phase === 'fly' ? v.blend : 1,           // 자세 사이 동작 진행(0.25 → 0.5 → 0.75 → 1 = 새 자세가 다 됨)
        poseFrom: POSES[v.posePrev][1],                     // 바로 앞 자세 이름(사이 동작이 여기서 출발한다)
        poses: FLY_POSES.slice(),                           // 날고 있는 동안의 자세 이름들(팔 허우적부터)
        hud: { bestH: HUD_BEST_H, distH: HUD_DIST_H, overH: HUD_OVER_H, backing: false }, // 왼쪽 위 글자 높이(칸) · 글자 뒤 검은 상자 없음
        hint: !!drawn.hint,                               // 「꾹 누르고 있기!」가 보이는지(준비 화면에만)
        cells: { hint: drawn.hint, best: drawn.hud.best, dist: drawn.hud.dist, lap: drawn.hud.lap, man: drawn.man, hip: drawn.hip, pit: drawn.pit }, // 화면 속 자리(칸: 가로 128 · 세로 96)
        ignoreLeft: phase === 'landed' ? Math.max(0, IGNORE_MS - (t - landedAt)) : 0, // 누름을 무시하는 남은 시간
        layout: 'F', rows: H,
        sound: KeySound.index,                              // 소리(0 끔 · 1~6)
        skin, skinName: SKINS[skin].name, skins: SKINS.map((s) => s.name),
        keyDown: keyHold.push !== null,
        keyRects: { push: rectOf(el.keyPush) },
        rects: {
          device: rectOf(el.deviceE), screen: rectOf(el.screen), key: rectOf(el.keyPush), grip: rectOf(el.grip),
          gameBtn: rectOf(document.getElementById('gameBtn')), soundBtn: rectOf(el.soundBtn), skinBtn: rectOf(el.skinBtn),
        },
        game: gameHere(),
      };
    },
    keyPress() { return holdKey('push', 'test'); }, // 키캡을 누르고 있기 시작(이미 눌려 있으면 false)
    keyRelease() { return releaseKey('push'); },    // 키캡에서 손 떼기
    press() { holdKey('push', 'test'); releaseKey('push'); return this.state(); }, // 눌렀다 바로 뗌
    // 처음 상태로: 준비 화면 · 최고 기록 지움
    reset() {
      keyHold.push = null;
      phase = 'ready'; record = null; endRunMs = 0; endF = 0; landedAt = -Infinity; best = 0;
      Object.values(KEYS).forEach(clearKey);
      drawKeys(); syncText(); render();
      return this.state();
    },
    setBest(m) { best = Math.max(0, Number(m) || 0); if (best > 0) saveBest(best); else clearKey(KEYS.best); render(); return this.state(); },
    // 손으로 돌리는 시계: 처음 부르면 실제 시계 값에서 이어 받아 멈춰 두고, 부를 때마다 ms만큼 돌린다
    tick(ms) {
      if (manual === null) manual = performance.now();
      manual += Math.max(0, Number(ms) || 0);
      refresh();
      return this.state();
    },
    // 실제 시계로 되돌리기: 흐르던 판이 끊기지 않게 기억해 둔 시각들을 실제 시계 쪽으로 옮겨 둔다
    realClock() {
      if (manual !== null) {
        const shift = performance.now() - manual;
        pressT += shift; releaseT += shift; landedAt += shift;
        manual = null;
      }
      refresh(); startLoop();
      return this.state();
    },
    distAt(holdSec) { return distAtFlight(holdToFlight(holdSec)); },        // 누른 지 그 초일 때 거리(미터)
    timeAt(meters) { return RUNUP_MS / 1000 + flightAtDist(Number(meters)); }, // 그 거리에 닿는 때(누른 지 몇 초)
    sceneAt(meters) { return sceneName(sceneIndexAt(Number(meters))); },     // 그 거리의 배경 이름
    poseAt(flightSec) { return POSES[poseIndexAt(Number(flightSec))][1]; },  // 난 지 그 초일 때 몸짓 이름
    // 난 지 그 초일 때 관절 각도(몸통 · 팔 · 다리). 「팔 허우적 동안 하체가 굳어 있는지」 볼 때 쓴다
    // (자세가 바뀐 직후 0.45초 안이면 사이 동작 중인 각도와 진행 정도 blend가 나온다)
    limbsAt(flightSec, atMs) {
      const f = Number(flightSec), pa = poseAt(f), name = POSES[pa.i][1];
      const p = flyPose(f, atMs === undefined ? now() : Number(atMs));
      return { name, from: POSES[pa.prev][1], blend: pa.blend, torso: p.torso, arms: p.arms, legs: p.legs };
    },
    tables() { return { lap: LAP_M, runupMs: RUNUP_MS, fallMs: FALL_MS, ignoreMs: IGNORE_MS, curve: CURVE, scenes: SCENES, poses: POSES, poseEnd: POSE_END, poseLoop: POSE_LOOP, blendS: BLEND_S, blendSteps: BLEND_STEPS }; },
    setSound(i) { KeySound.set(i); drawSoundBtn(); return KeySound.index; }, // 소리 고르기(0 끔 · 1~6). 소리는 내지 않는다
    setSkin(n) { return setSkin(n); },
    nextSkin() { nextSkin(); return skin; },
    gameUrl(id) { return gameUrl(id); },               // 그 번호 게임으로 갈 주소(가지는 않음)
    gameIndexAt(x) { return gameIndexAt(Number(x)); }, // 게임 버튼 안 가로 위치(화면 점) → 칸 번호(0부터)
  };
})();
</script>
</body>
</html>
