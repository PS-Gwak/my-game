const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
let opening = false; // 열기를 연달아 두 번 보내면 게임이 두 번 깔려 멈추므로, 여는 중에는 다음 요청을 받지 않는다
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (opening) return;
  opening = true;
  const msg = document.getElementById("msg");
  msg.textContent = "여는 중…";
  try {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("pw").value), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: fromB64(DATA.salt), iterations: DATA.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(DATA.iv) }, key, fromB64(DATA.ct));
    const html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close(); // 금고가 열리면 진짜 페이지로 갈아 끼운다
  } catch (err) {
    msg.textContent = "비밀번호가 맞지 않아요. 다시 넣어 주세요.";
    opening = false; // 틀렸을 때만 다시 시도할 수 있게 푼다(열렸다면 페이지가 이미 바뀌었다)
  }
});
</script>
