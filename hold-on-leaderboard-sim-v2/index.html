<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>결투 · 순위표 시뮬레이션 2판</title>
<style>
  /* 화면에는 손바닥만 한 기기 하나만 보인다: 몸통 안에 검은 화면(4:3), 그 아래 키캡 두 개, 맨 아래 오돌토돌한 띠.
     검은 화면 안은 검정과 흰색 두 가지만 쓴다. 글씨와 테두리는 전부 캔버스(그림 종이)에 칸으로 찍는다 */
  :root { --black: #000000; --white: #f2f2f2; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--black); color: var(--white);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    display: flex; align-items: center; justify-content: center;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  /* 받침대는 창 전체: 기기를 가로 · 세로 가운데에 올려 둔다(창 바깥 배경은 검정) */
  main {
    width: 100vw; height: 100vh; height: 100dvh; padding: 0;
    display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr);
  }
  .stage { min-height: 0; min-width: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  /* 기기 몸통: 크기와 자리는 스크립트가 창 크기에 맞춰 정한다. 겉모양(둥근 위 · 깎인 아래 · 몸통 색)은 안쪽 그림(#bodyArt)이 그린다 */
  .device-e { position: relative; flex: none; line-height: 0; }
  .screen { position: absolute; display: block; image-rendering: pixelated; background: var(--black); border-radius: 2px; }
  .body-art { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  .grip { position: absolute; display: block; image-rendering: pixelated; pointer-events: none; }
  /* 몸통 위쪽 띠의 작은 버튼들(게임 고르기 · 소리 · 몸통 색) */
  .corner-btn {
    position: absolute; top: 3px; padding: 0; margin: 0; border: 0; background: transparent;
    line-height: 0; cursor: pointer; touch-action: none; outline: none;
  }
  .corner-btn canvas { display: block; image-rendering: pixelated; }
  .key {
    position: absolute; padding: 0; margin: 0; border: 0; background: transparent;
    line-height: 0; cursor: pointer; touch-action: none; outline: none;
  }
  .key canvas { display: block; image-rendering: pixelated; }
  /* 화면에는 안 보이는 글자: 읽어 주는 기능 · 검사기가 버튼 글을 읽을 수 있게 남겨 둔다 */
  .ghost { position: absolute; left: 0; top: 0; width: 100%; height: 100%; color: transparent; overflow: hidden; white-space: nowrap; pointer-events: none; line-height: 1; }

  /* ---- 순위표 ----
     비유: 오락실 점수판. 위 띠의 왕관 버튼을 누르면 몸통 위로 검은 창이 아래에서 올라온다(검은 화면 · 키캡 자리를 덮는다).
     순위표 창은 그림 종이(점 글씨), 이름 창은 진짜 글자와 진짜 입력칸(폰 글자판이 뜬다). 글꼴은 점 글꼴 「갈무리」 */
  @font-face {
    font-family: 'Galmuri11';
    src: url('https://cdn.jsdelivr.net/npm/galmuri/dist/Galmuri11.woff2') format('woff2');
    font-display: swap;
  }
  /* 닫힌 창은 보이지도 잡히지도 않는다(Tab으로도 못 들어간다). 내려가는 0.2초 동안만 보이게 둔다 */
  .lb-wrap { position: absolute; overflow: hidden; pointer-events: none; border-radius: 2px; visibility: hidden; transition: visibility 0s linear 0.2s; }
  .lb-wrap.open { pointer-events: auto; visibility: visible; transition-delay: 0s; }
  .lb-sheet { display: block; image-rendering: pixelated; background: var(--black); transform: translateY(102%); transition: transform 0.2s steps(8); touch-action: none; }
  .lb-wrap.open .lb-sheet { transform: none; }
  /* --u = 검은 화면 한 칸의 크기. 창 안 치수는 모두 이 칸 수로 적는다 */
  .lb-panel {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden;
    background: var(--black); color: var(--white); border: calc(var(--u) * 1) solid var(--white); padding: calc(var(--u) * 3);
    display: flex; flex-direction: column; gap: calc(var(--u) * 4);
    font-family: 'Galmuri11', "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: calc(var(--u) * 12); line-height: calc(var(--u) * 14); word-break: keep-all;
    -webkit-font-smoothing: none; font-smooth: never; touch-action: manipulation;
    transform: translateY(102%); transition: transform 0.2s steps(8);
  }
  .lb-wrap.open .lb-panel { transform: none; }
  .lb-panel p { margin: 0; }
  .lb-head { display: flex; justify-content: space-between; align-items: center; border-bottom: calc(var(--u) * 1) solid var(--white); padding-bottom: calc(var(--u) * 2); }
  .lb-panel button {
    font: inherit; margin: 0; border-radius: 0; cursor: pointer; width: 100%; min-height: calc(var(--u) * 18); padding: calc(var(--u) * 1) calc(var(--u) * 2);
    background: var(--black); color: var(--white); border: calc(var(--u) * 1) solid var(--white); touch-action: manipulation;
  }
  .lb-panel button.solid { background: var(--white); color: var(--black); }
  .lb-panel button.x { width: calc(var(--u) * 16); min-height: calc(var(--u) * 14); padding: 0; border: 0; flex: none; }
  .lb-panel button:disabled { opacity: 0.5; }
  .lb-row { display: flex; gap: calc(var(--u) * 4); }
  .lb-msg { min-height: calc(var(--u) * 14); }
  .lb-panel input {
    width: 100%; height: calc(var(--u) * 20); margin: 0; padding: 0 calc(var(--u) * 3);
    border: calc(var(--u) * 1) solid var(--white); border-radius: 0; outline: none; background: var(--black); color: var(--white);
    caret-color: var(--white); font: inherit; text-align: center; -webkit-appearance: none; appearance: none;
    user-select: text; -webkit-user-select: text; touch-action: manipulation;
  }
  .lb-panel input::placeholder { color: #8a8a8a; }

  /* ---- 기기 밖: 내 이름 버튼 · 프로필 화면 ----
     비유: 오락기 옆에 붙여 둔 이름표. 누르면 오락기를 덮는 넓은 종이(프로필)가 펼쳐진다 — 키캡 틀에 묶이지 않은 화면.
     --m = 이름표의 점 하나 크기(스크립트가 여백을 보고 2 또는 1로 정한다) */
  .me-btn {
    --m: 1px;
    position: fixed; left: 4px; top: 4px; z-index: 5; margin: 0; padding: 0 calc(var(--m) * 6) 0 calc(var(--m) * 5);
    height: calc(var(--m) * 24); display: flex; align-items: center; gap: calc(var(--m) * 4);
    background: var(--black); color: var(--white); border: calc(var(--m) * 1) solid var(--white); border-radius: 0;
    font-family: 'Galmuri11', "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: calc(var(--m) * 12); line-height: 1; white-space: nowrap; -webkit-font-smoothing: none; font-smooth: never;
    cursor: pointer; touch-action: none; outline: none;
  }
  .me-btn::before { content: ''; position: absolute; left: -6px; right: -6px; top: -8px; bottom: -8px; } /* 누를 자리를 넉넉히 */
  .me-btn svg { display: block; width: calc(var(--m) * 7); height: calc(var(--m) * 8); flex: none; }
  .lb-page {
    position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 10; display: none;
    background: var(--black); color: var(--white); overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain;
    touch-action: pan-y; -webkit-overflow-scrolling: touch;
    font-family: 'Galmuri11', "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: 24px; line-height: 28px; word-break: keep-all; -webkit-font-smoothing: none; font-smooth: never;
  }
  .lb-page.open { display: block; }
  .pg-in { max-width: 420px; margin: 0 auto; padding: 14px 16px 48px; display: flex; flex-direction: column; gap: 12px; }
  .pg-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--white); padding-bottom: 8px; }
  .lb-page p { margin: 0; }
  .lb-page button {
    font: inherit; margin: 0; border-radius: 0; cursor: pointer; width: 100%; min-height: 48px; padding: 6px 8px;
    background: var(--black); color: var(--white); border: 2px solid var(--white); touch-action: manipulation;
  }
  .lb-page button.solid { background: var(--white); color: var(--black); }
  .lb-page button.x { width: 48px; min-height: 44px; padding: 0; border: 0; flex: none; }
  .lb-page button:disabled { opacity: 0.5; }
  .pg-name { background: var(--white); color: var(--black); text-align: center; padding: 10px 0; white-space: nowrap; overflow: hidden; }
  .pg-row { display: flex; gap: 8px; }
  .pg-msg { min-height: 28px; }
  .pg-code { font-size: 48px; line-height: 56px; text-align: center; letter-spacing: 2px; white-space: nowrap; }
  .lb-page input {
    width: 100%; height: 48px; margin: 0; padding: 0 8px; border: 2px solid var(--white); border-radius: 0; outline: none;
    background: var(--black); color: var(--white); caret-color: var(--white); font: inherit; text-align: center;
    -webkit-appearance: none; appearance: none; user-select: text; -webkit-user-select: text; touch-action: manipulation;
  }
  .lb-page input::placeholder { color: #8a8a8a; }
  .pg-sec { border-top: 2px solid var(--white); padding-top: 12px; display: flex; flex-direction: column; gap: 12px; }
  /* 게임 한 줄 = [번호] [게임] ……… [내 기록] [순위]. 결투 두 줄만 눌린다(그 순위표로 간다).
     칸 폭은 표 전체에서 가장 긴 글에 맞추고(줄마다 세로로 맞음), 남는 폭은 게임 이름 칸이 가진다 */
  .pg-games { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; column-gap: 8px; }
  .lb-page .pg-game {
    grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; align-items: center;
    width: 100%; min-height: 44px; padding: 6px 2px; border: 0; border-bottom: 2px solid #3a3a3a;
    background: var(--black); color: var(--white); text-align: left; white-space: nowrap;
  }
  .lb-page .pg-game span:nth-child(2) { overflow: hidden; }
  .lb-page .pg-game span:nth-child(3), .lb-page .pg-game span:nth-child(4) { text-align: right; }
  .lb-page .pg-game span:nth-child(4) { padding-left: 10px; }
  .lb-page .pg-game.off { color: #8a8a8a; }
  @supports not (grid-template-columns: subgrid) {
    .pg-games { display: block; }
    .lb-page .pg-game { grid-template-columns: 22px minmax(0, 1fr) 72px 96px; column-gap: 6px; }
  }
  @media (max-width: 340px) {
    .pg-in { padding-left: 8px; padding-right: 8px; }
    .pg-games { column-gap: 5px; }
    .lb-page .pg-game span:nth-child(4) { padding-left: 6px; }
  }
</style>
</head>
<body>
<main id="main">
  <div class="stage" id="stage">
    <div class="device-e" id="deviceE">
      <svg class="body-art" id="bodyArt" aria-hidden="true"><path id="bodyFill"></path><path id="bodyLine" fill="none"></path></svg>
      <button class="corner-btn game-btn" id="gameBtn" type="button" tabindex="-1"><canvas id="gameCanvas"></canvas><span class="ghost" id="gameLabel">게임 3 결투</span></button>
      <button class="corner-btn" id="crownBtn" type="button" tabindex="-1"><canvas id="crownCanvas"></canvas><span class="ghost" id="crownLabel">순위표 열기</span></button>
      <button class="corner-btn" id="soundBtn" type="button" tabindex="-1"><canvas id="soundCanvas"></canvas><span class="ghost" id="soundLabel">소리 1</span></button>
      <button class="corner-btn skin-btn" id="skinBtn" type="button" tabindex="-1"><canvas id="skinCanvas"></canvas><span class="ghost" id="skinLabel">몸통 gray</span></button>
      <canvas class="screen" id="screen" aria-label="서부 결투"></canvas>
      <button class="key" id="keySlide" type="button" tabindex="-1"><canvas id="keySlideCanvas"></canvas><span class="ghost">다음 판</span></button>
      <button class="key" id="keyPush" type="button" tabindex="-1"><canvas id="keyPushCanvas"></canvas><span class="ghost">쏴</span></button>
      <canvas class="grip" id="grip"></canvas>
      <div class="lb-wrap" id="lbSheetWrap"><canvas class="lb-sheet" id="lbSheet" aria-label="순위표"></canvas></div>
      <div class="lb-wrap lb-pop" id="lbPanelWrap"><div class="lb-panel" id="lbPanel"></div></div>
    </div>
  </div>
  <button class="me-btn" id="meBtn" type="button" tabindex="-1"><svg viewBox="0 0 7 8" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M2 0h3v3h-3zM0 4h7v4h-7z"/></svg><span id="meBtnText">이름 정하기</span></button>
  <div class="lb-page" id="lbPage"></div>
</main>
<!-- 이름 걸러내기: 걸러내는 함수와 금지 단어 목록을 원본 그대로 옮겨 넣는 자리(검사기 qa-sim.js가 맨 처음에 채운다) -->
<!-- NICK-FILTER 여기부터 -->
<script>
/*
 * 닉네임 걸러내기 (참고용)
 *
 * 비유: 공항 보안 검색대.
 *   1) 가방(닉네임)에서 포장지(숫자 · 기호 · 공백)를 벗기고
 *   2) 변장(닮은 글자 · 풀어 쓴 자모 · 늘여 쓴 글자)을 원래 얼굴로 되돌린 다음
 *   3) 수배 명단(banned-words.json)과 대조한다.
 *   4) 다만 「보지마」처럼 멀쩡한 말은 통행증(allow 목록)을 보여 주면 통과시킨다.
 *
 * 다른 도구 없이 node와 브라우저 양쪽에서 돈다.
 *   node    : const f = require('./filter.js'); f.checkNickname('이름')
 *             (같은 폴더의 banned-words.json을 알아서 읽는다)
 *   브라우저 : <script src="filter.js"><\/script> 뒤에
 *             NicknameFilter.setWordList(목록객체); NicknameFilter.checkNickname('이름')
 *
 * 꼭 기억할 것: 폰(브라우저)에서만 검사하면 누구나 건너뛸 수 있다.
 *             서버에서도 똑같은 함수로 한 번 더 검사해야 한다.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.NicknameFilter = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ───────── 설정 (바꿀 수 있는 값) ─────────
  var MIN_LEN = 2;          // 최소 글자 수
  var MAX_LEN = 8;          // 최대 글자 수
  var ALLOW_JAMO = false;   // ㅋㅋ · ㅎㅎ 같은 낱자모를 이름에 허용할지 (기본: 안 됨 → ㅅㅂ류가 통째로 막힘)

  // 「통째로 같을 때만」 막는 갈래 이름. (ass · gm처럼 짧아서 다른 낱말 속에 흔히 들어 있는 말)
  var EXACT_CATEGORY = '짧은 말(통째로 같을 때만)';

  // ───────── 한글 조립 도구 ─────────
  // 한글 한 글자는 레고 블록 세 개(첫소리 · 가운뎃소리 · 받침)로 되어 있다.
  var CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
  var JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
  var JONG = ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ', 'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];

  function isSyllable(ch) { return ch >= '가' && ch <= '힣'; }
  function split(ch) { // 완성된 글자 → [첫소리, 가운뎃소리, 받침] 번호
    var c = ch.charCodeAt(0) - 0xac00;
    return [Math.floor(c / 588), Math.floor((c % 588) / 28), c % 28];
  }
  function join(cho, jung, jong) { return String.fromCharCode(0xac00 + cho * 588 + jung * 28 + jong); }

  // 풀어 쓴 자모를 다시 글자로 조립한다.  ㅅㅣㅂㅏㄹ → 시발,  ㅂㅗㅈㅣ → 보지
  // (자음만 이어진 ㅅㅂ · ㅂㅅ은 조립할 수 없으니 그대로 둔다 → 목록의 초성 낱말과 대조)
  function composeJamo(s) {
    var out = '';
    var i = 0;
    while (i < s.length) {
      var c = CHO.indexOf(s[i]);
      var v = i + 1 < s.length ? JUNG.indexOf(s[i + 1]) : -1;
      if (c >= 0 && v >= 0) {
        var jong = 0;
        var next = s[i + 2];
        var nextNext = s[i + 3];
        // 받침 후보: 다음이 자음이고, 그 뒤가 모음이 아니어야 한다(모음이면 다음 글자의 첫소리)
        if (next && JONG.indexOf(next) > 0 && !(nextNext && JUNG.indexOf(nextNext) >= 0)) {
          jong = JONG.indexOf(next);
          i += 3;
        } else {
          i += 2;
        }
        out += join(c, v, jong);
      } else {
        out += s[i];
        i += 1;
      }
    }
    return out;
  }

  // ───────── 다듬기 단계들 ─────────

  // 1단계: 전각 문자 · 꾸밈 문자를 보통 글자로 (ｓｅｘ → sex), 보이지 않는 글자 제거
  function unify(name) {
    var s = String(name == null ? '' : name);
    // (한글 낱자모 ㅅ · ㅂ 등은 건드리지 않는다 — 통째로 정리하면 낱자모가 다른 글자로 바뀌어 사라진다)
    if (s.normalize) s = s.replace(/[^\u3131-\u318e]+/g, function (m) { return m.normalize('NFKC'); });
    return s.replace(/[​-‏⁠﻿­ㅤᅟᅠ]/g, '');
  }

  // 2단계: 닮은 글자 되돌리기 (한글 자모 바로 옆에 붙은 것만 — 영어 이름을 망가뜨리지 않으려고)
  //   ㅅl발 · ㅅ1발 → ㅅㅣ발,  ㄱH새끼 → ㄱㅐ새끼,  7H새끼 → 개새끼,  77ㅓ져 → ㄲㅓ져
  function restoreLookalikes(s) {
    return s
      .replace(/7[hH](?=[가-힣ㄱ-ㅎ])/g, '개')
      .replace(/77(?=[ㅏ-ㅣ])/g, 'ㄲ')
      .replace(/([ㄱ-ㅎ])[lI|!1]/g, '$1ㅣ')
      .replace(/([ㄱ-ㅎ])[hH]/g, '$1ㅐ')
      .replace(/[\^人](?=[ㅏ-ㅣ가-힣ㄱ-ㅎ])/g, 'ㅅ')
      .replace(/[┻┴⊥凸]/g, 'ㅗ');
  }

  // 3단계: 허용 글자만 남기기 (기호 · 공백 · 이모지 등은 전부 버림). keepDigits=false면 숫자도 버림
  function strip(s, keepDigits) {
    s = s.toLowerCase();
    return keepDigits ? s.replace(/[^가-힣ㄱ-ㅎㅏ-ㅣa-z0-9]/g, '') : s.replace(/[^가-힣ㄱ-ㅎㅏ-ㅣa-z]/g, '');
  }

  // 4단계: 반복 줄이기.  씨씨씨발 → 씨발,  ㅋㅋㅋ → ㅋ   (한글만. 영문은 따로 다룬다)
  function collapseHangul(s) { return s.replace(/([가-힣ㄱ-ㅎㅏ-ㅣ])\1+/g, '$1'); }

  // 5단계: 늘여 쓰기 줄이기.  씨이발 → 씨발,  시바알 → 시발,  조옷 → 좃
  //   (앞 글자와 같은 모음으로 시작하는 「이 · 아 · 오 …」를 앞 글자에 합친다)
  function squeeze(s) {
    var out = [];
    for (var i = 0; i < s.length; i++) {
      var ch = s[i];
      var prev = out.length ? out[out.length - 1] : '';
      if (isSyllable(ch) && isSyllable(prev)) {
        var a = split(prev);
        var b = split(ch);
        if (b[0] === 11 /* ㅇ */ && a[2] === 0 && a[1] === b[1]) {
          out[out.length - 1] = join(a[0], a[1], b[2]);
          continue;
        }
      }
      out.push(ch);
    }
    return collapseHangul(out.join(''));
  }

  // 영문 숫자 변장 되돌리기 (sh1t → shit, a55 → ass)
  var LEET = { '0': 'o', '1': 'i', '3': 'e', '4': 'a', '5': 's', '7': 't', '8': 'b', '9': 'g' };
  function unleet(s) { return s.replace(/[01345789]/g, function (d) { return LEET[d] || ''; }); }

  // 영문 반복 줄이기: fuuuck → fuck (전부 한 글자로), niggger → nigger (셋 이상만 둘로)
  function collapseLatinAll(s) { return s.replace(/([a-z])\1+/g, '$1'); }
  function collapseLatin3(s) { return s.replace(/([a-z])\1{2,}/g, '$1$1'); }

  /*
   * normalize(name): 닉네임의 「맨얼굴」 한 장을 돌려준다.
   *   숫자 · 기호 · 공백을 빼고 → 닮은 글자를 되돌리고 → 자모를 조립하고 → 반복을 줄인 꼴.
   *   예) '자1지' → '자지',  '자123지' → '자지',  '보.지' → '보지',  'ㅅㅣ발' → '시발'
   * 목록(banned-words.json)의 낱말도 같은 꼴로 들어 있다.
   */
  function normalize(name) {
    return collapseHangul(composeJamo(strip(unify(name), false)));
  }

  /*
   * views(name): 같은 닉네임을 여러 각도에서 찍은 사진 묶음.
   *   한 가지 다듬기만 쓰면 빠져나가는 수법이 있어서, 여러 장을 찍어 전부 명단과 대조한다.
   */
  function views(name) {
    var u = unify(name);
    var look = restoreLookalikes(u);
    var main = normalize(u);                                              // 숫자 먼저 빼기 (ㅂ1ㅅ → ㅂㅅ)
    var mainLook = collapseHangul(composeJamo(strip(look, false)));       // 닮은 글자 먼저 (ㅅ1발 → 시발)
    var kept = collapseHangul(composeJamo(strip(look, true)));            // 숫자를 남긴 꼴 (시8, 18놈)
    var keptPlain = collapseHangul(composeJamo(strip(u, true)));
    var leet = unleet(strip(u, true));                                     // 숫자를 영문으로 읽은 꼴
    var rawMain = composeJamo(strip(u, false));                           // 반복을 줄이지 않은 꼴 (「딸딸이」처럼 원래 겹글자인 낱말용)
    var hangulOnly = /[가-힣ㄱ-ㅎ]/.test(main) ? collapseHangul(main.replace(/[a-z]/g, '')) : main; // 한글 사이에 끼운 영문 빼기 (보a지 → 보지)
    var plain = uniq([main, mainLook, rawMain, hangulOnly, squeeze(main), squeeze(mainLook), squeeze(hangulOnly)]);
    var latin = uniq(plain.concat([leet]).reduce(function (acc, v) {
      acc.push(v, collapseLatin3(v), collapseLatinAll(v));
      return acc;
    }, []));
    return {
      plain: plain,                                  // 숫자 없는 낱말과 대조할 꼴들
      numeric: uniq([kept, keptPlain]),              // 숫자가 든 낱말(시8 · 18놈)과 대조할 꼴들
      latinExact: uniq(plain.concat([leet]).map(collapseLatin3)), // 「통째로만」 대조용 (boot를 bot으로 줄여 버리지 않도록 반복은 셋 이상만 줄임)
      latin: latin,                                  // 영문 낱말과 대조할 꼴들
      reversed: main.split('').reverse().join('')    // 뒤집어 쓴 꼴 (끼새개 → 개새끼)
    };
  }

  function uniq(arr) {
    var seen = {};
    return arr.filter(function (x) { if (seen[x]) return false; seen[x] = true; return true; });
  }

  // ───────── 목록 준비 ─────────
  var compiled = null;

  function compile(list) {
    var c = { plain: [], numeric: [], latin: [], exact: {}, allow: [] };
    var cats = (list && list.categories) || {};
    Object.keys(cats).forEach(function (cat) {
      cats[cat].forEach(function (w) {
        w = String(w).toLowerCase();
        if (!w) return;
        if (cat === EXACT_CATEGORY) { c.exact[w] = cat; return; }
        var item = { w: w, cat: cat };
        if (/[0-9]/.test(w)) c.numeric.push(item);
        else if (/^[a-z]+$/.test(w)) c.latin.push(item);
        else c.plain.push(item);
      });
    });
    c.allow = ((list && list.allow) || []).map(function (w) { return String(w).toLowerCase(); });
    // 영문 허용 낱말은 반복을 줄인 꼴도 함께 둔다 (essex를 esex로 줄여 본 사진에서도 통행증이 통하도록)
    c.allow.slice().forEach(function (a) {
      if (/^[a-z]+$/.test(a)) { var s1 = collapseLatinAll(a); if (s1 !== a && s1.length >= 3) c.allow.push(s1); }
    });
    return c;
  }

  function setWordList(list) { compiled = compile(list); }

  function getCompiled(list) {
    if (list) return compile(list);
    if (compiled) return compiled;
    if (typeof require === 'function') {
      try { compiled = compile(require('./banned-words.json')); return compiled; } catch (e) { /* 아래로 */ }
    }
    throw new Error('금지 단어 목록이 없습니다. setWordList(목록)을 먼저 부르거나 checkNickname(이름, 목록)으로 넘겨 주세요.');
  }

  // 통행증 확인: 걸린 자리(start~end)가 허용 낱말 안에 통째로 들어 있으면 봐준다.
  //   「해보지마」: 「보지」가 걸리지만 허용 낱말 「보지마」 안에 들어 있으므로 통과.
  //   「왕보지」: 감싸 주는 허용 낱말이 없으므로 차단.
  function forgiven(text, start, end, allow) {
    for (var i = 0; i < allow.length; i++) {
      var a = allow[i];
      var from = Math.max(0, end - a.length);
      var pos = text.indexOf(a, from);
      while (pos !== -1 && pos <= start) {
        if (pos + a.length >= end) return true;
        pos = text.indexOf(a, pos + 1);
      }
    }
    return false;
  }

  // text 안에서 명단 낱말 찾기. 찾으면 { hit, cat }.
  function findIn(text, items, allow, minLen) {
    if (!text) return null;
    for (var i = 0; i < items.length; i++) {
      var w = items[i].w;
      if (minLen && w.length < minLen) continue;
      var pos = text.indexOf(w);
      while (pos !== -1) {
        if (!forgiven(text, pos, pos + w.length, allow)) return { hit: w, cat: items[i].cat };
        pos = text.indexOf(w, pos + 1);
      }
    }
    return null;
  }

  function findBanned(name, c) {
    var v = views(name);
    var i, r;
    for (i = 0; i < v.plain.length; i++) {
      r = findIn(v.plain[i], c.plain, c.allow);
      if (r) return r;
    }
    for (i = 0; i < v.numeric.length; i++) {
      r = findIn(v.numeric[i], c.numeric, c.allow);
      if (r) return r;
    }
    for (i = 0; i < v.latin.length; i++) {
      r = findIn(v.latin[i], c.latin, c.allow);
      if (r) return r;
      // 통째로 같을 때만 막는 짧은 말: 이름 전체 또는 영문 덩어리 하나가 그 말과 똑같을 때
      //   (이름 전체 비교는 숫자를 남긴 꼴로 한다 — 「2018년」에서 숫자를 빼면 「년」만 남아 잘못 걸리기 때문)
    }
    for (i = 0; i < v.latinExact.length; i++) {
      var chunks = v.numeric.concat(v.latinExact[i].match(/[a-z]+/g) || []);
      for (var k = 0; k < chunks.length; k++) {
        if (Object.prototype.hasOwnProperty.call(c.exact, chunks[k])) return { hit: chunks[k], cat: c.exact[chunks[k]] };
      }
    }
    // 뒤집어 쓴 이름: 세 글자 이상인 한글 낱말만 본다 (두 글자까지 보면 「신병」 같은 멀쩡한 말이 걸린다)
    r = findIn(v.reversed, c.plain, [], 3);
    if (r) return { hit: r.hit, cat: r.cat + ' (뒤집어 씀)' };
    return null;
  }

  /*
   * checkNickname(name, list?) → { ok, reason, hit }
   *   ok     : 써도 되면 true
   *   reason : 'banned'(금지 단어) · 'length'(길이) · 'chars'(허용 안 되는 글자) · null
   *   hit    : 걸린 낱말과 갈래 (운영 기록용 — 이용자에게는 보여 주지 않는 편이 좋다. 보여 주면 피하는 법을 가르치는 셈)
   */
  function checkNickname(name, list) {
    var c = getCompiled(list);
    var raw = unify(name).trim();
    var banned = findBanned(raw, c);
    if (banned) return { ok: false, reason: 'banned', hit: banned.hit, category: banned.cat };
    var len = Array.from ? Array.from(raw).length : raw.length;
    if (len < MIN_LEN || len > MAX_LEN) return { ok: false, reason: 'length', hit: null };
    var okChars = ALLOW_JAMO ? /^[가-힣ㄱ-ㅎㅏ-ㅣa-zA-Z0-9]+$/ : /^[가-힣a-zA-Z0-9]+$/;
    if (!okChars.test(raw)) return { ok: false, reason: 'chars', hit: null };
    return { ok: true, reason: null, hit: null };
  }

  return {
    normalize: normalize,
    checkNickname: checkNickname,
    setWordList: setWordList,
    views: views,           // 시험 · 점검용
    squeeze: squeeze,       // 시험 · 점검용
    cleanWord: function (w) { return composeJamo(strip(unify(w), false)); }, // 목록 낱말 다듬기(반복은 그대로 둠)
    EXACT_CATEGORY: EXACT_CATEGORY
  };
});
