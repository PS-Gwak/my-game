  }
  // 왼쪽 키(RE · R) = 다음 판 / 새 판. 비유: 「한 판 더」 버튼 — 점수판(연승)은 건드리지 않는다.
  // 결과 화면이면 새 결투(이겼으면 연승을 이어서, 졌으면 0에서 — 총 키로 넘어갈 때와 같다),
  // 기다리는 중 · 신호 중이면 그 판을 무르고 새 결투(연승 그대로, 반칙 아님).
  // 결과 직후 0.4초 안의 누름은 총 키와 똑같이 무시한다
  function restart(t) {
    // 그리기가 한 박자 밀린 사이(상대가 쏠 시각이 이미 지남)에 RE가 들어와 진 판이 새 판으로 둔갑하지 않게, 밀린 일부터 확정한다
    if (manual === null) advanceTo(t);
    if (phase === 'result' && t - resultT < IGNORE_AFTER) return;
    // 신호가 뜬 뒤에는 RE로 무를 수 없다(질 것 같을 때 RE로 연승을 지키는 꼼수 막기). 기다리는 중의 RE는 그대로 새 결투
    if (phase === 'signal') return;
    startDuel(t);
  }

  /* ---------- 실제 시간: 화면이 보이는 동안 매 장면마다 신호 · 상대 · 쓰러짐 · 왕관 깜빡임을 챙긴다 ---------- */
  let rafId = 0;
  const crownBlinks = () => { const b = bestLineNow(); return !!(b && b.record); };
  const needsLoop = () => manual === null && !document.hidden &&
    (phase === 'wait' || phase === 'signal' || (phase === 'result' && (now() - resultT < FALL_MS || crownBlinks())));
  function loop() {
    rafId = 0;
    if (manual !== null || document.hidden) return;
    advanceTo(now());
    if (phase !== 'ready') render(); // 노려보는 동안 = 굴러가는 풀 · 「나」 표시, 결과 = 쓰러지는 그림 · 깜빡이는 왕관
    if (!rafId && needsLoop()) rafId = requestAnimationFrame(loop); // 위에서 이미 다음 장면을 걸어 두었으면 또 걸지 않는다
  }
  function startLoop() {
    if (rafId || !needsLoop()) return;
    rafId = requestAnimationFrame(loop);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { releaseAllKeys(); cancelDuel(); return; }
    // 뒤쪽 탭으로 열려서 아직 첫 판을 못 했으면, 화면이 보이는 순간 첫 판을 시작한다
    if (firstDuel && phase === 'ready' && manual === null && !overlayOpen()) { startDuel(now()); autoDuel = true; return; }
    render(); startLoop();
  });

  /* ---------- 몸통 색 · 소리 바꾸기 ---------- */
  function setSkin(n) {
    n = Math.floor(Number(n));
    if (!(n >= 0 && n < SKINS.length)) return false;
    skin = n;
    saveRaw(SKIN_KEY, n);
    fit();
    return true;
  }
  const nextSkin = () => setSkin((skin + 1) % SKINS.length);
  // 소리 버튼: 다음 소리로(1 → … → 6 → 끔 → 1). 고른 소리를 한 번 들려준다
  function nextSound() { keepRealSound(() => KeySound.next()); drawSoundBtn(); return KeySound.index; }

  /* ---------- 화면 요소 ---------- */
  const el = {
    main: document.getElementById('main'),
    stage: document.getElementById('stage'),
    screen: document.getElementById('screen'),
    deviceE: document.getElementById('deviceE'),
    bodyArt: document.getElementById('bodyArt'), bodyFill: document.getElementById('bodyFill'), bodyLine: document.getElementById('bodyLine'),
    gameBtn: document.getElementById('gameBtn'), gameCanvas: document.getElementById('gameCanvas'), gameLabel: document.getElementById('gameLabel'),
    soundBtn: document.getElementById('soundBtn'), soundCanvas: document.getElementById('soundCanvas'), soundLabel: document.getElementById('soundLabel'),
    skinBtn: document.getElementById('skinBtn'), skinCanvas: document.getElementById('skinCanvas'), skinLabel: document.getElementById('skinLabel'),
    grip: document.getElementById('grip'),
    keySlide: document.getElementById('keySlide'), keySlideCanvas: document.getElementById('keySlideCanvas'),
    keyPush: document.getElementById('keyPush'), keyPushCanvas: document.getElementById('keyPushCanvas'),
  };
  const dpr = () => window.devicePixelRatio || 1;
  const setGhost = (node, text) => { if (node.textContent !== text) node.textContent = text; };

  // 작은 버튼의 한 칸 크기(화면 점 1.5개)
  const cornerCell = () => Math.max(1, Math.round(1.5 * dpr()));
  function sizeCorner(cv, cw, ch) {
    const r = dpr();
    if (cv.width !== cw || cv.height !== ch) { cv.width = cw; cv.height = ch; }
    cv.style.width = `${cw / r}px`; cv.style.height = `${ch / r}px`;
  }
  // 한 칸짜리 작은 버튼(소리 · 몸통 색) 바탕: 흰 바탕 + 검은 테두리(몸통 색과 상관없이).
  // paint(ctx, 상자 왼쪽 위 x, y, 한 칸 크기)가 가운데 7×9칸 상자 안을 채운다
  function drawOneBox(cv, paint) {
    const ctx = cv.getContext('2d'), cc = cornerCell();
    const cw = ONE_COLS * cc, ch = BTN_ROWS * cc;
    sizeCorner(cv, cw, ch);
    ctx.clearRect(0, 0, cw, ch);
    pixelBlock(ctx, cw, ch, cc, INK);
    pixelFrame(ctx, cw, ch, cc, BG);
    paint(ctx, 3 * cc, Math.floor((BTN_ROWS - BOX_H) / 2) * cc, cc);
  }
  // 소리 버튼: 지금 소리 번호(1~6), 끔이면 ×
  function drawSoundBtn() {
    const i = KeySound.index;
    drawOneBox(el.soundCanvas, (ctx, bx, by, cc) => drawText(ctx, [i ? String(i) : '×'], bx + cc, by + cc, cc, BG));
    setGhost(el.soundLabel, i ? `소리 ${i}` : '소리 끔');
  }
  // 몸통 색 버튼: 상자 하나를 지금 몸통 색으로 칠하고 검은 테두리 한 칸
  function drawSkinBtn() {
    drawOneBox(el.skinCanvas, (ctx, bx, by, cc) => {
      ctx.fillStyle = BG; ctx.fillRect(bx, by, BOX_W * cc, BOX_H * cc);
      ctx.fillStyle = SKINS[skin].body; ctx.fillRect(bx + cc, by + cc, (BOX_W - 2) * cc, (BOX_H - 2) * cc);
    });
    setGhost(el.skinLabel, `몸통 ${SKINS[skin].name}`);
  }

  /* ---------- 기기의 키캡 두 개: 왼쪽 = 다음 판 / 새 판(RE), 오른쪽 = 쏘기(권총 그림) ----------
     비유: 진짜 키보드 키. 누르는 순간 한 번 작동하고, 손을 떼기 전까지는 같은 키든 다른 키든 다시 세지 않는다.
     keyHold = 지금 그 키를 누르고 있는 것(손가락 번호 · 'kb:Space' 같은 키보드 · 'test'), 안 누르면 null
     push = 오른쪽 쏘기 키, slide = 왼쪽 RE 키(예전 이름 그대로 둠) */
  const keyHold = { push: null, slide: null };
  const keyEl = () => ({ push: el.keyPush, slide: el.keySlide });
  const anyKeyDown = () => keyHold.push !== null || keyHold.slide !== null;
  let keyCell = 1;        // 키캡 그림 한 칸이 기기 화면 점 몇 개인지
  let pushFlash = false;  // 검사용 press()로 잠깐 눌린 그림을 보여 주는 중
  let pushFlashTimer = 0;

  function holdKey(name, who, t) {
    if (overlayOpen()) return false; // 순위표 · 이름 창 · 프로필 화면이 떠 있는 동안 키캡 누름은 게임에 들어가지 않는다
    if (anyKeyDown()) return false; // 한 키가 눌려 있는 동안 다른 키는 무시(소리도 안 남)
    keyHold[name] = who;
    pushFlash = false;
    // 키가 눌린 순간 딸깍(검사용 손잡이로 누를 때는 조용히)
    if (who !== 'test') { KeySound.unlock(); KeySound.down(); }
    if (name === 'slide') restart(t); else fire(t);
    drawKeys();
    return true;
  }
  // who를 주면 그 손가락(또는 키보드 키)이 누른 경우에만 뗀다. quiet = 떼는 소리 없이(놓친 누름을 정리할 때 · 창이 가려질 때)
  function releaseKey(name, who, quiet) {
    if (keyHold[name] === null) return false;
    if (who !== undefined && keyHold[name] !== who) return false;
    const silent = quiet || keyHold[name] === 'test';
    keyHold[name] = null;
    if (!silent) KeySound.up();
    drawKeys();
    return true;
  }
  function releaseAllKeys() { releaseKey('push', undefined, true); releaseKey('slide', undefined, true); }
  function flashPushKey() {
    if (anyKeyDown()) return;
    pushFlash = true; drawKeys();
    clearTimeout(pushFlashTimer);
    pushFlashTimer = setTimeout(() => { pushFlash = false; drawKeys(); }, 90);
  }

  // 키 하나: 여섯 게임이 함께 쓰는 도트 키캡 그림(KeyArt.pixel)을 그대로 부른다.
  // 그림 종이(캔버스)는 20칸 × 정수 점 크기로 맞춰 두고, kind = 윗면 그림('gun' 권총 · 'RE')
  function paintKey(cv, down, kind) {
    const n = KEY_CELLS * keyCell;
    if (cv.width !== n || cv.height !== n) { cv.width = n; cv.height = n; }
    KeyArt.pixel(cv.getContext('2d'), n, down, kind);
  }
  function drawKeys() {
    paintKey(el.keyPushCanvas, keyHold.push !== null || pushFlash, 'gun');
    paintKey(el.keySlideCanvas, keyHold.slide !== null, 'RE');
  }

  // 읽어 주는 기능용 글(화면 이름표)
  function syncText() {
    // 진 화면이면 왜 졌는지도 읽어 준다(화면의 해골 · 「반칙」과 같은 뜻)
    const lost = phase !== 'result' ? '' : outcome === 'lose' ? ', 졌다' : outcome === 'foul' ? ', 반칙 — 신호보다 먼저 눌렀다' : '';
    const aria = `서부 결투, 연승 ${streak}${lost}`;
    if (el.screen.getAttribute('aria-label') !== aria) el.screen.setAttribute('aria-label', aria);
  }

  /* ---------- 그리기: 128×96칸 작은 판에 찍은 뒤 그대로 키운다 ---------- */
  const g = el.screen.getContext('2d');
  const board = document.createElement('canvas');
  const c = board.getContext('2d');
  let H = 0;         // 지금 검은 화면 세로 칸 수
  let skyShift = 0;  // 기준 그림을 아래로 내리는 칸 수(늘어난 하늘 몫)

  let ink = null; // 지금 붓 색(같은 색이면 다시 고르지 않아 빠르게)
  function dot(x, y, color) {
    if (x < 0 || x >= W || y < 0 || y >= H) return;
    if (color !== ink) { c.fillStyle = color; ink = color; }
    c.fillRect(x, y, 1, 1);
  }
  function box(x, y, w, h, color) {
    c.fillStyle = color; ink = color;
    c.fillRect(x, y, w, h);
  }
  function sprite(x, y, rows, color = INK, k = 1) {
    rows.forEach((row, j) => {
      for (let i = 0; i < row.length; i += 1) {
        if (row[i] !== '#') continue;
        for (let dy = 0; dy < k; dy += 1) for (let dx = 0; dx < k; dx += 1) dot(x + i * k + dx, y + j * k + dy, color);
      }
    });
  }

  // 세로 칸 수가 바뀌면 그림 전체를 내릴 칸 수를 다시 정한다
  function setRows(rows) {
    if (rows === H) return;
    H = rows;
    board.width = W; board.height = H; ink = null;
    skyShift = Math.round((H - BASE_H) * SKY_SHARE);
  }

  // 점 글씨 한 줄을 판에 찍고, 뒤를 검게 비워 능선 등이 지나가도 읽히게 한다. 차지한 높이(칸)를 돌려준다
  function boardText(keys, x, y, k, font = GLYPHS) {
    const m = measure(keys, font);
    box(x - 1, y - 1, m.w * k + 2, m.h * k + 2, BG);
    let cx = x;
    keys.forEach((key) => {
      sprite(cx, y, font[key], INK, k);
      cx += (font[key][0].length + 1) * k;
    });
    return m.h * k;
  }

  // 왼쪽 위 「왕관 + 최고 연승」 줄이 차지하는 자리(칸): 왕관 7칸 + 두 칸 띄움 + 숫자(한 글자 3칸, 사이 한 칸)
  // 그 바로 아래 「번개 + 최고 반응 속도」 줄도 같은 짜임(번개 7칸 자리 + 두 칸 띄움 + 글자)
  const hudBestKeys = () => ['♛', ...String(best)];
  const hudMsKeys = () => ['⚡', ...msTextNow()];
  // 작은 줄 하나의 폭(칸): 아이콘 + 두 칸 띄움 + 글자들(사이 한 칸)
  function hudRowW(keys) {
    return keys.reduce((w, k, n) => w + SMALL[k][0].length + (n === 0 ? HUD_CROWN_GAP : n < keys.length - 1 ? 1 : 0), 0);
  }
  function hudBestNow() {
    return {
      best, x: HUD_X, y: HUD_Y, w: hudRowW(hudBestKeys()), h: HUD_ROW_H,
      bestMs, msText: msTextNow(),
      msRow: { x: HUD_X, y: HUD_MS_Y, w: hudRowW(hudMsKeys()), h: HUD_ROW_H },
    };
  }
  // 두 줄을 찍는다. 검은 바탕 상자는 깔지 않고, 글자 둘레 한 칸만 검게 비운다
  function drawHudBest() {
    const cells = [];
    [[hudBestKeys(), HUD_Y], [hudMsKeys(), HUD_MS_Y]].forEach(([keys, y]) => {
      let cx = HUD_X;
      keys.forEach((k, n) => {
        const gl = SMALL[k];
        gl.forEach((row, j) => { for (let i = 0; i < row.length; i += 1) if (row[i] === '#') cells.push([cx + i, y + j]); });
        cx += gl[0].length + (n === 0 ? HUD_CROWN_GAP : 1);
      });
    });
    cells.forEach(([x, y]) => { for (let dy = -1; dy <= 1; dy += 1) for (let dx = -1; dx <= 1; dx += 1) dot(x + dx, y + dy, BG); });
    cells.forEach(([x, y]) => dot(x, y, INK));
  }

  // 왼쪽 위 큰 「N연승」이 차지하는 자리(칸): 숫자는 두 배 크기, 「연승」은 한 배 크기로 숫자 바닥에 붙는다.
  // 숫자가 길어 위 가운데 자리(MARK_LEFT_MIN번째 칸부터)를 넘보게 되면 숫자도 한 배로
  function streakBoxNow() {
    const bw = measure([...String(streak)]).w, uw = measure(['연', '승']).w;
    const k = (HUD_X + bw * 2 + 2 + uw < MARK_LEFT_MIN) ? 2 : 1;
    return { x: HUD_X, y: STREAK_Y, w: bw * k + 2 + uw, h: 7 * k, k, bw };
  }
  // 진 화면 한가운데 위쪽 표시가 차지하는 자리(칸). 해골 크기는 SKULL 배열에서 읽는다.
  // 맞아서 짐 = 해골 하나를 가운데, 반칙 = 해골 · 틈 · 「반칙」을 한 줄로 묶어 가운데
  // (「반칙」은 두 배 크기, 그러면 왼쪽 위 기록 줄 자리를 넘볼 때만 한 배로)
  function markBoxNow() {
    const mark = markNow();
    if (mark !== 'skull' && mark !== 'skull-foul') return null;
    const top = MARK_Y + skyShift, sw = SKULL[0].length, sh = SKULL.length;
    if (mark === 'skull') return { skull: { x: Math.floor((W - sw) / 2), y: top, w: sw, h: sh }, word: null, k: 0 };
    const m = measure(FOUL_WORD);
    const k = Math.floor((W - (sw + FOUL_GAP + m.w * 2)) / 2) >= MARK_LEFT_MIN ? 2 : 1;
    const x0 = Math.floor((W - (sw + FOUL_GAP + m.w * k)) / 2);
    return {
      skull: { x: x0, y: top, w: sw, h: sh },
      word: { x: x0 + sw + FOUL_GAP, y: top + Math.floor((sh - m.h * k) / 2), w: m.w * k, h: m.h * k },
      k,
    };
  }
  // 진 화면의 왕관 + 「최고 N연승」 줄이 차지하는 자리(칸): 해골 아래 가운데.
  // 두 배 크기가 화면 폭을 넘으면(네 자리부터) 한 배로. 방금 끝난 연승이 최고 기록이면 왕관이 깜빡인다
  function bestLineBoxNow() {
    const bl = bestLineNow();
    if (!bl) return null;
    const keys = [bl.on ? '♛' : '♛off', ' ', '최', '고', ' '].concat([...String(bl.best)], ['연', '승']);
    const m = measure(keys), k = m.w * 2 <= W - 8 ? 2 : 1;
    return { keys, k, x: Math.floor((W - m.w * k) / 2), y: MARK_Y + skyShift + BEST_LINE_GAP, w: m.w * k, h: m.h * k };
  }

  // 총잡이 한 명: anchor = 몸 한가운데 열, right = 오른쪽을 보는지(나), gy = 땅 줄.
  // 둘레를 한 칸 검게 비워 능선 위에 겹쳐도 몸이 또렷하게 보이게 한다. 상대(right = false)는 검은 모자
  function drawPerson(anchor, right, pose, gy) {
    const { rows, ax } = (right ? POSES : OPP_POSES)[pose];
    const hat = right ? HAT : OPP_HAT;
    const top = gy - rows.length;
    const sx = (i) => (right ? anchor - ax + i : anchor + ax - i);
    const cells = [];
    rows.forEach((row, j) => { for (let i = 0; i < row.length; i += 1) if (row[i] === '#') cells.push([sx(i), top + j]); });
    if (pose === 'shoot') FLASH.forEach(([i, j]) => cells.push([sx(i), top + j]));
    cells.forEach(([x, y]) => { for (let dy = -1; dy <= 1; dy += 1) for (let dx = -1; dx <= 1; dx += 1) dot(x + dx, y + dy, BG); });
    cells.forEach(([x, y]) => dot(x, y, INK));
    // 넘어가는 중 = 모자가 공중에, 누움 = 모자가 등 뒤 땅에
    if (pose === 'fall' || pose === 'down') {
      const hx = right ? anchor - 9 : anchor + 9 - (hat[0].length - 1);
      sprite(hx, pose === 'fall' ? gy - 12 : gy - hat.length, hat);
    }
  }

  /* ---------- 기다리는 동안: 굴러가는 마른 풀 덩어리 하나만 ----------
     비유: 서부 영화에서 결투 전 정적을 채우는 장면. 결투가 시작된 뒤 흐른 시간만 보고 그리므로
     (무작위는 판마다 방향 하나뿐) 검사용 손 시계로 돌려도 같은 그림이 나온다.
     노려보는 동안 · 신호가 뜬 동안만 보이고, 결과가 나면 사라진다.
     (하늘을 스치던 바람 줄은 시선을 뺏어서 뺐다) */
  function windNow() {
    if (phase !== 'wait' && phase !== 'signal') return null;
    const t = now() - startT - TUMBLE_LEAD_MS;
    if (t < 0) return null;
    const n = Math.floor(t / TUMBLE_EVERY_MS), within = t - n * TUMBLE_EVERY_MS;
    if (within >= TUMBLE_ROLL_MS) return null; // 다음 덩어리까지 잠깐 조용
    const dir = n % 2 === 0 ? windDir : -windDir; // 덩어리마다 방향을 번갈아
    const span = W + 4 * TUMBLE_R + 4;            // 화면 밖에서 나와 화면 밖으로 사라질 때까지
    const dist = (within / TUMBLE_ROLL_MS) * span;
    const x = Math.round(dir > 0 ? -2 * TUMBLE_R - 2 + dist : W + 2 * TUMBLE_R + 1 - dist);
    const hop = (within % TUMBLE_HOP_MS) / TUMBLE_HOP_MS;
    const lift = Math.round(TUMBLE_HOP * Math.sin(Math.PI * hop)); // 통통: 땅에 닿았다 튀어 오름
    return { x, lift, angle: (dir * dist) / TUMBLE_R, dir };
  }
  // 덩어리: 둘레를 검게 비운 뒤 둥근 테두리 + 굴러간 만큼 도는 잔가지 세 갈래 + 삐져나온 잔가지 둘
  function drawTumble(w, gy) {
    const cx = w.x, cy = gy - 1 - TUMBLE_R - w.lift;
    for (let y = -TUMBLE_R - 1; y <= TUMBLE_R + 1; y += 1) {
      for (let x = -TUMBLE_R - 1; x <= TUMBLE_R + 1; x += 1) if (Math.hypot(x, y) <= TUMBLE_R + 1.2) dot(cx + x, cy + y, BG);
    }
    TUMBLE_RING.forEach(([x, y]) => dot(cx + x, cy + y, INK));
    for (let s = 0; s < 3; s += 1) {
      const a = w.angle + (s * 2 * Math.PI) / 3;
      for (let rr = 1; rr < TUMBLE_R; rr += 1) dot(cx + Math.round(Math.cos(a) * rr), cy + Math.round(Math.sin(a) * rr), INK);
    }
    [0.5, 0.5 + Math.PI].forEach((off) => {
      const a = w.angle + off;
      dot(cx + Math.round(Math.cos(a) * (TUMBLE_R + 1)), cy + Math.round(Math.sin(a) * (TUMBLE_R + 1)), INK);
    });
  }
  // 「나」 표시가 떠 있는지: 결투가 시작되고 1.5초 동안
  const meMarkNow = () => (phase === 'wait' || phase === 'signal') && now() - startT < ME_MARK_MS;

  function render() {
    const oy = skyShift, gy = GROUND_Y + oy;
    box(0, 0, W, H, BG);

    // 해
    sprite(SUN_X, SUN_Y + oy, SUN);
    // 먼 바위산 능선: 칸 사이가 끊기지 않게 세로로 이어 준다
    for (let x = 0; x < W; x += 1) {
      const y = RIDGE_TOP[x], prev = x > 0 ? RIDGE_TOP[x - 1] : y;
      for (let yy = Math.min(y, prev + 1); yy <= Math.max(y, prev - 1); yy += 1) dot(x, yy + oy, INK);
    }
    // 선인장
    CACTI.forEach(([x, rows]) => sprite(x, gy - rows.length, rows));
    // 땅 속 자갈 점
    const tw = GROUND_TEX[0].length, th = GROUND_TEX.length;
    for (let y = gy + 2; y < H; y += 1) {
      for (let x = 0; x < W; x += 1) if (GROUND_TEX[(y - gy) % th][x % tw] === '#') dot(x, y, INK);
    }
    // 굴러가는 풀(노려보는 동안): 사람보다 먼저 그려서, 덩어리가 사람 앞을 지나도 사람은 그대로 또렷하게(사람 둘레 비움이 덮는다)
    const w = windNow();
    if (w) drawTumble(w, gy);
    // 두 사람(나 = 왼쪽 끝, 상대 = 오른쪽 끝)
    const p = poses();
    drawPerson(ME_X, true, p.me, gy);
    drawPerson(OPP_X, false, p.opp, gy);
    // 평평한 땅 줄(사람 둘레 비움에 지워지지 않게 사람 다음에)
    box(0, gy, W, 1, INK);

    // 신호: 화면 한가운데 위쪽
    if (markNow() === '!') sprite(Math.floor((W - BANG[0].length) / 2), MARK_Y + oy, BANG);
    // 진 화면: 같은 자리에 큰 해골(맞아서 짐 · 반칙 둘 다). 반칙이면 해골 오른쪽에 「반칙」
    const mb = markBoxNow();
    if (mb) {
      sprite(mb.skull.x, mb.skull.y, SKULL);
      if (mb.word) boardText(FOUL_WORD, mb.word.x, mb.word.y, mb.k);
    }
    // 이긴 화면: 내 반응 시간을 신호가 있던 한가운데 위쪽에 크게
    const tt = timeTextNow();
    if (tt) {
      const keys = [...tt], m = measure(keys);
      // 왼쪽 위 「N연승」이 두 자리 이상으로 길어지면 가운데 숫자와 맞닿는다 → 연승 글자 오른쪽 끝에서 네 칸 띄운 자리까지 오른쪽으로 민다.
      // 그래도 오른쪽 위 해와 닿게 되면 숫자를 한 배 크기로 줄인다(안전장치 — 연승이 아주 길 때만. 세 자리 연승은 「N연승」이 한 배로 줄어 닿지 않는다)
      const sbx = streakBoxNow(), leftMin = sbx.x + sbx.w + 4;
      let tk = 2, tx = Math.max(Math.floor((W - m.w * 2) / 2), leftMin);
      if (tx + m.w * 2 > SUN_X - 2) { tk = 1; tx = Math.max(Math.floor((W - m.w) / 2), leftMin); }
      boardText(keys, tx, MARK_Y + oy + 3, tk);
    }
    // 지거나 반칙한 결과: 해골 아래 가운데에 왕관 + 「최고 N연승」
    const bb = bestLineBoxNow();
    if (bb) boardText(bb.keys, bb.x, bb.y, bb.k);

    // 왼쪽 위 = 지금 연승 「N연승」: 숫자는 칸 두 배 크기, 「연승」은 한 배 크기로 숫자 바닥에 맞춰 붙인다
    const sb = streakBoxNow();
    boardText([...String(streak)], sb.x, sb.y, sb.k);
    boardText(['연', '승'], sb.x + sb.bw * sb.k + 2, sb.y + sb.h - 7, 1);
    // 그 위 두 줄 = 왕관 + 최고 연승 숫자, 번개 + 최고 반응 속도(언제나 — 기다릴 때 · 신호 때 · 결과 화면 모두,
    // 0이어도 「왕관 0」, 기록이 없어도 「번개 -.---」). 글자 둘레 한 칸만 검게 비운다(뒤 그림이 지나가도 읽히게)
    drawHudBest();

    // 「나」 표시: 결투가 시작되면 1.5초 동안 왼쪽 사람(나) 모자 위 한 칸 띄워서. 뒤만 검게 비운다(모자 쪽은 안 지움)
    if (meMarkNow()) {
      const mx = ME_X - Math.floor(ME_MARK[0].length / 2), my = gy - STAND.length - 1 - ME_MARK.length;
      box(mx - 1, my, ME_MARK[0].length + 2, ME_MARK.length, BG);
      sprite(mx, my, ME_MARK);
    }

    // 작은 판을 큰 그림판에 옮긴다
    g.imageSmoothingEnabled = false;
    g.drawImage(board, 0, 0, el.screen.width, el.screen.height);
  }

  /* ---------- 몸통 겉모양: 위 두 모서리는 둥글게, 아래 두 모서리는 비스듬히 깎기 ----------
     inset = 바깥선에서 안으로 들어온 거리(검은 몸통의 안쪽 흰 선을 그릴 때 씀) */
  function bodyPath(w, h, rad, bevel, inset) {
    const i = inset, R = Math.max(0, rad - i), B = Math.max(0, bevel - i * 0.41);
    const x0 = i, y0 = i, x1 = w - i, y1 = h - i;
    return `M ${x0} ${y0 + R} A ${R} ${R} 0 0 1 ${x0 + R} ${y0} L ${x1 - R} ${y0} A ${R} ${R} 0 0 1 ${x1} ${y0 + R} `
      + `L ${x1} ${y1 - B} L ${x1 - B} ${y1} L ${x0 + B} ${y1} L ${x0} ${y1 - B} Z`;
  }
  function drawBody(dw, dh, rad, bevel) {
    const sk = SKINS[skin];
    el.bodyArt.setAttribute('viewBox', `0 0 ${dw} ${dh}`);
    el.bodyArt.setAttribute('width', dw); el.bodyArt.setAttribute('height', dh);
    el.bodyFill.setAttribute('d', bodyPath(dw, dh, rad, bevel, 0));
    el.bodyFill.setAttribute('fill', sk.body);
    if (sk.line) {
      el.bodyLine.setAttribute('d', bodyPath(dw, dh, rad, bevel, 1)); // 굵기 2 선의 가운데를 1 안쪽에 → 바깥선 안쪽 0~2점
      el.bodyLine.setAttribute('stroke', INK); el.bodyLine.setAttribute('stroke-width', '2');
    } else {
      el.bodyLine.removeAttribute('d');
    }
  }

  // 오돌토돌한 띠: 본보기 기기 아래쪽 회색 띠. 모서리 둥근 직사각형을 띠 색으로 칠하고, 몸통 색 점을 흩뿌린다
  function drawGrip(gw, gh) {
    const cv = el.grip, r = dpr(), ctx = cv.getContext('2d'), sk = SKINS[skin];
    const w = Math.max(1, Math.round(gw * r)), h = Math.max(1, Math.round(gh * r));
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    cv.style.width = `${w / r}px`; cv.style.height = `${h / r}px`;
    ctx.clearRect(0, 0, w, h);
    const rr = Math.min(h / 2, Math.round(h * 0.3));
    ctx.beginPath();
    ctx.moveTo(rr, 0); ctx.lineTo(w - rr, 0); ctx.arcTo(w, 0, w, rr, rr); ctx.lineTo(w, h - rr); ctx.arcTo(w, h, w - rr, h, rr);
    ctx.lineTo(rr, h); ctx.arcTo(0, h, 0, h - rr, rr); ctx.lineTo(0, rr); ctx.arcTo(0, 0, rr, 0, rr); ctx.closePath();
    ctx.fillStyle = sk.grip; ctx.fill();
    // 점 무늬(여섯 게임 같은 규칙): 점 하나 = 화면 점 2개, 가로 6 · 세로 4 간격, 한 줄 걸러 반 칸 어긋나게
    ctx.save(); ctx.clip();
    const p = Math.max(1, Math.round(2 * r));
    ctx.fillStyle = sk.body;
    for (let row = 0, y = 2 * p; y + p <= h - 2 * p; row += 1, y += 2 * p) {
      for (let x = 2 * p + (row % 2 ? Math.round(1.5 * p) : 0); x + p <= w - 2 * p; x += 3 * p) ctx.fillRect(x, y, p, p);
    }
    ctx.restore();
  }

  /* ---------- 기기 자리 맞추기 ----------
     몸통 폭 dw = min(창 폭 − 28, 460). 위에서부터: 띠(작은 버튼 줄 + 위아래 10) → 검은 화면(128×96칸) → 7% → 키캡 둘(사이 7%) → 7% → 오돌토돌한 띠(7%) → 7%.
     합이 창 높이 − 28을 넘으면 화면 칸 크기부터, 그다음 키캡 크기를 줄인다(키캡은 72 아래로 안 줄임).
     몸통은 창 가운데(받침대 main이 창 전체이고 가운데 정렬) */
  // 창이 낮으면(가로로 눕힌 폰 등) 몸통 폭부터 줄인다 — 폭은 그대로 두고 화면만 줄이면 화면이 점 하나 크기가 된다.
  // 화면 칸 · 키캡을 제 크기로 놓았을 때(위 띠 + 화면 + 키캡 + 틈 넷) 창 높이 안에 들어가는 가장 큰 폭을 찾는다
  function fitWidth(maxW, roomH, band, rows, keyShare) {
    const r = dpr();
    for (let w = maxW; w > 160; w -= 4) {
      const cell = Math.max(1, Math.floor(w * 0.86 * r / 128));
      if (band + (rows * cell) / r + Math.max(72, w * keyShare) + 4 * Math.round(w * 0.07) <= roomH) return w;
    }
    return Math.min(maxW, 160);
  }
  // 기기 밖 이름 버튼이 설 자리가 없으면(몸통이 창을 가로 · 세로로 꽉 채우는 창), 위아래 여유를 넓혀 한 번 더 맞춘다
  const ME_ROOM = 72;   // 그때 남기는 위아래 여유(양쪽 합): 작은 이름 버튼(24) + 틈(8) + 가장자리(4)의 두 배
  let mePlaced = true;
  function fit() {
    if (lbFrozen()) return; // 이름을 치는 동안(폰 글자판이 올라와 창 높이가 줄어도) 기기 크기를 다시 맞추지 않는다
    fitOnce(0);
    if (!mePlaced) fitOnce(ME_ROOM);
  }
  function fitOnce(room) {
    const r = dpr(), rows = ROWS, cc = cornerCell();
    drawGameBtn(); drawCrownBtn(); drawSoundBtn(); drawSkinBtn();
    const btnH = (BTN_ROWS * cc) / r;
    const band = btnH + 2 * BAND_PAD;

    const mb = el.main.getBoundingClientRect();
    const limitH = mb.height - Math.max(EDGE, room);
    const dw = fitWidth(Math.max(120, Math.floor(Math.min(mb.width - EDGE, DEVICE_MAX))), limitH, band, rows, KEY_SHARE_TWO);
    const gap = Math.round(dw * GAP_SHARE);
    const gh = gap; // 띠 높이 = 몸통 폭의 7%

    // 키캡 크기: 20칸 × 정수 점이 되는 크기 중 목표(몸통 폭의 34%)에 가장 가까운 것, 72 ~ 190 사이
    const want = dw * KEY_SHARE_TWO;
    let kc = 0, nearest = Infinity;
    for (let n = 1; KEY_CELLS * n / r <= KEY_MAX + 0.01; n += 1) {
      const size = KEY_CELLS * n / r;
      if (size >= KEY_MIN - 0.01 && Math.abs(size - want) < nearest) { kc = n; nearest = Math.abs(size - want); }
    }
    if (!kc) kc = Math.max(1, Math.ceil(KEY_MIN * r / KEY_CELLS));
    const kcMin = Math.ceil((KEY_MIN - 0.01) * r / KEY_CELLS);

    // 검은 화면: 128 × 96칸, 한 칸 = 정수 기기 화면 점
    let cellPx = Math.max(1, Math.floor(dw * SCREEN_SHARE * r / W));
    const total = (cp, k) => band + (rows * cp) / r + gap + (KEY_CELLS * k) / r + gap + gh + gap;
    while (cellPx > 1 && total(cellPx, kc) > limitH) cellPx -= 1;
    while (kc > kcMin && total(cellPx, kc) > limitH) kc -= 1;
    // 몸통을 세로로 길게: 폭의 1.5배까지(창 높이 안에서), 남는 높이를 세 틈(화면~키캡 · 키캡~띠 · 띠~몸통 끝)에 똑같이 나눠 넣는다
    const lift = Math.max(0, Math.floor((Math.min(limitH, Math.round(dw * BODY_TALL)) - total(cellPx, kc)) / 3));
    keyCell = kc;
    const ks = KEY_CELLS * kc / r;
    const sw = (W * cellPx) / r, sh = (rows * cellPx) / r;

    const keyTop = Math.round(band + sh + gap + lift);
    const gripTop = Math.round(keyTop + ks + gap + lift);
    const dh = Math.round(gripTop + gh + gap + lift);

    // 몸통
    const ds = el.deviceE.style, rad = Math.round(dw * CORNER_SHARE), bevel = Math.round(dw * CORNER_SHARE);
    ds.width = `${dw}px`; ds.height = `${dh}px`;
    drawBody(dw, dh, rad, bevel);

    // 위 띠: 왼쪽 끝 = 게임 버튼, 오른쪽 묶음(왼→오) = 소리 → 몸통 색(사이 6점).
    // 양 끝은 몸통 폭의 8%만큼 들여놓되, 몸통이 아주 좁아 두 묶음이 붙을 것 같으면 들여놓는 폭을 줄인다
    const oneW = (ONE_COLS * cc) / r, gameW = (gameCols() * cc) / r;
    // 오른쪽 묶음은 셋: 순위표(왕관) → 소리 → 몸통 색
    const spare = dw - gameW - (3 * oneW + 2 * BAND_GAP) - BAND_GAP;
    let side = Math.round(dw * 0.08);
    if (2 * side > spare) side = Math.max(2, Math.floor(spare / 2));
    el.gameBtn.style.left = `${side}px`; el.gameBtn.style.top = `${BAND_PAD}px`;
    [el.skinBtn, el.soundBtn, lb.crownBtn].forEach((b, i) => {
      b.style.left = ''; b.style.right = `${side + i * (oneW + BAND_GAP)}px`; b.style.top = `${BAND_PAD}px`;
    });

    // 검은 화면: 가운데 정렬
    setRows(rows);
    if (el.screen.width !== W * cellPx || el.screen.height !== H * cellPx) { el.screen.width = W * cellPx; el.screen.height = H * cellPx; }
    el.screen.style.width = `${sw}px`; el.screen.style.height = `${sh}px`;
    el.screen.style.left = `${Math.round((dw - sw) / 2)}px`;
    el.screen.style.top = `${Math.round(band)}px`;

    // 키캡 두 개: 둘을 묶어 가운데(왼쪽 = RE, 오른쪽 = 쏘기), 사이 = 몸통 폭의 7%
    const keyGap = gap, rowLeft = Math.round((dw - (2 * ks + keyGap)) / 2);
    [[el.keySlide, el.keySlideCanvas, rowLeft], [el.keyPush, el.keyPushCanvas, Math.round(rowLeft + ks + keyGap)]].forEach(([b, cv, x]) => {
      const n = KEY_CELLS * kc;
      if (cv.width !== n || cv.height !== n) { cv.width = n; cv.height = n; }
      cv.style.width = `${ks}px`; cv.style.height = `${ks}px`;
      b.style.left = `${x}px`; b.style.top = `${keyTop}px`;
      b.style.width = `${ks}px`; b.style.height = `${ks}px`;
    });

    // 오돌토돌한 띠: 가운데
    const gw = Math.round(dw * GRIP_SHARE);
    drawGrip(gw, gh);
    el.grip.style.left = `${Math.round((dw - gw) / 2)}px`; el.grip.style.top = `${gripTop}px`;

    // 순위표 창 · 이름 창: 검은 화면 위 끝부터 키캡 아래 끝까지(검은 화면과 같은 폭 · 같은 칸 크기). 그 아래 오돌토돌한 띠는 가리지 않는다
    lbFit(Math.round((dw - sw) / 2), Math.round(band), sw, keyTop + ks - Math.round(band), cellPx, r);
    mePlaced = syncMeBtn();

    drawKeys();
    syncText();
    render();
  }

  /* ---------- 게임 버튼: 위 띠 왼쪽 끝, 누른 숫자 칸의 게임으로 바로 간다 ----------
     비유: TV 리모컨 숫자 버튼. 1 시지프스 · 2 10.00000 · 3 결투 · 4 100m · 5 퍼덕 · 6 멀리뛰기 · 7 100연승 · 8 무궁화꽃 중 누른 번호로 곧장.
     여덟 게임은 같은 전시장의 옆 폴더라서 「한 칸 위 폴더 → 옆 폴더」 주소로 옮겨 간다.
     이 컴퓨터의 폴더 이름(local)과 인터넷 전시장의 폴더 이름(web)이 달라서 둘 다 적어 두고,
     지금 열린 폴더 이름이 어느 쪽인지 보고 같은 쪽 이름으로 간다.
     키보드 바로 가기는 두지 않는다(100m의 F · J 사이 G처럼, 달리다 스치면 판이 날아가서) */
  function gameHere() { return '3'; }
  function gameList() {
    return [
      { id: '1', name: '시지프스', local: 'streak-sisyphus', web: 'hold-on-sisyphus' },
      { id: '2', name: '10.00000', local: 'key-ten', web: 'hold-on-key-ten' },
      { id: '3', name: '결투', local: 'key-duel', web: 'hold-on-key-duel' },
      { id: '4', name: '100m', local: 'key-100m', web: 'hold-on-key-100m' },
      { id: '5', name: '퍼덕', local: 'key-flap', web: 'hold-on-key-flap' },
      { id: '6', name: '멀리뛰기', local: 'key-leap', web: 'hold-on-key-leap' },
      { id: '7', name: '100연승', local: 'key-streak', web: 'hold-on-key-streak' },
      { id: '8', name: '무궁화꽃', local: 'key-redlight', web: 'hold-on-key-redlight' },
    ];
  }
  // 게임 버튼 폭(칸): 여백 3 + 숫자 상자 여섯(사이 한 칸) + 여백 3
  function gameCols() { return 3 + gameList().length * (GAME_BOX_W + 1) - 1 + 3; }
  function gameUrl(id) {
    const list = gameList(), target = list.find((g) => g.id === String(id));
    if (!target) return null;
    // 지금 폴더 이름: …/hold-on-key-ten/ → hold-on-key-ten, …/key-ten/index.html → key-ten
    const parts = location.pathname.split('/').filter(Boolean);
    if (parts.length && /\.html?$/i.test(parts[parts.length - 1])) parts.pop();
    const here = decodeURIComponent(parts[parts.length - 1] || '');
    const onWeb = list.some((g) => g.web === here);
    return onWeb ? `../${target.web}/` : `../${target.local}/index.html`;
  }
  // 넘어간 게임마다 뒤로 가기 기록이 쌓이지 않게 지금 칸을 바꿔 끼운다. 지금 게임 번호면 아무 일 없음
  function goGame(id) {
    if (String(id) === gameHere()) return false;
    const url = gameUrl(id);
    if (!url) return false;
    location.replace(url);
    return true;
  }
  // 그림: 테두리 안에 1~8, 지금 게임 숫자만 검게 칠한 칸에 흰 글씨
  function drawGameBtn() {
    const cv = el.gameCanvas, ctx = cv.getContext('2d'), cc = cornerCell(), list = gameList();
    const cw = gameCols() * cc, ch = BTN_ROWS * cc;
    sizeCorner(cv, cw, ch);
    ctx.clearRect(0, 0, cw, ch);
    pixelBlock(ctx, cw, ch, cc, INK); // 몸통 색과 상관없이 흰 바탕
    pixelFrame(ctx, cw, ch, cc, BG);
    list.forEach((g, i) => {
      const bx = (3 + i * (GAME_BOX_W + 1)) * cc, by = Math.floor((BTN_ROWS - GAME_BOX_H) / 2) * cc;
      if (g.id === gameHere()) {
        ctx.fillStyle = BG; ctx.fillRect(bx, by, GAME_BOX_W * cc, GAME_BOX_H * cc);
        drawText(ctx, [g.id], bx + cc, by + cc, cc, INK);
      } else {
        drawText(ctx, [g.id], bx + cc, by + cc, cc, BG);
      }
    });
    setGhost(el.gameLabel, `게임 ${gameHere()} ${list.find((g) => g.id === gameHere()).name}`);
  }
  // 버튼 안 가로 위치(화면 점, 버튼 왼쪽 끝 = 0) → 몇 번째 숫자 칸인지.
  // 칸 경계 = 글자 상자 경계, 상자 사이 한 칸 틈은 그 가운데를 기준으로 가까운 칸, 양 끝 여백은 맨 끝 칸
  function gameIndexAt(xCss) {
    const n = gameList().length, cellsX = (xCss * dpr()) / cornerCell();
    const i = Math.floor((cellsX - 3 + 0.5) / (GAME_BOX_W + 1));
    return Math.max(0, Math.min(n - 1, i));
  }
  /* ====================================================================
     순위표
     비유: 오락실 점수판. 게임기는 그대로 두고, 점수판 앞에 문지기(기록을 받아 적고 순위를 알려 주는 사람)를 세운다.
     이 파일에는 진짜 문지기 대신 **가짜 문지기**가 들어 있다 — 인터넷으로 아무것도 보내지 않고,
     지어낸 명단에 내 기록을 끼워 넣어 순위를 세고, 진짜처럼 0.3~0.6초 늦게 대답한다.
     ==================================================================== */

  /* ---------- 가짜 문지기 Board ----------
     게임 쪽은 아래 창구만 부른다. 진짜 문지기로 바꿀 때는 이 덩어리 하나만 갈아 끼우면 된다.
       이름 만들기  createName(이름) · rename(새 이름) · checkName(이름 — 폰에서 먼저 보는 검사)
       판 시작      startRun() → 번호표
       판 끝 보고   endRound(번호표, { streak 연승, reactMs 이긴 판의 반응 시간 })
       순위 읽기    read(순위 종류, 기간) → { rows, total, me }
       계정 일      me() · linkGoogle() · unlinkGoogle() · resume(이름, 코드) · resumeGoogle() · leave() · resetAll()
     대답은 모두 「나중에 오는 약속」(Promise)이다. 주소에 ?offline=1 을 붙이면 모든 대답이 실패한다 */
  const Board = (function () {
    const DEVICE_KEY = LB_PREFIX + 'device';   // 이 기기: 어느 사람에 묶여 있는지 · 이름 묻기를 건너뛰었는지
    const SERVER_KEY = LB_PREFIX + 'server';   // 가짜 문지기의 장부: 만든 이름 · 코드 · 구글 연결 · 최고 기록
    const offline = LB_QUERY.get('offline') === '1';
    const TOTAL = { today: 86, all: 1204 };    // 지어낸 명단의 사람 수
    const CODE_CHARS = '23456789ABCDEFGHJKMNPQRSTUVWXYZ'; // 이어하기 코드 글자(헷갈리는 0 · O · 1 · I · L은 안 씀)
    const POOL = ['닉네임여덟글자임', 'mushrm7', '오늘도야근', '엄지하나로', '응응', '결투왕', 'NO1', '감자튀김', '퇴근하고싶다', 'sonic99',
      '번개손', '한판만더', 'zzz', '고양이발바닥', '7연패중', '라면물조절', 'K2', '선인장', '느린손가락', 'BEST',
      '월요일싫어', '콩나물국밥', 'ab', '도전자', '새벽네시', 'pixel', '엄마가불러', '탕수육부먹', '0000', '마지막한판', 'GG', '치즈돈까스'];
    // 이름으로 못 쓰는 정치인 실명(견본): 순위표가 싸움터가 되지 않게 전 · 현직 대통령과 주요 정치인 이름을 막는다
    const POLITICIANS = ['이승만', '윤보선', '박정희', '최규하', '전두환', '노태우', '김영삼', '김대중', '노무현', '이명박', '박근혜', '문재인', '윤석열', '이재명',
      '한동훈', '이준석', '조국', '안철수', '홍준표', '오세훈', '김문수', '추미애', '이낙연', '심상정'];

    // 금지 단어 거르는 함수와 목록(이 파일 위쪽에 원본 그대로 들어 있다). 없으면 길이 · 글자 검사만 한다
    let filterOk = false, wordCount = 0;
    try {
      const words = window.__NICK_WORDS__;
      if (window.NicknameFilter && words && words.categories) {
        words.categories['정치인 실명'] = POLITICIANS;
        window.NicknameFilter.setWordList(words);
        wordCount = Object.keys(words.categories).reduce((n, k) => n + words.categories[k].length, 0);
        filterOk = true;
      }
    } catch (e) { filterOk = false; }

    let clock = () => Date.now(); // 문지기 시계(시뮬레이션에서는 게임 시계를 끼워 쓴다)
    const readJson = (key) => { try { const v = JSON.parse(loadRaw(key)); return v && typeof v === 'object' ? v : null; } catch (e) { return null; } };
    let device = readJson(DEVICE_KEY) || { pid: null, skip: false };
    let server = readJson(SERVER_KEY) || { seq: 0, accounts: [] };
    if (!Array.isArray(server.accounts)) server = { seq: 0, accounts: [] };
    const save = () => { saveRaw(DEVICE_KEY, JSON.stringify(device)); saveRaw(SERVER_KEY, JSON.stringify(server)); };
    const account = () => server.accounts.find((a) => a.id === device.pid) || null;
    // 「오늘」 = 한국 시각 자정 기준 날짜
    const dayKey = () => new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);

    // 지어낸 명단: i번째 사람의 이름(2~8자). 한 바퀴 돌면 뒤에 숫자를 붙인다
    function nameAt(i) {
      const base = POOL[i % POOL.length], round = Math.floor(i / POOL.length);
      if (!round) return base;
      const tail = String(round + 1);
      return Array.from(base).slice(0, 8 - tail.length).join('') + tail;
    }
    const rosterNames = {};
    for (let i = 0; i < TOTAL.all; i += 1) rosterNames[nameAt(i).toLowerCase()] = true;
    // 지어낸 기록: 연승은 1등 17연승부터 줄어들고, 반응은 1등 0.187초부터 느려진다. 오늘 명단은 전체 명단에서 14명에 한 명씩 뽑은 사람들
    const slot = (period, r) => (period === 'today' ? r * 14 : r);
    function rosterValue(metric, period, r) {
      const q = slot(period, r);
      return metric === 'react' ? Math.round(187 + (400 * (q - 1)) / 1203) : Math.max(1, Math.round(17 / (1 + (q - 1) * 0.02)));
    }
    const better = (metric, a, b) => (metric === 'react' ? a < b : a > b);
    function bestOf(acc, metric, period) {
      const s = acc.bests && acc.bests[metric];
      if (!s) return null;
      if (period === 'all') return s.all || null;
      return s.day === dayKey() ? s.today || null : null;
    }
    // 순위표 한 장 만들기: 지어낸 명단 + 장부에 있는 사람들의 기록을 줄 세운다. 동점은 먼저 낸 사람이 위
    function buildBoard(metric, period) {
      const list = [];
      for (let r = 1; r <= TOTAL[period]; r += 1) list.push({ name: nameAt(slot(period, r) - 1), v: rosterValue(metric, period, r), at: 0, me: false });
      server.accounts.forEach((a) => {
        const b = bestOf(a, metric, period);
        if (b && a.name) list.push({ name: a.name, v: b.v, at: b.at, me: a.id === device.pid });
      });
      list.sort((x, y) => (x.v === y.v ? x.at - y.at : better(metric, x.v, y.v) ? -1 : 1));
      let me = null;
      const rows = list.map((row, i) => {
        const e = { rank: i + 1, name: row.name, score: metric === 'react' ? (row.v / 1000).toFixed(3) : String(row.v), me: row.me };
        if (row.me) me = e;
        return e;
      });
      return { metric, period, rows, total: rows.length, me };
    }

    // 이름 검사(폰에서 먼저, 문지기가 한 번 더): 길이 → 글자 종류 → 금지 단어. why = length · chars · banned
    function checkName(input) {
      let s = String(input === null || input === undefined ? '' : input);
      try { s = s.normalize('NFKC'); } catch (e) { /* 그대로 */ }
      s = s.trim();
      const len = Array.from(s).length;
      if (len < 2 || len > 8) return { ok: false, why: 'length', name: s };
      if (!/^[가-힣a-zA-Z0-9]+$/.test(s)) return { ok: false, why: 'chars', name: s };
      if (filterOk) {
        const r = window.NicknameFilter.checkNickname(s);
        if (!r.ok) return { ok: false, why: r.reason === 'length' || r.reason === 'chars' ? r.reason : 'banned', name: s };
      }
      return { ok: true, why: null, name: s };
    }
    // 같은 이름(영문 대소문자는 같게 봄): 지어낸 명단과 장부의 이름
    const taken = (name, selfId) => {
      const low = name.toLowerCase();
      return !!rosterNames[low] || server.accounts.some((a) => a.id !== selfId && a.name && a.name.toLowerCase() === low);
    };
    function newCode() {
      let s = '';
      for (let i = 0; i < 6; i += 1) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
      return s.slice(0, 3) + '-' + s.slice(3);
    }
    // 늦게 오는 대답 흉내: 0.3~0.6초 뒤(ms를 주면 그만큼 뒤). 연결 없음이면 실패
    const later = (work, ms) => new Promise((resolve, reject) => {
      setTimeout(() => {
        if (offline) { reject({ offline: true }); return; }
        try { resolve(work()); } catch (e) { reject(e); }
      }, slow !== null ? Math.max(slow, ms || 0) : ms === undefined ? 300 + Math.floor(Math.random() * 301) : ms);
    });
    let slow = null; // 검사용: 대답을 일부러 더 늦게(1/1000초). null이면 평소대로
    let failReads = 0; // 검사용: 다음 순위 읽기 몇 번을 일부러 실패시킬지
    const meNow = () => { const a = account(); return a ? { id: a.id, name: a.name, code: a.code, google: !!a.google } : null; };

    return {
      offline, total: TOTAL,
      filterReady: () => filterOk, wordCount: () => wordCount,
      setClock(fn) { clock = fn; },
      setDelay(ms) { slow = ms === null || ms === undefined ? null : Math.max(0, Number(ms) || 0); },
      me: meNow,
      skipped: () => !!device.skip,
      setSkip(v) { device.skip = !!v; save(); },
      checkName,
      isTaken: (name) => taken(String(name), device.pid),
      createName(input) {
        return later(() => {
          const c = checkName(input);
          if (!c.ok) return { ok: false, why: c.why };
          if (taken(c.name, null)) return { ok: false, why: 'taken' };
          server.seq += 1;
          const acc = { id: server.seq, name: c.name, code: newCode(), google: false, bests: {} };
          server.accounts.push(acc);
          device.pid = acc.id; device.skip = false;
          save();
          return { ok: true, name: acc.name, code: acc.code };
        });
      },
      rename(input) {
        return later(() => {
          const acc = account();
          if (!acc) return { ok: false, why: 'wrong' };
          const c = checkName(input);
          if (!c.ok) return { ok: false, why: c.why };
          if (taken(c.name, acc.id)) return { ok: false, why: 'taken' };
          acc.name = c.name; save();
          return { ok: true, name: acc.name };
        });
      },
      // 판 시작: 번호표(준 시각이 적힌 쪽지). 이름이 있는 사람의 첫 승 때 한 장 — 그 전에 쌓은 연승은 세지 않는다
      startRun() { return { t: clock(), n: Math.random() }; },
      // 번호표 이어 쓰기: 폰에 연승과 같이 적어 둔 번호표를 새로 고침 뒤에 다시 꺼낸다(age = 받은 뒤 흐른 시간).
      // 진짜 문지기에서는 도장이 찍힌 번호표를 그대로 다시 내므로 폰이 시간을 고쳐 적을 수 없다
      resumeRun(age) { return { t: clock() - Math.max(0, Number(age) || 0), n: Math.random() }; },
      age: (ticket) => (ticket ? clock() - ticket.t : 0),
      today: dayKey,
      failNextRead(n) { failReads = Math.max(0, Math.floor(Number(n) || 0)); },
      // 판 끝 보고: 말이 되는 기록만 조용히 받아 적는다(연승 1~200 · 번호표를 준 뒤 흐른 시간이 연승 수에 맞음 · 반응 0.100~0.600초)
      endRound(ticket, record) {
        if (!account() || !ticket) return Promise.resolve({ ok: false });
        const elapsed = clock() - ticket.t;
        return later(() => {
          const acc = account();
          if (!acc) return { ok: false };
          const streakNow = Math.floor(Number(record && record.streak)), ms = Math.floor(Number(record && record.reactMs));
          if (!(streakNow >= 1 && streakNow <= 200) || elapsed < (streakNow - 1) * 1500 - 1) return { ok: false };
          const put = (metric, v) => {
            const s = acc.bests[metric] || (acc.bests[metric] = {});
            if (s.day !== dayKey()) { s.day = dayKey(); s.today = null; }
            if (!s.all || better(metric, v, s.all.v)) s.all = { v, at: Date.now() };
            if (!s.today || better(metric, v, s.today.v)) s.today = { v, at: Date.now() };
          };
          put('streak', streakNow);
          if (ms >= 100 && ms <= 600) put('react', ms);
          save();
          return { ok: true };
        });
      },
      read: (metric, period) => later(() => {
        if (failReads > 0) { failReads -= 1; throw new Error('read failed'); }
        return buildBoard(metric, period);
      }),
      peek: (metric, period) => buildBoard(metric, period),   // 검사용: 기다리지 않고 바로 읽기
      linkGoogle() {
        return later(() => {
          const acc = account();
          if (!acc) return { ok: false };
          server.accounts.forEach((a) => { a.google = false; });
          acc.google = true; save();
          return { ok: true };
        }, 600);
      },
      unlinkGoogle() { return later(() => { const acc = account(); if (acc) { acc.google = false; save(); } return { ok: true }; }); },
      resume(name, code) {
        return later(() => {
          const low = String(name || '').trim().toLowerCase(), key = String(code || '').replace(/[^0-9a-z]/gi, '').toUpperCase();
          const acc = server.accounts.find((a) => a.name && a.name.toLowerCase() === low && a.code.replace('-', '') === key);
          if (!acc) return { ok: false, why: 'wrong' };
          device.pid = acc.id; device.skip = false; save();
          return { ok: true, name: acc.name };
        });
      },
      resumeGoogle() {
        return later(() => {
          const acc = server.accounts.find((a) => a.google);
          if (!acc) return { ok: false, why: 'nogoogle' };
          device.pid = acc.id; device.skip = false; save();
          return { ok: true, name: acc.name };
        }, 600);
      },
      // 이 기기에서 나가기: 기기의 묶음만 푼다(이름과 기록은 장부에 남아 이름 + 코드로 다시 이어 갈 수 있다)
      leave() { device.pid = null; save(); return Promise.resolve({ ok: true }); },
      resetAll() { wipeSim(); device = { pid: null, skip: false }; server = { seq: 0, accounts: [] }; },
    };
  }());
  Board.setClock(now);

  /* ---------- 진짜 게임의 소리 칸을 건드리지 않기 ----------
     소리 덩어리는 여러 게임이 함께 쓰는 칸에 고른 소리를 적는다. 시뮬레이션에서 소리를 바꿔도 그 칸은 원래 값으로 돌려놓고, 시뮬레이션 칸에 따로 적는다 */
  const REAL_SOUND_KEY = 'hold-on-keys-sound', SIM_SOUND_KEY = LB_PREFIX + 'sound';
  function keepRealSound(work) {
    let had = null, can = true;
    try { had = localStorage.getItem(REAL_SOUND_KEY); } catch (e) { can = false; }
    const out = work();
    if (can) { try { if (had === null) localStorage.removeItem(REAL_SOUND_KEY); else localStorage.setItem(REAL_SOUND_KEY, had); } catch (e) { /* 그대로 */ } }
    saveRaw(SIM_SOUND_KEY, KeySound.index);
    return out;
  }
  (() => { const i = loadInt(SIM_SOUND_KEY); if (i !== null) keepRealSound(() => KeySound.set(i)); })();

  /* ---------- 화면 요소 · 상태 ---------- */
  const lb = {
    crownBtn: document.getElementById('crownBtn'), crownCanvas: document.getElementById('crownCanvas'), crownLabel: document.getElementById('crownLabel'),
    sheetWrap: document.getElementById('lbSheetWrap'), sheet: document.getElementById('lbSheet'),
    panelWrap: document.getElementById('lbPanelWrap'), panel: document.getElementById('lbPanel'),
    meBtn: document.getElementById('meBtn'), meText: document.getElementById('meBtnText'), page: document.getElementById('lbPage'),
  };
  // 앱 안 브라우저(인스타 · 카톡 등에서 링크를 누르면 뜨는 창): 구글 로그인이 막혀 있다. 주소에 ?inapp=1 을 붙여도 그 모습을 볼 수 있다
  const IN_APP = LB_QUERY.get('inapp') === '1' || /Instagram|KAKAOTALK|FBAN|FBAV|Line\/|NAVER\(inapp|; wv\)/.test(navigator.userAgent || '');
  const UI = {
    board: false,        // 순위표 창이 떠 있는지
    view: null,          // 기기 안에 떠 있는 창: name 이름 정하기 · resume 이어 가기 · inapp 앱 안 브라우저 안내 (없으면 null)
    after: null,         // 이름을 정한 뒤 갈 곳: 'board' = 순위표(왕관으로 열었을 때), null = 게임으로
    metric: 'streak',    // 순위 종류: streak 연승 · react 반응
    period: 'today',     // 기간: today 오늘 · all 전체
    page: 0, goMe: false, // 보고 있는 쪽 · 다음에 그릴 때 내 순위가 있는 쪽으로 갈지
    status: 'idle',      // idle · loading 불러오는 중 · ok · fail 연결 안 됨
    data: null, cache: {}, seq: 0, tick: 0,
    gate: 0,             // 기기 안 창을 여닫을 때마다 올라가는 번호(닫았다 다시 연 창에 옛 대답이 끼어들지 않게)
    gen: 0,              // 받아 둔 순위표를 버릴 때마다 올라가는 번호(버리기 전에 떠난 요청의 대답을 다시 넣지 않으려고)
    msg: '', busy: false, copied: false, askTimer: 0,
  };
  // 순위표에 올라가는 연승: 이름이 있는 상태로 거둔 첫 승부터 센다.
  // lbRun = { ticket 번호표, base 그 첫 승 직전의 화면 연승, id 누구의 연승인지 } — 올리는 연승 = 화면 연승 − base
  const RUN_KEY = LB_PREFIX + 'run';
  let lbRun = null;
  const lbReports = [];    // 아직 대답이 안 온 판 끝 보고들
  const CACHE_MS = 30000;  // 받아 둔 순위표를 다시 쓰는 시간(30초)
  let lbPerPage = 1, lbPages = 1, lbRowsNow = [], lbPlan = null;
  const LB_PER_PAGE = 10;  // 순위표 한 쪽의 줄 수
  // 프로필 화면(기기 밖, 창 전체를 덮는 넓은 화면)
  const PG = {
    open: false,
    mode: null,     // 펼쳐 둔 곳: rename 이름 바꾸기 · code 이어하기 코드 · inapp 앱 안 브라우저 안내(없으면 null)
    msg: '', busy: false,
    recs: null,     // 결투 내 기록과 순위 { streak, react, ok } — 불러오는 중이면 null
    gen: 0,         // 여닫을 때마다 올라가는 번호(닫은 뒤에 온 늦은 대답을 버리려고)
  };
  const overlayOpen = () => UI.board || UI.view !== null || PG.open;
  function lbFrozen() {
    const a = document.activeElement;
    return !!(a && a.tagName === 'INPUT' && (lb.panel.contains(a) || lb.page.contains(a)));
  }

  /* ---------- 점 글씨 재료 ---------- */
  const LB_BIG = Object.assign({}, GLYPHS, {
    ',': ['..', '..', '..', '..', '..', '.#', '#.'],
    '-': ['...', '...', '...', '###', '...', '...', '...'],
    '?': ['.###.', '#...#', '....#', '...#.', '..#..', '.....', '..#..'],
    '/': ['....#', '....#', '...#.', '..#..', '.#...', '#....', '#....'],
    '▶': ['#....', '##...', '###..', '####.', '###..', '##...', '#....'],
    '▼': ['.......', '.......', '#######', '.#####.', '..###..', '...#...', '.......'],
  });
  const LB_SMALL = Object.assign({}, SMALL, {
    ',': ['..', '..', '..', '.#', '#.'],
    '/': ['..#', '..#', '.#.', '#..', '#..'],
    ' ': ['.', '.', '.', '.', '.'],
    '?': ['###', '..#', '.#.', '...', '.#.'],
    '▶': ['#..', '##.', '###', '##.', '#..'],
    '▼': ['.....', '#####', '.###.', '..#..', '.....'],
  });
  // 글자 그림 = { w, h, cells: [[x, y], …] }
  function dotBmp(keys, font, k) {
    k = k || 1;
    const cells = []; let x = 0, h = 0;
    keys.forEach((key, n) => {
      const gl = font[key] || font['?'];
      if (n) x += 1;
      gl.forEach((row, j) => {
        for (let i = 0; i < row.length; i += 1) {
          if (row[i] !== '#') continue;
          for (let dy = 0; dy < k; dy += 1) for (let dx = 0; dx < k; dx += 1) cells.push([(x + i) * k + dx, j * k + dy]);
        }
      });
      x += gl[0].length; h = Math.max(h, gl.length);
    });
    return { w: x * k, h: h * k, cells };
  }
  // 한글 점 글꼴: 숨은 작은 종이에 12점 크기로 쓴 뒤, 점마다 「켜짐 / 꺼짐」으로 딱 잘라 칸으로 옮긴다(흐린 회색 없음)
  const HAN_FONT = '12px Galmuri11, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif';
  const SC_W = 240, SC_H = 30, SC_BASE = 20;
  const scratch = document.createElement('canvas');
  scratch.width = SC_W; scratch.height = SC_H;
  const sctx = scratch.getContext('2d', { willReadFrequently: true });
  let fontState = 'loading';   // loading → ok(갈무리를 불러옴) / fallback(못 불러와 기기 글꼴)
  let hanTop = 9, hanH = 12, hanBase = 11;
  const hanCache = new Map();
  function raster(text) {
    sctx.clearRect(0, 0, SC_W, SC_H);
    sctx.font = HAN_FONT; sctx.textBaseline = 'alphabetic'; sctx.fillStyle = '#ffffff';
    sctx.fillText(text, 2, SC_BASE);
    const d = sctx.getImageData(0, 0, SC_W, SC_H).data;
    const px = []; let l = SC_W, r = -1, t = SC_H, b = -1;
    for (let y = 0; y < SC_H; y += 1) {
      for (let x = 0; x < SC_W; x += 1) {
        if (d[(y * SC_W + x) * 4 + 3] < 120) continue;
        px.push([x, y]);
        if (x < l) l = x;
        if (x > r) r = x;
        if (y < t) t = y;
        if (y > b) b = y;
      }
    }
    return { px, l, r, t, b };
  }
  function hanMetrics() {
    hanCache.clear();
    const all = raster('가힣뷁Agjy0'), han = raster('가힣뷁');
    if (all.b < 0 || han.b < 0) { hanTop = 9; hanH = 12; hanBase = 11; return; }
    hanTop = all.t; hanH = all.b - all.t + 1; hanBase = han.b - all.t + 1;
  }
  function hanBmp(text) {
    if (hanCache.has(text)) return hanCache.get(text);
    const r = raster(text);
    const cells = r.b < 0 ? [] : r.px.filter((p) => p[1] >= hanTop && p[1] < hanTop + hanH).map((p) => [p[0] - r.l, p[1] - hanTop]);
    const bmp = { w: r.b < 0 ? 0 : r.r - r.l + 1, h: hanH, cells };
    hanCache.set(text, bmp);
    return bmp;
  }
  // 숫자를 이름 줄에 나란히 놓을 때: 한글 바닥에 숫자 바닥을 맞춘다
  const numY = (bmp) => Math.max(0, Math.min(hanBase, hanH) - bmp.h);

  /* ---------- 순위표 창 그리기(128칸 × 창 높이, 검은 화면과 같은 칸 크기) ---------- */
  const sheetCv = document.createElement('canvas');
  const sc = sheetCv.getContext('2d');
  let SH = ROWS, sInk = null, sMarks = [], sHits = [];
  function sDot(x, y, color) {
    if (x < 0 || x >= W || y < 0 || y >= SH) return;
    if (color !== sInk) { sc.fillStyle = color; sInk = color; }
    sc.fillRect(x, y, 1, 1);
  }
  function sBox(x, y, w, h, color) { sc.fillStyle = color; sInk = color; sc.fillRect(x, y, w, h); }
  function sPut(bmp, x, y, color) { color = color || INK; bmp.cells.forEach((p) => sDot(x + p[0], y + p[1], color)); }
  const sMark = (id, kind, x, y, w, h) => sMarks.push({ id, kind, x, y, w, h });
  const sHit = (id, x, y, w, h) => sHits.push({ id, x, y, w, h });

  // 한 줄 = [순위] [이름] ……… [기록]. 양끝 2칸 · 틈 2칸. 내 줄은 뒤집힌 색(흰 바탕 검은 글씨).
  // 128칸에 안 들어가면 차례로 줄인다: 순위 숫자를 작게 → 기록 숫자도 작게 → 이름 뒤를 자르고 점 셋
  const LB_PAD = 2, LB_GAPX = 2, ELL_W = 5;
  const LB_LEVELS = [['big', 'big'], ['small', 'big'], ['small', 'small']];
  function planRows(list) {
    const num = (text, size) => dotBmp(Array.from(text), size === 'big' ? LB_BIG : LB_SMALL);
    let plan = null;
    for (let lv = 0; lv < LB_LEVELS.length; lv += 1) {
      const items = list.map((e) => ({ e, rank: num(String(e.rank), LB_LEVELS[lv][0]), score: num(e.score, LB_LEVELS[lv][1]), name: hanBmp(e.name), cut: 0 }));
      const rankW = items.reduce((m, i) => Math.max(m, i.rank.w), 0);
      const nameX = LB_PAD + rankW + LB_GAPX;
      const fits = items.every((i) => nameX + i.name.w + LB_GAPX + i.score.w + LB_PAD <= W);
      plan = { lv, items, rankW, nameX, fits };
      if (fits) break;
    }
    if (!plan.fits) {
      const ellY = Math.min(hanBase, hanH) - 1;
      plan.items.forEach((it) => {
        const avail = W - LB_PAD - it.score.w - LB_GAPX - plan.nameX;
        if (it.name.w <= avail) return;
        const chars = Array.from(it.e.name);
        let b = it.name;
        while (chars.length > 1 && b.w + 1 + ELL_W > avail) { chars.pop(); b = hanBmp(chars.join('')); }
        const x0 = b.w + 1;
        it.name = { w: x0 + ELL_W, h: b.h, cells: b.cells.concat([[x0, ellY], [x0 + 2, ellY], [x0 + 4, ellY]]) };
        it.cut = chars.length;
      });
    }
    return plan;
  }
  function drawRows(list, y0, pitch, pad) {
    const plan = planRows(list), lh = hanH;
    let y = y0;
    plan.items.forEach((it, n) => {
      if (n) y += pitch - lh;
      const col = it.e.me ? BG : INK;
      if (it.e.me) {
        sBox(0, y - pad, W, lh + 2 * pad, INK);
        sMark('row-' + it.e.rank, 'row', 0, y - pad, W, lh + 2 * pad);
      } else sMark('row-' + it.e.rank, 'row', LB_PAD, y, W - 2 * LB_PAD, lh);
      sPut(it.rank, LB_PAD + plan.rankW - it.rank.w, y + numY(it.rank), col);
      sPut(it.name, plan.nameX, y, col);
      sPut(it.score, W - LB_PAD - it.score.w, y + numY(it.score), col);
      y += lh;
    });
    lbPlan = { level: plan.lv, fits: plan.fits, cut: plan.items.filter((i) => i.cut).map((i) => i.e.name) };
  }
  function lbTab(on, id, text, x) {
    const b = hanBmp(text), bw = b.w + 4, lh = hanH;
    if (on) { sBox(x, 1, bw, lh + 2, INK); sPut(b, x + 2, 2, BG); } else sPut(b, x + 2, 2, INK);
    sMark(id, 'text', x, 1, bw, lh + 2);
    sHit(id, x - 1, 0, bw + 1, lh + 5);
    return bw;
  }
  function drawSheet() {
    sMarks = []; sHits = []; lbRowsNow = []; lbPlan = null;
    sBox(0, 0, W, SH, BG);
    const lh = hanH, hh = lh + 3;
    // 머리 줄: 왼쪽 = 오늘 / 전체, 오른쪽 = 연승 / 반응 · × 닫기. 고른 탭이 뒤집힌 색
    let x = 2;
    [['today', '오늘'], ['all', '전체']].forEach((t) => { x += lbTab(UI.period === t[0], 'tab-' + t[0], t[1], x) + 1; });
    let rx = W - LB_PAD;
    const xb = dotBmp(['×'], LB_BIG), xy = 1 + Math.floor((lh + 2 - 7) / 2);
    sPut(xb, rx - xb.w, xy);
    sMark('close', 'art', rx - xb.w, xy, xb.w, 7);
    sHit('close', rx - xb.w - 3, 0, xb.w + 5, hh + 2);
    rx -= xb.w + 5;
    [['react', '반응'], ['streak', '연승']].forEach((t) => {
      const bw = hanBmp(t[1]).w + 4;
      lbTab(UI.metric === t[0], 'met-' + t[0], t[1], rx - bw);
      rx -= bw + 1;
    });
    sBox(0, hh, W, 1, INK);

    // 바닥 줄(「내 순위로 · 쪽 넘김」, 큰 숫자) 위가 순위 줄. 한 쪽 = 열 줄(창이 아주 낮으면 들어가는 만큼).
    // 줄 사이는 창 높이에 맞춰 고르게(글자 높이 + 1 ~ + 6칸), 남는 높이는 위아래로 반씩.
    // 창이 낮아 틈을 한 칸씩 둘 수 없으면 틈 없이 글자 높이만큼씩 놓는다(그때는 내 줄 상자도 위아래로 넓히지 않는다 — pad 0)
    const FOOT_H = 12, footY = SH - FOOT_H;
    const top = hh + 2, bottom = footY - 2, area = bottom - top + 1;
    lbPerPage = Math.max(1, Math.min(LB_PER_PAGE, Math.floor(area / lh)));
    let pitch = lbPerPage > 1 ? Math.min(lh + 6, Math.floor((area - 2 - lh) / (lbPerPage - 1))) : lh + 1;
    const pad = pitch > lh ? 1 : 0;
    if (!pad) pitch = lh;
    const rowY0 = top + Math.max(pad, Math.floor((area - ((lbPerPage - 1) * pitch + lh)) / 2));
    const midY = Math.floor((top + bottom) / 2);
    if (UI.status === 'loading' || UI.status === 'idle') {
      // 불러오는 중: 가운데 네모 셋이 차례로 켜진다
      const x0 = Math.floor(W / 2) - 10, on = UI.tick % 4;
      [0, 1, 2].forEach((n) => { if (n < on) sBox(x0 + n * 8, midY - 2, 4, 4, INK); else sBox(x0 + n * 8 + 1, midY - 1, 2, 2, INK); });
      sMark('loading', 'art', x0, midY - 2, 20, 4);
    } else if (UI.status === 'fail' || !UI.data) {
      // 연결 안 됨: 큰 가위표 + 한 마디. 누르면 다시 불러온다
      const big = dotBmp(['×'], LB_BIG, 2), word = hanBmp('연결 안 됨');
      const y = midY - Math.floor((big.h + 4 + word.h) / 2);
      sPut(big, Math.floor((W - big.w) / 2), y);
      sPut(word, Math.floor((W - word.w) / 2), y + big.h + 4);
      sMark('fail-x', 'art', Math.floor((W - big.w) / 2), y, big.w, big.h);
      sMark('fail-word', 'text', Math.floor((W - word.w) / 2), y + big.h + 4, word.w, word.h);
      sHit('retry', 0, y - 6, W, big.h + word.h + 16);
    } else {
      const d = UI.data;
      lbPages = Math.max(1, Math.ceil(d.total / lbPerPage));
      if (UI.goMe) { UI.page = d.me ? Math.floor((d.me.rank - 1) / lbPerPage) : 0; UI.goMe = false; }
      if (UI.page >= lbPages) UI.page = lbPages - 1;
      if (UI.page < 0) UI.page = 0;
      lbRowsNow = d.rows.slice(UI.page * lbPerPage, (UI.page + 1) * lbPerPage);
      drawRows(lbRowsNow, rowY0, pitch, pad);
      // 바닥 줄: 왼쪽 = 내 순위가 있는 쪽으로(▼ + 내 순위), 오른쪽 = 쪽 번호 + 다음 쪽(▶)
      sBox(0, footY, W, 1, INK);
      const fy = footY + 3;
      const meB = dotBmp(['▼'].concat(d.me ? Array.from(String(d.me.rank)) : ['-']), LB_BIG);
      sPut(meB, LB_PAD, fy); sMark('foot-me', 'text', LB_PAD, fy, meB.w, 7);
      const pgB = dotBmp(Array.from(String(UI.page + 1) + '/' + String(lbPages)).concat([' ', '▶']), LB_BIG);
      sPut(pgB, W - LB_PAD - pgB.w, fy); sMark('foot-page', 'text', W - LB_PAD - pgB.w, fy, pgB.w, 7);
      sHit('me', 0, footY + 1, Math.floor(W / 2), FOOT_H - 1);
      sHit('next', Math.floor(W / 2), footY + 1, W - Math.floor(W / 2), FOOT_H - 1);
    }
    const out = lb.sheet.getContext('2d');
    out.imageSmoothingEnabled = false;
    out.drawImage(sheetCv, 0, 0, lb.sheet.width, lb.sheet.height);
  }
  // 창 자리 맞추기(기기 자리를 맞출 때마다 불린다)
  function lbFit(left, top, wCss, hCss, cellPx, r) {
    const rows = Math.max(ROWS, Math.ceil((hCss * r) / cellPx - 0.001));
    if (SH !== rows || sheetCv.width !== W || sheetCv.height !== rows) { SH = rows; sheetCv.width = W; sheetCv.height = rows; }
    if (lb.sheet.width !== W * cellPx || lb.sheet.height !== rows * cellPx) { lb.sheet.width = W * cellPx; lb.sheet.height = rows * cellPx; }
    const h = (rows * cellPx) / r;
    lb.sheet.style.width = wCss + 'px'; lb.sheet.style.height = h + 'px';
    [lb.sheetWrap, lb.panelWrap].forEach((node) => {
      node.style.left = left + 'px'; node.style.top = top + 'px'; node.style.width = wCss + 'px'; node.style.height = h + 'px';
      node.style.setProperty('--u', (cellPx / r) + 'px');
    });
    if (UI.board) drawSheet();
  }
  // 위 띠의 왕관 버튼: 창이 떠 있는 동안은 눌린 색(검은 바탕 흰 왕관)
  function drawCrownBtn() {
    const open = overlayOpen();
    drawOneBox(lb.crownCanvas, (ctx, bx, by, cc) => {
      if (open) { ctx.fillStyle = BG; ctx.fillRect(bx - cc, by, (BOX_W + 2) * cc, BOX_H * cc); }
      stamp(ctx, GLYPHS['♛'], bx, by + cc, cc, open ? INK : BG);
    });
    setGhost(lb.crownLabel, open ? '순위표 닫기' : '순위표 열기');
  }

  /* ---------- 순위표 불러오기 · 넘기기 ---------- */
  const cacheKey = () => UI.metric + '|' + UI.period;
  const clearCache = () => { UI.cache = {}; UI.gen += 1; };
  // 아직 대답이 안 온 판 끝 보고가 모두 끝날 때까지 기다리는 약속
  const reportsDone = () => Promise.all(lbReports.slice());
  // 순위표 한 장 불러오기. 부를 때마다 요청 번호(seq)를 올려서, 앞서 떠난 요청의 늦은 대답이 지금 화면을 덮지 못하게 한다.
  // 받아 둔 것이 30초 안의 것이고(한국 날짜도 그대로) 아직 안 끝난 보고가 없으면 그것을 바로 쓴다
  function loadBoard(goMe) {
    UI.goMe = !!goMe;
    if (!goMe) UI.page = 0;
    UI.seq += 1;
    const seq = UI.seq, gen = UI.gen, key = cacheKey(), metric = UI.metric, period = UI.period;
    const hit = UI.cache[key];
    if (hit && !lbReports.length && Date.now() - hit.at < CACHE_MS && hit.day === Board.today()) {
      UI.data = hit.d; UI.status = 'ok'; drawSheet();
      return;
    }
    UI.status = 'loading'; UI.data = null;
    drawSheet();
    const mine = () => seq === UI.seq && UI.board && key === cacheKey();
    // 방금 이긴 판의 보고가 아직 가는 중이면 그것부터 기다린다(내 새 기록이 빠진 순위표를 받지 않게)
    reportsDone().then(() => Board.read(metric, period)).then((d) => {
      const right = !!d && d.metric === metric && d.period === period;   // 대답이 고른 탭의 것인지
      if (right && gen === UI.gen) UI.cache[key] = { d, at: Date.now(), day: Board.today() };
      if (!mine()) return;       // 그 사이 다른 탭을 눌렀거나 창을 닫았으면 늦게 온 대답은 화면에 쓰지 않는다
      if (!right) { UI.status = 'fail'; drawSheet(); return; }
      UI.data = d; UI.status = 'ok';
      drawSheet();
    }, () => {
      if (!mine()) return;
      UI.status = 'fail';
      drawSheet();
    });
  }
  // 판 끝 보고 보내기: 대답을 기다리지 않는다. 대답이 오면 받아 둔 순위표를 버리고, 순위표가 열려 있으면 지금 탭을 다시 불러온다
  function sendReport(ticket, counted, ms) {
    let p = null;
    p = Board.endRound(ticket, { streak: counted, reactMs: ms }).then((r) => r, () => null).then((r) => {
      const i = lbReports.indexOf(p);
      if (i >= 0) lbReports.splice(i, 1);
      if (!(r && r.ok)) return;
      clearCache();
      if (UI.board && UI.view === null && UI.status !== 'loading') loadBoard(true);
    });
    lbReports.push(p);
  }
  function saveRun() {
    if (!lbRun) { clearKey(RUN_KEY); return; }
    saveRaw(RUN_KEY, JSON.stringify({ base: lbRun.base, id: lbRun.id, age: Board.age(lbRun.ticket) }));
  }
  // 새로 고침 뒤: 적어 둔 번호표가 지금 이름 · 지금 연승과 맞으면 이어 쓴다. 아니면 다음 첫 승부터 새로 센다
  (() => {
    try {
      const v = JSON.parse(loadRaw(RUN_KEY)), me = Board.me();

  }

  // 검사용 「한 번 눌렀다 뗀 것」: 오른쪽 키캡이 잠깐 눌린 그림이 된다(소리 없음)

  // (이름 창 · 프로필 화면 안은 예외: 진짜 버튼과 입력칸이라 눌리고 글자가 쳐지고 굴려져야 한다)

        streakY: STREAK_Y,                   // 「N연승」 위 끝(칸)
        // 아래는 모두 화면 칸 자리 { x, y, w, h }
        streakBox: (() => { const b = streakBoxNow(); return { x: b.x, y: b.y, w: b.w, h: b.h }; })(), // 왼쪽 위 큰 「N연승」
        markBox: (() => { const b = markBoxNow(); return b ? { skull: b.skull, word: b.word, k: b.k } : null; })(), // 진 화면 해골 · 「반칙」(반칙이 아니면 word = null, 진 화면이 아니면 null)
        bestLineBox: (() => { const b = bestLineBoxNow(); return b ? { x: b.x, y: b.y, w: b.w, h: b.h } : null; })(), // 진 화면 「최고 N연승」 줄(없으면 null)
        sunBox: { x: SUN_X, y: SUN_Y + skyShift, w: SUN[0].length, h: SUN.length },                    // 오른쪽 위 해
        peopleTop: GROUND_Y + skyShift - STAND.length, // 두 사람 그림의 위 끝 줄
        aria: el.screen.getAttribute('aria-label'),    // 읽어 주는 글
        lb: lbState(),                                 // 순위표 쪽 상태(이름 · 창 · 순위표 줄 등)
      };
    },
    // 순위표 쪽 손잡이: 왕관 버튼 · 순위표 창의 누를 곳 · 이름 창의 버튼을 누른 것과 같은 일
    crown() { crownPress(); return lbState(); },
    // 기기 밖 이름 버튼 · 프로필 화면 안 버튼을 누른 것과 같은 일
    me() { mePress(); return lbState(); },
    pageAct(id) { pageAct(String(id)); return lbState(); },
    // 가짜 문지기의 대답을 일부러 늦춘다(1/1000초, null이면 평소 0.3~0.6초) — 대답이 늦어도 게임이 안 밀리는지 볼 때
    setBoardDelay(ms) { Board.setDelay(ms); return true; },
    // 왕관을 「지금보다 ms 뒤」에 누른 것으로 친다: 시간은 흘렀는데 화면이 아직 못 따라온 순간을 흉내 낸다
    crownAt(ms) { crownPress(now() + Math.max(0, Number(ms) || 0)); return this.state(); },
    // 받아 둔 순위표를 ms만큼 오래된 것으로 만든다(30초 유효 시간을 기다리지 않고 보려고)
    ageCache(ms) { Object.keys(UI.cache).forEach((k) => { UI.cache[k].at -= Number(ms) || 0; }); return Object.keys(UI.cache); },
    failNextRead(n) { Board.failNextRead(n); return true; },   // 다음 순위 읽기 n번을 실패시킨다
    // 판 끝 보고 하나를 지금 보낸다(순위표를 연 채 보고가 끝나는 경우를 보려고): 연승 counted · 반응 ms
    lateReport(counted, ms) { sendReport(Board.resumeRun((Number(counted) || 1) * 1500), Number(counted) || 1, Number(ms) || 0); return lbReports.length; },
    sheetAct(id) { sheetAct(String(id)); return lbState(); },
    panelAct(id) { panelAct(String(id)); return lbState(); },
    // 이름 검사 결과만 본다(만들지는 않음): 길이 · 글자 · 금지 단어 · 같은 이름
    checkName(name) { const c = Board.checkName(name); return c.ok && Board.isTaken(c.name) ? { ok: false, why: 'taken' } : { ok: c.ok, why: c.why }; },
    // 가짜 문지기의 순위표를 기다리지 않고 바로 읽는다: 사람 수 · 내 줄 · 위 3명 · 내 줄의 위아래
    peekBoard(metric, period) {
      const d = Board.peek(metric, period), i = d.me ? d.me.rank - 1 : -1;
      return { total: d.total, me: d.me, top: d.rows.slice(0, 3), above: i > 0 ? d.rows[i - 1] : null, below: i >= 0 && i + 1 < d.rows.length ? d.rows[i + 1] : null };
    },
    skull() { return SKULL.slice(); },                 // 해골 그림 줄들(그림을 갈아 끼워도 검사가 따라가게)
    press() { pressAt(now()); return this.state(); },
    keyPress() { return holdKey('push', 'test', now()); }, // 이미 눌려 있으면 false(쏘지 않음)
    keyRelease() { return releaseKey('push'); },
    // 왼쪽 키(다음 판 / 새 판): 누르고 떼기까지. 다른 키가 눌려 있으면 false
    restartKey() { const ok = holdKey('slide', 'test', now()); releaseKey('slide'); return ok; },
    setSkin(n) { return setSkin(n); },
    nextSkin() { nextSkin(); return skin; },
    // 소리 고르기(0 = 끔, 1~6). 들려주지는 않는다
    setSound(i) { const v = keepRealSound(() => KeySound.set(i)); drawSoundBtn(); return v; },
    gameUrl(id) { return gameUrl(id); },               // 그 번호 게임으로 갈 주소(가지는 않음)
    gameIndexAt(x) { return gameIndexAt(Number(x)); }, // 게임 버튼 안 가로 위치(화면 점) → 칸 번호(0부터)
    // 앞으로의 대결에서 신호까지 시간을 고정(null이면 다시 무작위)
    setWait(ms) {
      fixedWait = ms === null || ms === undefined ? null : toInt(ms);
      return this.state();
    },
    // 연승을 n으로(상대 속도도 그에 맞게). 최고 연승보다 크면 최고 연승도 올린다
    setStreak(n) {
      streak = toInt(n);
      if (streak > best) best = streak;
      if (phase !== 'result') duelOpp = oppFor(streak);
      saveRecords(); syncText(); render();
      return this.state();
    },
    reset() {
      streak = 0; best = 0; bestMs = null; endedStreak = 0;
      phase = 'ready'; waitMs = null; myMs = null; outcome = null; shotMs = null; autoLoseFrom = null;
      duelOpp = oppFor(0);
      Object.values(KEYS).forEach(clearKey);
      syncText(); render();
      return this.state();
    },
    // 손으로 돌리는 시계: 처음 부르면 지금 시계 값에서 이어 받아 멈춰 두고, 부를 때마다 ms만큼 돌린다.
    // 그 사이 신호 · 상대가 쏘기는 정해진 시각 그대로 차례로 처리된다
    tick(ms) {
      if (manual === null) {
        manual = now();
        if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      }
      manual += Math.max(0, Number(ms) || 0);
      advanceTo(manual);
      render();
      return this.state();
    },
    // 실제 시계로 되돌리기: 시간이 끊기지 않게 지금 값에서 이어 흐른다
    realClock() {
      if (manual !== null) {
        offset = manual - performance.now();
        manual = null;
      }
      render(); startLoop();
      return this.state();
    },
  };
})();
</script>
