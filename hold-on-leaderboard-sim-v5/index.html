  // 키캡 · 키보드로 첫 방문 창을 닫을 때의 반응: 그 키캡의 딸깍 소리를 내고 눌린 그림을 잠깐(90ms) 보여 준다.
  // 게임 입력에는 넣지 않는다(쏘기도 다음 판도 아니다) — 「눌렸다」는 것만 알려 주어, 안 먹은 줄 알고 한 번 더 누르지 않게 한다.
  // name = 'push'(오른쪽 쏘기 키캡) 또는 'slide'(왼쪽 RE 키캡). 소리를 꺼 둔 상태면 소리는 안 난다(소리 덩어리가 알아서 거른다)
  const KEY_FX_MS = 90;
  const keyFx = { count: 0, last: null, downs: 0, ups: 0, ms: null, pressedShown: null };   // 검사용 기록
  let keyFxTimer = 0;
  function keycapFx(name) {
    const cv = name === 'slide' ? el.keySlideCanvas : el.keyPushCanvas, t0 = performance.now();
    keyFx.count += 1; keyFx.last = name; keyFx.ms = null;
    KeySound.unlock(); KeySound.down(); keyFx.downs += 1;
    const before = cv.toDataURL();
    paintKey(cv, true, name === 'slide' ? 'RE' : 'gun');
    keyFx.pressedShown = cv.toDataURL() !== before;   // 눌린 그림이 평소 그림과 다르게 그려졌는지
    clearTimeout(keyFxTimer);
    keyFxTimer = setTimeout(() => { KeySound.up(); keyFx.ups += 1; drawKeys(); keyFx.ms = Math.round(performance.now() - t0); }, KEY_FX_MS);
  }
  // 계정 창 안 버튼
  lb.acCard.addEventListener('click', (e) => {
    const b = e.target.closest ? e.target.closest('button') : null;
    if (b && !b.disabled) acctAct(b.id);
  });
  // 창 밖(보이지 않는 막)을 누름:
  //   위 띠의 버튼 셋 · 윗줄 두 버튼 자리 = 아무 일 없음(창이 떠 있는 동안에는 안 눌린다)
  //   키캡 자리 = 첫 방문 창이면 닫고 첫 결투를 시작(그 누름은 게임에 들어가지 않는다), 평소 계정 창이면 아무 일 없음
  //   그 밖(몸통의 빈 곳 · 게임기 밖) = 닫기
  // 대답을 기다리는 중에는 Esc처럼 닫지 않는다
  lb.acWrap.addEventListener('pointerdown', (e) => {
    if (e.target !== lb.acWrap) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    if (UI.busy) return;
    const on = (node) => { const b = node.getBoundingClientRect(); return e.clientX >= b.left && e.clientX <= b.right && e.clientY >= b.top && e.clientY <= b.bottom; };
    if ([el.gameBtn, el.soundBtn, el.skinBtn, lb.meBtn, lb.rankBtn].some(on)) return;
    const key = on(el.keyPush) ? 'push' : on(el.keySlide) ? 'slide' : null;
    if (key && !UI.first) return;
    closeAll();
    if (key) keycapFx(key);   // 닫은 뒤에 그린다(닫을 때 키캡을 다시 그리므로)
  });
  lb.acCard.addEventListener('input', (e) => { if (!e.isComposing && e.target.tagName === 'INPUT') trimInput(e.target); });
  lb.acCard.addEventListener('compositionend', (e) => { if (e.target.tagName === 'INPUT') trimInput(e.target); });
  lb.acCard.addEventListener('focusout', () => setTimeout(() => { if (!lbFrozen()) fit(); }, 80));

  /* ---------- 처음 온 사람: 문지기가 이름을 지어 준다 ----------
     이름이 없으면 열자마자 자동 이름을 받는다(받는 동안 윗줄 이름 자리는 「…」). 연결이 없으면 못 받고, 게임은 그대로 된다 */
  function askName() {
    if (Board.me() || UI.naming) return;
    UI.naming = true;
    syncUi();
    Board.autoName().then((r) => r, () => null).then((r) => {
      UI.naming = false;
      if (r && r.ok) clearCache();
      syncUi();
    });
  }
  // 못 받았으면(연결이 끊겼거나 문지기가 못 지었으면) 다시 받아 보는 때: 판이 끝날 때 · 순위 화면이나 계정 창을 열 때 · 계정 창의 「다시」

  /* ---------- 판이 끝날 때 ----------
     이긴 판: 번호표(이름을 받은 뒤 거둔 첫 승 때 받은 것)와 함께 「그 첫 승부터 센 연승 · 이번 반응 시간」을 문지기에 올린다.
     이름을 받기 전에 쌓은 연승은 세지 않는다(화면의 연승 숫자는 그대로 이어진다). 지거나 반칙이면 올릴 것이 없다.
     이름이 아직 없으면 그 판은 올리지 않고 이름을 다시 받아 본다 — 받은 뒤의 첫 승부터 1연승으로 올라간다 */
  function lbAfterRound() {
    askName();
    const who = outcome === 'win' ? Board.me() : null;
    if (who) {
      if (!lbRun || lbRun.id !== who.id || streak <= lbRun.base) lbRun = { ticket: Board.startRun(), base: streak - 1, id: who.id };
      sendReport(lbRun.ticket, streak - lbRun.base, myMs);
    } else lbRun = null;
    saveRun();
  }

  /* ---------- 점 글꼴 불러오기: 못 불러오면 기기 글꼴로 나온다. 글꼴이 오면 글 폭이 달라지므로 윗줄 자리를 다시 잡는다 ---------- */
  function fontDone(ok) {
    if (fontState === 'ok' || (fontState === 'fallback' && !ok)) return;
    fontState = ok ? 'ok' : 'fallback';
    fit();
  }
  try {
    const fontTimer = setTimeout(() => fontDone(false), 5000);
    document.fonts.load('12px Galmuri11', '가A1').then((list) => {
      clearTimeout(fontTimer);
      fontDone(!!list && list.length > 0 && list.every((f) => f.status === 'loaded'));
    }, () => { clearTimeout(fontTimer); fontDone(false); });
  } catch (e) { fontDone(false); }

  // 검사용: 순위표 쪽 지금 상태
  function lbState() {
    const rect = (node) => { const b = node.getBoundingClientRect(); return { x: b.left, y: b.top, w: b.width, h: b.height }; };
    const me = Board.me();
    const all = (sel) => Array.prototype.slice.call(lb.page.querySelectorAll(sel));
    const rowOf = (e) => (e ? { rank: Number(e.getAttribute('data-rank')), name: e.children[1].textContent, score: e.children[2].textContent, me: e.classList.contains('me'), rect: rect(e) } : null);
    const rk = all('.pg-rk'), tabs = lb.page.querySelector('#pgTabs');
    return {
      name: me ? me.name : null, google: me ? me.google : false, naming: UI.naming,
      offline: Board.offline, inapp: IN_APP,
      filter: Board.filterReady(), words: Board.wordCount(), fontState,
      open: UI.open, tab: UI.tab, acct: UI.acct, first: UI.first, seen: loadRaw(SEEN_KEY) === '1', mode: UI.mode, status: UI.status, metric: UI.metric, period: UI.period, shown: UI.shown,
      msg: UI.msg, busy: UI.busy, recs: UI.recs, peek: UI.peek,
      me: UI.data && UI.data.me ? UI.data.me : null, total: UI.data ? UI.data.total : null,
      dataKey: UI.data ? UI.data.metric + '|' + UI.data.period : null,   // 지금 그려진 순위표가 어느 묶음의 것인지
      pendingReports: lbReports.length, counted: lbRun ? streak - lbRun.base : 0,
      // 받아 둔 순위표마다 받은 지 얼마나 됐는지(1/1000초)
      cacheAge: Object.keys(UI.cache).reduce((o, k) => { o[k] = Date.now() - UI.cache[k].at; return o; }, {}),
      // 기기 밖 윗줄: 이름 버튼 · 순위 맛보기 버튼
      top: {
        meText: lb.meText.textContent, rankText: lb.rankText.textContent, me: rect(lb.meBtn), rank: rect(lb.rankBtn),
        meHidden: getComputedStyle(lb.meBtn).visibility === 'hidden', side: lb.top.classList.contains('side'), placed: mePlaced,
        fontPx: parseFloat(getComputedStyle(lb.rankBtn).fontSize),
        meCut: lb.meText.scrollWidth > lb.meText.clientWidth + 1,   // 이름 뒤가 「…」로 줄었는지
        // 안쪽 선(위 띠 버튼의 양 끝)과 윗줄의 그림 왼쪽 끝 · 글씨 오른쪽 끝, 테두리 굵기, 누를 자리 높이
        dpr: dpr(), m: topM,
        lineL: el.gameBtn.getBoundingClientRect().left, lineR: el.skinBtn.getBoundingClientRect().right,
        iconL: lb.meBtn.querySelector('svg').getBoundingClientRect().left, textR: lb.rankText.getBoundingClientRect().right,
        border: [lb.meBtn, lb.rankBtn].map((b) => parseFloat(getComputedStyle(b).borderTopWidth) + parseFloat(getComputedStyle(b).borderLeftWidth)),
        hitH: [lb.meBtn, lb.rankBtn].map((b) => parseFloat(getComputedStyle(b, '::before').height)),
        label: lb.rankBtn.getAttribute('aria-label'),
      },
      // 계정 창(카드): 보이는지 · 글 · 카드와 어두운 바탕의 자리 · 카드 안에서 가로로 넘치거나 글이 잘린 곳 · 안의 버튼 · 글 줄들
      acShown: getComputedStyle(lb.acWrap).display !== 'none', acText: lb.acCard.textContent, acRect: rect(lb.acCard), acWrapRect: rect(lb.acWrap),
      keyFx: Object.assign({}, keyFx),
      xHit: (() => { const x = lb.acCard.querySelector('#acX'); if (!x) return null; const c = getComputedStyle(x, '::before'); return [parseFloat(c.width), parseFloat(c.height)]; })(),
      acM, acFontPx: parseFloat(getComputedStyle(lb.acCard).fontSize), acCardBg: getComputedStyle(lb.acCard).backgroundColor,
      acDim: getComputedStyle(lb.acWrap).backgroundColor, acTouch: getComputedStyle(lb.acWrap).touchAction,
      // 카드 안에서 흰 바탕인 것들(누르는 버튼만 흰 바탕이어야 한다)
      acWhite: Array.prototype.filter.call(lb.acCard.querySelectorAll('*'), (e) => getComputedStyle(e).backgroundColor === 'rgb(242, 242, 242)').map((e) => e.id || e.className),
      acWide: lb.acCard.scrollWidth > lb.acCard.clientWidth + 1, acScrolls: lb.acCard.scrollHeight > lb.acCard.clientHeight + 1,
      acClip: Array.prototype.filter.call(lb.acCard.querySelectorAll('p, button:not(.mini):not(.x), .pg-name'), (e) => e.scrollWidth > e.clientWidth + 1 || (e.tagName === 'P' && e.scrollHeight > e.clientHeight + 1)).map((e) => e.textContent),
      acParts: Array.prototype.map.call(lb.acCard.querySelectorAll('button, input, p, .pg-name'), (b) => ({ id: b.id, tag: b.tagName, text: b.textContent, rect: rect(b) })),
      // 순위 화면 · 계정 창 안에 Tab으로 갈 수 있는 것의 수
      focusables: lb.page.querySelectorAll('button, input, a[href], select, textarea, [tabindex]').length + lb.acCard.querySelectorAll('button, input, a[href], select, textarea, [tabindex]').length,
      tabIds: all('#pgTabs button').map((b) => b.id),
      pageShown: getComputedStyle(lb.page).display !== 'none', pageText: lb.page.textContent, pageRect: rect(lb.page),
      pageWide: lb.page.scrollWidth > lb.page.clientWidth + 1, scrollTop: lb.page.scrollTop,
      tabsRect: tabs ? rect(tabs) : null,
      tabsOn: all('#pgTabs button.on').map((b) => b.id),
      labels: all('.pg-grp').map((g) => ({ id: g.id, label: g.querySelector('.pg-lab').textContent, rect: rect(g), opts: Array.prototype.map.call(g.querySelectorAll('button'), (b) => b.textContent), on: Array.prototype.map.call(g.querySelectorAll('button.on'), (b) => b.id) })),
      chips: all('.pg-chip').map((c) => ({ text: c.textContent, on: c.classList.contains('on') })),
      gameName: lb.page.querySelector('#pgGameName') ? lb.page.querySelector('#pgGameName').textContent : null,
      mine: lb.page.querySelector('#pgMine') ? { text: lb.page.querySelector('#pgMine').textContent, has: lb.page.querySelector('#pgMine').classList.contains('has') } : null,
      // 순위 줄: 그려진 줄 수 · 처음 세 줄 · 맨 끝 줄 · 내 줄 · 순위가 차례대로인지
      rowCount: rk.length, rowsHead: rk.slice(0, 3).map(rowOf), rowLast: rowOf(rk[rk.length - 1]), meRow: rowOf(lb.page.querySelector('.pg-rk.me')),
      rowsInOrder: rk.every((e, i) => Number(e.getAttribute('data-rank')) === i + 1),
      scoresOk: rk.every((e) => (UI.data && UI.data.metric === 'react' ? /^0\.\d{3}$/ : /^\d+$/).test(e.children[2].textContent)),
      // 화면 안에서 글이 칸보다 길어 잘린 곳이 있는지(게임 줄의 칸 · 이름 · 탭 · 묶음 · 칩 · 내 줄 카드 · 순위 줄의 칸)
      pageClip: all('.pg-game span, .pg-name, .pg-tabs button, .pg-grp button, .pg-lab, .pg-chip, .pg-gname, .pg-mine').filter((e) => e.scrollWidth > e.clientWidth + 1).map((e) => e.textContent),
      pageParts: all('button, input, .pg-game, .pg-chip, .pg-gname, .pg-lab, .pg-mine').map((b) => ({ id: b.id, text: b.textContent, rect: rect(b) })),
      pageGames: all('.pg-game').map((b) => Array.prototype.map.call(b.children, (c) => c.textContent)),
      simKeys: (() => { try { return Object.keys(localStorage).filter((k) => k.indexOf(LB_PREFIX) === 0).sort(); } catch (e) { return []; } })(),
    };
  }

  if (window.ResizeObserver) new ResizeObserver(fit).observe(el.main);
  // 창 크기는 그대로인데 기기 화면 점 배수만 바뀔 때(창을 다른 모니터로 옮김)도 자리와 글씨 크기를 다시 맞춘다
  (function watchDpr() {
    try {
      const mq = window.matchMedia('(resolution: ' + dpr() + 'dppx)'), on = () => { fit(); watchDpr(); };
      if (mq.addEventListener) mq.addEventListener('change', on, { once: true });
    } catch (e) { /* 못 들으면 창 크기가 바뀔 때만 맞춘다 */ }
  }());
  window.addEventListener('resize', fit);

  /* ---------- 입력: 손가락이 닿는 순간 작동한다 ---------- */
  // 검사용 「한 번 눌렀다 뗀 것」: 오른쪽 키캡이 잠깐 눌린 그림이 된다(소리 없음)
  function pressAt(t) {
    fire(t);
    flashPushKey();
  }
  const mainPointer = (e) => e.pointerType !== 'mouse' || e.button === 0;
  // 위 띠의 작은 버튼들: 게임 누름으로 세지 않는다(아래로 퍼지지 않게 막음), 키캡 소리도 없다
  // 게임 버튼: 누르는 순간 그 번호 게임으로
  el.gameBtn.addEventListener('pointerdown', (e) => {
    if (!mainPointer(e)) return;
    e.preventDefault(); e.stopPropagation();
    // 시뮬레이션은 한 장짜리라 다른 숫자 칸을 눌러도 넘어가지 않는다(그림만 진짜 게임과 같다)
  });
  [[el.soundBtn, nextSound], [el.skinBtn, nextSkin]].forEach(([btn, act]) => {
    btn.addEventListener('pointerdown', (e) => {
      if (!mainPointer(e)) return;
      e.preventDefault(); e.stopPropagation();
      act();
    });
  });
  // 키캡: 누르는 순간 작동(오른쪽 = 쏘기, 왼쪽 = 다음 판). 그 손가락이 떼어지거나, 키 밖으로 미끄러지거나, 화면 밖으로 나가면 뗀 것
  ['push', 'slide'].forEach((name) => {
    keyEl()[name].addEventListener('pointerdown', (e) => {
      if (!mainPointer(e)) return;
      e.preventDefault(); e.stopPropagation();
      // 손가락을 키에 묶어 두지 않아야 키 밖으로 미끄러진 것을 알아챈다
      const t = e.currentTarget;
      try { if (t.hasPointerCapture && t.hasPointerCapture(e.pointerId)) t.releasePointerCapture(e.pointerId); } catch (err) { /* 그대로 */ }
      // 새로 닿은 첫 손가락인데 키가 눌린 채 남아 있으면, 떼는 신호를 놓친 낡은 누름이다 → 조용히 풀고 받는다(키가 먹통이 되지 않게)
      if (e.isPrimary) ['push', 'slide'].forEach((k) => { if (keyHold[k] !== null && keyHold[k] !== e.pointerId) releaseKey(k, undefined, true); });
      holdKey(name, e.pointerId, eventTime(e));
    });
  });
  const insideRect = (node, x, y) => {
    const b = node.getBoundingClientRect();
    return x >= b.left && x <= b.right && y >= b.top && y <= b.bottom;
  };
  window.addEventListener('pointermove', (e) => {
    const nodes = keyEl();
    ['push', 'slide'].forEach((name) => {
      if (keyHold[name] === e.pointerId && !insideRect(nodes[name], e.clientX, e.clientY)) releaseKey(name, e.pointerId);
    });
  });
  ['pointerup', 'pointercancel'].forEach((type) => window.addEventListener(type, (e) => {
    releaseKey('push', e.pointerId); releaseKey('slide', e.pointerId);
  }));
  // 마우스가 창 밖으로 나감(옮겨 간 곳이 없음)
  window.addEventListener('pointerout', (e) => {
    if (e.relatedTarget) return;
    releaseKey('push', e.pointerId); releaseKey('slide', e.pointerId);
  });
  window.addEventListener('blur', releaseAllKeys);
  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter') releaseKey('push', `kb:${e.code}`);
    if (e.code === 'KeyR') releaseKey('slide', 'kb:KeyR');
  });

  window.addEventListener('keydown', (e) => {
    // 창이 떠 있는 동안에는 키보드가 게임으로 넘어가지 않는다(이름에 s를 쳐도 소리가 안 바뀌고, 스페이스를 쳐도 판이 시작되지 않는다)
    if (overlayOpen()) { lbKey(e); return; }
    const plain = !e.metaKey && !e.ctrlKey && !e.altKey;
    // S = 소리 · C = 몸통 색(작은 버튼을 누른 것과 같음)
    const small = { KeyS: nextSound, KeyC: nextSkin }[e.code];
    if (small && plain) {
      e.preventDefault();
      if (!e.repeat) small();
      return;
    }
    // R = 다음 판 / 새 판(왼쪽 키를 누른 것과 같음, 떼면 keyup에서 올라옴)
    if (e.code === 'KeyR' && plain) {
      e.preventDefault();
      if (e.repeat) return;
      if (keyHold.slide === 'kb:KeyR') releaseKey('slide', undefined, true);
      holdKey('slide', 'kb:KeyR', eventTime(e));
      return;
    }
    if (e.code !== 'Space' && e.code !== 'Enter' && e.code !== 'NumpadEnter') return;
    if (!plain) return; // Cmd · Ctrl · Alt와 같이 누른 것은 게임 누름이 아니다(떼는 신호가 안 와서 키가 눌린 채 남는 것도 막음)
    e.preventDefault();
    if (e.repeat) return; // 꾹 누르고 있어 저절로 반복되는 입력은 무시
    // 같은 키가 눌린 채 남아 있는데 새로 눌렸다면 떼는 신호를 놓친 것이다 → 조용히 풀고 받는다(키보드가 먹통이 되지 않게)
    if (keyHold.push === `kb:${e.code}`) releaseKey('push', undefined, true);
    holdKey('push', `kb:${e.code}`, eventTime(e)); // 오른쪽 키를 누른 것과 같음(떼면 keyup에서 올라옴)
  });
  // 연타할 때 화면이 확대되거나 끌리거나, 길게 눌러 메뉴가 뜨지 않게 막는다
  // (순위 화면 · 계정 창(과 그 둘레의 보이지 않는 막) 안은 예외: 진짜 버튼과 입력칸이라 눌리고 글자가 쳐지고 굴려져야 한다)
  const block = (e) => { if (e.target && e.target.closest && e.target.closest('.lb-page, .ac-wrap')) return; e.preventDefault(); };
  ['touchstart', 'touchmove', 'touchend'].forEach((name) => document.addEventListener(name, block, { passive: false }));
  ['gesturestart', 'dblclick', 'contextmenu', 'selectstart', 'dragstart'].forEach((name) => document.addEventListener(name, block));

  fit();
  // 이름이 없으면 자동 이름을 받고, 있으면 윗줄 맛보기(오늘 내 순위)를 받아 온다
  askName();
  loadPeek();
  // 처음 온 사람(안내를 본 적이 없는 사람)에게는 계정 창이 「첫 방문 모양」으로 먼저 뜬다. 연결이 없으면 띄우지 않는다(다음에 연결되면 그때 뜬다)
  if (!Board.offline && loadRaw(SEEN_KEY) !== '1') openAcct(undefined, true);
  // 들어오자마자 첫 결투 시작(신호는 3초 안에). 뒤쪽 탭으로 열렸으면 화면이 보이는 순간 시작(visibilitychange).
  // 첫 방문 창이 떠 있으면 그 창을 닫을 때 시작한다
  if (!document.hidden && !overlayOpen()) { startDuel(now()); autoDuel = true; }

  /* ---------- 검사용 손잡이: 게임에는 영향이 없다(소리도 내지 않는다) ---------- */
  const toInt = (n) => {
    const value = Math.floor(Number(n));
    return Number.isFinite(value) ? Math.max(0, Math.min(Number.MAX_SAFE_INTEGER, value)) : 0;
  };
  const rectOf = (node) => {
    const b = node.getBoundingClientRect();
    return { x: b.left, y: b.top, w: b.width, h: b.height };
  };
  window.__STREAK_TEST__ = {
    state() {
      return {
        phase, streak, best, bestMs,
        oppMs: phase === 'ready' ? oppFor(streak) : duelOpp,
        waitMs: phase === 'ready' ? null : waitMs,
        myMs, outcome, pose: poses(), mark: markNow(), timeText: timeTextNow(),
        label: LABEL,
        layout: 'F', rows: H,
        sound: KeySound.index,
        skin, skinName: SKINS[skin].name, skins: SKINS.map((s) => s.name),
        keyDown: anyKeyDown(),
        keyRects: { push: rectOf(el.keyPush), slide: rectOf(el.keySlide) },
        rects: {
          device: rectOf(el.deviceE), screen: rectOf(el.screen), push: rectOf(el.keyPush), slide: rectOf(el.keySlide), grip: rectOf(el.grip),
          gameBtn: rectOf(el.gameBtn), soundBtn: rectOf(el.soundBtn), skinBtn: rectOf(el.skinBtn),
        },
        game: gameHere(),
        meMark: meMarkNow(),                 // 「나」 표시가 떠 있는지
        tumble: (() => { const w = windNow(); return w ? { x: w.x, lift: w.lift, dir: w.dir } : null; })(), // 굴러가는 풀(없으면 null)
        bestLine: bestLineNow(),             // 진 · 반칙 결과의 「최고 N연승」 줄 { best, record, on }(없으면 null)
        hud: hudBestNow(),                   // 왼쪽 위 「왕관 + 최고 연승」 줄(언제나) { best, x, y, w, h } + 번개 줄 { bestMs, msText, msRow: { x, y, w, h } } — 자리는 화면 칸
        streakY: STREAK_Y,                   // 「N연승」 위 끝(칸)
        // 아래는 모두 화면 칸 자리 { x, y, w, h }
        streakBox: (() => { const b = streakBoxNow(); return { x: b.x, y: b.y, w: b.w, h: b.h }; })(), // 왼쪽 위 큰 「N연승」
        markBox: (() => { const b = markBoxNow(); return b ? { skull: b.skull, word: b.word, k: b.k } : null; })(), // 진 화면 해골 · 「반칙」(반칙이 아니면 word = null, 진 화면이 아니면 null)
        bestLineBox: (() => { const b = bestLineBoxNow(); return b ? { x: b.x, y: b.y, w: b.w, h: b.h } : null; })(), // 진 화면 「최고 N연승」 줄(없으면 null)
        sunBox: { x: SUN_X, y: SUN_Y + skyShift, w: SUN[0].length, h: SUN.length },                    // 오른쪽 위 해
        peopleTop: GROUND_Y + skyShift - STAND.length, // 두 사람 그림의 위 끝 줄
        aria: el.screen.getAttribute('aria-label'),    // 읽어 주는 글
        lb: lbState(),                                 // 순위표 쪽 상태(이름 · 창 · 순위표 줄 등)
      };
    },
    // 순위표 쪽 손잡이: 윗줄의 순위 맛보기 버튼 · 이름 버튼 · 순위 화면 안 버튼 · 계정 창 안 버튼을 누른 것과 같은 일
    rank() { openRank(); return lbState(); },
    me() { openAcct(); return lbState(); },
    pageAct(id) { pageAct(String(id)); return lbState(); },
    acctAct(id) { acctAct(String(id)); return lbState(); },
    // 가짜 문지기의 대답을 일부러 늦춘다(1/1000초, null이면 평소 0.3~0.6초) — 대답이 늦어도 게임이 안 밀리는지 볼 때
    setBoardDelay(ms) { Board.setDelay(ms); return true; },
    // 순위 맛보기 버튼을 「지금보다 ms 뒤」에 누른 것으로 친다: 시간은 흘렀는데 화면이 아직 못 따라온 순간을 흉내 낸다
    rankAt(ms) { openRank(now() + Math.max(0, Number(ms) || 0)); return this.state(); },
    // 받아 둔 순위표를 ms만큼 오래된 것으로 만든다(30초 유효 시간을 기다리지 않고 보려고)
    ageCache(ms) { Object.keys(UI.cache).forEach((k) => { UI.cache[k].at -= Number(ms) || 0; }); return Object.keys(UI.cache); },
    failNextRead(n) { Board.failNextRead(n); return true; },   // 다음 순위 읽기 n번을 실패시킨다
    failsLeft() { return Board.failsLeft(); },                 // 아직 안 쓰인 「일부러 실패」 횟수
    // 판 끝 보고 하나를 지금 보낸다(순위 탭을 연 채 보고가 끝나는 경우를 보려고): 연승 counted · 반응 ms
    lateReport(counted, ms) { sendReport(Board.resumeRun((Number(counted) || 1) * 1500), Number(counted) || 1, Number(ms) || 0); return lbReports.length; },
    // 이름 검사 결과만 본다(만들지는 않음): 길이 · 글자 · 금지 단어 · 같은 이름
    checkName(name) { const c = Board.checkName(name); return c.ok && Board.isTaken(c.name) ? { ok: false, why: 'taken' } : { ok: c.ok, why: c.why }; },
    // 가짜 문지기의 순위표를 기다리지 않고 바로 읽는다: 사람 수 · 내 줄 · 위 3명 · 내 줄의 위아래
    peekBoard(metric, period) {
      const d = Board.peek(metric, period), i = d.me ? d.me.rank - 1 : -1;
      return { total: d.total, me: d.me, top: d.rows.slice(0, 3), above: i > 0 ? d.rows[i - 1] : null, below: i >= 0 && i + 1 < d.rows.length ? d.rows[i + 1] : null };
    },
    skull() { return SKULL.slice(); },                 // 해골 그림 줄들(그림을 갈아 끼워도 검사가 따라가게)
    press() { pressAt(now()); return this.state(); },
    keyPress() { return holdKey('push', 'test', now()); }, // 이미 눌려 있으면 false(쏘지 않음)
    keyRelease() { return releaseKey('push'); },
    // 왼쪽 키(다음 판 / 새 판): 누르고 떼기까지. 다른 키가 눌려 있으면 false
    restartKey() { const ok = holdKey('slide', 'test', now()); releaseKey('slide'); return ok; },
    setSkin(n) { return setSkin(n); },
    nextSkin() { nextSkin(); return skin; },
    // 소리 고르기(0 = 끔, 1~6). 들려주지는 않는다
    setSound(i) { const v = keepRealSound(() => KeySound.set(i)); drawSoundBtn(); return v; },
    gameUrl(id) { return gameUrl(id); },               // 그 번호 게임으로 갈 주소(가지는 않음)
    gameIndexAt(x) { return gameIndexAt(Number(x)); }, // 게임 버튼 안 가로 위치(화면 점) → 칸 번호(0부터)
    // 앞으로의 대결에서 신호까지 시간을 고정(null이면 다시 무작위)
    setWait(ms) {
      fixedWait = ms === null || ms === undefined ? null : toInt(ms);
      return this.state();
    },
    // 연승을 n으로(상대 속도도 그에 맞게). 최고 연승보다 크면 최고 연승도 올린다
    setStreak(n) {
      streak = toInt(n);
      if (streak > best) best = streak;
      if (phase !== 'result') duelOpp = oppFor(streak);
      saveRecords(); syncText(); render();
      return this.state();
    },
    reset() {
      streak = 0; best = 0; bestMs = null; endedStreak = 0;
      phase = 'ready'; waitMs = null; myMs = null; outcome = null; shotMs = null; autoLoseFrom = null;
      duelOpp = oppFor(0);
      Object.values(KEYS).forEach(clearKey);
      syncText(); render();
      return this.state();
    },
    // 손으로 돌리는 시계: 처음 부르면 지금 시계 값에서 이어 받아 멈춰 두고, 부를 때마다 ms만큼 돌린다.
    // 그 사이 신호 · 상대가 쏘기는 정해진 시각 그대로 차례로 처리된다
    tick(ms) {
      if (manual === null) {
        manual = now();
        if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      }
      manual += Math.max(0, Number(ms) || 0);
      advanceTo(manual);
      render();
      return this.state();
    },
    // 실제 시계로 되돌리기: 시간이 끊기지 않게 지금 값에서 이어 흐른다
    realClock() {
      if (manual !== null) {
        offset = manual - performance.now();
        manual = null;
      }
      render(); startLoop();
      return this.state();
    },
  };
})();
</script>
</body>
</html>
