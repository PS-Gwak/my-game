<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>결투 · 순위표 시뮬레이션 5판</title>
<style>
  /* 화면에는 손바닥만 한 기기 하나만 보인다: 몸통 안에 검은 화면(4:3), 그 아래 키캡 두 개, 맨 아래 오돌토돌한 띠.
     검은 화면 안은 검정과 흰색 두 가지만 쓴다. 글씨와 테두리는 전부 캔버스(그림 종이)에 칸으로 찍는다 */
  :root { --black: #000000; --white: #f2f2f2; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--black); color: var(--white);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    display: flex; align-items: center; justify-content: center;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  /* 받침대는 창 전체: 기기를 가로 · 세로 가운데에 올려 둔다(창 바깥 배경은 검정) */
  main {
    width: 100vw; height: 100vh; height: 100dvh; padding: 0;
    display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr);
  }
  .stage { min-height: 0; min-width: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  /* 기기 몸통: 크기와 자리는 스크립트가 창 크기에 맞춰 정한다. 겉모양(둥근 위 · 깎인 아래 · 몸통 색)은 안쪽 그림(#bodyArt)이 그린다 */
  .device-e { position: relative; flex: none; line-height: 0; }
  .screen { position: absolute; display: block; image-rendering: pixelated; background: var(--black); border-radius: 2px; }
  .body-art { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  .grip { position: absolute; display: block; image-rendering: pixelated; pointer-events: none; }
  /* 몸통 위쪽 띠의 작은 버튼들(게임 고르기 · 소리 · 몸통 색) */
  .corner-btn {
    position: absolute; top: 3px; padding: 0; margin: 0; border: 0; background: transparent;
    line-height: 0; cursor: pointer; touch-action: none; outline: none;
  }
  .corner-btn canvas { display: block; image-rendering: pixelated; }
  .key {
    position: absolute; padding: 0; margin: 0; border: 0; background: transparent;
    line-height: 0; cursor: pointer; touch-action: none; outline: none;
  }
  .key canvas { display: block; image-rendering: pixelated; }
  /* 화면에는 안 보이는 글자: 읽어 주는 기능 · 검사기가 버튼 글을 읽을 수 있게 남겨 둔다 */
  .ghost { position: absolute; left: 0; top: 0; width: 100%; height: 100%; color: transparent; overflow: hidden; white-space: nowrap; pointer-events: none; line-height: 1; }

  /* ---- 순위표 ----
     비유: 오락실 점수판은 오락기 안이 아니라 벽에 따로 걸려 있다. 오락기(기기) 위에는 한 줄짜리 띠만 둔다:
     왼쪽 = 내 이름표, 오른쪽 = 「오늘 몇 위」 맛보기. 문이 둘이고 방도 둘이다(서로 넘어가는 길은 없다):
     이름표를 누르면 오락기의 검은 화면 칸 안에 「계정 창」이 뜨고(오락기가 스스로 안내를 띄운 것처럼 — 뒤를 어둡게 덮지 않는다), 맛보기를 누르면 오락기를 덮는 넓은 「순위 화면」(탭 둘: 순위 · 내 기록)이 펼쳐진다.
     처음 온 사람에게는 계정 창이 안내 두 줄과 함께 먼저 뜬다.
     글꼴은 점 글꼴 「갈무리」 */
  @font-face {
    font-family: 'Galmuri11';
    src: url('https://cdn.jsdelivr.net/npm/galmuri/dist/Galmuri11.woff2') format('woff2');
    font-display: swap;
  }
  /* ---- 기기 밖 윗줄: 내 이름 버튼(왼쪽) · 순위 맛보기 버튼(오른쪽) ----
     테두리 상자 없이 그림 + 글씨만 둔다. 몸통 위 한 줄일 때는 몸통 끝이 아니라 몸통 안 위 띠 버튼들의 선(안쪽 선)에 맞춘다 —
     몸통 모서리가 둥글어서 끝 선에 맞추면 어긋나 보인다.
     --m = 점 하나 크기(스크립트가 기기 화면 점에 딱 맞는 크기로 정한다: 큰 것은 글씨 16px쯤, 작은 것은 12px). 위 여백이 없고 옆 여백만 있으면 몸통 왼쪽 옆에 세로로 쌓는다(.side) */
  .top-row {
    --m: 1px;
    position: fixed; left: 4px; top: 4px; z-index: 5; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    pointer-events: none;
  }
  .top-row.side { flex-direction: column; justify-content: flex-start; gap: 16px; }
  .top-btn {
    position: relative; flex: none; margin: 0; padding: 0;
    height: calc(var(--m) * 24); display: flex; align-items: center; gap: calc(var(--m) * 4);
    background: transparent; color: var(--white); border: 0; border-radius: 0;
    font-family: 'Galmuri11', "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: calc(var(--m) * 12); line-height: 1; white-space: nowrap; -webkit-font-smoothing: none; font-smooth: never;
    cursor: pointer; touch-action: none; outline: none; pointer-events: auto;
  }
  .top-btn::before { content: ''; position: absolute; left: -6px; right: -6px; top: -10px; bottom: -10px; } /* 누를 자리를 넉넉히: 작은 크기(높이 24)에서도 높이 44 */
  .top-btn svg { display: block; width: calc(var(--m) * var(--iw)); height: calc(var(--m) * var(--ih)); flex: none; }
  /* 이름이 길어 자리가 모자라면 뒤를 「…」로 줄인다(전체 이름은 계정 창에서 보인다) */
  .top-btn span { min-width: 0; overflow: hidden; text-overflow: ellipsis; line-height: 1.25; }
  /* ---- 순위 화면: 창 전체를 덮는다. 맨 위 탭 둘은 굴려도 붙어 있다 ---- */
  .lb-page {
    position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 10; display: none;
    background: var(--black); color: var(--white); overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain;
    touch-action: pan-y; -webkit-overflow-scrolling: touch;
    font-family: 'Galmuri11', "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: 24px; line-height: 28px; word-break: keep-all; -webkit-font-smoothing: none; font-smooth: never;
  }
  .lb-page.open { display: block; }
  /* ---- 계정 창: 게임기의 검은 화면 칸 안에 딱 맞게 뜬다. 뒤를 어둡게 덮지 않는다(몸통 · 위 띠 · 키캡 · 윗줄이 그대로 보인다) ----
     .ac-wrap = 창 전체를 덮는 보이지 않는 막: 창이 떠 있는 동안 게임기 버튼들에 누름이 가지 않게 받아 낸다.
     .ac-card = 검은 화면 칸과 같은 자리 · 같은 폭(스크립트가 맞춘다). 안 들어가면 아래로만 늘어난다.
     --m = 글꼴 점 하나 크기(윗줄과 같은 규칙: 기기 화면 점에 딱 맞는 크기. 큰 것은 글씨 16px쯤, 안 들어가면 12px) */
  .ac-wrap { position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 10; display: none; background: transparent; touch-action: none; }
  .ac-wrap.open { display: block; }
  .ac-card {
    --m: 1px;
    position: absolute; left: 0; top: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain;
    display: flex; flex-direction: column; gap: 6px; padding: 6px 8px;
    background: var(--black); color: var(--white); border: 0; border-radius: 2px; touch-action: pan-y; -webkit-overflow-scrolling: touch;
    font-family: 'Galmuri11', "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: calc(var(--m) * 12); line-height: 1.25; word-break: keep-all; -webkit-font-smoothing: none; font-smooth: never;
  }
  .ac-card > * { flex: none; }
  /* 이름 줄: 이름(왼쪽, 길면 뒤를 「…」) + 작은 「바꾸기」 버튼 (+ 평소 모양에서는 오른쪽 끝에 ×) */
  .ac-row { display: flex; align-items: center; gap: 6px; min-height: 1.75em; }
  .ac-card .pg-name { flex: 0 1 auto; min-width: 0; padding: 0; text-align: left; text-overflow: ellipsis; }
  #acCard button { min-height: 40px; padding: 2px 6px; }
  #acCard button.mini { position: relative; flex: none; width: auto; min-height: 0; height: 1.75em; padding: 0 0.5em; white-space: nowrap; }
  #acCard button.mini::before { content: ''; position: absolute; left: -4px; right: -4px; top: -8px; bottom: -8px; } /* 누를 자리를 넉넉히 */
  #acCard button.x { position: relative; width: 1.75em; min-height: 0; height: 1.75em; margin-left: auto; }
  /* ×의 누를 자리: 보이는 크기는 그대로 두고 44px 넘게 넓힌다(위는 창 안쪽 여백만큼만 — 창 밖으로 나가면 잘린다) */
  #acCard button.x::before { content: ''; position: absolute; left: -16px; right: -8px; top: -6px; bottom: -18px; }
  #acCard input { height: 40px; flex: none; }
  #acCard .ac-row input { flex: 1 1 auto; min-width: 0; width: auto; }
  .ac-card .pg-msg { min-height: 1.25em; }
  .pg-in { max-width: 420px; margin: 0 auto; padding: 0 16px 48px; display: flex; flex-direction: column; gap: 12px; }
  .pg-body { display: flex; flex-direction: column; gap: 12px; }
  .pg-tabs {
    position: sticky; top: 0; z-index: 1; display: flex; align-items: stretch; gap: 6px;
    background: var(--black); padding: 14px 0 8px; border-bottom: 2px solid var(--white);
  }
  .lb-page .pg-tabs button { width: auto; flex: 1 1 auto; padding: 6px 4px; white-space: nowrap; }
  .lb-page .pg-tabs button.x { flex: none; }
  .lb-page button.on { background: var(--white); color: var(--black); }
  .lb-page p, .ac-card p { margin: 0; }
  .lb-page svg { display: inline-block; vertical-align: -2px; margin-right: 8px; width: calc(2px * var(--iw)); height: calc(2px * var(--ih)); }
  /* 순위 탭: 게임 줄(숫자 칩 여덟 + 게임 이름) · 거르는 두 묶음(이름표 + 버튼 둘) · 내 줄 카드 · 순위 줄 */
  .pg-chips { display: flex; align-items: center; gap: 3px; }
  .pg-chip { flex: none; width: 26px; height: 40px; display: flex; align-items: center; justify-content: center; border: 2px solid #3a3a3a; color: #8a8a8a; }
  .pg-chip.on { border-color: var(--white); background: var(--white); color: var(--black); }
  .pg-gname { flex: none; margin-left: 5px; white-space: nowrap; }
  .pg-grp { display: flex; align-items: center; gap: 8px; }
  .pg-lab { flex: none; color: #8a8a8a; white-space: nowrap; }
  .lb-page .pg-grp button { flex: 1 1 0; width: auto; white-space: nowrap; }
  .pg-mine { border: 2px solid var(--white); padding: 10px 8px; text-align: center; }
  .pg-mine.has { background: var(--white); color: var(--black); }
  .pg-wait { text-align: center; padding: 24px 0; }
  .pg-rows { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; column-gap: 10px; }
  .pg-rk {
    grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; align-items: center;
    min-height: 40px; padding: 4px 4px; border-bottom: 2px solid #3a3a3a;
  }
  .pg-rk span:nth-child(1), .pg-rk span:nth-child(3) { text-align: right; white-space: nowrap; }
  .pg-rk span:nth-child(2) { overflow-wrap: anywhere; word-break: break-all; }
  .pg-rk.me { background: var(--white); color: var(--black); border-bottom-color: var(--white); }
  .lb-page button, .ac-card button {
    font: inherit; margin: 0; border-radius: 0; cursor: pointer; width: 100%; min-height: 48px; padding: 6px 8px;
    background: var(--black); color: var(--white); border: 2px solid var(--white); touch-action: manipulation;
  }
  .lb-page button.solid, .ac-card button.solid { background: var(--white); color: var(--black); }
  .lb-page button.x, .ac-card button.x { width: 48px; min-height: 44px; padding: 0; border: 0; flex: none; }
  .lb-page button:disabled, .ac-card button:disabled { opacity: 0.5; }
  /* 이름 줄: 누르는 것이 아니라서 바탕 · 테두리 없이 큰 글씨로만(흰 바탕은 누르는 버튼에만 쓴다) */
  .pg-name { background: transparent; color: var(--white); text-align: center; padding: 10px 0; white-space: nowrap; overflow: hidden; }
  .pg-row { display: flex; gap: 8px; }
  .pg-msg { min-height: 28px; }
  .lb-page input, .ac-card input {
    width: 100%; height: 48px; margin: 0; padding: 0 8px; border: 2px solid var(--white); border-radius: 0; outline: none;
    background: var(--black); color: var(--white); caret-color: var(--white); font: inherit; text-align: center;
    -webkit-appearance: none; appearance: none; user-select: text; -webkit-user-select: text; touch-action: manipulation;
  }
  /* 내 기록 탭: 게임 한 줄 = [번호] [게임] ……… [내 기록] [순위]. 결투 두 줄만 눌린다(순위 탭의 그 종목으로 간다).
     칸 폭은 표 전체에서 가장 긴 글에 맞추고(줄마다 세로로 맞음), 남는 폭은 게임 이름 칸이 가진다 */
  .pg-games { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; column-gap: 8px; }
  .lb-page .pg-game {
    grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; align-items: center;
    width: 100%; min-height: 44px; padding: 6px 2px; border: 0; border-bottom: 2px solid #3a3a3a;
    background: var(--black); color: var(--white); text-align: left; white-space: nowrap;
  }
  .lb-page .pg-game span:nth-child(2) { overflow: hidden; }
  .lb-page .pg-game span:nth-child(3), .lb-page .pg-game span:nth-child(4) { text-align: right; }
  .lb-page .pg-game span:nth-child(4) { padding-left: 10px; }
  .lb-page .pg-game.off { color: #8a8a8a; }
  @supports not (grid-template-columns: subgrid) {
    .pg-games { display: block; }
    .lb-page .pg-game { grid-template-columns: 22px minmax(0, 1fr) 72px 96px; column-gap: 6px; }
    .pg-rows { display: block; }
    .pg-rk { grid-template-columns: 58px minmax(0, 1fr) 66px; column-gap: 6px; }
  }
  @media (max-width: 340px) {
    .pg-in { padding-left: 8px; padding-right: 8px; }
    .pg-games { column-gap: 5px; }
    .lb-page .pg-game span:nth-child(4) { padding-left: 6px; }
    .pg-rows { column-gap: 6px; }
    .pg-rk { padding-left: 2px; padding-right: 2px; }
  }
</style>
</head>
<body>
<main id="main">
  <div class="stage" id="stage">
    <div class="device-e" id="deviceE">
      <svg class="body-art" id="bodyArt" aria-hidden="true"><path id="bodyFill"></path><path id="bodyLine" fill="none"></path></svg>
      <button class="corner-btn game-btn" id="gameBtn" type="button" tabindex="-1"><canvas id="gameCanvas"></canvas><span class="ghost" id="gameLabel">게임 3 결투</span></button>
      <button class="corner-btn" id="soundBtn" type="button" tabindex="-1"><canvas id="soundCanvas"></canvas><span class="ghost" id="soundLabel">소리 1</span></button>
      <button class="corner-btn skin-btn" id="skinBtn" type="button" tabindex="-1"><canvas id="skinCanvas"></canvas><span class="ghost" id="skinLabel">몸통 gray</span></button>
      <canvas class="screen" id="screen" aria-label="서부 결투"></canvas>
      <button class="key" id="keySlide" type="button" tabindex="-1"><canvas id="keySlideCanvas"></canvas><span class="ghost">다음 판</span></button>
      <button class="key" id="keyPush" type="button" tabindex="-1"><canvas id="keyPushCanvas"></canvas><span class="ghost">쏴</span></button>
      <canvas class="grip" id="grip"></canvas>
    </div>
  </div>
  <div class="top-row" id="topRow">
    <button class="top-btn" id="meBtn" type="button" tabindex="-1" aria-label="계정"><span id="meBtnText">…</span></button>
    <button class="top-btn" id="rankBtn" type="button" tabindex="-1" aria-label="순위표"><span id="rankBtnText">순위</span></button>
  </div>
  <div class="lb-page" id="lbPage"></div>
  <div class="ac-wrap" id="acWrap"><div class="ac-card" id="acCard" role="dialog" aria-label="계정"></div></div>
</main>
<!-- 이름 걸러내기: 걸러내는 함수와 금지 단어 목록을 원본 그대로 옮겨 넣는 자리(검사기 qa-sim.js가 맨 처음에 채운다) -->
<!-- NICK-FILTER 여기부터 -->
<script>
/*
 * 닉네임 걸러내기 (참고용)
 *
 * 비유: 공항 보안 검색대.
 *   1) 가방(닉네임)에서 포장지(숫자 · 기호 · 공백)를 벗기고
 *   2) 변장(닮은 글자 · 풀어 쓴 자모 · 늘여 쓴 글자)을 원래 얼굴로 되돌린 다음
 *   3) 수배 명단(banned-words.json)과 대조한다.
 *   4) 다만 「보지마」처럼 멀쩡한 말은 통행증(allow 목록)을 보여 주면 통과시킨다.
 *
 * 다른 도구 없이 node와 브라우저 양쪽에서 돈다.
 *   node    : const f = require('./filter.js'); f.checkNickname('이름')
 *             (같은 폴더의 banned-words.json을 알아서 읽는다)
 *   브라우저 : <script src="filter.js"><\/script> 뒤에
 *             NicknameFilter.setWordList(목록객체); NicknameFilter.checkNickname('이름')
 *
 * 꼭 기억할 것: 폰(브라우저)에서만 검사하면 누구나 건너뛸 수 있다.
 *             서버에서도 똑같은 함수로 한 번 더 검사해야 한다.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.NicknameFilter = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ───────── 설정 (바꿀 수 있는 값) ─────────
  var MIN_LEN = 2;          // 최소 글자 수
  var MAX_LEN = 8;          // 최대 글자 수
  var ALLOW_JAMO = false;   // ㅋㅋ · ㅎㅎ 같은 낱자모를 이름에 허용할지 (기본: 안 됨 → ㅅㅂ류가 통째로 막힘)

  // 「통째로 같을 때만」 막는 갈래 이름. (ass · gm처럼 짧아서 다른 낱말 속에 흔히 들어 있는 말)
  var EXACT_CATEGORY = '짧은 말(통째로 같을 때만)';

  // ───────── 한글 조립 도구 ─────────
  // 한글 한 글자는 레고 블록 세 개(첫소리 · 가운뎃소리 · 받침)로 되어 있다.
  var CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
  var JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
  var JONG = ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ', 'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];

  function isSyllable(ch) { return ch >= '가' && ch <= '힣'; }
  function split(ch) { // 완성된 글자 → [첫소리, 가운뎃소리, 받침] 번호
    var c = ch.charCodeAt(0) - 0xac00;
    return [Math.floor(c / 588), Math.floor((c % 588) / 28), c % 28];
  }
  function join(cho, jung, jong) { return String.fromCharCode(0xac00 + cho * 588 + jung * 28 + jong); }

  // 풀어 쓴 자모를 다시 글자로 조립한다.  ㅅㅣㅂㅏㄹ → 시발,  ㅂㅗㅈㅣ → 보지
  // (자음만 이어진 ㅅㅂ · ㅂㅅ은 조립할 수 없으니 그대로 둔다 → 목록의 초성 낱말과 대조)
  function composeJamo(s) {
    var out = '';
    var i = 0;
    while (i < s.length) {
      var c = CHO.indexOf(s[i]);
      var v = i + 1 < s.length ? JUNG.indexOf(s[i + 1]) : -1;
      if (c >= 0 && v >= 0) {
        var jong = 0;
        var next = s[i + 2];
        var nextNext = s[i + 3];
        // 받침 후보: 다음이 자음이고, 그 뒤가 모음이 아니어야 한다(모음이면 다음 글자의 첫소리)
        if (next && JONG.indexOf(next) > 0 && !(nextNext && JUNG.indexOf(nextNext) >= 0)) {
          jong = JONG.indexOf(next);
          i += 3;
        } else {
          i += 2;
        }
        out += join(c, v, jong);
      } else {
        out += s[i];
        i += 1;
      }
    }
    return out;
  }

  // ───────── 다듬기 단계들 ─────────

  // 1단계: 전각 문자 · 꾸밈 문자를 보통 글자로 (ｓｅｘ → sex), 보이지 않는 글자 제거
  function unify(name) {
    var s = String(name == null ? '' : name);
    // (한글 낱자모 ㅅ · ㅂ 등은 건드리지 않는다 — 통째로 정리하면 낱자모가 다른 글자로 바뀌어 사라진다)
    if (s.normalize) s = s.replace(/[^\u3131-\u318e]+/g, function (m) { return m.normalize('NFKC'); });
    return s.replace(/[​-‏⁠﻿­ㅤᅟᅠ]/g, '');
  }

  // 2단계: 닮은 글자 되돌리기 (한글 자모 바로 옆에 붙은 것만 — 영어 이름을 망가뜨리지 않으려고)
  //   ㅅl발 · ㅅ1발 → ㅅㅣ발,  ㄱH새끼 → ㄱㅐ새끼,  7H새끼 → 개새끼,  77ㅓ져 → ㄲㅓ져
  function restoreLookalikes(s) {
    return s
      .replace(/7[hH](?=[가-힣ㄱ-ㅎ])/g, '개')
      .replace(/77(?=[ㅏ-ㅣ])/g, 'ㄲ')
      .replace(/([ㄱ-ㅎ])[lI|!1]/g, '$1ㅣ')
      .replace(/([ㄱ-ㅎ])[hH]/g, '$1ㅐ')
      .replace(/[\^人](?=[ㅏ-ㅣ가-힣ㄱ-ㅎ])/g, 'ㅅ')
      .replace(/[┻┴⊥凸]/g, 'ㅗ');
  }

  // 3단계: 허용 글자만 남기기 (기호 · 공백 · 이모지 등은 전부 버림). keepDigits=false면 숫자도 버림
  function strip(s, keepDigits) {
    s = s.toLowerCase();
    return keepDigits ? s.replace(/[^가-힣ㄱ-ㅎㅏ-ㅣa-z0-9]/g, '') : s.replace(/[^가-힣ㄱ-ㅎㅏ-ㅣa-z]/g, '');
  }

  // 4단계: 반복 줄이기.  씨씨씨발 → 씨발,  ㅋㅋㅋ → ㅋ   (한글만. 영문은 따로 다룬다)
  function collapseHangul(s) { return s.replace(/([가-힣ㄱ-ㅎㅏ-ㅣ])\1+/g, '$1'); }

  // 5단계: 늘여 쓰기 줄이기.  씨이발 → 씨발,  시바알 → 시발,  조옷 → 좃
  //   (앞 글자와 같은 모음으로 시작하는 「이 · 아 · 오 …」를 앞 글자에 합친다)
  function squeeze(s) {
    var out = [];
    for (var i = 0; i < s.length; i++) {
      var ch = s[i];
      var prev = out.length ? out[out.length - 1] : '';
      if (isSyllable(ch) && isSyllable(prev)) {
        var a = split(prev);
        var b = split(ch);
        if (b[0] === 11 /* ㅇ */ && a[2] === 0 && a[1] === b[1]) {
          out[out.length - 1] = join(a[0], a[1], b[2]);
          continue;
        }
      }
      out.push(ch);
    }
    return collapseHangul(out.join(''));
  }

  // 영문 숫자 변장 되돌리기 (sh1t → shit, a55 → ass)
  var LEET = { '0': 'o', '1': 'i', '3': 'e', '4': 'a', '5': 's', '7': 't', '8': 'b', '9': 'g' };
  function unleet(s) { return s.replace(/[01345789]/g, function (d) { return LEET[d] || ''; }); }

  // 영문 반복 줄이기: fuuuck → fuck (전부 한 글자로), niggger → nigger (셋 이상만 둘로)
  function collapseLatinAll(s) { return s.replace(/([a-z])\1+/g, '$1'); }
  function collapseLatin3(s) { return s.replace(/([a-z])\1{2,}/g, '$1$1'); }

  /*
   * normalize(name): 닉네임의 「맨얼굴」 한 장을 돌려준다.
   *   숫자 · 기호 · 공백을 빼고 → 닮은 글자를 되돌리고 → 자모를 조립하고 → 반복을 줄인 꼴.
   *   예) '자1지' → '자지',  '자123지' → '자지',  '보.지' → '보지',  'ㅅㅣ발' → '시발'
   * 목록(banned-words.json)의 낱말도 같은 꼴로 들어 있다.
   */
  function normalize(name) {
    return collapseHangul(composeJamo(strip(unify(name), false)));
  }

  /*
   * views(name): 같은 닉네임을 여러 각도에서 찍은 사진 묶음.
   *   한 가지 다듬기만 쓰면 빠져나가는 수법이 있어서, 여러 장을 찍어 전부 명단과 대조한다.
   */
  function views(name) {
    var u = unify(name);
    var look = restoreLookalikes(u);
    var main = normalize(u);                                              // 숫자 먼저 빼기 (ㅂ1ㅅ → ㅂㅅ)
    var mainLook = collapseHangul(composeJamo(strip(look, false)));       // 닮은 글자 먼저 (ㅅ1발 → 시발)
    var kept = collapseHangul(composeJamo(strip(look, true)));            // 숫자를 남긴 꼴 (시8, 18놈)
    var keptPlain = collapseHangul(composeJamo(strip(u, true)));
    var leet = unleet(strip(u, true));                                     // 숫자를 영문으로 읽은 꼴
    var rawMain = composeJamo(strip(u, false));                           // 반복을 줄이지 않은 꼴 (「딸딸이」처럼 원래 겹글자인 낱말용)
    var hangulOnly = /[가-힣ㄱ-ㅎ]/.test(main) ? collapseHangul(main.replace(/[a-z]/g, '')) : main; // 한글 사이에 끼운 영문 빼기 (보a지 → 보지)
    var plain = uniq([main, mainLook, rawMain, hangulOnly, squeeze(main), squeeze(mainLook), squeeze(hangulOnly)]);
    var latin = uniq(plain.concat([leet]).reduce(function (acc, v) {
      acc.push(v, collapseLatin3(v), collapseLatinAll(v));
      return acc;
    }, []));
    return {
      plain: plain,                                  // 숫자 없는 낱말과 대조할 꼴들
      numeric: uniq([kept, keptPlain]),              // 숫자가 든 낱말(시8 · 18놈)과 대조할 꼴들
      latinExact: uniq(plain.concat([leet]).map(collapseLatin3)), // 「통째로만」 대조용 (boot를 bot으로 줄여 버리지 않도록 반복은 셋 이상만 줄임)
      latin: latin,                                  // 영문 낱말과 대조할 꼴들
      reversed: main.split('').reverse().join('')    // 뒤집어 쓴 꼴 (끼새개 → 개새끼)
    };
  }

  function uniq(arr) {
    var seen = {};
    return arr.filter(function (x) { if (seen[x]) return false; seen[x] = true; return true; });
  }

  // ───────── 목록 준비 ─────────
  var compiled = null;

  function compile(list) {
    var c = { plain: [], numeric: [], latin: [], exact: {}, allow: [] };
    var cats = (list && list.categories) || {};
    Object.keys(cats).forEach(function (cat) {
      cats[cat].forEach(function (w) {
        w = String(w).toLowerCase();
        if (!w) return;
        if (cat === EXACT_CATEGORY) { c.exact[w] = cat; return; }
        var item = { w: w, cat: cat };
        if (/[0-9]/.test(w)) c.numeric.push(item);
        else if (/^[a-z]+$/.test(w)) c.latin.push(item);
        else c.plain.push(item);
      });
    });
    c.allow = ((list && list.allow) || []).map(function (w) { return String(w).toLowerCase(); });
    // 영문 허용 낱말은 반복을 줄인 꼴도 함께 둔다 (essex를 esex로 줄여 본 사진에서도 통행증이 통하도록)
    c.allow.slice().forEach(function (a) {
      if (/^[a-z]+$/.test(a)) { var s1 = collapseLatinAll(a); if (s1 !== a && s1.length >= 3) c.allow.push(s1); }
    });
    return c;
  }

  function setWordList(list) { compiled = compile(list); }

  function getCompiled(list) {
    if (list) return compile(list);
    if (compiled) return compiled;
    if (typeof require === 'function') {
      try { compiled = compile(require('./banned-words.json')); return compiled; } catch (e) { /* 아래로 */ }
    }
    throw new Error('금지 단어 목록이 없습니다. setWordList(목록)을 먼저 부르거나 checkNickname(이름, 목록)으로 넘겨 주세요.');
  }

  // 통행증 확인: 걸린 자리(start~end)가 허용 낱말 안에 통째로 들어 있으면 봐준다.
  //   「해보지마」: 「보지」가 걸리지만 허용 낱말 「보지마」 안에 들어 있으므로 통과.
  //   「왕보지」: 감싸 주는 허용 낱말이 없으므로 차단.
  function forgiven(text, start, end, allow) {
    for (var i = 0; i < allow.length; i++) {
      var a = allow[i];
      var from = Math.max(0, end - a.length);
      var pos = text.indexOf(a, from);
      while (pos !== -1 && pos <= start) {
        if (pos + a.length >= end) return true;
        pos = text.indexOf(a, pos + 1);
      }
    }
    return false;
  }

  // text 안에서 명단 낱말 찾기. 찾으면 { hit, cat }.
  function findIn(text, items, allow, minLen) {
    if (!text) return null;
    for (var i = 0; i < items.length; i++) {
      var w = items[i].w;
      if (minLen && w.length < minLen) continue;
      var pos = text.indexOf(w);
      while (pos !== -1) {
        if (!forgiven(text, pos, pos + w.length, allow)) return { hit: w, cat: items[i].cat };
        pos = text.indexOf(w, pos + 1);
      }
    }
    return null;
  }

  function findBanned(name, c) {
    var v = views(name);
    var i, r;
    for (i = 0; i < v.plain.length; i++) {
      r = findIn(v.plain[i], c.plain, c.allow);
      if (r) return r;
    }
    for (i = 0; i < v.numeric.length; i++) {
      r = findIn(v.numeric[i], c.numeric, c.allow);
      if (r) return r;
    }
    for (i = 0; i < v.latin.length; i++) {
      r = findIn(v.latin[i], c.latin, c.allow);
      if (r) return r;
      // 통째로 같을 때만 막는 짧은 말: 이름 전체 또는 영문 덩어리 하나가 그 말과 똑같을 때
      //   (이름 전체 비교는 숫자를 남긴 꼴로 한다 — 「2018년」에서 숫자를 빼면 「년」만 남아 잘못 걸리기 때문)
    }
    for (i = 0; i < v.latinExact.length; i++) {
      var chunks = v.numeric.concat(v.latinExact[i].match(/[a-z]+/g) || []);
      for (var k = 0; k < chunks.length; k++) {
        if (Object.prototype.hasOwnProperty.call(c.exact, chunks[k])) return { hit: chunks[k], cat: c.exact[chunks[k]] };
      }
    }
    // 뒤집어 쓴 이름: 세 글자 이상인 한글 낱말만 본다 (두 글자까지 보면 「신병」 같은 멀쩡한 말이 걸린다)
    r = findIn(v.reversed, c.plain, [], 3);
    if (r) return { hit: r.hit, cat: r.cat + ' (뒤집어 씀)' };
    return null;
  }

  /*
   * checkNickname(name, list?) → { ok, reason, hit }
   *   ok     : 써도 되면 true
   *   reason : 'banned'(금지 단어) · 'length'(길이) · 'chars'(허용 안 되는 글자) · null
   *   hit    : 걸린 낱말과 갈래 (운영 기록용 — 이용자에게는 보여 주지 않는 편이 좋다. 보여 주면 피하는 법을 가르치는 셈)
   */
  function checkNickname(name, list) {
    var c = getCompiled(list);
    var raw = unify(name).trim();
    var banned = findBanned(raw, c);
    if (banned) return { ok: false, reason: 'banned', hit: banned.hit, category: banned.cat };
    var len = Array.from ? Array.from(raw).length : raw.length;
    if (len < MIN_LEN || len > MAX_LEN) return { ok: false, reason: 'length', hit: null };
    var okChars = ALLOW_JAMO ? /^[가-힣ㄱ-ㅎㅏ-ㅣa-zA-Z0-9]+$/ : /^[가-힣a-zA-Z0-9]+$/;
    if (!okChars.test(raw)) return { ok: false, reason: 'chars', hit: null };
    return { ok: true, reason: null, hit: null };
  }

  return {
    normalize: normalize,
    checkNickname: checkNickname,
    setWordList: setWordList,
    views: views,           // 시험 · 점검용
    squeeze: squeeze,       // 시험 · 점검용
    cleanWord: function (w) { return composeJamo(strip(unify(w), false)); }, // 목록 낱말 다듬기(반복은 그대로 둠)
    EXACT_CATEGORY: EXACT_CATEGORY
  };
});

  }

    memory[key] = String(value);

  }

    delete memory[key];

  /* ---------- 점 글씨: 5×7칸(숫자 · 「연승」 · 「최고」 · 왕관 · 소리 끔 ×) ---------- */

  const SMALL = {

  const HUD_ROW_H = 5;          // 작은 줄 하나의 높이(칸)
  const HUD_MS_Y = HUD_Y + HUD_ROW_H + 1; // 「번개 + 최고 반응 속도」 줄 위 끝(왕관 줄 바로 아래, 한 줄 띄움)
  const STREAK_Y = HUD_MS_Y + HUD_ROW_H + 2; // 「N연승」 위 끝(번개 줄 5칸 + 한 줄 띄움 + 글자 뒤 검은 둘레 한 줄 아래)
  function measure(keys, font = GLYPHS) {

  // 글자 그림 한 장을 칸 크기 cell로 찍는다

  // 반응 시간 글자: 1/1000초 정수 → 「0.231」

  /* ---------- 시계: 게임 안의 모든 시간은 이 함수 하나만 읽는다 ----------
     평소 = 실제 시계(performance.now). 검사용 tick()을 부르면 「손으로 돌리는 시계」(manual)로 바뀐다.
     offset = 손으로 돌리던 시계에서 실제 시계로 돌아올 때, 시간이 끊기지 않게 더해 두는 값 */
  let manual = null;
  let offset = 0;

  }

  /* ---------- 상태 ---------- */
  let skin = loadSkin();
  let autoDuel = false;     // 들어오자마자 저절로 시작한 판(안 누르고 지면 연승을 깎지 않는다 — 게임을 넘겨 다니다 연승이 사라지지 않게)
  let firstDuel = true;     // 게임에 들어와 아직 한 판도 시작 안 함(첫 판만 신호가 3초 안에)

  let streak = loadInt(KEYS.streak) || 0;

  if (bestMs !== null && bestMs > 9999) bestMs = null; // 저장값이 망가져 터무니없이 크면(10초 이상) 기록이 없는 것으로 친다 — 왼쪽 위 번개 줄이 길게 늘어나 가운데 해골 자리를 넘보지 않게

  // 지금 두 사람의 자세

  // record = 방금 끝난 연승이 곧 최고 기록, on = 왕관이 지금 켜져 있는지(record일 때만 깜빡인다)
  function bestLineNow() {

    const record = endedStreak > 0 && streak === 0 && endedStreak === best;

  }

  /* ---------- 대결 흐름 ---------- */
  function startDuel(t) {
    phase = 'wait';
    autoDuel = false;
    startT = t;
    const [lo, hi] = firstDuel ? [FIRST_WAIT_MIN, FIRST_WAIT_MAX] : [WAIT_MIN, WAIT_MAX];
    waitMs = fixedWait !== null ? fixedWait : lo + Math.floor(Math.random() * (hi - lo + 1));
    firstDuel = false;

  function fire(t) {

  // 왼쪽 키(RE · R) = 다음 판 / 새 판. 비유: 「한 판 더」 버튼 — 점수판(연승)은 건드리지 않는다.

  // 기다리는 중 · 신호 중이면 그 판을 무르고 새 결투(연승 그대로, 반칙 아님).
  // 결과 직후 0.4초 안의 누름은 총 키와 똑같이 무시한다
  function restart(t) {

  /* ---------- 실제 시간: 화면이 보이는 동안 매 장면마다 신호 · 상대 · 쓰러짐 · 왕관 깜빡임을 챙긴다 ---------- */
  let rafId = 0;

  const needsLoop = () => manual === null && !document.hidden &&

  function loop() {
    rafId = 0;
    if (manual !== null || document.hidden) return;

    if (phase !== 'ready') render(); // 노려보는 동안 = 굴러가는 풀 · 「나」 표시, 결과 = 쓰러지는 그림 · 깜빡이는 왕관

  }

    if (rafId || !needsLoop()) return;
    rafId = requestAnimationFrame(loop);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { releaseAllKeys(); cancelDuel(); return; }
    // 뒤쪽 탭으로 열려서 아직 첫 판을 못 했으면, 화면이 보이는 순간 첫 판을 시작한다
    if (firstDuel && phase === 'ready' && manual === null && !overlayOpen()) { startDuel(now()); autoDuel = true; return; }
    render(); startLoop();
  });

  /* ---------- 몸통 색 · 소리 바꾸기 ---------- */
  function setSkin(n) {
    n = Math.floor(Number(n));
    if (!(n >= 0 && n < SKINS.length)) return false;
    skin = n;
    saveRaw(SKIN_KEY, n);
    fit();
    return true;
  }
  const nextSkin = () => setSkin((skin + 1) % SKINS.length);
  // 소리 버튼: 다음 소리로(1 → … → 6 → 끔 → 1). 고른 소리를 한 번 들려준다
  function nextSound() { keepRealSound(() => KeySound.next()); drawSoundBtn(); return KeySound.index; }

  /* ---------- 화면 요소 ---------- */
  const el = {
    main: document.getElementById('main'),
    stage: document.getElementById('stage'),
    screen: document.getElementById('screen'),
    deviceE: document.getElementById('deviceE'),
    bodyArt: document.getElementById('bodyArt'), bodyFill: document.getElementById('bodyFill'), bodyLine: document.getElementById('bodyLine'),
    gameBtn: document.getElementById('gameBtn'), gameCanvas: document.getElementById('gameCanvas'), gameLabel: document.getElementById('gameLabel'),
    soundBtn: document.getElementById('soundBtn'), soundCanvas: document.getElementById('soundCanvas'), soundLabel: document.getElementById('soundLabel'),
    skinBtn: document.getElementById('skinBtn'), skinCanvas: document.getElementById('skinCanvas'), skinLabel: document.getElementById('skinLabel'),
    grip: document.getElementById('grip'),
    keySlide: document.getElementById('keySlide'), keySlideCanvas: document.getElementById('keySlideCanvas'),
    keyPush: document.getElementById('keyPush'), keyPushCanvas: document.getElementById('keyPushCanvas'),
  };
  const dpr = () => window.devicePixelRatio || 1;
  const setGhost = (node, text) => { if (node.textContent !== text) node.textContent = text; };

  // 작은 버튼의 한 칸 크기(화면 점 1.5개)
  const cornerCell = () => Math.max(1, Math.round(1.5 * dpr()));
  function sizeCorner(cv, cw, ch) {
    const r = dpr();
    if (cv.width !== cw || cv.height !== ch) { cv.width = cw; cv.height = ch; }
    cv.style.width = `${cw / r}px`; cv.style.height = `${ch / r}px`;
  }
  // 한 칸짜리 작은 버튼(소리 · 몸통 색) 바탕: 흰 바탕 + 검은 테두리(몸통 색과 상관없이).
  // paint(ctx, 상자 왼쪽 위 x, y, 한 칸 크기)가 가운데 7×9칸 상자 안을 채운다
  function drawOneBox(cv, paint) {
    const ctx = cv.getContext('2d'), cc = cornerCell();
    const cw = ONE_COLS * cc, ch = BTN_ROWS * cc;
    sizeCorner(cv, cw, ch);
    ctx.clearRect(0, 0, cw, ch);
    pixelBlock(ctx, cw, ch, cc, INK);
    pixelFrame(ctx, cw, ch, cc, BG);
    paint(ctx, 3 * cc, Math.floor((BTN_ROWS - BOX_H) / 2) * cc, cc);
  }
  // 소리 버튼: 지금 소리 번호(1~6), 끔이면 ×
  function drawSoundBtn() {
    const i = KeySound.index;
    drawOneBox(el.soundCanvas, (ctx, bx, by, cc) => drawText(ctx, [i ? String(i) : '×'], bx + cc, by + cc, cc, BG));
    setGhost(el.soundLabel, i ? `소리 ${i}` : '소리 끔');
  }
  // 몸통 색 버튼: 상자 하나를 지금 몸통 색으로 칠하고 검은 테두리 한 칸
  function drawSkinBtn() {
    drawOneBox(el.skinCanvas, (ctx, bx, by, cc) => {
      ctx.fillStyle = BG; ctx.fillRect(bx, by, BOX_W * cc, BOX_H * cc);
      ctx.fillStyle = SKINS[skin].body; ctx.fillRect(bx + cc, by + cc, (BOX_W - 2) * cc, (BOX_H - 2) * cc);
    });
    setGhost(el.skinLabel, `몸통 ${SKINS[skin].name}`);
  }

  /* ---------- 기기의 키캡 두 개: 왼쪽 = 다음 판 / 새 판(RE), 오른쪽 = 쏘기(권총 그림) ----------
     비유: 진짜 키보드 키. 누르는 순간 한 번 작동하고, 손을 떼기 전까지는 같은 키든 다른 키든 다시 세지 않는다.
     keyHold = 지금 그 키를 누르고 있는 것(손가락 번호 · 'kb:Space' 같은 키보드 · 'test'), 안 누르면 null
     push = 오른쪽 쏘기 키, slide = 왼쪽 RE 키(예전 이름 그대로 둠) */
  const keyHold = { push: null, slide: null };
  const keyEl = () => ({ push: el.keyPush, slide: el.keySlide });
  const anyKeyDown = () => keyHold.push !== null || keyHold.slide !== null;
  let keyCell = 1;        // 키캡 그림 한 칸이 기기 화면 점 몇 개인지
  let pushFlash = false;  // 검사용 press()로 잠깐 눌린 그림을 보여 주는 중
  let pushFlashTimer = 0;

  function holdKey(name, who, t) {
    if (overlayOpen()) return false; // 넓은 화면(순위 · 내 기록 · 계정)이 떠 있는 동안 키캡 누름은 게임에 들어가지 않는다
    if (anyKeyDown()) return false; // 한 키가 눌려 있는 동안 다른 키는 무시(소리도 안 남)
    keyHold[name] = who;
    pushFlash = false;
    // 키가 눌린 순간 딸깍(검사용 손잡이로 누를 때는 조용히)
    if (who !== 'test') { KeySound.unlock(); KeySound.down(); }
    if (name === 'slide') restart(t); else fire(t);
    drawKeys();
    return true;
  }
  // who를 주면 그 손가락(또는 키보드 키)이 누른 경우에만 뗀다. quiet = 떼는 소리 없이(놓친 누름을 정리할 때 · 창이 가려질 때)
  function releaseKey(name, who, quiet) {
    if (keyHold[name] === null) return false;
    if (who !== undefined && keyHold[name] !== who) return false;
    const silent = quiet || keyHold[name] === 'test';
    keyHold[name] = null;
    if (!silent) KeySound.up();
    drawKeys();
    return true;
  }
  function releaseAllKeys() { releaseKey('push', undefined, true); releaseKey('slide', undefined, true); }
  function flashPushKey() {
    if (anyKeyDown()) return;
    pushFlash = true; drawKeys();
    clearTimeout(pushFlashTimer);
    pushFlashTimer = setTimeout(() => { pushFlash = false; drawKeys(); }, 90);
  }

  // 키 하나: 여섯 게임이 함께 쓰는 도트 키캡 그림(KeyArt.pixel)을 그대로 부른다.
  // 그림 종이(캔버스)는 20칸 × 정수 점 크기로 맞춰 두고, kind = 윗면 그림('gun' 권총 · 'RE')
  function paintKey(cv, down, kind) {
    const n = KEY_CELLS * keyCell;
    if (cv.width !== n || cv.height !== n) { cv.width = n; cv.height = n; }
    KeyArt.pixel(cv.getContext('2d'), n, down, kind);
  }
  function drawKeys() {
    paintKey(el.keyPushCanvas, keyHold.push !== null || pushFlash, 'gun');
    paintKey(el.keySlideCanvas, keyHold.slide !== null, 'RE');
  }

  // 읽어 주는 기능용 글(화면 이름표)
  function syncText() {
    // 진 화면이면 왜 졌는지도 읽어 준다(화면의 해골 · 「반칙」과 같은 뜻)
    const lost = phase !== 'result' ? '' : outcome === 'lose' ? ', 졌다' : outcome === 'foul' ? ', 반칙 — 신호보다 먼저 눌렀다' : '';
    const aria = `서부 결투, 연승 ${streak}${lost}`;
    if (el.screen.getAttribute('aria-label') !== aria) el.screen.setAttribute('aria-label', aria);
  }

  /* ---------- 그리기: 128×96칸 작은 판에 찍은 뒤 그대로 키운다 ---------- */
  const g = el.screen.getContext('2d');
  const board = document.createElement('canvas');
  const c = board.getContext('2d');
  let H = 0;         // 지금 검은 화면 세로 칸 수
  let skyShift = 0;  // 기준 그림을 아래로 내리는 칸 수(늘어난 하늘 몫)

  let ink = null; // 지금 붓 색(같은 색이면 다시 고르지 않아 빠르게)
  function dot(x, y, color) {
    if (x < 0 || x >= W || y < 0 || y >= H) return;
    if (color !== ink) { c.fillStyle = color; ink = color; }
    c.fillRect(x, y, 1, 1);
  }
  function box(x, y, w, h, color) {
    c.fillStyle = color; ink = color;
    c.fillRect(x, y, w, h);
  }
  function sprite(x, y, rows, color = INK, k = 1) {
    rows.forEach((row, j) => {
      for (let i = 0; i < row.length; i += 1) {
        if (row[i] !== '#') continue;
        for (let dy = 0; dy < k; dy += 1) for (let dx = 0; dx < k; dx += 1) dot(x + i * k + dx, y + j * k + dy, color);
      }
    });
  }

  // 세로 칸 수가 바뀌면 그림 전체를 내릴 칸 수를 다시 정한다
  function setRows(rows) {
    if (rows === H) return;
    H = rows;
    board.width = W; board.height = H; ink = null;
    skyShift = Math.round((H - BASE_H) * SKY_SHARE);
  }

  // 점 글씨 한 줄을 판에 찍고, 뒤를 검게 비워 능선 등이 지나가도 읽히게 한다. 차지한 높이(칸)를 돌려준다
  function boardText(keys, x, y, k, font = GLYPHS) {
    const m = measure(keys, font);
    box(x - 1, y - 1, m.w * k + 2, m.h * k + 2, BG);
    let cx = x;
    keys.forEach((key) => {
      sprite(cx, y, font[key], INK, k);
      cx += (font[key][0].length + 1) * k;
    });
    return m.h * k;
  }

  // 왼쪽 위 「왕관 + 최고 연승」 줄이 차지하는 자리(칸): 왕관 7칸 + 두 칸 띄움 + 숫자(한 글자 3칸, 사이 한 칸)
  // 그 바로 아래 「번개 + 최고 반응 속도」 줄도 같은 짜임(번개 7칸 자리 + 두 칸 띄움 + 글자)
  const hudBestKeys = () => ['♛', ...String(best)];
  const hudMsKeys = () => ['⚡', ...msTextNow()];
  // 작은 줄 하나의 폭(칸): 아이콘 + 두 칸 띄움 + 글자들(사이 한 칸)
  function hudRowW(keys) {
    return keys.reduce((w, k, n) => w + SMALL[k][0].length + (n === 0 ? HUD_CROWN_GAP : n < keys.length - 1 ? 1 : 0), 0);
  }
  function hudBestNow() {
    return {
      best, x: HUD_X, y: HUD_Y, w: hudRowW(hudBestKeys()), h: HUD_ROW_H,
      bestMs, msText: msTextNow(),
      msRow: { x: HUD_X, y: HUD_MS_Y, w: hudRowW(hudMsKeys()), h: HUD_ROW_H },
    };
  }
  // 두 줄을 찍는다. 검은 바탕 상자는 깔지 않고, 글자 둘레 한 칸만 검게 비운다
  function drawHudBest() {
    const cells = [];
    [[hudBestKeys(), HUD_Y], [hudMsKeys(), HUD_MS_Y]].forEach(([keys, y]) => {
      let cx = HUD_X;
      keys.forEach((k, n) => {
        const gl = SMALL[k];
        gl.forEach((row, j) => { for (let i = 0; i < row.length; i += 1) if (row[i] === '#') cells.push([cx + i, y + j]); });
        cx += gl[0].length + (n === 0 ? HUD_CROWN_GAP : 1);
      });
    });
    cells.forEach(([x, y]) => { for (let dy = -1; dy <= 1; dy += 1) for (let dx = -1; dx <= 1; dx += 1) dot(x + dx, y + dy, BG); });
    cells.forEach(([x, y]) => dot(x, y, INK));
  }

  // 왼쪽 위 큰 「N연승」이 차지하는 자리(칸): 숫자는 두 배 크기, 「연승」은 한 배 크기로 숫자 바닥에 붙는다.
  // 숫자가 길어 위 가운데 자리(MARK_LEFT_MIN번째 칸부터)를 넘보게 되면 숫자도 한 배로
  function streakBoxNow() {
    const bw = measure([...String(streak)]).w, uw = measure(['연', '승']).w;
    const k = (HUD_X + bw * 2 + 2 + uw < MARK_LEFT_MIN) ? 2 : 1;
    return { x: HUD_X, y: STREAK_Y, w: bw * k + 2 + uw, h: 7 * k, k, bw };
  }
  // 진 화면 한가운데 위쪽 표시가 차지하는 자리(칸). 해골 크기는 SKULL 배열에서 읽는다.
  // 맞아서 짐 = 해골 하나를 가운데, 반칙 = 해골 · 틈 · 「반칙」을 한 줄로 묶어 가운데
  // (「반칙」은 두 배 크기, 그러면 왼쪽 위 기록 줄 자리를 넘볼 때만 한 배로)
  function markBoxNow() {
    const mark = markNow();
    if (mark !== 'skull' && mark !== 'skull-foul') return null;
    const top = MARK_Y + skyShift, sw = SKULL[0].length, sh = SKULL.length;
    if (mark === 'skull') return { skull: { x: Math.floor((W - sw) / 2), y: top, w: sw, h: sh }, word: null, k: 0 };
    const m = measure(FOUL_WORD);
    const k = Math.floor((W - (sw + FOUL_GAP + m.w * 2)) / 2) >= MARK_LEFT_MIN ? 2 : 1;
    const x0 = Math.floor((W - (sw + FOUL_GAP + m.w * k)) / 2);
    return {
      skull: { x: x0, y: top, w: sw, h: sh },
      word: { x: x0 + sw + FOUL_GAP, y: top + Math.floor((sh - m.h * k) / 2), w: m.w * k, h: m.h * k },
      k,
    };
  }
  // 진 화면의 왕관 + 「최고 N연승」 줄이 차지하는 자리(칸): 해골 아래 가운데.
  // 두 배 크기가 화면 폭을 넘으면(네 자리부터) 한 배로. 방금 끝난 연승이 최고 기록이면 왕관이 깜빡인다
  function bestLineBoxNow() {
    const bl = bestLineNow();
    if (!bl) return null;
    const keys = [bl.on ? '♛' : '♛off', ' ', '최', '고', ' '].concat([...String(bl.best)], ['연', '승']);
    const m = measure(keys), k = m.w * 2 <= W - 8 ? 2 : 1;
    return { keys, k, x: Math.floor((W - m.w * k) / 2), y: MARK_Y + skyShift + BEST_LINE_GAP, w: m.w * k, h: m.h * k };
  }

  // 총잡이 한 명: anchor = 몸 한가운데 열, right = 오른쪽을 보는지(나), gy = 땅 줄.
  // 둘레를 한 칸 검게 비워 능선 위에 겹쳐도 몸이 또렷하게 보이게 한다. 상대(right = false)는 검은 모자
  function drawPerson(anchor, right, pose, gy) {
    const { rows, ax } = (right ? POSES : OPP_POSES)[pose];
    const hat = right ? HAT : OPP_HAT;
    const top = gy - rows.length;
    const sx = (i) => (right ? anchor - ax + i : anchor + ax - i);
    const cells = [];
    rows.forEach((row, j) => { for (let i = 0; i < row.length; i += 1) if (row[i] === '#') cells.push([sx(i), top + j]); });
    if (pose === 'shoot') FLASH.forEach(([i, j]) => cells.push([sx(i), top + j]));
    cells.forEach(([x, y]) => { for (let dy = -1; dy <= 1; dy += 1) for (let dx = -1; dx <= 1; dx += 1) dot(x + dx, y + dy, BG); });
    cells.forEach(([x, y]) => dot(x, y, INK));
    // 넘어가는 중 = 모자가 공중에, 누움 = 모자가 등 뒤 땅에
    if (pose === 'fall' || pose === 'down') {
      const hx = right ? anchor - 9 : anchor + 9 - (hat[0].length - 1);
      sprite(hx, pose === 'fall' ? gy - 12 : gy - hat.length, hat);
    }
  }

  /* ---------- 기다리는 동안: 굴러가는 마른 풀 덩어리 하나만 ----------
     비유: 서부 영화에서 결투 전 정적을 채우는 장면. 결투가 시작된 뒤 흐른 시간만 보고 그리므로
     (무작위는 판마다 방향 하나뿐) 검사용 손 시계로 돌려도 같은 그림이 나온다.
     노려보는 동안 · 신호가 뜬 동안만 보이고, 결과가 나면 사라진다.
     (하늘을 스치던 바람 줄은 시선을 뺏어서 뺐다) */
  function windNow() {
    if (phase !== 'wait' && phase !== 'signal') return null;
    const t = now() - startT - TUMBLE_LEAD_MS;
    if (t < 0) return null;
    const n = Math.floor(t / TUMBLE_EVERY_MS), within = t - n * TUMBLE_EVERY_MS;
    if (within >= TUMBLE_ROLL_MS) return null; // 다음 덩어리까지 잠깐 조용
    const dir = n % 2 === 0 ? windDir : -windDir; // 덩어리마다 방향을 번갈아
    const span = W + 4 * TUMBLE_R + 4;            // 화면 밖에서 나와 화면 밖으로 사라질 때까지
    const dist = (within / TUMBLE_ROLL_MS) * span;
    const x = Math.round(dir > 0 ? -2 * TUMBLE_R - 2 + dist : W + 2 * TUMBLE_R + 1 - dist);
    const hop = (within % TUMBLE_HOP_MS) / TUMBLE_HOP_MS;
    const lift = Math.round(TUMBLE_HOP * Math.sin(Math.PI * hop)); // 통통: 땅에 닿았다 튀어 오름
    return { x, lift, angle: (dir * dist) / TUMBLE_R, dir };
  }
  // 덩어리: 둘레를 검게 비운 뒤 둥근 테두리 + 굴러간 만큼 도는 잔가지 세 갈래 + 삐져나온 잔가지 둘
  function drawTumble(w, gy) {
    const cx = w.x, cy = gy - 1 - TUMBLE_R - w.lift;
    for (let y = -TUMBLE_R - 1; y <= TUMBLE_R + 1; y += 1) {
      for (let x = -TUMBLE_R - 1; x <= TUMBLE_R + 1; x += 1) if (Math.hypot(x, y) <= TUMBLE_R + 1.2) dot(cx + x, cy + y, BG);
    }
    TUMBLE_RING.forEach(([x, y]) => dot(cx + x, cy + y, INK));
    for (let s = 0; s < 3; s += 1) {
      const a = w.angle + (s * 2 * Math.PI) / 3;
      for (let rr = 1; rr < TUMBLE_R; rr += 1) dot(cx + Math.round(Math.cos(a) * rr), cy + Math.round(Math.sin(a) * rr), INK);
    }
    [0.5, 0.5 + Math.PI].forEach((off) => {
      const a = w.angle + off;
      dot(cx + Math.round(Math.cos(a) * (TUMBLE_R + 1)), cy + Math.round(Math.sin(a) * (TUMBLE_R + 1)), INK);
    });
  }
  // 「나」 표시가 떠 있는지: 결투가 시작되고 1.5초 동안
  const meMarkNow = () => (phase === 'wait' || phase === 'signal') && now() - startT < ME_MARK_MS;

  function render() {
    const oy = skyShift, gy = GROUND_Y + oy;
    box(0, 0, W, H, BG);

    // 해
    sprite(SUN_X, SUN_Y + oy, SUN);
    // 먼 바위산 능선: 칸 사이가 끊기지 않게 세로로 이어 준다
    for (let x = 0; x < W; x += 1) {
      const y = RIDGE_TOP[x], prev = x > 0 ? RIDGE_TOP[x - 1] : y;
      for (let yy = Math.min(y, prev + 1); yy <= Math.max(y, prev - 1); yy += 1) dot(x, yy + oy, INK);
    }
    // 선인장
    CACTI.forEach(([x, rows]) => sprite(x, gy - rows.length, rows));
    // 땅 속 자갈 점
    const tw = GROUND_TEX[0].length, th = GROUND_TEX.length;
    for (let y = gy + 2; y < H; y += 1) {
      for (let x = 0; x < W; x += 1) if (GROUND_TEX[(y - gy) % th][x % tw] === '#') dot(x, y, INK);
    }
    // 굴러가는 풀(노려보는 동안): 사람보다 먼저 그려서, 덩어리가 사람 앞을 지나도 사람은 그대로 또렷하게(사람 둘레 비움이 덮는다)
    const w = windNow();
    if (w) drawTumble(w, gy);
    // 두 사람(나 = 왼쪽 끝, 상대 = 오른쪽 끝)
    const p = poses();
    drawPerson(ME_X, true, p.me, gy);
    drawPerson(OPP_X, false, p.opp, gy);
    // 평평한 땅 줄(사람 둘레 비움에 지워지지 않게 사람 다음에)
    box(0, gy, W, 1, INK);

    // 신호: 화면 한가운데 위쪽
    if (markNow() === '!') sprite(Math.floor((W - BANG[0].length) / 2), MARK_Y + oy, BANG);
    // 진 화면: 같은 자리에 큰 해골(맞아서 짐 · 반칙 둘 다). 반칙이면 해골 오른쪽에 「반칙」
    const mb = markBoxNow();
    if (mb) {
      sprite(mb.skull.x, mb.skull.y, SKULL);
      if (mb.word) boardText(FOUL_WORD, mb.word.x, mb.word.y, mb.k);
    }
    // 이긴 화면: 내 반응 시간을 신호가 있던 한가운데 위쪽에 크게
    const tt = timeTextNow();
    if (tt) {
      const keys = [...tt], m = measure(keys);
      // 왼쪽 위 「N연승」이 두 자리 이상으로 길어지면 가운데 숫자와 맞닿는다 → 연승 글자 오른쪽 끝에서 네 칸 띄운 자리까지 오른쪽으로 민다.
      // 그래도 오른쪽 위 해와 닿게 되면 숫자를 한 배 크기로 줄인다(안전장치 — 연승이 아주 길 때만. 세 자리 연승은 「N연승」이 한 배로 줄어 닿지 않는다)
      const sbx = streakBoxNow(), leftMin = sbx.x + sbx.w + 4;
      let tk = 2, tx = Math.max(Math.floor((W - m.w * 2) / 2), leftMin);
      if (tx + m.w * 2 > SUN_X - 2) { tk = 1; tx = Math.max(Math.floor((W - m.w) / 2), leftMin); }
      boardText(keys, tx, MARK_Y + oy + 3, tk);
    }
    // 지거나 반칙한 결과: 해골 아래 가운데에 왕관 + 「최고 N연승」
    const bb = bestLineBoxNow();
    if (bb) boardText(bb.keys, bb.x, bb.y, bb.k);

    // 왼쪽 위 = 지금 연승 「N연승」: 숫자는 칸 두 배 크기, 「연승」은 한 배 크기로 숫자 바닥에 맞춰 붙인다
    const sb = streakBoxNow();
    boardText([...String(streak)], sb.x, sb.y, sb.k);
    boardText(['연', '승'], sb.x + sb.bw * sb.k + 2, sb.y + sb.h - 7, 1);
    // 그 위 두 줄 = 왕관 + 최고 연승 숫자, 번개 + 최고 반응 속도(언제나 — 기다릴 때 · 신호 때 · 결과 화면 모두,
    // 0이어도 「왕관 0」, 기록이 없어도 「번개 -.---」). 글자 둘레 한 칸만 검게 비운다(뒤 그림이 지나가도 읽히게)
    drawHudBest();

    // 「나」 표시: 결투가 시작되면 1.5초 동안 왼쪽 사람(나) 모자 위 한 칸 띄워서. 뒤만 검게 비운다(모자 쪽은 안 지움)
    if (meMarkNow()) {
      const mx = ME_X - Math.floor(ME_MARK[0].length / 2), my = gy - STAND.length - 1 - ME_MARK.length;
      box(mx - 1, my, ME_MARK[0].length + 2, ME_MARK.length, BG);
      sprite(mx, my, ME_MARK);
    }

    // 작은 판을 큰 그림판에 옮긴다
    g.imageSmoothingEnabled = false;
    g.drawImage(board, 0, 0, el.screen.width, el.screen.height);
  }

  /* ---------- 몸통 겉모양: 위 두 모서리는 둥글게, 아래 두 모서리는 비스듬히 깎기 ----------
     inset = 바깥선에서 안으로 들어온 거리(검은 몸통의 안쪽 흰 선을 그릴 때 씀) */
  function bodyPath(w, h, rad, bevel, inset) {
    const i = inset, R = Math.max(0, rad - i), B = Math.max(0, bevel - i * 0.41);
    const x0 = i, y0 = i, x1 = w - i, y1 = h - i;
    return `M ${x0} ${y0 + R} A ${R} ${R} 0 0 1 ${x0 + R} ${y0} L ${x1 - R} ${y0} A ${R} ${R} 0 0 1 ${x1} ${y0 + R} `
      + `L ${x1} ${y1 - B} L ${x1 - B} ${y1} L ${x0 + B} ${y1} L ${x0} ${y1 - B} Z`;
  }
  function drawBody(dw, dh, rad, bevel) {
    const sk = SKINS[skin];
    el.bodyArt.setAttribute('viewBox', `0 0 ${dw} ${dh}`);
    el.bodyArt.setAttribute('width', dw); el.bodyArt.setAttribute('height', dh);
    el.bodyFill.setAttribute('d', bodyPath(dw, dh, rad, bevel, 0));
    el.bodyFill.setAttribute('fill', sk.body);
    if (sk.line) {
      el.bodyLine.setAttribute('d', bodyPath(dw, dh, rad, bevel, 1)); // 굵기 2 선의 가운데를 1 안쪽에 → 바깥선 안쪽 0~2점
      el.bodyLine.setAttribute('stroke', INK); el.bodyLine.setAttribute('stroke-width', '2');
    } else {
      el.bodyLine.removeAttribute('d');
    }
  }

  // 오돌토돌한 띠: 본보기 기기 아래쪽 회색 띠. 모서리 둥근 직사각형을 띠 색으로 칠하고, 몸통 색 점을 흩뿌린다
  function drawGrip(gw, gh) {
    const cv = el.grip, r = dpr(), ctx = cv.getContext('2d'), sk = SKINS[skin];
    const w = Math.max(1, Math.round(gw * r)), h = Math.max(1, Math.round(gh * r));
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    cv.style.width = `${w / r}px`; cv.style.height = `${h / r}px`;
    ctx.clearRect(0, 0, w, h);
    const rr = Math.min(h / 2, Math.round(h * 0.3));
    ctx.beginPath();
    ctx.moveTo(rr, 0); ctx.lineTo(w - rr, 0); ctx.arcTo(w, 0, w, rr, rr); ctx.lineTo(w, h - rr); ctx.arcTo(w, h, w - rr, h, rr);
    ctx.lineTo(rr, h); ctx.arcTo(0, h, 0, h - rr, rr); ctx.lineTo(0, rr); ctx.arcTo(0, 0, rr, 0, rr); ctx.closePath();
    ctx.fillStyle = sk.grip; ctx.fill();
    // 점 무늬(여섯 게임 같은 규칙): 점 하나 = 화면 점 2개, 가로 6 · 세로 4 간격, 한 줄 걸러 반 칸 어긋나게
    ctx.save(); ctx.clip();
    const p = Math.max(1, Math.round(2 * r));
    ctx.fillStyle = sk.body;
    for (let row = 0, y = 2 * p; y + p <= h - 2 * p; row += 1, y += 2 * p) {
      for (let x = 2 * p + (row % 2 ? Math.round(1.5 * p) : 0); x + p <= w - 2 * p; x += 3 * p) ctx.fillRect(x, y, p, p);
    }
    ctx.restore();
  }

  /* ---------- 기기 자리 맞추기 ----------
     몸통 폭 dw = min(창 폭 − 28, 460). 위에서부터: 띠(작은 버튼 줄 + 위아래 10) → 검은 화면(128×96칸) → 7% → 키캡 둘(사이 7%) → 7% → 오돌토돌한 띠(7%) → 7%.
     합이 창 높이 − 28을 넘으면 화면 칸 크기부터, 그다음 키캡 크기를 줄인다(키캡은 72 아래로 안 줄임).
     몸통은 창 가운데(받침대 main이 창 전체이고 가운데 정렬) */
  // 창이 낮으면(가로로 눕힌 폰 등) 몸통 폭부터 줄인다 — 폭은 그대로 두고 화면만 줄이면 화면이 점 하나 크기가 된다.
  // 화면 칸 · 키캡을 제 크기로 놓았을 때(위 띠 + 화면 + 키캡 + 틈 넷) 창 높이 안에 들어가는 가장 큰 폭을 찾는다
  function fitWidth(maxW, roomH, band, rows, keyShare) {
    const r = dpr();
    for (let w = maxW; w > 160; w -= 4) {
      const cell = Math.max(1, Math.floor(w * 0.86 * r / 128));
      if (band + (rows * cell) / r + Math.max(72, w * keyShare) + 4 * Math.round(w * 0.07) <= roomH) return w;
    }
    return Math.min(maxW, 160);
  }
  // 기기 밖 윗줄이 설 자리가 없으면(몸통이 창을 가로 · 세로로 꽉 채우는 창), 위아래 여유를 넓혀 한 번 더 맞춘다
  // 윗줄의 점 크기(--m): 글꼴 점 하나가 기기 화면 점의 정수 배가 되어야 글씨가 고르게 찍힌다.
  // 큰 윗줄 = 그런 크기 가운데 글씨 16px에 가장 가까운 것(화면 점 3배 기기 16px · 2배 18px · 1.5배 16px · 1배 12px),
  // 작은 윗줄 = 12px에 가장 가까운 것(1 · 2 · 3배 기기에서 12px). 1배 화면에서는 둘이 같은 12px이 된다
  const topBigM = () => Math.max(1, Math.round((4 / 3) * dpr())) / dpr();
  const topSmallM = () => Math.max(1, Math.round(dpr())) / dpr();
  // 그 윗줄이 서려면 남겨야 하는 위아래 여유(양쪽 합): 윗줄 높이(24 × m) + 틈(8) + 가장자리(4)의 두 배 + 반올림 여유 8
  const topRoom = (m) => (24 * m + 8 + 4) * 2 + 8;
  // 세로로 긴 창(높이 600 이상)에서는 윗줄이 큰 글씨로 서도록 여유를 더 넉넉히 잡는다(몸통이 그만큼 줄어도 된다)
  const BIG_MIN_H = 600;
  let mePlaced = true;
  let topM = 1;         // 윗줄이 지금 선 크기(점 하나의 크기)
  function fit() {
    if (lbFrozen()) return; // 이름을 치는 동안(폰 글자판이 올라와 창 높이가 줄어도) 기기 크기를 다시 맞추지 않는다
    fitOnce(0);
    const tall = window.innerHeight >= BIG_MIN_H && window.innerHeight > window.innerWidth;
    const big = topBigM();
    if (tall && (!mePlaced || topM !== big)) fitOnce(topRoom(big));
    if (!mePlaced) fitOnce(topRoom(topSmallM()));
    placeAcct(); // 계정 창이 떠 있으면 검은 화면 칸의 새 자리에 다시 맞춘다
  }
  function fitOnce(room) {
    const r = dpr(), rows = ROWS, cc = cornerCell();
    drawGameBtn(); drawSoundBtn(); drawSkinBtn();
    const btnH = (BTN_ROWS * cc) / r;
    const band = btnH + 2 * BAND_PAD;

    const mb = el.main.getBoundingClientRect();
    const limitH = mb.height - Math.max(EDGE, room);
    const dw = fitWidth(Math.max(120, Math.floor(Math.min(mb.width - EDGE, DEVICE_MAX))), limitH, band, rows, KEY_SHARE_TWO);
    const gap = Math.round(dw * GAP_SHARE);
    const gh = gap; // 띠 높이 = 몸통 폭의 7%

    // 키캡 크기: 20칸 × 정수 점이 되는 크기 중 목표(몸통 폭의 34%)에 가장 가까운 것, 72 ~ 190 사이
    const want = dw * KEY_SHARE_TWO;
    let kc = 0, nearest = Infinity;
    for (let n = 1; KEY_CELLS * n / r <= KEY_MAX + 0.01; n += 1) {
      const size = KEY_CELLS * n / r;
      if (size >= KEY_MIN - 0.01 && Math.abs(size - want) < nearest) { kc = n; nearest = Math.abs(size - want); }
    }
    if (!kc) kc = Math.max(1, Math.ceil(KEY_MIN * r / KEY_CELLS));
    const kcMin = Math.ceil((KEY_MIN - 0.01) * r / KEY_CELLS);

    // 검은 화면: 128 × 96칸, 한 칸 = 정수 기기 화면 점
    let cellPx = Math.max(1, Math.floor(dw * SCREEN_SHARE * r / W));
    const total = (cp, k) => band + (rows * cp) / r + gap + (KEY_CELLS * k) / r + gap + gh + gap;
    while (cellPx > 1 && total(cellPx, kc) > limitH) cellPx -= 1;
    while (kc > kcMin && total(cellPx, kc) > limitH) kc -= 1;
    // 몸통을 세로로 길게: 폭의 1.5배까지(창 높이 안에서), 남는 높이를 세 틈(화면~키캡 · 키캡~띠 · 띠~몸통 끝)에 똑같이 나눠 넣는다
    const lift = Math.max(0, Math.floor((Math.min(limitH, Math.round(dw * BODY_TALL)) - total(cellPx, kc)) / 3));
    keyCell = kc;
    const ks = KEY_CELLS * kc / r;
    const sw = (W * cellPx) / r, sh = (rows * cellPx) / r;

    const keyTop = Math.round(band + sh + gap + lift);
    const gripTop = Math.round(keyTop + ks + gap + lift);
    const dh = Math.round(gripTop + gh + gap + lift);

    // 몸통
    const ds = el.deviceE.style, rad = Math.round(dw * CORNER_SHARE), bevel = Math.round(dw * CORNER_SHARE);
    ds.width = `${dw}px`; ds.height = `${dh}px`;
    drawBody(dw, dh, rad, bevel);

    // 위 띠: 왼쪽 끝 = 게임 버튼, 오른쪽 묶음(왼→오) = 소리 → 몸통 색(사이 6점).
    // 양 끝은 몸통 폭의 8%만큼 들여놓되, 몸통이 아주 좁아 두 묶음이 붙을 것 같으면 들여놓는 폭을 줄인다
    const oneW = (ONE_COLS * cc) / r, gameW = (gameCols() * cc) / r;
    const spare = dw - gameW - (2 * oneW + BAND_GAP) - BAND_GAP;
    let side = Math.round(dw * 0.08);
    if (2 * side > spare) side = Math.max(2, Math.floor(spare / 2));
    el.gameBtn.style.left = `${side}px`; el.gameBtn.style.top = `${BAND_PAD}px`;
    [el.skinBtn, el.soundBtn].forEach((b, i) => {
      b.style.left = ''; b.style.right = `${side + i * (oneW + BAND_GAP)}px`; b.style.top = `${BAND_PAD}px`;
    });

    // 검은 화면: 가운데 정렬
    setRows(rows);
    if (el.screen.width !== W * cellPx || el.screen.height !== H * cellPx) { el.screen.width = W * cellPx; el.screen.height = H * cellPx; }
    el.screen.style.width = `${sw}px`; el.screen.style.height = `${sh}px`;
    el.screen.style.left = `${Math.round((dw - sw) / 2)}px`;
    el.screen.style.top = `${Math.round(band)}px`;

    // 키캡 두 개: 둘을 묶어 가운데(왼쪽 = RE, 오른쪽 = 쏘기), 사이 = 몸통 폭의 7%
    const keyGap = gap, rowLeft = Math.round((dw - (2 * ks + keyGap)) / 2);
    [[el.keySlide, el.keySlideCanvas, rowLeft], [el.keyPush, el.keyPushCanvas, Math.round(rowLeft + ks + keyGap)]].forEach(([b, cv, x]) => {
      const n = KEY_CELLS * kc;
      if (cv.width !== n || cv.height !== n) { cv.width = n; cv.height = n; }
      cv.style.width = `${ks}px`; cv.style.height = `${ks}px`;
      b.style.left = `${x}px`; b.style.top = `${keyTop}px`;
      b.style.width = `${ks}px`; b.style.height = `${ks}px`;
    });

    // 오돌토돌한 띠: 가운데
    const gw = Math.round(dw * GRIP_SHARE);
    drawGrip(gw, gh);
    el.grip.style.left = `${Math.round((dw - gw) / 2)}px`; el.grip.style.top = `${gripTop}px`;

    // 기기 밖 윗줄(이름 · 순위 맛보기)을 몸통 자리에 맞춘다
    mePlaced = syncTop();

    drawKeys();
    syncText();
    render();
  }

  /* ---------- 게임 버튼: 위 띠 왼쪽 끝, 누른 숫자 칸의 게임으로 바로 간다 ----------
     비유: TV 리모컨 숫자 버튼. 1 시지프스 · 2 10.00000 · 3 결투 · 4 100m · 5 퍼덕 · 6 멀리뛰기 · 7 100연승 · 8 무궁화꽃 중 누른 번호로 곧장.
     여덟 게임은 같은 전시장의 옆 폴더라서 「한 칸 위 폴더 → 옆 폴더」 주소로 옮겨 간다.
     이 컴퓨터의 폴더 이름(local)과 인터넷 전시장의 폴더 이름(web)이 달라서 둘 다 적어 두고,
     지금 열린 폴더 이름이 어느 쪽인지 보고 같은 쪽 이름으로 간다.
     키보드 바로 가기는 두지 않는다(100m의 F · J 사이 G처럼, 달리다 스치면 판이 날아가서) */
  function gameHere() { return '3'; }
  function gameList() {
    return [
      { id: '1', name: '시지프스', local: 'streak-sisyphus', web: 'hold-on-sisyphus' },
      { id: '2', name: '10.00000', local: 'key-ten', web: 'hold-on-key-ten' },
      { id: '3', name: '결투', local: 'key-duel', web: 'hold-on-key-duel' },
      { id: '4', name: '100m', local: 'key-100m', web: 'hold-on-key-100m' },
      { id: '5', name: '퍼덕', local: 'key-flap', web: 'hold-on-key-flap' },
      { id: '6', name: '멀리뛰기', local: 'key-leap', web: 'hold-on-key-leap' },
      { id: '7', name: '100연승', local: 'key-streak', web: 'hold-on-key-streak' },
      { id: '8', name: '무궁화꽃', local: 'key-redlight', web: 'hold-on-key-redlight' },
    ];
  }
  // 게임 버튼 폭(칸): 여백 3 + 숫자 상자 여섯(사이 한 칸) + 여백 3
  function gameCols() { return 3 + gameList().length * (GAME_BOX_W + 1) - 1 + 3; }
  function gameUrl(id) {
    const list = gameList(), target = list.find((g) => g.id === String(id));
    if (!target) return null;
    // 지금 폴더 이름: …/hold-on-key-ten/ → hold-on-key-ten, …/key-ten/index.html → key-ten
    const parts = location.pathname.split('/').filter(Boolean);
    if (parts.length && /\.html?$/i.test(parts[parts.length - 1])) parts.pop();
    const here = decodeURIComponent(parts[parts.length - 1] || '');
    const onWeb = list.some((g) => g.web === here);
    return onWeb ? `../${target.web}/` : `../${target.local}/index.html`;
  }
  // 넘어간 게임마다 뒤로 가기 기록이 쌓이지 않게 지금 칸을 바꿔 끼운다. 지금 게임 번호면 아무 일 없음
  function goGame(id) {
    if (String(id) === gameHere()) return false;
    const url = gameUrl(id);
    if (!url) return false;
    location.replace(url);
    return true;
  }
  // 그림: 테두리 안에 1~8, 지금 게임 숫자만 검게 칠한 칸에 흰 글씨
  function drawGameBtn() {
    const cv = el.gameCanvas, ctx = cv.getContext('2d'), cc = cornerCell(), list = gameList();
    const cw = gameCols() * cc, ch = BTN_ROWS * cc;
    sizeCorner(cv, cw, ch);
    ctx.clearRect(0, 0, cw, ch);
    pixelBlock(ctx, cw, ch, cc, INK); // 몸통 색과 상관없이 흰 바탕
    pixelFrame(ctx, cw, ch, cc, BG);
    list.forEach((g, i) => {
      const bx = (3 + i * (GAME_BOX_W + 1)) * cc, by = Math.floor((BTN_ROWS - GAME_BOX_H) / 2) * cc;
      if (g.id === gameHere()) {
        ctx.fillStyle = BG; ctx.fillRect(bx, by, GAME_BOX_W * cc, GAME_BOX_H * cc);
        drawText(ctx, [g.id], bx + cc, by + cc, cc, INK);
      } else {
        drawText(ctx, [g.id], bx + cc, by + cc, cc, BG);
      }
    });
    setGhost(el.gameLabel, `게임 ${gameHere()} ${list.find((g) => g.id === gameHere()).name}`);
  }
  // 버튼 안 가로 위치(화면 점, 버튼 왼쪽 끝 = 0) → 몇 번째 숫자 칸인지.
  // 칸 경계 = 글자 상자 경계, 상자 사이 한 칸 틈은 그 가운데를 기준으로 가까운 칸, 양 끝 여백은 맨 끝 칸
  function gameIndexAt(xCss) {
    const n = gameList().length, cellsX = (xCss * dpr()) / cornerCell();
    const i = Math.floor((cellsX - 3 + 0.5) / (GAME_BOX_W + 1));
    return Math.max(0, Math.min(n - 1, i));
  }
  /* ====================================================================
     순위표
     비유: 오락실 점수판. 게임기는 그대로 두고, 점수판 앞에 문지기(기록을 받아 적고 순위를 알려 주는 사람)를 세운다.
     이 파일에는 진짜 문지기 대신 **가짜 문지기**가 들어 있다 — 인터넷으로 아무것도 보내지 않고,
     지어낸 명단에 내 기록을 끼워 넣어 순위를 세고, 진짜처럼 0.3~0.6초 늦게 대답한다.
     ==================================================================== */

  /* ---------- 가짜 문지기 Board ----------
     게임 쪽은 아래 창구만 부른다. 진짜 문지기로 바꿀 때는 이 덩어리 하나만 갈아 끼우면 된다.
       이름         autoName() 처음 온 사람에게 이름을 지어 준다 · rename(새 이름) · checkName(이름 — 폰에서 먼저 보는 검사)
       판 시작      startRun() → 번호표
       판 끝 보고   endRound(번호표, { streak 연승, reactMs 이긴 판의 반응 시간 })
       순위 읽기    read(순위 종류, 기간) → { rows, total, me }
       계정 일      me() · linkGoogle() · unlinkGoogle() · resetAll()
     대답은 모두 「나중에 오는 약속」(Promise)이다. 주소에 ?offline=1 을 붙이면 모든 대답이 실패한다 */
  const Board = (function () {
    const DEVICE_KEY = LB_PREFIX + 'device';   // 이 기기: 어느 사람에 묶여 있는지
    const SERVER_KEY = LB_PREFIX + 'server';   // 가짜 문지기의 장부: 지어 준 이름 · 구글 연결 · 최고 기록
    const offline = LB_QUERY.get('offline') === '1';
    const TOTAL = { today: 86, all: 1204 };    // 지어낸 명단의 사람 수
    // 자동 이름 재료: 꾸밈말 + 이름말 + 숫자 두 자리(예: 빠른감자27). 모두 두 글자라 이름은 여섯 자
    const AUTO_ADJ = ['빠른', '날쌘', '졸린', '착한', '작은', '둥근', '푸른', '하얀', '맑은', '느린', '밝은', '고운'];
    const AUTO_NOUN = ['감자', '호두', '참새', '구름', '보리', '두부', '만두', '수달', '고래', '자두', '토끼', '여우'];
    const POOL = ['닉네임여덟글자임', 'mushrm7', '오늘도야근', '엄지하나로', '응응', '결투왕', 'NO1', '감자튀김', '퇴근하고싶다', 'sonic99',
      '번개손', '한판만더', 'zzz', '고양이발바닥', '7연패중', '라면물조절', 'K2', '선인장', '느린손가락', 'BEST',
      '월요일싫어', '콩나물국밥', 'ab', '도전자', '새벽네시', 'pixel', '엄마가불러', '탕수육부먹', '0000', '마지막한판', 'GG', '치즈돈까스'];
    // 이름으로 못 쓰는 정치인 실명(견본): 순위표가 싸움터가 되지 않게 전 · 현직 대통령과 주요 정치인 이름을 막는다
    const POLITICIANS = ['이승만', '윤보선', '박정희', '최규하', '전두환', '노태우', '김영삼', '김대중', '노무현', '이명박', '박근혜', '문재인', '윤석열', '이재명',
      '한동훈', '이준석', '조국', '안철수', '홍준표', '오세훈', '김문수', '추미애', '이낙연', '심상정'];

    // 금지 단어 거르는 함수와 목록(이 파일 위쪽에 원본 그대로 들어 있다). 없으면 길이 · 글자 검사만 한다
    let filterOk = false, wordCount = 0;
    try {
      const words = window.__NICK_WORDS__;
      if (window.NicknameFilter && words && words.categories) {
        words.categories['정치인 실명'] = POLITICIANS;
        window.NicknameFilter.setWordList(words);
        wordCount = Object.keys(words.categories).reduce((n, k) => n + words.categories[k].length, 0);
        filterOk = true;
      }
    } catch (e) { filterOk = false; }

    let clock = () => Date.now(); // 문지기 시계(시뮬레이션에서는 게임 시계를 끼워 쓴다)
    const readJson = (key) => { try { const v = JSON.parse(loadRaw(key)); return v && typeof v === 'object' ? v : null; } catch (e) { return null; } };
    let device = readJson(DEVICE_KEY) || { pid: null };
    let server = readJson(SERVER_KEY) || { seq: 0, accounts: [] };
    if (!Array.isArray(server.accounts)) server = { seq: 0, accounts: [] };
    const save = () => { saveRaw(DEVICE_KEY, JSON.stringify(device)); saveRaw(SERVER_KEY, JSON.stringify(server)); };
    const account = () => server.accounts.find((a) => a.id === device.pid) || null;
    // 「오늘」 = 한국 시각 자정 기준 날짜
    const dayKey = () => new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);

    // 지어낸 명단: i번째 사람의 이름(2~8자). 한 바퀴 돌면 뒤에 숫자를 붙인다
    function nameAt(i) {
      const base = POOL[i % POOL.length], round = Math.floor(i / POOL.length);
      if (!round) return base;
      const tail = String(round + 1);
      return Array.from(base).slice(0, 8 - tail.length).join('') + tail;
    }
    const rosterNames = {};
    for (let i = 0; i < TOTAL.all; i += 1) rosterNames[nameAt(i).toLowerCase()] = true;
    // 지어낸 기록: 연승은 1등 17연승부터 줄어들고, 반응은 1등 0.187초부터 느려진다. 오늘 명단은 전체 명단에서 14명에 한 명씩 뽑은 사람들
    const slot = (period, r) => (period === 'today' ? r * 14 : r);
    function rosterValue(metric, period, r) {
      const q = slot(period, r);
      return metric === 'react' ? Math.round(187 + (400 * (q - 1)) / 1203) : Math.max(1, Math.round(17 / (1 + (q - 1) * 0.02)));
    }
    const better = (metric, a, b) => (metric === 'react' ? a < b : a > b);
    function bestOf(acc, metric, period) {
      const s = acc.bests && acc.bests[metric];
      if (!s) return null;
      if (period === 'all') return s.all || null;
      return s.day === dayKey() ? s.today || null : null;
    }
    // 순위표 한 장 만들기: 지어낸 명단 + 장부에 있는 사람들의 기록을 줄 세운다. 동점은 먼저 낸 사람이 위
    function buildBoard(metric, period) {
      const list = [];
      for (let r = 1; r <= TOTAL[period]; r += 1) list.push({ name: nameAt(slot(period, r) - 1), v: rosterValue(metric, period, r), at: 0, me: false });
      server.accounts.forEach((a) => {
        const b = bestOf(a, metric, period);
        if (b && a.name) list.push({ name: a.name, v: b.v, at: b.at, me: a.id === device.pid });
      });
      list.sort((x, y) => (x.v === y.v ? x.at - y.at : better(metric, x.v, y.v) ? -1 : 1));
      let me = null;
      const rows = list.map((row, i) => {
        const e = { rank: i + 1, name: row.name, score: metric === 'react' ? (row.v / 1000).toFixed(3) : String(row.v), me: row.me };
        if (row.me) me = e;
        return e;
      });
      return { metric, period, rows, total: rows.length, me };
    }

    // 이름 검사(폰에서 먼저, 문지기가 한 번 더): 길이 → 글자 종류 → 금지 단어. why = length · chars · banned
    function checkName(input) {
      let s = String(input === null || input === undefined ? '' : input);
      try { s = s.normalize('NFKC'); } catch (e) { /* 그대로 */ }
      s = s.trim();
      const len = Array.from(s).length;
      if (len < 2 || len > 8) return { ok: false, why: 'length', name: s };
      if (!/^[가-힣a-zA-Z0-9]+$/.test(s)) return { ok: false, why: 'chars', name: s };
      if (filterOk) {
        const r = window.NicknameFilter.checkNickname(s);
        if (!r.ok) return { ok: false, why: r.reason === 'length' || r.reason === 'chars' ? r.reason : 'banned', name: s };
      }
      return { ok: true, why: null, name: s };
    }
    // 같은 이름(영문 대소문자는 같게 봄): 지어낸 명단과 장부의 이름
    const taken = (name, selfId) => {
      const low = name.toLowerCase();
      return !!rosterNames[low] || server.accounts.some((a) => a.id !== selfId && a.name && a.name.toLowerCase() === low);
    };
    // 자동 이름 하나 짓기: 이름 규칙(2~8자 · 금지 단어)과 같은 이름 검사를 통과할 때까지 다시 뽑는다. 못 지으면 null
    const pickOf = (list) => list[Math.floor(Math.random() * list.length)];
    function makeName() {
      for (let i = 0; i < 200; i += 1) {
        const c = checkName(pickOf(AUTO_ADJ) + pickOf(AUTO_NOUN) + String(20 + Math.floor(Math.random() * 80)));
        if (c.ok && !taken(c.name, null)) return c.name;
      }
      return null;
    }
    // 늦게 오는 대답 흉내: 0.3~0.6초 뒤(ms를 주면 그만큼 뒤). 연결 없음이면 실패
    const later = (work, ms) => new Promise((resolve, reject) => {
      setTimeout(() => {
        if (offline) { reject({ offline: true }); return; }
        try { resolve(work()); } catch (e) { reject(e); }
      }, slow !== null ? Math.max(slow, ms || 0) : ms === undefined ? 300 + Math.floor(Math.random() * 301) : ms);
    });
    // 검사용 값 셋. 열기 전에 걸어야 하는 것은 주소로도 건다: ?slow=1500(대답을 그만큼 늦게) · ?noname=2(자동 이름 짓기를 그 횟수만큼 실패)
    const queryInt = (key) => { const v = Math.floor(Number(LB_QUERY.get(key))); return v > 0 ? v : 0; };
    let slow = queryInt('slow') || null; // 대답을 일부러 더 늦게(1/1000초). null이면 평소대로
    let failReads = 0;                   // 다음 순위 읽기 몇 번을 일부러 실패시킬지
    let failNames = queryInt('noname');  // 다음 자동 이름 짓기 몇 번을 일부러 실패시킬지
    const meNow = () => { const a = account(); return a ? { id: a.id, name: a.name, google: !!a.google } : null; };

    return {
      offline, total: TOTAL,
      filterReady: () => filterOk, wordCount: () => wordCount,
      setClock(fn) { clock = fn; },
      setDelay(ms) { slow = ms === null || ms === undefined ? null : Math.max(0, Number(ms) || 0); },
      me: meNow,
      checkName,
      isTaken: (name) => taken(String(name), device.pid),
      // 처음 온 사람: 이름을 지어 주고 이 기기에 묶는다(이미 이름이 있으면 그 이름을 돌려준다)
      autoName() {
        return later(() => {
          const had = account();
          if (had) return { ok: true, name: had.name };
          if (failNames > 0) { failNames -= 1; return { ok: false, why: 'taken' }; }
          const name = makeName();
          if (!name) return { ok: false, why: 'taken' };
          server.seq += 1;
          const acc = { id: server.seq, name, google: false, bests: {} };
          server.accounts.push(acc);
          device.pid = acc.id;
          save();
          return { ok: true, name: acc.name };
        });
      },
      rename(input) {
        return later(() => {
          const acc = account();
          if (!acc) return { ok: false };
          const c = checkName(input);
          if (!c.ok) return { ok: false, why: c.why };
          if (taken(c.name, acc.id)) return { ok: false, why: 'taken' };
          acc.name = c.name; save();
          return { ok: true, name: acc.name };
        });
      },
      // 판 시작: 번호표(준 시각이 적힌 쪽지). 이름을 받은 뒤의 첫 승 때 한 장 — 그 전에 쌓은 연승은 세지 않는다
      startRun() { return { t: clock(), n: Math.random() }; },
      // 번호표 이어 쓰기: 폰에 연승과 같이 적어 둔 번호표를 새로 고침 뒤에 다시 꺼낸다(age = 받은 뒤 흐른 시간).
      // 진짜 문지기에서는 도장이 찍힌 번호표를 그대로 다시 내므로 폰이 시간을 고쳐 적을 수 없다
      resumeRun(age) { return { t: clock() - Math.max(0, Number(age) || 0), n: Math.random() }; },
      age: (ticket) => (ticket ? clock() - ticket.t : 0),
      today: dayKey,
      failNextRead(n) { failReads = Math.max(0, Math.floor(Number(n) || 0)); },
      failsLeft: () => failReads,
      // 판 끝 보고: 말이 되는 기록만 조용히 받아 적는다(연승 1~200 · 번호표를 준 뒤 흐른 시간이 연승 수에 맞음 · 반응 0.100~0.600초)
      endRound(ticket, record) {
        if (!account() || !ticket) return Promise.resolve({ ok: false });
        const elapsed = clock() - ticket.t;
        return later(() => {
          const acc = account();
          if (!acc) return { ok: false };
          const streakNow = Math.floor(Number(record && record.streak)), ms = Math.floor(Number(record && record.reactMs));
          if (!(streakNow >= 1 && streakNow <= 200) || elapsed < (streakNow - 1) * 1500 - 1) return { ok: false };
          const put = (metric, v) => {
            const s = acc.bests[metric] || (acc.bests[metric] = {});
            if (s.day !== dayKey()) { s.day = dayKey(); s.today = null; }
            if (!s.all || better(metric, v, s.all.v)) s.all = { v, at: Date.now() };
            if (!s.today || better(metric, v, s.today.v)) s.today = { v, at: Date.now() };
          };
          put('streak', streakNow);
          if (ms >= 100 && ms <= 600) put('react', ms);
          save();
          return { ok: true };
        });
      },
      read: (metric, period) => later(() => {
        if (failReads > 0) { failReads -= 1; throw new Error('read failed'); }
        return buildBoard(metric, period);
      }),
      peek: (metric, period) => buildBoard(metric, period),   // 검사용: 기다리지 않고 바로 읽기
      linkGoogle() {
        return later(() => {
          const acc = account();
          if (!acc) return { ok: false };
          server.accounts.forEach((a) => { a.google = false; });
          acc.google = true; save();
          return { ok: true };
        }, 600);
      },
      unlinkGoogle() { return later(() => { const acc = account(); if (acc) { acc.google = false; save(); } return { ok: true }; }); },
      resetAll() { wipeSim(); device = { pid: null }; server = { seq: 0, accounts: [] }; },
    };
  }());
  Board.setClock(now);

  /* ---------- 진짜 게임의 소리 칸을 건드리지 않기 ----------
     소리 덩어리는 여러 게임이 함께 쓰는 칸에 고른 소리를 적는다. 시뮬레이션에서 소리를 바꿔도 그 칸은 원래 값으로 돌려놓고, 시뮬레이션 칸에 따로 적는다 */
  const REAL_SOUND_KEY = 'hold-on-keys-sound', SIM_SOUND_KEY = LB_PREFIX + 'sound';
  function keepRealSound(work) {
    let had = null, can = true;
    try { had = localStorage.getItem(REAL_SOUND_KEY); } catch (e) { can = false; }
    const out = work();
    if (can) { try { if (had === null) localStorage.removeItem(REAL_SOUND_KEY); else localStorage.setItem(REAL_SOUND_KEY, had); } catch (e) { /* 그대로 */ } }
    saveRaw(SIM_SOUND_KEY, KeySound.index);
    return out;
  }
  (() => { const i = loadInt(SIM_SOUND_KEY); if (i !== null) keepRealSound(() => KeySound.set(i)); })();

  /* ---------- 화면 요소 · 상태 ---------- */
  const lb = {
    top: document.getElementById('topRow'),
    meBtn: document.getElementById('meBtn'), meText: document.getElementById('meBtnText'),
    rankBtn: document.getElementById('rankBtn'), rankText: document.getElementById('rankBtnText'),
    page: document.getElementById('lbPage'),
    acWrap: document.getElementById('acWrap'), acCard: document.getElementById('acCard'),
  };
  // 앱 안 브라우저(인스타 · 카톡 등에서 링크를 누르면 뜨는 창): 구글 로그인이 막혀 있다. 주소에 ?inapp=1 을 붙여도 그 모습을 볼 수 있다
  const IN_APP = LB_QUERY.get('inapp') === '1' || /Instagram|KAKAOTALK|FBAN|FBAV|Line\/|NAVER\(inapp|; wv\)/.test(navigator.userAgent || '');
  const PAGE_ROWS = 50;  // 순위 줄을 한 번에 그리는 수(「더 보기」마다 이만큼 더)
  const UI = {
    open: false,         // 순위 화면(넓은 화면)이 떠 있는지
    tab: 'rank',         // 순위 화면에서 고른 탭: rank 순위 · mine 내 기록
    acct: false,         // 계정 창(카드)이 떠 있는지 — 순위 화면과 동시에 뜨지 않는다
    first: false,        // 그 계정 창이 「첫 방문 모양」(안내 두 줄 + 시작 버튼)인지
    mode: null,          // 계정 창에서 펼쳐 둔 곳: rename 이름 바꾸기 · inapp 앱 안 브라우저 안내(없으면 null)
    metric: 'streak',    // 종목: streak 연승 · react 반응
    period: 'today',     // 기간: today 오늘 · all 전체
    shown: PAGE_ROWS,    // 지금 그려 둔 순위 줄 수
    status: 'idle',      // idle · loading 불러오는 중 · ok · fail 연결 안 됨
    data: null, dataId: 0, cache: {}, seq: 0,
    recs: null,          // 내 기록 탭: 결투 기록과 순위 { streak, react, ok } — 불러오는 중이면 null
    gate: 0,             // 계정 창을 여닫을 때마다 올라가는 번호(닫은 뒤 · 닫았다 다시 연 뒤에 온 늦은 대답을 버리려고)
    gen: 0,              // 받아 둔 순위표를 버릴 때마다 올라가는 번호(버리기 전에 떠난 요청의 대답을 다시 넣지 않으려고)
    msg: '', busy: false, copied: false,

  let pageBuilt = null, listBuilt = null, listShown = 0;

  // 문지기에게 부탁하고 대답을 기다린다(그동안 계정 창 안 버튼은 잠긴다).

  // 순위 화면 안 버튼

    if (UI.tab === 'rank') {
      // 묶음 버튼: 지금 고른 것을 다시 눌러도 된다(받아 둔 것이 30초를 넘었으면 다시 불러온다)

  // 화면이 떠 있는 동안의 키보드: Esc = 닫기(한 겹), 입력칸에서 Enter = 「확인」
